body:
  text: 薛氏醫案卷五十一明薛已訂錢氏小兒直訣二吐㵼兼變症治五月二十五日已後吐㵼壯熱此臟腑中九分熱也傷熱乳食吐而不消瀉色深黃玉露散主之六月十五日已後吐㵼身溫臟腑六分冷也嘔吐乳食不消瀉色黃白口乾作渴者食前少服益黃散食後多服玉露散七月七日已後吐㵼身涼三分熱七分冷也不乳多睡悶亂哽氣出氣睡卧露睛唇白多噦亦用益黃玉露二散主之八月十五日已後吐㵼身冷不乳乾噦㵼青褐水無陽也當用益黃散吐㵼乳食不化時時下痢肌肉消瘦此脾胃虛寒也用木香丸夏月不可服如有冷症則少服之其身溫壯熱或㵼痢紅黃赤黑此脾胃實熱也用黃連丸冬月不可服如有熱症則少服之薛按前法即內經用寒逺寒用熱逺熱之本旨又云有假者反之雖違其時以從其症蓋胃傷則嘔吐脾傷則泄㵼脾胃俱傷則吐瀉並作前症若傷辛熱停滯嘔吐或大便下痢者用六君子加黃連吳茱萸木香若停滯已去泄㵼不已用四君子加肉蔲骨脂若傷生冷腹痛瀉痢青白用六君子加砂仁木香炮薑若傷魚肉等物用六君子加山查砂仁若㵼紅黃赤黑諸臟皆熱也先用香連丸後用補中益氣湯送香連丸若㵼痢青白乳食不化者用人參理中丸若吐瀉昏睡而露睛者用五味異攻散睡而不露睛者用玉露散若吐而手足俱熱或喜冷飲食或睡不露睛者用㵼黃散或手足冷或惡冷飲食或睡而露睛者用六君子木香然木香黃連二丸雖能攻尅病邪不無傷損脾胃治者審之五太尉患吐㵼米穀不化時六月或用溫補之藥更加嘔吐此熱傷胃也當用石膏湯解之不信又服丁香散師曰三日外必腹滿身熱飲水吐逆果如所言遂用白虎湯三服後以白餅子下之又與白虎石膏二湯各一服而愈七太尉七月病吐㵼不食昏睡覺而悶亂哽氣乾嘔不渴衆作驚治師以為脾虛先用史君子丸以補脾後用石膏湯以退熱次日以水銀硫黃末一字薑水調下間用溫補脾胃而愈馮承務子五歲吐㵼壯熱不思飲食目睛多白面色無神師曰此腎經虛弱下之則愈虛遂以消積丸磨之漸愈大凡傷食不下則成癖下後即與補脾無不效者愚治一小兒白睛多唇色白七月間停食吐㵼困睡驚悸久治不愈余曰驚悸心血虛怯也困睡脾氣虛弱也乃因稟賦不足所致耳用補中益氣湯及六味丸加鹿茸治之而愈一小兒盛暑吐瀉米穀不化或用黃連香薷飲類腹脹作痛手足並冷此脾氣虛而伏隂在內也用五味異功散加木香治之而愈先君嘗云凡暑令吐㵼手足發熱作渴飲冷者屬陽症宜清涼之劑若手足並冷作渴飲湯者屬陰症宜溫補之劑故大人屬陰者誤用寒涼之藥死後手足青黯甚則遍身皆然於此可驗若吐乳瀉黃傷熱乳也吐乳瀉青傷冷乳也皆當下之吐瀉昏倦睡不露睛者胃實熱也吐痰涎及緑水者胃虛冷也薛按前症若兒自受驚或乳母恚怒致兒吐㵼青色者宜用異功散加柴胡若母食厚味而乳熱者用東垣清胃散母飲酒而乳熱者用葛花解酲湯子服一二匙若飲燒酒而乳熱或子母身赤或昏憒服冷米醋三五杯多亦無妨兒服一二匙若母停滯生冷而乳冷者母服養胃湯子服調中丸若母停滯而變熱乳者母服大安丸子服五味異功散若母鬱怒傷肝脾而乳熱者用歸脾湯逍遙散若母脾虛血弱而乳熱者用六君子加芎歸若母氣血虛而乳熱者子母俱服八珍散若母勞役發熱而乳熱者子母俱服補中益氣湯若因怒動肝火而乳熱者用五味異功散加柴胡山梔其吐痰涎及白緑水者肝木乘脾土之虛寒症也用六君子加柴胡木香大凡吐乳瀉青色者屬驚法當平肝補脾吐㵼青白色者屬寒法當溫補脾土前諸症若手足指熱者屬實手足指冷者屬虛此亦驗法也愚治一小兒每飲食失節或外驚所忤即吐㵼發搐服鎮驚化痰等藥而愈後發搐益甚飲食不進雖參术之劑到口即嘔余用白术和土炒黃用米泔煎數沸不時灌半匙仍嘔次日灌之微嘔再日灌之欲嘔此後每服二三匙漸加至半杯不嘔乃濃煎服而愈一小兒停食吐㵼後身熱作渴㵼下紅白或青黑服黃連丸之類將愈而復熱手足指却冷余謂始為實熱終為虛寒用補中益氣湯加木香肉果治之而愈一小兒傷食吐㵼不已㵼色青緑或溏白睡而露睛手足指冷額黑唇青余謂㵼痢青緑肝勝脾土也或時溏白脾土虛寒也額黑唇青寒水侮土也悉屬中氣虛寒用五味異功散加升麻柴胡木香附子一劑而愈一小兒傷食嘔吐發熱面赤服消導之劑飲食已消熱赤未退余以為胃經虛熱用六君子加升麻柴胡各二分四劑而愈一小兒目睛緩視大便臭穢乃飲交感時乳所致用四君子加木香藿香治之而安一小兒吐酸乳食用四君吳茱黃連木香補脾平肝而愈後口中有酸水仍用前藥隨愈後唾苦水口中味苦用龍膽湯清肝火佐以四君子以補脾土乃瘥一小兒吐黃水或口甘所食之物悉皆甘味用㵼黃散愈後停乳食服剋伐之藥口甘不食形氣殊弱用補中益氣湯而愈初生十日內吐㵼壯熱不乳或乳不消或白色先用白餅子下之後用益黃散和之初生下吐因穢惡下咽故也用木瓜散主之凡初生急須拭淨口中否則啼聲一發穢物咽下致生諸病薛按芽兒初生之患多因乳母不慎七情不節厚味傳兒為病當審其因以調治其母前所用之藥恐臟腑脆嫩不能勝受治者審之咳嗽兼變症治附喘嗽治驗夫嗽者肺感微寒之症也八九月間肺氣大旺咳嗽面赤痰盛身熱當以葶􅐗丸下之若久病不可下也十一月十二月嗽者乃傷風嗽也風從背脊第三椎肺俞穴而入當以麻黃湯汗之有熱症面赤飲水咽喉不利者兼用甘桔湯治之若五七月間身熱甚唾粘者以褊銀丸下之若無熱症而但嗽者以葶􅐗丸主之後用化痰藥咳而後喘面腫者肺火盛也用瀉白散瀉之咳而哽氣喉中有聲或嗽久肺亡津液者皆肺虛也並用消膠散補之痰盛者先實脾土後用褊銀丸微下涎退即補肺嗽而吐青緑水者百祥丸下之嗽而吐痰涎乳食者白餅子下之嗽而咯膿血者甘桔湯主之嗽而痰實面赤飲水者褊銀丸下之治初嗽下之久則補之更量虛實以意增損薛按前症或兒自因腠理不密外邪內藴或因乳母七情厚味鬱熱若風邪外傷者用麻黃湯表散鬱熱內藴者用葶􅐗丸疏導鼻流清涕或頭痛聲重者用參蘇飲散之更用四君子以固肺氣若心火刑肺用人參平肺散以清肺金用六味地黃丸以滋腎水若嗽而吐青緑水者用六君子加柴胡桔梗平肝補脾若嗽而吐痰乳者用六君子加桔梗補土生金若嗽而吐膿血者用桔梗湯排膿理肺潔古先生云嗽而兩脅痛肝火侮肺也用小柴胡湯嗽而嘔苦水膽汁溢上也用黃芩半夏生薑湯嗽而喉中作梗心火刑金也用甘桔湯嗽而下氣小腸失約也用芍藥甘草湯嗽而喘急風邪傷肺也用麻黃湯嗽而嘔長蟲胃氣虛也用烏梅丸嗽而痰涎壅盛風傷脾也用升麻湯嗽而遺屎大腸氣虛也用赤石脂禹餘糧湯不止豬苓湯嗽而腰背痛痛甚則咳涎風邪傷腎也用麻黃附子細辛湯嗽而遺尿膀胱氣虛也用茯苓甘草湯嗽而腹滿而腫不食脾虛氣逆也用五味異功散丹溪先生云上半日嗽者腎中隂火也大抵咳嗽之症多因肺氣虛腠理不密外邪所乘若風中於衛則呼氣不出熱至於榮則吸氣不入風熱相搏血氣稽留於肺若寸口脈數而虛為肺痿脈數而實為肺疽此因汗下過度重亡津液所致其麻黃湯乃發汗解表之劑葶􅐗丸乃內疏通利之劑白餅子亦疏利之劑審有是症方可暫用之苟泛投施治重亡津液必致敗症杜氏子五歲仲冬咳嗽吐痰此風寒傷肺也用麻黃丸以㵼肺後用阿膠散以實肺如此者三其病愈虛師曰㵼肝而肝病不退補肺而肺病猶存無能為矣果大喘而殁李運使孫八歲咳嗽胸滿短氣或謂肺經有熱用竹葉湯牛黃膏各二服三日加喘師曰此肺氣虛而寒邪所乘用補脾肺之藥而愈蓋竹葉牛黃治心藥也用以治肺誤矣張氏孫九歲喘嗽悶亂飲水不止食不能下或用涼藥月許無效師曰此涼藥寒胃也以益胃散補脾土以瀉白散㵼肺金而愈段齋郎子四歲病嗽身熱吐痰數日咯血或用甘桔湯防已丸其涎上攻吐喘不止用褊銀丸一服下之復以補肺散治之或曰症屬肺虛何以下師曰肺經咯血而有熱故也况痰實上攻亦使發搐故宜先下其痰隨補脾肺而愈愚治一小兒停食服剋伐之藥唾痰腥氣面赤氣喘此復傷肺氣內亡津液而變肺癰也不信已而果唾膿用桔梗湯痰膿頓止其喘益甚余謂因脾虛不能生肺而然也用五味異攻散加杏仁薏苡仁百合治之而愈後小便澀滯誤服八正散二劑小便愈澀咳嗽吐痰面赤盜汗此前藥復損腎氣虛火爍肺而為患耳余用五味異功散調補脾土用地黃丸滋養腎水而痊愚治一小兒感冒咳嗽發散過度喘促不食痰中有血用桔梗湯愈後因元氣未復大便似痢或用五苓散黃連枳實之類痰喘目劄四肢抽搐變慢脾風而殁一小兒傷風咳嗽發熱服解表之劑加喘促出汗余以為脾肺氣虛欲用補中益氣湯加五味子補之不信乃服二陳桑杏桔梗枳殼前症益甚又加發搐痰湧余仍用前藥更加鈎藤鈎而痊一小兒母有哮病因勞即發兒飲其乳亦嗽用六君子加桔梗桑杏治其母子常服數滴而愈大凡乳下嬰兒有疾必調治其母為善一小兒傷食發熱抽搐嘔吐氣喘痰嗽屬脾肺氣虛而有熱以六君子加炒黑黃連山梔各二分一劑頓安一小兒咳嗽因其母素食膏粱炙煿所致用東垣清胃散而愈後其母因怒咳嗽脅痛其子亦然母服小柴胡湯其子亦愈一小兒傷風咳嗽或行表散化痰反加痰盛肚腹膨脹面色㿠白余謂此因脾肺氣虛而復傷用六君子加桔梗一劑頓愈三日後仍嗽鼻流清涕此復傷風寒而作仍用前藥加桑皮杏仁而愈一小兒咳嗽痰涎上湧服清氣化痰藥反五更痰嗽余以為脾虛食積為痰也用六君子加神麯山查桔梗而愈若因痰積而咳嗽者但健脾消食其痰自化若用剋滯之劑中氣愈虛其痰愈盛一小兒喘嗽胸腹膨脹泄㵼不食此因飲食傷脾而不能生肺也用六君子湯一劑而愈一小兒痰涎上湧則咳嗽面色黃白服清肺之藥不應服下痰之藥益甚余曰面色痿黃乃脾虛不能化食而為痰也令節飲食用六君子湯而痊大抵因嗽而生痰者當治其肺因痰而致嗽者當理其脾薛氏醫案卷五十一
