body:
  text: 薛氏醫案卷二十七明薛已訂婦人良方婦人中風諸症方論第一夫中風者因內虛而中之也蓋風為四時八方之氣常以冬至之日自坎而起從其鄉來者主長養萬物否則名為虛風賊害萬物從背而入或中腑或中臟或中血脉經絡其症或肢體不遂或手足偏枯或痰涎壅塞或口眼歪斜或牙關緊急或腰背反張若眼開口閉涎流失音者難治如眼閉口開鼾睡遺尿者死中風中氣皆用蘇合香丸中氣用三生飲若作風治百無一生愚按中風者即內經所謂偏枯風痱風懿風痺是也而有中腑中臟中血脉之分焉夫中腑者為在表中臟者為在裏中血脉者為在中在表者宜微汗在裏者宜微下在中者宜調榮中腑者多著四肢如手足拘急不仁惡風寒此數者病淺皆易治用加减續命湯之類中臟者多滯九竅如眼瞀者中于肝舌不能言者中于心唇緩便祕者中于脾鼻塞者中于肺耳聾者中于腎此數者病深多難治中血脉者外無六經之證內無便溺之阻肢不能舉口不能言用大秦芁湯主之中腑者多兼中臟如左關脉浮弦面目青左脅偏痛筋脉拘急日瞤頭目眩手足不收坐踞不得此中膽兼中肝也用犀角散之類如左寸脉浮洪面舌赤汗多惡風心神顛倒言語蹇澀舌强口乾忪悸恍惚此中小腸兼中心也用麻黃散之類如右關脉浮緩或浮大面唇黃汗多惡風口喎語澀身重怠惰嗜卧䏎膚不仁皮肉瞤動腹膨不食此中胃兼中脾也用防風散之類如右寸脉浮澀而短面色白鼻流清涕多喘胸中冒悶短氣自汗聲嘶四肢痿弱此中大腸兼中肺也用五味子湯之類如左尺脉浮滑面目黧黑腰脊痛引小腹不能俯仰兩耳虛鳴骨節疼痛足痿善恐此中膀胱兼中腎也用獨活散之類此皆言真中風也而有氣血之分焉蓋氣虛而中者由元氣虛而賊風襲之則右手足不仁用六君子湯加釣藤薑汁竹􅅹血虛而中者由隂血虛而賊風襲之則左手足不仁用四物湯加釣藤竹􅅹薑汁氣血俱虛而中者則左右手足皆不仁也用八珍湯加釣藤薑汁竹瀝其與中風相類者則有中寒中濕中火中氣食厥勞傷房勞等症如中於寒者謂冬月卒中寒氣昏冒口噤肢攣惡寒脉浮緊用麻黃桂枝理中湯之類中於暑者謂夏月卒冒炎暑昏冒痿厥吐瀉喘滿用十味香薷飲之類中於濕者丹溪所謂東南之人多因濕土生痰痰生熱熱生風也用清燥湯之類加竹瀝薑汁中於火者河間所謂非肝木之風內中六淫之邪外侵良由五志過極火盛水衰熱氣怫鬱昏冒而卒仆也用六味丸四君子獨參湯之類內有恚怒傷肝火動上炎者用柴胡湯之類中於氣者由七情過極氣厥昏冒或牙關緊急用蘇合香丸之類誤作風治者死食厥者過於飲食胃氣自傷不能運化故昏冒也用六君子加木香勞傷者過於勞役耗損元氣脾胃虛衰不任風寒故昏冒也用補中益氣湯房勞者因腎虛精耗氣不歸源故昏冒也用六味丸此皆類中風者也夫內經主於風河間主於火東垣主於氣丹溪主於濕愚之斯論僭補前人之闕也若夫地之南北人之虛實固有不同其男子女人大略相似當與後論參看通變治之附治驗靳閣老夫人先胸脅脹痛後四肢不收自汗如水小便自遺大便不實口緊目瞤飲食頗進十餘日矣或以為中臟公甚憂余曰非也若風既中臟真氣既脫惡症既見禍在反掌焉能延之乃候其色面目俱赤而面或青診其脉左三部洪數惟肝尤甚余曰胸乳脹痛肝經血虛肝氣否塞也四肢不收肝經血虛不能養筋也自汗不止肝經風熱津液妄泄也小便自遺肝經熱甚隂挺失職也大便不實肝木熾盛尅脾土也遂用犀角散四劑諸症頓愈又用加味逍遙散調理而安後因鬱怒前症復作兼發熱嘔吐飲食少思月經不止此木盛尅土而脾不能攝血也用加味歸脾湯為主佐以加味逍遙散調補肝脾之氣清和肝脾之血而愈後每遇怒或睡中手足抽搐復用前藥即愈大參朱雲溪母於九月內忽仆地痰昧不省人事唇口喎斜左目緊小或用痰血之劑其勢稍緩至次年四月初其病復作仍進前藥勢亦漸緩至六月終病乃大作小便自遺或謂風中於臟以為不治余診之左關弦洪而數此屬肝火血燥也遂用六味丸加五味麥門芎歸一劑而飲食頓進小便頓調隨用補中益氣加茯苓山梔釣藤丹皮而安至十月復以傷食腹痛作瀉左目仍小兩關尺脉弦洪鼓指豫以六君加木香吳茱升麻柴胡一劑而痛瀉俱緩復以六君加肉果故紙一劑諸脉頓平痛瀉俱止余謂左關弦洪由肝火血燥故左目緊小右關弦洪由肝邪乘脾故唇口喎斜腹痛作瀉二尺鼓指由元氣下陷設以目緊口喎誤作風中投以風藥以腹痛泄瀉誤作積滯投以峻劑復耗元氣為害甚矣後以陽虛惡寒圍火過熱致痰喘誤服寒劑而卒一婦人因怒仆地語言蹇澀口眼喎斜四肢拘急汗出遺尿六脉洪大肝脉尤甚者由肝火熾盛蓋肝主小便因熱甚而自遺也用加味逍遙散加釣藤及六味丸尋愈一老婦兩臂不遂語言蹇澀服袪風之藥反致筋攣骨痛余謂此肝火血虛所致用八珍湯補氣血用地黃丸補腎水佐以排風湯年餘而愈一婦人經行口眼歪斜痰涎壅盛此血虛而肝火動用加味逍遙散加牡丹皮治之尋愈後因飲食停滯日吐痰涎此脾氣虛不能攝涎歸經也用六君子二十餘劑而安一婦人因怒口眼歪斜痰涎上湧口噤發搐此脾肺氣虛而肝木旺用六君子加木香釣藤柴胡治之漸愈又用加味歸脾湯調理而安一産婦勤於女工忽仆地牙關緊急痰喘氣粗四肢不遂此氣血虛而發痙朝用補中益氣湯加茯苓半夏夕用八珍湯加半夏各三十餘劑不應此血氣之未復藥之未及也仍用前二湯又五十餘劑尋愈一婦人素有內熱月經不調經行後四肢不能伸卧床半載或用風濕痰火之劑不效其脉浮緩按之則澀名曰瘈症屬風寒所乘用加味逍遙散加肉桂防風四劑頓愈更以八珍湯調理兩月餘而瘥一婦人素經行後期因勞怒四肢不能屈名曰瘲症此血虛而風熱所乘先用八珍湯加釣藤柴胡漸愈更佐以加味逍遙散調理而痊一婦人四肢攣屈煩痛自汗小便短少畏見風寒脉浮弦緩此氣血虛而風寒濕熱相摶先用東垣清燥湯漸愈再用加味逍遙散及八珍湯加牡丹皮而痊一婦人素有火忽然昏瞶瘈瘲抽搐善伸數缺四肢筋攣痰涎上升此肺金燥甚血液衰少而然也用清燥湯六味丸兼服尋愈一婦人肢節作痛不能轉側惡見風寒自汗盜汗小便短少雖夏亦不必表其脉浮緊此風寒客於太陽經用甘草附子湯一劑而瘥一婦人因怒發搐嘔吐痰涎口禁昏憒氣口脉大於人迎此氣滯而食厥用平胃散加茯苓半夏木香治之而蘇更以六君子加木香漸愈乃去木香又二十餘劑而痊一婦人元氣素虛勞則體麻發熱痰氣上攻或用烏藥順氣散袪風化痰丸之類肢體痿軟痰涎自出面色痿黃形體倦怠而脾肺二脉虛甚此氣虛而類風朝用補中益氣湯夕用十全大補湯漸愈又用加味歸脾湯調理尋愈一婦人體肥胖頭目眩暈肢體麻木腿足痿軟自汗身重其脉滑數按之沈緩此濕熱乘虛也用青燥羌活二湯漸愈更佐以加味逍遙散全愈一婦人口眼歪斜四肢拘急痰涎不利而惡風寒其脉浮緊此風寒客於手足陽明二經先用省風湯二劑後用秦芁升麻湯而愈一婦人素性急患肝風之症常服搜風順氣丸秦芁湯之類後大怒吐血唇口牽緊小便頻數或時自遺余以為肝火旺而血妄行遂用小柴胡湯加山梔牡丹皮漸愈五年之後又大怒吐血誤服降火袪風化痰之劑大便頻數胸滿少食用清氣化痰之劑嘔而不食頭暈口乾不時吐痰用導痰降火之類痰出加湧四肢常冷余曰嘔而不食胃氣虛弱也頭暈口乾中氣不能上升也痰出如湧脾氣不能攝涎也四肢逆冷脾氣不能運行也用補中益氣加茯苓半夏治之諸症漸愈又用加味歸脾湯兼服而安鴻臚王繼之室人素有癎症遇勞役怒氣則發良久自省一日因飲食勞役失宜發而半日方省不能言語或以為風中於臟用袪風化痰順氣之劑及牛黃清心丸病益甚六脉浮大兩寸虛而不及本部且進飲食余曰此脾胃之氣傷也若風中於臟禍在反掌彼不信仍用風藥後果卒婦人吐痰頭暈肢體麻木見第四卷娠婦發搐似中風見第十四卷産後發痙似中風見第十九卷男子諸症見內科摘要排風湯治風邪入臟狂言妄語白鮮皮白术白芍藥桂心川芎當歸防風杏仁去皮尖炒甘草各二兩白茯苓麻黃去節獨活各三兩三生飲治卒中不省口眼喎斜痰壅喉響無問外感內傷痰涎食厥氣虛眩暈但六脉沈悉有神效生南星生烏頭去皮尖生附子各半兩去皮木香一錢右每服半兩薑水煎不省人事以細辛皂角末少許吹鼻中得嚏進藥氣盛只用南星五錢生薑十四片煎飲之名星薑飲愚按三生飲乃行經絡治寒痰之良藥斬關奪旗之神劑每服必用人參兩許驅其外邪而補其真氣否則不惟無益適以取敗觀先哲用芪附术附等湯其義可見加减小續命湯治中風半身不遂口眼喎斜手足戰掉語言蹇澀神思昏亂筋攣骨痛或腳氣緩弱隂晦復作麻黃去節根防已人參黃芩炒桂心甘草炒白芍藥川芎杏仁各一兩附子炮半兩防風一兩半右每服五錢薑棗水煎精神恍惚加茯苓逺志有熱去附子加芍藥心煩加犀角半兩骨冷痛加桂附嘔逆腹脹加人參半夏一兩躁悶便澀去附子加芍藥一兩竹瀝一合臟寒下利去防已黃芩加附子白术一兩自汗去麻黃杏仁加白术一兩腳弱加牛膝石斛一兩身痛加秦芁一兩腰痛加杏仁杜仲半兩失音加杏仁一兩小引風湯防風獨活細辛川芎五味子杵炒白茯苓人參白芍藥炒白术炒甘草等分右每服五錢薑三片杏仁五箇水煎服加麻黃蓯蓉附子當歸羚羊角等分即大引風湯也必效竹湯治中風痰涎壅盛言語塞滯四肢緩縱秦芁防風獨活附子炮各一錢右以水二盞煎半盞入生地汁淡竹􅅹各半盞再煎四五沸作四服病既去以他藥調治未愈再服最效星香湯治中風痰盛服熱藥不得者南星木香等分右每服四錢薑十片水煎星附湯治中風痰涎上攻六脉沈伏不知人事附子生用南星生用各一兩木香半兩右每服四錢薑水煎寒甚加天雄川烏多灸關元丹田二穴附方三化湯治中風外有六經之形症先以加减續命湯治內有便溺之阻隔者此方主之厚朴薑汁炒大黃酒蒸枳實麩炒羌活各八兩右每服一兩水煎秦芁湯治中風外無六經之形症內無便溺之阻隔乃血弱不能養於筋手足不能運口强不能言宜養血而筋自榮也秦芁石膏各二兩甘草炒川芎當歸芍藥炒羌活獨活防風黃芩炒白芷生地黃熟地黃自製白茯苓白术各一兩細辛半兩右每服一兩水煎隂雨加生薑七片春夏加知母一兩省風湯治中風口噤口眼喎斜筋脉攣急抽掣疼痛風熱痰實防風南星生用各四兩半夏水浸洗生用黃芩甘草生用各二兩右每服五錢水煎大八風湯方見後燒竹􅅹法用新竹截尺許作兩片用兩磚對立竹仰磚上中以火燒之兩頭自出取荆亦然烏藥順氣散治風氣骨節疼痛遍身頑麻手足癱瘓言語蹇澀宜先疏氣道後隨證投藥麻黃去節烏藥陳皮去白川芎白芷桔梗枳殼去穰麩炒甘草炒各一兩乾薑炮半兩殭𧖟炒一兩右每服五錢薑水煎頭痛加葱白有汗加薄荷八味順氣散白术白茯苓青皮白芷陳皮炒烏藥人參各一兩甘草炙半兩右每服五錢水煎導痰湯半夏南星茯苓陳皮炒枳實炒甘草炒右薑水煎服參蘇飲治痰積中脘暈眩嘈雜怔忡􅎪逆或痰停關節手足嚲曳口眼喎斜半身不遂嘔吐惡心頭疼發熱人參紫蘇葉半夏茯苓乾葛前胡各三錢甘草炒木香陳皮炒枳殼製桔梗各半兩右每服一兩薑水煎腹痛加芍