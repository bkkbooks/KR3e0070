body:
  text: 薛氏醫案卷四明薛巳撰女科撮要保胎妊娠若元氣不實發熱倦怠或胎動不安用當歸散因氣惱加枳殼胸膈痞悶再加蘇梗或作痛加柴胡若飲食不甘或欲嘔吐用六君加紫蘇枳殼若惡阻嘔逆頭暈體倦用參橘散未應用六君子湯若惡阻嘔吐不食煩悶亦用參橘散之類若頓仆胎動腹痛下血用膠艾湯未應用八珍加膠艾若頓仆毒藥腰痛短氣用阿膠散未應煎送知母丸若頓仆胎傷下血腹痛用佛手散未應用八珍送知母丸若心驚膽怯煩悶不安名子煩用竹葉湯未應血虛佐以四物氣虛佐以四君若下血不止名胎漏血虛用二黃散血去多用八珍湯未應用補中益氣湯若因事而動下血用枳殼湯加生熟地黃未應或作痛更加當歸血不止八珍加膠艾若不時作痛若小腹重墜名胎痛用地黃當歸湯未應加參术陳皮或因脾氣虛用補中益氣湯若面目虛浮肢體如水氣名子腫用全生白术散未應用六君子湯下部腫甚用補中益氣倍加茯苓或因飲食失宜嘔吐泄瀉此是脾胃虧損用六君子湯若足指發腫漸至腿膝喘悶不安或足指縫出水作嘔少食余謂寒熱頭痛肝火上衝也脅脹腹痛肝氣不行也作嘔少食肝侮脾胃也小便見血肝火血熱也用小柴胡加芍藥炒黑山梔茯苓白术而愈一妊娠六月體倦食少勞役見血用六君加當歸熟地升麻柴胡而愈一妊娠每三四月胎便作痛余用地黃當歸湯治之不日而愈一妊娠三月飲食後因怒患瘧連吐三次用藿香正氣散二劑隨用安胎飲一劑而愈後因怒痰甚狂言發熱胸脹手按少得此肝脾氣滯用加味逍遙散加川芎二劑頓退四劑而安一婦人每怒發熱脅脹小便淋澀每月經行旬餘未已受胎三月因怒前症復作朝用加味逍遙散夕用安胎飲各二劑而安五月又怒復作下血如經行四日未止仍用前藥而愈一妊娠將三月嘔吐惡食體倦嗜卧此惡阻之症用人參橘皮湯二劑漸愈又用六君加紫蘇二劑而安一妊娠吞酸惡心欲作嘔吐此飲食停滯用六君加麯蘖炒黑子芩枳殼香附治之而愈一妊娠飲食後惱怒寒熱嘔吐頭痛惡寒胸腹脹痛大便不實而色青小便頻數而有血余曰當清肝健脾為主不信乃主安胎止血益甚問余曰何也余曰大便不實而或青此是飲食既傷脾土而兼木侮小便頻數而有血此是肝火血流於胞而兼挺痿也用六君子加枳殼紫蘇山梔二劑脾胃頓醒又用加味逍遙散加紫蘇枳殼二劑小便頓清更節飲食調理而安一妊娠每至五月肢體倦怠飲食無味先兩足腫漸至遍身後及頭面此是脾肺氣虛朝用補中益氣夕用六君子加蘇梗而愈凡治妊娠毋泥其月數但見某經症便用某藥為善一妊娠因怒吐血塊四日不止兩脅脹痛小便淋澀此怒而血蓄于上部火炎而隨出也脅脹腹痛小便淋澀肝經本病也用小柴胡合四物四劑而止却用六君子安胎飲調理而安一妊娠氣喘痰甚諸藥不應問治於余詢之云素有帶下始於目下浮兩月餘其面亦然此氣血有痰飲也用六味丸料數劑而愈凡婦人氣血方盛乳房作脹或無兒飲痛脹寒熱用麥芽二三兩炒熟水煎服立消其耗散血氣如此何脾胃虛弱飲食不消方中多用之一云麥芽最消腎若氣血虛而乳汁自出者宜十全大補湯其子多不育小産小産重於大産蓋大産如栗熟自脫小産如生採破其皮殼斷其根蒂豈不重於大産但人輕忽致死者多矣治法宜補形氣生新血去瘀血若未足月痛而欲産芎歸補中湯倍加知母止之若産而血不止人參黃茋湯補之若産而心腹痛當歸川芎湯主之胎氣弱而小産者八珍湯固之若熱血過多而發熱聖愈湯汗不止急用獨參湯發熱燥躁肉瞤筋惕八珍湯大渴面赤脈洪而虛當歸補血湯身熱面赤脈沈而微四君薑附東垣云晝發熱而夜安靜是陽氣自旺於陽分也晝安靜而夜發熱躁是陽氣下陷於隂中也如晝夜俱發熱者是重陽無隂也當峻補其隂王太㒒云如大寒而甚熱之不熱是無火也熱來復去晝見夜伏夜發晝止時節而動是無火也如大熱而甚寒之不寒是無水也熱動復止倐忽往來時動時止是無水也若陽氣自旺者補中益氣湯陽氣陷于隂者四物二連湯重陽無隂者四物湯無火者八味丸無水者六味丸治驗一妊娠五月服剪紅丸而墮腹中脹痛服破血之劑益甚以手按之益痛余曰此峻藥重傷脾胃受患用八珍倍人參黃茋半夏乳香沒藥二劑而痛止數劑而全愈吳江庠友史萬湖仲子室年二十餘疫疾墮胎時咳服清肺解表喘急不寐請治余以為脾土虛不能生肺金藥損益甚先興補中益氣加茯苓半夏五味炮薑四劑漸愈往視之又與八珍加五味及十全大補湯全愈大兒婦張氏素怯弱嘉靖癸卯四月生女自乳中患疥瘡年餘不愈遂致羸困甲辰五月遭先母大故以姑病勉強代執喪禮旬月每欲眩仆一日感氣忽患心脾高腫作疼手不可按而嘔吐不止六脈微細之極余以為脈雖虛而病形則實誤認諸痛不可補氣乃用青皮香附吳茱等藥而愈繼復患瘧且墮胎又投理氣行血之藥病去元氣轉脫再投參茋補劑不應矣六脈如絲欲絶思非附子不能救非立翁不能投迎翁至診云皆理氣之劑真損之誤也連投參茋歸术附子薑桂六劑間用八味丸五日眠食漸甘六脈全復翁云心脾疼痛時即當服此等藥瘧亦不作矣姑婦皆翁再造敢述奇功附於此門之尾以為初知藥性者之戒制生陳遜稽顙謹識保産妊娠欲産之時但覺腹內轉動即當正身仰卧待兒轉身向下時作痛試揑産母手中指中節或末節跳動方與臨盆即産矣若初覺不仰卧以待轉胞或未産而水頻下此胞衣已破血水先乾必有逆生難産之患若橫生者兒先露手臂令母正卧以手徐推兒臂下體令其正直復以中指摩其肩勿令臍帶攀係即生逆生者兒先露足令母正卧以手徐推其足仍推兒轉正即生偏生者兒頭偏在一邊亦照前法徐正其頭即生或兒頭後骨偏在谷道旁徐推近上即生礙産者兒頭雖正但不能下蓋因胎轉臍帶攀肩所致用中指按兒兩肩理脫臍帶即生坐産者兒將欲生其母疲倦久坐椅褥抵其生路急用巾帶高懸令母以手攀之輕輕屈足良久兒順即生盤腸生者臨産母腸先出此難於收上以萆麻子四十九粒研爛塗産母頭頂待腸收上急洗去設或為風吹乾不能收者以磨刀水少許溫熱拭潤其腸再用磁石煎湯服之即收上磁石須隂陽家用有驗者俗以水噀母面背驚而腸亦收之蓋驚則氣散恐反致他症戒之若胎衣破而不得分娩者用保生無憂散以固其血自然生息如血已耗損用八珍湯料一斤益母草半斤水數碗煎熟不時飲之亦有得生者凡孕婦只腹痛未産也若連腰痛甚者將産也蓋腎候於腰胞係於腎故也華他治橫逆産難用蛇脫二條蟬殼二十八箇胎髮二丸各燒灰每服二錢酒調連進二服即卧片時兒即順生如無此藥令産母仰面正卧以小針刺兒手腳心三五次用鹽塗之手腳即縮上待兒身轉順即生若以蜀葵子四十九粒白滑石三錢順流水煎服即順生或用好京墨濃磨服之墨水裹兒即下或敗筆頭一箇煅過以藕節自然汁溫湯和下或紫蘇葉當歸各三錢長流水煎服即下凡孕家宜預請穩婆有仁心識見者當施恩惠以結其心先與説知倘有生息不順只説未産或遇雙胎只説胎衣未下恐驚則氣散愈難生息余家親驗之大抵難産多患於鬱悶安佚富貴之家治法雖云胎前清氣産後補血不可專執若脾胃不實氣血不充宜預調補不然臨産必有患難如因難産或大寒時急以大油紙撚徐徐燒斷其臍帶雖兒已死令暖氣入腹多得復生切勿用刀斷之治驗荆婦孟冬分娩艱難産子已死元氣勞傷用油紙撚燒斷臍帶取其陽氣以補之俄間兒啼作聲即鵠兒也若以刀物如常斷之其母亦難保生此兒嗣後一二嵗間並無傷食作瀉之症可見前法之功其穩婆又喜平日常施少惠得其用心能安慰母懷故無虞耳此穩婆云止有一女分娩時適當巡街侍御行牌取我視其室分娩女為此驚嚇未産而死後見侍御更以威言分付逮視産母胎雖順而頭偏在一邊若以手入推正可保順生已畏其威不敢施手但回稟云此是天生天化非人力所能立俟其母子俱死子死腹中夫子死腹中者多因驚動太早或觸犯禁或抱腰太重或頻探試水胞衣先破血水先盡而胎乾涸故耳其候産母唇舌皆黑者子母俱死若舌黑或脹悶甚者然其子已死矣先以平胃散一兩酒水各半煎却投朴硝半兩即熟皮硝服或用硝一兩以童便調下亦妙治驗一穩婆之女勤苦負重妊娠腹中隂冷重墜口中甚穢余意其胎必死令視其舌果青黑與朴硝半兩許服之隨下穢水而安一婦人胎死服朴硝而下穢水肢體倦怠氣息淹淹用四君為主佐以四物薑桂調補而愈胎衣不出有因惡露入衣脹而不能出有因元氣虧損而不能送出其惡露流衣中者腹中脹痛用牽牛丹或失笑散以消瘀血緩則不救其元氣不能送者腹中不脹痛用保生無憂散治驗俱詳婦人良方十八卷第四交骨不開隂門不閉子宮不收交骨不開産門不閉子宮不收皆元氣素弱胎前失于調攝以致血氣不能運達而然也交骨不開隂氣虛也用加味芎歸湯補中益氣湯産門不閉子宮不收氣血虛也用十全大補湯治驗餘詳婦人良方十七卷第四一婦人分娩最易至四十妊娠下血甚多産門不開亦與前湯一劑又用無憂散斤許一劑煎熟時時飲之以助其血而産一産婦隂門不閉發熱惡寒用十全大補加五味子數劑而寒熱悉退又用補中益氣加五味子數劑而斂若初産脹腫或焮痛而不閉者當用加味逍遙散若腫既消而不閉者當用補中益氣湯切忌寒涼之劑一婦人脾胃素弱兼有肝火産後隂門腫痛寒熱作渴嘔吐不食敷大黃等藥服驅利之劑腫及於臀虛症蜂起此真氣虛而作先用六君子以固脾胃乃以補中益氣湯升舉不數劑而消一産婦失治腫潰不已形體消瘦飲食少思朝寒暮熱自汗盜汗半年矣用補中益氣加茯苓半夏以健脾胃膿水漸少飲食漸進用歸脾湯以解脾鬱共五十餘劑元氣復而瘡亦愈矣一産婦隂門不閉小便淋􅅹腹內一物攻動脅下或脹或痛用加味逍遙散加車前子而愈一婦人子宮腫大二日方入損落一片殊類豬肝已而面黃體倦飲食無味內熱晡熱自汗盜汗用十全大補湯二十餘劑諸症悉愈仍復生育血滯成癰方見後産後腹痛産後小腹作痛俗名兒枕塊用失笑散行散之若惡露既去而仍痛用四神散調補之若不應用八珍湯若痛而惡心或欲作嘔用六君子湯若痛而泄㵼用六君子湯送四神丸若泄㵼痛而或後重用補中益氣湯送四神丸若胸膈飽脹或惡食吞酸或腹痛手不可按此是飲食所致當用二陳加白术山查以消導若食既消而仍痛或按之不痛或更加頭痛煩熱作渴惡寒欲嘔等症此是中氣被傷宜補脾胃為主若發熱腹痛按之痛甚不惡食不吞酸此是瘀血停滯用失笑散以消之若止是發熱頭痛或兼腹痛按之却不痛此是血虛用四物加炮薑參术以補之病機要云胎産之病從厥隂經論之無犯胃氣及上二焦為之三禁不可汗不可下不可利小便發汗者同傷寒下早之症利大便則脈數而已動于脾利小便則內亡津液胃中枯燥製藥之法能不犯三禁則榮衛自和而寒熱止矣如發渴用白虎氣弱用黃茋血刺痛則用當歸腹中痛則加芍藥宜詳察脈症而用之丹溪先生云産後當大補氣血為先雖有雜症從末治之一切病多是血虛皆不可發表治驗一産婦腹痛發熱氣口脈大余以為飲食停滯不信乃破血補虛反寒熱頭痛嘔吐涎沫又用降火化痰理氣四肢逆冷泄瀉下墜始信謂余曰何也余曰此脾胃虛之變症也法當溫補遂用六君加炮薑二錢肉桂木香一錢四劑諸症悉退再用補中益氣之劑元氣悉復一婦人産後腹痛後重去痢無度形體倦怠飲食不甘懷抱久鬱患繭唇寐而盜汗如雨竟夜不敢寐神思消爍余曰氣血虛而有熱用當歸六黃湯內黃芩連柏炒黑一劑汗頓止再劑全止乃用歸脾湯八珍散兼服元氣漸復而愈一産婦小腹作痛服行氣破血之藥不效其脈洪數此瘀血內潰為膿也以瓜子仁湯二劑痛止更以太乙膏下膿而愈産後多有此病縱非癰患用之更效一産婦小腹疼小便不利用薏苡仁湯二劑痛止更以四物加桃仁紅花下瘀血而愈大抵此症皆因榮衛不調或瘀血停滯所致若脈洪數已有洪脈但數微有膿脈遲緊乃瘀血下之即愈若腹脹大轉側作水聲或膿從臍出或從大便出宜用蠟礬丸太乙膏及托裏藥一産婦小腹作痛有塊脈芤而澀以四物加玄胡索紅花桃仁牛膝木香治之而愈一婦人産後小腹患痛服瓜子仁湯下瘀血而痊凡瘀血停滯宜急治之緩則腐化為膿最難治療若流注關節則患骨疽失治多為敗症一婦人因經水多服澀藥止之致腹作痛以失笑散二服而瘳産後血暈并失血産後元氣虧損惡露乘虛上攻眼花頭暈或心下滿悶神昏口禁或痰壅盛者急用失笑散主之若血下多而暈或神昏煩亂者大劑芎歸湯補之或藝薹子散或童子小便有痰加二陳湯若勞心力而致者宜補中益氣加香附若因氣血虛極不省人事用清魂散繼以芎歸湯及大補氣血之劑凡産可預燒稱錘令赤以器盛之急至床前以醋沃之或以醋塗口鼻聞之即醒或用破舊漆器或乾漆燒煙薰之或用半夏末冷水和丸入鼻孔中並無前患丹溪先生云血暈因氣血俱虛痰火泛上宜以二陳導痰或加減硃砂安神丸以麥門冬湯下亦可大凡産後口眼喎斜等症當大補氣血為主而兼以治痰若脾胃虛而不能固者用六君子湯至五七箇月宜服安胎飲至八九箇月再加大腹皮黃楊腦如臨産時更宜服保生無憂散庶無前患治驗一産婦月餘矣因怒兩脅脹痛忽吐血甚多發熱惡寒胸腹脹滿用八珍加柴胡丹皮炮薑而安却用十全大補仍加炮薑而愈前症因脾肺氣血虧損而胸腹虛痞雖投大補若非薑桂辛溫助其脾肺以行藥勢亦無以施其功而反助其脹耳家人婦産後小腹作痛忽牙關緊急灌以失笑散良久而蘇又用四物加炮薑白术陳皮而愈一産婦筋攣臂軟肌膚掣動此氣血俱虛用十全大補湯而愈一産婦兩手麻木服愈風丹天麻丸遍身皆麻神思倦怠䀯熱作渴自汗盜汗此氣血俱虛也用十全大補加炮薑數劑諸症悉退却去炮薑又數劑而愈但內熱此血虛也用逍遙散而痊産後發痓屋當作痙産後發痓因去血過多元氣虧極或外邪相摶其形牙關緊急四肢徑強或腰背反張肢體抽搐若有汗而不惡寒者曰柔痓若無汗而惡寒者曰剛痓然産後患之實由亡血過多筋無所養而致故傷寒汗下過多潰瘍膿血大泄多患之乃敗症也若大補血氣多保無虞若攻風邪死無疑矣治驗一産婦牙關緊急腰背反張四肢抽搐兩目連劄余以為去血過多元氣虧損隂火熾盛用十全大補加炮薑一劑而蘇又數劑而安余在吳江史萬湖第將入更時聞喧攘云某家人婦忽仆牙關緊急已死矣詢云是新産婦出直厨余意其勞傷血氣而發痓也急用十全大補加附子煎滚令人推正其身一人以手夾正其面却挖開其口將藥灌之不咽藥已冷令側其面出之仍正其面復灌以熱藥又冷又灌如此五次方咽下隨灌以熱藥遂蘇産後便血産後便血或飲食起居或六淫七情以致元氣虧損陽絡外傷治法若因膏粱積熱用加味清胃散若因醇酒濕毒葛花解酲湯若因怒動肝火六君加柴芍芎歸若因鬱結傷脾加味歸脾湯若因思慮傷心妙香散若因大腸風熱四物加側柏荆防枳殼槐花若因大腸血熱四物加芩連若因腸胃虛弱六君子加升麻柴胡若因腸胃虛寒六君加肉䓻木香若因元氣下陷補中益氣加茯苓半夏若因氣虛用六君升麻若因血虛用四物氣血俱虛用八珍俱加柴胡升麻大凡病久或元氣虛弱見病百端皆因脾胃虧損內真寒而外假熱但用六君子或補中益氣加炮薑溫補脾氣諸症悉退若四肢畏冷屬陽氣虛寒急加附子病因多端當臨症制宜庶無誤矣治驗一産婦糞後下血諸藥不應飲食少思肢體倦怠此中氣虛弱用補中益氣加茱炒黃連五分四劑頓止但怔忡少寐盜汗未止用歸脾湯治之而痊一婦人但怒便血寒熱口苦或胸脅脹痛或小腹痞悶此木乘土用六君加柴胡山梔而愈用補中益氣加味逍遙二藥而不復作一婦人久下血在糞前屬脾胃虛寒元氣下陷用補中益氣加連炒吳茱一錢數劑稍緩乃加生吳茱五分數劑而愈一婦人産後便血口乾飲湯胸脅膨滿小腹悶墜內熱晡熱飲食不甘體倦面黃日晡則赤灑淅惡寒此脾肺氣虛先用六君加炮薑木香諸症漸愈用補中益氣將愈用歸脾湯全愈後飲食失節勞役兼怒氣發熱血崩夜間熱甚譫語不絶此熱入血室用加味小柴胡二劑而熱退用補中益氣而血止用逍遙散歸脾湯調理而康産後大便不通産後大便不通因去血過多大腸乾涸或血虛火燥乾涸不可計其日期飲食數多用藥通之潤之必待腹滿覺脹自欲去而不能者乃結在直腸宜用豬膽汁潤之若服苦寒藥潤通反傷中焦元氣或愈加難通或通而瀉不能止必成敗症若屬血虛火燥用加味逍遙散氣血俱虛八珍湯慎不可用麻子杏仁枳殼之類治驗一産婦大便不通七日矣飲食如常腹中如故余曰飲食所入雖倍常數腹不滿脹用八珍加桃杏二仁至二十一日腹滿欲去用豬膽汁潤之先去乾糞五七塊後皆常糞而安一産婦大便八日不通用通利之藥中脘作痛飲食甚少或云通則不痛痛則不通乃用蜜導之大便不禁厄逆不食余曰此脾腎復傷用六君加吳茱肉果骨脂五味數劑喜其年壯不然多致不起産後寒熱産後寒熱因氣血虛弱或脾胃虧損乃不足之症經云隂虛則發熱陽虛則惡寒若兼大便不通尤屬氣血虛弱切不可用發表降火若寸口脈微名隂氣不足隂氣上入于陽中則惡寒用補中益氣湯尺部脈弱名隂氣不足陽氣下陷于隂中則發熱用六味地黃丸大抵隂不足陽旺從之則陽內陷而發熱陽不足隂往從之則隂上入而惡寒此隂陽不歸其分以致寒熱交爭故惡寒而發熱也當用八珍湯若病後四肢發熱或形氣倦怠此元氣未復濕熱乘之故耳宜補中益氣湯若肌熱大渴引飲目赤面紅此血虛發熱用當歸補血湯若認為熱則誤矣治驗一産婦惡寒發熱用十全大補加炮薑治之而愈但飲食不甘肢體倦怠用補中益氣而安又飲食後犯怒惡寒發熱抽搐咬牙難候其脈視其面色青中隱黃欲按其腹以手護之此肝木侮脾土飲食停滯而作用六君加木香一劑而安一産婦惡寒發熱余欲用八珍加炮薑治之其家知醫以為風寒用小柴胡湯余曰寒熱不時乃氣血虛不信仍服一劑汗出不止譫語不絶煩熱作渴肢體抽搐余用十全大補二劑益甚脈洪大重按如無仍以前湯加附子四劑稍緩數劑而安産後咳嗽産後咳嗽或因隂血耗損或因肺氣虧傷或隂火上炎或風寒所感主治之法若隂血虛者用芎歸熟地參术肺氣傷者用四君芎歸桔梗隂火上炎者六味地黃加參术風寒所感者補中益氣加桔梗紫蘇若瘀血入肺發喘急用二味參蘇飲多有得生者若兼口鼻起黑或鼻出血急用前散亦有得生者然而所患悉因胃氣不足蓋胃為五臟之根本人身之根蒂胃氣一虛五臟失所百病生焉但患者多謂腠理不密所致殊不知肺屬辛金生于巳土亦因土虛不能生金而腠理不密外邪所感其隂火上炎亦壯土金生腎水以制火為善若徑治其病則誤治驗一産婦咳嗽聲重鼻塞流涕此風寒所感用參蘇飲一鍾頓愈六七乃與補中益氣加桔梗茯苓半夏一劑而痊又與六君加黃茋以實其腠理而安一産婦朝吐痰夜發熱兼之無寐泥用清痰降火肌體日瘦飲食日少前症益甚余曰早間吐痰脾氣虛也夜間發熱肝血虛也晝夜無寐脾血耗也遂用六君子湯加味逍遙散加味歸脾湯以次調補不月而痊一産婦咳嗽痰盛面赤口乾內熱晡熱徹作無時此隂火上炎當補脾腎遂用補中益氣湯六味地黃丸而愈一産婦咳而腹滿不食涕唾面腫氣逆此病在胃關于肺用異功散而愈時疫墮胎咳嗽見小産産後瘧疾産後瘧疾因脾胃虛弱飲食停滯或因外邪所感或鬱怒傷脾或暑邪所伏審係飲食用六君加桔梗蒼术藿香如外邪多而飲食少用藿香正氣散如外邪少而飲食多用人參養胃湯飲食勞役用補中益氣湯氣血虛弱用十全大補加炮薑虛寒用六君加薑桂元氣脫陷急加附子大凡久瘧多屬元氣虛寒蓋氣虛則寒血虛則熱胃虛則惡寒隂火下流則寒熱交作或吐瀉不食腹痛煩渴發熱譫語或手足逆冷寒戰如栗雖見百症當峻溫補其病自退若誤用清脾截瘧之類多致不起治驗一産婦患瘧發熱作渴胸脅脹滿遍身作痛三日不食咽酸噯氣此是飲食所傷脾胃不能消化用六君加神麴山查四劑而不作酸乃去神麴山查又數劑而飲食進其大便不通至三十五日計進飲食七十餘碗腹始悶令用豬膽汁導而通之其糞且不甚燥一産婦患瘧久不愈百病蜂起其脈或洪大或微細或弦緊或沈伏難以名狀用六君加炮薑二十餘劑脈症稍得又用參术煎膏佐以歸脾湯百餘劑而瘥一産婦朝寒暮熱或不時寒熱久不愈用六君子補中益氣兼服百餘劑而尋愈産後瘧疾心脾痛見小産産後瀉痢二症治同兼嘔吐産後瀉痢或因飲食傷損脾土或脾土虛不能消食當審而治之若米食所傷用六君加榖蘖若麵食所傷用六君加麥蘖若肉食所傷用六君加山查神麴凡兼嘔吐皆加藿香若兼咽酸或嘔吐用前藥送越鞠丸若肝木來侮脾土用六君加柴胡炮薑若寒水反來侮土用錢氏益黃散若久瀉或元氣下陷兼補中益氣湯以升發陽氣若瀉痢色黃乃脾土真氣宜加木香肉果若屬脾土虛寒當用六君加木香薑桂若脾腎虛寒用補中益氣及四神丸若屬命門火衰而脾土虛寒用八味丸以補土母若小便澀滯肢體漸腫或兼喘咳用金匱腎氣丸以補脾腎利小道若胃氣虛弱而四肢浮腫治須補胃為主若久而不愈或非飲食所傷而致乃屬腎氣虧損蓋胞胎主於任而繫於腎况九月十月乃腎與膀胱所養必用四神六味八味三藥以補腎若用分利導水之劑是虛其虛也治驗一産婦瀉痢發熱作渴吐痰甚多肌體消瘦飲食少思或胸膈痞滿或小腹脹墜年餘矣余以為脾腎瀉朝用二神丸夕用六君子湯三月餘而痊一婦人産後泄瀉兼嘔吐咽酸面目浮腫此脾氣虛寒先用六君加炮薑為主佐以越鞠丸而咽酸愈又用補中益氣加茯苓半夏而脾胃康一産婦瀉痢年餘形體骨立內熱晡熱自汗盜汗口舌糜爛日吐痰三碗許脈洪大重按全無此命門火衰脾土虛寒而假熱然痰者乃脾虛不能統攝歸源也用八味丸補火以生土用補中益氣湯兼補肺金而脾胃健一産婦腹痛後重去痢無度形體倦怠飲食不進與死為鄰此脾腎俱虛用四神丸十全大補湯而愈但飲食難化肢體倦怠用補益湯調理而康一婦人五月患痢日夜無度小腹墮痛發熱惡寒用六君子湯送香連丸二服漸愈仍以前湯送四神丸四服全愈至七月終怠惰嗜卧四肢不收體重節痛口舌乾燥飲食無味大便不實小便頻數灑淅惡寒悽慘不樂此肺之脾胃虛而陽氣寒不伸也用伸陽益胃湯而痊附方并注加味逍遙散治血虛有熱遍身搔癢或口燥咽乾發熱盜汗食少嗜卧小便澀滯等症甘草炙當歸炒芍藥酒炒茯苓白术炒柴胡各一錢牡丹皮山梔炒各五錢右水煎服逍遙散即前方去丹皮山梔歸脾湯治脾經失血少寐發熱盜汗或思慮傷脾不能攝血妄行或健忘怔忡驚悸不寐或心脾傷痛怠惰嗜卧飲食不思人參白术白茯苓黃茋炒當歸龍眼肉逺志酸棗仁炒各一錢木香五分甘草炙五分右薑棗水煎服加味歸脾湯即前方加柴胡山梔補中益氣湯治元氣不足四肢倦怠口乾發熱飲食無味或飲食失節勞倦身熱脈洪大而無力或頭痛發熱或惡寒自汗或氣高而喘身熱而煩黃茋炙錢五分甘草炙人參當歸酒拌白术炒各一錢升麻柴胡各三分陳皮一錢右薑棗水煎服六君子湯即異功散加半夏十全大補湯治諸臟虧損氣血俱虛惡寒發熱或自汗盜汗便血吐血或大便不實飲食少思或胸腹作痛口舌生瘡或耳目不明牙齒不固人參白术白茯苓黃茋當歸熟地酒洗蒸焙川芎白芍藥炒各一錢肉桂甘草炙各五分右薑棗水煎服八珍湯治脾胃虧損氣血俱虛乃內傷之症蓋人之生以脾胃為主脾胃一虛諸臟失所百病生焉即前方大補湯去黃茋肉桂當歸補血湯治肌熱躁熱目赤面紅煩渴引飲晝夜不息脈洪大而虛重按全無此脈虛血虛也若誤服白虎湯必死當歸三錢黃茋炙一兩右水煎服加味清胃散治脾胃有熱口內生瘡或齒作疼或齦腐爛即前方加犀角連翹甘草小柴胡湯治肝膽經症寒熱往來或晡熱朝熱不欲飲食或口苦耳聾咳嗽發熱或脅痛胠滿轉側不便或瀉痢咳嗽嘔吐酸水柴胡一錢黃芩一錢五分半夏一錢人參一錢甘草炙五分右薑棗水煎服加味小柴胡湯治婦女經行感冒發熱熱入血室寒熱如瘧晝則安靜夜則發熱妄語或素血虛大勞大怒火動熱入血室亦能致此即前方加生地黃當歸六黃湯治氣血虛而發熱盜汗等症當歸二錢黃茋炒生地黃熟地黃各一錢黃連炒焦黃芩炒焦黃柏炒焦各五分右水煎服黃芩清肺飲治肺熱而小便不利黃芩山梔各一錢右水煎服不利加鹽豉二十粒六味丸一名地黃丸加肉桂兩名加減八味丸治腎虛發熱作渴吐痰小便淋瀝頭暈眼花咽燥唇裂齒不堅固腰腿酸軟自汗盜汗便血諸血失瘖水泛為痰之聖藥血虛發熱之神劑熟地八兩杵膏山茱茰肉乾山藥各四兩牡丹皮白茯苓澤瀉各三兩右各另為末和地黃加煉蜜丸桐子大每服七八十丸空心食前白滚湯下地黃須自製八味丸治命門大衰不能生土以致脾胃虛寒飲食少思或臍腹疼痛或多漩溺即前方加桂附各一兩加減八味丸即六味丸加肉桂一兩加減濟生腎氣丸治脾腎虛腰重腳腫濕飲留積小便不利或肚腹腫脹四肢浮腫氣喘痰甚或已成水症其效如神白茯苓三兩附子半兩川牛膝桂澤瀉車前子山茱茰山藥牡丹皮各一兩熟地黃四兩搯碎酒拌杵膏右為末和地黃膏加煉蜜丸桐子大每服七八十丸空心米飲下四物二連湯治血虛發熱或口舌生瘡或晝安夜熱當歸川芎芍藥熟地黃胡黃連宣黃連各一錢右作一劑水煎服白虎湯治胃熱作渴暑熱尤效知母一錢五分石膏四錢粳米一合右作一劑水煎服錢氏益黃散治脾土虛寒寒水反來侮土而嘔吐不食或肚腹作痛或大便不實手足逆冷等症陳皮一兩青皮訶子肉甘草炙丁香二錢右為粗末每服四錢水煎服二神丸治脾腎虛弱侵晨五更作瀉或全不思食或食而不化大便不實神效破故紙四兩炒肉豆蔲二兩生用右為末用大紅棗四十九枚生薑四兩切碎同棗用水煮熟去薑取棗肉和藥丸桐子大每服五十丸空心鹽湯下人參理中湯治脾胃虛寒嘔吐泄瀉飲食少思肚腹膨脹人參白术乾薑炮甘草炙各一錢右薑棗水煎服若因肝木尅脾土而致宜加柴胡芍藥若命門火衰而患宜兼八味丸異功散即前湯加陳皮治脾胃虛弱飲食少思或久患咳嗽或腹滿不食面浮氣逆等症人參橘皮湯治脾胃虛弱氣滯惡阻嘔吐痰水人參陳皮白术麥門去心各一錢甘草三分厚朴製白茯苓去皮各五分右用淡竹茹一塊薑水煎溫服若因中脘停痰宜用二陳枳殼若因飲食停滯宜用六君若因脾胃虛宜用異功散竹葉湯治妊娠心驚膽怯煩悶不安名曰子煩白茯苓麥門黃芩各三兩右每服四錢竹葉五片水煎服若因血虛煩熱宜兼用四物若因中氣虛弱宜兼四君紫蘇飲治妊娠失調胎氣不安上㽱作痛名子懸大腹皮川芎白芍陳皮蘇葉當歸各一兩人參甘草各半兩右薑蔥水煎服若肝脾血氣虛而有火不安宜兼逍遙散若脾氣虛弱而不安宜用四君芎歸膠艾湯治妊娠頓仆胎動不安腰腹疼痛或胎上搶或去血腹痛阿膠炙兩艾葉數莖右二味以水五升煮取二升分三服阿膠散或頓仆或因毒藥胎動不安或脅痛腹痛上搶短氣熟地黃艾葉白芍川芎黃茋阿膠當歸甘草炙各一兩右每服四錢薑棗水煎枳殼湯治胎漏下血或因事下血枳殼炒黃芩炙半兩白术一兩右為末每服一錢白湯調下二黃散治胎漏下血或內熱晡熱或頭痛頭暈或煩躁作渴或脅肋脹痛等症生地黃熟地黃右為末每服三錢煎白术枳殼湯下前四症若因脾胃虛弱宜用補中益氣湯加五味若因脾胃虛陷宜用前湯倍用升麻柴胡若因晡熱內熱宜用逍遙散知母丸治妊娠頓仆胎動不安或欲墮産用知母一味炒為末丸梧桐子大每服二十丸白湯下或嚼咽之地黃當歸湯治血虛胎痛當歸一兩熟地黃二兩右每服五錢水煎若因脾胃弱而血虛者宜用四君芎歸氣血俱虛者宜用八珍湯全生白术散治妊娠面目虛浮四肢腫如水氣名曰胎腫白术一兩生薑皮大腹皮陳皮白茯苓各半兩右各為末每服二錢米飲下若未應佐以四君子湯天仙藤散治妊娠自三月之後足指發腫漸至腿膝飲食不甘狀似水氣或腳指間出黃水名曰子氣香附炒陳皮甘草天仙藤洗略炒烏藥各等分右每服三五錢生薑木瓜各三片紫蘇三葉水煎食前日進三服若因脾氣虛弱宜兼六君子中氣下陷須用補中益氣湯安榮散治妊娠小便澀少遂成淋瀝名曰子淋麥門冬去心通草滑石各二錢當歸燈心甘草各五錢人參細辛各一兩右為末每服二錢煎麥門湯調下若因肺經藴熱宜用黃芩清肺飲若因膏粱厚味宜用清胃散若因肝經濕熱宜用加味逍遙散羚羊角散治妊娠虛風頸項強直筋脈攣急語言蹇塞痰涎不利或時發搐或不省人事名曰子癎羚羊角鎊川獨活酸棗仁炒五加皮各五錢薏苡仁防風當歸川芎茯神杏仁各四分木香甘草各二分半右每服五錢薑水煎若因肝經風熱或怒火所致須用加味逍遙散安胎飲治妊娠五七箇月用數服可保全産白术人參當歸川芎熟地黃白芍陳皮甘草紫蘇炙黃芩各一錢右用薑水煎服若因中氣虛弱須用四君子加陳皮紫蘇若隂虛內熱宜用四物黃芩白术二陳湯治妊娠失調脾胃不和嘔吐痰涎或飲食不思陳皮茯苓各錢五分半夏一錢甘草五分右薑水煎服若因脾胃虛弱用六君子若因氣滯用紫蘇飲麥門冬湯治妊娠失於調養內熱口乾或胎動不安麥門冬去心防風白茯苓各二錢人參一錢右作一劑水煎服若血虛有熱用逍遙散氣虛有熱用四君加黃芩紫蘇鯉魚湯治胸滿腹脹小便不通遍身浮腫白术茯苓當歸芍藥各三兩右細銼用鯉魚一頭煮取汁藥四錢入汁一盞半薑七片橘皮少許煎服若脾胃虛佐以四君子湯達子散治妊娠八九月服數劑甚效紫蘇梗葉人參甘草炙陳皮各五分大腹皮用黑豆汁洗晒三錢右水煎入黃楊葉七莖蔥五葉煎服春加川芎夏加黃芩冬依正方或有别症以意消息加減保生無憂散臨産服之補其血順其氣使易産又治小産瘀血腹痛南木香當歸川芎白芍藥枳殼乳香血餘即亂髮煅右等分每服二三錢水煎日二服若胞衣既破其血已涸或元氣困憊急用八珍湯斤許水數碗煎熟時飲救之飲盡再製亦有得生者芎歸補中湯治氣血虛半産艾葉代薑阿膠炒川芎五味子杵炒黃茋炙當歸白术炒芍藥炒人參杜仲炒各一錢甘草炙五分右每服五錢水煎服若脾氣虛弱須用補中益氣湯若氣虛而有火宜用安胎飲人參黃茋湯治小産氣虛血下不止人參黃茋炒當歸白术炒白芍炒艾葉各一錢阿膠炒二錢右作一劑水煎服藝薹散治孕婦九竅出血或作暈欲死藝薹子當歸焙各一錢芍藥官桂各半錢右為末每服三錢以酒并童便各半盞調灌下立瘥或一味童便溫飲尤效前二症若脾胃氣虛不能統血宜用四君芎歸中氣下陷補中益氣湯若血脫須補氣為主當歸川芎湯治小産後瘀血心腹疼痛或發熱惡寒當歸川芎熟地黃白芍藥炒玄胡索炒桃仁紅花香附青皮炒澤蘭牡丹皮右水煎入童便酒各小半盞服若以手按腹愈痛此是瘀血為患宜用此藥或失笑散消之若按之反不痛此是血虛宜用四物參苓白术若痛而作嘔此是胃虛宜用六君子若痛而作瀉此是脾虛宜六君子送二神丸四物湯治産後及諸症血虛發熱或口舌生瘡或齒齦腫潰或日晡發熱當歸熟地各三兩芍藥炒三錢川芎一錢半右作一劑水煎服若因氣虛不能生血而患前症宜補脾胃加味四物湯即前方加白术茯苓柴胡丹皮四神散治産後血虛或瘀血腹痛當歸二錢川芎芍藥炒各一錢炮薑五分右水煎服當歸散治産後氣血虛惡露內停增寒發熱宜服此去之當歸白芍炒川芎黃芩各一兩白术五錢右為細末溫童便調下二錢失笑散治産後心腹絞痛欲死或血迷心竅不知人事及尋常腹內瘀血積血作痛五靈脂蒲黃俱炒等分右每服三錢酒煎熱服若瘀血去多而元氣虛損所致宜用四君芎歸炮薑解語湯治風客心脾舌強不言附子炮防風天麻酸棗仁各一兩炒右每服二三錢水煎服若因脾胃風熱用秦艽升麻湯抱膽丸治心驚不語或癲癎等症水銀二兩黑鉛五錢硃砂細研乳香各一兩另研右將鉛入銚下水銀成砂次下硃砂乳香乘熱用木槌研勻丸雞頭大每服一丸若因心氣虛用妙香散二母散治産後惡露上攻留於肺經咳嗽喘促知母貝母白茯苓人參桃仁杏仁並去皮尖各一兩右每服五錢薑水煎若瘀血既去而嗽仍作宜補中氣二味參蘇飲治産後瘀血入肺咳嗽喘急人參一兩蘇木二兩右作一劑水煎服若既愈更當用六君子以補脾胃若口鼻黑氣起急用此藥加附子五錢亦有得生者清魂散治産後元氣虛瘀血逆行作暈澤蘭葉人參各一兩荆芥穗四兩川芎二兩甘草炙八錢右為末熱湯溫酒各半調下二錢若因瘀血去多宜四物加參苓白术不應血脫也急補其氣硃砂安神丸治産後血暈心神驚悸等症硃砂飛過五錢黃連酒洗六錢甘草炙五分生地黃一錢半當歸一錢五分右為末飯糊為丸每服十五丸若因中氣虛宜用四君芎歸兼思慮傷脾須用歸脾湯奪命丹治瘀血入衣胞脹滿難下急服此藥血即消衣自下附子半兩炮牡丹皮一兩乾漆一兩碎之炒令煙盡右為細末好醋一升大黃末一兩同熬成膏和藥丸如桐子大溫酒吞五七丸花蘂石散治胎衣不下其效如神及打撲傷損腹中瘀血脹痛欲死服之血化為水其功不能盡述硫黃上色明淨者四兩搗為末花蘂石一兩搗為細末右二味相拌和勻先用紙筋和鹽泥固濟瓦罐子一箇候泥乾入藥再用泥封口候乾安在四方磚上虛書八卦五行字用炭三十斤周疊煆之罐冷取出為細末每服一錢童便調下平胃散治腸胃寒受濕下血等症蒼术厚朴陳皮甘草炙右薑棗水煎服益母草丸五月採隂乾石器為末煉蜜丸彈子大臨産以童便和溫酒化下加味芎歸湯治分娩交骨不開或五七日不下垂死者川芎當歸各一兩生男女婦人髮一握燒灰存性自死龜殼一箇如無占過者亦可酥矣右為末每一兩水煎服良久不問生死胎自下芎歸湯治産後去血過多暈煩不省用川芎當歸二味等分每劑半兩水煎服若腹疼加桂腹痛自汗頭暈少氣加羊肉若不應用八珍湯七味白术散治中氣虛口乾或吐瀉等症人參白术木香白茯苓甘草藿香乾葛各一錢右作一劑水煎服選奇湯治風熱上壅眉稜骨痛頭目或眩暈等症羌活防風各二錢甘草二錢夏生冬炒酒黃芩冬去之熱甚用右每服三錢水煎時時飲之葛花解酲湯治酒積上下分消其濕白豆䓻砂仁葛花各五錢木香五分青皮三錢陳皮白茯苓豬苓人參各一錢半白术神麴炒澤瀉生乾薑各一錢右為細末每服五錢白湯調下藿香正氣散治外感風寒內停飲食頭疼寒熱或霍亂泄瀉或作瘧疾桔梗大腹皮紫蘇茯苓白芷半夏麴陳皮白术厚朴製各一錢甘草炙五分藿香一錢五分右作一劑薑棗水煎熱服清燥湯治元氣虛濕熱乘之遍身痠軟絶寒水生化之源小便赤少大便不調等症黃芩一錢五分五味九粒杵炒黃連神麴炒豬苓柴胡甘草炙各二分蒼术生地黃澤瀉各五分白茯苓人參麥門冬陳皮白术當歸升麻各三分酒柏一分右作一劑水煎服人參養胃湯治外感風寒內傷飲食寒熱頭疼或作瘧疾半夏厚朴製橘紅八分藿香葉草果茯苓人參五分甘草炙三分蒼术一錢右作一劑薑七片烏梅一箇水煎服大防風湯治足三隂虛患鶴膝風歷節痛風等症不問或腫而不痛或潰未斂白术炒羌活人參各二錢川芎一錢五分防風二錢甘草炙各一錢牛膝一錢酒浸黃茋炙二錢當歸酒拌二錢白芍炒二錢杜仲薑製二錢熟地黃生者自製附子炮去皮臍一錢右作一劑水煎服獨活濟生湯治鶴膝及厯節痛風等症白茯苓杜仲當歸酒洗防風白芍藥人參細辛桂心熟地黃牛膝秦艽芎藭寄生草甘草炙二兩獨活三兩右每服一兩薑水煎羌活勝濕湯治痛風血虛腫痛身重脈緩等症羌活獨活去蘆一錢藁本防風川芎甘草炙蔓荆子各五分右作一劑薑水煎服附子八物湯治厯節作痛發熱作渴飲食少思等症附子炮乾薑炮芍藥炒茯苓人參甘草炙各錢半肉桂一錢白术二錢右作一劑水煎食前服四生散治臁腿生瘡或癬疥等症白附子黃茋羌活沙苑蒺藜右各等分為末每服二錢用豬腰子批開入藥濕紙包裹煨熟細嚼鹽湯下風癬酒下妙香散治心脾虧損大便下血又治心氣不足精神恍惚少睡盜汗人參桔梗甘草各五錢逺志去心山藥薑汁炙茯苓去皮黃茋各一兩辰砂三錢另研麝香一錢另研木香煨二錢半茯神一兩右為末每服二錢溫酒調服漏蘆散治血風走注作痛無定處漏蘆當歸牛膝各三分桂心地龍去土防風羌活白芷沒藥研各半兩甜瓜子半兩虎脛骨酥炙敗龜各一兩炙右為細末每服二錢熱酒調下薛氏醫案卷四
