body:
  text: 薛氏醫案卷三十一明薛已訂婦人良方婦人嘔吐方論第一婦人嘔吐良由脾胃不調外邪乗之或胃中虚冷或胃口有熱或中脘停痰或胃經血弱治法胃冷者丁香散理中丸胃熱者小柴胡湯竹茹湯胃虚者藿香正氣散停痰者半夏茯苓湯二陳湯血虚者十全大補湯加陳皮半夏藿香愚按東垣先生云前症内有故寒與新穀俱入於胃新故真邪相攻氣併相逆復出於胃故爲噦補手太陰㵼足少陰又云胃因氣逆爲噦夫嘔吐噦者俱屬於胃以其氣血多少爲異耳如嘔者陽明也陽明多血多氣故有聲有物血氣俱病也仲景云嘔多雖有陽明症慎不可下孫真人云嘔家多服生薑爲嘔家之聖藥也氣逆者必散之故以生薑為主吐者太陽也太陽多血少氣故有物無聲為血病也有食入則吐以橘皮去白主之噦者少陽也多氣少血故有聲無物乃氣病也以薑製半夏為主若脾胃虛弱寒邪所客飲食所傷者用六君丁香藿香生薑之類若胃中有熱膈上有痰用二陳山梔黄連生薑若乆病胃虚嘔而不納穀者用生薑參术黄茋香附之類亦有痰膈中焦食不得下者有氣逆而嘔者有氣鬰於胃口者有食滯於心肺之分而復出者有胃口有火與痰而嘔者若注船大吐渇飲水者即死童便飲之最妙前論云血不歸源而嘔用十全大補湯誠發前人之未發愚常用屢效此論與王安道先生源廻集所論少異仍宜參看之附治驗太守陽山之内素善怒胸膈不利吐痰甚多吞酸噯腐飲食少思手足發熱數年矣所服非芩連枳實必㯽蘇厚朴左闗弦洪右闗弦數此肝火血燥木乗土位朝用六味地黄丸以滋養肝木夕用六君歸芍以調補脾土而愈乙巳夏因大怒吞酸噯腐胸腹脹滿或用二陳石膏治之吐痰如湧外熱如灼脉洪大按之如無余曰此脾胃虧損虚陽發越於外脾敗而涎泛出也用六君加薑桂一鍾即睡覺而諸症如失又數劑而康先太宜人飲食後聞外言忤意嘔吐酸水内熱作渇惟飲冷水氣口脉大而無倫靣色青赤此肝脾鬰火投之以藥入口即吐第三日吐宿食第七日吐酸黄水十一日吐苦水脉亦洪大仍喜飲冷以黄連煎湯冷飲少許至二十日加白术茯苓二十五日加陳皮三十七日加當歸炙草至六十日始進米飲半盞漸進薄粥調理得痊一婦人食後因怒患瘧嘔吐用藿香正氣散而愈後復怒吐痰狂言熱熾胸脇脹痛手按少得脉洪大無倫按之微細此屬肝脾二經血虛以加味逍遥散加熟地川芎二劑脉症頓退再用十全大補湯而安矣府庠沈姬文母患脾虛中滿痰𠻳發熱又食濕麫冷茶吞酸嘔吐絶食誤服芩蓮青皮等藥益加寒熱口亁流涎不收聞食則嘔數日矣迎治余曰脾主涎此脾虛不能約制也欲用人參安胃散惑於衆論以爲胃經實火宿食治之病日増劇忽思冬𤓰食如指甲一塊頓發嘔吐酸水不止仍服前藥愈劇復邀視之則神脱脉絶瀕死矣惟目睛尚動余曰寒淫于内治以辛熱然藥不能下矣急用鹽艾附子炒熱熨臍腹以散寒回陽又以口氣補接母口之氣又以附子作餅熱貼臍間時許神氣少甦以參术附子爲末仍以是藥加陳皮煎膏爲丸如粟米大入五七粒于口隨津液嚥下即不嘔二日後加至十粒諸病少退甘液不止五日後漸服前劑一二匙胃氣少復乃思粥飲後投以參术等藥温補脾胃五十餘劑而愈丁香散治脾胃氣弱嘔吐水穀不消丁香白术縮砂草菓各三錢人參一兩當歸白荳蔲藿香甘草各半兩炒橘皮三分神麯炒呵子各半兩右為末每服二錢薑棗湯調竹茹湯治胃熱嘔吐亁葛二錢半夏薑製三錢甘草五分竹茹一彈子大右薑棗水煎服許學士先生云胃熱者手足心熱也政和中一宗人病傷寒得汗身凉數日忽嘔吐藥食不下用丁香藿香滑石等藥下咽即吐余曰此正汗後餘熱􅅏胃脘正宜竹茹湯用之即愈許仁則半夏丸治胃冷嘔逆不食半夏洗去滑一斤小麥麵一斤右水和丸如弹子大水煮熟初服四五丸二服加至十四五丸旋煮間服七味人參丸服前丸不應可服此藥人參白术各五兩厚朴薑製細辛各四兩生薑橘皮三兩桂心二兩右爲末煉蜜丸桐子大米飲下十丸漸加至二十丸青金丸治嘔吐不已硫黄二錢水銀一錢右入銚内慢火化以木片撥炒成砂研至黒不見白星薑汁糊丸菉豆大每服二三十丸米飲下附方人參安胃散治脾胃虚熱嘔吐泄㵼或飲食不入人參一錢黄茋炒二錢生甘草炙甘草各五分白芍藥七分白茯苓四分陳皮三分黄連炒右水煎服六君子湯方見二十四卷第六論加味逍遥散十全大補湯二方見二十四卷第四論六味丸方見二十四卷第十一論藿香正氣散方見二十一卷第九論婦人霍亂方論第二論曰嘔吐而利者名霍亂也因腸胃虚弱飲食過度觸冐風冷清濁相干所致或先腹痛而吐或先吐而痛或吐利並作當分寒熱而治之飲冷者五苓散飲湯者理中丸四肢逆冷脉微細者用通脉四逆湯加猪膽汁中暑霍亂煩渇飲冷轉筋者用香薷散脉浮洪者易治微遲者難治愚按賈元良先生云暑者相火行令也夏月人感之自口齒而入傷心胞絡之經其症頭疼口乾靣垢自汗倦怠少氣或背寒惡熱甚者迷悶不省或霍亂吐利嘔痰腹痛或下血發黄生斑等症治法清心火利小便爲主若自汗熱甚用白虎湯若頭疼惡寒用十味香薷散泄㵼煩渇飲水吐逆用五苓散熱甚煩渇用益元散清之若表解裏熱甚者用黄連解毒湯脉微下利作渇喜温或厥冷不省人事宜竹葉石膏湯加熟附半枚冷飲次以來復丹五苓散治之故東垣云脾胃虚弱遇夏月淫雨身重短氣甚則四肢痿軟脚欹眼黒當滋肺氣以補水之源是以五月常服五味子人參麥門冬之劑爲熱傷元氣故耳丹溪所謂夏月伏陰在内也葢人之腹屬地巳月六陽盡出於地之上矣是人之陽氣亦浮于肌表散于皮毛而腹中之陽虛矣又加以凉臺水舘大扇風車寒泉水菓氷涼之物自内及外不用温熱病所由生陳無擇云凡中暍切不得用冷藥惟用温養得冷即死道途無湯即以熱土熨臍中溺以熱尿即甦槩可見矣内經曰脉虚身熱得之傷暑難經曰傷暑得之爲正邪火自病也當惡臭其病身熱而煩心痛其脉浮大而散傷寒論曰太陽中暍者身熱疼痛而脉微弱或發熱惡寒而脉微細芤遲大抵寒傷形熱傷氣葢傷氣而不傷形則氣消而脉虚弱故先哲立法夏月宜補良有以也前症若内有所積外有所感用二陳加减治之或蘿蔔子搗碎服而吐之若飲米湯即死云云同前論若轉筋不住男子以手挽陰女子以手牽乳近兩邊此千金妙法也乾霍亂不得升降死在須􅁷當以鹽湯吐之後以二陳湯加川芎蒼术防風白芷薑煎服若登圊而不通加枳殻若食𤓰菓飲冷乗風霍亂用六和湯倍加藿香凡中暑而亡者皆因元氣虚弱而暑熱乗之以致泄㵼陽氣暴脱實爲陰寒之症宜急補其陽庶得保生緩則不救其他執爲暑熱投以寒藥鮮不誤事愚故以回陽固本之方繼之於後附治驗進士李通甫之内冬間開衣箱其内衣裳乃夏月所晒者開時覺暑氣所侵良久患霍亂足指足跟俱轉筋甚惡自分必死用香薷飲一劑急煎下咽即愈加减理中丸治肚腹疼痛手足逆冷飲食不入等症人參白术乾薑甘草各等分右爲末煉蜜杵匀每兩作五丸每服一丸白湯化下嘔吐加枳實泄㵼加乾薑吐㵼乾嘔加半夏體冷微汗腹寒加炮附子水煎服四順附子湯治霍亂吐利腹痛手足厥冷脉微絶方見八卷第十一論四逆湯加猪膽汁名四逆猪膽汁湯甘草二兩乾薑三兩附子一枚生右每服五錢水煎入猪膽汁半合作二服香薷散治吐利腹疼發熱頭痛或霍亂轉筋拘急香薷二錢白匾豆厚朴姜製茯苓各一錢右水煎冷服連進二三劑加黄連名黄連香薷飲附方十味香薷散治伏暑身體倦怠頭疼惡寒或吐㵼等症香薷一兩人參陳皮白术炒茯苓黄茋炒木𤓰不犯鐡器厚朴姜製甘草炒各半兩右每服一兩水煎清暑益氣湯治長夏濕熱所蒸四肢困倦精神短少懶於動作胸滿氣促支節作疼或氣髙而喘身熱而煩心下膨悶小便黄數大便溏頻或㵼痢作渇不思飲食自汗體重黄茋炒蒼术升麻各一錢人參白术神麯炒陳皮各五分甘草炙黄栢炒麥門冬去心當歸各三錢葛根二分澤㵼五分青皮二分五味子九粒炒杵右水煎服白虎湯治胃熱作渇暑熱尤効又治熱厥腹滿身難轉側靣垢譫語不時遺溺手足厥冷自汗脉沉滑知母石膏各三錢粳米半合右水煎服人參白虎湯治暑熱發渇脉虚等症人參一錢五分知母二錢石膏半兩甘草一錢右入粳米一合水煎服人參益氣湯治暑熱傷氣四肢困倦嗜卧少食兩手指麻木黄茋炒八錢甘草七錢内炙一錢人參半兩升麻二錢白芍藥炒三錢五味百四十箇杵炒柴胡二錢半右㕮咀分作四服大順散治冐暑伏熱引飲過多脾胃受濕水穀不分清濁相干陰陽氣逆霍亂嘔吐臟腑不調甘草炒乾薑炮杏仁去皮尖炒桂去皮右爲末每服二三錢湯㸃服消暑丸治傷暑發熱頭疼或嘔吐泄㵼二便不分半夏甘草炒茯苓各半斤右爲末生薑汁和丸桐子大每五十丸水下易簡方薑汁好醋煑半夏末作糊丸服薑附湯治霍亂轉筋手足厥冷汗出嘔逆腹痛脉欲絶者乾薑炮一兩附子一箇生用右爲末每服五錢水煎服通脉四逆湯治霍亂惡寒腹痛身冷自汗脉沉微如欲絶吳茱茰二兩炒附子炮一兩桂心通草細辛白芍藥炒甘草炙各半兩當歸三錢右每服四錢水酒生薑煎如不應更加倍服之以効爲度半夏解毒湯治一切暑熱毒五心煩躁口舌咽乾黄栢炒黄芩炒山梔子炒半夏等分右每服五錢水煎六和湯治冐暑伏熱煩悶霍亂轉筋吐㵼寒熱交作頭目昏痛嗜卧倦怠小便赤澁不問胎産並服之縮砂半夏湯炮七次杏仁去皮尖人參甘草炙各一兩赤茯苓藿香木𤓰各二兩香薷厚朴姜製白扁豆姜汁畧炒各四兩右每服一兩薑棗水煎服益元散治中暑身熱小便不利或發熱體痛口乾作渇滑石六兩甘草微炒一兩右爲末每服三錢加蜜少許湯水任下二陳湯方見二十四卷第五論來復丹五苓散二方見二十一卷第十論竹葉石膏湯方見十三卷第十論婦人翻胃吐食方論第三論新増愚按病機云前症有三曰氣積寒也皆從三焦論之上焦吐者從於氣氣者天之陽也其脉浮而洪食已暴吐渇欲飲水大便燥結氣上衝胸發痛其治法當降氣和中中焦吐者從於積有陰有陽食與氣相假爲積而痛其脉浮而匿其症或先痛而後吐或吐而後作痛治法當以小毒藥去其積㯽榔木香行其氣下焦吐者從于寒地之道也其脉沉而遲其症朝食暮吐暮食朝吐小便清大便秘而不通治法當以毒藥通其閉塞温其寒氣大便漸通復以中焦藥和之不令大便秘結而自愈也王太僕曰食不得入是有火也食入反出是無火也又發明曰噎者六腑之所主陽也氣也塞者五臟之所主陰也血也二者皆由陰中伏火而作也劉宗厚先生曰若三焦傳化失常所致主於氣也若血虧胃脘乾稿所致因於血也塞猶填塞不通之義故發明有治幽門不通噎塞不便通幽湯例葢陽無陰不能通化陰之失位而陽伏其中傳化不變而反上行矣故前症或由飲食起居七情虧損脾胃痰飲停滯中氣不運當以補中益氣湯爲主若鬰結傷脾用歸脾湯加枳殻桔梗若恚怒傷肝用小柴胡加梔苓參术脾氣虚弱用六君加山梔枳殻氣血俱虚用八珍湯加山梔半夏若用行氣之藥胸膈痞悶用六君芎歸之類若過用香燥之劑而大便結燥用四物參术之類若飲食不能入用六君山梔吳茱茰製黄連若食入而反出用六君炮薑白豆䓻黄連製吳茱茰若痰滯而食反出六君枳壳桔梗若飲食少思大便不實胸膈痞悶吞酸噯腐食反不化是爲脾胃虚寒用東垣固真丸或八味丸若發熱煩熱身惡風寒腹畏熱食或手足俱冷胸滿腹脹是内真寒外假熱用神效附子丸或八味丸大凡嘔吐善食喜飲冷水是爲有火嘔吐少食喜飲熱湯是爲無火當審其因而治之附治驗一婦人患前症胸腹痞悶得去後或泄氣稍寛余曰此屬脾氣鬰結而虚弱也當調補爲善不信乃别用二陳枳實黄連之類不應又用香燥破氣前症益甚形氣愈虚余用加味歸脾湯調治半載而痊一婦人患前症胸脇脹悶或小腹不利或時作痛小便濇滯余曰此肝火血虚也當清肝火生肝血養脾土生肺金以余言爲迂别服利氣化痰等劑前症益劇虚症蠭起余用加味逍遥散加味歸脾湯兼服尋愈一婦人患吐痰甚多手足常冷飲食少思余曰此肝脾鬰怒兼命門火衰不信另服化痰利氣之劑胸腹愈脹又服峻利疎導之劑余曰非其治也必變脾虚發腫之症急服金匱加减腎氣丸庶有可救仍不信反服沉香化氣等丸果發腫而殁白堊散治虚熱翻胃用白堊土一斤米醋一升煆土赤入醋内再煆再入以醋乾爲度取土一兩入炮薑一錢爲末每服一錢米飲下甚者二錢須服四兩有效治實熱翻胃用黄連五錢生薑汁浸炒山查三錢保和丸三錢同爲末糊丸麻子大胭脂爲衣每服六十丸煎人參湯入竹瀝下之太倉丸治胃弱翻胃肉豆􅅳砂仁各二兩丁香一兩陳倉米一升土炒右爲末薑汁糊丸桐子大每服六七十丸薑湯下青金丹每服三十丸生薑陳皮煎湯送下方見前嘔吐類附方東垣補真丸肉蓯蓉酒浸焙葫蘆巴炒附子炮去皮陽起石煅肉豆蔲麫褁煨川烏炮去皮沉香兎絲子凈酒浸蒸五味子各五錢鹿茸酒浸炒巴㦸去心鍾乳粉各一两右爲末用羊腰子兩對治如食法葱椒酒煑搗爛入酒糊丸如梧子大每服七十丸空心米飲鹽湯任下神效附子丸治脾腎虚寒嘔吐或翻胃膈噎用黒附子重一兩四五錢端正底平尖圓一枚灰火炮皮裂入生薑自然汁内浸潤晒乾仍炮再入汁浸潤仍晒再炮用盡薑汁半碗爲度却去皮臍爲末以人參煎膏丸黍米大每服數丸津唾嚥下胃氣稍復飲食稍進投以温補之劑六君子湯補中益氣湯四物湯三方見二十四卷第六論歸脾湯加味歸脾湯八珍湯加味逍遥散四方見二十四卷第四論八味丸方見二十四卷第十一論二陳湯方見二十四卷第五論金匱加减腎氣丸方見二十二卷第十論婦人血膈方論第四愚按前症若氣逆而血滯用流氣飲若恚怒而血逆用小柴胡山梔丹皮血虚用四物參术柴胡山梔丹皮若鬰結而血傷用加味歸脾兼加味逍遥散脾虚不能生血用六君歸芎胃虚不能生血用益氣湯若肝虚而不能藏血用補肝散如不應兼以六味丸若因脾肺虚用補中益氣湯如不應用六君加芎歸附治驗一婦人患前症胸膈痞悶余曰此屬脾經血虚遂用四君芎歸調補脾氣尋愈又因怒兼兩脇痞悶頭目不清月經旬餘未竭用加味逍遥散加鈎藤治之復瘥一婦人患前症胸膈作痛靣青目劄小便頻數或時寒熱此肝氣滯而血凝先用失笑散二服痛止又用加味逍遥散而愈一婦人所患同前泛用行氣破血之劑以致不起神功散治血滯胸腹作痛五靈脂炒二兩莪术桂心芸薹子炒各半兩右每服二錢酒水煎附方流氣飲方見三卷第七論小柴胡湯方見二十四卷第二論加味歸脾湯加味逍遥散二方見二十四卷第四論四物湯補中益氣湯四君子湯六君子湯四方見二十四卷第六論補肝散方見本卷第十七論六味丸方見二十四卷第十一論失笑散方見二十卷第五論製吳茱茰黄連法用二味等分用熱湯拌濕和匀重湯頓煑使氣相通同炒焦各揀出聽用婦人鼻血方論第五婦人氣血調和則循環經絡若勞傷元氣陰虚火動氣逆於肺則血隨鼻而䘐産後尤不可治陳無擇曰亦有因怒氣而得者趙恭人鼻䘐先用蘇合香丸四粒次用五苓散濃煎白茅花湯調服即止又用芎歸湯調理而安一富男鼻血六脉洪數訊之云曽服丹藥遂用芩連大黄爲末水調服解之而愈愚按前症若熱鬰於胃經用犀角地黄湯若伏暑於内用黄連香薷飲若大怒血蓄于上用小柴胡湯若脾損不能攝血歸源用歸脾湯大凡雜症見血多因陰分鬰熱或内有所傷皆屬五志所動經曰諸見血身熱脉大者難治是火邪勝也身凉脉静者易治是正氣復也仍與後症同用附治驗一婦人經素不調因怒䘐血此肝火熾盛用加味小柴胡加紅花二劑血止又用加味逍遥散八珍湯兼服三十餘劑經行如期一婦人鬰結而患前症用加味歸脾湯其血漸止飲食漸進用加味逍遥散元氣漸復寒熱漸止後因怒仍䘐寒熱往來用小柴胡湯加芎歸丹皮而愈一婦人因勞䘐血服凉血之劑更致便血或以血下爲順仍用治血余曰此因脾氣下陷而血從之當升補脾氣庶使血歸其經不信果血益甚余朝用補中益氣湯夕用加味歸脾湯而愈此症用寒凉止血不補脾肺而死者多矣刺薊散治血熱鼻䘐刺薊生地黄各二錢桑耳亂髪灰艾葉炒各一錢蒲黄五分右水煎服犀角地黄湯方見後又方用白茅根汁一合飲之即止又方用生葱心塞鼻中血即止若刀斧所傷用之血亦止四物湯加側栢生地黄治虚熱吐血甚效若脾經血虚須用四君加芎歸若脾經氣鬰須用歸脾湯若肝腎虧損須用六味丸若氣血俱虚須用十全大補湯附方濟生犀角地黄湯治熱鬰不解泛行經絡或流腸胃隨氣湧泄以致䘐血吐血或爲便血並皆治之犀角鎊如無升麻代生地黄白芍藥牡丹皮各一錢右每服四五錢水煎若實熱熾甚加炒黄芩若去血過多或脾肺之氣虧損不能攝血歸源者急用四君子湯懐抱鬰結者用歸脾湯枇杷葉散治暑毒攻心䘐血嘔血或吐㵼作渇香薷二錢厚朴姜製錢半甘草炙麥門冬去心木瓜不見鐵器白茅根各一錢枇杷葉陳皮丁香各五分右末每服三五錢薑水煎黄連香薷飲治伏暑䘐血便血不拘四時方見本卷第二論小柴胡湯加味小柴胡湯二方見二十四卷第二論歸脾湯加味逍遥散八珍湯加味歸脾湯四方見二十四卷第四論補中益氣湯方見二十四卷第六論婦人吐血方論第六婦人吐血者由臟腑傷損所致夫氣血外行於經絡内榮於臟腑若六淫七情飲食起居有所損傷行失常道逆則吐血也愚按前症若脾經鬰熱用犀角地黄湯脾胃伏暑用黄連香薷飲心脾鬰熱用生地黄湯心氣耗損用茯苓補心湯脾氣勞傷用鷄蘇散思慮傷脾用歸脾湯暴怒肝火用加味小柴胡湯久怒肝傷六味地黄丸脾肺虚熱用麥門冬飲肝腎虚熱用六味地黄丸氣血俱虚用十全大補湯經云肺朝百脉之氣肝綂諸經之血必用甘温之劑補其陽氣使血各歸其經如大吐血病毋論其脉急用獨參湯救之若潮熱咳𠻳而脉數者元氣虚而假熱之脉也皆由脾胃先損須用人參之類本草云人參治脾胃不足補中温中㵼脾肺中火東垣先生云脾胃虚者心火亢甚而乗土位脾氣受邪須用黄茋最多人參甘草次之脾胃一虚肺氣先絶故用黄茋以益皮毛而閉腠理嘗治氣血虚弱用十全大補最善若用寒凉止血胃氣反傷無不致禍附治驗一老婦每作先飲食不進或胸膈不利或中脘作痛或大便泄㵼或小便不利余以爲肝脾之症用逍遥散加山梔茯神遠志木香而愈後鬰結吐紫血每作先倦怠煩熱以前藥加炒黒黄連三分吳茱茰二分頓愈復因怒吐赤血甚多燥渇垂死此血脱也法當補氣乃用人參一兩苓术當歸各三錢陳皮炮黒乾薑各二錢炙甘草木香各一錢一劑頓止又用加味歸脾湯調理而痊一女子懐抱素鬰胸滿食少吐血靣赤用六味丸及歸脾加山梔貝母芍藥而愈一婦人爲哭母吐血咳嗽發熱盗汗經水不行此悲傷肺思傷脾朝服補中益氣加桔梗貝母知母夕用歸脾湯送六味丸而愈柔脾湯治虚熱吐血䘐血汗出甘草炒白芍藥炒黄茋各半兩熟地黄自製一兩五錢右每服五錢水酒煎一婦人月經不利忽妄行嘔血察其形脉如常用四生丸即安一女子飽食負重而吐血用前湯及青餅子而愈世治吐血並用竹茹地黄藕汁亦不可拘泥如陽乗於陰血得熱則流散經水沸溢理宜凉解地黄犀角之類如陰乗於陽所謂天寒地凍水凝成氷須當温散乾薑肉桂之類四生丸治陽乗於陰以致吐血䘐血生荷葉生艾葉生栢葉生地黄各等分右研丸鷄子大每服一丸水煎服陳日華云先公嘗遊靈石寺主僧留飯設卓一僧見卓不穩急俯穩之舉首即嘔血明年到寺問舊嘔血者何如主僧言服得四生丸遂愈自得此方屢治有效愚意前症乃内熱暴患用之有效若人病久本元不足須補脾以滋化源否則虛火上炎金反受尅獲生鮮矣犀角地黄湯方見前薑草湯若陰乗於陽寒而嘔血甘草炒乾薑各一錢右水煎服理中湯亦妙花蕊石散治瘀血積於内以致大小便不通或血蓄於上而吐不止一婦人苦吐血百藥不效童便酒調不數服而愈方見胎衣不下如聖散治吐血不已每服二錢米飲下方見十七卷催生中附方濟生鷄蘇散治勞傷肺經唾中有血咽㗋不利鷄蘇葉黄茋炒生地黄阿膠炒貝母白茅根各一錢桔梗炒麥門冬去心蒲黄炒甘草炒各五分右薑水煎服生地黄散治鬰熱䘐血咯血吐血陰虚而不能愈者枸杞子柴胡黄連炒地骨皮天門冬白芍藥炒甘草炒黄芩炒黄茋炒生地黄熟地黄自製各五分右水煎下血加地榆三因茯苓補心湯治靣色黄瘁五心煩熱咳嗽吐血半夏前胡紫蘇茯苓人參枳殻麩炒桔梗炒甘草炒乾葛各五分當歸一錢川芎陳皮白芍藥各一錢熟地黄自製一錢五分右薑棗水煎服麥門冬飲子治氣虚吐血或氣虚不能攝血者五味子杵十粒麥門冬去心黄茋炒各一錢當歸身人參生地黄各半錢右水煎服十全大補湯治胃氣虚弱吐血䘐血便血不止以致外症惡寒發熱自汗盗汗食少體倦或寒熱作渇頭疼眩暈而似中風或氣血俱虚胸腹脇痛或骨節作痛經候不調或寒熱往來發熱晡熱或五心發熱咽乾舌燥或痰嗽喘促胸膈虚痞或嘔吐泄㵼手足冷熱等症歸脾湯加味逍遥散三方見二十四卷第四論加味小柴胡湯方見二十四卷第二論六味丸八味丸二方見二十四卷第十一論獨參湯方見三卷第十一論補中益氣湯方見二十四卷第六論黄連香薷飲枇杷葉散二方見本卷前婦人痃癖諸氣方論第七婦人痃癖因元氣虚弱而邪氣積聚葢痃者在腹内近臍左右有筋脉急痛如臂如指如絃之狀癖者僻在兩肋之間有時而痛皆陰陽不和經絡痞膈飲食停滯冷氣固結而成也愚按前症因飲食起居七情失宜虧損臟腑氣血乖違陰絡受傷循行失度所致羅謙甫先生曰養正邪自除必先調養使榮衛充實若不消散方可議下但除之不以漸則必有顛覆之害若不守禁忌縱嗜慾其有不喪身者鮮矣附治驗一婦人内熱作渇飲食少思腹内初如鷄卵漸大四寸許經水三月一至肢體消痩齒頰似瘡脉洪數而虚左闗尤甚此肝脾鬰結之症外貼阿魏膏午前用補中益氣湯午後用加味歸脾湯兩月許肝火少退脾土少健午前以補中益氣下六味丸午後以逍遥散下歸脾丸又月餘日用蘆薈丸二服空心以逍遥散下日晡以歸脾湯下喜其謹疾調理年餘而愈一婦人腹内一塊不時上攻或作痛有聲或吞酸痞悶月經不調小便不利二年餘矣靣色青黄余以爲肝脾氣滯以六君加芎歸柴胡炒連木香吳茱各少許二劑却與歸脾湯下蘆薈丸三月餘肝脾和而諸症退又與調中益氣加茯苓丹皮中氣徤而經自調一婦人性多鬰善怒勤於女工小腹内結一塊或作痛或痞悶月經不調略服伐肝之劑内熱寒熱胸膈不利飲食不甘形體日痩牙齦蝕爛此脾土不能生肺金肺金不能生腎水腎水不能生肝木當滋化源用補中益氣六味地黄至仲春而愈松江太守何恭人性善怒腹結一塊年餘上腭蝕透血氣虚極時季冬肝脉洪數按之弦緊或用伐肝木清胃火之藥余曰真氣虚而邪氣實也恐伐肝木至春不能發生耳用八珍湯以生氣血用地黄丸以滋腎水肝脉頓退因大怒耳内出血肝脉仍大煩熱作渇此無根之火也仍以前藥加肉桂二劑脉斂熱退復因大怒果卒於季冬辛巳日乃金尅木故也一婦人經候過期發熱倦怠或用四物黄連之類反兩月一度且少而成塊又用峻藥通之兩目如帛所蔽余曰脾爲諸陰之首目爲血脉之宗此脾傷五臟皆爲失所不能歸於目也遂用補中益氣濟生歸脾二湯專主脾胃年餘而愈麝香丸治痃癖冷氣心腹作痛麝香二錢另研五靈脂炒阿魏五錢麫褁煨令麫熟桃仁三稜各二兩醋製芫花醋炒㯽榔各一兩莪术醋製桂花没藥木香當歸各半兩右爲末飯丸桐子大每服十丸淡醋湯下治痃癖神效以獖猪肝一具重十餘兩用芭豆仁五十枚入肝内用釅醋三碗慢火熬乾研爛量入三稜末丸桐子大每服五丸食前熱酒下羅安人每經行臍腹痛甚以桃仁桂枝湯一劑而瘥方見第一卷十二論治經來腹先痛用局方七氣湯送來復丹局方積氣丸痃癖癥瘕諸氣亦效附方蘆薈丸治疳癖肌肉消瘦發熱潮熱飲食少思口乾作渇或肝疳食積口鼻生瘡牙齦蝕爛等症蘆薈胡黄連黄連炒焦木香白蕪荑炒青皮各五錢當歸茯苓陳皮各一兩五錢甘草炒七錢右爲末米糊丸桐子大每服七八十丸米湯下阿魏膏治一切痞塊更服胡連丸羌活獨活𤣥參官桂赤芍藥川山甲生地黄兩頭尖大黄白芷天麻各五錢槐柳桃枝各三錢紅花四錢木鼈十枚去殻亂髪如鷄子一團右用香油二斤四兩煎黒去柤入髪煎髪化仍去柤徐下黄丹煎軟硬得中入芒硝阿魏蘇合油乳香没藥各五錢麝香三錢調匀即成膏矣攤貼患處内服丸藥黄丹須用真正者效凡貼膏藥先用朴硝隨患處鋪半指厚以紙葢用熱熨斗熨良久如硝耗再加熨之二時許方貼膏藥若是肝積加蘆薈末同熨六君子湯補中益氣湯二方見二十四卷第六論八珍湯加味歸脾湯歸脾湯逍遥散四方見二十四卷第四論六味丸方見二十四卷第十一論調中益氣湯方見四卷第五論婦人疝瘕方論第八婦人疝瘕之病由飲食不調氣血勞傷或胎産經行風冷相摶所致葢疝者痛也瘕者假也脉弦急者生虚弱者死尺脉濇浮牢爲血實氣虚腹痛逆氣上行此爲胞中有惡血久則結成症也愚按子和先生云遺溺閉癃陰痿脬痺精滑白淫皆男子之疝也若血涸月事不行行後小腹有塊或時動移前陰突出後陰痔核皆女子之疝也但女子不謂之疝而謂之瘕附治驗一婦人小腹痞脹小便時下白帶小水淋瀝此肝經濕熱下注用龍膽㵼肝湯而愈一婦人小腹脹痛小水不利或胸乳作痛或脇肋作脹或氣逆心吻余以爲肝火而血傷脾用四物柴胡青皮𤣥胡索木香而愈一婦人小腹痞悶小便不利内熱體倦懶食用八珍湯加柴胡山梔龍膽草治之而安乾漆散治疝瘕脇肋疼痛乾漆炒令烟盡木香芫花醋炒赤芍藥桂心當歸川芎琥珀各半兩大黄二兩炒牛膝一兩桃仁去皮尖一兩另研麝香一錢右爲末每服一錢温酒調下蟠䓗散治前症屬寒氣不散疼痛甚效方見二十四卷第八論附方寶鑑蒺藜湯治陰疝小腹作痛小便不利手足逆冷或脇腹悶痛蒺藜去刺附子炮梔子去皮各半兩右末每三錢水煎食前温服丹溪定痛散治寒疝疼痛速效枳殻十五箇山梔子炒唐毬子吳茱茰炒過荔枝核炮各等分右末用長流水調下一二錢空心服三因失笑散治小腸疝氣痛或血疝肚腹作痛方見二十卷第五論龍膽㵼肝湯方見二十四卷第八論四物湯方見二十四卷第六論八珍湯方見二十四卷第四論婦人八瘕方論第九婦人臟腑調和經脉循環則月水以時故能生子而無病若乗外邪而合陰陽則小腹胸脇腰背相引而痛月事不調陰中腫脹小便淋瀝而色黄黒則瘕生矣八瘕者黄青燥血脂狐蛇鼈是也千金外臺言之詳矣愚按經曰氣主嘘之血主濡之若血不流則凝而爲瘕也瘕者中雖硬而忽聚忽散多因六淫七情飲食起居動傷臟腑而成當與痃癖諸症治同慎不可復傷元氣桃仁煎治血瘕桃仁大黄炒各一兩䖟蟲半兩炒黒朴硝一兩右爲末以醇醋一鍾石器中煑三分下前三味不住手攪煎至可丸下朴硝丸桐子大不喫晚食五更初温酒下五丸日午下穢物如未見再服仍以調氣血藥補之予向在毗陵一婦人小便不通臍腹脹甚予診之曰此血瘕也用前藥一服腹痛下血塊血水即愈此藥猛烈大峻氣血虚者斟酌與之大硝石丸治七癥八瘕當用此藥去之不令人困硝石三兩大黄四兩人參一錢甘草八分右爲末苦酒一升石器中先入大黄煎膏入餘藥丸梧子大每服三十丸米飲下三日一服宜下赤物婦人腹中瘀血方論第十婦人腹中瘀血者由月經閉積或産後餘血未盡或風寒滯瘀久而不消則爲積聚癥瘕矣愚按前症若鬰結傷脾用加味歸脾湯若恚怒傷肝用加味逍遥散若産後惡露用失笑散若肝脾虧損用六君柴胡以補元氣爲主胃氣虚弱用益氣湯加茯苓半夏爲主大凡腹中作痛畏手按者此内有瘀血若形體如常屬病氣元氣俱實用桃仁承氣湯直下之若痛而肢體倦怠飲食少思此脾胃受傷屬病氣有餘元氣不足用當歸散調和之若痛而喜手按腹形體倦怠飲食少思此形氣病氣俱不足用六君炮姜芎歸純補之若痛而大便不實飲食難化此脾腎虚寒用六君炮薑肉果温補之若痛而作嘔少食此脾胃虚弱用六君炮薑藿香若痛而嘔吐不食泄㵼用六君加薑桂若兼手足逆冷自汗更加附子此症多有因攻伐而致者附治驗一婦人耳下腫赤寒熱口苦月經不調小腹内一塊此肝火氣滯而血凝也用小柴胡加山梔川芎丹皮治之諸症悉退一婦人久患腹痛去瘀血方止而復大痛諸藥不納予以脾胃之氣虚寒用參术炮薑丸如黍每用數粒津嚥下後以二味濃煎漸呷而愈桃仁丸治瘀血不利月水不調發熱作渇心腹滿急或肚腹中作痛桃仁大黄炒各三兩䖟蟲炒去翅足水蛭炒焦各四十枚右爲末煉蜜丸桐子大每服五六丸空心熱酒下附方桃仁承氣湯治瘀血小腹急痛大便不利或譫語口乾漱水不嚥遍身黄色小便自利或血結胸中手不敢近腹或寒熱昏迷其人如狂桃仁半兩大黄炒一兩甘草二錢肉桂一錢右薑水煎發日五更服附方加味歸脾湯治瘀血已去或脾經失血小腹作痛無寐發熱盗汗或脾傷不能攝血或心脾傷痛嗜卧少食或憂思傷脾血虚發熱或肢軆腫痛大便不調或經候不准晡熱内熱加味逍遥散二方見二十四卷第四論失笑散方見二十卷第五論六君子湯補中益氣湯二方見二十四卷第六論當歸散方見後卷第五論小柴胡湯方見二十四卷第二論婦人癥痞方論第十一婦人癥痞由飲食失節脾胃虧損邪正相搏積于腹中牢固不動故名曰癥得冷則作痛冷入子藏則不孕入胞絡則月水不通愚按前症若脾胃虚弱用六君子加芎歸若肝脾虚弱用補中益氣及歸脾湯若肝火鬰滯佐以蘆薈地黄二丸外貼阿魏膏患者須慎七情六淫飲食起居治者不時審察病機而藥之庶幾有效附方穿山甲散治癥痞瘀血心腹作痛穿山甲灰炒燥鼈甲醋炙赤芍藥大黄炒乾漆炒令烟盡桂心各一兩川芎芫花醋炒當歸尾各半兩麝香一錢右爲末每服一錢酒調下六君子湯補中益氣湯二方見二十四卷第六論歸脾湯方見二十四卷第四論六味地黄丸方見二十四卷第十二論蘆薈丸阿魏膏二方見本卷第七論婦人食癥方論第十二婦人食癥由臟腑虚弱經行不忌生冷飲食或勞傷元氣所致陳無擇云經不行者宜先導之然後固元氣爲主愚按前症若形氣虚弱須先調補脾胃爲主而佐以消導若形氣充實當先疏導爲主而佐之補脾胃若氣壅血滯而不行者宜用烏藥散散而行之若脾氣虚而血不行者宜用四君芎歸補而行之若脾氣鬰而血不行者宜用歸脾湯解而行之若肝脾血燥而血行者宜用加味逍遥散清而行之大抵食積痞塊之症爲有形葢邪氣勝則實真氣奪則虚當養正闢邪而積自除矣雖然堅者削之客者除之胃氣未虚或可少用若病久虚乏者不宜輕用烏藥散方見後婦人積年血癥方論第十三婦人積年血癥由寒温失節脾胃虚弱月經不通相結盤牢久則腹脇苦痛宜用三稜煎主之愚按前症多兼七情虧損五臟氣血乖違而致葢氣主嘘之血主濡之脾綂血肝藏血故鬰結傷脾恚怒傷肝者多患之腹脇作痛正屬肝脾二經症也竊謂羅謙甫先生云養正積自除東垣先生云人以胃氣爲本治法宜固元氣爲主而佐以攻伐之劑當以歲月求之若欲速效投以峻劑反致有誤右七症方藥當互相叅用附方三稜煎治血癥血瘕食積痰滯莪术醋浸炒三稜各三兩青皮去白半夏麥芽炒各一兩右用好醋一鍾煑乾焙爲末醋糊丸桐子大每服三四十丸淡醋湯下痰積薑湯下婦人血氣心痛方論第十四婦人血氣心痛由臟腑虚弱風冷所乗葢心爲諸臟之主若心受傷名真心痛朝發夕死夕發旦死若心絡傷故痛發乍輕乍甚而成斯症也愚按前症若寒邪所傷温散之飲食停滯消導之肝火妄動辛平之脾氣鬰結和解之仍與後六症方藥同用附治驗一婦人久患心痛飲食少思諸藥到口即吐予以爲脾土虚弱用白术一味同黄土炒去土每服一兩以米泔煎濃徐服少許數日後自能大飲用三斤餘而安上舍陳履學長子室素怯弱産後患疥瘡年餘不愈因執喪旬月每欲眩仆一日感氣忽患心脾高腫作疼手不可按而嘔吐不止六脉微細或見其形實誤認諸痛不可補氣乃用青皮木香五味吳茱茰等藥而愈繼復患瘧且墮胎又投理氣行血之藥病雖去元氣轉脱再投參茋補劑不應矣六脉如絲欲絶迎予至診之曰形雖實而脉虚極反用理氣之劑損其真氣故也連投參茋歸术附子薑桂二劑間用八味丸五日寢食漸甘六脉全復此症若心脾疼痛時即服此等藥瘧亦不作矣附方烏藥散治血氣壅滯心腹作痛烏藥莪术醋浸炒桂心當歸桃仁青皮木香各等分右爲末每服二錢熱酒調下靈苑方用生五靈脂爲末每服一錢沸湯下日三服八味丸方見二十四卷第十一論婦人血氣心腹疼痛方論第十五婦人血氣心腹疼痛由臟腑虚弱風邪乗之真邪相摶隨氣上下故故心腹作痛也愚按前症若氣滯血瘀用没藥散勞傷元氣用四物湯肝脾鬰結用四七湯怒動肝火用小柴胡湯肝脾血虚用四物湯脾肺氣虚用四君子湯中氣虚弱用補中益氣湯氣血俱虚用八珍湯附治驗一婦人每怒心腹作痛久而不愈此肝火傷脾氣也用炒山梔一兩生薑五片煎服而痛止更以二陳加山梔桔梗乃不發一婦人懐抱鬰結不時心腹作痛諸藥不應用歸脾湯倍加炒山梔而愈陳湖陸小村母久患心腹疼痛每作必胸滿嘔吐手足俱冷面赤唇麻咽乾舌燥寒熱不時月餘竟夕不安其脉洪大衆以痰火治之屢止屢作迨乙巳春發頻而甚仍用前藥反劇此寒凉損真之故内真寒而外假熱也且脉息洪弦而有怪狀乃脾氣虧損肝木乗之而然當温補胃氣遂用補中益氣湯加半夏茯苓吳茱茰木香一服熟寐徹曉洪脉頓歛怪脉頓除諸症釋然附方琥珀散治氣滯心腹撮痛或月經不行小腹疼痛烏藥莪术醋浸炒各二兩當歸一兩右爲末每服二錢温酒調下蠲痛散治血氣刺痛荔枝核燒存性半兩香附子一兩右爲末每服二錢塩酒調下菖蒲丸治血積心脾作疼男六德續添九節菖蒲六兩吳茱茰炒香附子各四兩右爲末醋調神麯糊丸桐子大每服四五十丸淡薑湯調下没藥散治血氣不行心腹作痛或行注疼痛或月經不調發熱晡熱並用之紅花没藥當歸𤣥胡索炒各等分右爲末每服二錢童便酒調下木香枳术丸破滯氣消飲食開胃進食消化痰涎木香枳實炒各一兩白术二兩右每服五錢薑棗水煎服木香化滯湯治脾胃虚弱飲食停滯腹脹作痛或心下痞滿不思飲食若憂怒飲食而致者尤宜用之木香紅花各三錢橘皮當歸稍各二錢柴胡四錢草豆蔲甘草炙半兩半夏一兩枳實炒二錢右每服三五錢薑水煎服補中益氣湯四君子湯四物湯三方見二十四卷第六論四七湯方見十一卷第七論小柴胡湯方見二十四卷第二論八珍湯歸脾湯二方見二十四卷第四論二陳湯方見二十四卷第五論婦人血氣小腹疼痛方論第十六婦人小腹疼痛由胞絡受冷搏於血氣結於小腹因虚發動故痛也愚按前症若氣寒血結用葳靈仙散氣滯血凝用當歸散肝經血虚用四物湯加參术柴胡肝經濕熱用龍膽㵼肝湯肝脾氣虚用六君子湯加柴胡芍藥肝脾虚寒用六君子湯加柴胡肉桂若兼嘔吐加木香四肢逆冷再加炮薑附治驗通府張孟威云其妹小腹痛服附子理中湯附子服過八十餘枚此乃沉寒痼冷之甚不多有者附方葳靈仙散凡冷氣滯血小腹疼痛或經行遇怒腹脹痛宜用之葳靈仙一兩當歸没藥木香桂心各半兩右爲末每服一錢熱酒調當歸散凡血積小腹疼痛或因氣逆月經不行肚腹作痛當歸炒赤芍藥劉寄生没藥枳殻麩炒𤣥胡索炒各等分右爲末每服一錢熱酒調下四物湯六君子湯二方見二十四卷第六論龍膽㵼肝湯方見二十四卷第八論附子理中湯方見二十一卷第九論婦人兩脇脹痛方論第十七婦人兩脇脹痛因臟腑虚弱氣血不調風冷客於胞絡相搏壅塞故也愚按東垣先生云胸脇作痛口苦舌乾寒熱往來發嘔發吐四肢滿悶淋溲便難腹中急痛此肝木之妄行也竊謂前症若暴怒傷血用小柴胡芎歸山梔氣虚用四物參术柴梔若久怒傷氣用六君芎歸山梔若氣血俱虚用六味地黄丸若經行腹痛寒熱晡熱或月經不調發熱痰咳少食嗜卧體痛用八珍柴胡丹皮若脇脹發熱口渇唾痰或小便淋瀝頸項結核或盗汗便血諸血失音用六味丸若兩脇作脹視物不明或筋脉拘急面色青小腹痛或小便不調用補肝散若槩用香燥之劑反傷清和之氣則血無所生諸症作焉丹溪先生云右脇痛用推氣散小龍薈丸當歸蘆薈丸控涎丹抑青丸十􅀥湯皆病氣元氣俱實之劑用者審之附治驗一婦人性急吐血發熱兩脇脹痛日晡益甚此怒氣傷肝氣血俱虚也朝用逍遥散倍加炒黒山梔黄栢貝母桔梗麥門冬夕以歸脾湯送地黄丸而愈一孀婦内熱晡熱肢體痠麻不時吐痰或用清氣化痰藥㗋間不利白帶腹脹用行氣散血藥胸膈不利肢體時麻此鬰怒傷肝脾而藥益甚也予則朝用歸脾湯以解脾鬰生脾氣夕用加味逍遥散以清肝火生肝血百餘劑而愈後因怒飲食日少肢體時麻此乃肝火侮土用補中益氣加山梔茯苓半夏而痊又飲食失調兼有怒氣肢體麻甚月經如注脉浮洪而數此脾受肝傷不能綂血而致崩肝氣虧損陰血而脉大繼用六君加芎歸炮薑而血崩止又用補中益氣加炮薑茯苓半夏而元氣復更用歸脾湯逍遥散調理而康附方葳靈仙散治冷氣血滯兩脇作痛方見前人參紫荆皮散治心腹刺痛胸膈飽滿不進飲食紫荆皮蒼术石菖蒲各一兩香附子二兩人參半兩木香三錢右爲末米糊丸桐子大每服三十丸食後薑湯下左金丸一名四金丸治肝火胸脇脹痛或發寒熱或頭目作痛或大便不實或小便淋秘或小腹疼痛及一切肝火之症黄連炒六兩吳茱茰一兩湯煑片時用右爲末粥丸白术陳皮湯下當歸龍薈丸治肝經實火胸脇脹痛或大便秘結小便澁滯凡屬肝經實火皆宜用之當歸龍膽草炒焦梔子仁炒黄連炒黄芩炒各一兩大黄炒蘆薈青黛各五錢木香二錢五分麝香另研五分右爲末用神麯糊丸桐子大每服二十丸薑湯下補肝散治肝腎二經氣血虧損脇脹作痛或脇脹頭暈寒熱發熱或遍身作痛經候不調當歸山藥五味子炒杵山茱茰肉黄茋炒川芎木𤓰各半兩熟地黄自製白术炒各一錢獨活酸棗仁炒各四錢右爲末每服五錢􅀥水煎服小柴胡湯方見二十四卷第二論四物湯補中益氣湯六君子湯三方見二十六卷第六論六味丸方見二十四卷第十一論八珍湯逍遥散歸脾湯加味逍遥散四方見二十四卷第四論婦人心腹脹滿方論第十八婦人心腹脹滿由心脾虚損邪氣乗之此足少陰腎經之脉起於足小指貫腎絡膀胱入肝肺出絡於心若邪摶三經併結於脾脾虚則心腹脹滿矣愚按前症脾胃虚痞用六君子湯脾胃虚寒者用人參理中湯鬰結氣滯者用歸脾湯肝侮脾土用六君柴芍脾氣壅滯用平胃散肺氣壅滯用紫蘇飲宿食壅滯用養胃湯脾血虚痞用四物參术右六症當互相㕘用仍與六卷第七論同用附治驗嘔吐心腹痛見七卷第一論一婦人胸膈不利飲食少思腹脹吞酸或用疏利之藥反致中滿不食予以爲脾土虚而肝木勝用補中益氣湯加砂仁香附煨薑又以六君子加芎歸桔梗而愈吳江史𤣥年母久病之後遇事拂意忽胸腹脹滿面目微腫兩腿重滯氣逆上升言語喘促所服皆清氣之劑不效予曰此脾肺虚寒也先用六君子湯一劑病勢頓減後用補中益氣加茯苓半夏乾薑二劑形體頓安後以七情失調夜間腹脹乃以十全大補加木香治之而痊附方白术散治脾胃氣滯心腹脹滿不欲飲食白术炒草果訶子茯苓㯽榔桂心各五分陳皮厚朴姜製人參各一錢甘草炒三分右薑棗水煎服愚按前方治胸膈氣滯飲食内停之良劑若脾血虚痞須用四物參术脾氣虚痞須用四君芎歸補遺治心腹脹滿予嘗獨用厚朴薑汁炒每服五錢薑七片水煎温服不拘時候間服沉香降氣湯得效此病氣元氣壅實之治法也附方平胃散治脾氣壅滯胸腹不利或飲食不進停滯嘔吐蒼术厚朴姜製陳皮各一錢五分甘草炙五分右薑棗水煎服人參養胃湯治脾氣壅滯胸膈不利或飲食壅滯胸腹脹悶或兼外感風寒頭痛嘔吐等症方見二十一卷第九論四物湯六君子湯補中益氣湯三方見二十四卷第六論人參理中湯方見二十卷第八論十全大補湯歸脾湯二方見二十四卷第四論紫蘓飲方見十二卷第八論調中益氣湯方見四卷第九論薛氏醫案卷三十一
