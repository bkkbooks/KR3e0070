症惺惺散方見咳嗽葛根解肌湯抱龍丸二方見傷寒薄荷湯方見瘰癧人參羌活散方見驚風咳嗽錢仲陽云嗽者肺感微寒八九月間肺氣正旺若靣赤身熱其病為實當用葶藶丸下之久嗽者不宜下若在冬月乃傷風嗽當用麻黄湯汗之面赤飲水咳𠻳唾膿痰咽喉不利者以甘梗湯清之先咳後喘靣腫身熱肺氣盛也以瀉白散平之嗽而唾痰涎乳者以白餅子下之潔古云嗽而兩脇痛者属肝經用小柴胡湯咳而嘔苦水者属膽經用黄芩半夏生薑湯咳而喉中如梗者属心經用甘桔湯咳而失氣者属小腸用芍藥甘草湯咳而右脇痛者属脾經用升麻湯咳而嘔長蟲者属胃經用烏梅丸咳而喘息吐血者属肺經用麻黄湯咳而遺屎者属大腸用赤石脂湯咳而腰背痛甚則咳涎者属腎經用麻黄附子細辛湯咳而遺尿者属膀胱用茯苓甘草湯咳而腹滿不欲食靣腫氣逆者属三焦用異功散若咳嗽流涕外邪傷肺也先用參蘇飲喘嗽靣赤心火刑肺也用人參平肺散及六味地黄丸嗽而吐青綠水肝木乗脾也用異功散加柴胡桔梗嗽而吐痰乳脾肺氣傷也用六君子加桔梗若嗽唾膿痰者熱藴於肺而成肺癰也用桔梗湯凡風邪外傷法當表散而實腠理其用下藥非邪傳於内及胃有實熱者不宜輕用靣色白脉短濇者肺之本症也易治靣色赤脉洪數者火刑金也難治治驗一小兒潮熱煩渇大便乾實氣促咳嗽右顋色赤此肺與大腸有熱用柴胡飲子一服諸症􅉐退後又發搐咬牙􅉐悶此肝脾氣血虚也用四君芎歸釣藤鈎而愈一小兒咳嗽惡心鼻塞流涕右顋青白此脾肺氣虚而外邪所乗也先用惺惺散咳嗽􅉐愈但飲食不思手足指冷此外邪雖去而元氣尚虚也當調補脾土而生肺金遂用六君升麻治之而愈大凡外邪所侵而痰涎壅塞者宜表散之外邪旣去而喘嗽未愈或更氣促肺氣虚也属形病俱虚須用六君子之類調補脾土以生肺金為善設逕補肺氣則反益其邪况肺乃脆嫩之臟而司腠理以脾為母若腠理不密風邪外侵藴結於肺而變咳嗽諸症乃形氣不足病氣有餘也最難調理設或嘔吐傷其胃氣汗下損其津液必變肺痿肺癰呉江史萬言子六歲感冐咳嗽發散過度喘促不食痰中有血用桔梗湯而愈後因元氣未復清氣不升大便似痢或用五淋散黄連枳實之類痰喘目劄四肢抽搐變慢脾風而歿一小兒傷風咳嗽發熱服解表之劑加喘促出汗余謂脾肺氣虚欲用補中益氣湯加五味子補之不信乃自服二陳桑皮枳殻而發搐痰湧余仍用前藥加釣藤鈎而痊一小兒有哮病其母遇勞即發兒飲其乳亦嗽用六君桔梗桑皮杏仁治之母子並愈一小兒傷食發熱抽搐嘔吐喘嗽属脾肺氣虚有熱用六君炒黑黄連山梔而愈一小兒咳嗽因乳母素食膏粱炙􅏼所致用清胃散而愈後其母因怒咳嗽脇痛其子亦然母服小柴胡湯子亦隨愈呉江史萬洲子傷風咳嗽或用散表化痰之藥反加痰盛腹脹靣色㿠白予謂脾肺氣虚也用六君桔梗一劑頓愈三日後仍嗽鼻流清涕此復感於風寒也仍用前藥加桑皮杏仁而愈一小兒發熱咳嗽右顋色赤此肺金有熱用瀉白散而愈次日重感風邪前症復作聲重流涕用參蘇飲加杏仁桑皮而愈但右顋與額微赤此心火乗肺也用人參平肺散一劑遂痊一小兒咳嗽發熱右臉赤色作渇煩悶倦怠少食肚腹作脹此風邪傷肺飲食傷脾先用六君桔梗杏仁柴胡一劑諸症少愈後去杏仁柴胡又一劑而安一小兒發熱右臉赤咳嗽痰盛余謂風邪藴結於肺而痰作也用二陳加桑皮杏仁桔梗治之將愈自用發散降火之劑風痰不退發熱益甚余曰此脾肺俱虚也用五味異功散加桔梗四劑漸愈又用六君子而愈一小兒三嵗痰涎上湧氣喘胸滿大便不實睡而露睛手足指冷此属形病俱虚也用六君桔梗一劑諸症稍緩至四劑將愈復傷風寒前症仍作又以前藥加紫蘇杏仁桑皮而安一小兒傷風咳嗽痰盛雜用化痰等藥寒熱益甚靣色或青或赤此風熱相摶也用牛黄清心丸一服又六君桔梗二服而痊麥煎散治夾驚傷寒吐逆壯熱表裏不解氣粗喘急靣赤自汗或狂語驚呌或不語自汗及治癮疹搔痒徃來潮熱或時行痳痘餘毒未盡痰涎咳嗽或變驚風手足搐搦眼目上視或傷風頭疼並宜服之滑石地骨皮赤芍藥石膏白茯苓杏仁人參知母甘草葶藶子炒各半兩麻黄去節一兩五錢小麥五六十粒右為末每服一錢麥子煎湯調下若久嗽傳於五臟或唾痰涎或厥冷驚悸甚則目眶腫黑白睛色赤用生地黄黑豆濕研成膏掩目眶上服麥煎散久嗽成癎服散癎之藥小青龍湯治傷寒表不解惡寒體熱心下停水乾嘔咳嗽喘急或肺脹胸滿鼻塞清涕噯逆氣喘仲景所謂表不解心下有水氣乾嘔發熱而咳或渇或噎或小便不利或小腹脹滿此湯主之麻黄去節赤芍藥半夏湯泡各七錢細辛乾薑炮甘草炙桂枝各三錢五味子半兩杵右每服二錢水煎理中湯治脾胃虚寒胸膈痞滿或心腹疼痛痰逆嘔吐飲食減少氣短羸困或霍亂吐利手足厥冷不喜飲水者人參白术乾薑炮各等分甘草炒減半右每服三錢水煎熱服或研末白湯調下惺惺散治外感風寒鼻寒痰嗽發熱桔梗細辛人參白术甘草瓜蔞根白茯苓右為末每服二錢入薄荷五葉水煎服保肺湯治肺胃受風熱痰盛咳嗽喘吐不止及治久嗽不愈山藥白茯苓紫蘇葉各一錢藿香五分白殭蠶去絲嘴炒二錢百部六分黄芩防風杏仁去皮尖麩炒各一錢百合五分五味子一錢桔梗二錢右水煎食後服天麻防風丸治驚風咳嗽身體壯熱多睡驚悸手足抽掣精神昏憒痰涎不利及風邪温熱天麻防風人參辰砂雄黄麝香甘草炙各二錢五分全蝎炒殭蠶各半兩炒牛黄一方有膽南星無麝香右為末煉蜜丸桐子大每服一二丸薄荷湯下麻黄湯治太陽症頭疼發熱身頭惡風無汗喘滿脉浮緊八九日不解當發汗汗已煩悶瞑目者必䘐䘐乃解所以然者陽氣重故也甘草半兩麻黄去節兩半桂枝一兩杏仁去皮三十五箇右每服三錢水煎柴胡石膏湯治時行瘟疫壯熱惡風頭疼體疼鼻塞心胸煩滿寒熱徃來咳嗽涕唾稠粘桑白皮黄芩各三錢半升麻二錢五分石膏前胡赤芍藥乾葛柴胡各五錢荆芥穂三錢右為末每服一二錢薑二片淡䜴十粒水煎葶藶丸治脾熱薰肺或傷風咳嗽靣赤痰盛身熱喘促葶藶子隔紙畧炒防已黑牽牛畧炒杏仁去皮尖雙仁麫炒搗膏一兩右為末研入杏膏拌匀取蒸棗肉搗和丸麻子大每服五七丸淡薑湯下量兒加減黄芩半夏生薑湯治膽腑欬嘔苦水若膽汁黄芩生薑各一錢甘草炙芍藥各六分大棗二箇半夏一錢五分右水煎服甘桔湯治心臟咳咳而喉中如梗狀甚則咽腫喉痺粉草二錢苦梗一錢右水煎食後服芍藥甘草湯治小腸腑欬欬而失氣芍藥甘草炙各一錢右水煎服升麻湯治脾臟咳咳而右脇下痛痛引肩背甚則不可以動動則欬涎方見傷寒烏梅丸治胃腑咳咳而嘔嘔甚則長蟲出烏梅三箇細辛附子製桂枝人參黄栢各六錢乾薑一兩黄連一兩當歸蜀椒各兩右為末用酒浸烏梅一宿去核蒸之與米飯搗和丸桐子大每服十丸白湯下赤石脂禹餘粮湯治大腸咳咳而遺屎赤石脂禹餘粮各二兩並打碎右每服二錢水煎麻黄附子細辛湯治腎臟咳咳則腰背相引而痛甚則咳涎又治寒邪犯齒致腦齒痛宜急用之緩則不救麻黄細辛各二錢附子一錢右每服一錢水煎茯苓甘草湯治膀胱咳咳而遺溺茯苓二錢桂枝二錢五分生薑五大片右每服二錢水煎牛黄清心丸方見急驚瀉白散方見肺臟二陳湯方見吐噦補中益氣湯方見虚羸小柴胡湯方見痙症桔梗湯方見肺癰四君子湯六君子湯清胃散異功散四方並見内釣地黄丸方見腎臟五苓散方見五淋人參平肺散方見夜啼白餅子方見發搐百晬内嗽百晬内嗽者名乳嗽甚難調理當審其虚實若氣粗痰盛口瘡眼熱先用比金丸嘔吐驚悸困倦自汗用補肺散驚嗽用琥珀散乳嗽用天麻丸若脾胃内熱者用抱龍丸風邪外感者用惺惺散痰熱旣去而氣粗痰盛或流涎者脾肺氣虚也用異功散加桔梗口瘡眼熱大便堅實者用三黄丸大便不實者用白术散若嘔吐不乳困倦自汗或自利腹脹者脾胃氣虚也用六君子加柴胡若驚悸困倦痰盛不乳者心脾血虚也四君子加芎歸酸棗仁或因乳母食五辛厚味致兒為患者仍參喘嗽諸症治驗一小兒外感風邪服表散之劑汗出作喘此邪氣去而脾肺虚也用異功散而汗喘止再劑而乳食進一小兒咳嗽服抱龍丸反吐瀉不乳腹脹發熱用六君子湯母子並服而瘥後因母飲酒仍嗽用清胃散加麯蘖母服而子亦愈一小兒患嗽或用清痰等藥反吐乳發熱搐搦腹脹此脾胃復傷而内虚熱也用異功散加釣藤鈎漸愈又用前藥加當歸而安一小兒患咳嗽服牛黄清心丸加喘促腹脹此脾肺氣虚也用六君子湯頓愈補肺散一名阿膠散治肺虚惡心喘急久患咳嗽有痰阿膠一兩半炒䑕粘子炒馬兠鈴各半兩杏仁七粒糯米一兩甘草三分右每服一錢水煎服天麻丸治未滿百晬咳嗽不止天麻蟬蛻白殭蠶炒人參川芎甘草辰砂天竺黄各二錢牛膽南星砒白附子雄黄各一錢金箔五片鵬砂五分右為末蜜丸芡實大金箔為衣每服一丸用薄湯下愚按前方乃金石大毒之劑不可輕用况百晬小兒多是乳母飲食厚味或母有肺病傳兒昔一婦人服截瘧丹内有砒者兒飲其乳良久子母昏憒遍身發赤翌日方甦又一婦人亦服前藥其子吐瀉大作大人尚不能勝况小兒乎凡服砒石之藥中毒遍身發赤昏瞶或吐瀉者急灌醋碗許即甦小兒數滴足矣琥珀散治急慢驚風涎潮昏冐目瞪驚搐内釣腹痛或驚癎時發辰砂一錢五分琥珀牛黄牛膽南星殭蠶炒去絲嘴全蝎白附子代赭石天麻乳香蟬殻各一錢右為末每服一二分白湯調下黄芩清肺飲治肺燥而小便不通黄芩一錢梔子一箇打破右水煎服不利加鹽豉二十粒異功散四君子湯六君子湯清胃散四方見内釣白术散方見積痛比金丸方見驚癎三黄丸方見疝症惺惺散方見咳嗽抱龍丸方見傷寒牛黄清心丸方見急驚作喘喘急之症有因暴驚觸心者有因寒邪壅盛者有因風邪外客者有因食鹹酸痰滯者有因膏粱積熱薰蒸清道者然喘與氣急有輕重之别喘則欲言不能隘於胸臆氣急但息短心神迷悶耳治法因驚者用雄朱化痰定喘丸佐以天麻定喘飲寒傷肺氣者用小青龍湯風邪傷肺者用三抝湯加減之食醎酸傷肺者㗖以生豆腐熱傷肺氣者當凉肺定喘哮喘喉聲如鋸者梅花飲兼用半夏丸前症多因脾肺氣虚腠理不密外邪所乗真氣虚而邪氣實者為多若已發則散邪為主未發則補脾為主設槩攻其邪則損真氣逕補其肺則益其邪凡喘嗽之症若小便不利則必生脹脹則必生喘要分標本先後先喘而後脹者主於肺先脹而後喘者主於脾蓋肺金司降外主皮毛肺朝百脉通調水道下輸膀胱肺旣受邪則失降下之令故小便漸短致水溢皮膚而生脹滿此則喘為本而脹為標也治當清金降火為主而行水次之脾土惡濕而主肌肉土能尅水若脾土受傷不能制水則水濕妄行浸潰肌肉水旣上溢則邪反侵肺氣不能降而生喘矣此則脹為本而喘為標也治當實脾行水為主而清金次之苟肺症而用燥脾之藥則金燥而喘愈甚脾病而用清金之藥則脾寒而脹益增觀其症若中氣虚弱者用六君子湯中氣虚寒者前方加炮薑鬱結氣滯者用歸脾湯加柴胡山梔肝木尅脾土者用六君柴胡山梔肺氣壅滯者用紫蘇飲加白术食鬱壅滯者用養胃湯加木香肺中伏熱水不能生而喘者用黄芩清肺飲及五淋散脾肺虚弱不能通調水道者用補中益氣湯及六味丸膏粱厚味脾肺積熱而喘者用清胃散及滋腎丸心火刑金不能生水者用人參平肺散亦用滋腎丸腎水虧虚火鑠金小便不利者用六味丸及補中益氣湯肝木乗脾不能相制而喘者用六君柴胡升麻脾胃虚寒臍凸腹脹者用八味地黄丸脾腎虚寒不能攝水如蠱脹者用加減腎氣丸凡虧損足三隂而致喘脹或二便不調及牽引侈痛者俱用六味八味加減腎氣等丸治之仍叅傷風咳嗽症治驗一小兒嘔吐發熱胸痞脇痛作喘發搐因乳母恚怒母服加味逍遥散子服異功散加釣藤鈎山梔並愈一小兒痰喘鼻塞用惺惺散而愈後因傷乳服消導之劑痰喘腹脹益甚余謂脾虚不能生肺而痰喘脾氣不能運化而腹脹用異功散而痊一小兒患喘服發汗之劑汗不出而喘益甚用異功散頓愈又用六君子湯而全愈後復痰喘服下痰丸前症愈甚更腹脹作嘔此脾肺復傷也再用異功散而漸愈半載後患喘嗽靣赤此火心尅肺金用人參平肺散及六味地黄丸而痊一小兒傷風喘急不能卧服參蘇飲之類不痊余用小青龍湯一劑而愈後復感寒嗽喘益甚服發表之藥手足並冷腹脹少食余謂脾肺俱虚也用六君子加桔梗杏仁而愈一小兒患喘靣赤服牛黄清心丸靣色㿠白手足不熱余謂脾胃復傷用六君子湯不半杯而愈又傷風寒而喘靣色仍白用五味異功散加桔梗生薑治之頓安一小兒七歲患前症久不愈或用下痰等藥連瀉數次飲食不入手足並冷喘急不得卧先用六君薑桂益甚用人參五錢附子一錢二劑少緩又二劑十減三四乃用獨參將愈却用四君子湯而瘥雄朱化痰定喘丸治因驚發喘逆觸心肺暴急張口虚煩神困雄黄硃砂各一錢研蟬蛻全蝎白殭蠶天南星白附子炮各二錢輕粉五分右為末糊丸麻子大每服數丸茶清送下梅花飲治五臟積熱喉中有痰靣色赤白鼻流清涕氣逆喘急目赤咳嗽或因驚夜啼硼砂馬牙硝片腦人參各一兩甘草五錢芒硝辰砂麝香各一錢右各另為末磁器收貯每服半匙麥門冬湯調服氣急喘嗽桑白皮湯下常服薄荷湯下天麻定喘飲治喘嗽驚風天麻防風羌活甘草炒人參桔梗白术川芎半夏麯各等分右每服二錢水煎服三抝湯治感冐風邪鼻寒聲重語音不出或傷風寒頭疼目眩四肢拘倦咳嗽多痰胸滿氣短麻黄不去節杏仁不去皮尖甘草生用各等分右每服二三錢薑水煎服半夏丸治肺氣不調咳嗽喘滿痰涎壅塞心下堅滿及風痰嘔吐惡心涕唾稠粘白礬一兩半焙半夏三兩湯泡七次薑汁製一宿右為末生薑自然汁丸赤豆大每服十丸薑湯下紫蘇飲子治肺受風寒喘熱痰嗽紫蘇葉桑白皮青皮五味子杏仁麻黄甘草炙陳皮各二分人參半夏各三分右薑三片水煎温服小青龍湯惺惺散二方見咳嗽異功散清胃散六君子湯加味逍遥散歸脾湯五方見内釣人參平肺散方見夜啼平胃散方見胃氣虚冷八味丸即六味丸加肉桂五味子方見腎臟牛黄清心丸方見急驚養胃湯方見瘧症黄芩清肺散方見百晬内嗽五淋散方見五淋滋腎丸方見發熱補中益氣湯方見虚羸六味丸方見腎臟金匱加减腎氣丸方見腹脹黄疸經曰中央黄色入通於脾故黄疸者脾之色也夫人身之神貴於藏而黙用見於外則内虚矣其症皆因脾氣有虧運化失職濕熱留於肌膚發而為疸錢仲陽所謂身痛背彊二便澁滯遍身靣目爪甲皆黄是也小便褐色者難治療法宜固脾為先如専用尅伐寛中澹泄利水之藥則鮮有不至危者矣若初生及百日半年之間不因病而身黄者胃熱胎黄也腹大食土為脾疳兼作渇飲冷者用瀉黄散小便不利者茵陳湯病後發黄肢體浮腫者用白术散清便自調肢冷嗜卧者益黄散身澹黄白者調中丸及補中益氣湯加茵陳身熱膈滿肌膚靣目皆黄者加減瀉黄散辨其所以若閉目壯熱多哭不已大小便赤澁口中熱氣者廼姙娠厚味胎毒之候也母子並服生地黄湯仍忌酒麪五辛熱物設不自慎悞傷脾土急則變為驚風吐瀉緩則肢體浮腫小便不利眼目障閉多成疳疾矣又有脾虚發黄者當於脾胃中求之治驗一小兒旬日内先兩目發黄漸及遍身用瀉黄散一服而瘥一小兒生旬日靣目青黄此胃熱胎黄也用瀉黄散乳調服少許即愈後復身黄吐舌仍用前藥而安一小兒因乳母食鬱而致飽脹嚥酸遍身皆黄余以越鞠丸治其母瀉黄散治其子並愈一小兒患前症服五苓散消食丸之類其黄不退作渇飲湯腹膨少食余謂胃氣虚津液少故喜飲湯脾氣虚故腹脹少食也先用白术散漸愈又用補中益氣湯而痊一小兒飲食不調腹脹身黄小便金色雜用治疸之劑作渇飲水余謂胃氣實熱先用瀉黄散二劑作渇頓止用梔子栢皮湯其黄亦退用白术散而飲食進茵陳湯治陽明病發熱汗出者此為熱越不能發黄也但頭汗出至頸而還小便不利渇飲水漿此瘀熱在裏而發黄也或傷寒七八日小便不通腹微滿身黄如橘色者茵陳蒿嫩者一兩大黄三錢五分梔子大者三枚右每服一錢水煎服犀角散治黄疸一身盡黄犀角一兩茵陳葛根升麻龍膽草酒炒甘草各半兩生地黄五錢寒水石三錢右每服三錢水煎服一方𤓰蔞根汁和蜜服小半夏湯治黄疸小便色不變自利腹滿而喘者不可除熱熱去必噦半夏湯洗七次右每服二三錢薑三片水煎服消食丸治胸膈氣痞乳食不消身後黄者方見嘔吐乳茵陳五苓散即五苓散加茵陳每服一錢温水調下日三服導赤散二方見五淋越鞠丸方見天釣承氣湯小柴胡湯二方見痙症調中丸即理中丸方見冷瀉平胃散方見脾胃虚冷史君子丸方見蚘䖝益黄散方見脾臟地黄湯即濟生地黄湯白术散方見積滯四味肥兒丸方見嘔吐瀉黄散方見脾臟嘔吐乳嘔吐皆主脾胃古人謂脾虚則嘔胃虚則吐是也嘔者有聲無物吐者有物無聲也蓋乳哺過飽則胃不能受而溢出銜乳多食睡則脾不能運而作㵼脾胃漸傷疾病􅅶綿甚至慢驚之患矣若手足指熱喜飲熱湯或睡而露睛皆胃氣虚弱也用異功散若手足指熱飲冷或睡不露睛属胃經實熱也用瀉黄散若作渇少食或小便色赤胃經虚熱也用七味白术散大凡嬰兒在乳母尤當節飲食若乳母停食亦能致兒吐瀉故不可不慎也治驗一小兒傷食嘔吐發熱靣赤服消導清熱之劑飲食已消熱赤未退余以為胃經虚熱用六君升麻柴胡四劑而痊一小兒傷食嘔吐服尅伐之藥嘔中見血用清熱凉血反大便下血唇色白而或青余謂脾土虧損肝木所乗令空心服補中益氣湯食逺服異功散使涎血各歸其源果愈一小兒吐酸乳食用四君呉萸黄連木香補脾平肝而愈後口中有酸水仍用前藥隨愈後吐苦水而口亦苦用龍膽湯以清肝火四君子湯以補脾土而痊一小兒吐黄水所食之物悉皆甘味用瀉黄散清其胃火而愈後因停食服尅伐之藥口甘不食形氣殊弱用補中益氣湯養其中氣而痊一小兒傷食噯腐用平胃散一服宿滯頓化余云不必多藥但節其飲食自愈不信别用尅滯之藥更加吐瀉以致不救一小兒傷食發熱靣赤抽搐嘔吐氣喘唾痰此飲食傷脾肺氣虚弱所致用六君子湯炒黑黄連山梔各二分一劑頓愈消乳丸治嘔吐消乳食脉沉者傷食不化也香附子炒宿砂仁陳皮甘草炙神麯炒麥芽炒等分右為末米糊丸黍米大每服二十丸薑湯下又方治百晬内嘔吐乳妳或大便青色用少婦乳汁一盞入丁香十粒陳皮一錢磁器内煑數沸稍熱空心以綿毬吮服楊氏消食丸治乳食過多胃氣不能消化宿砂橘皮三稜􅅾术神麯炒麥芽炒各半兩香附子炒一兩右為末麯糊丸麻子大白湯送下量兒加減局方觀音散治外感風寒内傷脾胃嘔逆吐瀉不進飲食漸至羸瘦人參一兩神麯炒茯苓甘草炒木香綿黄茋白扁豆白术各一錢石蓮肉去心二錢五分右為末每服一錢入藿香三葉棗水煎服香朴散治積冷嘔吐藿香葉陳皮厚朴薑汁製各七錢半夏一兩湯炮七次甘草炙一錢右每服三錢薑棗水煎瀉甚加木香肉豆􅅳香薷散治寒温不適飲食失調或外因風寒暑邪致吐利心腹疼痛霍亂氣逆發熱頭痛或轉筋拘急或疼痛嘔噦四肢逆冷香薷一兩茯苓白扁豆炒厚朴薑汁製各五錢右每服二三錢水煎加酒半杯冷服立效竹茹湯治胃受邪熱心煩喜冷嘔吐不止葛根七錢五分半夏炮半兩甘草炙三錢右每服二三錢入竹茹􅀥許大薑水煎取清汁微冷細細服加茯苓三錢尤妙蘇合丸治傳屍骨蒸殗殢肺痿疰忤鬼氣卒心痛霍亂吐痢驚補客忤等症蘇合香油入安息香膏内薰陸香另研龍腦研木香白术白檀香丁香朱砂研水飛沉香香附子炒烏犀屑畢撥安息膏另為末用無灰酒杵膏麝香研訶黎勒煨取皮各二兩右為末研匀用安息香膏并蜜和丸桐子大井花水空心化服一二丸温酒亦得更用臘紙裹彈子大一丸緋絹袋盛當心帶之辟一切邪及治胸膈噎塞腸中虚鳴宿食不消青州白丸子治驚風吐乳天南星三兩白附子一兩半夏浸洗七兩川烏頭去皮臍半兩右用井花水浸晒過次日早晨再換新水春五日夏三日秋七日冬十日晒乾為末以糯米粉煎粥清為丸菉豆大薄荷湯調下瀉黄散方見脾臓白术散方見積痛異功散六君子湯四君子湯三方見内釣龍膽湯方見噤風平胃散方見脾胃虚冷補中益氣湯方見虚羸吐舌弄舌舌属心脾二經小兒舌微露而即收者名弄舌此属心脾虧損用温胃散補之舌舒長而良久不收者名吐舌乃心脾積熱用瀉黄散主之或兼口舌生瘡作渇飲冷属胃經實熱亦用前散作渇飲熱属胃經虚熱用四君子湯食少作渇或大便不實脾胃虚弱也用七味白术散口角流涎或腮頰患腫胃虚風熱也先用人參安胃散次用七味白术散若午後甚者脾血虚也四物多加參术茯苓未應用補中益氣湯及審五臟相勝若因疳瘦所致當叅諸疳門治驗一小兒弄舌發搐手指不冷余謂肝脾虚熱用異功散加升麻柴胡而愈後傷乳腹脹服尅滯作瀉弄舌手指發熱審乳母肝火與小柴胡湯加升麻白术治之母子並愈一小兒乳食過多患吐瀉用大劑異功散加柴胡升麻母子服之而愈後因驚服至寶丹之類發搐弄舌㡬至慢驚余用六君子湯加白附子服而愈一小兒吐舌發熱飲冷額鼻黄赤吐舌流涎余謂心脾實熱用導赤瀉黄二散而愈後復作别服清熱等藥更弄舌余用異功散加釣藤鈎而安又用六君子湯全愈一小兒七嵗食生冷之物腹痛便秘服峻利之劑連瀉五次噫氣腹痛余謂心脾虚寒用異功散加薑桂木香治之不從反治胃火更加吃逆余仍以前藥加附子一片一服諸症頓退乃去附子又三劑而愈其時同患是症用清胃化痰者歿而手足俱黯四物湯方見急驚補中益氣湯方見虚羸小柴胡湯方見痙症導赤散方見心臟瀉黄散人參安胃散二方見脾臟七味白术散方見積痛異功散六君子湯四君子湯三方見天釣五苓散方見五淋薛氏醫案卷五十九
