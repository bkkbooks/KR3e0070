body:
  text: 薛氏醫案卷五十九明薛已訂保嬰撮要六發熱症小兒之熱有心肝脾肺腎五臟之不同虛實温壯四者之不一及表裏血氣隂陽浮陷與夫風濕痰食各當詳之心熱者頟上先赤心煩心痛掌中熱而噦或壯熱飲水己午時益甚肝熱者左頰先赤便難轉筋尋衣捻物多怒多驚四肢困倦寅卯時益甚脾熱者鼻上先赤怠惰嗜卧身熱飲水遇夜益甚肺熱者右頰先赤手搯眉目喘咳寒熱飲水日西熱甚腎熱者頦下先赤兩足熱甚骨蘇蘇如蟲蝕熱甚不能起於牀夜間益甚仍當辨其虛實實則靣赤氣粗口燥唇腫作渇飲冷大小便難或掀衣露體煩啼暴呌伸體而卧睡不露睛手足指熱宜用表下虛則靣色青白恍惚神緩口中虛冷嘘氣軟弱喜熱惡寒泄瀉多尿或乍涼乍温怫鬰驚悸上盛下泄夜則虛汗屈體而卧睡而露睛手足指冷宜用調補壯熱者肢體大熱熱不已則發驚癎温熱者肢體微熱熱不已則發驚搐隂虛則内熱陽盛則外熱以手輕捫之則熱重按之不熱此皮毛血脉之熱熱在表也重按之筋骨之分則熱輕手則不熱此筋骨之熱熱在裏也不輕不重按之而熱此肌肉之熱熱在表裏之間也以虚實分属表裏而言之壯熱惡風寒為元氣不充表之虛熱也壯熱不惡風寒為外邪所客表之實熱也壯熱飲湯為津液短少裏之虚熱也壯熱飲水為内火銷鑠裏之實熱也若夫内外皆熱則喘而渇齒乾煩寃腹滿四肢熱逢風寒如炙於火能冬不能夏是皆陽盛隂虚也脉尺寸俱滿為重實尺寸俱弱為重虛脉洪大或緩而滑或數而鼓此熱盛拒隂雖形症似寒實非寒也熱而脉數按之不鼓此寒盛格陽雖形症似熱實非熱也發熱惡熱大渇不止煩燥肌熱不欲近衣其脉洪大按之無力或兼月痛鼻乾者此血虛發躁也當補其血如不能食而熱自汗者氣虛也當補其氣仲景論内外不足發熱自汗之症禁不可發汗如飲食勞役雖病發熱誤發其汗則表必虛也身熱而汗出者風也發熱身疼而身重黄者濕也增寒發熱惡風自汗脉浮胸痞者痰也發熱頭痛脉數者食也寸口脉微為陽不足隂氣上入陽中則惡寒尺脉弱為隂不足陽氣下入隂中則發熱隂陽不歸其分則寒熱交爭也晝則安静夜則發熱煩躁是陽氣下陷入隂中也晝則發熱煩躁夜則安静是重陽無隂也當亟瀉其陽峻補其隂至若身熱脉弦數戰慄而不惡寒者癉瘧也發熱惡寒脉浮數也温病也若四肢發熱口舌咽乾是火熱乗土位濕熱相合故煩躁悶亂也若身體沉重走注疼痛乃濕熱相摶風熱鬱而不得伸也心熱則用瀉心湯導赤散安神丸肝熱則用瀉青丸柴胡飲子脾熱則用瀉黄散肺熱輕則用瀉白散重則用凉膈散及地骨皮散腎熱則用滋腎丸實熱則宜疏下虛熱則宜調補壯熱者導赤散温熱者㵼黄散若肢體熱輕則用惺惺散重則用羌活散之類大便秘者二黄犀角散餘熱不退者地骨皮散骨節疼痛者梔子仁湯宿滯内作者紫霜丸肝火内熱者龍膽草湯隂盛隔陽而熱者人參理中湯肝經血虚生風而搐者用四物天麻釣藤鈎若熱藴便秘者四順清凉飲熱而二便調和風邪藴結於表而發者用惺惺散加麻黄汗之汗後血虚而熱益甚者六神散加粳米汗後氣虛而惡寒發熱者補中益氣湯汗後隂虚陽無所附而熱者用四物湯加參茋汗後陽虛隂無所附而熱者用四君湯加芎歸嬰兒諸熱其因别症而作者當從所重而治之或乳母七情厚味飲食停積遺熱於兒或兒嗜食甘肥衣衾過煖或頻浴熱湯積熱於内為患者各當詳之蓋小兒臟腑脆弱元氣易虛補泄宜用輕和之劑庻無變症若乳下嬰兒當兼治其母仍參諸熱症治之治驗一小兒夜間發熱天明如故或小腹作痛飲食少思靣色痿黄熱時靣赤不時飲湯此食積所致用下積丸治之而消又用白术散調理而安一小兒飲食停滯腹痛作嘔用大安丸而愈飲食雖進其腹仍痛用六君山查神麯痛少止余以為脾氣傷而飲食難化乃去前二味服六君子四劑而愈後又傷食仍服前藥痛止而至暮發熱用六君柴胡升麻而痊此由脾虛下陷不能升發故至暮發熱也一小兒發熱飲食少思大便不實常服蘆薈等丸視其鼻赤此寒凉之劑復傷脾至而虛熱也用五味異功散數劑而愈一小兒十三歲内熱晡熱形體倦怠食少作渇此禀賦怯弱之虛熱也用地黄丸異功散補之不越月而痊一小兒十四歲而近女色發熱吐痰至有室兩目羞明頭覺脹大用地黄丸料加五味子當歸黄茋煎服及補中益氣湯得慎疾而瘥一小兒十四歲肢體倦怠發熱晡熱口乾作渇吐痰如湧小便淋瀝靣目赤色身不欲衣此禀腎不足而虛熱也用補中益氣湯六味丸而愈一小兒五歲發熱作渇右顋鼻凖微赤或與冷水凉藥即時嘔吐余曰右顋微赤肺經虛熱也鼻凖微赤胃經虛熱也先用四君升麻一劑吐止又用白术散二劑而不渇更用四君子湯四劑而安一小兒九歲發熱作渇用瀉黄散大便重墜口角流涎彼欲瀉火余曰鼻凖青白脾胃虛寒肝木所侮也口角流涎脾氣不能攝也大便重墜胃氣不能升也不信竟服凉藥眉唇微動四肢微搐復求治余曰此虚極而變慢脾風矣用六君炮薑當歸木香釣藤鈎二劑益甚欲求更劑余曰藥力未及耳又加炮附子一片即安後去附子二劑而愈一小兒四歲停滯腹痛發熱用大安丸而飲食進又用六君山查神麯四劑而痛止復傷食至暮復熱用六君柴胡山梔升麻而痊此脾虛兼肝火之治法也一小兒發熱體瘦夜間遺尿日間頻數此禀脾腎不足用補中益氣湯加補骨脂及地黄丸加鹿茸治之而痊畢姻後小便頻數作渇發熱服補隂丸等藥發熱尤甚小便如淋用補中益氣湯六味地黄丸而愈一小兒體瘦腹大發熱嗜卧作渇引飲先用白术散為主佐以四味肥兒丸諸症漸愈又用異功散六味丸而愈一小兒十四歲傷食發熱服消食丸胸腹膨脹發熱作渇此脾氣復傷也先用四君升麻柴胡飲食漸進用補中益氣湯而愈後因勞心發熱少食用四君升麻柴胡而愈一小兒傷風咳嗽服參蘇飲加痰盛喘急腹脹不食此脾肺虛而復傷也用六君柴胡桔梗一劑諸症頓愈用六君子湯而痊一女子十四歲發熱至夜益甚久不愈左闗脉弦數右闗脉微按之亦弦此肝火血熱脾胃虛弱先用四物二連湯加柴胡山梔牡丹皮二劑熱稍退又二劑熱頓退再用加味逍遥散白术加三錢數劑而痊嘉靖癸丑閏三月渠下第北歸犬子麟孫方病瀉不食遍體如焚胸滿腹冷痛日夜不成寢或投以山查枳殻中氣愈弱瀉愈甚不食至累月日進米飲一半甌或糕餌􅀥栗少許稍過節度則肢體熱益壯腹痛不解奄奄喘息旦暮不保矣立齋先生枉視之則曰此胃虛不能納脾濕不能運病在戊巳深且久兼木氣所乗脫服攻治之藥則殆矣亟用補中益氣湯數裏熱稍退㵼不食如初先生復曰此勿亟惟胃氣漸復濕漸除當自得效耳改用六君兼補中湯仍服八味丸生命門火以滋脾土如是三月諸症悉退納榖倍常日惟稍遇形役或記誦心勞則潮熱遄發先生復授以歸脾方加梔柴二種熱尋止形氣日充甲寅七月偶觸暑飲冷前症復作間發瘧疾熱晝夜不止先生曰此虛寒偪陽法當舎時從症用補中湯多加炮薑益以生薑二兩及口而瘧止靣色青黄相錯更患痢或謂參茋炮薑不宜先生哂之且曰此固虛弱自利耳徃嘗謂戊巳受病木氣乗之此青黄二色非正形耶仍用補中益氣多加柴胡參术數日而痢止餘症亦漸解脫惟吾兒襁褓失母渠每姑息之故其惟外温而中易怒渠少孤遭家多難藜藿恒不充兒㓜多病失調養故形怯而胃弱致疾之原其所由來者漸矣先生洞微燭幽知其病深且久而堅持獨見以袪攻治之惑吾兒再造之慈何幸得此於先生哉先生之曾大父與先廷評公為中表兄弟先君與先生同宦㳺京師末年尤敦泉石之雅先生盛徳及於犬子能使先人後嗣永存區區志感誠不能盡萬分之一也是嵗冬十月望眷晩生張慕渠頓首頓首嘉靖甲寅敬臣之女年十二患脾胃素弱自夏入秋時㵼時止小腹微痛至八九月間遂成疳積之症發熱凡二十餘日不止汗泄熱解汗已復熱自中脘至小腹膨脹堅直大便溏氣喘咳嗽作噯俱晝輕夜重徹夜煩躁不睡鼻塞眼暗讝語其母以為必死矣立齋先生診之曰脉浮大而無根此大虛證也非獨參湯不可乃用參一兩加熟附三分煨生薑三片日進二劑仍併渣煎服之大下疳積其氣甚腥腹漸寛熱漸減脉漸斂然手猶尋捻不已鼻孔出血先生曰此肝證也煎六味丸料與一服如脫乃晝服獨參參薑附湯夜服六味丸料脉漸有根諸證漸退先此手足恒熱至是乃始覺寒先生喜曰此病邪盡退而真氣見矣然猶飲食不進乃單用六君子湯加炮薑遂能食咳嗽獨甚與補中益氣湯嗽遂止夜始有睡凡弱女之得生皆先生力也向非先生卓有定見専治其本而其末自愈則奄奄一息之軀豈堪雜劑之攻擊哉其為丘中之骨蓋必然矣敬臣感激之餘無由以報敬書施療之顛末以附醫録庶不泯先生之功且以告同患此者幸無所悞亦推廣先生一念之仁於萬一云爾孟冬望日眷晩生王敬臣􅉐首拜書敗毒散治傷風瘟疫風濕頭目昏眩四肢作痛增寒壯熱項强睛疼或惡寒咳嗽鼻塞聲重柴胡前胡川芎枳殻炒羌活獨活茯苓桔梗人參各一兩甘草半兩右每服二錢生薑薄荷水煎滋腎丸治腎熱黄栢酒拌炒焦三錢知母二錢肉桂五分右為末熟水丸桐子大每服二十丸至三十丸食前百沸湯下四順清凉飲治小兒血脉壅實臟腑蓄熱頰赤作渇五心煩熱睡卧不安四肢驚掣及因乳哺不時寒温失度令兒血氣不順腸胃不調大小便澁欲發驚癎或風熱結核頭靣生瘡目赤咽痛瘡疹餘毒一切壅滯挾熱泄瀉不止加木香煨大黄赤芍藥當歸甘草大黄各等分右每服一錢水煎作兩服消風散治小兒解脫致令風邪客於皮毛入於臟腑則令惡風發熱胸膈痰涎目澁多睡方見驚癎胎症小柴胡湯治傷寒温熱身熱惡風頭痛項强四肢煩疼徃來寒熱脇痛耳聾嘔噦痰實中暑瘧疾並服之方見天釣愚按前方若肝膽經風熱肝火瘰癧寒熱徃來日晡發熱潮熱不欲飲食或怒火口苦耳聾咳嗽或脇痛胠滿小便不利或泄瀉吐酸苦水或肢體搐動唇目抽掣及乳母有前症致兒為患者並宜服之抑肝散治肝經虛熱發搐或發熱咬牙或驚悸寒熱或木乗土而嘔吐痰涎腹脹少食睡卧不安方見肝臟梔子清肝散一名柴胡梔子散治三焦及足少陽經風熱發熱耳内作痒生瘡或腹中作痛或胸乳間作痛寒熱徃來柴胡梔子炒牡丹皮各一錢茯苓川芎芍藥當歸牛旁子炒各七分甘草三分右水煎服柴胡清肝散治肝膽三焦風熱怒火或乍寒乍熱徃來寒熱發熱或頭發瘡毒等症柴胡一錢五分黄芩炒人參川芎各一錢山梔炒一錢半連翹甘草各五分桔梗八分右水煎服柴胡飲子解肌熱蒸熱積熱或汗後餘熱脉洪實弦數大便堅實黄芩七分甘草四分大黄八分芍藥七分柴胡人參各五分當歸一錢右每服一錢薑水煎當歸補血湯治肌熱躁熱目赤靣紅煩渇晝夜不息其脉洪大而虚重按全無此脉虚血虚也若悞服白虎湯必死宜此主之黄茋當歸各等分右水煎服三黄丸治三焦積熱眼目赤腫頭項腫痛口舌生瘡心膈煩躁不美飲食大小便秘澁五臟實熱或下鮮血瘡癤熱症黄連黄芩大黄煨各等分右為末煉蜜丸桐子大每服三十丸白滚湯下量大小加減服白虎湯治傷寒或吐或下後七八日邪毒不解熱結在裏表裏俱熱時時惡風大渇舌上乾燥而煩欲飲數升者宜服之又治夏月中暑汗出惡風寒身熱而渇知母三兩甘草一兩炙石膏八兩另研糯米三合右每服二三錢水煎至米熟為度瀉黄散方見脾臟瀉心湯方見心臟地黄散方見腎臟清凉飲柴苓散二黄犀角散牛黄散黄龍湯牛黄膏梔子仁湯六物黄芩湯五物人參飲地骨皮散十方見潮熱惺惺散理中湯二方見咳嗽加人參即人參理中湯龍膽湯紫霜丸二方見噤風撮口四物湯方見急驚六神散方見夜啼白术散方見積痛羌活散方見驚風下積丸方見積滯補中益氣湯大安丸即保和丸加白术二方六君子湯四君子湯加味逍遥散異功散四方見内釣瀉白散方見肺臟瀉青丸方見肝臟凉膈散方見瘡瘍八珍湯方見寒熱潮熱錢仲陽曰潮熱者時間發熱過時即退來日依時而至有風寒疳積食癖之分隂陽虚實五臟之異如汗出身熱呵欠靣赤者風熱也傷寒時疫隂陽相勝外感熱也肌瘦口乾骨蒸盗汗疳熱也大小便閟澁汗下不解積熱也腹背先熱夜發旦止食熱也涎嗽飲水乳食不消癖熱也又有煩熱者氣麄喘促心躁不安頰赤口瘡兼發癎症瘡疹熱者耳鼻尖冷血熱者己午間發至夜則凉虚熱者困倦少力發於病後陽邪干心則來去不定隂陽相勝則寒熱如瘧前症在小兒有因乳母或姙娠七情厚味遺熱或飲食停積衣衾過煖及頻浴熱湯而為患若寅卯辰時熱而力盛飲水者肝經實熱也用柴胡清肝散熱而力怯飲湯者肝經虚熱也用六味地黄丸己午時熱心經也實用導赤散虛用秘㫖安神丸申酉戌時熱肺經也實用瀉白散虚用秘㫖保脾湯亥子丑時熱腎經也用地黄丸大凡壯熱飲水大便秘結属實熱用二黄犀角散下之熱渇飲湯大便如常属血虛用四物湯補之若下後隂虛陽無所附而仍熱用四物參茋汗出陽虛隂無所生而仍熱用四君芎歸若汗下後煩渇靣赤血虚發躁也當歸補血湯若見驚搐等症肝血虛而内生風也用四物天麻釣藤鈎頰赤口乾小便赤澁大便焦黄表裏俱實熱也用清凉飲子如大便已利或熱未止表邪未解也惺惺散未應加麻黄微汗之旣汗而仍熱此表裏俱虛氣不歸原陽浮於外而虛熱也六神散加粳米陽氣下陷於隂中而發熱者用補中益氣湯若乳下嬰兒當兼治其母一小兒潮熱煩渇大便乾實氣促咳嗽右顋色赤此肺與大腸有熱用柴胡飲子一服􅉐愈後因微驚發搐咬牙頓悶此肝脾氣血虛也用四君芎歸釣藤鈎而愈一小兒潮熱發躁左腮青赤此心肝血虛用秘㫖安神丸及四物防風酸􅀥仁漸愈又用六味地黄丸調補肝腎而痊一小兒潮熱發搐痰涎上湧手足指冷左顋至申酉時青中隱白手足時搐此肝經虚弱肺金所勝而潮搐脾土虛弱而手足冷也用補中益氣湯調補脾肺用六味地黄丸滋補肝腎而愈蓋病氣有餘當認為元氣不足若用瀉金伐肝清熱化痰則誤矣一小兒寅卯時發熱或兼搐有痰服抱龍瀉青二丸而愈後復患服前藥兼咳𠻳氣喘不時發搐靣赤色或青黄或浮腫或流涎余謂咳嗽氣喘脾肺氣虚也不時發搐肝木乗脾也靣青黄肝入心脾也浮腫流涎脾氣虚也用益智丸以養心血補中益氣湯以補脾氣而愈一小兒腹痛作嘔飲食少思至暮腹脹發熱此脾虚下䧟朝用補中益氣湯夕用六君柴胡升麻而愈後因勞不時寒熱夜間盗汗用十全大補湯而愈一小兒夜間發熱腹脹余謂脾虛肝盛朝用五味異功散夕用四味肥兒丸熱止乃朝用六味地黄丸夕用異功散而痊一小兒已午時發熱驚悸發時形氣倦怠而黄􅂴食流涎飲湯余謂心氣不足所致不信反服凉心之藥更加吐瀉睡而露睛手足並冷㡬至慢脾風先用六君薑桂佐以地黄丸而愈一小兒亥子時患前症用益黄散而愈後復發服前藥及清熱之劑病發不時嗜卧露睛作渇少食大便頻黄予謂脾虚而肝木勝之兼元氣下陷也用補中益氣湯佐以地黄丸而愈一小兒先停食服尅伐之藥致靣色痿黄體倦少食申酉時潮熱或用清熱消導之劑更加泄瀉予先用六君子湯數劑後用補中益氣湯漸愈一小兒申酉時發熱靣赤腹中作痛或用峻利之劑下之致發搐吐痰作渇腹痛按之即止此脾胃傷而變症也用七味白术散補中益氣湯頓安柴苓散治壯熱來去柴胡麥門冬去心焙人參赤茯苓甘草各半兩黄芩一兩右為末每服二錢入小麥二十粒青竹葉三片水煎服二黄犀角散治温壯心熱神不安大腑秘結犀角屑大黄酒浸蒸釣藤鈎梔子仁甘草黄芩各半兩右為末每服五分熱湯調下量兒加減牛黄散治温壯常熱或寒熱徃來牛黄研甘草各半兩柴胡梔子酒炒龍膽草酒炒黄芩炒各二錢五分右為末每服五分以金銀薄荷湯調下黄龍湯治發熱不退或寒熱徃來柴胡五錢黄芩炒甘草炙各二錢赤芍藥三錢右每服一錢薑􅀥水煎牛黄膏治壯熱咽喉涎響或不省人事或左右手偏搐或唇口眼鼻顫動此熱涎内蓄風邪外感也宜急服之蝎尾四十九枚巴豆肉去油膜一錢五分梅花腦半匙辰砂研二錢牛黄少許麝香一匙鬱金三錢皂角水煮右為末每服一匙蜜水調下量兒虚實用之梔子仁湯治陽毒壯熱百節疼痛下後熱不退者梔子仁酒炒赤芍藥大青知母各一兩升麻黄芩酒炒石膏各二兩柴胡一兩五錢甘草五錢杏仁二兩浸去皮麵炒微黄右每服三錢生薑三片水煎服六物黄芩湯治壯熱腹大短氣徃來寒熱飲食不化黄芩酒炒大青甘草炙麥門冬去心石膏各半兩桂三錢右每服一二錢水煎服五物人參飲治壯熱咳嗽心腹脹滿人參甘草各半兩麥門冬去心生地黄各一兩半茅根半握右每服二三錢水煎服益智丸治脾腎虚熱心氣不足益智仁茯苓茯神各等分右為末煉蜜丸桐子大每服五六十丸空心白滚湯下亦治白濁四物二連湯治血虚勞五心煩熱晝則明了夜則發熱脇肋并一身盡熱日晡肌熱當歸生地黄白芍藥川芎黄連胡黄連各等分右水煎服地骨皮散治虚熱壯熱知母柴胡甘草人參地骨皮茯苓半夏各等分右薑水煎有驚熱加蟬退天麻黄芩抱龍丸方見傷寒六味丸方見腎臟七味