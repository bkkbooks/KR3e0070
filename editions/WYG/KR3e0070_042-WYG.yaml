body:
  text: 薛氏醫案卷四十二明薛己訂婦人良方産後門産難既明須知産後疾病故以次之産後將䕶法第一婦人産畢飲熱童便一盞閉目少坐上床倚故立膝仰卧不時喚醒及以醋塗鼻或用醋炭及燒漆器更以手從心擀至臍下使惡露不滯如此三日以防血暈血逆酒雖行血亦不可多恐引血入四肢且能昏暈宜頻食白粥少許一月之後宜食羊肉猪蹄少許仍慎言語七情寒暑梳頭洗足以百日為度若氣血素弱者不計日月否則患手足腰腿痠痛等症名曰蓐勞最難治療初産時不可問是男女恐因言語而泄氣或以愛憎而動氣皆能致病不可獨宿恐致虛驚不可刮舌恐傷心氣不可刷齒恐致血逆須血氣平復方可治事犯時微若秋毫成病重如山嶽可不戒哉産後調理法第二産後將息如法臟腑調和庶無諸疾苦須先服黒神散四物湯四順理中丸七寳散若壯熱頭痛此乳脉將行用玉露散頭目不清是血暈用清魂散粥食不美是胃氣虚用四順理中丸愚按丹溪先生云肉汁發隂經之火易成内傷之病當歸丸當歸建中湯四順理中丸雖滋補悉犯桂附乾薑僣熱之劑臟腑無寒何處消受若夫兒之初産母腹頓寛便啖雞子火鹽不思雞子難化火鹽發熱展轉為病醫者不識妄指他病率爾用藥寧不誤人予每見産婦之無病者皆不用黑神散與雞子火鹽諸般肉食毎白粥調理間以些小石首魚乾淡食之至半月以後少食雖雞子亦豁開煮之方能養胃却痰彼富貴之家嬌姿之婦率有白帶頭風氣痛膈滿痰逆口乾經事不調髮脱體熱皆因失於調理所致也産後通用方第三愚按前方即産後諸症各門自有方論主治故不再録胞衣不出論第四郭稽中曰胎衣不下者因氣力疲憊不能努出或血入衣中脹大而不能下以致心胸脹痛喘急速服奪命丹血散脹消其衣自下牛膝散亦效愚按前症若出而氣虛不能入用補中益氣湯或萆麻子仁一兩研塗母頭頂心即上若胎衣不下用萆麻子仁塗右脚心胎衣下急洗之緩則胎衣仍入益母丸亦效若胎衣未下若欲斷臍帶須先以少物繫墜然後斷之附治驗一婦人胞衣不出胸腹脹痛手不敢近用滚酒下失笑散一劑惡露胎衣並下一産婦胎衣不出腹作痛手按痛稍緩此氣虚而不能送出也用無憂散而下前症常詢諸穏婆云宜服益母草丸或就以産婦頭髮入口作嘔胎衣自出其胎衣不出者必死授與前法效奪命丹附子半兩炮牡丹皮一兩大黄末一兩乾漆一錢炒煙盡右為末醋煎大黄成膏丸桐子大温酒吞五七丸花蕋石散治産後敗血不盡血迷血暈腹中胎衣不下至死心頭煖者急用一服化水即出其效如神花蕋石一斤上色硫黄四兩右和匀先用紙泥封固瓦罐一箇入二藥仍封固隂乾如急用以焙籠内炙乾用炭煆赤去火次日取出細研每服一錢童便熱酒下牛膝散治胎衣不出腹中脹急服此藥腐化而下緩則不救牛膝川芎朴硝蒲黄各三兩當歸一兩五錢桂心五錢右每服五錢薑三片生地黄一錢水煎附方補中益氣湯方見二十四卷第六論失笑散方見十六卷第五論無憂散方見十六卷第三論益母草丸方見十三卷第九論又方用竈下土三四錢好醋調和納臍中續煎生甘草湯半盞或以醋湯飲之即出又方用萆麻子仁研爛塗足心下即洗去又方用紅花一兩酒煮濃汁服又方用鹿角鎊三錢為末煮葱白湯調服又方取産母鞋底灸熱熨小腹上下二七次又方用浸苧水濃煮温飲二碗立下又方用皁角棘燒為末每服一錢温酒調産後血暈方論第五産後血暈乃血入肝經甚至眼花昏悶用黑神散主之下血過多用清魂散補之或以醋湯細飲或預燒秤錘以醋沃之或釅醋塗口鼻或燒漆器薫之使産母鼻吸其氣庶無此患愚按前症若惡露上行用失笑散血下過多芎歸湯若過勞所傷補中益氣湯氣血虛極用清魂散大凡産後口眼喎斜等症當大補氣血為主而兼以治痰若脾胃虛弱用六君子湯苟於七月之前服安胎飲至八九月間加大腹皮黄楊頭元氣虛弱八珍湯臨産用無憂散則無前患附治驗一婦八月胎下墜或動面黄體倦飲食少思此脾氣虛弱用補中益氣湯倍白术加蘇梗三十餘劑而安産後眩暈胸滿咳嗽用四物加茯苓半夏桔梗而愈一姙婦因産飲酒惡露甚多患血暈口出酒氣此血得酒熱而妄行虚而作暈也以佛手散加煨甘葛二錢一劑而痊酒性慓悍入月及産後不宜飲恐致前症産室人衆氣熱喧攘亦致此症奪命丹治血暈腹痛没藥血竭末等分每服二錢熱童便熱酒下牡丹皮散治産後惡露悶絶牡丹皮芒硝大黄蒸各一兩冬𤓰仁三七粒去皮尖右每五錢水煎服清魂散治産後氣血暴損虛火妄動血隨火上以致心神昏亂口噤眼花甚至悶絶而甦澤蘭葉人參各一錢荊芥三錢川芎一錢右各另為末和匀每服一二錢熱湯和酒調灌之當歸芍藥湯方見十二卷第十二論一方五靈脂末半生半炒每服二錢温酒灌入喉即愈一方荆芥為末童便調一方神麯末每服二錢熱水調一方韮菜切入瓶内注熱醋以瓶口對鼻氣入即醒一方用紅花末五錢酒調服一方半夏為末丸豆大入鼻中即省亦療五絶一方赤小豆為末東流水和服錢許不瘥再服佛手散治産後去血眩暈欲絶方見十二卷第七論又方松煙墨二錢燒赤窨滅為末温酒調半匕京墨亦可或燒漆器取煙薰之附方失笑散方見二十卷第五論補中益氣湯六君子湯四物湯三方見二十四卷第六論安胎飲方見十二卷第二論無憂散方見十六卷第二論産後顛狂方論第六産後顛狂乃敗血上衝用大聖澤蘭散加砂仁末三分煎酸棗仁湯調下或硃砂二錢研細以乳汁調和入紫項活地龍一條滚二三沸去之入酒再用重湯煮温分三服愚按前症乃血虚神不守舍非補養元氣不可仍叅後各門互用附治驗一産婦患前症或用大澤蘭湯而愈後又怔忡妄言其痰甚多用茯苓散補其心虛頓愈又用八珍散加逺志茯苓養其氣血而瘥一産婦亦患此用化痰安神等藥病益甚神思消爍余以為心脾血氣不足用大劑參术芎歸茯神酸棗仁四觔餘而安乃以歸脾湯五十餘劑而愈附方隠居澤蘭湯方見二十卷第六論茯苓散方見十九卷第三論八珍湯歸脾湯二方見二十四卷第四論産後狂言譫語方論第七産後狂言譫語乃心血虚也用硃砂末酒調下龍虎丹參丸琥珀地黄丸亦可如驚悸歌哭顛狂等症當參十九等卷治之愚按前症當固胃氣為主而佐以見症之藥為善若一於攻痰則誤矣附治驗一産婦形體甚倦時發譫語用柏子仁散稍愈又用加味歸脾湯而愈又因怒仍狂言脇痛小便下血用加味逍遥散以清肝火養肝血頓瘥又佐以加味歸脾湯而安治敗血上衝發熱狂走脉虛大者乾荷葉生地黄牡丹皮等分右濃煎湯調生蒲黄二錢服之即止妙香散治産後語言錯亂用生地當歸煎湯調服立効方見六卷第八論附方小柴胡湯方見二十四卷第二論栢子仁散方見十九卷首論加味歸脾湯方見二十四卷第四論産後不語方論第八産後不語因心氣虚而不能通於舌則舌強不能言語者宜服七珍散餘當推其所因而治之可也愚按經云大腸之脉散舌下又云脾之脉是動則病舌本強不能言又云腎之别脉上入于心繫舌本虛則不能言竊謂前症若心腎氣虚用七珍散腎虛風熱地黄飲大腸風熱加味逍遥散加防風白芷脾經風熱秦芁升麻湯肝經風熱柴胡清肝散加防風白芷脾氣鬱結加味歸脾湯加升麻肝木太過小柴胡加釣藤鈎脾受土侮六君加升麻白芷釣藤鈎肝脾血虛用佛手散脾氣虛用四君子氣血俱虛八珍湯如不應用獨參湯更不應急加附子補其氣而生其血若竟用血藥則誤矣附治驗一産婦不語用七珍散而愈後復不語内熱晡熱肢體倦怠飲食不進用加味歸脾湯為主佐以七珍散而愈後因怒不語口禁腰背反張手足發搐或小便見血面色或青或黄或時兼赤余曰面青肝之本色也黄者脾氣虛也赤者心血虛也用八珍湯加鈎藤鈎茯苓逺志漸愈又用加味歸脾湯而痊七珍㪚人參石菖蒲生地黄川芎各一兩細辛一錢防風辰砂别研各半兩右為末每服一錢薄荷湯調胡氏孤鳳散治産後閉目不語用生白礬末每服一錢熱水調下治産後不語人參石蓮肉不去心石菖蒲等分右每服五錢水煎附方地黄飲方見三卷第四論加味逍遥散加味歸脾湯八珍湯三方見二十四卷第四論秦芁升麻湯方見三卷第一論清肝散方見二十四卷第三論小柴胡湯方見二十四卷第二論六君子湯四君子湯二方見二十四卷第六論佛手散方見十二卷第七論獨參湯方見三卷第十三論薛氏醫案卷四十二
