body:
  text: 薛氏醫案卷六十四明薛已訂保嬰撮要丸腫瘍腫瘍者以瘡瘍未潰而言也經云形傷痛氣傷腫又云榮氣不從逆於肉裏乃生癰腫皆因稟受胎毒或乳母膏粱厚味七情陰火或兒食炙􅏼甘美積毒氣血不和所致當分其經絡所屬五臟相勝與元稟虧損預為審用攻補調和之劑速令散潰尢當審其勢之腫漫色之赤白與痛有㣲甚毒有表裏若腫髙焮痛便利調和邪在表也宜表散之腫硬痛深大便秘澁邪在内也宜下之外無拘急内則便利調和者邪在經絡也宜調榮衞腫焮大痛或麻木不痛邪氣凝滯也用隔蒜灸及活命飲若煩躁飲冷赤痛發熱二便不通者火熱内熾也用清凉飲活命飲加大黄尤善若㣲腫㣲痛或不痛陽氣虛弱也用參茋托裡散微黯微赤或不赤陽氣虗寒也用加味托裡散若惡寒而不作膿若膿熟而不潰者陽氣虗也用加味托裡散如此則未成者自能消散已成者自能潰腐尤當别其屬隂屬陽或半隂半陽而治之若泥於腫􅅑禁用辛熱之說不分受症之因兼症之經槩行敗毒泛擾諸經誅伐無過以致不能起發或不能腐潰收斂變症莫能枚舉癰疽論云腫􅅑内外皆壅宜以托裡表散為主但見腫痛叅之脉症虗弱便與滋補氣血無虧可保終吉嬰兒有疾兼調其母若腫瘍之際治失其法必致潰瘍之變症此推内經之微㫖而生平之徵驗者尤當觸類而長愚奚庸贅潰􅅑潰瘍者以瘡瘍腫潰而言也膿潰而腫消痛止者為順若膿潰腫痛或發寒熱者氣血虗也用十全大補湯膿潰欲嘔少食脾胃虗弱也用六君炮薑手足並冷者脾氣虗寒也用六君薑桂如不應急加附子膿潰而仍痛或二便秘濇者熱毒未解也用清熱消毒散熱退而渇不退津液不足也用八珍加黄茋麦門山茱茰熱止而小便頻數腎虗也用加减八味丸料若熱不止或腫痛反甚虗熱内作也用人参黄茋湯或熱退而肌肉不生者氣血俱虗也用十全大補湯瘡色大白或陷下不斂寒氣所襲也用五味異功散佐以豆䜴餅膿血過多煩躁不安乃亡陽也急用獨参湯尤當審其腫之軟硬飲食冷熱與膿之稀稠多少肉之赤色微甚青黯及瘡口之收斂遲速而投托裡消毒調補之劑庻無變症癰疽論云潰瘍内外皆虗宜以托裡補接為主葢潰瘍之變症因由於腫瘍之際治失其宜虧損元氣之所致治者可不慎哉胎毒發丹胎毒發丹者因胎毒内伏或頻浴熱湯或著烘衣或乳母飲食七情内熱助邪為患發頭靣四肢延及胸腹色赤遊走不定古人云從四肢起入腹嚢者皆不治當急令人隨患處遍吮毒血各聚一䖏砭出之急服活命飲惟百日内忌砭以其肌肉難任也若發散過劑表虗熱而赤不退者用補中益氣湯加防風白芷寒凉過劑胃氣受傷而熱赤不退者用異功散加柴胡升麻或兼發搐等症用四君升麻當歸釣藤鈎若復行攻毒必致不起頭額間患者當卧鎌砭之史少叅孫二嵗丙申正月隂嚢赤腫余作胎毒治瘥後患發熱痰盛等症診其母有鬱火血熱用觧鬱涼血之藥子母俱服而愈至六月初患吐㵼兩眼瞤動或投参术之類不應以為慢驚欲用附子藥請余議視其寅邜闗脉赤此屬風熱傷脾用柴胡清肝散加釣藤鈎木賊草一劑即愈丁酉正月初旬頸患熱毒膿出貼藥忽暴風啟戸即時發熱翌日頭靣黯腫如斗兩耳厚寸許此風邪上攻血得熱而沸騰也急砭兩額出黒血三盞許隨用清熱化毒湯黯腫十退七八翌日復砭則血不甚黒矣仍以前藥去牛蒡子加熟地黄而愈此症若不行砭法或作破傷風治必死一小兒四肢患之外勢雖輕内則大便秘結此患在臓也服大連翹飲敷神效散而瘥一小兒患之赤暈走徹遍身難以悉砭令人吮四肢胸背數處使毒血各凝聚而砭之先用活命飲末酒調二服又以金銀花甘草節為末用人乳汁調服漸愈月餘後兩足皆腫仍砭之服前藥而痊數日後兩足復赤或用犀角解毒丸之類致乳食不進肚腹膨脹此復傷脾胃而然也敷神功散服補中益氣湯加茯苓而痊一小兒腿如霞片遊走不定先以麻油塗患處砭出惡血其毒即散用九味解毒散而安一小兒臂患之砭出毒血而愈惑於人言服䕶心散以杜後患服之吐㵼腹脹患處復赤手足並冷余謂此脾胃虗弱前藥服傷用六君湯一劑頓愈又以異功散加升麻柴胡而痊一小兒患此砭之而愈但作嘔不食流涎靣黄余謂此脾氣虗弱用異功散加升麻治之吐止食進又用補中益氣湯涎收而安一小兒患此砭之而愈翌日發搐作嘔手足並冷此胃氣虗而肝木侮之用異功散加藿香木香諸症頓止又用異功散加升麻柴胡而痊一小兒患此砭之而愈但靣赤作嘔飲冷余謂胃經熱毒未解先用仙方活命飲又用清熱消毒散各一劑而愈一小兒腿上患之神思如故乳食如常余謂毒發於肌表令急砭出毒血自愈不信外敷寒凉内服峻劑腹脹不乳而死一小兒遍身皆赤砭之投以解毒藥而愈一小兒患此二便不利隂嚢肚腹俱脹急用砭法隨以活命飲加漏蘆木通大黄為末時用熱酒調服至兩許二便俱通諸症頓退却去三味仍前時服而愈一小兒患此二便不利腹脹咳𠻳用活命飲加漏蘆木通麻黄為末時時熱酒調服二便隨通遍身出汗諸症頓退鼻息似絶無氣以動時或似躁此邪氣去而元氣虗也急用當歸補血湯而愈砭法治丹毒赤色遊走不定令口吮毒血各聚一處用細磁器擊碎取有鋒芒者以筯頭劈開夹之用線縛定兩指輕撮筯頭稍令磁芒對聚血處再用筯一根頻擊刺出毒血輕者止用口吮出毒用藥敷之如患在頭者不用砭法止宜用針卧倒挑患處以出毒血遲則毒血入腹而難起矣神功散治丹毒最效若砭後毒甚者宜用如毒輕者砭之後不可用恐砭處皮膚既破草烏能作痛也仙方活命飲清熱化毒湯清熱消毒散柴胡清肝散補中益氣湯小柴胡湯大連翹飲柴芍参苓飲九味解毒散傷寒發丹傷食發丹者因脾胃之氣未充乳食過多不能運化藴熱於内而逹於肌表也若因乳食停滯者先用保和丸消之大便秘結量加大黄通之乳食既消而丹尚作者用清中觧鬱湯治之丹邪既去而乳食不思者用五味異功散補之發熱作渇或飲食少思者用七味白术散補之大凡飲食厚味所致者赤暈或行而緩慢若飲燒酒或誤吞信石所致者遍身赤暈其行甚速又有瘡瘍發焮周圍有赤暈其熱消散或膿出自退凡此俱忌砭法皆宜安裡為主不可攻伐若自吐㵼亦不可止之吐㵼中有發散之意因飲燒酒者飲冷米醋一二杯解之此神妙之法也因母多食炙􅏼膏粱或飲燒酒或服辛熱燥藥或鬰怒傷肝脾致兒為患者當叅胎熱毒瘡瘍治之一小兒靣色皎白手足常冷傷食患丹余謂此因脾胃虗弱不信另用尅伐之劑更吐㵼腹痛吐涎不乳口舌生瘡此脾胃復傷而虗寒格陽在外非實熱也先用六君乾薑又用五味異功散而愈一小兒每停食發赤暈此脾虗食鬰用清中解鬰湯而愈越月忽揺頭咬牙痰甚發搐嘔吐酸腐此食鬰傷脾也待其吐盡翌日少與白术散而愈又服前散月餘遂不復患一小兒停食便秘四肢赤色此飲食藴毒於内用枳實黄連厚朴山查神􅎘而便通赤觧更頭暈咳𠻳此脾氣虗而不能生肺金也用六君桔梗以補脾肺山查神􅎘以消飲食而痊一小兒患此服發表之劑手足抽搐服驚風之藥目瞤痰甚余謂脾胃虧損肝木所勝之虗象無風可袪無痰可逐用六君子湯一劑而安再劑而瘥一小兒停食服通利之劑患丹作嘔腹脹此脾氣復傷也用補中益氣湯五味異功散而愈一小兒因母食炙􅏼酒麺兩臂前膁各漫腫一塊有根四畔赤暈相圍余謂患處屬胃經因胃經積熱而為患也用清胃㵼黄二散治之而消設謂丹毒輙用砭法及敗毒之藥反促其危矣一小兒停食身發赤暈用清中解鬰湯而愈越月忽揺頭咬牙痰盛發搐吐出酸腐待其吐盡翌日少以七味白术散次日又以參苓白术散調理脾胃遂不復患大抵吐後兒安不必服藥也一小兒停食大便不通四肢赤暈余用枳實厚朴山查神􅎘大便遂通赤色亦止更又眩暈咳𠻳此乃脾氣虗而不能生肺金也用六君子湯而愈一小兒停食靣赤用清熱發散之藥遂腹脹痰喘倦怠惡寒此亦脾胃傷而肺金不能生仍用六君加桔梗以補脾肺又以山查神􅎘以消餘食頓愈一小兒患此服發表之劑手足抽搐服抱龍丸目瞤氣喘痰甚此脾胃虧損而成慢驚也無風可袪無痰可逐此虗象也用六君加附子一劑而安再服全愈一小兒停食患前症服辛熱之藥腹脹如蠱脉洪而數内作膿也不信果便膿而死保和丸方見虗羸五味異功散方見敗毒之藥清中解鬰湯七味白术散六君子湯清胃散四方見腹癰補中益氣湯方見肌肉不生㵼黄散方見頭靣瘡胎毒瘡瘍胎毒瘡瘍皆禀於父母胎熱或乳母飲食之毒七情慾火所致不可専治小兒亦湏兼治乳母小兒即安瘡瘍當服和解不宜服峻劑一小兒患於左耳邊漸延頭上作痒此禀肝膽經脉數此禀生母肝火所致乳母有肝火而益甚也又數日作吵不安手足時搐此因作膿焮痛而然又三日早間以指㣲按瘡頭腫隨指復起其膿已成也至午瘡頂起薄皮膿已熟也㸃代針膏将晩出膿兒頓安腫赤頓消此瘡家最善症也貼太乙膏以䕶風寒乳母服逍遥散而愈一小兒生下臂外膁腫一塊寸許月餘忽赤腫二寸許外赤暈勢欲走散此膿毒内焮針之隨出膿赤暈退兒即安診乳母肝膽脉弦數按之有力先用加味小柴胡湯加黄連二劑去黄連又二劑却用加味逍遥散與乳母服兒尋愈一小兒生下大腿腫寸許一塊靣目色白將朞敷藥而潰膿水清稀二朞而未愈後呵欠咬牙此禀腎虗朝用補中益氣湯夕用地黄丸料與母子同服半杯年餘而愈一小兒生下左脇間一塊漫腫無頭肉色不變敷鐵篐散而膿清欲嘔余謂禀肝經氣滯而脾氣虗不能愈也先用異功散加柴胡升麻以補脾胃又以托裡散加柴胡山梔以托裡清肝其子亦飲數匙三月而愈一小兒生下小腹患腫一塊年餘不潰寒熱徃来此禀肝火而然也其母果經事不調内熱體倦用地黄丸八珍湯與母服子日服半杯尋愈一小兒生下胸脇間腫赤年餘不消余謂禀肝血熱但治其母不信另用鐵篐散犀角丸作嘔不乳此胃氣虗而復傷余用五味異功散救子之胃氣用加味逍遥散治母之肝火頓愈一小兒生下遍身無皮色赤原母素食膏粱之物以寒水石一兩炒焦黄栢二兩浄黄土四兩俱為細末時敷遍身母服清胃散加漏蘆五日赤少淡却用黄土五兩炒焦黄栢一兩敷之母服加味逍遥散又三日赤頓淡水頓少又三日但敷黄土一味母服八珍湯加牡丹皮柴胡而愈一小兒生下有疥審其母素鬰怒用消毒散以當歸膏調敷母服加味逍遥散加漏蘆及加味歸脾湯而愈後復發為母食膏粱用清胃散及敷前藥而愈一小兒生下有痔瘡三嵗後作痛服化毒丹犀角丸以治大膓之火更腹痛作㵼咬牙呵欠仍欲治火余曰呵欠咬牙属肝經之病内經云因而飽食筋脉横解腸澼為痔此禀肝火為患兒服地黄丸母服逍遥散加漏蘆而愈一小兒隂嚢赤痒或時如無皮状兩目常閉服化毒丹益甚余曰化毒丹犀角丸治脾胃實火之劑前症乃禀肝腎經隂虗也不信仍服之㡬危余用六味地黄丸四味肥兒丸母服加味逍遥散而痊一小兒生下隂嚢赤腫余謂禀腎肝隂虗不信另用化毒丹之類前症益甚更嘔吐不乳手足並冷此脾胃被傷先用五味異功散母用大劑地黄丸料加炒黒黄栢及漏蘆與數劑而消其時患是症服化毒丹敷涼藥者俱不救一小兒生下臀尖㣲腫寸許一塊敷鐵篐散服化毒丹越月腫起色赤啼聲不絶以指按之隨手復起此膿内􅍄而痛也遂針之出稠膿啼聲即止余謂血氣無虧不必用藥彼欲速效另犀角丸致吐㵼發搐欲投驚藥余曰此因脾胃虧損而内生風耳急以人参一兩細切和壯婦乳一鍾置粥釜中煮良乆取出絞乳汁以綿作乳頭様者蘸乳頻與兒吮之一日吮盡却服乳化地黄丸母日服八珍湯加漏蘆不月而愈一小兒生下臀内膁赤腫二寸許一塊有膿内潰遂針之出濃甚多随眼閉咬牙余謂眼閉脾氣虗不能開也發搐咬牙乃脾氣虗而肝火動也以人参如前漬乳兒吮母服八珍湯加漏蘆月餘而瘡愈一小兒生旬餘頭患毒髙寸許有赤暈勢危急卧鎌砭出黒血兒即安翌日眉間有患亦有赤暈余意宜即砭之衆議第二日砭之果血凝不出腹脹而歿敷藥鐵篐散治一切瘡癤癰疽芙蓉葉黄柏大黄五倍子白芨右為末用水調搽四圍按前方乃寒凉解熱收斂之劑或有用白蘝商陸根者有用寒水石天花粉者有用蒼耳金銀花者有用芭蕉赤小荳者有用草烏白芷之類者皆不分寒熱温凉之雜餌内經云先腫而後痛者形傷氣也先痛而後腫者氣傷形也又云五臟不和九竅不通六腑不和瘤結為癰外科精義云凡瘡腫高而軟者發於血脉腫下而堅者發於筋脉肉色不變發於骨髓葢必有諸中而後形諸外故受症之經與所患之位各有不同豈宜一概外敷凉藥惟脾胃無虧血氣不和者庶幾有效若服化毒之類脾胃復傷運氣凝滯亦不能消矣至如疔瘡之𩔖正欲宣拔其毒若復用前藥肌肉受寒血氣凝滯必至毒氣入内而不救治法必察其腫之高漫色之赤白痛之微甚作膿之難易出膿之稠薄生肌之遲速以别其屬隂屬陽或半隂半陽或純隂純陽而用相宜之藥以凉之熱之和之又當審受症之傳變五臟之相勝而以調補脾胃為主庶不致變惡症也五福化毒丹治胎毒及痘後頭面生瘡眼目腫痛生地黄杵膏熟地黄自製杵膏天門冬去心杵膏麥門冬去心杵膏𤣥參各三兩甘草甜硝各二兩青黛一兩五錢右為末煉蜜丸如芡實大每服一丸白滚湯化下甜硝即朴硝以滚湯製過者便是按前症服此而發搐痰喘者皆中氣受傷而變虚熱也急服五味異功散若手足並冷者中氣虚寒也前湯加薑桂多有生者犀角消毒丸治積熱及痘疹後餘毒生瘡生地黄防風犀角屑鎊荆芥穗當歸各一兩牛蒡子杵炒赤芍藥連翹桔梗各七錢薄荷黄芩甘草各五錢右為末煉蜜丸如芡實大每服一丸薄荷湯化下按前二方善損中氣傷隂血若大人形病俱實脾胃健旺者庻可用之恐芽兒臟腑脆嫩不能勝此經云氣主􅌵之血主濡之氣者胃中冲和之元氣若胃氣一傷不能􅌵濡消散膿已成者不能腐潰膿已潰者不能生肌收斂因而難治甚致不起不可不慎也八味茯苓補心湯治心氣不足血氣不和而患瘡症愚製茯苓酸􅀥仁炒各二錢五味子炒一錢人參一錢五分當歸一錢白术炒一錢逺志去心六分菖蒲五分炒甘草五分右作二三服水煎柴胡梔子散方見脇􅏴托裡散方見熱毒熱毒瘡瘍熱毒瘡瘍因食膏粱厚味或乳母七情鬰火所致若腫臖作痛氣血凝滯也用仙方活命飲口渇便秘熱毒内藴也用四順清凉飲佐以如聖餅腫硬色赤熱毒凝聚也用活命飲佐以隔蒜灸腫焮不消欲作膿也用托􅂻消毒散不成膿或成膿不潰氣血虗也用八珍湯潰而肉赤不斂脾血虗也用四物參术肉白而不斂脾氣弱也用四君芎歸食少體倦而不斂脾氣虗也用六君當歸升麻凡藥對症無有不愈設或妄行攻毒元氣虧損則變惡症而難治矣大抵瘡瘍屬腑者易治元氣無虧者不治自愈屬臟者難治元氣虧損者則變為惡症誤行尅伐元氣虧損尤難療理故切不可用峻厲之劑觀東垣丹溪云但見腫痛叅之脉症虗弱便與滋補血氣無虧可保終吉若用驅逐敗毒不免有虗勞之禍矣一小兒患之腫焮敷服敗毒之藥腫益甚更作嘔視其寅闗脉青赤此肝經風熱之毒中氣復傷而然也用五味異功散加柴胡升麻再用補中益氣湯加白芷桔梗而愈一女子十嵗餘耳下連項赤腫寒熱頭痛恪敷鐵篐散此少陽膽經火症内作非鐵篐散所能愈余用梔子清肝散而愈一小兒所患同前右闗脉數按之則弦作嘔懶食此肝木尅脾土所致用小柴胡湯去黄芩加茯苓芍藥而愈一小兒患之余謂禀肝脾氣滯不信用鐵篐散犀角丸而嘔吐少食手足並冷此脾胃受傷也子用五味異功散加术香母用加味逍遥散加味歸脾湯而消一小兒缺盆患之内外敷服敗毒之藥發熱腫痛按之則軟此膿内潰也喜其右腮白左腮黄乃脾肺相生其病昜愈遂針出膿用托裡散而愈一小兒頭􅆕患之服清胃之藥腫痛益甚余謂毒氣熾盛而淤血不散也用仙方活命飲二劑而愈後因傷食朝寒暮熱頭􅆕仍患之服降火之劑口舌赤腫手足並冷余謂胃氣復傷而虗寒也用五味異功散而愈一小兒頭患癤甚多寒熱作痛時季夏乃形病俱實先用人参敗毒散加黄連香薷一劑其痛頓止次用仙方活命飲末三服大者出膿小者自消後食厚味復發用清胃散活命飲各一服而愈一小兒素食炙煿不時患之此膏粱積熱所致用清胃㵼黄二散將愈又停食服巴豆之藥口舌赤爛頭􅆕生瘡此胃氣復傷而内熱也用人参安胃散而愈一小兒不時患之兼頬側結核此肝疳之症先用龍膽㵼肝湯二劑以治肝火又用四味肥兒丸五味異功散加升麻柴胡消疳健脾而愈一小兒素有疳脾之症患癤甚多用仙方活命飲二劑腫痛頓退又用四味肥兒丸五味異功散加柴胡升麻而愈其時同患此症用犀角丸化毒丹傷其脾胃者俱致不起一小兒頭􅆕患之腫痛焮作屬胃經熱毒先用仙方活命飲末次用清胃散而痊後口舌生瘡别搽末藥腹痛重墜作嘔不食手足指冷余謂脾胃虗寒用異功散加升麻而痊一小兒十二嵗胸前患此腫焮作痛外敷鐵篐散内服犀角丸腹中寒痛驗之膿已成先用五味異功散再用托裏消毒散膿自出却用托裏散而愈一小兒臂患毒漫腫㣲痛敷鐵篐散時欲嘔吐胸腹痞滿手足並冷此脾氣虗寒也症属半隂半陽鐵篐散乃純陽之藥非其所宜遂敷冲和膏服六君乾薑而消葢小兒元氣易實昜虗用寒藥敷貼逼毒入臟而不能救者多矣仙方活命飲皂角刺炒穿山甲蛤粉同炒乳香没藥白芷防風當歸各一錢金銀花陳皮各三錢貝母天花粉甘草節右每服五錢酒煎服嬰兒每服一兩母子同服為末酒調服亦可毒在表者加麻黄散下毒在内者加大黄下之當臨制宜此解毒囘生起死之良劑托裏消毒散治胃經虗弱或因尅伐致瘡不能潰散瘡未成即消已成即潰腐肉自去新肉自生人參黄茋當歸酒拌芍藥炒白术炒川芎茯苓各一錢白芷甘草炒金銀花連翹各五分右作二劑水煎徐徐服托裏散治瘡瘍因氣血虗不能起發腐潰收斂及惡寒發熱宜用此補托之人參五分氣虗倍用黄茋炒五分當歸五分血虗倍用白术倍用茯苓各五分芍藥酒炒五分熟地黄一錢生者自製右作二三劑水煎服替針丸治瘡疽膿已成不潰者陳壊米一錢磠砂五錢雄雀糞四十九粒直細者是也右為末米粥丸麥粒大每用一粒粘瘡頭上以膏藥貼之半晌其膿自出若瘡頭透而膿不出或出而愈痛或發熱血氣虗也用托裏散或作嘔吐痰食少體倦脾氣虗也用六君子湯五福化毒丹治熱毒藴積赤咽乾口舌生瘡或頭靣瘡癤譫語不寜方見胎毒瘡瘍按前方生血凉血解毒寒中之劑形病俱實者殊有良驗但一二丸即止不可過多則反傷元氣變症不可勝言也天烏散天南星赤小豆草烏黄蘖各等分右為末薑汁米醋調貼患處四物湯治發熱煩燥或日晡熱若因脾虗不能生血者則用六君子湯之類忌用前藥方見腋癰四君子湯治脾胃虗熱唇口生瘡或瘡不消不潰不斂或食少作嘔大便不實若因肝木乗脾土而致者宜加軟柴胡炒黄芍藥方見腹癰六君子湯治脾胃虗弱飲食少思或大便不調肢體消痩靣色痿黄即四君子加陳皮半夏八珍湯治氣血俱虗成者不能潰潰者不能斂或惡寒發熱或晡熱作渇飲食少思者即四君子四物二湯合用如聖餅治氣虗瘡瘍硬腫不能消散若大人發背等症肉死不知痛加蟾酥方見流注四順清凉飲四君子湯二方見腹癰加味歸脾湯小柴胡湯梔子清肝散三方見脇癰托裏沖和湯方見敷凉藥五味異功散方見敗毒之藥加味逍遥散方見發熱不止人參敗毒散方見發癍四味肥兒丸方見貼骨癰隔蒜灸法方見流注清胃散方見熱毒口瘡補中益氣湯方見肌肉不生胎毒瘰􅐇胎毒瘰􅐇者乃禀肝膽二經鬰火氣滯所致盖肝膽經行人身之側若因肝火動而受患故發於肝膽二經部分當審其因而藥之或因乳母恚怒或血虗内熱者當審其所因而調其母不可用峻厲之藥恐傷元氣也一小兒落草頸間有􅐇五枚審其母素多怒時常寒熱或乳間作痛或脇肋㣲腫悉屬肝膽經症先用小柴胡湯加當歸芍藥寒熱頓退又用加味逍遥散母服兩月餘其兒亦愈一小兒頸間耳下各結核三嵗久服消毒之劑患處益甚元氣益虗診乳母素鬰怒致肝脾血虗而有熱用加味歸脾湯為主佐以加味逍遥散母熱漸退却與兒日各數匙兩月餘而愈一小兒自落草時頸間患有四枚至五嵗耳前後如貫珠元氣虗甚寒熱徃来飲乳不徹此稟肝膽經氣滯之症用八珍逍遥二散與壯年婦人服之兒飲其乳半載之後兒軆漸充其核漸消又服地黄丸逍遥散而全愈一小兒頸間結核或發寒熱左頬青額間赤此禀肝心二經之症用加味逍遥散加漏蘆與母服兒日服半蛤許兩月餘核漸消後因母怒發熱兒病仍作先用加味小柴胡湯加漏蘆又用加味逍遥散加漏蘆與母服兩月餘母子俱安一小兒頸間前後各有一核色如故至週嵗母有怒氣各核變赤用加味逍遥散加漏蘆五分十餘劑将愈後因母大怒寒熱徃来四肢瘈瘲其子亦然又用加味逍遥散加漏蘆釣藤鈎母子並服而安一小兒生下頸間瘰癧三枚将期敷藥延及耳前余謂此禀肝膽二經所致診其母肝膽脉尚洪數余謂母子一體治其母兒自愈不信另用必效散一服吐㵼並至一夕而歿小柴胡湯加味歸脾湯二方見脇癰加味逍遥散方見發熱不止六味地黄丸方見作渇不止熱毒瘰􅐇熱毒瘰􅐇乃手足少陽足厥隂二經風熱之症或肝疳食積所致其症發於項腋或耳前後或如貫珠當分表􅂻虗實若焮赤腫者肝經熱毒也用人参敗毒散作痛寒熱者肝火内作也用加味小柴胡湯不痛而小便黄肝血虗也用六味地黄丸隠於肉裡而色不變者肝疳内作也用九味蘆薈丸膿成而不潰或潰而不斂者脾氣虗弱也用益氣飬榮湯凡此腫焮疼痛寒熱作渇者屬病氣有餘形氣不足治宜清肝火生肝血腫硬不潰潰而不斂者属病氣形氣俱虗治宜補腎水實脾土若因乳母恚怒肝火遺患者又當隨所因而治之一小兒膿水淋漓其核未消發熱憎寒此肝經氣血虗而有熱也用補隂八珍湯為主間以清肝益榮湯而愈後復結核小便赤澁晡熱作渇用參术柴苓湯為主佐以六味地黄丸料加柴胡山梔及四味肥兒丸而愈一小兒十五嵗患此發熱作渇日晡頬赤脉數無力属隂虗而有熱用補隂八珍湯五十劑加參茋又二十劑而潰但膿水清稀肌肉不生此脾氣虗弱也以参茋歸术為主佐以芍藥􅍄地麦門五味氣血乃復遂進必效散一服毒下而痊一小兒十三嵗久不愈寒熱兼作飲食少思此肝火熾而脾胃虗也用益脾清肝散佐以九味蘆薈丸而愈至十六嵗隂莖忽痿服温補之藥莖竅出臭津舊痕腫痛予用清肝火之藥而愈一小兒十五嵗患此恪用攻痰前症益甚虗症悉至仍議前法余曰小便頻數肝經隂虗也兩目連劄肝經風熱也作嘔懶食胃氣虗弱也泄㵼後重脾氣虗陷也遂用補中益氣湯六味地黄丸漸愈又用九味蘆薈丸而消一小兒項間及四肢結核久潰不斂形體骨立大便不調小便頻數此肝脾疳症九味蘆薈丸補中益氣湯而愈一小兒十四嵗患此膿水清稀肌體骨立晡熱盗汗口乾咳痰此腎水不能生肝木也用六味地黄丸補中益氣湯三月餘元氣漸復佐以四味肥兒丸而愈畢姻後唾痰體倦發熱作渇此脾肺虗不能生腎水水泛而為痰用地黄丸補中益氣湯而痊一小兒患此服尅治之藥致寒熱腹膨此肝脾疳症先用五味異功散加柴胡升麻佐以九味蘆薈丸漸退又用四味肥兒丸五味異功散而消一小兒患此服化痰散堅之藥􅆕色青白少陽三焦部分見青筋又目劄出淚此肝膽風熱所致脾土虗而肝木所侮也先用補中益氣湯柴胡清肝散加蕪荑核漸消又佐以五味異功散加蕪荑而愈一小兒九嵗患此􅆕色常青腫硬不潰肉色不變乃伐肝化痰余曰當調補肝脾不信果虗症蜂起復請治仍欲伐肝余曰􅆕帶青色肝虗而本色見也􅆕色變白肺虗而本色見也痰涎上湧脾虗而不能攝也兩目連劄肝血虗而生風也經云胃為五臓之本當先救胃氣遂用五味異功散加升麻柴胡元氣稍復乃朝用補中益氣湯夕用五味異功散佐以九味蘆薈丸􅆕色始黄而核漸消又以四味肥兒丸間服地黄丸而愈一小兒五嵗患此小便白色此肝脾疳症用九味蘆薈丸四味肥兒丸而消因食橙橘二便俱白抝間結核亦用前丸而愈後目連劄頸間耳後結核用柴胡清肝散蘆薈丸而愈張閣老姪孫患此久服化痰削堅之劑夜熱吐痰時季夏脉大按之而濇余曰夏月肝症而見肺脉至金旺之時其病必進矣至八月疾甚果不治一女子十四嵗耳下患此服化痰泄氣藥前症益甚諸症並臻余曰此肝膽經虗火之症也前藥乃泛擾諸經無臟不傷者不悟仍服之更四肢發搐目閉口噤余曰此肺經虗肝木動而脾土復傷也當補脾土滋肺金飬腎水亦不信後果殁一小兒四嵗患此泛服軟堅伐肝之劑益甚余曰此禀肝經之虗羸兼乳母鬰怒所致當調補乳母肝脾滋子之腎水不悟仍用前藥以致不起四味肥兒丸治食積脾疳􅆕耳口舌生瘡目障雲翳牙齒腐爛等症方見貼骨癰柴芍參苓飲治肝火血熱遍身瘙痒或起赤暈或筋攣結核柴胡芍藥人參白术茯苓陳皮當歸各五分牡丹皮山梔炒甘草炒各三分右薑棗水煎服神功散治瘡􅅑初起腫焮者用之可消加血竭更好丹毒未砭者亦可用之黄栢炒草烏生用右各另為末等分用潄口水調敷常潄口水潤之清肝益榮湯治肝膽經風熱血燥筋攣結核或作瘊子龍膽草酒拌炒黒五分山梔炒五分柴胡五分熟地黄自製白术炒木𤓰不犯鐵噐茯苓薏苡仁各五分當歸一錢川芎一錢芍藥一錢甘草三分右水煎服加味小柴胡湯山梔牡丹皮治肝膽經風熱耳前後腫痛或結核焮痛或寒熱晡熱口苦耳聾䓁症前方去山梔丹皮即小柴胡湯柴胡二錢黄芩炒一錢人參七分半夏七分甘草炙五分山梔一錢牡丹皮一錢右薑水煎徐徐服九味蘆薈丸治肝脾疳熱患瘰癧結硬或三焦目生雲翳耳内生瘡或肢體消瘦熱渇少食或肚腹不調牙齦蝕頬腐爛下部生瘡等症方見喉痺必效散治瘰癧元氣無虧者宜用此方若元氣怯弱者宜先補而後服之􅐇毒已下便與滋補庶無他患若孕婦及虗勞氣鬰所致者尤不可服世以此方為良故併註之南鵬砂二錢五分輕粉一錢巴豆五粒去皮心膜白㯽榔一個麝香五分斑猫四十箇去頭足趐用糯米炒右為末取雞子二箇去黄用清調藥入殻内以濕紙數重糊口甑蒸熟取出曝乾研細毎服五分用炒生薑酒五更調服如毒出小便澁痛用益元散一服其毒出而不痛益氣飬榮湯方見鶴膝風梔子清肝散方見腸癰補隂八珍湯即八珍湯加黄栢知母益脾清肝散方見黄水瘡驚風結核驚風結核屬肝膽二經風木相火用事木旺生風熱同化其病抽掣擾動此乃風熱血燥而然耳葢風動則肝火盛火盛則肝血内消血不能飬筋故筋攣結核如貫珠然頸項兩側正属肝膽經部分治宜滋腎水清肝火飬隂血壮脾土葢腎水旺則肝火自清肝火清則隂血自生隂血生則相火自寜火既寜則無熱傷元氣火乗土位之疾矣一小兒因驚項間結核目劄唇動揺頭抽搐此風木凌於脾土也用皂角子丸補中益氣湯漸愈又用九味蘆薈丸而痊一小兒甫週嵗項間結核兩臂反張索敗毒之藥余意此屬肝經血燥詢之果前患驚風曽服硃砂等藥遂與六味地黄丸滋其肝血數服而愈一小兒項側結核痰盛發搐服金石香燥之劑手足筋攣此肝血復傷即急驚也遂用加味小柴胡湯加釣藤鈎山梔芎歸六味丸料加五味麦門而痊一小兒毎受驚項間結核發熱减食睡間四肢㣲抽此肝木侮脾土也用五味異功散加柴胡升麻釣藤鈎随愈畢姻後腿臂腕間結核誤服行氣破血藥腿臂筋攣肌體消痩如瘵症余因考績到京用地黄丸生肝腎之血佐以補中益氣湯補脾肺之氣而愈一小兒耳前後結核遇驚即痰盛咬牙抽搐揺頭恪服香燥之藥以致慢驚而卒皂角子丸治肝膽經風熱項脇兩側結核皂角子仁炒二兩連翹八錢當歸柴胡芍藥炒山梔炒川芎各一兩桔梗炒龍膽草酒拌炒黒甘草炒各四錢右為末米糊丸菉豆大量兒大小滚湯下人參敗毒散治小兒風熱瘙痒頑核毒瘡或解脫衣裳風邪所傷惡風發熱胸膈生涎頭目不清方見發癍九味柴胡湯治肝經熱毒下注患便毒腫痛或小腹脇間結核凡肝膽經部分一切瘡􅅑或風毒惡核瘰􅐇炒柴胡五分黄芩炒五分人參山梔炒龍膽草炒半夏當歸芍藥炒各三分甘草二分右水煎服若腫痛色赤元氣無虧者宜用潰後腫消痛止者不宜用大凢腫硬不潰或潰後不愈因元氣虗也午前宜用四君歸茋升麻午後宜用四君芎歸柴胡為主佐以九味蘆薈丸若飲食少思者宜用五味異功散專補胃氣若膿水清稀而見一切諸症皆因血氣内虧但温補脾胃飲食加進血氣化生諸症自退設治瘡邪是虗其虗也禍不旋踵矣琥珀膏治瘰癧不潰或潰而不愈變成漏症琥珀木通桂心當歸白芷防風松香硃砂丁香木香木鼈子各二兩右先用琥珀丁香桂心硃砂木香為末其餘㕮咀以麻油二斤六兩慢火煎至白芷焦黒濾去查徐下黄丹一斤以桞枝不住手攪至黒色滳水捻軟硬得中却入琥珀等末攪匀於磁器盛之用時取少許攤貼益脾清肝散治肝火侮脾飲食少思發熱或寒熱徃来瘡不能消散方見黄水瘡補隂八珍湯治元氣虗弱不能潰斂或内熱晡熱肌體消痩即八珍湯加酒炒黒黄栢知母五味異功散方見敗毒之藥胎毒瘡疥胎毒瘡疥因禀胎熱或娠母飲食之毒七情之火初如乾癬後則膿水淋漓或結靨成片如發於兩耳眉或耳前後髮際之間屬手少陽經若發於四肢屬脾胃經發於兩脇屬肝經發於額屬心經發於腦屬膀胱經發於頦頬屬腎經當隨各經所主五臟勝負及乳母食啖厚味鬰怒所傳致而調治之不可徹用化毒犀角等丸設元氣復傷傳變他症尤為難療一小兒遍身患之服牛黄解毒丸皆愈惟頭結痂作痒出水此禀腎經虗熱用地黄丸解毒散而愈一小兒患於髪際之間作痒診其母有肝火用加味逍遥散加漏蘆用牛黄解毒丸解毒散而愈解毒散一名托毒散一小児患於左耳髪際漸延上頭作痒此禀肝膽二經熱毒用柴胡清肝散母子並服而愈後不戒膏粱復發膿水淋漓右頰赤色此胃經有熱先用清胃散仍用柴胡清肝散治肝火母子俱服又用立效散牛黄解毒丸而愈一小兒兩眉患之延及遍身四肢為患膿水淋漓寒熱徃来属肝脾積熱用清胃散小柴胡湯立效散而愈後眉間復患兩目連劄小便白濁用四味肥兒丸九味蘆薈丸而愈一小兒因乳母不戒七情厚味患此久不愈母用清胃逍遥二散子用牛黄解毒丸愈後兒食甘味眉間生瘡痛痒目劄用四味肥兒丸為主佐以加味逍遥散清胃散而愈一小兒遍身患之兩脇為甚子用四味肥兒丸立效散母用柴胡梔子散加味逍遥散而愈牛黄解毒丸治胎毒瘡癤及一切瘡瘍牛黄三錢金銀花一兩草紫河車五錢甘草右為末煉蜜丸量兒服立效散治鬂瘡耳瘡及一切瘡疥定粉末松香末黄栢末黄連末各一兩枯礬末一兩右各另為末用清油燭油調搽敷藥解毒散治一切毒瘡風疹痒痛大黄黄栢山梔寒水石煅各等分右為末水調搽若破而膿水淋漓用當歸膏或清燭油調尤善柴胡梔子散即梔子清肝散方見脇癰四味肥兒丸方見熱毒瘰癧九味蘆薈丸方見諸疳口瘡金黄散方見天泡瘡熱毒瘡疥熱毒瘡疥因乳哺過早或嗜甘肥臟腑積熱或母食膏􅆝厚味或七情内火所致當分臟腑所属之因病之虗實調其血氣平其所勝如肝經實熱用柴胡清肝散虗熱用六味地黄丸心經實熱用𨗳赤散虗熱用補心湯脾經實熱用㵼黄散虗熱用補中湯肺經實熱用㵼白散虚熱用五味異功散腎經熱用六味地黄丸大凡手足冷者屬虚寒手足熱者屬實熱脉沉數有力作渇飲冷大便乾實此邪在裏宜内疏若脉浮數有力作渇飲冷此邪在表宜發散若脉浮大按舉無力或作渇飲湯乳食少思此眞氣虚而發熱也調理脾胃其病自愈切不可用寒凉之劑復損眞氣嬰兒宜調治乳母為主一小兒脇間患此寒熱如瘧小便頻數此稟肝火所致先用柴胡清肝散又用加味逍遥散而愈後因乳母肝火動而復發用加味逍遥散及八珍湯加丹皮山梔母子服之並愈一小兒腹間患此發熱便血面黄少食或作嘔或作瀉手足時冷右關脉弦數此脾土虚弱肝火為患先用五味異功散加升麻柴胡山梔益脾氣清肝火後用地黄丸滋腎水生肝血而愈一小兒腿内股患此色赤不愈發熱面色或赤或青此稟腎隂不足而木火熾盛先用柴胡梔子散以清肝心後用地黄丸以補肝腎而愈一小兒肘間患此作渇飲冷右寸闗脉數而無力此胃經積熱傳於肺經也先用㵼黄㵼白二散漸愈後用五味異功散四味肥兒丸而愈一小兒嗜膏粱甘味先患背髀後沿遍身淋漓此飲食之熱而傷脾血也先用清胃㵼黄二散而愈但形氣怯弱用五味異功散而元氣復柴胡清肝散方見脇癰五味異功散方見用敗毒之藥𨗳赤散㵼白散二方見臂癰㵼黄散方見頭􅆕瘡諸疳瘡疥諸疳瘡疥因脾胃虧損内亡津液虗火妄動或乳母六淫七情飲食起居失宜致兒為患當分其因審其經而平之如􅆕青寒熱或白翳遮晴肝經之症也􅆕赤身熱或作渇驚悸心經之症也􅆕黄體痩或作渇泄㵼脾經之症也􅆕白咳𠻳或鼻間生瘡肺金之症也􅆕黧體痩或喜卧濕地腎經之症也嬰兒宜調治乳母若不審五臟勝負形病虗實妄行敗毒多致不救一小兒患此小便頻數左頬青色或時目劄此肝脾之症也先用五味異功散加當歸升麻柴胡調補脾氣又用九味蘆薈丸清理肝火末用地黄丸滋腎水生肝木而疥愈後復發不經意兼兩目生翳小便頻數大便泄㵼此肝邪侮脾而作也用四味肥兒丸五味異功散加蕪荑脾氣健而肝病愈一小兒患此􅆕黄作渇大便酸臭腹脹青筋此肝脾之症用五味異功散為主佐以四味肥兒丸而愈一小兒患此􅆕赤作渇心脉洪大此心經之症内用柴胡梔子散外用六仙散而愈後驚悸發熱疥焮作痛先用𨗳赤散二服又用柴胡梔子散與子服母服逍遥散而愈一小兒患此大便酸臭肚腹膨脹手足時冷此脾經之症用五味異功散四味肥兒丸漸愈後因母食炙􅏼仍發母服清胃散黄連㵼心湯子服一味甘草而愈一小兒嗜甘肥之物患之或痒或痛咳𠻳飲冷此脾胃積熱傳於肺經先用清胃散以治胃熱少用㵼白散以清肺火漸愈出痘後仍患之口乾飲湯用五味異功散兼大楓膏而愈一小兒年十五遍身患此腿足為甚發熱飲冷兩尺脉數洪按之無力此禀腎虗所致用六味地黄丸而愈後用心力學復發尤甚兼盗汗遺精用地黄丸為主佐以補中益氣湯八珍湯而愈一小兒患此發熱飲冷痰涎上湧此禀腎虗用地黄丸料煎服月餘漸愈又佐以八珍湯而愈次年畢姻後發熱唾痰盗汗咳血仍用前藥而愈敷藥大楓子膏治瘡疥大楓子肉二両研膏真輕粉一両黄連二両蛇床子二両枯礬一両桕油六両右各另入大楓膏和匀更入桕油杵百餘即成膏矣毎用少許􅂗患處敷藥六仙散治諸疳瘡疥苦參獨活大楓子去殻去油浄蛇床子各一兩枯礬五錢右為細末桕油調敷五味異功散方見用敗毒之藥清胃散方見熱毒口瘡諸疳口瘡諸疳口瘡因乳哺失節或母食膏粱積熱或乳母七情鬰火所致其症口舌齒齦如生瘡状若發熱作渇飲冷額間赤色左寸脉洪數者此属心經先用𨗳赤散清心火次用地黄丸滋腎水若寒熱作渇左頬青赤左闗脉弦洪者属肝經先用柴胡梔子散清肝火次用六味地黄丸生肝血若兩腮黄赤牙齦腐爛大便酸臭右闗脉洪數按之則緩者属脾經用四味肥兒丸治脾火以五味異功散補脾氣若發熱咳𠻳右腮色赤右寸脉洪數按之濇者属肺經先用清肺飲治肺火用五味異功散補脾胃若發熱作渇兩頦黧色左尺脉數者属腎經不足先用六味地黄丸以生腎水次用補中益氣湯以生肺氣又有走馬疳者因病後脾胃氣血傷損虗火上炎或痘疹餘毒上攻其患甚速急用銅碌散大蕪荑湯輕則牙齦腐爛唇吻腮腫重則牙齦蝕露頬顋透爛若飲食不入喘促痰甚此脾胃虗而肺氣敗也頬腮赤腐不知痛者此胃氣虗甚而肉死也並不治一小兒口瘡嘔血便血兩腮㣲腫唇白􅆕青此脾土虧損木所乗也朝用補中益氣湯食逺用異功散而愈一小兒右顋鼻凖㣲赤此肺脾二經虗熱用四君升麻及白术散而愈一小兒口瘡久不愈診其母右闗脉弦緩乃木尅土之症先用六君柴胡又用加味逍遥散治其母子自愈一小兒齒齦蝕爛年餘不愈用大蕪荑湯治其疳邪五味異功散健其脾氣尋愈後復作兼項間結核另服敗毒藥口舌生瘡余用四味肥兒丸而愈一小兒患口瘡寒熱嗜卧作渇引飲此脾疳氣虗發熱而津液不足也先用白术散以生胃氣冄用四味肥兒丸以治疳症兩月餘又用異功散而安一小兒口瘡身熱如炙肚腹脹大此脾疳内作朝用五味異功散夕用四味肥兒丸稍愈又以地黄蝦蟆二丸兼服而愈一小兒齒齦腐爛頭􅆕生瘡體痩發熱此脾疳所致先用大蘆薈丸又用四味肥兒丸大楓膏而愈東垣大蕪荑湯一名梔子茯苓湯治黄疳土色為濕為熱當利小便今反利知黄色中為燥胃經熱也髪黄脫落知膀胱腎俱受上邪乃大濕熱之症鼻下斷作瘡上逆行營氣伏火也能乳胃中有寒也寒則食不入喜食土胃不足也􅆕色黒為寒為痺大便清寒也褐色熱蓄血中間黄色腸胃有熱治當滋榮潤燥外致津液山梔仁三分黄栢甘草炙各二分大蕪荑五分黄連麻黄根防風各一分羌活二分柴胡三分當歸四分白术茯苓各五分右水煎服葛花解酲湯治乳母酒醉後乳兒遺熱為患白荳䓻砂仁葛花各五錢白术二錢澤㵼二錢神麯炒黄二錢乾生薑二錢白茯苓陳皮人参猪苓木香各五分青皮三分右為末毎服二錢白湯調服愚按前湯先哲不得已而用之葢醉酒耗氣又服辛散重損真隂折人長命可不慎哉大蘆薈丸治疳殺蟲和胃止㵼胡黄連黄連白蕪荑去扇白雷丸破開赤者不用蘆薈青皮木香鶴虱㣲炒各半兩麝香二錢另研右為末粟米飯丸菉豆大毎服一二十丸米飲下蚵蟆丸治無辜疳症一服虗熱退二服煩渇止三服㵼痢住蟾蜍一枚夏月溝渠中腹大不跳不鳴身多癩㿔者右取糞蛆一杓置桶中以尿浸之桶上要乾不令蟲走出却将蟾蜍撲死投蛆中食一晝夜以布袋盛置浸急水中一宿取出瓦上焙為末入麝一錢粳米飯揉丸麻子大毎服二十丸米飲下六味肥兒丸消疳化蟲退熱若脾疳飲食少思肌肉消痩肚大頸細髪稀成穂項間結核發熱作渇精神怠倦大便酸臭嗜食泥土或口鼻頭瘡肚腹青筋囓下痢便白宜用此丸即四味肥兒丸加乾蟾一兩蕪荑五錢四味肥兒丸方見熱毒瘰癧地黄丸方見作渇不止熱毒口瘡經云手少隂之經通于舌足太隂之經通于口因心脾二經有熱則口舌生瘡也當察􅆕圗部位分經絡虗實而藥之若元氣無虧暴病口生白屑或重舌者用亂髪纒指蘸井花水揩之或刺出毒血敷以桞花散傅之上以腫脹或有泡者並令刺破敷前散或以青黛搽之刺後又生又刺若唇吻熱烈者用當歸膏調桞花散敷之若元氣虧損或服寒凉之藥或兼作嘔少食者此虗熱也用五味異功散加升麻柴胡若泄㵼作渇者脾胃虗弱也用七味白术散若腹痛惡寒者脾胃虗寒也用六君薑桂若因母食酒麺煎煿者用清胃散若因母飲食勞役者用補中益氣湯肝脾血虗者用加味逍遥散鬰怒内熱者用加味歸脾湯母子並服若泥用降火必變慢脾風矣仍叅吐舌弄舌治之凡針重舌以線針直刺不可横挑恐傷舌絡致言語不清也一小兒口舌生瘡手熱飲冷屬胃經實熱用栁花散加味解毒散而愈後因傷食吐血不時㺯舌属脾經虗熱用四君子湯而痊一小兒口舌生瘡延及頭靣胸背膿水淋漓此胎毒也内用牛黄解毒丸外以當歸膏調黄栢末塗之而愈一小兒發熱飲冷口患瘡額鼻黄赤吐舌流涎余用導赤㵼黄二散而愈後復作自服清熱化毒之藥益甚更加㺯舌余用五味異功散加釣藤鈎及六君子湯而愈葢吐舌為脾之實熱也㺯舌為脾之虗熱也治者審之一小兒患前症久不愈恪服清凉之劑痰喘不已口開流涎手足並冷又欲治痰余謂經云脾主涎肺主氣此因脾土虗寒不能生肺金而然非痰火為患也先用温中丸二服痰喘頓止又用五味異功散而痊一小兒口内生瘡用寒凉之劑更發熱飲湯不絶此中氣虗寒隔陽於外非實熱也用補中益氣湯加炮薑一劑而愈陳湖陸欽若子患前症敷服寒劑手足並冷口唇時動余曰此中氣虗寒而變慢脾風也後果殁東垣清胃散治胃經有熱齒牙作痛或飲冷作渇口舌生瘡或唇口腫痛焮連頭􅆕或重舌馬牙吐舌流涎若因服尅伐之劑脾胃虗熱口舌生瘡或㺯舌流涎或嘔吐困睡大便不實者用五味異功散生地黄四分牡丹皮三分當歸稍四分黄連三分升麻五分右水煎服嬰兒母亦服清熱消毒散治實熱口舌生瘡及一切瘡瘍腫痛形病俱實者黄連炒山梔炒連翹當歸各五分金銀花一錢川芎芍藥炒生地黄各六分甘草二分右水煎服嬰兒母同服四君子湯治脾氣虗熱口舌生瘡或但胃氣復傷飲食少思或食而難化若作嘔泄㵼尤宜用之如兼痰嗽氣逆肢體倦怠靣目浮腫宜用六君子湯六君子湯治脾胃氣虗吐㵼不食肌肉消痩或肺虗痰𠻳喘促惡寒或驚搐口直口噤諸症二方見腹五味異功治脾胃虗熱口舌生瘡或因誤服尅伐之劑脾胃復傷而口舌生瘡或㺯舌流涎吐㵼不止飲食少思或驚搐痰𠻳睡而露睛手足並冷若母有病致兒患者子母並服方見用敗毒之劑人参理中湯人參白术炒乾薑炮甘草炙各等分右毎服一二錢水煎蜜丸即人參理中丸加附子即附子理中湯四物湯治瘡􅅑血虗發熱煩躁或晡熱作渇頭目不清若因脾虗不能生血者用四君子湯方見腋癰栁葉散治熱毒口瘡黄栢炒蒲黄青黛真正者人中白煅各等分右為末敷之加味解毒散牛黄解毒丸二方見胎毒瘡疥薛氏醫案卷六十四
