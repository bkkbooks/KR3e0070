body:
  text: 薛氏醫案卷四十七明薛巳訂婦人良方産後痢疾作渇方論第一産後下痢作渇者乃内亡津液或胃氣虚不能生津液但止其渴痢自差愚按前症若渇而不喜冷飲屬胃氣虚不能生津液宜用七味白术散夜間發熱口渇屬腎水弱而不能潤宜用六味丸並佐以益氣湯以滋化源附治驗方藥一産婦㵼痢發熱作渇吐痰肌體消瘦飲食少思或胸膈痞滿或小腹脹墜年餘矣余以為脾腎之㵼朝用二神丸夕用六君子三月餘而痊一産婦患前症形體倦怠飲食不進與死為鄰此脾胃俱虚也用四神丸十全大補湯數劑而愈附方七味白术散方見二十一卷第二論六味丸方見二十四卷第十一論補中益氣湯六君子湯二方見二十四卷第六論十全大補湯方見二十四卷第四論四神丸二神丸二方見八卷第八論産後大便秘澁方論第二産後大便秘澁因腸胃虚弱津液不足若小腹悶脹宜服麻仁丸潤之若用寒藥則促其危矣愚按前症若計其日期飲食數多即用藥通之禍在反掌之間必待腹滿覺脹欲去不能者乃結在直膓宜用猪膽汁潤之若服苦寒疎通反傷中氣通而不止或成痞症若去血過多用十全大補血虚火燥用加味四物氣血俱虚用八珍湯雖數日不通飲食如常腹中如故仍用八珍加桃仁杏仁治之若泥其日期飲食數多而通之則誤矣附治驗一産婦大便七日不通飲食如常腹中如故此腹未滿也用八珍加桃仁杏仁至二十一日腹滿欲去用猪膽汁潤去而安一産婦大便不通或用通利之藥中脘脹痛飲食甚少又用蜜導之大便不禁吃逆不食余以為脾腎復傷用六君加吴茱肉果骨脂五味數劑喜其年壮而愈不然多致不起一産婦大便秘結小腹脹痛用大黄等藥致吐㵼不食腹痛胸痞余用六君子加木香炮薑治之而愈一婦人大便秘澁諸藥不應苦不可言令飲人乳而安麻仁丸大麻仁研如泥枳殻人參各四分大黄二分右為末入麻仁煉蜜丸桐子大毎服二十丸空心温酒下未通漸加不可過服阿膠枳殻丸治産後大便秘澁以阿膠枳殻二味等分為末蜜丸桐子大滑石末為衣温水下二十丸如或未通再服附方十全大補湯八珍湯二方見二十四卷第四論加味四物湯方見二十四卷第六論産後大小便不通方論第三産後大小便不通因腸胃虚弱津液燥竭故也愚按前症當參前後論及八卷八論主治附治驗一産婦大小便不通諸藥不應将危矣令飲牛乳一日稍通三日而痊人乳尤善桃花散治膀胱氣滯血澁大小便秘桃仁葵子滑石檳榔等分右為末毎服二錢空心葱白湯調下通氣散治産後大小便不通方見八卷第七論産後遺糞方第四産後遺糞取故燕窠中草燒為末或枯礬牡蠣或白蘝芍藥各等分為末俱用酒調服或用固腸丸亦可愚按前症若脾腎虚弱用還少丹仍以補中益氣湯為主虚寒加肉豆䓻補骨脂或四神丸若脾腎虚寒用八味丸兼四神丸仍佐以前二方附治驗小便出屎方藥附一産婦大便不實飲食少思五更或侵晨遺屎此中氣虚寒脾腎不足用補中益氣送四神丸而痊一産婦小便出糞名大小腸交乃氣血俱虚失行常道先用六君子湯二劑又用五苓散二劑而痊循常腸交亦可用附方還少丹治脾腎虚寒飲食少思發熱盗汗遺精白濁又治真氣虧損肌體瘦弱等症肉蓯蓉逺志去心茴香巴㦸乾山藥枸杞子熟地黄石菖蒲山茱茰去核牛膝杜仲去皮薑製楮實子五味子白茯苓各一兩右各另為末用􅀥肉百枚并煉蜜丸桐子大毎服五七十丸空心温酒或鹽湯下日三服補中益氣湯六君子湯二方見二十四卷第六論四神丸方見八卷第八論八味丸方見二十四卷第十一論五苓散方見二十一卷第十論産後諸淋方論第五産後諸淋因熱客於脬虚則頻數熱則澁痛氣虚兼熱血入胞中則血随小便出而為血淋也愚按前症若膀胱虚熱用六味丸若隂虚而陽無以化用滋隂腎氣丸葢土生金金生水當滋化源仍㕘第八卷小便淋􅅹頻數類附治驗一産婦小水淋􅅹或時自出用分利降火之劑二年不愈余以為肺腎之氣虚用補中益氣湯六味地黄丸而痊滑石㪚治熱淋滑石五分研通草車前子葵子各四分右為末以漿水調服治小腸有熱小便澁痛或為血淋􅜰麥黄芩冬葵子各二兩通草三兩大􅀥十二枚右以水七升煎二升半分二服治脾氣不利小便不通橘紅為末毎服二錢空心温酒下治肺氣不利小便不通杏仁十四枚去皮尖炒食之治脬轉小便不利滑石一錢半寒水石一錢水煎服附方六味丸方見二十四卷第十一論滋隂腎氣丸補中益氣湯二方見二十四卷第六論産後小便頻數方論第六産後小便數者乃氣虚不能制故也愚按前症若因穏婆不慎以致胞損而小便淋􅅹者用八珍湯以補氣血若因膀胱氣虚而小便頻數當補脾肺若膀胱隂虚而小便淋􅅹須補肺腎仍㕘第八卷小便頻諸類附治驗一産婦小便頻數時忽寒戰乃屬脾肺虚弱用補中益氣加山茱山藥為主佐以桑螵蛸散而愈後患發熱晡熱盗汗自汗月水不調用加味逍遥散而安一産婦患前症吐痰發熱日晡作渴此膀胱隂虚用補中益氣湯佐以六味丸而愈又患痢後小便頻數手足俱冷屬陽氣虚寒用前湯及八味丸而瘳桑螵蛸散治陽氣虚弱小便頻數或為遺尿桑螵蛸三十箇炒鹿茸酥炒黄茋各三兩牡蠣煨人參厚朴赤石脂各二兩右為末毎服二錢空心粥飲調下又方用益智仁為末米飲下附方八珍湯加味逍遥散二方見二十四卷第四論補中益氣湯方見二十四卷第六論六味丸八味丸二方見二十四卷第十一論産後小便不禁方第七廣濟治産後小便不禁用雞尾燒灰千金翼用白薇芍藥為末俱用温酒下日三服或桑螵蛸半兩龍骨一兩為末毎服二錢粥飲調下愚按前症若脾肺陽虚用補中益氣湯若肝腎隂虚用六味地黄丸若肝腎之氣虚寒用八味地黄丸附治驗一産婦小便不禁二年不愈面色或青赤或黄白此肝脾氣血虚熱用加味逍遥散為主漸愈佐以六味丸而痊後因怒小便自遺大便不實左目頓𦂳而色頓赤乃用前㪚佐以六君子湯以清肝火生肝血培脾土而瘳補脬飲治胞破小便淋􅅹生絹黄色者一尺白牡丹用根并皮白芨各一錢右水一碗煎至絹爛温服服後忌言語否則無效雞内金散治氣虚溺床用雄雞䏶胵并腸燒為末温酒調服附方補中益氣湯六君子湯二方見二十四卷第六論六味丸八味丸二方見二十四卷第十一論加味逍遥散方見二十四卷第四論産後小便出血方論第八産後小便出血者因虚熱血滲於脬也以亂髪洗浄燒為末米飲調服或滑石末一錢生地黄汁調下愚按前症若膏粱積熱用加味清胃散醇酒濕毒葛根解酲湯怒動肝火加味小柴胡湯鬱結傷脾加味歸脾湯思慮傷心妙香散大腸風熱四物側柏槐花大腸血熱四物炒連槐花腸胃虚弱六君升麻柴胡元氣下陷補中益氣茯苓半夏胃氣虚弱六君升麻血虚四物升麻氣血俱虚八珍柴胡升麻大凡元氣虚弱而發熱者皆内真寒而外假熱也但用六君或補中益氣加炮薑温補脾氣諸症悉退若四肢畏冷急加附子附治驗方藥大便下血附一産婦尿血面黄脇脹少食此肝木乗脾土也用加味逍遥補中益氣兼服而愈後為懐抱不樂食少體倦驚悸無寐血仍作用加味歸脾湯二十餘劑将愈惑於衆論服犀角地黄湯諸症復作仍服前湯而愈一産婦糞後下血食少體倦此脾氣虚熱用補中益氣加吴茱炒黄連五分四劑頓愈用歸脾湯而痊一婦人怒則便血寒熱口苦或胸脇脹痛或小腹痞悶此肝木乗脾土用六君柴胡山梔而愈用補中益氣加味逍遥而不復作一婦人久下血在糞前屬脾氣虚寒用補中益氣加連炒吴茱一錢數劑稍緩乃加生吴茱五分數劑而愈黄連炒吴茱茰法見七卷第五論一産婦大便後血口乾飲湯胸脇膨滿小腹悶墜内熱晡熱食少體倦日晡面赤洒淅惡寒此脾肺氣虚先用六君加乾薑木香漸愈用補中益氣将愈用歸脾湯全愈後勞役兼怒發熱血崩夜間譫語此熱入血室用加味小柴胡二劑而熱退用補中益氣一劑而血止用逍遥散歸脾湯調理而安葛花解酲湯治酒積上下外消其濕白豆􅅳砂仁葛花各五錢木香五分青皮三錢陳皮白茯苓猪苓人參各一錢半白术神麯澤㵼生乾薑各二錢右為末毎服五錢白湯調下加味清胃㪚方見二十四卷首論加味小柴胡湯方見二十四卷第二論加味歸脾湯歸脾湯八珍湯逍遥㪚加味逍遥散五方見二十四卷第四論妙香散方見六卷第八論四物湯六君子湯補中益氣湯三方見二十四卷第六論産後隂脱玉門不閉方論第九産後隂脱玉門不閉因坐産努力舉動房勞所致或脱肛隂挺逼迫腫痛小便淋􅄋愚按玉門不閉氣血虚弱也用十全大補湯腫脹焮痛肝經虚熱也加味逍遥散若因憂怒肝脾氣血傷也加味歸脾湯若因暴怒肝火血傷也龍膽㵼肝湯仍參第八卷末諸論附治驗一産婦玉門不閉發熱惡寒用十全大補加五味子數劑而寒熱退用補中益氣加五味子數劑而玉門閉一婦人脾胃素弱兼有肝火産後玉門腫痛寒熱作渇嘔吐不食外敷大黄等藥内用驅利之劑腫及於臀諸症蜂起此真氣虚而邪氣盛也先用六君子以固腸胃次用補中益氣以升陽氣不數劑而全愈一産婦患此失治腫潰不巳形體消瘦飲食少思朝寒暮熱自汗盗汗半年矣用補中益氣加茯苓半夏膿氷漸少飲食漸進用歸脾湯共五十餘劑而愈一産婦玉門不閉小便淋􅅹腹内一塊攻走脇下或脹或痛用加味逍遥散加車前子而愈一産婦隂脱便閉下墜形氣倦甚用十全大補湯而上因怒仍脱重墜寒熱小便淋􅅹用補中益氣湯加山梔龍膽草一劑重墜减而小便利仍用前湯去二味倍加參茋升麻而痊一産婦隂脱腫痛小便淋漓此因元氣甚虚而肝火旺也用補中益氣湯加山梔車前子四劑而肝症悉盡退仍用前藥去二味加茯苓而小便利又用十全大補湯而腫痛遂漸消一産婦元氣充實初産玉門不閉腫焮作痛小便不利余謂肝經濕熱壅滯欲以加味逍遥散加車前子牛膝治之不信乃服十全大補湯腫痛益甚仍用前藥更加澤㵼一劑而愈一産婦隂脱腫痛脈又滑數欲作膿也余用十全大補湯三四劑而膿成又數劑而膿始潰但小便頻數而患處重墜痛甚此因元氣虚弱而致下陷也又用補中益氣湯數劑而瘥一婦人子宫腫大二日方入損落一片殊類猪肝面黄體倦飲食無味内熱晡熱自汗盗汗用十全大補湯二十餘劑諸症悉愈仍復生育硫黄散治産後陽氣虚寒硫黄烏賊骨各五錢五味子五錢右為末撡患處日三易一方蛇床子一升炒熱帛裹熨患處亦治隂痛一方子宫脱出以􅒝蔴子仁十四枚研塗頂心入即洗去附方十全大補湯加味逍遥散加味歸脾湯歸脾湯四方見二十四卷第四論龍膽㵼肝湯方見二十四卷第八論補中益氣湯六君子湯二方見二十四卷第六論婦人隂蝕疳方論第十婦人少隂脈數而滑者隂中有瘡名曰慝或痛或痒如蟲行状膿水淋􅄋亦有隂蝕幾盡者皆由心神煩鬱脾胃虚弱氣流血滯耳内當補心養胃外以藥敷洗乃可愚按前症乃肝脾鬱結之症木旺生蟲耳宜解鬱清肝備見八卷隂中生瘡類附治驗一産婦素有肝火患此内潰痒痛食少熱渇小水淋􅅹用五味逍遥散加味歸脾湯兼服間以蘆薈丸外以鶴虱草煎洗而愈治疳蟲蝕下部用蒲黄水銀研匀傅入内平胃散加貫衆末二錢以熟猪肝拌藥内隂中附方加味歸脾湯加味逍遥㪚二方見二十四卷第四論蘆薈丸方見七卷第七論産後乳少或止方論第十一婦人乳汁乃氣血所化若元氣虚弱則乳汁短少初産乳房焮脹此乳未通若怒氣乳出此肝經風熱若累産無乳此内亡津液盖乳汁資於衝任若婦人疾在衝任乳少而色黄者生子則怯弱而多疾愚按前症若氣血虚弱而不能化生宜壯脾胃怒動肝膽而乳腫汁出宜清肝火夫乳汁乃氣血所化在上為乳在下為經若屢産無乳或大便澁滯當滋化源附治驗一産婦因乳少服藥通之致乳房腫脹發熱作渇余謂血氣虚以玉露㪚補之而愈湧泉㪚能下乳忌食薑椒辛辣飲食王不留行􅜰麥麥門冬龍骨各二錢右用猪蹄汁一碗酒一杯煎服以木梳於乳上梳下治氣血虚鍾乳粉毎服二錢煎漏蘆湯調附方玉露散治乳脈不行身體壯熱頭目昏痛大便澁滯等症人參白茯苓桔梗炒芍藥各一錢甘草炙六分右水煎服産後乳出方論第十二産後乳汁自出乃胃氣虚宜服補藥止之若乳多滿痛用温帛熨之未産而乳自出謂之乳泣生子多不育愚按前症氣血俱虚用十全大補湯肝經血熱用加味逍遥㪚肝經怒火用四物參术柴梔肝脾鬱怒用加味歸脾湯附治驗一産婦勞役忽乳汁如湧昏昩吐痰此陽氣虚而厥也灌以獨參湯而甦更以十全大補湯數劑而安若婦人氣血方盛乳房作脹或無兒飲脹痛增寒發熱用麥芽二三兩炒熟水煎服立消其耗散血氣如此何脾胃虚弱飲食不消方中多用之十全大補湯加味逍遥散加味歸脾湯三方見二十四卷第四論獨參湯方見三卷十一論四物湯方見二十四卷第六論産後吹乳方論第十三産後吹乳因兒飲口氣所吹令乳汁不通壅結腫痛不急治多成癰速服括蔞散及敷南星更以手揉散之愚按前症用藥切不可損其氣血治驗見二十四卷括蔞散乳香二錢括蔞一箇酒煎服用南星温湯調塗一方用陳皮一兩甘草一錢水煎服産婦妬乳方論第十四妬乳因兒未能飲餘乳蓄結以致腫痛初不吮通之必致成癰若乳頭生瘡浸淫名妬乳宜赤龍皮湯天麻湯飛烏膏飛烏散傅以黄連胡粉散愚按乳盛或無子飲乳以致腫痛炒大麥芽煎服其乳即散若成瘡當從乳癰類治若皮膚津淫成瘡當用本方治乳初腫痛内消方用𤓰蔞一箇粉草一寸生薑一塊半生半炒酒二碗煎服少頃去敗乳再服即愈赤龍皮湯槲皮三升水一斗煮五升温洗之麻草湯以天麻草五升水煎洗之此草葉若麻葉冬生夏花赤如鼠尾花亦洗浸淫濕痒隂蝕等瘡飛烏散用燒硃砂作水銀上黑煙各維粉者三兩枯礬一兩傅之諸熱浸淫丈夫隂蝕痒濕小兒頭瘡疳蝕瘡等症黄連胡粉膏治症同前黄連二兩末胡粉一錢水銀一兩同研令消散右皮裹熟挼和合傅之一方乳頭裂破秋茄子裂開者隂乾燒存性水調塗之薛氏醫案卷四十七
