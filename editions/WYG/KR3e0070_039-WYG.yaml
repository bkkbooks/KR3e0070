body:
  text: 薛氏醫案卷三十九明薛已訂婦人良方姙娠泄瀉方論第一論曰姙娠泄瀉或青或白水穀不化腹痛腸鳴謂之洞泄水穀不化喜飲嘔逆謂之恊熱下利並以五苓散利小便次以黄連阿膠丸或三黄熟艾湯以安之若瀉黄有沫腸鳴腹痛脉沉𦂳數用戊巳丸和之噯腐不食胃脉沉𦂳用感應丸下之後調和脾胃若風冷水穀不化如豆汁用胃風湯寒冷臍下隂冷動泄用理中湯治中湯伏暑心煩渴瀉水用四苓散傷濕泄瀉小便自利用不換金正氣散胃苓湯此四證之大畧也仍叅第八卷第八論主之愚按米食所傷用六君加穀糵麵食所傷用六君加麥蘖肉食所傷用六君加山查若兼寒熱作嘔乃肝木侮脾土用六君加柴胡生薑兼嘔吐腹痛手足逆冷乃寒水侮土六君加薑桂不應用錢氏益黄散若元氣下陷發熱作渴肢體倦怠用補中益氣湯若泄瀉色黄乃脾土之真色用六君加木香肉果若作嘔不食腹痛惡寒乃脾土虛寒用六君加木香薑桂若瀉在五更侵晨飲食少思乃脾腎虛弱五更服四神丸日間服白术散如不應或愈而復作或飲食少思急用八味丸補命門火以生脾土為善不可忽也附治驗邊太常側室姙娠泄瀉自用枳术黄連之類腹悶吐痰發熱惡寒飲食到口即欲作嘔強匙許即吞酸不快欲用袪痰理氣余曰此因脾胃傷而痰滯中脘若治痰氣復傷脾胃矣遂以參术炮薑為末丸如黍粒不時含嚥三五丸漸加至三日後日進六君子湯而尋愈進士王繳徵之内懐姙泄瀉惡食作嘔余曰脾氣傷也王君憂之強進米飲余謂飲亦能傷胃且不必強俟脾胃醒宿滯自化飲食自進不信别用人參養胃湯飲之吐水酸苦又欲投降火寒藥余曰若然則胃氣益傷也經云損其脾胃者調其飲食適其寒温後不藥果愈厚朴丸治洞泄寒中乾薑炒厚朴去皮等分右水拌炒為末水糊丸梧子大每服五十丸米飲下草果散治虛寒泄瀉腹痛無度厚朴薑汁拌炒二兩肉豆蔲十箇麵煨草豆蔲十箇煨右每服三錢用薑水煎附方附子理中湯方見二十卷第八論理中丸五苓散二方見二十一卷第十論六君子湯補中益氣湯二方見二十四卷第六論錢氏益黄散方見二十一卷第九論四神丸方見八卷第八論七味白术散方見二十一卷第二論八味丸方見二十四卷第十一論姙娠下麻黄水方論第二論曰姙娠飲食生冷脾胃不能剋化致令心腹疼痛若血分病則色赤氣分病則色白血氣俱病則赤白相雜若熱乗大腸血虛受患則成痢也愚按治痢之法當叅前篇其下黄水乃脾土虧損真色下陷也當升補中氣若黄而兼青乃肝木剋脾土宜平肝補脾若黄而兼白乃子令母虚須補脾胃若黄而兼黒是水反侮土矣必温補脾胃若黄而兼赤乃心母益子但補中益氣若腸胃虛弱風邪客之用胃風湯或胎氣不安急補脾胃而自安矣凡安胎之藥當臨病制宜不必拘用阿膠艾葉之類附治驗地官胡成甫之内姙娠久痢自用消導理氣之劑腹内重墜胎氣不安又用阿膠艾葉之類不應余曰腹重墜下元氣虛也胎動不安内熱盛也遂用補中益氣而安又用六君子湯全愈治姙娠利黄水厚朴薑汁炙二兩黄連二兩肉豆􅅳五箇連皮右用水煎徐徐服忌如前已上六方並出産寶治姙娠熱痢黄連一升黄蘗一升梔子仁二十枚右用每服五錢水煎嘔加橘皮生薑治姙娠下痢腹痛小便澁滯糯米一合當歸炒黄茋各一兩右用水煎分四服治臨産下痢用梔子炒為末每服二錢白湯調甚效附方胃風湯方見十二卷第九論補中益氣湯二方見二十四卷第六論姙娠大小便不通方論第三夫姙娠大小便不通由臟腑之熱所致若大腸熱則大便不通小腸熱則小便不利大小腸俱熱更推其因而藥之愚按前症若大腸血燥用四物湯加條芩桃仁大腸氣滯用紫蘇飲加杏仁條芩腸胃氣虛用六君子加紫蘇杏仁肝脾藴熱用龍膽瀉肝湯心肝虛熱用加味逍遥散加車前子附治驗亞卿李蒲汀側室姙娠大小便不利或用降火理氣之劑元氣反虛肝脉弦急脾脉遲滯視其面色青黄不澤余曰此鬱怒所致也用加味歸脾湯為主佐以加味逍遥散而安主政王天成之内姙娠痢疾愈後二便不通其家世醫自用清熱之劑未效余診其脉浮大而濇此氣血虛也朝用八珍湯加桃仁杏仁夕用加味逍遥散加車前子而瘥當歸散治姙娠因怒肚腹脹痛四肢浮腫氣急作喘大便難小便澁産門腫當歸五分赤茯苓枳殻麩炒白芍藥川芎各一錢白薑炮木香煨粉草各三分右用薑水煎氣弱枳殻减半大便秘加蜜同煎治姙娠大小便不通腹脹痞悶不思飲食大黄炒木通㯽榔各一兩枳殻麩炒三錢訶梨勒四箇去核半生半煨大腹子三枚右為末用童便一盞葱白二寸煎六分調服二錢初虞世治姙娠風氣大便秘澁枳殻三兩麩炒防風二兩丼草炙一兩右為末每服一二錢空心用白滚湯調日三服小品治姙娠小便不利氣急服猪苓散不瘥用丼遂為末蜜和服豆許微利之未利再服利後仍服猪苓散猪苓散治姙娠小便澁痛及胎水猪苓去皮為末白湯調下錢許加至二錢日三夜二服又方車前子一兩大黄半兩為末每服三錢蜜湯調附方四物湯四君子湯二方見二十四卷第六論紫蘇飲方見二十四卷第八論龍膽瀉肝湯方見二十四卷第八論加味逍遥散加味歸脾湯八珍湯三方見二十四卷第四論姙娠小便不通方論第四夫姙娠小便不通為小腸有熱𫝊於脬而不通耳若兼心肺氣滯則致喘急陳無擇云姙娠胎滿逼胞多致小便不利若心腎氣虚清濁相干而為諸淋若胞系了戾小便不通名曰轉胞若胞滿尿出名曰遺尿愚按丹溪先生轉脬小便閉多因胎婦虚弱憂悶性躁食味厚古方用滑利疏導藥鮮效若脬為胎所堕而不通但升舉其胎胞系疏而小便自行若臍腹作脹而小便淋閉此脾胃氣虛胎壓尿胞四物二陳參术空心服後探吐數次自安竊謂前症亦有脾肺氣虚不能下輸膀胱者亦有氣熱鬰結膀胱津液不利者亦有金為火爍脾土濕熱甚而不利者更當詳審施治附治驗司徒李杏岡仲子室孕五月小便不利諸藥不應余曰非八味丸不能救不信别用分利之藥肚腹腫脹以致不起儒者王文逺室患此小腹腫脹㡬至於殆用八味丸一服小便滴􅅹再以前丸之料加車前子一劑即利肚腹頓宛而安八味丸治婦人飲食如故煩熱不得卧反倚息因脬系了戾不得溺名轉脬但利小便則愈盖此藥有茯苓故也緩則不救方見二十四卷第十一論古今録驗姙娠小便難飲食如故當歸貝母去心炒苦參各三兩滑石半兩右為末煉蜜丸小豆大每服二三十丸米飲下治姙娠小便不通臍下妨悶心神煩亂葵子研榆白皮切各一兩葱白七莖右水煎分三服古今録驗姙娠不得小便杏仁去皮尖炒黄搗丸燈心湯吞七粒又方滑石末水和塗臍下又方用車前草汁調滑石末塗臍周圍四寸熱易之又方搗杏仁入滑石末飯丸小豆大每服二十丸白湯下又方用紫苑為丸井花水調下二錢葵子散治姙娠小便不利身重惡寒眩暈及水腫用葵子五兩赤茯苓五兩為末每服二錢米飲調附方四物湯方見二十四卷第六論二陳湯方見二十四卷第五論姙娠子淋方論第五姙娠小便淋者乃腎與膀胱虚熱不能制水然姙婦胞繫於腎腎間虛熱而成斯症甚者心煩悶亂名曰子淋也愚按前症若頸項筋攣語濇痰甚用羚羊角散若小便濇少淋􅅹用安榮散若肝經濕熱用龍膽㵼肝湯若肝經虚熱用加味逍遥散腿足轉筋而小便不利急用八味丸緩則不救若服燥劑而小便頻數或不利用生地茯苓牛膝黄栢知母芎歸甘草若頻數而色黄用四物加黄柏知母五味麥門𤣥參若肺氣虛而短少用補中益氣加山藥麥門若隂挺痿痺而頻數用地黄丸若熱結膀胱而不利用五淋散若脾肺燥不能化生宜黄芩清肺飲若膀胱陰虛陽無所生用滋腎丸若膀胱陽虛隂無所化用腎氣丸附治驗一婦人每怒發熱脇脹小便淋濇如遇經行旬餘未已受胎三月因怒前症復作朝用加味逍遥散夕用安胎飲各二劑而安五月又怒復下血如經行四日未止仍用前藥而愈一姙娠飲食後因惱怒寒熱嘔吐頭痛惡寒胸腹脹痛大便不實其面青色小便頻數時或有血服安胎止血之劑益甚余曰寒熱嘔吐而腹脹此肝木尅脾土而元氣傷也大便不實而面青此飲食傷脾兼肝侮土也小便頻數而有血此肝熱傳胞而兼挺痿也用六君子加枳殻紫蘇山梔二劑脾胃頓醒又用加味逍遥散加紫蘇枳殻二劑小便頓清後節飲食調理而安地膚大黄湯治子淋大黄炒三兩地膚草三兩知母黄芩炒猪苓通草赤芍藥升麻枳實炒甘草各二兩右每服四五錢水煎服安榮散治子淋甚妙麥門冬去心通草滑石當歸燈心甘草人參細辛各五分右水煎服治小便淋痛心煩悶亂􅜰麥穂赤茯苓桑白皮木通葵子各一錢黄芩炒芍藥枳殻車前子炒各五分右水煎服治子淋小便澁痛冬葵子滑石木通各等分右每服四五錢葱白七寸水煎猪苓散療子淋小便澁痛方見本卷第三論附方羚羊角散方見四卷首論龍膽瀉肝湯方見二十四卷第八論加味逍遥散四物湯二方見二十四卷第四論腎氣丸即六味丸六味丸八味丸三方見二十四卷第十一論六君子湯補中益氣湯二方見二十四卷第六論五淋散滋腎丸黄芩清肺飲三方見八卷第一論安胎飲方見十二卷第二論姙娠遺尿方論第六姙娠尿出不知用白薇芍藥為未酒調下或白礬牡蠣為末酒調二錢或鷄毛灰末酒服一匕或炙桑螵蛸益智子仁為末米飲下愚按前症若脬中有熱宜用加味逍遥散若脾肺氣虛宜用補中益氣湯加益智若肝腎隂虛宜用六味丸附治驗方藥一姙婦遺尿内熱肝脉洪數按之微弱或兩太陽作痛脇肋作脹余以為肝火血虛用加味逍遥散六味地黄丸尋愈後又寒熱或發熱或恚怒前症仍作用八珍散逍遥散兼服以清肝火養肝血而痊附方加味逍遥散八珍湯二方見二十四卷第四論補中益氣湯方見二十四卷第六論六味地黄丸方見二十四卷第十一論姙娠尿血方論第七姙娠尿血内熱乘於血分以致血熱流滲於脬名子淋用葵子一升研細水五升煮二升分三服或生艾葉一斤酒五升煮二升分三服或生地黄一斤酒四升煮二升分三服亦治落産後下血愚按前症因怒動火者宜小柴胡加山梔因勞動火者宜補中益氣湯若因厚味積熱宜用加味清胃散若因肝經血熱宜用加味逍遥散若因脾氣下陷宜用補中益氣湯若因脾虛血熱宜用加味逍遥散附治驗一姙婦因怒尿血内熱作渴寒熱往來胸乳間作脹飲食少思肝脉弦弱此肝經血虛而熱也用加味逍遥散六味地黄丸兼服漸愈又用八珍湯加柴胡丹皮山梔而痊續斷湯治姙娠下血及尿血續斷半兩赤芍藥五錢當歸生地黄各一兩右為末毎服二錢空心用葱白煎湯調下治姙娠尿血阿膠炒為末四兩熟地黄用生者四兩酒拌蒸熟杵膏右和丸桐子大每服七八十丸空心粥飲下五苓散去桂加阿膠炒同為粗末每四錢用車前子白茅根水煎温服又方白茅根濃煎湯吞酒蒸黄連丸附方小柴胡湯方見二十四卷第二論補中益氣湯方見二十四卷第六論加味清胃散方見二十四卷第一論加味逍遥散加味歸脾湯二方見二十四卷第四論姙娠胎水腫滿方論第八産乳集云姙娠三月足腫至腿出水飲食不丼似水腫謂之子氣至分㝃方消者此脾胃氣虛或衝任經有血風名醫録云宋少主元徽與徐文伯微行學鍼法文伯見一姙婦足腫脉之少主曰此女形也文伯曰此鬼胎也在左而黒遂用鍼胎下果然亦有脾虛水氣流溢或因瀉痢臟腑虚寒或因瘧疾飲水脾虛濕漬或因水漬於胞不能分利皆致腿足肚腹腫症也愚按前症若胸滿腹脹小便不通遍身浮腫用鯉魚湯脾胃虛弱佐以四君子若面目虛浮肢軆如水氣用全生白术散如未應用六君子湯脾虛濕熱下部作腫用補中益氣加茯苓若飲食失宜嘔吐泄瀉用六君子湯若腿足發腫喘悶不安或指縫出水用天仙藤散脾胃虛弱兼四君子湯如未應用補中益氣湯若脾肺氣滯用加味歸脾湯佐以加味逍遥散附治驗一姙娠每胎至五月肢軆倦怠飲食無味先兩足腫漸至遍身後及頭面此是脾肺氣虛朝用補中益氣夕用六君子加蘇梗而愈凡治姙娠毋泥月數但見某經症即用本藥為善天仙藤散治婦人有水氣而成胎以致兩腿足浮腫天仙藤洗畧炒香附子炒陳皮甘草烏藥軟白者辣者良各五分右每服五錢生薑木𤓰蘇葉各三片水煎日三服澤瀉散治姙娠遍身浮腫上氣喘急大便不通小便赤澁澤瀉桑白皮炒木通枳殻麩炒㯽榔赤茯苓各五分右薑水煎服防已散治脾虛遍身浮腫腹脹喘促小便不利防已三錢桑白皮炒紫蘇莖葉赤茯苓各五分木香二分右薑水煎千金鯉魚湯治姙娠腹小胎間有水氣白术五兩茯苓四兩當歸芍藥各三兩右先以小鯉魚一頭如食法煮取汁每汁二盞入藥五錢薑七片橘皮少許煎七分空心服腎着湯治姙娠腰脚腫茯苓白术各八分乾薑炮甘草各一錢杏仁五分右用水煎服五丸散治胎水腫滿大腹皮桑白皮炒生薑皮橘皮茯苓皮各一錢木香右水煎服治姙娠脚浮腫因脾衰血化成水用生料平胃散薑棗水煎服或為末用蘇葉湯調下每服二錢全生白术散治姙娠面目浮虛四肢腫如水氣名曰胎氣名曰胎腫白术一兩生薑皮大腹皮陳皮白茯苓各半兩右各為末每服二錢米飲下附方四君子湯六君子湯補中益氣湯三方見二十四卷第六論加味歸脾湯加味逍遥㪚二方見二十四卷第四論姙娠腹内鐘鳴方論第九治孕婦腹内鳴用鼠窟中土為末入麝香酒調下二錢立愈或黄連濃煎汁母常呷之愚按産寳云小兒在腹中哭其治法亦用空房中鼠穴土或黄連煎濃飲之即止想即是症又云臍帶上疙瘩兒含口中因姙婦登高舉臂脱出兒口以此作聲令姙婦曲腰就地如拾物仍入兒口即止然黄連性寒麝香開竅當酌量用之龔彦德孕癰方第十治孕癰用烏藥五錢水一鍾煎七分入牛皮膠一兩煎化温服或薏苡仁煮汁飲之愚按孕癰即是腹内患癰如前法不應宜用牡丹皮散或薏苡仁湯治驗見二十四卷姙娠不語論第十一孕婦不語不須服藥臨産月但服保生丸四物湯産下便語黄帝問曰人有重身九月而瘖何也岐伯對曰胞絡繋於腎腎脉貫繫舌本故不能言十月分娩後自為之言也愚按前症果内經窮理之言人有患此當調攝以需之不必驚畏而泛用藥也姙娠傷食方論第十二經曰飲食自倍腸胃乃傷又云隂之所生本在五味隂之五宫傷在五味故姙娠傷食最難調治者愚按東垣先生云脾胃之氣壯則過時而不饑多食而不傷盖胃主司納脾主消化五臟之本也然食倍而傷者乃脾氣虛而不化也若投以峻劑則脾胃復傷而胎亦損矣當審其所因而調治之若飲食停滯或肚腹作痛用平胃散嘔吐惡心加枳殻砂仁吞酸噯腐加黄連三分吳茱茰二分腹滿泄瀉用六君子湯停滯肉食倍加山查停滯麵食倍加麥蘖停滯糯食用白酒麯末一味米食停滯倍加穀蘖魚腥所傷倍加陳皮傷辛熱之物加黄連傷性冷之物加砂仁木香如不應更加肉豆蔲補骨脂再不應用四神丸若脾氣下陷用補中益氣湯凡噯覺藥氣且戒藥餌節飲食經云損其脾者調其飲食適其寒温大凡脾胃虛弱飲食難化以白术陳皮為末等分陳麯糊丸常服最善枳术丸但可暫用枳實峻厲能耗真氣治者慎之附治驗一姙娠因停食服枳术丸胸腹不利飲食益少更服消導寛中之劑其胎下墜余謂此脾氣虚而不能承載也用補中益氣及六君子湯中氣漸健其胎漸安又用八珍湯加柴胡升麻調理而痊木香丸治姙娠脾胃虚弱飲食不消肚腹膨脹或嘔吐泄瀉木香二錢白术炒人參白茯苓各等分右為末麵糊丸菉豆大毎服三四十丸熟水下白术散治姙娠脾胃虛弱氣不調和飲食易傷白术炒紫蘇各一兩人參白芷各三錢炒川芎青皮訶子皮各半兩甘草炒一錢右每服二錢薑水煎附方平胃散方見七卷第十八論補中益氣湯六君子湯二方見二十四卷第六論四神丸方見八卷第八論八珍湯方見二十四卷第四論姙娠臟燥悲傷方論第十三許學士云一婦無故數次悲泣是為臟燥用大棗湯而愈又程虎卿内姙娠五月慘慼悲傷亦投大棗湯而愈愚按前症或因寒水攻心或肺有風邪者治當審察附治驗一姙婦無故自悲用大棗湯二劑而愈後復患又用前湯佐以四君子加山梔而安一姙婦悲哀煩燥其夫詢之云我無故但自欲悲耳用淡竹茹湯為主佐以八珍湯而安大棗湯甘草三兩小麥三兩大棗十枚右水六鍾煎三鍾分三服亦補脾氣淡竹茹湯治姙娠心虛驚悸臟燥悲傷或作虛煩麥門冬去心小麥半夏湯炮各一錢五分人参白茯苓各一錢甘草五分右薑棗并竹茹少許水煎治胎臟燥悲哭用紅棗燒存性米飲調下附方四君子湯方見二十四卷第六論八珍湯方見二十四卷第四論薛氏醫案卷三十九
