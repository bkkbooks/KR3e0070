body:
  text: 薛氏醫案卷十六明薛已撰外科樞要四治瘡􅅑各症附方托裏消毒散治胃氣虛弱或因尅伐不能潰散服之未成即消已成即潰腐肉自去新肉自生若腐肉既潰而新肉不能收斂屬氣虛者四君子湯為主屬血虛者四物湯為主氣血俱虛者十全大補湯為主並忌寒凉消毒之劑人參黄茋鹽水拌炒當歸酒拌川芎芍藥炒白术炒茯苓各一錢金銀花白芷各七分甘草炙五分連翹五分右水煎服托裏散治瘡瘍因氣血虛不能起發腐潰收斂及惡寒發熱者宜用此補托其屬六淫七情或諸經錯雜之邪而為患者當各審其因而參以主治之劑其屬胃氣虛弱者當以六君子湯為主人參氣虛者多用之黄茋炒各二錢白术炒陳皮當歸熟地黄白製茯苓芍藥酒炒各一錢半右水煎服清熱消毒散治一切癰疽陽症腫痛發熱作渴黄連炒山梔炒連翹當歸各一錢川芎芍藥炒生地黄各一錢五分金銀花二錢甘草一錢右水煎服黄連消毒散治腦疽背疽腫焮疼痛或麻木黄連製羌活各一分黄芩黄栢各五分生地黄知母製獨活防風當歸尾連翹各四分藁本防已桔梗各五分黄茋蘇木陳皮澤㵼各二分人參甘草各三分右水煎服清涼飲治瘡瘍煩躁飲冷焮痛脈實大便秘結小便赤澁大黄炒赤芍藥當歸甘草各二錢右水煎服破棺丹治瘡瘍熱極汗多大渴便秘譫語發狂大黄二兩五錢半生半熟芒硝甘草各二兩右為末煉蜜丸如彈子大每服一丸童便酒化下白湯亦可黄連解毒湯治瘡瘍焮痛煩躁飲冷脈洪數或發狂言黄芩黄栢炒黄連炒山梔各一錢五分右水煎熱服内疏黄連湯治瘡瘍發熱而嘔大便秘結脈洪而實黄連芍藥當歸梹榔木香黄芩梔子薄荷桔梗甘草各一錢連翹大黄各一錢五分每薑水煎仍量虛實治之托裡榮衛湯治瘡瘍外無焮腫内便調和乃邪在經絡宜用此藥黄茋紅花各一錢桂枝七分蒼术米泔浸柴胡連翹羌活防風當歸身酒拌甘草炙黄芩人參各一錢右酒水煎服内托復煎散治瘡瘍腫焮在外其脈多浮邪氣勝必侵於内宜用此托之地骨皮黄芩炒茯苓白芍藥炒人參黄茋鹽水拌炒白术炒桂甘草炙防已酒炒當歸酒拌各一錢防風二錢右先以蒼术一升水五升煎去术入藥再煎至二升終日飲之人參敗毒散治瘡􅅑焮痛寒熱或拘急頭痛脈細有力人參羌活獨活前胡柴胡桔梗枳殻茯苓川芎甘草各一錢右水煎服仙方活命飲治一切瘡􅅑未成膿者内消已成膿者即潰又止痛消毒之聖藥也白芷防風沒藥穿山甲蛤粉炒黄甘草赤芍藥當歸尾乳香天花粉貝母各一錢金銀花陳皮各三錢皂角刺一錢右酒一碗煎數沸服清心湯治瘡􅅑腫痛發熱飲冷脈沉實睡語不寧即防風通聖散每料加黄連五錢每劑一兩水煎服奪命丹治疔瘡發背等症或麻木或嘔吐重者昏憒若疔毒牙闗𦂳急用三五丸為末水調灌下有奪命之功蟾酥乾者酒化輕粉各五分枯礬寒水石煨銅緑乳香沒藥麝香各一錢硃砂三錢蝸牛二十箇另研無亦効右為末用蝸牛或酒糊丸菉豆大每服二三丸温酒葱湯下東垣聖愈湯治脾胃虧損膿水不止或金瘡出血心煩不安眠睡不寧五心煩熱飲食少思地黄酒拌蒸半日生地黄酒拌川芎人參各五分當歸酒拌黄茋鹽水浸炒各一錢右水煎服濟隂湯治瘡屬純陽腫痛發熱連翹山梔炒黄芩炒黄連炒各二錢芍藥一錢五分金銀花二錢甘草一錢牡丹皮一錢二分右水煎服大便秘量加大黄抑陽散治瘡屬純陽腫痛發熱天花粉三兩黄薑白芷赤芍藥各一兩右為末茶湯調搽患處冲和湯治瘡屬半隂半陽似潰非潰似腫非腫此因元氣虛弱失於補托所致人參二錢黄茋白术當歸白芷各一錢半茯苓川芎皁角刺炒乳香沒藥各一錢金銀花一錢陳皮二錢甘草一錢右水酒各半煎服隂陽散治瘡屬半隂半陽紫荆皮炒五兩獨活去節炒一兩赤芍藥炒二兩白芷二兩石菖蒲二兩右為末葱酒調搽囘陽湯治脾腎虛寒瘡屬純隂或藥損元氣不腫痛不腐潰或腹痛泄㵼嘔吐厥逆或陽氣脱陷等症乾薑炮附子炮各二錢人參白术黄茋各三錢當歸陳皮甘草炙各二錢柴胡升麻各五分右酒水煎服不應薑附倍之抑隂散治瘡􅅑元氣虛寒焮腫不消或不潰斂或筋攣骨痛一切冷症草烏二兩白桂五錢赤芍藥炒南星煨白芷右為末葱湯調塗熱酒亦可托裡温中湯治瘡􅅑膿潰元氣虛寒或因尅伐胃氣脱陷腸鳴腹痛大便溏泄神思昏憒此寒變内陷緩則不治羌活四錢附子炮去皮臍乾薑炒三錢益智丁香沉香木香茴香陳皮各一錢甘草炙二錢右薑水煎服附子理中湯治瘡􅅑脾胃虛寒或誤行攻伐手足厥冷飲食不入或腸鳴腹痛嘔逆吐㵼附子人參茯苓白芍藥各三錢白术四錢右水煎服薑附湯治瘡􅅑真陽虧損或誤行汗下或膿血出多失於補托以致上氣喘急自汗盜汗氣短頭暈人參一兩乾薑炮白术各五錢附子炮去皮臍一兩右作二劑水煎服參附湯治失血過多或膿瘀大泄或寒涼汗下真陽脱陷上氣喘急自汗盜汗氣短頭暈等症急服以救元氣緩則不治人參附子炮去皮臍各五錢右薑五片水煎服不應倍之獨參湯治一切失血或膿水出多血氣俱虛惡寒發熱作渴煩躁蓋血生於氣故血脱補氣陽生隂長之理也用人參二兩棗十枚薑十片水煎徐徐服人參理中湯治瘡􅅑脾胃虛寒嘔吐泄瀉飲食少思肚腹作脹或胸膈虛痞飲食不入白术人參乾薑甘草炙各等分右薑棗水煎服竹葉黄茋湯治癰疽氣血虛胃火盛而作渴淡竹葉二錢黄茋麥門當歸川芎甘草黄芩炒芍藥人參半夏石膏煨各一錢生地黄一錢右每服三五錢水煎服竹葉石膏湯治癰疽胃火盛腫痛作渴淡竹葉石膏煨桔梗木通薄荷甘草各一錢當歸川芎散治手足少陽經血虛瘡症或風熱耳内痒痛生瘡出水或頭目不清寒熱少食或婦女經水不調胸膈不利脇腹痞痛當歸川芎柴胡白术芍藥各一錢山梔炒一錢二分牡丹皮茯苓各八分蔓荆子甘草各五分右水煎服若肝氣不平寒熱加地骨皮肝氣實加柴胡黄芩氣血虛加參茋歸地脾虛飲食少思加苓术脾虛胸膈不利加參茋痰滯胸膈不利加术半肝氣不順胸膈不利或小腹痞滿或時攻痛加青皮肝血不足胸膈不利或小腹痞滿或時作痛加熟地肝血虛寒小腹時痛加肉桂日晡發熱加歸地梔子青肝散一名柴胡梔子散治三焦及足少陽經風熱耳内作痒生瘡或出水疼痛或胸乳間作痛或寒熱徃來柴胡牡丹皮梔子炒各一錢茯苓川芎芍藥當歸牛蒡子炒各七分甘草五分右水煎服若太陽頭痛加羌活柴胡清肝散治鬂疽及肝膽三焦風熱怒火之症或項胸作痛或瘡毒發熱柴胡一錢五分黄芩炒一錢人參一錢山梔炒一錢五分川芎一錢連翹桔梗八分甘草五分右水煎服小柴胡湯治肝膽經症風熱瘰癧結核或腫痛色赤或寒熱徃來或日晡發熱或潮熱身熱黙黙不欲飲食或怒火口苦耳聾咳嗽或吐酸食苦水皆用此藥柴胡二錢黄芩一錢人參半夏各七分甘草炙五分右薑水煎服補隂八珍湯治瘰癧等瘡屬足三隂虛者當歸川芎熟地芍藥人參白术茯苓甘草黄栢酒炒黒知母酒炒各七分右水煎服瀉青丸治肝經實熱瘰癧腫痛寒熱或脇乳作痛大便秘結當歸龍膽草酒炒川芎山梔大黄炒𦍑活防風各等分右為末蜜丸雞頭子大每服一二丸白湯化下若血虛者四物加山梔柴胡或逍遥散若腎水虧損不能生肝木而自病筋攣結核或肢節拳攣或似中風宜用六味丸加五味子散腫潰堅湯治瘰癧堅硬氣血無虧宜用之柴胡四分升麻三分連翹三分龍膽草酒炒五分黄芩酒炒四分甘草炙二分桔梗五分昆布五分當歸尾酒拌白芍藥炒黄栢酒炒葛根各三分知母酒炒五分三稜酒拌微炒廣术各三分𤓰蔞根五分右水煎服益氣養榮湯治懷抱抑鬱或氣血損傷四肢頸項等處患腫不問軟硬赤白腫痛或潰而不斂人參茯苓陳皮貝母香附川芎黄茋鹽水拌炒生地黄酒拌芍藥炒各一錢甘草炙桔梗各五分白术炒二錢柴胡六分右薑水煎服必效散治瘰癧氣血雖無虧損内有癧核未去而不能愈南硼砂二錢五分輕粉一錢麝香五分巴豆五箇去皮心膜白梹榔一箇斑猫四十箇去頭翅同糯米炒右同研極細末取鷄子二箇去黄用清調藥仍入殻内以濕紙數重糊口入飯甑候熟取出曝乾研末虛者每服五分實者一錢用炒生薑酒五更初調服如覺小腹痛用益元散一服其毒俱從大便出胎婦勿餌毒去後多服益氣養榮湯瘡口自合針頭散治一切頑瘡内有瘀肉癧核不化瘡口不合宜用此藥腐之赤石脂五錢乳香白丁香各三錢砒一錢黄丹一錢輕粉麝香各五分蜈蚣一條炙乾右為末搽瘀肉上其肉自腐若瘡口小或痔瘡用糊和作條子隂乾絍之凡瘡乆不合者内有膿管須用此腐之内服托裡之劑神仙隔蒜灸法治一切癰疽腫毒前論言之詳矣凡大痛或不痛或麻木痛者灸至不痛不痛灸至痛其毒隨火而散此拔引鬱毒從治之法也信有囘生之功其法用大蒜頭切三分厚安瘡頭上用艾炷於蒜上灸之五炷換蒜再灸未成即消已成殺其大勢瘡患大以蒜杵爛攤患處將艾鋪蒜上灸之蒜敗再換瘡色紫或白而不起發不作膿不大痛不問日期最宜多灸神效葱熨法治流注結核骨癰鶴膝等症腫硬或先已隔蒜灸而餘腫未消最宜用熨以助氣血而行壅滯其功甚大又為跌撲傷損止痛散血消腫之良法用葱白頭搗爛炒熱頻熨患處冷再換神效桑枝炙治發背不起或瘀肉不潰此陽氣虛弱用桑枝燃火着吹熄焰用火灸患處片時日三五次以助腫潰若腐肉已去新肉生遲宜灸四畔其隂瘡瘰癧流注膁瘡惡瘡乆不愈者亦宜用之大抵此法未潰則解熱毒止疼痛消瘀腫已潰則補陽氣散餘毒生肌肉其陽症腫痛甚或重如負石初起用此法出毒水即内消其日乆者用之雖潰亦淺且無苦楚惜患者不知有此治者亦不肯用此也烏金膏治發背中央肉死塗之即腐未死塗之即生若初起腫痛用㸃數處其毒頓消若肉腐塗之即潰若惡瘡頑瘡元氣無虧乆不收斂者内有毒根以紙撚蘸絍其内有等發背因元氣虛弱或因尅伐元氣胃氣虧損毒氣散漫中黯外赤不腐不潰服大補之劑中塗三四寸許至五六日間赤黯之界自有裂紋如刀劃之狀中央漸潰漸脱須用純陽之藥以接其元氣庶能收斂若妄用刀針去肉出血陽隨隂散元氣愈傷或塗凉藥則毒氣不解氣血愈虛非徒無益而又害之其方用巴豆一味去殻炒黒研如膏㸃于患處臨用合之已上三法雖不出于方書余推其意而製用之良有竒騐砭法治丹毒疔瘡紅絲走散或時毒瘀血壅盛用細磁器擊碎取有鋒芒者一塊以筯一根劈開頭尖夾之用線縛定兩手指輕撮筯梢令磁芒正對患處懸寸許再用筯一根頻擊筯頭令毒血遇刺皆出毒入腹膨脹者難治豆䜴餅治瘡􅅑腫痛硬而不潰及潰而不斂并一切頑瘡惡瘡用江西豆豉餅為末唾津和作餅子如錢大厚如三文置患處以艾壯於餅上灸之乾則易之如背瘡用漱口水調作餅覆患處以艾鋪餅上灸之如未成者即消已成者亦殺其大毒如有不效氣血虛敗也乳香定痛散治一切瘡􅅑潰爛疼痛乳香沒藥各五錢滑石一兩寒水石一兩氷片右為細末搽患處痛即止甚效青龍湯治肺受風寒咳嗽喘急半夏湯泡七次二兩五錢乾薑炮細辛麻黄去節肉桂芍藥甘草炙各三兩五味二兩􅀈炒右每服五錢薑水煎服葶藶大棗㵼肺湯治肺症胸膈脹滿上氣喘急或身面浮腫鼻塞聲重用甜葶藶炒黄色研末每服三錢棗十枚水二鍾煎一鍾去棗入藥再煎七分食後服桔梗湯治肺症咳嗽胸膈兩脇作痛咽乾口燥煩悶作渇時出臭濁桔梗炒貝母去心當歸酒浸𤓰蔞仁枳殻麩炒薏苡仁微炒桑白皮炒甘草節各一錢防已去皮一錢黄茋鹽水拌炒五味子搗炒百合蒸各一錢五分葶藶炒地骨皮知母炒杏仁各五分右薑水煎服人參補肺湯治肺症咳喘短氣或腎水不足虛火上炎痰涎湧盛或吐膿血發熱作渴小便短澁人參黄茋白术茯苓陳皮當歸各一錢山茱萸肉山藥各二錢五味子五分麥門冬七分甘草炙五分熟地自製一錢五分牡丹皮八分右薑棗水煎服人參平肺散治心火尅肺𫝊為疽痿咳嗽喘嘔痰涎壅盛胸膈痞滿咽嗌不利若因肝木太過而致當補肺若因腎水不足而患當補脾肺若因心火旺而自病當利小便人參陳皮甘草地骨皮茯苓各一錢知母炒七分青皮四分五味子杵炒四分天門冬去心各四分桑白皮炒一錢右水煎服參茋補脾湯治肺疽脾氣虧損乆咳吐膿涎或中滿不食必服此藥補脾土以生肺金否則不治人參白术各二錢黄茋二錢五分茯苓陳皮當歸各一錢升麻三分麥門冬七分五味子四分桔梗六分甘草炙五分右薑棗水煎服射干湯治胃癰吐膿血射干去毛山梔仁赤茯苓升麻各一錢白术五分赤芍藥一錢五分右水煎服薏苡仁湯治風熱唇口瞤動或結核或浮腫薏苡仁炒防已赤小豆甘草炙各等分右水煎服𤓰子仁湯治産後惡露或經行瘀血作痛或作癰患薏苡仁四錢桃仁去皮牡丹皮𤓰蔞仁各一錢右水煎服梅仁湯治腸癰壅痛大便秘澁梅仁九箇去皮尖大黄炒牡丹皮芒硝各一錢犀角鎊末一錢冬𤓰仁研三錢右水煎入犀末服大黄湯治腸癰小腹堅腫按之則痛肉色如故或焮赤微腫小便頻數汗出憎寒脈遲𦂳膿未成急服之大黄炒朴硝各一錢牡丹皮𤓰蔞仁炒桃仁去皮尖各二錢右水煎服牡丹皮散治腸癰腹濡而痛時下膿牡丹皮人參天麻白茯苓黄茋炒薏苡仁桃仁去皮尖白芷當歸酒拌川芎各一錢官桂甘草炙五分木香右水煎服失笑散治跌撲産後心腹絞痛或不知人事或經行瘀血作痛成癰靈脂蒲黄俱炒等分右每服二三錢酒水煎熱服防風湯治破傷風表症未傳入裡急服此防風羌活獨活川芎各等分右每服五錢水煎調蜈蚣散服蜈蚣散蜈蚣一對炙鰾三錢煅羌活湯治破傷風在半表半裡間宜和解急服此湯稍緩則邪入於裡不可用矣羌活菊花麻黄川芎石膏防風前胡黄芩細辛甘草枳殻白茯苓各一兩蔓荆子一兩薄荷白芷各五錢右每服五錢薑水煎日二三服大芎黄湯治破傷風邪傳於裡舌强口噤項背反張筋惕搐搦痰涎壅盛宜急服之川芎羌活黄芩大黄各一兩右每服五七錢水煎服白术防風湯治破傷風服表藥過多而自汗者白术黄茋各一兩防風二兩右每服五七錢水煎服腑臟和而自汗者可服此藥若臟腑秘小便赤而自汗者急服大芎黄湯下之六味丸一名六昧地黄丸此壯水之劑夫人之生以腎為主凡病皆由腎虛而致此方乃天一生水之劑無有不可用者世所罕知若腎虛發熱作渴小便淋秘痰氣壅盛咳嗽吐血頭目眩暈小便短少眼花耳聾咽喉燥痛口舌瘡裂齒不堅固腰腿痿軟五臟齊損肝經不足之症尤當用之水能生木故也若腎虛發熱自汗盜汗便血諸血失瘖水泛為痰之聖樂血虛發熱之神劑也熟地黄用生者自製八兩山茱萸肉山藥各四兩茯苓牡丹皮澤㵼各三兩右地黄杵膏餘為末蜜丸桐子大每服七八十丸滚湯下八味丸治命門火衰不能生土以致脾土虛寒而患流注鶴膝等症不能消潰收斂或飲食少思或食而不化臍腹疼痛夜多漩溺即前方加肉桂附子各一兩經云益火之源以消隂翳即此方也加減八味丸治症同上即六味地黄丸加肉桂五味子各一兩八珍湯治脾胃傷損惡寒發熱煩燥作渴或瘡􅅑潰後氣血虧損膿水清稀乆不能愈即四君四物合方十全大補湯治瘡􅅑氣血虛弱腫痛不愈或潰瘍膿清寒熱自汗盜汗食少體倦發熱作渇頭痛眩暈似中風狀即八珍湯加黄茋肉桂補中益氣湯治元氣虛損或因尅伐惡寒發熱肢體倦怠飲食少思或不能起發消散生肌收斂或兼飲食勞倦頭痛身熱煩燥作渴脈洪大弦虛或微細軟弱黄茋人參白术甘草炙各一錢五分當歸一錢陳皮五分升麻柴胡各三分右薑棗水煎空心午前服生脈散治胃氣虧損隂火上衝口乾喘促或肢體倦怠肌肉消瘦面色痿黄汲汲短氣汗出不止食少作渴或膿水出多氣血俱虛煩燥不安睡臥不寧或濕熱大行火土合病脾胃虛弱身重氣短或金為火制絶寒水生化之源肢體痿軟脚欹眼黒等症人參五錢麥門冬二錢五味子一錢右水煎服如不應倍之人參養榮湯治脾胃虧損氣血俱虛發熱惡寒四肢倦怠肌肉消瘦面色痿黄汲汲短氣食少作渴凡大病後最宜用此人參一錢陳皮一錢黄茋蜜炙白芍藥一錢半炒桂心當歸白术甘草炙各一錢熟地黄五味子炒杵茯苓各七分半遠志五分右薑􅀥水煎服四君子湯治脾胃虛弱或因尅伐腫痛不散潰斂不能宜用此以補脾胃諸症自愈若誤服攻毒七惡隨至脾胃虛弱飲食少思或食而難化或欲作嘔或大便不實若脾胃氣虛瘡口出血吐血便血尤宜用之蓋氣能攝血故也若氣血俱虛之症宜于前湯但加當歸脾胃無損飲食自進隂血自生若用四物湯沉隂之劑脾胃復傷諸症蜂起若命門火衰而脾土虛寒必用八味丸以補土母人參白术茯苓各二錢甘草炙一錢右薑棗水煎服六君子湯治脾胃虛弱或寒涼尅伐腫痛不消或不潰斂宜服此湯以壯營氣諸症自愈即前方加陳皮半夏異功散治脾胃虛弱飲食少思即四君子湯加陳皮四物湯治血虛發熱或因失血或因尅伐或因潰後致晡熱内熱煩躁不安皆宜服之經云血生於脾若脾虛不能生血者宜用四君子加當歸酒炒白术以補脾當歸三錢熟地黄三錢芍藥二錢川芎一錢五分右水煎服歸脾湯治憂思傷脾血虛發熱食少體倦或脾不能攝血以致妄行吐下或徤忘怔忡驚悸少寐或心脾作痛自汗盜汗或肢體腫痛大便不調或婦人經候不准晡熱内熱或唇瘡流注等症不能消散潰斂白术白茯苓黄茋炒當歸龍眼肉遠志酸棗仁炒人參各一錢木香五分甘草炙三分右薑棗水煎服當歸補血湯治脾胃損傷或服峻劑致血氣俱虛肌熱大渴引飲目赤面紅晝夜不息其脈洪大而虛重按全無此病多得於飢飽勞役者若誤服白虎湯必死當歸三錢黄茋炙一兩右水煎服六一湯黄茋炙六錢甘草炙一錢右水煎服加味逍遥散治肝脾血虛内熱發熱或遍身搔痒寒熱或肢體作痛頭目昏重或怔忡頰赤口燥咽乾或内熱盗汗食少不寐或口舌生瘡耳内作痛或胸乳腹脹小便欠利甘草炙當歸芍藥酒炒柴胡茯苓白术炒各一錢牡丹皮山梔炒各七分右水煎服黄芩清肺飲治腎經隂虛火燥而小便不通若因脾經有熱當清其脾若因心火尅肺當制其心黄芩一錢梔子三箇打碎右水煎服滋腎丸治腎經隂虛發熱作渴便赤足熱腿軟等症凡不渇而小便秘熱在下焦血分也最宜此藥經云無隂則陽無以化若脾肺燥熱所遺當滋其化源知母黄栢各酒炒一兩肉桂右為末水丸桐子大每服百丸空心白滚湯下五苓散治下部濕熱瘡毒小便赤少澤㵼猪苓肉桂白术赤茯苓各等分右為細末每服三二錢熱湯調下犀角地黄湯治胃火血熱妄行吐衂或大便下血者犀角鎊末生地黄赤芍藥牡丹皮各一錢半升麻黄苓炒各一錢右水煎熟入犀末服若因怒而致加山梔柴胡若脾氣虛而不能攝用歸脾湯若肝脾火動而妄行用加味逍遙散若脾氣虛而不能綂用補中益氣湯加炮黒乾薑若血虛有火而妄行用四物加炮薑若腎經虛火而血妄行用六味丸料不應急加肉桂以引虛火歸源清胃散治膏粱積熱唇口腫痛齒齦潰爛焮痛連頭面或惡寒發熱升麻二錢生地黄牡丹皮黄連當歸酒洗各一錢右水煎服痛未止石膏之類可量加潤腸丸治脾胃伏火大腸乾燥或風熱血結宜用此丸通之若結在直腸宜猪膽汁導之蓋腎主五液開竅於二隂若津液滋潤大便通調若津液不足脾氣虧損必當培補猶忌前藥麻子仁桃仁去皮尖各一兩羌活歸尾大黄煨皁角刺秦芄各五錢右各另研為末煉蜜或猪膽汁丸桐子大每服三四十丸白湯下若用猪膽汁導之而不結燥急補元氣四神丸治脾腎虛弱大便不實飲食少思或小腹作痛或産後泄㵼肚腹作痛不思飲食肉豆蔲二兩五味子二兩補骨脂四兩呉茱萸浸炒一兩右為末水二碗生薑八兩紅棗一百枚煑熟取棗肉和末丸桐子大每服五七十丸空心食前白湯下二神丸治脾腎虛寒不思飲食或侵晨五更泄㵼或飲食少思大便不實其功甚效如不應乃命門火衰急用八味丸補火而生土破故紙四兩炒肉豆􅅳二兩生用右為末用大紅棗四十枚生薑四兩水煑熟去薑取棗肉和藥丸桐子大每服五十丸空心鹽湯送下越鞠丸治六鬱牙齒作痛口舌生瘡或胸膈痞滿嘔吐吞酸或腹脹腿酸等症蒼术炒神麯炒香附山查山梔炒撫芎麥芽炒各等分右為末水調麯蘖麯糊丸桐子大每服七十丸白湯下二陳湯治脾虛中脘停痰嘔吐惡心或頭目不清飲食少思等症陳皮半夏茯苓各一錢甘草炙五分右薑水煎錢氏白术散治胃氣虛或因尅伐或因吐㵼口乾作渴飲食少思藿香白术炒木香白茯苓甘草炒人參各一錢乾葛二錢右水煎服生地黄丸治師尼寡婦室女乍寒乍熱而患瘡􅅑等症肝脈弦長而出魚際生地黄一兩酒拌杵膏秦芁黄芩硬柴胡各五錢赤芍藥一兩右為末入地黄膏加煉蜜少許丸桐子大每服三十丸烏梅煎湯下日進二服加味地黄丸治肝腎隂虛瘡症或耳内痒痛出水或眼昏痰氣喘嗽或作渇發熱小便赤澁等症乾山藥山茱萸牡丹皮澤㵼白茯苓熟地黄柴胡五味各另為末等分右將二地黄搯碎酒拌濕杵膏入前末和匀加煉蜜為丸桐子大每服百丸空心白湯送下不應用加減八味丸琥珀膏治頸項瘰癧及脇下初如梅子腫結硬强漸如連珠不散不潰或潰而濃水不絶經乆不瘥漸成漏症琥珀一兩木通桂心當歸白芷防風松脂硃砂研各五錢麻油二觔丁香木香各三錢木鱉子肉五錢右先用琥珀丁香桂心硃砂木香為末其餘藥入油内煎黒濾去柤徐徐入黄丹再煎軟硬得中即成膏矣人參黄茋湯治潰瘍飲食少思無睡發熱人參麥門冬陳皮白术蒼术各五分黄茋一錢黄栢炒四分升麻歸身各五分右水煎服托裏當歸湯治潰􅅑氣血俱虛瘡口不斂或晡熱内熱寒熱徃來或婦人諸症經候不調小便頻數大便不實等症當歸黄茋人參熟地黄川芎芍藥各一錢柴胡甘草各五分右水煎服人參内托散治瘡􅅑潰膿而作痛者人參黄茋當歸川芎厚朴防風桔梗白芷官桂紫草木香甘草右入糯米一撮水煎服霍香正氣散治外感風寒内停飲食頭疼寒熱或霍亂泄㵼或作瘧疾等症桔梗大腹皮紫蘇茯苓白芷半夏陳皮白术厚朴各一錢炙甘草五分霍香一錢五分右薑棗水煎服升陽除濕湯治脾胃虛弱不思飲食腸鳴腹痛泄㵼無度小便赤黄四肢困倦甘草麥芽陳皮猪苓各三分澤㵼益智仁半夏防風神麯升麻柴胡羌活各五分蒼术一錢白术二錢茯苓七分右薑棗水煎服十宣散治瘡瘍脈緩澀體倦惡寒或脈浮𦂳細用之以散風助陽氣也人參當歸黄茋桔梗炙草白芷川芎各一錢厚朴防風肉桂各五分右水煎服參术膏治中氣虛弱諸藥不應或因用藥失宜耗傷元氣虛症蜂起但用此藥補其中氣諸症自愈人參白术右水煎稠湯化服之清燥湯治元氣虛弱濕熱乘之肢體痠軟或頭目眩暈飲食少思口乾作渴或自汗盗汗胸滿氣促小便赤少大便不調等症黄茋一錢五分五味子九粒黄連二分蒼术白术麥門冬生地黄陳皮澤㵼各五分茯苓人參去蘆當歸酒洗升麻各三分神麯炒猪苓柴胡炙草各二分黄栢酒洗一分右水煎服補真丸治真隂虧損諸症葫蘆芭炒附子陽起石煨肉蓯蓉酒浸焙乾五味子肉荳􅅳川烏兎絲子洗淨酒浸沉香鹿茸酒浸炒巴㦸天去心鍾乳粉各一兩半右為末用羊腰子兩對治如食法酒煑搗爛入酒糊丸如梧桐子大每服七十丸空心米飲鹽湯任下托裏健中湯治瘡瘍元氣素虛或因涼藥傷胃飲食少思或作嘔㵼等症人參白术茯苓各二錢半夏炮薑各一錢炙草五分黄茋一錢五分肉桂三分右薑棗水煎服托裏益中湯治中氣虛弱飲食少思或瘡不消散或潰而不歛人參白术陳皮半夏茯苓炮薑各一錢木香炙草各五分右薑棗水煎服托裏益青湯治脾土虛弱肝木所侮以致飲食少思或胸膈不利等症人參白术茯苓半夏各一錢芍藥柴胡各五分陳皮一錢甘草五分右薑棗水煎服托裏益黄湯治脾土虛寒水反侮土以致飲食少思或嘔吐泄㵼等症人參白术陳皮茯苓半夏各一錢炮薑丁香炙草各五分右薑棗水煎服托裏越鞠湯治六鬱所傷脾胃虛弱飲食少思等症人參白术各二錢陳皮半夏各一錢山梔川芎香附蒼术各七分炙草五分右薑棗水煎服乳香止痛散治瘡瘇痛不止粟殻三錢白芷一錢五分炙草陳皮各一錢乳香五分沒藥五分丁香三分右作二劑水煎服濟生犀角地黄湯治鬱熱不解衂血便血等症犀角生地白芍藥牡丹皮各等分右每服五七錢水煎服加減仝上亦治便血痔瘡方雄黄五分細研五靈脂去石燒過斷煙五棓子泡過各一錢白礬半飛半生沒藥二錢半明淨者右為細末研令極細用紙花子貼瘡口上猪蹄湯香白芷黄芩赤芍藥生甘草當歸羌活露蜂房取有蜂兒者右先將猪蹄一隻用水數碗煑熟取清汁分作十數次每次用前藥一兩煎十數沸去滓無風處淋洗死肉惡血隨洗而下極效神效𤓰蔞散治乳癰初起者自消膿成者自潰及一切癰疽或潰後餘毒亦宜用之黄𤓰蔞一枚當歸五錢生甘草五錢乳香沒藥各一錢右用水酒煎服清肝解鬱湯治肝經血虛風熱或肝經鬱火傷血乳内結核或為腫潰不愈凡肝膽經血氣不和之症皆宜用此藥人參一錢柴胡八分白术一錢五分牡丹皮八分茯苓一錢陳皮八分甘草五分當歸一錢五分貝母一錢川芎八分山梔炒芍藥炒熟地黄各一錢右水煎服清肝益榮湯治肝膽小腸經風熱血燥筋攣結核或耳項胸乳脇肋作痛或作瘊子并一切肝火之症山梔當歸木瓜不犯鐵器茯苓各一錢柴胡川芎芍藥炒各七分龍膽草八分白术二錢熟地一錢五分炙草五分右薑水煎服益元散滑石六兩甘草一兩右為末每服一錢酒調下神效開結散治癭疾不問年嵗極騐沉香木香猪厭肉子生於豚猪項下橘紅四兩珍珠四十九粒砂鍋内泥封口煅過絲一枚如棗大取四十九右為末每服一錢臨卧冷酒調搽徐徐嚥下輕者三五服重者一料全愈修合用除日效忌鹹酸油膩濇氣等物海藻散堅丸治肝經癭瘤海藻昆布各二兩龍膽草二兩小麥四兩醋煑炒乾右為末煉蜜丸桐子大每服二三十丸臨卧白湯送下并噙化嚥之普濟消毒飲治天行時毒頭面瘇痛或咽喉不利若饑饉之後患之最宜用仍當固胃氣黄芩連翹各五錢人參三錢陳皮𤣥參甘草柴胡桔梗各一錢牛蒡子馬勃板藍草根各七分白殭蠶升麻各五分右水煎服大便秘量加大黄通氣散治時毒瘇甚取􅅉以泄其毒𤣥參一錢五分猪牙皂角川芎各一錢藜蘆五分羊躑躅花二錢五分右為末用紙撚蘸少許入鼻内取􅅉為度防風通聖散治時毒熱毒便秘熱燥若時毒饑饉之後胃氣虧損者須當審察非大滿大實不用防風當歸川芎芍藥大黄芒硝連翹薄荷麻黄桔梗石膏黄芩各一兩白术山梔荆芥各二錢五分甘草二兩滑石一兩右水煎服或為末白湯調下仍量人虛實葛根牛蒡湯治時毒腫痛而便利調和者葛根貫仲甘草又名國老豆豉牛蒡子半生半炒各二錢右水煎服犀角升麻湯治時毒或風熱頭面瘇痛或咽喉不利或風熱鬂疽痄􅾚等症犀角升麻防風羌活各一錢白芷黄芩各五分白附子五分國老六分右水煎服白芷胃風湯治手足陽明經氣虛風熟面目麻木或牙闗𦂳急眼目瞤動白芷二錢五分升麻二錢五分葛根蒼术米泔炒各八分灸草一錢五分當歸一錢五分草荳􅅳柴胡黄栢藁本羌活各四分蔓荆子三分白殭蠶三分麻黄去節七分右水煎服升麻黄連湯治胃經熱毒腮瘇作痛或發寒熱升麻川芎當歸各一錢半連翹黄連牛蒡子白芷各一錢右水煎服焮連太陽加羌活連耳後加山梔柴胡梔子仁湯治時毒瘇痛大便秘結鬱金枳殻升麻山梔炒各一錢右水煎服雙解散治便癰内藴熱毒外挾風邪或交感失宜精血交錯以致瘇痛大小便秘結先用此藥通解更用調補之劑辣桂大黄白芍藥澤㵼牽牛杵炒炙草桃仁乾薑各五分右水煎服製甘草法治懸癰不拘腫潰右每用大甘草一兩切五寸許用澗水一碗浸透以慢火炙乾仍投前水浸透再炙至水乾為度却挫細用水二鍾煎八分空心服大蘆薈丸一名九味蘆薈丸治肝火下疳潰爛或作痛焮腫或治小兒疳膨食積口鼻生瘡牙齦蝕爛等瘡并蟲蝕肛門痒痛胡黄連蘆薈黄連木香白蕪荑青皮白雷丸鶴虱草各一兩麝香一錢右為末蒸餅糊丸桐子大每服一錢空心米湯下八正散治下疳便毒小便淋漓脈症俱實者大黄車前子瞿麥扁蓄山梔木通各二錢滑石二兩甘草一錢右水煎服内托羌活湯治臀癰腫痛兩尺脈𦂳按之無力者𦍑活黄栢各一錢防風藁本肉桂連翹炙草蒼术陳皮黄茋各一錢五分右水酒煎服大防風湯治足三隂經虧損外邪乘虛患鶴膝風或附骨疽腫痛或腫而不痛不問已潰未潰用三五劑後更用調補之劑附子牛膝各一錢白术羌活人參防風川芎一錢五分辣桂黄茋白芍藥杜仲熟地甘草炙各五分右水煎服加味龍膽㵼肝湯治肝經濕熱或囊癰便毒下疳懸癰腫焮作痛小便濇滯或婦人隂瘡痒痛或男子隂挺瘇脹或出膿水龍膽草澤㵼各一錢車前子生地黄木通當歸尾山梔枯黄芩炙甘草各五分右水煎服清心蓮子飲治膀胱氣虛濕熱玉莖腫痛或莖竅濇滯口苦咽乾小便色赤或白濁夜安靜而晝發熱黄芩麥門冬地骨皮車前子炙甘草各一錢五分石蓮肉白茯苓黄茋柴胡人參各一錢右水煎服五淋散治膀胱有熱水道不通或尿如豆汁或如沙石或如膏汁或熱沸便血赤茯苓一錢五分赤芍藥山梔各一錢當歸甘草各一錢五分右用燈心二十根煎服清肺飲治渴而小便不利乃肺經有熱是絶寒水生化之源宜用此藥以清化源其水自生而便自利矣茯苓二錢猪苓三錢澤㵼五分琥珀五分燈心一分木通七分通草六分車前子一錢􅜰麥五分扁蓄七分右為細末每服五錢水煎服腎氣丸治腎經陽虛隂無所化以致膀胱淋漓或脾肺氣虛不能通調水無所化而膀胱癃閉或腎氣虛熱干於厥隂之絡隂挺痿痺而溺頻數或腎水虛弱隂虧難降使津液敗濁而為痰水又治腎虛便血及諸見血發熱自汗盜汗等症之聖藥也六味丸方見前還少丹治足三隂經虛損患偏風等症又補脾腎進飲食之良劑也肉蓯蓉去甲酒浸遠志去心甘草湯泡去骨茴香炒巴㦸去心枸杞子山藥牛膝熟地黄為膏石菖蒲杜仲五味子白茯苓猪實子山茱萸各等分右為末用紅棗肉同蜜為丸桐子大每服七十丸温酒送下每日三服白湯送下不換金正氣散治脾氣虛弱寒邪相摶痰停胸膈寒熱少食厚朴藿香半夏蒼术陳皮甘草各等分右薑棗水煎服槐花散治腸風濕毒下血槐花青皮各六分當歸一錢荆芥熟地黄白术各六分川芎四分升麻二錢右水煎服四生散治膁腿瘡淫不愈或目昏花名腎臟風并治風癬疥癩血風瘡症白附子真者生用黄茋獨活蒺藜各等分右為末每服二錢用猪腰子一枚批開入藥濕紙包裹煨熟空心連腰子細嚼鹽湯送下消風散一名人參消風散治風熱癮疥搔痒發熱或頭皮腫痒頭目昏眩鼻流清水􅅉噴聲重耳作蟬鳴荆芥穗炙草人參白殭蠶白茯苓防風芎藭藿香蟬蜕各二兩陳皮厚朴薑製羌活各五分右為末每服三錢茶清調下瘡癬温酒下升麻和氣飲治風癬瘡疥熱結大便不通當歸陳皮各一錢半芍藥酒炒枳殻麩炒各八分半夏薑製蒼术米泔浸炒桔梗炒黄色白芷浸軟切片乾葛浸軟切片白茯苓炙草各一錢乾薑炮黒大黄各五分升麻三分右水煎服換肌消毒散治時瘡不拘初起潰爛土茯苓五錢當歸酒洗白芷皁角刺各一錢薏苡仁一錢白蘚皮木𤓰不犯鐵器木通金銀花各七分炙草五分右水煎服九味羌活湯治風熱鬱遏瘡焮作痛或遍身作痛或拘急不利又治頭痛惡寒脊强脈浮𦂳又治非冬時天有暴寒人中之頭痛寒熱宜用此以代麻黄湯此神藥也羌活防風蒼术各一錢半川芎白芷生地黄芩煑軟切片細辛甘草右水煎服衣覆之取微汗濕隂天加蒼术天淫雨亦加如渴加石膏三錢知母一錢不渴不加加味羌活散即前湯加金銀花連翹當歸飲子治風濕所傷以致瘡疥等症當歸黄茋芍藥荆芥穗防風蒺藜何首烏生地黄川芎甘草各等分右水煎服黒丸子一名和血定痛散治跌撲墜墮筋骨疼痛或瘀血壅腫或外感風寒肢體作痛苦流注膝風初結服之自消若潰後氣虛而發熱與補劑兼服自斂百草霜一兩白芍藥一兩川烏炮三錢赤小豆一兩五錢白歛一兩六錢白芨當歸各八錢南星炮三錢牛膝焙六錢補骨脂焙八錢右各另為末酒糊丸桐子大每服三十丸鹽湯温酒任下孕婦不可服太乙膏治一切瘡瘍並宜貼之若元氣無虧用隔蒜灸更服活命飲以收全功𤣥參白芷當歸肉桂大黄赤芍藥生地黄各一兩右用麻油二觔入銅鍋内煎至黒濾去查入黄丹十二兩再煎水中捻軟硬得中即成膏矣藜蘆膏治一切瘡疽胬肉突出不問大小長短用藜蘆一味為末以生猪脂和研如膏塗患處周日易之治便血括云四兩呉茱四兩連一同鍋炒不同研糞前紅用茱調酒糞後紅用酒調連元氣虧損者當以補藥加之方效二味用熱湯拌濕頓滚湯中半日藥氣相和炒焦各㨂出聴用甚妙即製茱萸黄連法也黄礬丸治金石發疽及一切瘡疽解毒止痛明白礬一兩黄蠟五錢右鎔蠟和礬末急和匀衆手丸桐子大每服十丸漸漸加二十丸滚湯下如服金石發疽别用白􅈨末一兩作三五服温酒調下有人遍身生瘡狀如蛇頭服之即效此藥能解毒氣内攻須多服有效治蛇毒咬鎔滴傷處痛止毒出仍服兩許當歸膏治發背癰疽湯火等症去腐肉生新肉其肉未壞者用之自愈肉已死而用之自潰新肉易生搽至肉色漸白其毒始盡生肌最速其外肉焮乾爬連好肉作痛用之即愈亦不結痂又免皴揭之痛殊有神效蓋黄蠟主生肌止痛補血續筋性味甘温非偏勝毒藥故與新肉相宜此方余已刋行近之治者亦多用之川當歸一兩麻油真正者四兩淮慶生地一兩黄蠟一兩如白蠟止用五錢右先用當歸地黄入油煎黒去查入蠟鎔化候温攪匀即成膏矣用塗患處將紙蓋之發背癰疽湯火等症潰爛用之尤妙凡死肉潰爛已盡好肉有些須尚連宜用利刀剪之蓋死肉有毒去遲則傷新矣如洗拭換膏必須預備即貼之若死肉去盡尤宜速貼然新肉畏風尤甚不可忽也蠲痺消毒散治時瘡肢節筋攣薑黄土茯苓獨活各五錢白术當歸各一錢半赤芍藥一錢白芷五分右水煎服右肩尖肘尖二穴圖即肩髃肘膠此穴治瘰癧之秘法蓋瘰癧屬肝膽二經故患耳前後項腋之間男子多因恚怒虧損肝經之血隂火内作或不慎起居耗損腎水不能生肝血婦女多因恚怒傷肝火動血燥或鬱結傷脾火動血耗或患於胸乳間亦屬於前經此症若因恚怒傷肝氣血壅遏而不愈者宜灸此穴疎通經絡若因乆於鬱怒元氣虧損而不愈當推其所屬而調補化源如取其穴當以指甲搯兩肘兩肩四所患處覺酸麻方是其穴薛氏醫案卷十六
