body:
  text: 薛氏醫案卷四十九眀薛已撰敖氏傷寒金鏡録凡傷寒熱病傳經之邪比雜病不同必辨其脉􅂒舌表裏汗下之庶有不誤况脉者血之府屬隂當其得病之初正氣相搏若真氣未衰脉必滑數而有力病久熱甚氣衰脉必微細而無力方數甚也但可養隂退陽此識脉之要也或初病即惡寒發熱後必有渴水燥熱之證或逆厥而利此熱􅂒傳經之邪也若始終皆熱􅂒惟熱而不惡寒故傷寒為病初則頭痛必無發熱惡寒渴水之症一病便有逆厥泄利或但惡寒而無發熱此寒􅂒也此識􅂒之妙也如舌本者乃心之竅於舌心屬火主熱象離眀人得病初在表則舌自紅而無白胎等色表邪入于半表半裏之間其舌色變為白胎而滑見矣切不可不眀表􅂒故邪傳扵裏未罷則舌必見黄胎乃邪已入扵胃急宜下之胎黄自去而疾安矣至此醫之不依次悮用湯乆失扵遲下其胎必黒變􅂒蚌起此為難治若見舌胎如漆黒之光者十無一生此心火自炎與邪熱二火相乗熱極則有兼化水象故色從黒而應水化也若乃臓腑皆受邪毒日深為􅂒必作熱症雖宜下之乃去胃中之熱否則其熱散入絡臓之中鮮有不死者譬如火之自炎初則紅過則薪為黒色炭矣此亢則害承乃制今以前十二舌眀著猶􅂲未盡諸􅂒復作二十四圖并方治列扵左則區區推源尋流寔可决生死之妙也清碧學士杜先生著傷寒用藥説夫醫者何猶防之將也凡視人疾在究其淺深之異而療之且疾之襲人若寇之侵境方其至也必瞰其勢之强弱先以安撫次以講和戒嚴守禦以防其返也如堅然不退至再至三恣强肆侮意謀土地當此之際柰何必選將練兵剋期至戰寇滅乃已若倉皇無措則土地陷矣豈非將者不識韜畧不知合變以致悞也可勝嘆哉夫今之醫不閲方書不察脉理臨􅂒茫然當解而不解當吐下而不吐下畏首畏尾顛倒錯亂助病日深殊不知醫乃司命其可輕忽如此大抵病之輕淺者即為和解深重者使便攻撃故曰用藥之時膽欲大而心欲小毋使君臣失職佐使不當反嫁疾焉苟能如將之用兵進退合宜操存有法何疾之不愈也余每察脉用藥覺有疑滯幸承先師之誨故始撮其要領以告後人云至正改元一陽吉日永和三仙至人蕭璜鳴書驗證舌法夫人之受病傷寒為甚傷寒之治仲景為詳人皆知之而未必能行之者豈非以其法浩繁有難卒貫者乎舊有敖氏金鏡録一篇専以舌色視病既圖其狀復著其情而後别其方藥開卷昭然一覽具在雖不期乎仲景之書而自悉合乎仲景之道可謂深而通約而要者矣予昔承乏在留都嘗􅈓之太醫官舎本皆繪以五采恐其乆而色渝因致謬誤乃分注其色扵上使人得以意㑹焉舌舌見白胎滑者邪初入裏也丹田有熱胸中有寒乃少陽半表半裏之證也宜用小柴胡湯梔子豉湯治之小柴胡湯方見後梔子豉湯方見後舌見紅色熱蓄扵内也不問何經宜用透頂清神散治之透頂清神散猪牙皂角細辛白芷當歸右為末等分和勻令病人先噙水一口以藥少許吹鼻内吐去水取􅅉為度未􅅉仍用藥吹入凡瘟疫之家不拘己未患者皆宜用之舌見純紅内有黒形如小舌者乃邪熱結扵裏也君火熾盛反兼水化宜涼膈散大柴胡湯下之涼膈散方見後大柴胡湯方見後舌見紅色而有小黒色者熱毒乗虛入胃蓄熱則發癍矣宜用𤣥参升麻葛根湯化斑湯解之𤣥参升麻葛根湯即𤣥参升麻湯加葛根方見後化斑湯即白虎湯加人参方見後舌見淡紅中有大紅星者乃少隂君火熱之盛也所不勝者假火𫝑以侮脾土將欲發黄之候也宜用茵陳五苓散治之茵陳五苓散方見後舌見紅色尖見青黒者水虛火實腎熱所致宜用竹葉石膏湯治之方見後舌見淡紅色而中有一紅暈沿皆純黒乃餘毒遺扵心胞絡之間與邪火欝結二火亢極故有是證也以承氣湯下之方見後舌見紅色更有裂紋如人字形者乃君火燔灼熱毒炎上故發裂也宜用涼膈散涼膈散方見後舌見紅色更有紅㸃如蟲蝕之狀者乃熱毒熾盛火在上水在下不能相濟故也宜用小承氣湯下之小承氣湯方見後舌見紅色内有乾硬黒色形如小長舌有刺者此熱毒熾甚堅結大腸金受火制不能平木故也急用調胃承氣湯下之調胃承氣湯方見後舌見紅色内有黒紋者乃隂毒厥干肝經肝主筋故舌見如􅁝形也用理中合四逆湯温之四逆湯乾薑半两炮附子一枚去皮生作八片甘草六錢二字半右每服五錢水一鍾煎六分不拘時温服理中湯服法如前人参甘草炙乾薑炮白术炒舌見黒色水尅火眀矣患此者百無一生治者審之余在留都時地官主事鄭汝東妹婿患傷寒得此舌院内醫士曽禧謂當用附子理中湯人咸驚駭遂止亦莫能療困甚治棺曽與之隣往視之謂用前藥猶有生理其家既待以死􅍆從之數劑而愈大抵舌黒之症有火極似水者即杜學士所謂薪為黒炭之意也宜涼膈散之類以㵼其陽有水來尅火者即曽醫士所療之人是也宜理中湯以消隂翳又須以老生薑切平擦其舌色稍退者可治堅不退者不可治𢎞治辛酉金臺姜夢輝患傷寒亦得此舌手足厥冷吃逆不止衆醫猶作火治幾致危殆判院吳仁齋用附子理中湯而愈夫醫之為道有是病必有是藥附子療寒其效可數奈何世皆以為必不可用之藥寜視人之死而不救不亦哀哉至扵火極似水之症用藥得宜效應不異不可便謂為百無一治而棄之也敖氏傷寒金鏡録圖方舌見尖白根黄其表證末罷也須宜解表然後方可攻之如大便秘者用涼膈散加硝黄泡服小便澁者用五苓散加木通合益元散加薑汁少許以白滚湯調服涼膈散生甘草二两連翹四两山梔一两大黄二两黄芩薄苛葉朴硝各一两右每服一两水二盞淡竹葉二十餘片煎至一盞去柤入生蜜少許熱服以利為度五苓散加茵蔯即茵蔯五苓散澤㵼二錢五分茯苓猪苓白术各一两五錢桂五錢木通滑石甘草炙各一两右為末每服五錢入薑汁并蜜各少許白滚湯調下舌見弦白心黒而脉沉微者難治脉浮滑者可汗沉實者可下始病即發此色乃危殆之甚也速進調胃承氣湯下之調胃承氣湯甘草三錢大黄六錢硝二錢右用水一鍾半先煎甘草大黄將熟去柤下􅉭硝再煎三五沸頓熱服舌尖白胎二分根黒一分必有身痛惡寒如飲水不至甚者五苓散自汗渴者白虎湯下利者解毒湯此亦危證也五苓散方見後白虎湯知母一錢五分甘草炙一錢石膏四錢粳米一撮右每服一两用水一鍾半入糯米先煎下諸味再煎去柤服之加人参亦可觧毒湯黄連一两黄栢五錢黄芩五錢山梔子二十箇右每服五錢水一鍾半煎至一鍾去柤頓熱服舌見白胎中有黒小㸃亂生者尚有表證其病來之雖惡宜涼膈散微表之表退即當下之下用調胃承氣湯涼膈散方見前調胃承氣湯方見前舌見如灰色中間更有黒暈两條此熱乗腎與命門也宜急下之服解毒湯下三五次遲則難治如初服量加大黄酒浸泡解毒湯方見後舌見微黄色者初病即得之發讝語者由失汗表邪入裏也必用汗下兼行以雙解散加解毒湯两停主之雙解散加解毒湯防風川芎當歸芍藥大黄麻黄連翹􅉭硝各半两石膏黄芩桔梗各一两滑石三两甘草二两荆芥半两白术山梔各半两右每服一两水一鍾半薑三片煎八分服不拘時一云有桂枝二两舌中見白胎外則微黄者必作泄宜服解毒湯惡寒者五苓散五苓散方見前解毒散方見前舌見微黄色者表證未罷宜用小柴胡湯合天水散主之可下者大柴胡湯下之表裡雙除臨證審用之小柴胡湯柴胡四錢黄芩甘草人参半夏泡各二錢右每服一两水一鍾半薑三片棗一枚煎一鍾温服天水散甘草炙一两桂府滑石六两右各另為末每服五錢入生薑汁并蜜各少許用白滚湯任意調服如發表用豆䜴葱頭煎湯調服大柴胡湯柴胡四錢黄芩芍藥各一錢五分半夏大黄二錢五分枳實麩炒二錢右㕮咀每服八錢水一鍾半薑三片棗一枚煎一鍾温服舌見黄色者必初白胎而變黄色也皆表而傳裏熱已入胃宜急下之若下遲必變黒色為惡證為亢害鬼賊邪氣深也不治宜用調胃承氣湯下之調胃承氣湯方見前舌左白胎而自汗者不可下宜白虎湯加人参三錢服之舌右白胎滑者病在肌肉為邪在半表半裏必往來寒熱宜小柴胡湯和解之小柴胡湯方見前舌左見白胎滑此臓結之證邪併入臓難治舌見四圍白而中黄者必作煩渴嘔吐之證兼有表者五苓散益元散兼服須待黄盡方可下也益元散方見前五苓散方見前舌見黄而有小黒㸃者邪遍六腑將入五臓也急服調胃承氣湯下之次進和解散十救四五也調胃承氣湯方見前和解散藁本桔梗甘草炙各五錢蒼术三錢陳皮厚朴姜製各一錢右水一鍾半薑三片􅀥二枚煎七分去查不拘時服舌見黄而尖白者表少裏多宜天水散一服涼膈散二服合進之脉弦者宜防風通聖散天水散方見前涼膈散方見前防風通聖散方見前舌見黄而色有膈瓣者熱已入胃邪毒深矣心火煩渴急宜大承氣湯下之若身發黄者用茵蔯湯下血用抵當湯水在脇内十􅀥湯結胸甚者大陷胸湯痞用大黄㵼心湯大承氣湯厚朴姜製三錢枳實麩炒二錢大黄三錢芒硝二錢右每服一两水一鍾半先煎枳實候熟入大黄再煎數沸入芒硝煎三五沸去柤熱服茵蔯湯茵蔯五錢大黄三錢山梔子七枚右每服一两水一盞半先煎茵蔯半熟次入二味再煎去柤通口熱服抵當湯大黄三錢水蛭糯米炒七个蝱蟲炒去羽足七箇右作一服水一盞半煎一鍾去柤通口服十􅀥湯芫花醋浸炒大㦸甘遂煨各等分右每服二錢弱人減半以水一鍾半大棗十枚劈碎煎取八分去柤通口服大陷胸湯大黄七錢芒硝三錢甘遂四分右用水二鍾先煎大黄至一鍾去柤下芒硝煎三五沸再下甘遂沫温服取利大黄㵼心湯大黄五錢黄連黄芩各三錢五分右作一服水二鍾煎一鍾去柤通口温服若有宿食痰飲者加半夏麯二錢舌見四邊微紅中央灰黒色者此由失下而致用大承氣湯下之熱退可愈必三四下方退五次下之而不退者不治大承氣湯方見前舌見黄而黒㸃亂生者其證必渴讝語脉實者生脉濇者死循衣摸床者不治若下之見黒糞亦不治下宜大承氣湯大承氣湯方見前舌見黄中黒至尖者熱氣已深两感見之十當九死惡寒甚者亦死不惡寒而下利者可治宜用調胃承氣湯主之調胃承氣湯方見前舌見外淡紅心淡黒者如惡風表未罷用雙解加解毒湯相半微汗之汗罷急下之如結胸煩躁目直視者不治非結胸者可治雙解散方見前解毒散方見前舌見灰色尖黄不惡風寒脉浮者可下之若惡風惡寒者用雙解散加解毒湯主之三四下之見糞黒不治雙解散方見前解毒湯方見前舌見灰黒色而有黒紋者脉實急用大承氣湯下之脉浮渴飲水者用涼膈散解之十可救其二三舌根微黒尖黄脉滑者可下之脉浮者當養隂退陽若惡風寒者微汗之用雙解散若下利用解毒湯十生七八也雙解散方見前解毒湯方見前舌根微黒尖黄隐見或有一紋者脉實急用大承氣湯下之脉浮渴飲水者用涼膈散解之十可救其二三已上三十六舌乃傷寒驗證之㨗臨證用心䖏之百無一失薛氏醫案巻四十九
