味逍遥散二方見二十四卷第四論加味小柴胡湯方見二十四卷第二論加味四物湯四君子湯二方見二十四卷第六論羌活勝濕湯方見前婦人腰痛方論第七夫腎主於腰若婦人腰痛由腎氣虚弱外感六氣内傷七情皆能致之如因風邪所乗用小續命湯加桃仁杜仲如因寒濕所傷五積散腎經虚弱青娥丸如因氣血凝滯用牽牛􅚬香之類愚按陳無擇先生云若形體虚羸面色黧黒腿足痿軟不能行立此失志所為也腹急脇脹目視昏昏宗筋弛縱白淫下注此鬱結所為也肌肉不仁飲食不化腸胃脹滿閉墜腰脇此憂思所為也皆屬内因若腰冷作痛身重不渇小便自利飲食如故因勞汗出腰􅀈脇痛或墜墮血滯或房勞精竭皆屬内外因也竊謂前症失志腎虚熱者六味丸腎虚寒者八味丸鬱怒傷肝實用龍膽瀉肝湯虚用六味丸補肝散憂慮傷脾者歸脾湯逍遥散腎著者寒則术附湯虚則腎著湯腰膝痛者寄生湯養腎散瘀血滯者如神湯舒筋湯房勞腰痛者青娥丸十補丸附治驗一婦人腰痛三年矣每痛必面青頭暈目𦂳余以為肝脾氣虚用補肝散而愈三年後因勞役患頭痛兼惡心用補中益氣湯加茯苓半夏蔓荆子而愈一婦人苦腰痛數年不愈余用白术一味大劑服不三月而痊乃胃氣虚閉之症故用白术也如神湯治男婦腰痛延胡索當歸桂心等分右為末毎服二錢温酒調甚者不過數服獨活寄生湯治足三隂虚風濕所侵脚膝歴節作痛獨活桑寄生續斷酒炒杜仲薑汁炒細辛牛膝酒拌炒秦芁茯苓白芍藥炒桂心川芎防風人參熟地黄自製當歸酒拌粉草炙各五分右水煎舒筋散治風寒傷腎膂作痛或閃挫氣滯血瘀亦良𤣥胡索炒杜仲薑汁炒官桂去皮羌活芍藥等分右為末毎服二錢酒調又方橘核炒木香研酒下附方濟生术附湯治寒濕傷腎腰重冷痛小便自利或手足逆冷附子炮白术各一兩杜仲薑炒半兩右毎服四錢薑水煎三因腎著湯治腎虚為病身重腰冷如水洗狀不渇而小便自利飲食如故腰以下冷痛如帶數千錢茯苓白术各四兩乾薑炮甘草炙各二兩右毎服四錢水煎空心服青娥丸治腎虚腰痛或外邪所侵腰腿或筋骨作痛胡桃仁二十枚蒜研膏四兩破故紙酒浸炒八兩杜仲去皮薑汁浸炒一斤右為末蒜膏丸桐子大毎服五十丸空心醋湯下蒜不用亦可六味丸十補丸八味丸二方見二十四卷第十一論龍膽瀉肝湯方見二十四卷第八論補肝散方見七卷第十七論歸脾湯逍遥散二方見二十四卷第四論養腎散方見後婦人腰脚疼痛方論第八腎主於腰脚女人胞絡係焉若勞傷腎氣風冷客於脉絡故腰脚作痛也治當補元氣為主佐以袪邪之劑愚按前症若真陽衰敗寒邪乗襲手足俱冷頭痛惡寒或嘔吐腹痛等症宜用本方若氣血虚弱寒邪所感惡寒發熱頭痛作渇或嘔吐腹痛等症宜用五積散若元氣虚弱濕熱所傷兩脛腫痛寒熱身疼或嘔吐不食等症宜用㯽蘇敗毒散若脾胃虚弱元氣下陷寒熱嘔吐發熱頭痛喘渇體倦等症宜用補中益氣湯若足三隂精血虧損隂火内動内熱晡熱作渇痰甚小便頻數等症宜用六味地黄丸若足三隂陽氣虚敗惡寒發熱手足俱冷吐痰不食二便滑數等症宜用八味地黄丸附治驗一婦人先腰胯作痛後兩腿亦痛余以為足三隂虚寒外邪所傷用小續命湯及獨活寄生湯或作或止所用飲食極熱腹中方快余曰邪氣去而元氣虚寒也診其脉果沈細用養腎散漸愈又用十補丸而痊一婦人所患同前但發熱作渇喜冷飲食脉洪數按之遲濇佘以為血虚有熱用羚羊角散去㯽榔加白术茯苓數劑更用加味逍遥散而瘥一婦人患前症時或腿膝作痛脉浮數按之遲緩此元氣虚而風濕所乗用獨活寄生湯頓愈又用八珍湯而安一婦人因怒患前症寒熱往來口苦不食晡熱内熱余以為肝火血虚先用小柴胡山梔頓愈又用加味逍遥散而瘳一婦人患前症寒熱頭痛殊類傷寒此寒邪之症用㯽蘇敗毒散而安又用補中益氣調補而愈骨碎補散治陽氣虚弱外寒所侵腰脚疼痛腹脇拘急骨碎補炒萆薢酒炒牛膝酒炒桃仁去皮尖海桐皮當歸酒拌桂心㯽榔各五分赤芍藥炒附子炮川芎枳殻麩炒各三分右薑棗水煎養腎散治腎經虚弱風寒所侵以致腰脚疼痛不能步履蒼术一兩乾蝎三錢天麻草烏頭炮去皮尖黒附子炮去皮臍各二錢右為末毎服一錢酒調服麻痺少時隨愈孕婦勿服此治風寒傷腎膀胱虚寒之良藥用之得宜殊有神效附方五積散方見後㯽蘇敗毒散方見二十四卷第十論補中益氣湯方見二十四卷第六論十補丸六味丸八味丸三方見二十四卷第十一論小續命湯方見前獨活寄生湯方見前羚羊角散方見前加味逍遥散八珍湯二方見二十四卷第四論小柴胡湯方見二十四卷第二論婦人風邪脚氣方論第九婦人脚氣乃肝脾腎三經或胞絡氣虚為風毒所摶而患盖胞絡屬於腎主於腰脚三經絡脉起於足中指若風邪客於足從下而上動於氣故名脚氣皆由六淫七情或産後或經行風毒相摶其症或頭痛身熱肢節作痛或大便秘結小便不利或脚膝緩弱足脛腫滿或腰膝枯細忪悸嘔逆或小腹不仁舉體轉筋或胸滿氣急遍體酸痛用香蘇散加㯽榔生薑若寒中三陽必冷用小續命湯若暑中三隂必熱用小續命湯去附子大躁者紫雪最良無紫雪以自合薄荷煎冷水調服大便秘用脾約丸麻仁丸三和散補藥淋洗皆大禁也愚按嚴用和先生云前症初患不覺因他病乃發先從脚起或緩弱痺痛不能行履或兩脛腫滿或足膝細小或心中怔忡或小腹不仁或舉體轉筋或見食作嘔或胸滿氣急遍體酸痛其脉浮而弦者因於風濡而弱者因於濕洪而數者因於熱遲而濇者因於寒男子由於腎氣虧損女子血海虚弱七情所致竊謂前症若足三隂虚弱用還少丹若脾氣虚寒用八味丸若飲食停滯臀腿痠脹浮腫作痛此脾氣下陷用六君子少加柴胡升麻不應須用八味丸若發熱口渇月經不調兩腿無力此足三隂血虚火燥用六味八味二丸兼服前症西方之人多患之因素食乳酪脾胃壅滯脛足腫滿至於南方亦有因膏粱厚味濕熱下注而患者故古人謂之壅疾所用之方多疏通發散之劑然感於房勞過度虧損三隂治法又當以固本為主故六物附子為元氣虚弱寒邪内侵之聖藥所屬各經等方附後附治驗一婦人兩膁赤痛寒熱口苦嘔吐懶食面色青黄或赤此肝木乗脾土用小柴胡湯加山梔升麻茯苓二劑頓愈又用六君子湯加柴胡山梔全愈一婦人飲食勞役兩膁兼腿疼痛或時寒熱余以為脾虚濕熱下陷用補中益氣湯加山梔茯苓半夏治之而痊後復作用六君子湯加柴胡山梔全愈一婦人經行後寒熱晡熱兩腿作痛此肝經血虚也用加味逍遥散加山梔治之而愈後因勞日晡内熱或用四物黄栢知母之類前症益甚更加食少作瀉余以為元氣下陷前藥復傷先用六君子湯加補骨脂二劑調補脾冐而瀉止食進又用補中益氣湯升舉元氣而愈大腹皮散治脚氣肢節煩疼心神壅悶或頭暈喘𠻳不食大腹皮紫蘇荆芥赤芍藥炒青皮木𤓰不犯鐡器獨活各五分枳殻麩炒一錢右薑葱水煎半夏散治脚氣上攻心腹脹滿飲食不下嘔吐不止半夏薑製陳皮人參大腹皮桂心各三分㯽榔一錢赤茯苓紫蘇各五分右薑水煎桑白皮飲治兩脚浮腫小便赤澁腹脇脹滿或喘𠻳痰湧嘔吐不食桑白皮炒郁李仁去皮赤茯苓各一錢木香防已酒拌大腹皮紫蘇子炒木通去節㯽榔青皮各五分右薑水煎附方大黄左經湯治四氣乗注足陽明經以致膁腿作痛或足脛赤腫嘔吐不食大小便秘結或惡食喘急自汗等症細辛茯苓羌活大黄煨甘草炙前胡枳殻麩炒厚朴薑製黄芩炒杏仁去皮尖等分右每服五錢薑棗水煎麻黄左經湯治風寒暑濕乗注足太陽經以致腰足攣痺肢節重痛或増寒發熱自汗惡寒或自汗惡風頭疼麻黄乾葛細辛白术茯苓防已酒拌桂心羌活甘草炙防風右每服半兩薑棗水煎服半夏左經湯治足少陽經為風寒暑濕乗注以致惡寒發熱腰腿疼痛或頭目眩暈嘔吐不食或熱悶心煩腿痺不隨半夏薑製乾葛細辛白术麥門冬去心茯苓桂枝防風乾薑炮黄芩炒小草甘草炙柴胡右毎服半兩薑棗水煎熱悶加竹瀝喘急加杏仁桑白皮六物附子湯治四氣乗於足太隂經以致骨節煩疼四肢拘急自汗短氣小便不利或手足浮腫附子炮桂枝防已各四錢甘草炙二錢白术茯苓各三錢右每服半兩薑水煎換腿丸治足三隂經為風寒暑濕之氣所乗發為攣痺緩縱或上攻胸背下注脚膝疼痛發熱行步艱辛薏苡仁南星石楠葉石斛㯽榔萆薢酒拌川牛膝酒浸羌活防風木𤓰各四兩黄芪炒當歸酒拌天麻續斷酒炒各一兩右為末酒糊丸如桐子大每服五十丸鹽湯下五積散治風寒所傷以致脚氣疼痛或寒熱拘急嘔吐不食等症當歸酒拌芍藥炒川芎炮薑人參茯苓陳皮桔梗炒厚朴薑炒白芷蒼术半夏薑製肉桂麻黄甘草炒各五分右薑棗水煎當歸拈痛湯治濕熱為病肢節煩疼肩背沈重胸膈不利或兼遍身作痛足脛腫痛不可忍者或濕熱流注下部瘡瘍赤腫羌活人參苦參酒製升麻乾葛蒼术各一錢甘草炒黄芩酒炒當歸茵陳酒製各五分防風知母酒炒澤瀉猪苓白术各四分右水煎服紫蘇子湯治脚氣上攻隂陽交錯清濁不分上重下虚中滿喘急嘔吐自汗無復紀律紫蘇子微炒半夏薑製前胡厚朴薑製甘草炙當歸酒拌各二兩桂心陳皮右每服四錢入薑棗煎還少丹方見二十三卷第四論六味丸八味丸二方見二十四卷第十一論小柴胡湯方見二十四卷第二論六君子湯補中益氣湯二方見二十四卷第六論加味逍遥散方見二十四卷第四論薛氏醫案卷二十八
