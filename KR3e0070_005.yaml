body:
  text: 薛氏醫案卷五明薛巳撰保嬰粹要寒熱瘰癧小兒瘰癧乃肝膽三焦經風熱或肝疳食積或胎氣所致其症發於項腋或耳前後累累如貫珠當分表裏而治若作痛或赤腫風熱也用人參敗毒散若作痛或寒熱肝火也用加味小柴胡湯若隱於肉裏而色不變肝疳食積也用九味蘆薈丸若膿成不潰或潰不斂脾氣虚也用益氣養榮湯凡女子頸腋不問有無結核但作寒熱肝脉長出魚際乃血盛無偶之症用生地黄丸治法雖清肝火湏兼滋腎水以生肝木否則多變為瘵症眼中有赤脉上貫瞳神見㡬條則㡬嵗死無則可治治驗閣老梁厚齋侄患此膿水淋漓其核未消發熱憎寒此肝經血氣虚而有熱用補隂八珍湯為主間以清肝益榮湯而愈後復結核日晡熱甚小便赤濇發熱作渴此肝經血虚所致用參芍柴苓湯為主佐以六味丸加柴胡山梔治之而消閣老楊石齋子年十五嵗發熱作渴日晡頰赤脉數無力症屬隂虛有熱用補隂八珍湯五十餘劑又加參茋二十劑而潰但膿水清稀肌肉不生此脾氣虚也以參茋歸术為主佐以白芍藥熟地麥門五味氣血乃復遂以必效散一服癧毒去而瘡斂矣閣老張羅峯孫患此掌院公投以化痰削堅之劑夜熱吐痰甚劇邀余治之時值季夏脉浮大按之而濇余曰症屬於肝而反見肺脉當甚於金旺之際至期果卒其嗣中書患勞瘵公以火治之雖少愈而晡熱未止復囑余治其時孟冬脉洪數余謂水虧火旺不冝於夏公愈忌余尋搆謗余由此而歸後季夏中書竟不起翁乃服前言不妄葢二症皆屬隂虚設滋化源猶可冀其生柰何見之不早也張光禄子十三嵗患此三年未愈不時寒熱飲食少思此肝火而脾血虚也用益脾清肝散佐以九味蘆薈丸而痊年十六復患莖痿或謂腎氣虚寒服溫補之藥竅出臭津舊痕腫痛予用清肝火藥而愈大尹周應昌子十五嵗患此恪用化痰等劑虛症悉至余曰小便頻數肝經隂虛也兩目連劄肝經風熱也作嘔懶食胃氣虚弱也泄㵼後重脾氣虚陷也用補中益氣湯六味地黄丸而痊舉人杜克宏子頸腫發熱四肢發搐口噤痰湧此肝膽經症即急驚風也先用㵼青丸一服又用六味丸二服諸症頓退乃以小柴胡加芎歸山梔鈎藤鈎而安却用補中益氣湯而愈一小兒十四嵗患二年矣膿水清稀肌體骨立晡熱盜汗口乾欬痰此腎水不能生肝木用補中益氣湯六味地黄丸三月餘元氣復而瘡漸愈周世菊子十一嵗眉間生一核如赤小豆出血如注發熱倦怠食少體痩此肝經血熱脾經氣虚用柴芍參薈散九味蘆薈丸而愈一女子十六嵗經事不調項側兩臂胸乳脇肋兩股兩腿内外膁有核如榛如豆不計其數隱於肉裡其色不變大按則痛或投以降火消毒不按自痛發熱作渴日晡益甚經水過期左關脉數此肝火血燥也用清肝益榮湯六十餘劑諸症已愈惟項核未消以當歸龍薈丸數服及八珍湯加柴胡山梔三十餘劑而痊一女子耳下結核焮痛寒熱此屬肝經風熱用梔子清肝散一劑諸症悉愈後因怒耳前後并額兩角作痛寒熱此兼少陽經症仍以前藥加羗活二劑而痊一女子十五嵗項患五核時常寒熱肝脉弦長而出寸口此血盛無偶之症也用小柴胡湯加生地烏梅治之而愈舎親吳海槎子十五嵗肝膽經部分結數核每服化痰之劑乙巳春形體消瘦膿成不潰脉洪數無力余用大補之劑元氣頓復潰者漸愈腫者膿成惑於衆論服内消之劑吐瀉大作而死余治肝膽經症數人至乙巳風木之年實者得痊虚者必殁驚搐瘰癧小兒因驚搐項側肉裏結核屬肝脾之症當治其本而末自退假如因外邪而致者清表為主木旺而致者清肝為主停食而致者消𨗳為主脾傷而致者調中為主大凡肝木自病驚搐痰壅目瞤抽搐等症是為有餘宜凉肝生血實脾土則火自息而風自定矣若肝木侮脾土而致前症是為不足宜滋腎水實脾土則肝得血而熱自退風自息矣其食積致痰而患者當調補脾胃脾胃既徤則食化痰清而核亦自消矣若用金石香燥之劑脾損隂消不惟結核不散適足以成慢驚矣治驗冬官朱小溪子項間結核面色痿黄肌體消瘦咬牙抽搐頭揺目劄此肝木尅脾土用六君子湯九味蘆薈丸而愈謝吏部子項間及四肢結核乆潰形體骨立大便不調小便頻數此肝脾之症用九味蘆薈丸補中益氣湯而愈吳侍御子項乆結核目劄唇動揺頭抽搐此風木凌脾土用皁角子丸補中益氣湯漸愈九味蘆薈丸而愈下堡顧斐齋𤣥孫甫週嵗項間結核兩臂反張索敗毒之藥余意其症屬肝經血燥未敢付藥翌早請治詢之嘗患驚風或用硃砂等劑服之以致此耳遂與六味丸滋其肝血一服而愈盖硃砂金石之藥大助陽火况小兒臟腑脆軟不可用也嘗觀周禮註以硃砂雄黄等為五毒内經以石藥之氣為慓悍宋史以火煉硃砂牙硝生犀等為化毒丹薛居正服之而暴卒夫何今人執古偏方用金石之藥耶或用抱龍丸及黄連大寒諸藥皆遭其毒予不能不為之惻然也因併及之儒者王文逺子痰盛發搐服金石香散之劑手足筋攣此肝血復傷即急驚風也遂用加味小柴胡加鈎藤鈎山梔芎歸一服六味丸料加五味門冬而安一小兒病後遇驚即痰盛咬牙抽搐揺頭作渴却服腦麝硃砂等藥以致慢驚而卒流注小兒流注或因閃跌瘀血滯於隧道或因脾虛濕痰流於經絡或因肝火氣逆結於肢節或因元氣虚弱外邪摶於肉裏或因脾經積熱或因禀賦所致乃不足之症也治法閃跌氣滯者和血定痛丸濕痰濕熱者徤脾滲濕湯肝熱風熱者九味蘆薈丸食積脾熱者四味肥兒丸禀賦鬱火者九味蘆薈丸間以補元氣扶脾胃則未成者自散已成者自潰若膿成而未潰者元氣虛也先補而針之庶使膿毒不致内攻氣血不致陷脱若膿出而反痛氣血虛也八珍湯作嘔少食胃氣虛也四君子湯欲嘔不食或腹脹有痰脾胃傷也六君子湯口噤搐搦等症氣血虚極而變症也十全大補湯内傷晡熱隂血虛於内也四味參苓白术表熱惡寒者陽氣浮於外也十全大補湯仍審其傳變兼變而治之若熱來復去晝見夜伏晝伏夜發或時節而動是謂虛熱當亟補元氣色赤腫硬而膿稠尚可治不赤腫破而膿清脉大寒熱發渇不受補者皆不治治驗鴻臚楊國威子年十二左脇下患此或用流氣敗毒之劑至半載而潰又用十宣托裏之類年餘不斂左右脉數而無力左關脉弦而細短此膽經之症葢膽屬肝因腎水不足肝木血燥而然遂用六味地黄丸以補腎水用九味蘆薈丸以清肝火而愈通府李振之子十六嵗腰患之三年不愈色黯下陷此腎經之症寒氣逆於肉裏其腰必傴矣内宜滋化源以生腎水外宜散寒邪以接陽氣可保其生不信仍以雜治元氣益虛七惡蜂起始從余言而果驗州守陳克明子閃右臂腕腫痛或用流氣等藥加發熱惡寒飲食少思口舌乾渇腫痛愈熾形氣益疲此脾氣復損遂以助脾胃壯氣血為主佐以外治之法而愈地官黄北盤子腿患之腫痛發熱作濕毒治之虚症悉至余謂元氣虛外邪所乗用十全大補湯如聖餅而愈吳江龎氏子臂肘腫硬或用流氣飲肉色不變飲食少思余曰此肝脾虚症先用六君子加桔梗薄桂飲食漸進又用補中益氣加桔梗薄桂茯苓半夏及如聖餅而消一小兒腋下腫年餘而潰形體日瘦一小兒股内結核如桃堅硬如石寒熱作渴飲食少思一小兒小腹一塊三月而潰延及左脇出膿不止一小兒耳前結核潰而不愈又結三核一小兒乳間頸下及缺盆各腫一塊一小兒脇下患腫乆而不潰俱用補脾胃之藥及九味蘆薈丸並愈余北仕時有留都賈學士子年十六患二載矣公陞北宗伯邀治診其脉洪大而數膿清熱渴食少體倦夜間盜汗午前畏寒余曰真氣不足邪氣有餘治之無功公聞之改容曰宦寓留都如大旱之望雲霓今得君一診冀吾兒之必生何固辭也懇治午前以四君加芎歸炙草午後以四君加麥門五味參茋兩月諸症遂可一二公喜曰是吾兒也余曰未也有一逺醫自薦以滲利之劑保其必生公竊喜未㡬公奉使荆襄此醫治已三月形體骨立公還大駭復懇於余余奉命南下辭不治後果殁一小兒閃腿腕壅腫形氣怯弱余欲以補氣血為主佐以行散之劑反内服流氣飲外敷寒凉藥加發熱惡寒形體愈虛復求治余曰惡寒發熱脉息洪大屬氣血俱虛治之無功後内潰瀝盡氣血而亡鶴膝風小兒鶴膝風其腿漸細而膝愈粗如鶴之膝故名之因禀賦不足外邪乗之初則膝内作痛外色不變伸屈艱難一二月間焮腫而作膿者可治腫硬而不作膿者難治或三四月或半載後膿成自破者尤難治其初起腫硬膿成未潰者用大防風湯為主佐以益氣養榮湯膿潰者用益氣養榮湯為主佐以大防風湯和血定痛丸切不可用十宣流氣等藥若禀賦不足氣血不榮肌肉消瘦膝骨粗大乃由腎氣不能生髓故不榮於骨也當用加味地黄丸補之若不潰或潰不斂或有發熱等症皆為氣血兩虚須以補益為主否則必變他症慎之治驗地官王天成姪患此大潰不斂體倦食少口乾發熱日晡尤甚用十全大補湯五劑以補元氣復用大防風湯一劑以散其邪月餘諸症悉退遂用補中益氣為主佐以大防風湯而斂儒者胡濟之姪患此潰而不斂不時寒熱小便赤澁用十全大補湯加麥門五味諸症頓退乃去桂常服佐以和血定痛丸間用獨活湯而愈胎毒發丹一名胎瘤小兒丹毒乃禀毒於胎胎或風熱相搏或頻浴熱湯或着烘衣其赤暈遊走者乃血隨風熱也其微赤而兼白者外寒束其腠理也若禀熱毒風熱者用敗毒散化毒丹大便秘者用大連翹飲頻浴或烘衣者用清熱凉血飲甚者必用砭法令人多吮患處取毒聚一處方砭而泄之若發於四肢毒入腹者難治治法雖多惟砭有回生之功亦有女子年十五六經未行而常患此血熱也以四物黄芩柴胡荆防或加味逍遥散行經自愈治驗少叅史南湖孫乙未生丙申正月隂囊赤腫余作胎毒治之而瘥後患發熱痰熱等症診其母有欝火血熱用解鬱凉血之藥子母俱服而愈至六月初患吐㵼小便赤澁兩眼瞤動投參术之類不應以為慢驚然欲用附子之藥請余議視其寅夘關脉赤此屬風熱用柴胡清肝散加鈎藤鈎木賊草一劑即愈至丁酉正月初旬頸患熱毒膿出貼藥感風發熱翌日頭面黯腫如大斗兩耳厚寸許此風熱上攻血得熱而然急砭兩額出黒血二盞許次砭面額亦如之隨用清熱化毒湯腫黯十退七八翌日又砭各處血不甚黒乃止仍用前藥去牛蒡子加熟地黄而愈此症若砭緩則血凝滯或為破傷風皆致死劉欽天之子腿如霞遊走不定先以蔴油塗患處砭出惡血其毒即散用九味解毒散一劑而安一小兒患之外勢雖輕内苦便閉此患在臟也服大連翹飲敷神功散而瘥一小兒遍身皆赤砭之投解毒藥而愈一小兒不從砭治毒入腹而死一小兒臀患之赤暈走散令人頻吮患處使其毒聚於吮所乃砭出黒血餘暈塗以加味神功散時以金銀花甘草節為末用人乳汁調服而愈月餘後兩足赤腫仍治以前法而痊數日後兩足復赤或用犀角解毒之類乳食不進其腹膨脹此復傷其脾胃也仍敷前藥服補中益氣湯加茯苓而瘥一小兒腿患之神思如故乳食如常此毒發於肌表余謂砭泄其毒不必服藥其家不信外敷寒凉内服峻厲傷其脾胃腹乃膨脹乳食不進而歿夫寒凉凝結瘀毒峻劑復傷生氣不死何待一女子赤暈如霞作痒發熱此肝經血熱用小柴胡加生地連翹丹皮而愈凡女子天癸將至婦人月經不調被驚着惱多有此症治當詳審一女子十二嵗善怒睡中抽搐遍身作痒飲食少思此肝火風熱脾土受侮仍用柴參术苓湯以清肝火凉肝血徤脾胃而愈半載後遍身起赤痕或時昡暈余曰肝火熾盛血得熱而妄行也其夜果經至傷食發丹小兒傷食發丹乃因脾胃之氣不足為患用四君加山梔柴胡神麯若赤既退而仍熱此脾胃之氣未復用四君加當歸芍藥若因脾經風熱相摶而患用人參消風散加連翹山梔若脾虚發熱而患用四君加川芎蒼术苟槩用發散以攻其末必至慢驚矣治驗張儀部子每停食身發赤暈用清中解鬱湯而愈越月忽揺頭咬牙痰盛發搐吐出酸腐待其吐盡翌日少以七味白术散次日又以參苓白术散調理脾胃遂不復患大抵吐後兒安不必更服藥也杜欽天之子停食大便不通四肢赤色用枳實厚朴山查黄連神麯便通赤止更頭暈咳𠻳此脾氣虚而不能生肺金用六君子湯而愈張廷評子停食面赤用清熱發散之劑腹脹痰喘倦怠惡寒此脾胃傷而不能生肺金用六君桔梗以補脾肺山查神麯以消餘食頓愈舉人余時正子患此服發表之劑手足抽搐服抱龍丸目瞤氣喘痰甚此脾胃虚弱而慢驚也無風可祛無痰可逐乃虚象也遂用六君加附子一劑而安再劑而痊一小兒停食服通利之劑作嘔腹脹此脾胃復傷用補中益氣湯而愈秀才夏忠齋子停食服辛熱之劑腹脹如蠱脉洪而數内作膿也不信果便膿而死癍疹小兒癍疹或因風寒收斂腠理濕熱拂鬱或因新浴見風相摶為患盖癍發於膚外則多痛疹隱於肉内則多痒疹而痒者消風散痛者犀角散癍而痛者清解散便秘者解毒散潔古先生云二者並出小兒難禁防患他症切不可下必用安裏之藥為主若便秘則微䟱之身溫為順身凉為逆大要外不冝敷貼寒凉内不冝尅伐元氣海藏先生云此症首尾俱不可下為癍未見於表下之則邪氣不得伸越故禁首不可下也為癍毒已顯於外下之則癍氣逆陷故禁尾不可下也治驗司㕔徐東白子瘙痒發熱體倦少食此脾肺氣虚外邪相摶先用消風散二劑隨用補中益氣湯加茯苓芍藥而愈喬秋官子作痛發渴乃服發表之劑其症益甚形氣倦怠脉浮而數此邪在經絡誤散表而損其真也用人參安胃散補中益氣湯而愈若主祛風必成慢驚矣豐考功子作痒發熱用犀角消毒散一劑頓作吐㵼此邪氣上下俱出其疹果消勿藥自愈五臟疳瘡五臟痞塊同治小兒頭面耳項等處或如瘡疥或如結核乃五臟受病而發於外或有積塊成形於腹内者名五疳之症盖疳乾也或哺食太早或恣食甘肥或因峻利之藥重亡津液虚火熾甚或因乳母飲食起居七情所致但調補其内諸病自愈若口蝕爛身體壯熱顋唇赤色或作腫痛胷膈虚煩或咽乾飲水掌熱便赤盜汗作渴囓齒虛驚名曰心疳宜用安神丸之類若鼻外生瘡眼目赤爛肢體似癬兩耳前後項側缺盆兩腋結核或小腹内股玉莖隂囊睾丸腫潰小便不調揺頭側目白膜遮睛惡明畏日肚大青筋口渴下痢名曰肝疳冝用地黄蘆薈二丸主之若頭不生髪或生瘡痂或髪成穂或人中口吻赤爛腹大吐逆飲食不化口乾嗜土瀉下酸臭小便白濁或合目昏睡惡聞木音名曰脾疳冝用肥兒丸主之若鼻外生瘡咽喉不利頸腫齒痛咳嗽寒熱皮膚皺錯欠伸少氣鼻痒出涕鼻䘐目黄小便頻數名曰肺疳冝用地黄清肺飲主之若腦熱吐痰手足如氷寒熱往來滑泄肚痛口臭作渴齒齦潰爛𤓰黒面黧身耳生瘡或耳出水名曰腎疳冝用地黄丸主之大凡疳火上炎或痘毒上攻為患甚速名為走馬疳急敷雄黄散服大蕪荑等湯輕則牙齦腐爛唇吻腫痛可治重則牙齒蝕落顋頰透爛飲食不入不可治治驗職方陳莪齋孫三嵗面頰患瘡將蝕兩目此肝疳之症用大蕪荑湯二劑而愈陳司㕔子遍身生瘡面色痿黄腹脹内熱大便不調飲食少思倦怠口乾病屬肝脾用大蘆薈丸不月而愈俞廷評子目劄面青食少體倦大便滑泄此木乗土用芍藥參苓飲而愈工部陳樿亭長孫腹内一塊小便不調或用行氣破血等藥發熱口乾體瘦懶食㡬成瘵症面黄兼青此肝脾之疳用補中益氣湯煎送大蘆薈丸四服又用前湯加車前子煎送六味丸四服又用青肝火生肝血之藥而愈一女子十二嵗目生白翳面黄浮腫口乾便泄用四味肥兒丸而痊一小兒目劄畏明年餘矣此肝經虛熱用地黄丸補腎而痊若肝經實熱兼用瀉清丸若肝經血少風熱亦用地黄丸盖虛則補其母實則瀉其子也一小兒十一嵗兩耳後腦下各結一核色不變不作痛面色痿黄體倦口乾去後不調用蘆薈丸治之諸症頓愈而核亦消張掌科子未周嵗目内有翳余謂此禀母之肝火也詢其母乃侍媵素多恚怒且患瘰癧目疾自乳其子余因併治其母稍愈後張外補醫與異治其子遂瞽一小兒鼻外生瘡不時揉擦延及兩耳一小兒視物不明鼻内或痒或生瘡用四味肥兒丸並愈一小兒耳内出水耳外生瘡膿水淋漓經嵗不愈余用九味蘆薈丸而愈一小兒遍身如疥或痒或痛肌體消瘦日夜發熱口乾作渴大便不調年餘不愈用蘆薈丸而痊口瘡小兒口瘡或母食厚味或兒嗜甘肥喜冷飲食者屬實熱用瀉黄散畏冷飲食者屬虛熱用補黄散若飲食少思作渴引飲大便不實者脾胃虚弱也用七味白术散若停滯顋頰焮腫者脾胃虚而熱鬱先用人參安胃散後用七味白术散午後益甚四物加白术茯苓麥門五味如不應用補中益氣湯或以茱萸末塗脚心若疳積虚火炎上齒齦腐爛當從口疳論治若馬牙重舌但以線針刺出血即愈不必服藥若口瘡兼弄舌舒舌其因不同弄舌者㣲露即收此得於病後脾氣虧損也急用補中益氣湯補之舒舌者出長收緩此乃心脾有熱少與㵼黄散主之治驗地官李北泉子十嵗每口舌生瘡服凉藥即愈年至十五復患之服四物加黄栢方愈吏部姚海山子口内生瘡用寒凉之劑更加發熱飲湯不絶余用補中益氣加炮薑一劑而愈工部張頥齋子二嵗口舌生瘡症屬胃火敷栁華散加味解毒散而愈後因傷食吐瀉不時弄舌用四君子湯而愈此症亦有發搐痰喘者皆中氣受傷而虚熱也亦用前湯即愈唐儀制子口舌生瘡延及頭面胸臂膿水淋漓此胎毒之症内用牛黄解毒丸外以當歸膏調黄栢末塗之而愈鄭司諫子口舌生瘡齒齦腐爛延及頭面膿水淋漓體瘦瘙痒此脾經疳熱用肥兒丸及大楓膏而愈瘡瘍與痘瘡叅看小兒瘡瘍乃胎中遺熱或母食厚味所致若腫焮疼痛冝消毒熱渴便秘冝䟱𨗳不消散不成膿冝托裡大凡腫起或結核作痛者用犀角消毒丸腫焮痛甚者用活命飲若腫硬色白用如聖餅腫硬色赤用隔蒜灸若膿成而不潰冝托裡有膿即刺之若肉赤而不斂用四物參术以補血肉白而不斂用四君加芎歸以補氣食少體倦而不斂用六君加芎歸升麻以補脾若煩躁時嗽腹痛渴甚大便無度小便如淋膿毒痛甚目視不正喘粗恍惚嗜卧不食服藥而嘔四肢浮腫此脾胃虚損血氣虧極之惡症並用補中益氣或六君子亦可轉危而安若動息自寜飲食知味便利調匀膿潰腫消神彩精明語聲清朗此血氣無虧之善症也善候多而惡候少或脉㣲濇遲緩者易愈惡候多而善候少或脉洪大粗散者難治余嘗治七惡並至但用前二湯補其脾胃多有復生者故丹溪先生云但見腫痛參之脉症虚弱便與滋補氣血可保終吉若用驅逐敗毒虚虚之禍不免矣治驗太常邊華泉子三嵗面生小瘡内服發散外敷蝕藥面目腫焮視其寅關脉青而㣲赤此風熱也症輕而劑重表裏皆傷俾洗去前藥用補中益氣加白芷桔梗一劑而愈王通府子腿患毒膿已成腫痛發熱作嘔少食用托裏散而膿潰翌日吐㵼發搐乃膿潰而脾氣復虚也余用薑术補中湯而安仍用托裏而愈戚侍御子頸間患毒膿成不潰此氣虚也當刺之不從至脹痛始針膿出即安此症若膿已成急刺去用紙撚蘸蔴油絍瘡口以膏藥貼之兒安不必服藥凡小兒瘡毒不愈或愈而復發多因母食厚味或有熱症冝於治母藥中加漏蘆令母服之並痊南都葉太守孫兩臂患毒敷服皆寒凉兩臂腫硬當助胃壯氣以解凝寒乃用補中益氣加茯苓半夏薄桂服之更以如聖餅熨之而愈凡患腫硬不拘赤白不問痛否但未成膿者用如聖餅或熱葱熨其效如神儒者陳方洲女十嵗左耳下連項赤腫頭痛此少陽膽經火症用梔子清肝散而消一小兒所患相同作嘔懶食此木尅脾土用小柴胡去黄芩加茯苓芍藥治之而消一小兒患亦同前因誤服寒凉虧損脾胃以前藥更加木香而消一小兒缺盆患之發熱作痛此膿内潰所致症屬肺經喜其左顋白右顋黄而乃脾土生肺金也遂針出膿用托裏藥而愈都憲王涵峯幼子項患毒膿成不出兩顋皆白余曰此肝膽虚熱之症今顋白乃肺金尅肝木也當急用針并調補脾氣不信余言果内潰而歿瘡疥小兒瘡疥有膏粱積熱有肝熱腎熱有父母遺熱治法若遺熱用化毒丹厚味用肥兒丸肝熱用九味蘆薈丸腎熱用六味地黄丸若兼項側有核用九味蘆薈丸兼齒齦潰爛用六味地黄丸治驗南都劉太守子患此肌體消瘦便滑寒熱齦爛口渴此腎疳也用六味地黄丸更搽解毒散而愈劉鴻臚子頭面初起似癬非癬不時作痒乆則焮赤膿水淋漓延及遍身用加味消毒散及搽清凉散解毒散而愈閣老靳介菴子三嵗或痛或痒膿水淋漓此胎毒為患用牛黄解毒丸更以當歸膏調黄栢末塗之乳母以解毒散加漏蘆服之而愈一小兒遍身生瘡久而不愈胗其乳母有肝火血燥之症用加味逍遥散更加漏蘆治之用當歸膏調山梔黄栢末塗兒患處俱愈痘毒小兒痘疹餘毒輕則肌表津淫瘙痒重則肢節壅腫作痛若發熱而大便秘結者犀角消毒散發熱而大便調和者清熱消毒散大便調和而渴者麥門冬飲腫痛發熱而渴者仙方活命飲大凡根赤而作痒者血虚也四物加牡丹皮色白而作痒者血虚也四君加當歸芍藥色赤而作痛者血熱也四物加連翹金銀花色白而不焮痛者血氣虚也托裏散不成膿或不腐血氣俱虚也八珍湯膿既潰而不歛脾氣虚也六君子湯按之隨指復起者内有膿也即刺之勿使内攻膿出兒安不必服藥如膿清稀或反作痛或倦怠熱渴或作痛等症皆屬氣血虚甚急以參茋歸术之類補之若虛中見惡症者不可救實中無惡症者多自愈辛夘南畿患痘甚衆十死八九壯年者亦然云服硃砂痛苦頓解食毒物肢體如錐大人且然小兒豈能勝哉當深戒之丹溪先生云痘癰多是餘毒血熱王海藏先生云肝虚則入目肺虚則為疥發於骨節者腎之虚發於肌肉者脾之虚發於口齒咽喉腫痛者各隨本經見症治之治驗進士曹時用子痘疳蝕陷敷以雄黄銅緑及服加味解毒散而愈一小兒遍身膿水淋漓以經霜茅草研末鋪於寢席更服前散而愈用神效當歸膏調敷之尤妙南都姚太守子腿膝腫痛此因脾胃虚而毒流注先用活命飲四劑腫痛頓減再用補中益氣湯及六味地黄丸而痊表姪方位兩臂腿腕焮赤腫強不能舉動俱以為痼疾余用黄豆末熱水調敷服活命飲二劑而消表姪方位兩目赤腫痛不可當此肝火為患用四物合小柴胡山梔牛蒡子生甘草倍用榖精草數劑而愈一小兒腿膝腫潰而膿水不止内熱晡熱體倦肌痩此元氣復傷也用補隂八珍湯六味丸三月餘而愈天疱瘡小兒天疱瘡乃脾肺二經風熱而發若發熱焮痛者用人參敗毒散發熱咳嗽者加味抱龍丸發熱寒熱者清氣消毒散熱渴便秘者用加味清凉飲此肌膚之症當去毒水以黄栢蚯蚓屎敷之用當歸膏亦善兒既安不必服藥治驗劉司㕔子患此焮赤發熱敷金黄散服大連翹飲三劑少愈更用加味解毒散而痊一小兒焮痛發熱挑去毒水以金黄散敷之更服荆防敗毒散而愈更用柴芍參苓散而安考功楊璞菴幼子服敗毒之劑喘嗽唇白此藥傷脾肺先用補中益氣加茯苓麥門五味一劑諸症悉退後去門冬五味加桔梗白芷二劑全愈楊梅瘡近時名楊梅瘡乃天行濕毒有傳染而患者有禀賦而患者受症在肝經故多在下焦發起治失其法多至蝕傷眼目腐爛腎莖拳攣肢節原其初起有上體多者先用荆防敗毒散下體多者用龍膽㵼肝湯大便秘者用大連翹飲後用換肌消毒散為主若蝕眼目兼以九味蘆薈六味地黄二丸肢節拳攣者兼用蠲痺解毒湯若脾胃虧損而不能愈者先用六君子湯若氣血虚弱而不能愈者先用八珍湯後用換肌消毒散若槩用輕粉等劑多致不起治驗一週嵗小兒染此誤薰銀硃之藥昏憒不乳遍身無皮余用菉豆黄栢末遍鋪於蓆令用睡卧更用金銀花生甘草末白湯調服漸愈若瘡乾燥更用當歸膏若誤用輕粉亦以前法解之一小兒患此年餘形體消痩日晡熱甚余晨用八珍湯夕用換肌散并太乙膏三月餘而愈一小兒三年不愈肌體消瘦膿水淋漓此因元氣虚耗而兼肝症用換肌散九味蘆薈六味地黄二丸兩月餘愈黄水粘瘡小兒黄水粘瘡屬脾肺二經風濕熱所致若邪在表而痒痛者輕則用犀角消毒散重則連翹防風湯邪在内而大便秘者輕則用九味解毒散重則用連翹飲若頭目不清憎寒壯熱便秘表裏俱有邪也用加味清凉飲治之治驗毛通府子患此夘關脉黄兩目時劄形體困倦此土虛木旺當用和肝補脾湯及服敗毒散前症益甚更加吐㵼不食遍身發泡余仍用前湯撥去泡水以菉豆甘草末頻鋪蓆上任其睡卧後用神效當歸膏而痊沈尚寳子發疙􅜀或用大連翹飲致腹脹少食此表症而反㵼其裏致元氣復損也余用補中益氣湯治之漸愈一小兒疙􅜀作痒發熱既破膿水淋漓此肝火血熱用加味逍遥散而愈一女子十四嵗遍身疙􅜀搔破成瘡膿水淋漓發熱煩躁日晡益甚乃血氣虛而有熱用加味逍遥散而愈痔瘡小兒痔瘡或因胎熱或因熱痢或因厚味所致盖肛門腫痛者濕熱也作痛者風熱也便秘者火盛也清膿者熱熾也濕熱者加味槐花散之類風熱者秦芁蒼术之類便秘者潤燥湯清之膿潰者黄茋散托之治驗侍御陸釣雪子患此彼執用寒凉之藥肢體倦怠飲食少思肛門重墜大便不實余曰此脾胃傷而中氣陷故爾用補中益氣湯加酒炒白芍藥白术茯苓而康倪二守孫肛門腫痛出血水年餘矣忽吐血便血皆紫而成塊此膓胃積熱用犀角地黄湯頓止更用金銀花炙甘草末白湯調服半載而痊肛門作痒小兒肛痒或嗜甘肥大腸濕熱壅滯大便秘結或濕毒生蟲而蝕肛門若濕熱壅滯者用四味肥兒丸大便秘結者用清凉飲蟲食肛門者先用化䘌丸後用四味肥兒丸外以雄黄散納肛内若因病不食蟲無所養而食臟食肛者其齒齦無色舌上盡白四肢倦怠當視其上唇内有瘡唾血如粟心内懊憹此蟲在上食臟若下唇内有瘡此蟲在下蝕肛門若食肛透内者不治道藏經云諸蟲惟上半月頭向上可用藥追之望後頭向下患者親自烹餁蟲聞香味頭即向上亦可追之治驗一小兒肛門作痒余以為大腸經風熱用槐角丸一小兒連肛門連隂囊痒余以為肝經濕熱用龍膽㵼肝湯蘆薈丸一小兒吐嘔青沬腹脹筋青唇口紫黑余以為肝木尅脾土用火蘆薈丸並愈囊癰小兒囊癰屬肝經濕熱或胎禀熱毒初起腫痛用龍膽㵼肝湯三四劑如不消用托裏以速其膿若膿未潰而小便不利毒壅滯也當滲之膿已成而不利者膿壅塞也當針之膿去而痛不減者當解毒膿去而反痛者當補托甚者隂囊盡潰睾丸懸露亦不為害若疝氣誤服熱劑隂囊腫痛亦治以前法治驗司徒李杏岡仲子小便澁滯腫痛寒熱此肝經濕熱用龍膽㵼肝湯而消但内熱倦怠此兼脾氣虚弱用四君子加柴胡山梔芎歸而愈林侍御子二嵗腫痛寒熱尅伐過多不能成膿用托裏清肝散而潰又用托裏散而斂後寒熱如瘧小便閉塞亦屬肝火用小柴胡加山梔龍膽草車前子而愈鮑尚寶子三嵗大潰痛甚煩躁飲冷此餘毒尚在與活命飲二劑腫痛頓退與四君加柴胡山梔四劑諸症既退再以托裏散而斂下疳并陰痿小兒下疳隂痿屬肝火濕熱若下疳腫痛發熱用九味柴胡湯小便赤濇用小龍膽㵼肝湯其腎莖萎軟乃肝火濕熱盖肝火屬木得雨露則森立遇酷日則痿軟若誤為虚寒投以熱劑輕則囊莖生瘡重則腐而不斂皆冝滋腎水生肝木清肝火經云肝氣熱則筋痿故宗筋弛縱腎莖腫脹或出白液或痒痛或裏急筋縮挺縱不收或精隨便下名筋疝俱屬肝火與腎無干也治驗宗伯黄久菴子春初生時母棄淹於水逾日不死始收之遂成喘嗽又頷腋臂背股各結塊核潰而色紫若誤觸之痛應於心服辛温化毒等劑綿延不愈時巳弱冠詢治於予予曰初生而喘嗽者乃飲冷傷肺也既長而喘嗽者乃肝火刑肺也故結核俱在肝膽部分始用補中益氣湯後用九味蘆薈丸不月諸症咸愈此禀父母之肝火而患也吳江庠生史𤣥年自乳兒時即患目疾年二十嵗目劄頭揺用六味丸加五味子而安一日前症復作目忽生翳余用聰明益氣湯并前丸即愈既而前症反甚形氣消瘦脉洪大數用補中益氣湯及前丸而肺症悉平後因赴選勞役患痢形氣憊弱肺洪大弦長按之㣲細仍用前湯送香連丸而痢止再用六味丸料加五味子而元氣復侍御呉東隅子下疳潰爛發熱作痛日晡尤甚先用補中益氣湯後用九味蘆薈丸治之諸症悉愈太常邊華泉子二嵗莖痿濕痒出白津余以為肝火不信乃温補腎經果隂囊焮腫莖中作痛余用龍膽㵼肝湯用六味地黄丸而痊劉武庫子睾丸作痛小便赤澁寒熱作嘔用小柴胡湯加山梔車前子茯苓而愈一小兒睾丸腫硬小便黄澁用小柴胡湯加山梔車前子并蘆薈丸而消一小兒腹内一塊或作痛或上攻小便不調用龍膽㵼肝湯蘆薈丸而愈後形氣消爍發熱作渴此肝木制伏脾土用補中益氣湯及蘆薈丸而愈一小兒自脱胎時兩目赤腫或作痒或生翳此禀賦之肝火也用蘆薈六味二丸而愈一女十五嵗患瘰癧身發赤暈形氣倦怠此肝火血虚所致用加味逍遥散而赤暈愈用益氣湯六味丸兼服而瘰癧消一小兒下疳潰爛發熱作痛一小兒莖中作痒不時搔捻一小兒腎莖中潰痛小便秘澁日晡尤甚一小兒目痒出水或項間結核或兩眼連劄或隂囊搔痒年餘矣俱屬肝火用九味蘆薈丸並愈附方并註人參敗毒散加荆芥防風名荆防敗毒散治瘡瘍焮痛寒熱或拘急頭痛邪在表者人參羌活獨活前胡柴胡桔梗枳殻茯苓川芎甘草各五分右水煎服益氣養榮湯治氣血損傷四肢頸頂等處患腫不問軟硬赤白痛否日晡發熱或潰而不斂人參茯苓陳皮貝母香附當歸酒拌川芎黄茋鹽水拌炒熟地黄酒拌芍藥炒各五分甘草炙桔梗炒柴胡各三分白术炒一錢右薑水煎服大人倍用九味蘆薈丸治疳積瘰癧結核耳内生瘡或疝氣囊癰下疳潰爛或莖出白津股腹有瘡或體瘦熱渇大便不調牙齦蝕落頰顋腐爛等症胡黄連黄連蘆薈木香白蕪荑炒青皮白雷丸鶴虱草各一兩麝香三錢右為末蒸餅糊丸如麻子大每服一錢空心米湯下生地黄丸治室女寡婦師尼惡風體倦乍寒乍熱面赤心煩或時自汗症類時疫但肝脉弦長生地黄一兩酒拌杵爛黄芩硬柴胡各半兩赤芍藥秦艽右為末加煉蜜少許丸桐子大每服二三十丸九味柴胡湯治肝膽經熱毒瘰癧或耳内耳下生瘡發熱潮熱或肝經濕熱下注囊癰便毒腫潰或小腹脇股結核凡肝膽經部分一切瘡瘍發熱並用之柴胡黄芩炒各五分人參山梔半夏龍膽草當歸芍藥各三分甘草三分右水煎服地黄丸加肉桂一兩名加減八味丸治小兒肝經虛熱血燥或風客滛氣而患瘰癧結核或四肢發搐眼目抽動痰涎上湧凡傷損出血多抽搐發熱又治牙疳腦熱消瘦手足如氷寒熱往來滑泄肚脹口臭乾渇齒齦潰爛爪黒面黧遍身兩耳生瘡或耳内出水成發熱自汗盜汗便血諸血失瘖等症其功不能盡述即六味地黄丸牡丹皮白茯苓澤㵼各三兩熟地黄八兩杵膏乾山藥山茱萸肉各四兩右為末和地黄煉蜜丸桐子大每服三五十丸空心白滚湯下地黄須自製薄荷湯治風熱瘰癧初起元氣無虧者薄荷皁角去皮弦連翹三稜煨蔓荆子一兩豆豉三兩五錢荆芥穗一兩何首烏米泔水没右為末醋糊丸桐子大每服二十丸食後滚湯下量兒加減皁角子丸治肝膽經風熱頸脇兩側等處結核連翹八錢當歸柴胡各一兩皁角子炒二兩芍藥山梔炒川芎各一兩桔梗甘草炒龍膽草酒炒黑各半兩右為末米糊丸菉豆大量兒大小用之必效散治瘰癧元氣無虧用此以去之若癧既去而不收斂服益氣養榮湯若元氣怯弱冝先補後服癧毒已下仍服前湯庶無他患輕粉一錢南硼砂二錢五分巴豆五箇去皮心膜白檳榔一箇斑猫四十箇去頭翅同檽米炒麝香五分右同研極細取雞子二箇去黄用清調藥仍入殻内以濕紙數重糊口入飯甑蒸熟取出曝乾研末每服五分用炒生薑酒五更初調服如覺小腹痛用益元散一服其毒俱從大腸出隔蒜灸法治鶴膝風流注等症腫硬每日灸二三十壯痛者灸至不痛不痛者灸至痛其毒隨火而散盖火以暢達拔引鬱毒此從治之法有回生之功其法用大蒜去皮切三文錢厚安瘡處用艾壯於蒜上灸之三壯換蒜復灸未成即消已成者亦殺其毒如瘡大用蒜杵爛攤患處將艾鋪上燒之蒜敗再換如不痛或不作膿及不發起或隂瘡尤當多灸凡瘡不痛不作膿不起發氣血虛極也不治惟患在頭面不冝多灸神效葱熨法治流注結核骨癰鶴膝等症腫硬或先已隔蒜灸而愈腫未消最冝用熨以助氣血行壅滯有益無損其功甚大又為跌撲傷損止痛敗血消腫之良劑其法用葱白頭搗爛炒熱頻熨患處冷再換出頭散治一切頑瘡瘀肉不化或癧核不消瘡口不合赤石脂半兩乳香二錢白丁香二錢砒生用黄丹各一錢輕粉麝香各五分蜈蚣一條炙右為末搽瘀肉上其肉自化若瘡口小或痔瘡用糊作條隂乾絍之凡瘡乆不合者内有膿管須用此藥腐爛兼服托裏之劑方效琥珀膏治瘰癧不潰或潰而膿水不絶變成漏症琥珀一兩木通桂心當歸白芷防風松香硃砂木鱉子丁香木香各二兩右先用琥珀丁香桂心硃砂木香松香為細末其餘為咀以麻油二斤六兩慢火煎白芷焦黄濾去徐下浄黄丹一斤以栁枝不住手攪煎至黒色滴水中捻硬軟得中却入琥珀等末攪匀於磁器盛之用時取少許攤貼和血定痛丸一名黒丸子治流注膝風或撲跌瘀血或六淫所傷肢節腫痛服之自消若潰而發熱與補藥兼服自斂百草霜五兩白芍藥二兩赤小豆八兩川烏炮一兩五錢白斂八兩白芨二兩當歸二兩南星炮三兩牛膝三兩骨碎補四兩右為末酒糊丸桐子大每服二三十丸白湯下神效太乙膏治癰疽瘡毒潰爛𤣥參白芷當歸肉桂赤芍藥大黄生地黄各一兩右用蔴油二斤八兩銅鍋内煎至黒濾去徐入浄黄丹一斤再煎滴水中捻軟硬得中即成膏矣乳香定痛散治一切瘡瘍潰爛疼痛乳香没藥各三錢滑石七錢寒水石一兩煅氷片二錢右為細末搽患處痛即止甚效如聖餅治一切瘡瘍硬腫不能消散乳香没藥木香血竭當歸麝香少許右各另為末酒糊和為餅炙熱頻熨患處徤脾滲濕湯治瘡瘍初起焮腫作痛或濕毒下注或環跳穴痛人參白术蒼术鹽炒防己酒拌黄栢酒炒川芎各一錢陳皮酒拌當歸茯苓木𤓰柴胡稍甘草三分右水煎服如三劑不退加桂少許或用酒煎小便澁倍用牛膝有熱加黄連身痛加羌活量兒大小用化䘌丸治諸疳生蟲不時啼哭嘔吐清水肚腹脹痛唇口紫黒腸頭濕䘌蕪荑青黛蘆薈蝦蟆燒灰川芎白芷胡黄連右等分各另為术猪膽浸糕丸如蔴子大每服一二十丸食後並臨卧杏仁湯下蘆薈丸治肝疳口舌生瘡牙齦腐爛體瘦生瘡虛熱往來或髮稀腹脹小便白濁飲食無度㵼痢無時或兩眼生翳揺頭揉目不時咬指或口乾作渇嗜卧食土腹大胸髙嘔食吐蟲非此藥不能治史君子肉煨芍藥炒各半兩乾蟾半兩炙黒黄連炒蕪荑炒神麯炒麥芽炒各一兩蘆薈三錢右為末神麯糊丸黍米大每服五七分空心米湯下大蘆薈丸治三焦肝膽經風熱目生雲翳或疳熱瘰癧耳内生瘡寒熱作痛肌體消瘦發熱作渴飲食少思肚腹不調或牙齦蝕落頰顋腐爛下部生瘡等症蘆薈胡黄連當歸龍膽草酒浸炒芍藥川芎蕪荑各一兩木香甘草各三錢右為末茯神糊丸麻子大每服三五十丸滚湯下東垣大蕪荑湯一名梔子茯苓湯治黄疳土色為濕為熱當利小便今反利巳黄色中為燥胃經熱髮黄脱落知膀胱腎俱受土邪乃大濕熱之症鼻下斷作瘡土逆行營氣伏火也能乳胃中有熱也寒則食不入喜食土胃不足也面黒色為寒為痺大便清寒也褐色血黒色熱蓄血中間黄色膓胃有熱治當滋營潤燥外致津液山梔仁二分黄蘗甘草炙各二分大蕪荑五分黄連二分麻黄不去根節羗活柴胡各三分防風一分白术五分茯苓當歸各四分右水煎服仍量兒大小大肥兒丸治脾疳飲食少思肌肉消瘦肚大頸細髮稀成穂項間結核發熱作渴精神倦怠便去酸臭愛食泥土或口鼻頭瘡或肚見青筋嚙齒下利便白五疳即肥兒丸加乾蟾一兩蕪荑五錢肥兒丸治食積五疳頸項結核或白秃肌瘦肚大筋青髪稀成穗發熱作渴等症或母食厚味致兒為患黄連神麯木香各一兩半肉豆蔲二兩炮檳榔二十枚麥芽炒史君子酒浸去皮各四兩右為末麵糊丸麻子大每服三五十丸米飲下四味肥兒丸一名小肥兒丸治食積脾疳目生雲翳口舌生瘡牙齦腐爛發熱瘦怯遍身生瘡等症黄連炒蕪荑炒神麯麥芽炒等分右為末水糊丸桐子大每服二三十丸空心白湯下地黄清肺飲治肺疳咳嗽明阿膠一錢麵炒馬兠鈴甘草各五分生地黄杏仁七枚去皮糯米炒十粒鼠粘子三分炒右水煎服量兒加減硃砂安神丸治心疳怔忡心下痞悶硃砂四錢黄連半兩生地黄半兩生甘草二錢五分右為末蒸餅糊丸如米大每服十丸連津送下茯神丸治心疳茯神蘆薈琥珀川黄連赤茯苓鈎藤皮逺志姜製焙乾蝦蟆灰各一錢麝香少許菖蒲一錢右為末粟米糊丸麻子大每服十丸白湯下天麻丸治肝疳眼目生翳昏花濕爛等症青黛川黄連天麻五靈脂川芎夜明砂㣲炒蘆薈各一錢龍膽草蟬蜕去足防風各一錢全蝎二枚焙麝香少許右為末猪膽汁浸糕丸麻子大每服二三十丸白滚湯下阿魏膏治一切痞塊不拘年月逺近甚者口齒蝕傷更服蘆薈丸羌活獨活𤣥參官桂赤芍藥穿山甲生地黄兩頭尖大黄白芷天麻各五錢槐栁桃枝各三錢紅花四錢亂髪如鷄子大一塊洗去膩木鱉子廿枚去殻右用香油二斤四兩煎至黒色去查入髪再煎待髪化盡去查徐下黄丹一斤煎至軟硬得中方入芒硝四錢阿魏五錢蘇合油麝香各三錢乳香没藥各五錢調匀即成膏矣攤貼患處内服消積丸藥黄丹須真正者效凡貼膏藥先用朴硝隨患處大小鋪之約半指厚以紙盖之用熱熨斗熨良久如硝耗再加熨之熨二時許方貼膏藥若是肝積加蘆薈末同熨加味逍遥散治婦人隂虚發熱兒飲其乳以致患瘡甘草炙當歸炒芍藥酒炒茯苓白术炒柴胡各一錢牡丹皮六分山梔炒五分右水煎服大防風湯治膝風腫痛不問已潰未潰附子炮去皮牛膝酒浸甘草炙各一錢羌活人參杜仲姜製當歸酒浸防風白芍藥炒黄茋熟地黄用生者酒拌蒸半日忌鐵器各二錢川芎一錢五分右每服三五錢薑水煎空心服進三五劑更服六味地黄丸二三服獨活湯治鶴膝風不問腫潰疼痛及腰背不便四肢不仁獨活五分當歸酒洗白术黄茋炒薄桂牛膝各三分甘草炙二分右薑葱水煎服量兒加減托裏散治流注鶴膝及一應瘡毒已成不潰已潰不斂或膿出反痛發熱人參五分黄茋炒一錢白术六分陳皮五分甘草炙三分當歸七分川芎芍藥酒炒熟地黄酒拌白茯苓各五分右水煎服加味地黄丸治小兒賦禀腎經虚熱耳内生瘡或肌肉消瘦骨節皆露名節疳即地黄丸加鹿茸牛膝各一兩五味子四兩若顱解不合牙齒不生眼睛不黒腿軟難行最冝此藥砭法治小兒丹毒赤色遊走不定口吮毒聚在一處用細磁器擊碎取其有芒者一塊以筋一根劈開頭尖夾之用線縛定兩指輕撮筯稍令磁芒正對聚處懸寸許再用筯一根頻擊筯頭令毒血遇刺皆出毒入腹者不救症輕者止用口吮出毒用藥敷之如患在頭皮不用砭法止冝用針卧倒挑患處以出毒血消熱消毒散治一切癰疽陽症腫痛發熱作渴黄連山梔連翹當歸各五分川芎生地黄芍藥炒各六分金銀花一錢甘草二分右水煎服托裏消毒散治瘡瘍先用消解之劑不退冝服此藥助其成膿人參黄茋陳皮白术當歸各一錢金銀花皁角刺炒甘草各四分右水煎服神功散治一切瘡毒未成膿者用之内消加乳没尤好黄栢炒草烏炒血竭等分右為末唾津水調搽赤腫既退洗淨搽後方二味解毒散化毒丹治小兒熱毒咽乾口舌生瘡口齒出血或驚惕狂躁睡卧不寜並冝用之𤣥參桔梗各五錢茯苓二兩五錢人參牙硝青黛各一兩甘草七錢半麝香一字金銀箔各十片右為末煉蜜丸豆大每一嵗服一丸白湯化下犀角消毒散一名犀角散治小兒丹毒發熱痛痒及瘡疹等毒牛蒡子炒甘草荆芥防風各五分犀角二分鎊末金銀花三分右水煎熟傾出入犀角服加味四物湯治小兒血熱丹毒當歸川芎各一錢芍藥生地黄各七分柴胡山梔炒各五分右水煎服消風散治小兒癮疹搔痒荆芥穗甘草炙陳皮各半兩人參白殭蠶茯苓防風芎藭藿香蟬蜕各二分厚朴三分姜製羌活右水煎服清解散治風熱癍疹發熱作渴及痘毒連翹荆芥穗甘草各三分牛蒡子炒五分𤣥參四分金銀花二分右水煎服解毒散治癍疹痒痛寒熱甚者煩躁譫語并痘毒發熱咽乾犀角鎊五錢連翹三錢薄荷一錢牛蒡子炒二錢甘草五分右為末每服一二錢滚湯調下一方治虛熱口内生瘡白礬二兩杵碎滚湯三碗入在内頻浸兒脚牛黄解毒丸治胎毒牛黄甘草等分右為末用煉蜜丸量兒服㵼黄散治脾胃實熱口舌生瘡喜飲冷物又治脾熱吐舌若不時出舌名弄舌屬心脾虚熱冝用人參安胃散藿香葉七錢石膏煅五錢甘草三錢防風去心炒山梔仁炒各一两右用蜜酒同炒為末每服二錢水煎服補黄散治脾胃虚熱口舌生瘡畏寒冷飲食人參白术炒各一錢白芍藥炒陳皮各五分甘草炒五分右薑棗水煎服四順清凉飲加山梔牛蒡子名加味清凉飲治小兒痘瘡後臟腑秘結實熱驚掣當歸赤芍藥甘草炙大黄蒸各三分右水煎服大黄非實熱便秘不冝用人參安胃散治小兒因服峻厲損其脾胃口舌生瘡或因傷熱乳而致吐㵼或作慢驚口鼻氣熱或胃中風熱伏火嘔吐泄㵼人參一錢黄茋二錢生甘草炙甘草各五分白芍藥七分白茯苓四分黄連二分右為末每服三五錢水煎服溫中丸一名人參理中丸治中氣虛熱口舌生瘡不喜飲冷肢體倦怠飲食少思人參甘草白术各炒等分右為末用薑汁糊丸菉豆大每服三五十丸補中益氣湯治中氣傷損惡寒發熱肢體倦怠飲食少思或頭痛身熱煩躁作渴氣髙而喘或㣲細軟弱自汗倦怠飲食不甘等症人參黄茋甘草炙各一錢白术當歸身陳皮各五分柴胡升麻各二分右薑棗水煎服七味白术散一名錢氏白术散治中氣虛熱口舌生瘡不喜飲冷或吐㵼口乾人參白术木香白茯苓甘草炙藿香各五分乾葛一錢右水煎服香連丸治痢疾并水㵼暑㵼甚效黄連淨十二兩吳茱萸去核梗十兩右先將二味用熱水拌和入磁器内置熱湯頓一日同炒黄連至紫色去茱用連為末每淨末四兩入木香淨末一兩淡醋米飲為丸桐子大每服二三十丸滚湯下中氣下陷用補中益氣湯下中氣虛用四君子湯下中氣虚寒加薑桂參苓白术散治脾胃不和飲食不進或嘔吐泄㵼凡病後冝此調理人參茯苓白扁豆去皮薑汁拌炒白术炒蓮肉去心皮砂仁炒薏苡仁炒桔梗炒山藥甘草炙各二兩右為末每服一錢白湯下或作丸服柴胡參苓湯治肝火血熱遍身瘙痒或起赤暈柴胡山梔炒川芎芍藥炒各五分熟地黄當歸各八分茯苓八分甘草炒五分右水煎服柴芍參苓散治肝膽經部分結核瘰􅐇瘤瘊等症或肝血燥熱脾氣虛弱發熱少食柴胡川芎白术人參茯苓白芍當歸各五分牡丹皮甘草山梔炒各三分右薑棗水煎服清肝益榮湯治肝膽經風熱血燥筋攣結核或作瘊子柴胡山梔炒各五分當歸六分龍膽草酒炒五分川芎芍藥各六分甘草三分薏苡仁五分右水煎服清熱凉血飲治風熱血燥丹毒等症大便秘結當歸川芎芍藥炒生地黄各一錢黄連炒五分荆芥六分右水煎服大便秘量加大黄清中解鬱湯治脾氣虚弱飲食停滯欝熱生痰或身發熱赤暈白术茯苓陳皮山梔炒山查神麯炒麥芽炒川芎桔梗甘草炒各五分右薑水煎服芍藥參苓飲治肝木尅脾土目劄面青食少體倦芍藥炒柴胡山梔茯苓白术陳皮各七分甘草炙五分右薑水煎服薑术補脾湯治元氣虛寒嘔吐不食腹痛泄㵼等症乾薑炒白术人參茯苓陳皮半夏甘草炒各五分當歸黄茋炒各四分右薑棗水煎服和肝補脾湯治風熱瘡疹脾土不及肝木太過人參陳皮川芎各五分白术茯苓芍藥各七分柴胡甘草炙各三分山梔炒四分右水煎服益脾清肝散治肝經之症或寒熱體痛脾胃虛弱人參白术茯苓甘草川芎當歸黄茋各五分柴胡三分牡丹皮四分右水煎服梔子清肝散治三焦及足少陽經風熱耳内作痒或生瘡出水或脇肋胸乳間作痛或寒熱往來柴胡牡丹皮梔子各一錢茯苓川芎芍藥當歸牛蒡子炒各七分白术甘草各五分右水煎服柴胡清肝散治肝膽三焦風熱怒火或項胸作痛或增寒發熱柴胡黄芩炒人參各三分山梔炒川芎各五分連翹桔梗各四分甘草三分右水煎服加味消毒散治一切瘡瘍丹毒遊風等症𤣥參連翹各五錢升麻芍藥當歸羌活生地黄牛蒡子炒各三錢黄芩甘草各二錢右為末每服一錢薄荷燈心湯下或用蜜為丸十全大補湯治諸瘡血氣虛弱不散解不潰斂或膿出發熱惡寒汗出煩弦口眼歪斜或肌痩少食發熱口乾等症須多服為善即四君四物加黄茋肉桂四物湯治發熱煩躁或日晡發熱若因脾胃虚弱而不能生血冝用四君子之類最忌此藥熟地黄當歸各三錢芍藥二錢川芎一錢半右水煎服四君子湯治脾胃虛熱唇口生瘡不消散不潰斂或食少作嘔大便不實若因肝木乗脾上而致加柴胡芍藥人參白术茯苓甘草炙一錢右薑棗水煎服六君子湯治脾胃虛弱飲食少思或大便不調肢體消瘦面色痿黄即四君子湯加陳皮半夏八珍湯治氣血俱虛腫潰不愈或惡寒發熱或晡熱作渴飲食少思即四君四物薑水煎服補隂八珍湯治屬足三隂虛熱渴體倦小便頻數即八珍湯加酒炒黒黄栢知母各三四分加味八珍湯治元氣虚弱不能潰斂或内熱晡熱肌體消瘦即八珍湯加牡丹皮五味子炙甘草各三四分當歸補血湯治潰瘍肌熱躁熱面赤煩渴脉洪大而虛重按全無此脉虛血虚也誤服白虎湯必死黄茋二錢炒當歸一錢酒製右水煎服大連翹飲治風熱熱毒表裏皆受患者連翹􅜰麥荆芥木通赤芍藥蟬蜕甘草防風柴胡滑石山梔炒黄芩炒當歸各等分右量兒大小水煎服立効散治眉瘡耳瘡及一切瘡疥定粉松香黄栢黄連各五錢枯礬二錢右為末用清燭油調搽犀角消毒丸治一切瘡毒焮腫熱痛用三五服不消乃欲成膿也冝用托裏之劑犀角薄荷連翹𤣥參各二錢牛蒡子二錢金銀花一錢甘草三分右為末煉蜜丸麻子大每服三十丸滚湯下韶粉散治痘瘡已愈瘡痂不落或凹或凸韶粉輕粉各二兩右為末入猪脂油調塗亦無瘢痕神效雄黄散治走馬疳并痘毒疳蟲蝕肛門雄黄銅緑各二錢右為末摻瘡上栁華散治熱毒口瘡黄栢炒蒲黄青黛人中白煅等分右為末敷之敗草散治痘瘡􅎲搔成膿淋漓屋爛草用盖墻爛草亦可要多年者佳右為末糝之若渾身膿水粘衣難以臥坐用一二升攤於蓆上令兒坐臥即安其草經年霜雪雨露受天地隂陽之氣能解瘡毒榖精草散治痘後眼有翳膜或癮澁出淚榖精草一兩生蛤粉一兩右為末用猪肝一葉以竹刀批開糝藥在内縛定磁器内煑熟食之治痘毒用黄豆為末温水調塗以水潤之膿未成自消又方治症同前貝母南星殭蠶天花粉白芷草烏大黄各四兩猪牙皁角四兩寒水石煅八兩右各為末醋調敷加味小柴胡湯治痘疹熾盛或大便下血或昏憒不食或發癤毒甚效又治肝火等症軟柴胡人參黄芩甘草炙各五分半夏二分生地黄一錢右薑水煎服犀角地黄湯治痘出稠宻熱渴赤痛大便秘結小便赤濇或結痘毒或便血䘐血急服之以涼血解毒犀角一錢如無升麻代之生地黄五分赤芍藥牡丹皮各一錢右水煎服麥門冬飲治痘毒發熱作渴咽痛黄芩三分甘草五分人參𤣥參各三分金銀花五分麥門冬去心四分右水煎服射干散治痘毒咽喉腫痛升麻甘草桔梗射干各五分鼠粘子四兩炒香右水煎服加減抱龍丸治風痰壅盛驚搐昏睡等症雄黄辰砂各二錢天竺黄四錢麝香五分天麻六錢牛膽南星八錢右為末煑甘草糊丸皁角子大每一丸薄荷湯下解毒散治一切瘡瘍風疹痒痛黄栢炒山梔等分右為末水調搽若破而膿水淋漓用當歸膏或燭油調搽清凉解毒散治症同前或作焮痛大黄黄栢山梔寒水石煅等分右各另為末調搽當歸膏尤好大楓子膏治一切瘡疥膿窠等瘡大楓子肉杵細二兩白礬枯末二兩真輕粉一兩桕油六兩右將桕油溶化入三味和匀用之黄金散治天疱瘡止痛消毒滑石甘草等分右為末挑破去水敷之換肌消毒散一名􅒝薢散治楊梅瘡不拘初起潰爛並效土茯苓五錢當歸白芷皁角子薏苡仁甘草各五分白蘚皮木𤓰不犯鐵器木通金銀花各三分右水煎食前并空心服蠲痺解毒散薑黄羌活白芷赤芍藥當歸各四分白术五分土茯苓一錢白芷皁角子炒各三分右水煎服龍膽㵼肝湯治肝經濕熱玉莖患瘡或便毒懸癰囊癰腫痛或潰爛作痛小便澁滯或睾囊懸掛車前子炒木通生地黄酒拌當歸尾酒拌山梔炒黄芩炒甘草各五分龍膽草酒拌炒黄澤㵼各一錢右水煎服九味解毒散治一切熱毒腫痛或風熱搔痒黄連三分金銀花連翹漏蘆各五分山梔四分白芷六分當歸八分防風三分甘草三分右水煎服升麻除濕湯自上而下者引而升之升麻柴胡各五錢蒼术一錢陳皮甘草神麯防風大麥蘖各三分猪苓澤㵼半夏各五分右薑棗水煎服胃寒腸鳴加益智仁五分神效當歸膏治杖撲湯火等瘡毒不問已潰未潰殊有神效當歸黄蠟各一兩生地黄一兩蔴仁六兩右先將當歸地黄入油煎黒去查入蠟溶化候冷攪匀即成膏矣白蠟尤好治症詳見正體治驗四苓散加桂名五苓散治下焦濕熱小便不利猪苓澤㵼白术茯苓各五分右水煎服加味槐花散治腸風下血痔瘡腫痛發熱槐花熟地黄白术青皮荆芥穂川芎各二分當歸身升麻各五分枳殻條芩炒各二分右水煎服秦艽蒼术湯治痔漏大便堅硬小便頻數闕作渴秦芁五分蒼术三分澤㵼二分防風三分桃仁皁角子炒當歸尾黄栢酒炒檳榔條芩炒山梔炒右水煎服潤燥湯治痔瘡大腸風熱血燥秘結不通生地黄麻子仁研山梔各五分川芎羌活黄栢條芩各三分郁李仁赤芍藥當歸尾甘草各四分澤㵼二分右水煎服黄茋散治痔瘡并一切癰毒潰後補虚去客熱茯苓黄茋各五分當歸川芎各四分白芍藥白芷各三分升麻山梔炒各二分右水煎服枳殻散治痔瘡腫痛或下血枳殻去炒槐花荆芥皁角子炒蝟皮炙各等分右為末每服一錢滚湯下作丸亦可加味槐角丸治症同前槐角枳殻當歸黄芩皁角仁蝟皮炙秦芁白芷右為末蜜丸量兒大小服消毒膏治痛消毒羊膽一箇氷片五分右將氷片為末以羊膽調塗之小龍膽㵼肝湯治肝經濕熱隂囊腫痛小便赤澁發熱作渴等症如三四劑不退必欲作膿也用托裏之劑澤㵼柴胡車前子炒木通各五分生地黄黄芩炒當歸尾酒洗龍膽草酒浸炒黄赤茯苓各五分山梔一錢甘草稍三分大龍膽㵼肝湯治囊癰熱毒熾盛腫脹便秘即前湯加防己連翹大便秘更加大黄如大便通而腫不退或愈加脹痛内有膿也用托裏之劑及時針之最易收斂當歸龍薈丸治肝膽二經一切有餘火症草龍膽當歸大梔子黄連黄芩各一兩半大黄蘆薈黄栢各半兩麝香少許木香二錢半右為末麵糊丸桐子大量兒服附避難止小兒啼用綿為小毬隨大小為之但使滿口不閉其氣置兒口中使吮其味兒口中有物自不能作聲但軟物不傷兒口亦可凡避㓂匿山谷中多為兒啼卒不免難由是避者預將兒棄之哀哉兹大司成邱公以此方梓行於世特取以附之庶或可以推廣其仁心也薛氏醫案卷五
