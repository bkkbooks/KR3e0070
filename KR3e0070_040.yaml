body:
  text: 薛氏醫案卷四十明薛已訂婦人良方坐月門妊娠疾病既明須知坐月避忌故以次之産寶方周頲序第一頲聞至靈者人最重者命人皆知命之重而不知養命之方以致年未衰邁疾病攻奪倉卒尋醫多致有誤况婦人病惟産難為急子母命懸片時故産二三胎者臟腑未衰血氣未減疾病易治若産育過多復自乳子血氣愈傷尤難治若産後血氣未復胃氣益傷諸症蜂起此古人所以專著産乳方論余故遍採産寶等方兼拾咱氏之遺作為論説萃為一編刋行于世以救危急云時丁巳嵗秋八月吉日周頲謹序將護孕婦論第二凡妊娠至臨月當安神靜慮時當步履不可多睡飽食過飲酒醴雜藥宜先貼産圗依位密鋪床帳預請老練穩婆備辦湯藥器物欲産時不可多人喧閧愴惶但用老婦二人扶行及憑物站立若見漿水腰腹痛甚是胎離其經令産母仰卧令兒轉身頭向産門用藥催生坐草若心煩用水調服白蜜一匙覺飢吃麋粥少許勿令飢渴恐乏其力不可強服催藥早於坐草慎之愚按前論當慎守之此先哲好生之德防患於未萌者也仁哉滑胎例第三凡妊娠十月宜服滑胎湯藥滑胎枳殼散令胎瘦産易河陽公主每産纍日不下南山道人進此方商州枳殼麩炒二兩粉草炒一兩右為末每服二錢空心沸湯調日三服凡孕六七月宜服之溫隱居加當歸廣木香各等分易産兼治諸疾下氣寬膈枳殼麩炒五兩甘草一兩半香附子三兩炒去毛右為末每服二錢用白湯調服內補丸治妊婦衝任脈虛補血安胎熟地黃二兩用生地酒拌蒸熟杵膏當歸一兩炒為末右為末和丸梧子大每服三四十丸溫酒或滚湯下許學士云大率妊娠唯在抑陽助隂然胎前藥唯惡羣隊隂陽錯雜别生他病唯枳殼散所以抑陽四物湯所以助陰爾然枳殼散其味多寒若單服恐致胎寒腹痛更以內補丸佐之則陽不至強隂不至弱隂陽調和有益胎嗣此前人未嘗論及也易産滑胎車前子為末或酒或飲服寸匙詩云芣苡能令婦人樂有子矣陸機注云治婦人産難愚詳孔子序詩云樂然則生易於生育即此謂也神寢丸臨月服之神效蘄州施少卿方蘄州徐太丞傳通明乳香半兩别研枳殼一兩麩炒右為末煉蜜丸梧子大每服三十丸空心溫酒下榆白皮散治妊娠滑胎易生榆白皮甘草各二兩葵子一兩右為末每服五錢水煎孕及九月將産豬肚一具煮爛徐徐自食盡易産保元散治寬氣進食瘦胎易産或居處失宜頓仆胎動若胎痛胎漏兼服佛手散見通用方香附四兩山藥二兩砂仁一兩木香四兩粉草一兩益智紫蘇葉各半兩右為末每服二錢白湯調下神寢丸枳殼散見前此三藥入月宜常服保産無憂散治妊婦身居安逸口厭甘肥憂樂不常食物不節致胞胎肥厚根蒂堅牢入月服之則易生矣當歸川芎白芍藥枳殼麩炒乳香各三錢木香甘草血餘即髮灰以獖豬心血和之各一錢半右為末每服三錢水煎日二服神效月空方位例第四出太平聖惠方外臺祕要同正月三月五月七月九月十一月在丙壬二月四月六月八月十月十二月在甲庚逐月安産藏衣忌向方位第五凡安産藏衣方位並於卧閣內分布太平聖惠方云凡妊婦初入月便寫産圗一本以朱書某月某日空貼在某位如正月在丙壬可於壬位安産婦床帳丙位藏衣之類貼産房北壁若值閏月只看節氣用之又云每月産圗有雷公招搖運鬼力士天狗軒轅大時咸池豐隆吳時白虎大夫天候狂虎凡此十三神並從月建易其位所謂月空者按內經云月廓空無寫主冰注云論月輪中空日也即非十三神之數今太平聖惠方以六陽月在丙壬以六隂月在甲庚正如外臺所言正月在丙壬至十二月在甲庚之類其理一也但外臺言之詳聖惠言之簡今人多從其簡或云凡逐月安産藏衣並向月德月空方位所有十三神殺並從節氣更換若交次月節便作次月用書産圗者非也假如正月十四日立春若妊婦十三日乳卧豈可作去年十二月用必依月分用之乃是若依節氣使換則天德月德所在差矣然月空與任謂之中天空頗相類議者以為天空者非十三神之數蓋課中有天乙貴人其位無可與對者故此空是謂天空值此神百事不宜止宜安産婦床帳藏衣之類耳集聖厯云天德正月在丁二月在坤三月在壬四月在辛五月在乾六月在甲七月在癸八月在艮九月在丙十月在乙十一月在巽十二月在天又堪輿厯有遊年白虎殺神在太嵗後一辰如太嵗卯則白虎在寅餘倣此推之若産及藏衣犯之則母子皆不利王子亨云難産逆生論稱犯一切神殺固有是理然亦有自然難産兒自逆生者及有産腸俱下者産已則復如故此非疾病所致血氣所主天下之理蓋有不可窮詰者亦宜知之安産藏衣十三神吉凶方位藏安運雷招斬咸豐天狂天大白衣産鬼公搖轅池隆狗虎侯夫虎吉吉力大吳方方士時時正月壬丙艮寅寅卯辰辰辰午申酉戌二月坤甲寅乾亥卯子丑未巳酉巳戌亥三月丙壬坤申辰酉戌戌午子寅亥子四月甲庚巽己巳午未丑未酉亥子丑五月丙壬艮寅午卯辰辰申子申丑寅六月庚甲乾亥未子丑未酉卯巳寅卯七月丙壬坤申申子酉戌戌戌子寅卯辰八月庚艮甲巽己酉酉午戌丑亥卯亥辰巳九月丙壬艮寅戌卯辰辰子午申巳午十月庚甲乾亥亥子丑未丑卯巳午未十一月壬巽丙坤申子酉戌戌寅午寅未申十二月庚甲巽巳丑午未丑卯酉亥申酉推婦人行年法第六生氣方産婦宜向之坐卧及産帳向之開門大吉反支月遇此月即鋪灰上用牛皮或馬驢皮訖鋪草勿令惡血汚地吉禍害月不得於其上産又不得向之二便避之大吉絶命方不得於其上産又不得向之大小便避之大吉懸尸日遇此日産不得攀繩宜懸馬轡攀之大吉閉肚方臨月至滿月並不得向之大小便及棄不淨之水謹之吉八莊方産帳不得向之開門忌之大吉生反禍絶懸閉八産卧宜氣支害命尸肚莊母宜喚方月方方日方方十三嵗行年在庚申坤正七月離巽辰戌日在正西偏北辛在正東偏北甲黃色衣西南首西南方黃衣師看産十四嵗行年在己未二八月坤兊卯酉日在正北偏西壬在正北偏東癸赤色衣正南首正南方赤衣師看産十五嵗行年在戊午坎三九月乾艮丑未日在正東偏北甲在正北偏西壬黑色衣正北首正北方黑衣師看産十六嵗行年在丁巳震四十月艮乾丑未日在正東偏北甲在正西偏北辛青色衣正東首正東方青衣師看産十七嵗行年在丙辰艮五十月震艮子午日在正東偏南乙在正南偏南庚黃色衣東北首東北方黃衣師看産十八嵗行年在乙卯乾六十二月坎震己亥日在正南偏東丙在正南偏西丁白色衣西北首西北方白衣師看産十九嵗行年在甲寅兊正七月巽離辰戌日在正南偏西丁在正南偏東丙白色衣正西首正西方白衣師看産二十嵗行年在癸丑巽二八月兊坤卯酉日在正西偏南庚在正東偏南乙青色衣東南首東南方黃衣師看産二十一歲行年在壬子坤三九月離巽寅申日在正西偏北辛在正東偏北甲黃色衣西南首西南方黃衣師看産二十二嵗行年在辛亥離四十月坤兊丑未日在正北偏西壬在正北偏東癸赤色衣正南首正南方赤衣師看産二十三嵗行年在庚戌坎五十一月乾艮子午日在正北偏東癸在正北偏西壬黑色衣正北首正北方黑衣師看産二十四嵗行年在己酉震六十二月艮乾己亥日在正東偏北甲在正西偏北辛青色衣正東首正東方青衣師看産二十五嵗行年在戊申艮正七月震坎辰戌日在正東偏南乙在正西偏南庚黃色衣東北首東北方黃衣師看産二十六嵗行年在丁未乾二八月坎震卯酉日在正南偏東丙在正南偏西丁白色衣西北首西北方白衣師看産二十七嵗行年在丙午兊三九月巽離寅申日在正南偏西丁在正南偏東丙白色衣正西首正西方白衣師看産二十八嵗行年在乙巳巽四十月兊坤丑未日在正西偏南庚在正東偏北乙青色衣東南首東南方青衣師看産二十九嵗行年在甲辰坤五十一月離巽子午日在正西偏北辛在正東偏南甲黃色衣西南首西南方黃衣師看産三十嵗行年在癸卯離六十二月坤兊己亥日在正北偏西壬在正北偏東癸赤色衣正南首正南方赤衣師看産三十一嵗行年在壬寅坎正七月乾艮辰戌日在正北偏東癸在正北偏西壬黑色衣正北首正北方黑衣師看産三十二嵗行年在辛丑震二八月艮乾卯酉日在正東偏北甲在正西偏北辛青色衣正東首正東方青衣師看産三十三嵗行年在庚子艮三九月震坎寅申日在正東偏南乙在正西偏南庚黃色衣東北首東北方黃衣師看産三十四嵗行年在己亥乾四十月坎震丑未日在正南偏東丙在正南偏西丁白色衣西北首西北方白衣師看産三十五嵗行年在戊戌兊五十一月巽離子午日在正南偏西丁在正南偏東丙白色衣正西首正西方白衣師看産三十六嵗行年在丁酉巽六十二月兊坤己亥日在正西偏南庚在正東偏南乙青色衣東南首東南方青衣師看産三十七嵗行年在丙申坤正七月離巽辰戌日在正西偏北辛在正東偏東甲黃色衣西南首西南方黃衣師看産三十八嵗行年在乙未離二八月坤兊卯酉日在正北偏西壬在正北偏東癸赤色衣正南首正南方赤衣師看産三十九嵗行年在甲午坎三九月乾艮寅丑日在西北偏東癸在正北偏西壬黑色衣正北首正北方黑衣師看産四十嵗行年在癸巳震四十月艮乾丑未日在正東偏北甲在正西偏北辛青色衣正東首正東方青衣師看産四十一嵗行年在壬辰艮五十一月震坎子午日在正東偏南乙在正西偏南庚黃色衣東北首東北方黃衣師看産四十二嵗行年在辛卯乾六十二月坎震己亥日在正南偏東丙在正南偏西丁白色衣西北首西北方白衣師看産四十三嵗行年在庚寅兊正七月巽離辰戌日在正南偏西丁在正南偏東丙白色衣正西首正西方白衣師看産四十四嵗行年在己丑巽二八月兊坤卯酉日在正西偏南庚在正東偏南乙青色衣東南首東南方青衣師看産四十五嵗行年在戊子坤三九月離巽寅申日在正西偏北辛在正東偏北甲黃色衣西南首西南方黃衣師看産四十六嵗行年在丁亥離四十月坤兊丑未日在正北偏西壬在正北偏東癸赤色衣正南首正南方赤衣師看産四十七嵗行年在丙戌坎五十一月乾艮子午日在正北偏東癸在正北偏西壬黑色衣正北首正北方黑衣師看産四十八嵗行年在乙酉震六十二月艮乾己亥日在正東偏北甲在正西偏北辛青色衣正東首正東方青衣師看産四十九嵗行年在甲申艮正七月震坎辰戌日在正東偏南乙在正西偏南庚黃色衣東北首東北方黃衣師看産坐産時更用後法體玄子借地法第七東借十步西借十步南借十步北借十步上借十步下借十步壁方之中四十餘步安産借地或有穢汚或有東海神王或有西海神王或有南海神王或有北海神王或有日遊將軍白虎大夫逺去十丈軒轅招搖舉高十文天符地軸入地十丈令地空間産婦某氏安居無所妨礙無所畏忌諸神擁護百邪速去急急如律令敕前項借地法於入月一日朱書一本貼産婦房內墻壁上更不須避忌神殺也禁草法第八鋪草及氊褥訖即呪曰鐵鐵湯湯非公所當是王一言得之銅一言得之鐵母子相生俱篾鐵急急如律令禁水法第九欲産時貯水呪曰南無三寶水水在井中為井水水在河中為河水水在器中為淨水水在法中為真水自知非真莫當真水以淨持濁以正治邪日遊月殺五士將軍青龍白虎朱雀玄武招搖天狗軒轅女媧天吞地吞懸尸閉肚六甲禁諱十二神王土符伏神各安所在不得動靜不得忌干若有動靜若有忌干施以神呪當攝汝形阿佉尼阿毗羅莫多梨娑地梨娑訶入月預備藥物第十愚按前所預備內佛手保氣枳殼榆皮黑神大聖蕊石七散神寢保生理中三丸催生黑虎二丹及催生神符又葵子生地黃羌活竹茹烏梅雌雄石燕井草海馬銜鐵大棗陳皮薑錢黑豆白蜜無灰酒童子小便酸醋白米湯瓶鍋銚斷臍線剪之類可謂周恤之至矣內花蕊石散為血入胞衣脹大不能下或惡露上攻不能蘇醒佛手散治血虛之危症加味芎歸湯治交骨不開萆麻子治胎衣不能上下失笑散治惡露腹痛不省人事蠟油調滑石塗入産門為滑胎之藥清魂散治血暈等症平胃散朴硝水銀為腐化死胎之劑八珍湯補血氣虛損已上諸方皆為緊要之藥必不可缺其斷臍帶先用線近臍札緊帛裹咬臍如天氣風寒或難産母子勞傷元氣者先札臍帶以油紙撚燒斷此又為回生起死之要法也故治者當審其宜不可槩信而用之催生靈符第十一靈符宜以水飛硃砂書之貼於房內北壁上至坐蓐之時將符以針劄就盞內化之溫水調服治産難橫生逆産胞衣不下靈符見後出聖惠方局方同謹按前所著方論圖向符訣一帙自夫人泛視之似為迂逺然艱於得子者恆相質問則惟此書為要屢試有明驗也余每觀其護孕之方極為曲當易産之藥悉有根據至於圗向之趨避吉凶所關符訣之玄微神妙顯用其誠有得於諸先哲者乎不然王太僕諸公深於奧理者也豈謬論耶則是書也誠妊娠良方家户之所當珍藏考究者使舍此而施治於妊婦鮮不有誤矣觀者勿以為迂逺云薛氏醫案卷四十
