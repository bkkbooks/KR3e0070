body:
  text: 薛氏醫案卷七十五明薛已訂外科精要中癰疽分表裡證論第二十三伍氏曰癰疽皆因喜怒不測飲食不節隂陽不調臟腑不和腠理不密寒氣客於經絡或榮血受寒則澀而不行衛氣從之與寒相摶壅遏不通或陽氣藴積則生寒熱寒熱不散皆致前症又曰五臟六腑俞穴皆在背凡患瘡症易傷臟膜多致不救腑氣浮行於表故癰腫浮高為易治臟血沉寒主裡故疽腫內陷為難治又曰癤者節也癰者壅也疽者沮也一寸至二寸為癤三寸至五寸為癰五寸至一尺為疽一尺至二尺為竟體疽若脉洪數者難治脉微澀者易治初覺宜清熱拔毒已潰則排膿止痛膿盡則長肌敷痂當酌量輕重形證順逆而審治之愚按前症若飲食少思用六君子湯以補脾胃如不應加薑桂以溫補之使邪氣自退其不起者由邪氣盛正氣虛不能發也於旬日之外見之若已發出用托裏消毒散以壯元氣助令潰腐不應須溫補脾胃其不起者由真氣虛不能潰也於二旬之外見之若已腐潰用托裏散以補氣血生肌肉不應當專補脾胃又不應須溫補脾胃其不起者乃脾氣虛不能收斂也於一月之外而見之凡此治法竊嘗用驗詳具首論察疽發有內外之别第二十四李氏云疽初發一粒如麻豆發熱腫高熱痛色赤此為外發勢雖熾盛治得其法可保其生若初時不發熱體倦怠患處如故數日不腫痛內臟已壞雖有盧扁之藥亦末如之何矣愚按前症有因元氣虛而不能發出者有因敷貼寒藥而不能發出者有因攻伐過傷氣血而不能發出者凡有因熱毒內藴而失疏托者審而治之多有生者附治驗進士申天益臂患癰寒熱頭痛形氣虛弱此手足陽明經風邪之症用桔梗升麻湯二劑外邪頓散用托裏消毒散二劑腫痛頓退乃用補中益氣湯調理形氣漸復而愈秋官錢可容腹患癰焮瘇作痛煩渴飲冷大便不通脉沉數實此熱毒藴於內用清熱消毒散加大黃二錢一劑諸症悉退但形氣頓虛用托裏消毒散去金銀花白芷倍加參茋歸术而安一男子股內患毒欲求內消其脉滑數膿已成矣因氣血虛而不潰遂針之膿出作痛以八珍湯治之漸可但膿水清稀更以十全大補湯加炮附子五分數劑漸愈乃去附子又三十餘劑而愈一童子腋下患癰久不斂膿清脉大怠倦懶食自汗口乾用內補黃茋湯及豆䜴餅兩月而愈凡瘡潰而膿清或瘡口不合或聚腫不潰肌寒肉冷自汗色脫者皆氣血虛極也非大溫補不可一男子肩患毒焮痛飲冷煩躁便祕脉數而實以清凉飲二劑少愈以金銀花散四劑悉退又以十宣散去桂加天花粉金銀花數劑瘡潰而痊此脉與症皆屬有餘也一男子背瘡潰而瘀血不散此陽氣虛弱也用參茋歸术峻補更以桑枝灸又用托裡散加肉桂瘡口自斂此補接陽氣之法也上舍毛體仁素隂虛春初咳嗽胸中隱痛腎脉洪數肺脉數而時不見余曰內當結癰先用六味地黃丸料一劑服之翌早來謂余曰昨得良劑嗽愈六七務求一方到監調理余曰此隂火上炎患癰之症苐因元氣虛弱未能發出因其易忽余辭不能乃别用降火化痰等劑愈甚月餘復請診之脉洪滑而數余曰膿已成矣當請常治者同議針之且免內潰之患仍不决又月餘請視他醫已先開瘡孔偏上兜膿不出仍內潰脉愈洪大余曰脉洪滑而數視其舌青黯內臟已壞無能為矣後果然辨癰疽隂陽淺深緩急治法第二十五曾氏云凡癰疽其脉浮數洪緊腫焮作痛身熱煩渴飲食如常此六腑不和毒發於外而為癰其勢雖急投以涼劑多保全生其脉沉細伏緊初發甚微或無瘡頭身不熱而內躁體重煩疼情緒不樂胸膈痞悶飲食無味此五臟不和毒畜於內而為疽急投五香連翹湯甚者轉毒散神仙截法黃礬丸國老膏防托毒氣免致變症內攻尤宜當頭隔蒜灸若塗毒藥迷其腠理投諸涼藥虛其真氣故其善惡之症在乎醫之工拙耳或氣噫痞塞咳逆身冷自汗目瞪耳聾恍惚驚悸語言顛倒背惡症也五善見三則瘥七惡見四則危五善併至則善無以加七惡併臻則惡之劇矣愚按前症善者乃五臟未傷病微邪淺使能慎起居節飲食勿藥自愈惡者乃五臟虧損之症前篇雖云不治若能補其脾胃固其根本多有可生者豈可以其惡而遂棄之耶附治驗鄰人蘇子遇之內左手指患疔麻癢寒熱惡心左半體皆麻脉數不時見余曰凡瘡不宜不痛不可大痛煩悶者不治今作麻癢尤其惡也用奪命丹二服不應又用解毒之劑麻癢始去乃作痛腫余曰勢雖危所喜作痛但毒氣無從而泄欲針之適值望日其家俱言凥神不從勢愈腫甚余强針之諸症頓退又用解毒之劑其瘡全愈辛丑孟夏余至四明有屠壽卿氏當門齒忽如所擊痛不可忍脉洪大而弦余曰弦洪相摶將發瘡毒也先用清胃散加白芷銀花連翹一劑痛即止至晚鼻上發一瘡面腫黯痛用前藥加犀角一劑腫至兩額口出穢氣脉益洪大惡寒內熱此毒熾血瘀藥力不能敵也乃數砭患處出紫血服犀角解毒之劑翌日腫痛尤甚又砭患處與唇上并刺口內赤脉各出毒血再服前藥至數劑而愈一婦人背患流注內潰脹痛服流氣化痰之劑自汗盜汗脉大而弱此元氣虧損之症也與參茋各一兩歸术各五錢肉桂二錢服而針之至夜半始出稀膿二碗許翌日大汗倦甚煩熱作渴揚手氣促脉洪大而數仍用前藥加附子一錢炙甘草二錢二劑脉症悉退又以六君加薑桂二十餘劑始離床褥後因勞復寒熱作渴汗出時仲冬寢幃氣出如霧用十全大補加桂附二劑而痊中翰鄭朝用疽潰發熱吐痰飲食無味肌肉不生瘡出鮮血余曰此脾氣虧損不能攝血歸源也法當補脾彼不信用消毒涼血之劑加惡寒嘔吐始悟余言用六君加炮薑半夏茯苓數劑諸症悉退又用十全大補瘡口漸斂後因飲食稍多泄㵼成痢此脾胃虛寒下陷用補中益氣送四神丸而痢止繼以六君子湯而瘡愈一婦人癸卯冬失物發怒缺盆內微腫甲辰春大如覆碗左肩脾亦腫肉色如故或針出鮮血三碗許腹痛如錐泄㵼不止四肢逆冷嘔吐惡寒或時發熱絶食已七日矣其脉洪大時或微細此陽氣脫陷也用六君加炮薑三錢附子二錢早服至午不應再劑加附子五錢熟睡覺來諸症頓退六七少進稀粥再四劑諸症悉退飲食如故缺盆始痛針出清膿二碗許諸症復至此虛極也以十全大補加薑桂附各一錢三劑而安後減乾薑桂附各五分與歸脾湯兼服五十餘劑而愈一男子背瘡漫腫微痛食少體倦余曰症屬形病俱虛法當補元氣為主彼不信乃用攻毒之劑中央肉黯五寸許惡症悉具復求治余曰此胃氣虛寒而變症作矣當急溫補脾胃則惡症自退黯肉自生仍不信乃割死肉祛惡症遂致不起毛礪菴側室肚患癰月餘矣色黯不腫內痛作嘔飲食不入四肢逆冷其脉或脫絶或浮大雜用定痛敗毒之劑余曰此氣血俱虛而作痛內决無膿不治之症也强用大溫補之藥二劑痛止色赤飲食少進余謂但可延日而已人皆以為有膿復强針之又用大補之劑始出清膿少許衆仍以為毒結於內用攻膿保其必生殊不知乃速其死耳惜哉論善惡形症第二十六問曰五善七惡可得聞乎曰飲食如常一善也實熱而大小便澀二善也內外病相應三善也肌肉好惡分明四善也用藥如所料五善也渴發而喘眼角向鼻大小便反滑一惡也氣綿綿而脉濡與病相反二惡也目不了了睛明內陷三惡也未潰肉黑而陷四惡也已潰青黑腐筋骨黑五惡也發痰六惡也嘔吐七惡也愚按善惡形症治法見附録論生死形症第二十七問曰病有甚而至生有微而至死病症難辨死生何從决乎答曰發背潰透內膜者死此言肝俞已上未潰內陷面青唇黑便汚者死此言臟壞便瘀血潰喉者不治隂患入腹者不治入囊者不治鬢深數寸者不治在頤後一寸三分名鋭毒亦不治無此者生流注雖多療之必愈愚按前症有因元氣虛弱而毒氣內陷者有因初作失於內疏托裡和榮衛者有因毒盛失於消解者有因虛弱失於補托者有因膿成失於針刺者有因腐潰失於補養者若發背腦疽屬濕熱上壅者黃連消毒散補中益氣湯以除濕毒補脾肺滋腎水若鬢疽鋭毒屬風熱者柴胡山梔散以清肝火養肝血若隂虛用六味地黃丸以生腎水滋化源若患於小腹補足三隂之血養脾胃之氣庶可保其生也其流注之症或因飲食勞倦房室隂虛或七情內動六淫外侵以致血虛互相凝滯或産後血瘀隨虛流注或結塊或漫腫宜用益氣養榮湯以固元氣佐以葱尉解散凝滯更以豆豉餅祛散寒邪潰久內有瘀肉用針頭散腐之多有生者設若不守禁調攝多致不起慎之形症逆順務在先明第二十八論曰癰疽潰後形有逆有順白睛黑小一惡也不能下食納藥而嘔食不知味二惡也傷痛渴甚三惡也體項不便四肢沉重四惡也聲嘶色脫唇鼻青黑面目浮腫五惡也煩躁時嗽腹痛渴甚瀉利無度小便如淋六惡也膿血大泄腫痛尤甚膿色敗臭七惡也喘粗氣短恍惚嗜卧八惡也未潰黑陷面青唇黑便汚九惡也氣噎痞塞咳嗽身冷自汗無時目瞪耳聾恍惚驚悸語言顛倒十惡也又腦為諸陽所㑹頸項近咽喉腎俞皆致命之所俱不可灼艾愚按前症未潰黑陷面青唇黯便汚者臟腑內潰之惡症也氣噎痞塞咳嗽身冷自汗者脾肺虛敗之惡症也不食便㵼腸鳴耳聾目瞪者脾腎虛敗傳變之惡症也治法詳見附録審內症用藥附自㵼嘔吐不進飲食腎脉最虛如是之疾古人皆以為不治然亦有救療之理焉耳愚按前論發內經之微㫖開萬世之聾瞶其惠博矣此症實命門火衰不能生脾土而虛寒以致自瀉嘔吐或胸膈不利或食而不化或大便不實宜用八味丸及六君子加薑附若因房勞過度真陽衰敗或原禀不足不能生脾土而飲食不進者用補中益氣加附子薑桂并東垣補真丸多有得生者若用參苓之類直補脾胃鮮有不誤若或以為毒氣內攻而治者俱致不起附治驗通府李廷儀患流注唾痰氣促自恃知醫用化痰理氣等劑半載而潰用托裡等劑膿水淋漓腫硬不消寒熱往來飲食少思肌肉消瘦大便不實手足時冷兩尺脉浮大按之微細余曰此屬命門火衰當用八味丸不信乃服參茋歸术之類更加痰喘泄瀉服八味丸益氣湯年餘而痊御醫王介之室背疽不起發不焮赤泄㵼欲嘔飲食少思手足厥冷脉息如無此陽氣虛寒用大補之劑加附子二錢薑桂各一錢不應附子加至三錢二劑泄㵼愈甚又以附子一枚薑桂各三錢參茋歸术各五錢作一劑腹內始熱嘔吐始止手足始溫脉息始復仍用大補加薑附四劑乃潰三十劑得愈六年後仍殁虛寒之症大尹陳國信素隂虛背患疽用參茋大補而不斂內熱發熱舌燥唇裂小便頻數口乾飲湯嘔吐㵼利耳閉目盲仰首眩暈脉浮大而數余曰瘡口不斂脾土敗也舌燥唇裂腎水枯也小便頻數肺氣衰也內熱發熱虛火上炎也口乾飲湯真寒之象也嘔吐㵼利真火衰敗也耳閉目盲肝木枯敗也仰首眩暈腎氣絶也辭不治後果殁一男子患癰腫硬不潰脉弱時嘔彼欲用敗毒等藥余謂腫硬不潰乃陽氣虛弱嘔吐少食乃胃氣虛寒法當溫補脾胃大抵腫赤痛甚煩躁脉實而嘔為有餘當下之腫硬不潰脉弱而嘔為不足當補之若痛傷胃氣或感寒邪穢氣而嘔者雖腫瘍猶當助胃壯氣彼不信仍服攻伐之藥而果殁發背治貴在早論第二十九伍氏曰夫癰發背者皮薄腫高多有椒眼數十粒疽發背者皮膚頑硬狀如牛頸之皮二症皆宜灼艾癰成膿則宜針其針當以馬銜鐵為之形如薤葉樣兩面皆利可以橫直裂開五六寸許取去毒血其病頓輕須先灸而後裂可服神仙追毒丸利去毒根次服排膿托裡等藥調治疽成膿則宜烙用銀箆大寸許長六寸燒赤頻烙患處以膿出為效大抵癰疽難於諸科非心傳契妙其可以易治耶愚按前症若氣血充實其膿既成宜速針之勿藥可愈若氣血虧損膿不能出或膿出反痛須托裡養胃庶保終吉詳見第四十瘡出未辨用津潤墨圍論第三十伍氏曰但覺背兩脾間赤癢腫痛或有白粒且以津唾時潤令濕切勿抓破大抵在背微有赤腫㸃或因跋涉入浴犯水或因飲酒膾炙而作初未辨症且以津潤時用墨圍之若腫赤急就圍中灼艾最善人皆疑以火熱太過多致延漫誤者衆矣愚按疽發背胛若有瘀肉腐爛膿水淋漓腫痛仍作者此處有筋一層間隔內膿不出故也宜用針引之老弱者若待其自潰多致不救治者審之附治驗水部曹文兆背胛患之半月餘瘡頭如粟且多內痛如刺其脉歇止此元氣虛而疽蓄於內非灸不可遂灼二三十餘壯飲以六君加藿香歸數劑瘡勢漸起內痛頓去胃脉漸至但瘡色紫瘀肉不潰此陽氣虛也燃桑枝炙患處以解散其毒補接陽氣仍以前藥加參茋歸桂色赤膿稠瘀肉漸腐兩月而愈夫邪氣沉伏真氣怯弱不能起發須灸而兼大補若投以常藥待其自潰鮮有不誤者上舍陳履學之內先從左肩下一㸃寒三日後右肩下發一白腫如甌中紅如酒盞自用消解涼藥一劑不散次投十宣散四劑加痛略紅次連投參茋丁桂防芷之劑膿潰後惡心嘔吐頭暈不止厥逆寒戰鼓牙虛汗頂平膿清此投解散涼劑之誤急洗去圍藥投以參茋歸术地黃薑附大劑一服原從左肩下舊寒一㸃先熱起又進一服遍腫浮熱腫高膿稠兼絍烏金膏數日出腐筋如脂膜大小數片日進前藥二服參茋投至八錢踰兩月始安愈後時以勞厥即投參茋歸术薑附大劑乃蘇看色灼艾防蔓論第三十一伍氏曰瘡腫色赤按之色不變者此膿已成矣按之隨手赤色者其亦有膿也按之白者良久方赤此遊毒已息可就赤白盡處灸斷赤腫自消凡癰疽以手按之若牢䩕未有膿也若半軟半䩕已有膿也又按腫上不熱者為無膿熱甚者為有膿宜急破之愚按瘡瘍毒氣已結而不發者法當補其血氣使膿速成而針之其膿既潰宜培養脾胃以生肌斂口大凡瘡瘍膿血既潰當大補血氣為先惟有他症當以末治附治驗二守施希祿項患毒膿已成因畏針焮延至胸色赤如霞其脉滑數飲食不進月餘不寐肢體甚倦此氣血虛而不能潰也余針之膿出即睡覺而思食用托裡藥兩月而愈州守胡廷器膿熟不潰倦怠發熱余為針之膿遂湧出已而發熱惡寒大渴不止此虛之極也服人黃茋湯二劑熱愈甚又二劑始應再以當歸補血湯數劑漸痊一老人腿患癰膿自潰忽發昏瞀脉細而微此氣血虛極也以大補之劑而蘇一弱人流注內潰出敗膿五六碗是時口眼歪斜以獨參湯加附子二錢二劑少愈更以十全大補之劑月餘而痊大抵瘡瘍膿血既泄當大補氣血為先雖有他症當以末治之論瘡口冷澀難合第三十二治癰久不合其肉白而膿少者此氣血俱虛不能潮運而瘡口冷澀也每日用艾葉一把煎湯避風熱洗及燒松香烟薰之更以神異膏貼之必須守禁調理否則不效愚案前症果因寒邪凝滯氣血不能榮衛宜用斯法祛散寒邪補接陽氣其功甚大若因氣血虛弱不能潮㑹瘡口必用補脾胃生氣血為善丹溪先生云諸經惟少陽厥隂之生癰疽宜預防之以其多氣少血也血少而肌肉難長瘡久未合必成敗症苟反用驅利毒藥以伐其隂分之血楇不旋踵矣附治驗地官李孟卿環跳穴患疽內服外敷皆敗毒寒劑因痛極刺之膿瘀大泄瘡口開張其色紫黯右關脉浮大此胃氣復傷不能榮於患處也余以豆豉餅六君子加藿香砂仁炮薑數劑由是胃氣醒而飲食漸進患處暖而肌肉漸生再以十全大補湯而愈大尹都承慶患附骨疽內痛如錐外色不變勢不可消喜其未用寒劑祇因痛傷胃氣而不思飲食用六君子湯治之飲食少進更以十全大補三十餘劑而膿成針去仍以大補湯倍用參茋歸术加麥門五味逺志貝母數服膿漸止而瘡亦愈按二症蓋因濕熱滯於肉理真氣不能運化其始治宜實脾土和氣血隔蒜灸而疽自消矣治背疽糝藥方李氏云龍遊有患背疽者大潰五臟僅隔膜耳自謂必死用鯽魚去腸實以羯羊糞烘焦為末乾糝之瘡口自收此出洪氏方屢用有效故附於此須候膿少欲生肌肉時用之附治驗黃汝耘患發背用生肌藥益潰大便泄㵼其脉微緩余謂脾胃虛先用二神丸以止其㵼次用大補藥以固其本更用猪蹄湯洗患處用黃茋末以塗其外喜其初起曾用艾灸毒不內攻兩月而愈許鴻臚發背十餘日腫硬木悶肉色不變脉沉而實此毒在內先以黃連內疏湯更以消毒托裡散其毒始發奈欲速愈急用生肌藥患處如負石身如火焮遂致不起用藥溫涼須防祕泄論第三十三伍氏曰凡瘡家皆宜宣去其毒蕩滌陳莝宜用神仙追毒丸六味車螯散五香連翹湯千金漏蘆湯更當詳辨稟賦强弱臨時加減大抵治瘡要法須臟腑堅而不祕通而不泄則真氣不耗邪無所留如祕結神效麻仁丸凡瘡潰後尚覺虛熱可與五香湯加大黃朴硝且如治瘡溫藥先用桂以通血脉宣導百藥冷藥必用地黃補不足益氣填膸近用乳香散乳香消毒菉豆清熱真良藥也愚按大腸祕結果因血燥胃氣不虛最宜前藥若因精血枯涸用八珍桃仁麻仁其潰後發熱若因氣虛用四君黃茋當歸血虛用四物白术茯苓氣血俱虛用八珍黃茋若大便祕小便赤用四物麥門五味如不應急用加減八味丸或六味丸若下後元氣傷而發熱用六君當歸胃氣虛闕用補中益氣湯大凡二便肝腎主之經云腎闕液開竅於二隂若津液滋潤大便通利若津液不足必因脾氣虧損當培養化源附治驗儒者顧大有年幾六旬仲冬背疽初起入房患處黑死五寸許黯暈尺餘漫腫堅硬背如負石發熱作渴小便頻數兩耳重聽揚手露體神思昏憒脉沉而細右手為甚便祕草七日計進飲食百餘碗腹內如常衆欲通之余曰所喜者此耳急用大劑六君加薑附肉桂三劑瘡始焮痛自後空心用前藥午後以六味丸料加參茋歸术五劑復用活命飲二劑針出黑血甚多瘀膿少許背即輕軟仍用前藥便亦通利余他往四日神思復昏瘡仍黑陷膿水淋漓飲食不進急以參茋歸术各一兩炮附子五錢薑桂各三錢服之即索飲食并鴨子二枚自後日進前藥二劑肉腐膿潰而愈錦衣傅允承母年踰七十腰生一㿔作癢異常脉浮數而反惡寒余曰此瘡疽之症也未潰而先弱何以收斂况大便不通則真氣已竭治之無功其子懇請不得已用六君加藿香神麯數劑飲食漸進大便始通更用峻補之劑潰而膿清作渴再用參茋當歸麥門五味熟地而渴止允承喜曰吾母可無虞矣余曰尚難收斂先日之言也彼疑遂延他醫卒致不起生白痂切護勿觸論第三十四伍氏曰癰潰之後敗肉漸去新肉漸生日見堆阜方成白膜新肉當滋養平復無虞大凡瘡口未可速合日用猪蹄湯洗去惡濁外敷生肌膏神異膏毒膿出盡可用聖效散以合瘡口更慎起居節飲食戒七情否則虛症蜂起多致不救慎之愚按前症敗肉去而新肉生者須先微赤四沿漸生白膜者此胃中生氣也用四君子湯以培補之若赤甚者血虛而有火也用四物加參茋白术以調補之若赤而不生膜者氣虛也用四君加當歸黃茋若色白而無神者氣血俱虛也用十全大補加薑桂如不應急加附子大凡瘡疽潰後敗肉漸去新肉漸生此乃脾胃之氣充實也若惡濁已去宜用當歸膏體察愛護論第三十五伍氏曰癰疽一症病人當自體察凡初作先以墨圍患處却視浮沉聚散膿出視其多少肉生視其闊狹飲食視其美惡臟腑防其祕泄瘡口防其奢裂宜戒怒節勞調補元氣保愛體察慎不可忽愚按前論即丹溪先生所云癰疽當先助胃壯氣使根本堅固東垣先生教人以飲食有節起居有時素問反覆言之可不慎哉大凡泄㵼易損元氣腫瘍犯之不能成膿潰瘍犯之不能生肌患者審之附治驗太守朱陽山之內年五十二四月四日當背心生疽如粟三日漸大根盤五寸許不腫痛不寒熱脉微而沉余曰實則痛虛則癢不發不治潰而不斂亦不治乃與大補陽氣之劑色白而黯瘡勢如故神疲食減小便淋澀乃與大補氣血加薑桂二劑瘡仍不起十五日涉怒嘔㵼並作復與大補藥一劑瘡仍不起留前藥二劑昏憒不服或勸之省悟依方連進七劑十六日瘡起而潰色紅而淡十九日與大補二十餘劑後因勞自汗口乾舌强太陽髮際腦頂俱脹此血氣俱虛肝膽火上炎用補中益氣加山梔芍藥頓愈但內熱少睡手足發熱不時霍熱用逍遙散加山梔熱退復用歸脾湯瘡亦愈計瘡發及斂凡四十二日未嘗一日用攻瘡之藥江隂舉人陳鳴岐寓京患背疽用大補之劑而愈翌日欲回先期設席作謝對談如常是晚得家信大拂其意惱怒發熱作渴食梨子少許至夜連㵼數次早促余視脉已脫矣竟至不起夫梨者利也疏利下行之物凡脾胃虛寒産婦金瘡者皆當忌之用香藥調治論第三十六伍氏曰氣血聞香則行聞臭則逆大抵瘡瘍多因營氣不從逆於肉理鬱聚為膿得香味則氣血流行故當多服五香連翹湯萬金散金粉散凡瘡本腥穢又聞臭觸則愈甚若毒入胃則咳逆古人用之可謂有理且如飲食調令香美以益脾土養其真元可保無虞矣愚按前症說見第十八十九飲食居處戒忌第三十七李氏云病疽之人當戒酒麵炙􅏼醃臘法酒生冷油膩雞鵝魚腥之類起居七情尤當深戒卧室潔淨馨香使氣血流暢仍忌僧道孝子産婦經婦雞犬猫畜若背疽難於隱几宜用菉豆十斗作一袋隱伏其上解毒涼心也愚論前論慎起居薄滋味恐病者好動四體甘嗜性熱性寒之物使火益熾而胃氣益衰則所患淹滯不愈又誰咎哉不若預為之防當以古人之言為戒如菉豆性寒主丹毒煩熱風疹或金石所發實熱煩渴飲食如常症屬純陽者宜用否則不可用也論醫者更易良方第三十八李氏云嘗見世間醫者每有妙方祕而不傳或更改以惑人誠可惡也余思西華麥飯石膏守死不傳其立心私刻君子責之矣昔趙公宣教字季修來宰龍泉兼程而進患鼻䘐日出數升時家兄教以服藕汁地黃膏趙叩諸醫云此為戒服之劑乃數易醫無效家兄隂餽前汁服三日而疾愈兄曰此即前所獻之方趙驚嘆曰向非醫者譎計以惑我早信此方豈久受此困耶今以屢試屢驗不可易者如因熱毒衝心而嘔用內托散一名萬全散因脾胃虛弱而嘔嘉木散熱毒腫痛麥飯石膏隂虛作渴加減八味丸此四方屢為醫人眩惑使人勿用深憫患者之受苦故舉趙公之事以例之愚竊以為方者倣也倣病因以立方非謂內經無方也若執古方以治今疾猶拆舊宇以對新宇其長短大小豈有舍匠氏之手而能合者乎設或有合以為亘古不易之方此又先王普濟之神術奚必祕而私之耶余嘗觀太無先生治滇南一僧逺遊江浙思親成疾先生惠之以飲食藥餌復贈金一鎰以資其歸此固我醫道之當然也今之醫者或泥古或吝祕或嗜利以惑人其得罪於名教多矣神仙追毒丸一名聖後丹一名玉樞丹又名解毒丹又名萬病丸又名紫金錠治症見後文蛤即五倍捶破洗焙末三兩山茨菰去皮淨末二兩麝香三錢另研千金子一名續隨子去殼研去油取霜一兩紅牙大㦸去蘆焙乾末一兩半右用糯米煮濃飲為丸分為四十粒每服一粒用井花水或薄荷湯磨服利一二次用粥止之合時用端午七夕重陽或天德月德日須淨室焚香修置效驗不可盡述凡人出入不可無此藥兩廣山谷間有草曰胡蔓又曰斷腸亦有感蛇毒致生惡菌名為定年藥有淫婦與北人交好者别時隂以藥置飲食中仍戒之曰子必某時來若依期而至彼復以藥解之若過期不往必死故謂之定年藥如服前藥一粒其病即瘥昔有一女久病勞瘵為尸蟲所噬磨服一粒吐下小蟲甚衆更服蘇合香丸遂愈如菌菌菰子砒石毒藥死牛馬河魨魚及時行瘟疫山嵐瘴氣喉閉喉風自縊溺水撲死但心頭微溫未隔宿者生薑蜜水磨灌一粒即蘇癰疽惡瘡湯火蛇蟲犬獸所傷東流水磨塗并服顛邪鬼氣鬼胎暖酒磨服無不效者愚意此藥果能有積毒中毒毒蟲纏滯深固誠有神效若病自內出者尤當審其虛實而用之轉毒散治一切癰疽利去毒根以免傳變之症車螯紫背光厚者以鹽泥固濟煅赤淨末一兩輕粉五分甘草一分右每服四錢括蔞一枚杵細煎酒五更初調服下惡物為度未應再服功在五香連翹之上緩用五香連翹湯急用神仙截法愚按前二方果積毒於內元氣不虛宜用仍當審之孫真人單煮大黃湯宣熱拔毒治大便祕結熱毒蓄於內錦紋大黃酒浸去皮右水煎服此快利要法也愚按前方寒涼祛毒之劑仍審元氣虛實症屬內外而用之附治驗僉憲申天益兄背患疽脉沉而實腫硬木悶大便祕結此毒蓄於內用大黃白芷名萬全散一服去瘀血瘡頓消鄺進士患癰將痊大便祕結服大黃等藥反廢飲食余用補氣血之劑加桃仁麻仁未效更以猪膽汁深納榖道續以養血氣而愈神仙截法治癰疽發背一切惡瘡預服則毒氣不入內真麻油一斤銀石器內煎熬十數沸候冷右用酒兩碗入油五盞通口熱服一日用盡緩則數日服之吳安世云吾家三世用之無有不驗又聞獵者云凡中藥箭急飲麻油藥毒即消鄭學諭德甫屢用之甚驗愚按麻油下三焦熱毒通大小腸滯氣若瘡瘍初起毒蓄於內大便祕結者用之以疏通其毒誠為良法大便不實三焦虛熱恐非所宜用者審之祕傳連翹湯連翹升麻朴硝各一兩𤣥參芍藥白蘞防風射干各八分大黃一兩二錢甘草炙五錢杏仁八十箇去皮尖同麵炒黃另研右每服四錢水煎服下惡物後服內托散之類漏蘆湯治癰疽發背丹疹時行熱毒赤腫焮痛漏蘆白芨黃芩麻黃去節白薇枳殼麩皮炒升麻芍藥粉草炙各二兩大黃蒸三兩右每服四錢水煎服以利為度若實熱而便祕倍加之千金漏蘆湯漏蘆黃芩白蘞連翹枳殼去穰麩炒升麻粉草麻黃去節大黃濕紙包煨朴硝各一兩右每服五錢薑水煎去查空心服下惡物為妙愚按三方發表攻裡行氣解毒之劑想當時因有是症而用是藥也六味車螯散車螯四箇黃泥固濟火煅燈心三十莖甘草節二錢瓜蔞一箇杵右用酒二盞煎八分入蜜一匙車螯二錢膩粉少許空心服下惡血為妙愚按前方瘡瘍積毒於內大便祕結元氣充實者宜用止痛靈寶散鬼繫腰生於隂濕竹籬石岸絡石而生者其藤柔細兩葉相對形生三角用藤葉一兩洗淨晒乾皂角刺一兩銼新瓦上炒黃瓜蔞大者一箇杵炒用仁甘草節五分沒藥明乳香各三錢叧研右每服一兩水酒各半煎愚按前方治腫瘍毒氣凝聚作痛之藥潰後慎之鬼繫腰即薛蘿也又名絡石神效麻仁丸火麻仁研細大黃煨三兩人參二錢訶子煨肉一兩右為末入麻仁煉蜜丸桐子大每服三十丸滚水下愚按前方潤大腸結燥之藥血液枯涸者不可用雖有人參訶子亦難倚仗清心內固金粉散一名金花散辰砂另研白茯苓人參甘草各三錢菉豆四兩雄黃一錢朴硝另研豆䓻仁各五錢腦子麝香另研各一錢右為末每服一錢半蜜湯調愚按前方若熱焮腫痛飲食如常者乃可用之猪蹄湯治一切潰瘍消熱毒去惡肉解穢惡甚效白芷甘草羌活露蜂房有蜂兒者赤芍藥當歸各等分右先將猪蹄一隻以水五碗煮取清湯入前藥三五兩煎數沸去查洗患處洗藥神效散蛇床子二兩朴硝一兩右每用五錢水二碗煎數沸洗淨拭乾糝後散聖效散黃柏炒黑川山甲炒黃一兩檳榔木香雞內金二枚右為末每用少許搽瘡口內日五七次方效愚按前方若毒氣已盡宜用之否則反益其邪用當歸膏為善神祕陷脉散黃茋人參川芎當歸酒洗赤芍藥粉草地骨皮五加皮忍冬葉橘紅各一兩乳香沒藥各五錢右每服五七錢水酒各半煎連進五七服甚效愚按前方乃托裡消毒行氣破血之劑也若曰補益之功實少焉騎竹馬灸法圖內托散五香連翹湯沉麝湯五香湯漏蘆湯柞木飲阿膠飲牛膠飲黃礬丸國老膏萬金散逺志酒已上方見上卷薛氏醫案卷七十五
