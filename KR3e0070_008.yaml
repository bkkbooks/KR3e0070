body:
  text: 薛氏醫案卷八眀薛巳撰原機啓微君臣佐使逆從反正説君為主臣為輔佐為助使為用置方之原也逆則攻從則順反則異正則宜治病之法也必熱必寒必散必收者君之主也不宣不眀不授不行者臣之輔也能受能令能合能力者佐之助也或擊或發或刼或開者使之用也破寒必熱逐熱必寒去燥必濡除濕必泄者逆則攻也治驚須平治損須温治留須收治堅須潰者從則順也熱病用寒藥而導寒攻熱者必熱陽眀病發熱大便鞭者大承氣湯酒制大黄熱服之類也寒病用熱藥而道熱去寒者必寒少隂病下利服附子乾薑不止者白通湯加人尿猪膽之類也塞病用通藥而導通除塞者必寒腦滿煩驚小便不利者柴胡加龍骨牡礪湯之類也通藥用塞藥而導塞止通者必通太陽中風下利心下痞鞭者十棗湯之類也反則異也治逺以大治近以小治主以緩治客以急正則宜也至真要論曰辛甘發散為陽酸苦涌泄為隂鹹味涌泄為隂淡味滲泄為陽六者或收或㪚或緩或急或燥或濕或耎或堅所以利而行之調其氣使其平故味之薄者為隂中之陽味薄則通酸苦鹹平是也氣之厚者為陽中之陽氣厚則熱辛甘濕熱是也氣之薄者為陽中之隂氣薄則發泄辛甘淡平寒凉是也味之厚者為隂中之隂味厚則泄酸苦鹹寒是也易曰同聲相應同氣相求水流濕火就燥雲從龍風從虎聖人作而萬物覩本乎天者親上夲乎地者親下則各從其類也故置方治病如後芍藥清肝散方治眵多燥𦂳澁羞眀赤脉貫睛臓腑秘結者白术三分川芎三分防風三分甘草炙二分半荆芥二分半桔梗三分羌活三分芍藥二分半柴胡二分前胡二分半薄荷二分半黄芩二分半山梔二分知母二分滑石三分石膏三分大黄四分芒硝三分半共十八味通㕮咀都作一服水二鍾煎至一鍾食後熱服右為方治淫熱反尅而作也風熱不制之病熱甚大便鞭者從權用之盖苦寒之藥也苦寒敗胃故先以白术之甘温甘草之甘平主胃氣為君次以川芎防風荆芥桔梗羌活之辛温升散清利為臣又以芍藥前胡柴胡之微苦薄荷黄芩山梔之微苦寒且導且攻為佐終以知母滑石石膏之苦寒大黄芒硝之大苦寒祛逐淫熱為使大便不鞭者減大黄芒硝此逆則攻之治法也大熱服者反治也通氣利中丸治證上同白术一两白芷半两羌活半两黄芩一两半滑石取末另入一两半大黄二两半牽牛取末一两半除滑石牽牛另研極細末外餘合為細末入上藥和匀滴水為丸如桐子大每服三十丸加至百丸食後臨睡茶湯送下右方以白术苦甘温除胃中熱為君白芷辛温解利羌活苦甘平微温通利諸節為臣黄芩微苦寒療熱滋化滑石甘寒滑利小便以分清濁為佐大黄苦寒通大便㵼諸實熱牽牛苦寒一説味辛利大便除風毒為使逆攻之法也風熱不制之病熱甚而大便鞭者亦可兼用然牽牛有毒非神農藥今與大黄並用者取其性猛烈而快也大抵不宜乆用乆用傷元氣盖從權之藥也量虛實加減黄連天花粉丸治同前黄連一两天花粉四两菊花一两川芎一两薄荷一两連翹二两黄芩四两梔子四两黄蘖六两為細末滴水為丸如梧桐子大毎服五十丸加至百丸食後臨睡茶湯下右方為淫熱反尅臓腑不秘結者作也風熱不制之病稍熱者亦可服以黄連天花粉之苦寒為君菊花之苦甘平為臣川芎之辛温薄荷之辛苦為佐連翹黄芩之苦微寒黄蘖梔子之苦寒為使合之則除熱清利治目赤腫痛黄連盧甘石散治眼眶破爛畏日羞眀餘治上同盧甘石一觔黄連一两龍腦量入先以盧甘石置巨火中煆通紅為度另以黄連用水一碗磁器盛貯納黄連扵水内却以通紅盧甘石淬七次就以所貯磁器置日中晒乾然後同黄連研為細末欲用時以一二兩再研極細旋量入龍腦每用少許井花水調如􅀈糊臨睡以筯頭蘸付破爛處不破爛者㸃眼内眥鋭眥尤佳不宜使入眼内右方以盧甘石收濕除爛為君黄連苦寒為佐龍腦去熱毒為使諸目病者俱可用病宜者治病不宜者無害也竒經客邪之病量加朴硝泡湯滴眼瘀肉黄赤脂上龍腦黄連膏治目中赤脉如火溜熱炙人餘治上同黄連半觔龍腦一錢先剉黄連令碎以水三大碗貯磁器内入黄連扵中用文武火慢熬成大半碗濾去滓入薄磁碗内重湯頓成膏半􅊦許龍腦以一錢為率用則旋量入之以筯頭㸃入眼内不拘時右方以黄連治目痛解諸毒為君龍腦去熱毒為臣乃君臣藥也諸目痛者俱宜用㽔仁春雪膏治紅赤羞眀眊矂癢痛沙澁㽔仁去油四錢龍腦五分先以㽔仁研細入龍腦和匀用生好真蜜一錢二分再研調匀毎用筯頭㸃内眥鋭眥右方以龍腦除熱毒為君生蜜解毒和百藥為臣㽔仁去暴熱治目痛為使此藥與黄連盧甘石散龍腦黄連膏子並用㗜鼻碧雲散治腫脹紅赤昏暗羞眀癮澁疼痛風癢鼻塞頭痛腦酸外翳攀睛眵淚􅀈粘鵞不食草二錢青黛川芎各一錢為細末先噙水滿口毎用如米許㗜入鼻内以淚出為度不拘時候右方以鵞不食草解毒為君青黛去熱為佐川芎大辛除邪破留為使升透之藥也大抵如開鍋盖法常欲使邪毒不閉令有出路然力少而鋭㗜之隨効宜常㗜以聚其力諸目病俱可用羌活勝風湯治眵多眊矂緊澁羞眀赤脉貫睛頭痛鼻塞腫脹涕淚腦巔沉重眉骨酸疼外翳如雲霧絲縷秤星螺盖白术五分枳殻羌活川芎白芷獨活防風前胡桔梗薄荷各四分荆芥甘草各三分柴胡七分黄芩五分作一服水二盞煎一盞去滓熱服右方為風熱不制而作也夫竅不利者皆脾胃不足之證故先以白术枳殻調治胃氣為君羌活川芎白芷獨活防風前胡諸治風藥皆主升發為臣桔梗除寒熱薄荷荆芥清利上焦甘草和百藥為佐柴胡解熱行少陽厥隂經黄芩療上熱主目中赤腫為使又治傷寒愈後之病熱服者熱性炎上令在上散不令流下也生翳者隨翳所見經絡加藥翳凡自内眥而出者加蔓荆子治太陽經加蒼术去小腸膀胱之濕内眥者手太陽足太陽之屬也自鋭眥而入客主人斜下者皆龍膽草為膽草味苦與膽味合小加人參益三焦之氣加藁夲乃太陽經風藥鋭眥客主人者足少陽手少陽手太陽之屬也凡自目系而下者倍加柴胡行肝氣加黄連㵼心火目系者足厥隂手少隂之屬也自抵過而上者加木通導小腸中熱五味子酸以收斂抵過者手太陽之屬也杏仁龍膽草泡散治風上攻眊矂赤癢龍膽草當歸尾黄連滑石另研取末杏仁去皮尖赤芍藥各一錢以白沸湯泡頓蘸洗冷熱任意不拘時候右方以龍膽草黄連苦寒去熱毒為君當歸尾行血杏仁潤燥為佐滑石甘寒泄氣赤芍藥苦酸除癢為使惟風癢者可用柴胡復生湯治紅赤羞眀淚多眵少腦巔沉重睛珠痛應太陽眼睫無力常欲垂閉不敢乆視乆視則酸疼翳陷下所陷者或圓或方或長或短如縷如錐如鑿藁夲三分半川芎三分半白芍藥四分蔓荆子三分半羌活三分半獨活三分半白芷三分半柴胡六分炙草四分薄荷四分桔梗四分五味子二十粒蒼术茯苓黄芩各五分作一服水二盞煎至一盞去滓食後熱服右方以藁夲蔓荆子為君升發陽氣也川芎白芍藥羌活獨活白芷柴胡為臣和血補血療風行厥隂經也甘草五味子為佐為恊諸藥斂蔵氣也薄荷桔梗蒼术茯苓黄芩為使為清利除熱去濕分上下實脾胃二土療目中赤腫也此病起自七情五賊勞役饑飽故使生意下陷不能上升今主以羣隊升發輔以和血補血導入夲經助以相恊收斂用以清利除熱實脾胃如此為治理可推也睛珠痛甚者當歸養榮湯主之當歸養榮湯治睛珠痛甚不可忍餘治並仝上防風七分半白芷七分半白芍藥一錢熟地黄一錢當歸一錢川芎一錢羌活七分半作一服水二盞煎至一盞去滓食後熱服右方以七情五賊勞役饑飽重傷脾胃脾胃者多血多氣之所脾胃受傷則血亦病血養睛睛珠屬腎今生意已不升發又復血虛不能養睛故睛痛甚不可忍以防風升發生意白芷解利引入胃經為君白芍藥止痛益氣通血承接上下為臣熟地黄補腎水真隂為佐當歸川芎行血補血羌活除風引入少隂經為使血為邪勝睛珠痛者及亡血過多之病俱宜服也服此藥後睛痛雖除眼睫無力常欲垂閉不減者助陽活血湯主之助陽活血湯治眼睫無力常欲垂閉餘治仝上黄耆五分炙草五分當歸五分白芷四分蔓荆子四分防風五分升麻七分柴胡七分作一服水二盞煎至一盞去查稍熱服右方以黄耆治虛勞甘草補元氣為君當歸和血補血為臣白芷蔓荆子防風主療風升陽氣為佐升麻導入足陽眀足太隂脾胃柴胡引至足厥隂肝經為使心火乘金水衰反制者亦宜服也有熱者兼服黄連羊肝丸黄連羊肝丸治目中赤脉紅甚眵多餘治仝上黄連白羯羊肝一箇先以黄連研為細末將羊肝以竹刀刮下如糊除去筋膜入擂盆中研細入黄連末為丸如梧桐子大毎服三五十丸加至七八十丸茶清湯下右方以黄連除熱毒眀目為君以羊肝肝與肝合引入肝經為使不用鐡與刀者忌鐵器也金尅木肝乃木也一有金氣肝則畏而不受盖専治肝經之藥非與羣隊者比也肝受邪者並皆治之睛痛者加當歸决眀益隂丸治畏日惡火沙澁難開眵淚俱多乆病亦不痊者並皆療之餘治仝上羌活五錢獨活五錢黄連酒製一两防風五錢黄芩一两歸尾酒製五錢五味子五錢石决眀煆三錢草决眀一两甘草炙五錢黄蘖一两知母一两為末煉蜜丸桐子大每服五十丸加至百丸茶湯下右方以羌活獨活升清陽為君黄連去熱毒當歸尾行血五味子收斂為臣石决眀眀目磨障草决眀益腎療盲防風散治祛風黄芩去目中赤腫為佐甘草相和諸藥黄蘖助腎水知母㵼相火為使此盖益水抑火之藥也内急外弛之病並皆服之川芎行經散治目中青黤如物傷狀重者白睛如血貫枳殻六分炙草六分白芷四分防風四分荆芥四分薄荷四分獨活四分川芎六分當歸六分紅花少許柴胡六分茯苓三分蔓荆子四分羌活四分桔梗五分作一服水二盞煎至一盞去查大熱服食後右方以枳殻甘草和胃氣為君白芷防風荆芥薄荷獨活療風邪升胃氣為臣川芎當歸紅花行滯血柴胡去結氣茯苓分利除濕為佐蔓荆子羌活引入太陽經桔梗利五臓為使則胃脉調小腸膀胱皆邪去凝行也見熱者以消凝大丸子主之消凝大丸子治證仝上或有眵淚沙澁者並皆療之川芎當歸各七錢防風荆芥羌活藁夲薄荷各半两桔梗七錢甘草七錢滑石石膏白术黄芩山梔各一两連翹菊花各七錢先將滑石石膏另研餘作細末和匀煉蜜為劑毎劑一两分八丸毎服一丸或二丸茶湯嚼下右方消凝滯藥也君以川芎當歸治血和血臣以羌活防風荆芥藁本薄荷桔梗療風散邪引入手足太陽經佐以白术甘草滑石石膏調補胃虛通泄滯氣除足陽眀經熱使以黄芩山梔連翹菊花去熱除煩滛反尅風熱不制者俱宜服也千金磁硃丸治神水寛大漸散昏如霧露中行漸覩空中有黒花漸覩成物二體乆則光不收及内障神水淡緑色淡白色者磁石吸針者二两辰砂一两神麯四两先以磁石置巨火中煆醋淬七次晒乾另研極細二两辰砂另研極細一两生神麯末三兩與前藥和匀更以神麯末一两水和作餅煑浮為度搜入前藥煉蜜為丸如梧桐子大毎服一十丸加至三十丸空心飯湯下右方以磁石辛鹹寒鎮墜腎經為君令神水不外移也辰砂微甘寒鎮墜心經為臣肝其母比子能令母實也肝實則目眀神麯辛温甘化脾胃中宿食為佐生用者發其生氣熟用者斂其暴氣也服藥後俯視不見仰視漸覩星月者此其効也亦治心火乘金水衰反制之病乆病累發者服之則永不更作空心服此午前更以石斛夜光丸主之石斛夜光丸治證上仝天門冬焙人參茯苓各二两五味炒半两乾菊花七錢麥門冬一两熟地黄一两兎絲子酒浸七錢乾山藥枸杞七錢牛膝浸七錢半杏仁去皮尖七錢半生地黄一两蒺藜石斛蓯蓉川芎炙草枳殻麩炒青葙子防風黄連各半两草决眀八錢烏犀鎊半两羚羊角鎊半两為細末煉蜜丸桐子大毎服三五十丸温酒鹽湯任下右方羡補藥也補上治下利以緩利以乆不利以速也故君以天門冬人參兎絲子之通腎安神強隂填精也臣以五味子麥門冬杏仁茯苓枸杞子牛膝生熟地黄之斂氣除濕凉血補血也佐以甘菊花蒺藜石斛肉蓯蓉川芎甘草枳殻山藥青葙子之療風治虛益氣祛毒也使以防風黄連草决眀羚羊角生烏犀之散滯泄熱解結眀目也隂弱不能配陽之病並宜服之此從則順之治法也益隂補氣丸治證上仝熟地黄三两歸尾酒製半两牡丹皮五味子乾山藥各半两茯苓澤㵼各二錢五分生地黄酒製炒四两山茱茰半两柴胡半两為末煉蜜丸如桐子大水飛辰砂為衣每服五七十丸空心淡鹽湯下右方壯水之主以鎮陽光氣為怒傷散而不聚也氣病血亦病也肝得血而後能視又目為心之竅心主血故以熟地黄補血衰當歸尾行血牡丹皮治積血為君茯苓和中益真氣澤㵼除濕㵼邪氣生地黄補腎水真隂為臣五味子補五臓乾山藥平氣和胃為佐山茱萸強隂益精通九竅柴胡引入厥隂經為使蜜劑者欲泥膈難下也辰砂為衣者為通扵心也然必兼千金磁硃丸服之庶易為效滋隂地黄丸治證上仝眵多眊矂者並皆治之黄連一两黄芩半两歸身酒製半两生地黄酒製两半熟地黄半两五味子三錢人參二錢天門冬焙三錢炙草三錢地骨皮二錢枳殻三錢柴胡三錢為細末煉蜜丸如桐子毎服百丸食後茶湯下日三服右方治主以緩緩則治其夲也以黄連黄芩苦寒除邪氣之盛為君當歸身辛温生熟地黄苦甘寒養血凉血為臣五味子酸寒體輕浮上收神水之散大人參甘草地骨皮天門冬枳殻苦甘寒㵼熱補氣為佐柴胡引用為使也亡血過多之病有熱者亦宜服防風散結湯治目上下睫隠起肉疣用手法除病後服之防風羌活白芍藥歸尾各五分紅花蘓木各少許茯苓蒼术獨活前胡黄芩各五分炙草防己作一服水二盞煎至一盞熱服查再煎右方以防風羌活升發陽氣為君白芍藥當歸尾紅花蘇木破凝行血為臣茯苓㵼邪氣蒼术去上濕前胡利五臓獨活除風邪黄芩療熱滋化為佐甘草和諸藥防己行十二經為使病在上睫者加黄連柴胡以其手少隂足厥隂受邪也病在下睫者加藁夲蔓荆子以其手太陽受邪也竹葉㵼經湯治眼目癮澁稍覺眊矂視物微昏内眥開竅如鍼目痛按之浸浸膿出柴胡梔子羌活升麻炙草各五分赤芍藥草决眀茯苓各四分車前子四分黄芩六分黄連五分大黄五分青竹葉一十片澤㵼四分作一服水二盞煎至一盞食後稍熱服右方逆攻者也先以行足厥隂肝足太陽膀胱之藥為君柴胡羌活是也二經生意皆總扵脾胃以調足太隂足陽眀之藥為臣升麻甘草是也肝經多血以通順血脉除肝邪之藥膀胱經多濕以利小便除膀胱濕之藥為佐赤芍藥草决明澤㵼茯苓車前子是也總破其積熱者必攻必開必利必除之藥為使梔子黄芩黄連大黄竹葉是也蜜劑解毒丸治證上仝杏仁去皮尖二两另研山梔一十两末石蜜煉一觔大黄五两末蜜丸如梧桐子大毎服三十丸加至百丸茶湯下右方以甘潤治燥為君為燥為熱之原也山梔子微苦寒治煩為臣為煩為熱所産也石蜜甘平温安五臓為佐為其解毒除邪也大黄苦寒性走不守㵼諸實熱為使為攻其積不令其重疊不解也决眀夜靈散治目至夜則昏雖有燈月亦不能視石决眀另研二錢夜明沙另研二錢猪肝一两生用不食猪者以白羯羊肝代之二藥末和匀以竹刀切肝作二片以上藥鋪扵一片肝上以一片合之用麻皮纒定勿令藥得泄出淘米泔水一大碗貯沙罐内不犯鐵器入肝藥扵中煑至小半碗臨睡連肝藥汁服之右方以决眀鎮腎經益精為君夜眀沙升陽主夜眀為臣米泔水主脾胃為佐肝與肝合引入肝經為使冲和養胃湯治内障初起視覺微昏空中有黒花神水變淡緑色次則視岐覩一成二神水變淡白色乆則不覩神水變純白色柴胡七錢人參一两當歸酒浸一两五味子二錢白芍藥六錢白茯苓三錢羌活一两半炙草一两防風半两黄茋一两半白术一两升麻一两葛根一两乾生薑一錢毎服六錢水三盞煎至二盞入黄芩黄連各一錢再煎至一盞去滓稍熱食後服右方因肝木不平内挾心火故以柴胡平肝人參開心黄連㵼心火為君酒製當歸榮百脉五味斂百脉闕沸心包絡主血白芍藥順血脉散惡血為臣白茯苓㵼膀胱之濕羌活清利小腸之邪甘草補三焦防風升膽之降為佐隂陽皆總扵脾胃黄茋補脾胃白术健脾胃升麻葛根行脾胃之經黄芩退壯火乾生薑入壯火為導為使此方逆攻從順反異正宜俱備益氣聰眀湯治證上仝并治耳聾耳鳴黄茋半分人參半分甘草炙五分升麻三分葛根三錢蔓荆子錢半芍藥一錢黄栢酒炒一錢毎服四錢水二盞煎至一盞去查臨睡熱服五更再煎服右方以黄耆人參之甘温治虛勞為君甘草之甘平承接和恊升麻之苦平微寒行手陽眀足陽眀足太隂之經為臣葛根之甘平蔓荆子之辛温皆能升發為佐芍藥之酸微寒補中焦順血脉黄蘖之苦寒治腎水膀胱之不足為使酒製又炒者因熱用也或有熱可漸加黄蘖春夏加之盛暑倍加之加多則不效脾胃虛者去之熱倍此者㵼熱黄連湯主之㵼熱黄連湯治内障症仝上有眵淚眊矂黄芩酒炒一两黄連酒洗一两柴胡酒炒一两生地黄酒洗一两升麻半两龍膽草三錢每服三錢水二盞煎至一盞去滓午食前熱服午後服之則陽逆不行臨睡休服為反助隂也右方治主治客之劑也治主者升麻主脾胃柴胡行肝經為君生地黄涼血為臣為陽眀太隂厥隂多血故也治客者黄連黄芩皆療濕熱為佐龍膽草専除眼中諸疾為使為諸濕熱俱從外來為客也還隂救苦湯治目乆病白睛微變青色黒睛稍帶白色黒白之間赤環如帶謂之抱輪紅視物不眀昏如霧露中睛白髙低不平其色如死甚不光澤口乾舌苦眵多羞澁上焦應有熱邪升麻半两蒼术半两甘草炙半两柴胡半两防風半两羌活半两細辛二錢藁夲四錢川芎一两桔梗半两紅花一錢歸尾七錢黄連黄芩黄蘖知母生地黄連翹各半两龍膽草三錢每服七錢水一盞煎至一盞去滓熱服右方以升麻蒼术甘草諸主元氣為君為損者温之也以防風柴胡羌活細辛藁夲諸升陽化滯為臣為結者散之也以川芎桔梗紅花當歸尾諸補行血脉為佐為留者行之也以黄連黄芩黄蘖知母連翹生地黄龍膽草諸去除熱邪為使為客者除之也竒經客邪之病強陽摶實隂之病服此亦具驗菊花决眀散治症上仝草决眀石决眀東流水煑一伏時另研極細入藥木賊草防風羌活蔓荆子甘菊花甘草炙川芎石膏另研極細入藥黄芩各半两為細末每服二錢水盞半煎八分連末服食後右方以眀目除翳為君者草决眀石决眀木賊草也以散風升陽為臣者防風羌活蔓荆子甘菊花也以和氣順血為佐者甘草川芎也以療除邪熱為使者黄芩石膏也内急外弛之病亦宜其治神驗錦鳩丸治症上同兼口乾舌苦眵多羞澁上焦邪熱甘菊花半两草决眀三两㽔仁去皮三两牡礪洗火煆粉半两黄連蒺藜炒去尖五两防風五两羌活三两細辛五两􅜰麥三两白茯苓四两肉桂二两斑鳩一箇跌死去皮毛腸嘴𤓰文武火連骨炙乾羯羊肝一箇竹刀薄批炙令焦忌用鉄刀蔓菁子二升淘浄絹袋盛甑蒸一伏時晒乾為細末煉蜜為劑杵五百下丸如桐子大每服二十丸加至三五十丸空心温湯下右方以甘菊花草决眀主眀目為君以㽔仁牡礪黄連蒺藜除濕熱為臣以防風羌活細辛之升上􅜰麥茯苓之分下為佐以斑鳩補腎羊肝補肝肉桂導羣藥入熱邪為使此方制之大者也腎肝位逺服湯藥散不厭頻多之義也萬應蟬花散治證上仝蟬蜕去上半两蛇蜕炙三錢川芎防風羌活炙草各一两蒼术四两赤芍藥二两當歸一两白茯苓一两石决眀東流水煑一伏另研極細两半為細末每服二錢食後臨卧時濃米泔調下熱茶清亦可右方制之服者也竒之不去則偶之是為重方也今用蟬蜕又用蛇蜕者取其重蜕之義以除翳為君也川芎防風羌活皆能清利頭目為臣也甘草蒼术通主脾胃又脾胃多氣多血故用赤芍藥補氣當歸補血為佐也石决眀鎮墜腎水益精還隂白茯苓分隂陽上下為使也亦治竒經客邪之病黄茋防風飲子治眼稜𦂳急以致倒睫拳毛損睛生翳及上下瞼眥赤爛羞澁難開眵淚􅀈粘蔓荆子五分細辛二分葛根一錢半炙草一錢黄茋一錢防風一錢黄芩五分作一服水二盞煎至一盞去滓大熱服右方以蔓荆子細辛為君除手太陽手少隂之邪肝為二經之母子平母平此實則㵼其子也以甘草葛根為臣治足太隂足陽眀之弱肺為二經之子母薄子单此虛則補其母也黄茋實皮毛防風散滯氣用之以為佐黄芩療濕熱去目中赤腫為之使也無比蔓荆子湯治證上仝黄耆一錢人參一錢黄連七分柴胡七分蔓荆子五分當歸五分葛根五分防風五分生草一錢細辛葉三分作一服水二盞煎至一盞去滓稍熱服右方為肺氣虛耶黄茋人參實之為君心受邪耶黄連除之肝受邪耶柴胡除之小腸受邪耶蔓荆子除之為臣當歸和血葛根解除為佐防風療風散滯生甘草大㵼熱火細辛利九竅用葉者取其升上之意為使也撥雲退翳丸治陽蹻受邪内眥即生赤脉縷縷根生瘀肉瘀肉生黄赤脂脂横侵黒睛漸蝕神水鋭眥亦然俗名攀睛川芎一两五錢菊花一两蔓荆子二两蟬蜕一两蛇蜕炙三錢蜜䝉花二两薄荷葉半两木賊草去節二两荆芥穂一两黄連半两楮桃仁一两地骨皮一两天花粉六錢炙草三錢川椒皮一錢當歸一两五錢白蒺藜去刺炒一两半為細末煉蜜成劑每两作八丸每服一丸食後臨睡細嚼茶清下右方為竒經客邪而作也八十一難經曰陽蹻脉者起扵跟中循外踝上行入風池風池者腦户也故以川芎治風入腦以菊花治四肢㳺風一療其上一平其下為君蔓荆子除手太隂之邪蟬蜕蛇蜕木賊草蜜䝉花除鬰為臣薄荷葉荆芥穂白蒺藜諸療風者清其上也楮桃仁地骨皮諸通小便者利其下也為佐黄連除胃中熱天花粉除腸中熱甘草和恊百藥川椒皮利五臓眀目諸所病處血亦病故復以當歸和血為使也楮桃仁即楮實子也梔子勝竒散治症仝上并有眵淚羞澁難開蛇蜕草决眀川芎荆芥穂蒺藜炒穀精草菊花防風羌活蜜䝉花甘草炙蔓荆子木賊草山梔子黄芩各三分為細末每服二錢食後臨睡熱茶清調下右方以蟬蜕之醎寒草决眀之醎苦為味薄者通通者通其經絡也川芎荆芥穂之辛温白蒺藜穀精草之苦辛温菊花之苦甘平防風之甘辛為臣為氣辛者發熱發熱者升其陽也羌活之苦甘温蜜蒙花之甘微寒甘草之甘平蔓荆子之辛微寒為佐為氣薄者發泄發泄者清利其諸關節也以木賊草之甘微苦山梔子黄芩之微苦寒為使為厚味者泄泄者攻其壅滯有餘也磨障靈光膏治症上仝黄連剉如豆大一两童便浸一宿晒為末黄丹水飛三两當歸取細末二錢麝香另研末五分乳香另研末五分輕粉另研一錢碙砂另研末一錢白丁香取末一錢龍腦少許末海螵蛸取末一錢盧甘石六两另以一两黄連剉置水中燒盧甘石通紅淬七次先用好白沙蜜一十两或銀器沙鍋内熬五七沸以浄紙搭去臘靣除黄丹外下餘藥用柳木攪匀次下黄丹再攪慢火徐徐攪至紫色却將乳香麝香輕粉碙砂和匀入上藥内以不粘手為度急丸如皂角刺大以紙裹之每用一丸新汲水化開旋入龍腦少許時時㸃翳上右方以黄連去邪熱主眀目為君以黄丹除熱除毒盧甘石療濕收散為臣以當歸和血脉麝香乳香諸香通氣輕粉殺瘡為佐以碙砂之能消海螵蛸之磨翳白丁香之主病不移龍腦之除赤脉去外障為使也消翳復眀膏治症上仝黄丹水飛四两青鹽一两另研白沙蜜一觔訶子八箇去核取末海螵蛸三錢取末先將蜜熬數沸浄紙搭去臘面却下黄丹用棍攪匀旋下餘藥將至紫色取出黄連十两𬎼仁半两木賊草一两龍膽草二两杏仁七十五箇去皮尖通入磁器内水一斗浸之春秋五日夏三日冬十日入鍋内文武火熬至小半升濾去查重湯頓成膏子却入前藥熬之攪成紫色入龍腦一錢每用少許㸃上藥乾浄水化開用右方以黄連為君為療邪熱也㽔仁杏仁龍膽草為臣為除赤痛潤煩燥解熱毒也黄丹青鹽龍腦白沙蜜為佐為收濕爛益腎氣療赤腫和百藥也柯子海螵蛸木賊草為使為澁則不移消障磨翳也除風益損湯治目為物傷者熟地黄當歸白芍藥川芎各一錢藁夲前胡防風各七分作一服水二盞煎至一盞去滓大熱服右方以熟地黄補腎水為君黒睛為腎之子此虛則補其母也以當歸補血為目為血所養今傷則血病白芍藥補血又補氣為血病氣亦病也為臣川芎治血虛頭痛藁夲通血去頭風為佐前胡防風通療風邪俾不凝留為使兼治亡血過多之病傷扵眉骨者病自目系而下以其手少隂有隙也加黄連療之傷扵䪼者病自抵過而上傷扵耳者病自鋭眥而入以其手太陽有隙也加柴胡療之傷扵額交顛耳上角及腦者病自内眥而出以其足太陽有隙也加蒼术療之傷扵耳後耳角耳前者病自客主人斜下傷扵頰者病自鋭眥而入以其足少陽有隙也加龍膽草療之傷扵額角及巔者病自目系扵下以其足厥隂有隙也加五味子療之凡傷甚者從權倍加大黄㵼其敗血眵多淚多羞澁赤腫者加黄芩療之加減地黄丸治症上仝生地黄半觔熟地黄半觔牛膝當歸各三两枳殻二两杏仁一两羌活防風各一两為細末煉蜜為丸如桐子大每服三十丸空心食前温酒送下淡塩湯亦可右方以地黄補腎水真隂為君夫腎水不足者相火必盛故生熟地黄退相火也牛膝逐敗血當歸益新血為臣麩炒枳殻和胃氣謂胃為多血生血之所是補其原杏仁潤燥謂血少生燥為佐羌活防風俱升發清利大除風邪為七情五賊饑飽勞役之病睛痛者與當歸養榮湯兼服傷寒愈後之病及血少血虛血亡之病俱宜服也人參補陽湯治傷寒餘邪不散上走害竅其病癮澁赤脹生翳羞眀頭痛骨痛羌活獨活各六分白芍藥生地黄澤㵼各三分人參白术茯苓黄耆炙草當歸各四分柴胡防風各五分熟地黄酒洗炒四分作一服水二盞煎至一盞去查熱服右方分利隂陽升降上下之藥也羌活獨活為君導陽之升也茯苓澤㵼為臣者導隂之降者也人參白术大補脾胃内盛則邪自不容黄茋防風大實皮毛外宻則邪自不入為之佐也當歸熟地黄俱生血謂目得血而能視生地黄補腎水謂神水屬腎白芍藥理氣柴胡行經甘草和百藥為之使也抑陽酒連散治神水𦂳小漸如菜子許及神水外圍相類蟲蝕者然皆能覩物不昏微有眊矂羞澁之證生地黄獨活黄栢防風知母各三分蔓荆子前胡羌活白芷生草各四分黄芩酒製寒水石梔子各五分黄連酒製五分防已三分作一服水二盞煎至一盞去滓大熱服右方抑陽緩隂之藥也以生地黄補腎水真隂為君獨活黄栢知母俱益腎水為臣蔓荆子羌活防風白芷羣隊升陽之藥為佐者謂既抑之令其分而更不相犯也生甘草黄芩梔子寒水石防已黄連不走之藥為使者惟欲抑之不欲祛除也諸用酒製者為引導也當歸補血湯治男子䘐血便血婦人産後崩漏亡血過多致睛珠疼痛不能視物羞眀酸澁眼睫無力眉骨大陽俱各酸痛熟地黄當歸各六分川芎牛膝白芍藥炙草白术防風各五分生地黄四分天門冬四分作一服水二盞煎至一盞去滓稍熱服惡心不進食者加生薑煎右方専補血故以當歸熟地黄為君川芎牛膝白芍藥為臣以其祛風續絶定痛而通補血也甘草白术大和胃氣用以為佐防風升發生地黄補腎天門冬治血熱謂血亡生風燥故以為使羚羊角散治小兒癍疹後餘毒不解上攻眼目生翳羞眀眵淚俱多紅赤腫閉羚羊角鎊黄芩黄茋草决眀車前子升麻防風大黄芒硝各等分作一服水一盞煎半盞去滓稍熱服右方以羚羊角主眀目為君升麻補足太隂以實内逐其毒也黄茋補手太隂以實外禦其邪也為臣防風升清陽車前子㵼濁隂為佐草决眀療赤痛淚出黄芩大黄芒硝用以攻其固熱為使然大黄芒硝乃大苦寒之藥智者當量其虛實以為加減未滿二十一日而目疾作者消毒化癍湯主之消毒化癍湯治小兒癍疹未滿二十一日而目疾作者餘症上同羌活五分藁夲二分細辛一分黄連三分黄芩一分酒芩二分酒黄栢三分生地黄二分麻黄五分升麻五分白术一分蒼术二分生甘草一分呉茱萸半分陳皮一分紅花半分蘇木一分當歸三分連翹三分防風五分川芎二分葛根一分柴胡二分作一服水二盞煎至一盞去滓稍熱服右方功非獨能扵目盖専扵疒者而置也今以治疒之劑治目者以其毒尚熾盛又旁害扵目也薛氏醫案卷八
