body:
  text: 薛氏醫案卷九眀薛已撰原機啓微論目為血脉之宗內經曰諸脉者皆屬于目目得血而能視針經曰五臟六腑積氣皆上注于目而為之精精之窠為眼骨之精為黑眼血之精為絡其窠氣之精為白眼肌肉之精則為約束裏擷筋骨血氣之精而與脉并為系上屬于腦後出于項中故邪中于項因逢其身之虛其入深則隨眼系入于腦則腦轉腦轉則引目系急目系急則目眩以轉矣邪中其精其精所中不相比也則精散精散則視岐故見兩物目者五臟六腑之精榮衛魂魄之所常營也神氣之所主也故神勞則魂魄散志意亂是故瞳子黑眼發于隂白眼赤脉發于陽故隂陽合𫝊而為精眀也目者心之使也心者神之舍也故神精亂而不轉卒然見非常之處精神魂魄散不相得故曰惑也東垣曰夫十二經脉三百六十五絡其血氣皆上走于靣而走空竅其清陽氣上散于目而為精其氣走于耳而為聽因心煩事冗飲食失節勞役過度致脾胃虛弱心火太盛則百脉沸騰血脉逆行邪害空竅失眀則日月不眀矣夫五臟六腑之精氣皆禀受于脾上貫于目脾者諸隂之首也目者血脉之宗也故脾虛則五臟之精氣皆失所司不能歸眀于目矣心者君火也主人之神宜靜而安相火化行其令相火者包絡也主百病皆榮于目既勞役運動勢乃妄行又因邪氣所并而損血脉故諸病生焉凡醫者不理脾胃及養血安神治標不治夲是不眀正理也按此論目為臟腑血脉精氣之宗至為詳悉豈但世俗拘之于五輪八廓而已也論目昏赤腫翳膜皆屬于熱原病式曰目昧不眀目赤腫痛翳膜眥瘍皆為熱也及目膜俗謂之眼黑亦為熱也或平白目無所見者熱氣鬱之甚也或言目昧為肝腎虛冷者誤也是以妄謂肝生于目腎主瞳子故妄言目昧為虛而冷也然腎水冬隂也虛則當熱肝木春陽也虛則當冷腎隂肝陽豈能同虛而為冷者歟或通言肝腎之中隂實陽虛而無由目昧也俗妄謂肝腎之氣衰少而不能至于目也不知經言熱甚目瞑眼黑也豈由寒爾耶而仲景言傷寒病熱極則不識人乃目盲也正理論曰由熱甚怫鬱于目而致之然也若目無所見耳無所聞悉由熱氣怫鬱𤣥府閉密而致氣液血脉榮衛精神不能升降出入故也各隨鬱結微甚而有病之輕重也故知熱鬱于目無所見也故目微昏者至近則轉難辨物由目之𤣥府閉小也隔縑視物之象也或視如蠅翼者𤣥府有所閉合者也或目昏而見黑花者由熱氣甚而發之于目亢則害承乃制而反出其泣氣液昧之以其至近故雖微而亦見如黑花也及衝風泣而目暗者由熱甚而水化制之也故經言厥則目無所見夫人厥則陽氣并于上隂氣并于下陽并于上則火獨光也隂氣并于下則足隂足隂則脹也天一水不能勝五火故目眥而盲是以衝風泣下而不止夫風之中于目也陽氣內守于睛是火氣燔目故見風泣下按此論熱甚怫鬱隂陽并厥𤣥府閉密致目病之由為詳蓋一主于火熱之化也若由飲食辛熱七情所動六氣淫鬱氣血虛實則東垣子和陳無擇輩論亦已詳然亦有痰熱濕熱與夫服食金石燥熱之藥致者或久病後榮衛虛弱肝氣腎隂不足或元氣精氣虛衰及脫營為病皆有虛熱實熱之殊並宜分治論眼證分表裏治機要曰在腑則為表當除風散熱在臟則為裏宜養血安神暴發者為表而易治久病者在裏而難愈論目疾宜出血最急子和曰聖人雖言目得血而能視然血亦有太過不及也太過則目壅塞而發痛不及則目耗竭而失眀故年少之人多太過年老之人多不及但年少之人則無不及年老之人其間猶有太過者不可不察也夫目之內眥太陽經之所起血多氣少目之鋭眥少陽經也血少氣多目之上綱太陽經也亦血多氣少目之下綱陽眀經也血氣俱多然陽眀經起于目兩旁交頞之中與太陽少陽俱㑹于目惟足厥隂經連于目系而已故血太過者太陽陽眀之實也血不及者厥隂之虛也故出血者宜太陽陽眀蓋此二經血多故也少陽一經不宜出血血少故也刺太陽陽眀出血則目愈眀刺少陽出血則目愈昏要知無使太過不及以養血目而已凡血之為物太多則濫太少則枯人熱則血行疾而多寒則血行遲而少此常理也目者肝之外候也肝主目在五行屬木雖木之為物太茂則蔽密太衰則枯瘁矣夫目之五輪乃五臟六腑之精華宗脉之所聚其白人屬肺金肉輪屬脾土赤脉屬心火黑水神光屬腎水兼屬肝木此世俗皆知之矣及有目疾則不知病之理豈知目不因火則不病何以言之白輪變赤火乘肺也肉輪赤腫火乘脾也黑水神光被翳火乘肝與腎也赤脉貫目火自甚也能治火者一句可了故內經曰熱勝則腫凡目暴赤腫起羞眀癮澀淚出不止暴寒目瞞皆太熱之所為也治火之法在藥則鹹寒吐之下之在針則神廷上星𩕄㑹前頂百㑹血之翳者可使立退痛者可使立已昧者可使立眀腫者可使立消惟小兒不可刺𩕄㑹為肉分淺薄恐傷其骨然小兒水在上火在下故目眀老人火在上水不足故目昏內經曰血實者宜决之又經曰虛者補之實者㵼之如雀目不能夜視及內障暴怒大憂之所致也皆肝主目血少禁出血止宜補肝養腎至于暴赤腫痛皆宜以䤵針刺前五穴出血而已次調鹽油以塗髮根甚者雖至于再至于三可也量其病勢以平為期按此謂目疾出血最急于初起熱痛暴發或久病鬱甚非三稜針宣泄不可然年髙之人及久病虛損并氣鬱者宜從毫針補㵼之則可故知子和亦大略言爾于少陽一經不宜出血無使太過不及以養血目而已斯意可見論內障外障龍木論曰眼疾有七十二般內障二十三候外障四十九候病狀一一不同據其疾狀認識既不差錯治療少有所憑謹按諸候詳見夲論然內障為黑水神光昏翳外障則有翳膜者是今論中雖具諸候而所用藥多夲風熱故並略云然內障有因于痰熱氣鬱血熱陽陷隂虛脫營所致種種病因皆略之不議况外障之翳有起于內眥外眥睛上睛下睛中當視其翳色從何絡而來如東垣治例魏邦彥夫人目翳從下而上病自陽眀來也緑非五色之正殆肺腎合而為病也乃就畫家以墨調膩粉合成色諦視之與翳色同矣肺腎為病者無疑乃㵼肺腎之邪而以入陽眀之藥為之使既效而他日復病作者三其所從來之經與翳色各異因詢此必經絡不調目病未已問之果然如所論治之疾遂不作若此憑其色䆒其所兼所夲之因處治而不愈者蓋邪藴日久而實元氣隂氣不足所致也當以王道論治庶可但世俗不能守此理遂致失眀者多矣悲夫論瞳子散大東垣曰瞳子散大者由食辛熱之物太甚故也所謂辛主散熱則助火上乘于腦中其精故散精散則視物亦散大也夫精眀者所以視萬物者也今視物不真則精衰矣蓋火之與氣勢不兩立故經曰壯火食氣壯火散氣手少隂足厥隂所主風熱連目系邪入中人各從其類故循此道而來攻頭目腫悶而瞳子散大皆血虛隂弱故也當除風熱凉血益血以收耗散之氣則愈矣論倒睫赤爛東垣曰夫眼生倒睫拳毛者兩目緊急皮縮之所致也蓋內復熱則隂氣外行當去其內熱并火邪眼皮緩則眼毛立出翳膜亦退用手法攀出內瞼向外速以三稜針出血以左手爪甲迎其針鋒立愈目眶嵗久赤爛俗呼為赤瞎是也當以三稜針刺目眶外以㵼濕熱而愈按已上所論可謂深逹病情然是證亦多是血熱隂虛火動所致蓋血所以滋經脉養毛髮者也故當外治以㵼其瘀熱內治以杜絶其源可也論目不能逺視為隂氣不足東垣曰能逺視不能近視者陽氣不足隂氣有餘也乃氣虛而血盛也血盛者隂火有餘氣虛者氣弱也此老人桑榆之象也能近視不能逺視者陽氣有餘隂氣不足也乃血虛氣盛血虛氣盛者皆火有餘元氣不足火者元氣穀氣真氣之賊也元氣來也徐而和細細如線邪氣來也緊而強如巨川之水不可遏謹按陽氣者猶日火也隂氣者金水也先儒所謂金水內眀而外暗日火內暗而外明者也然人目眼備臟腑五行精華相資而神眀故能視即此理之常也雖經曰目得血而能視殊不言氣者蓋血得氣為水火之交而能神眀之也否則隂虛不能逺視陽乏不能視近是為老人桑榆之漸然學者于目病能求諸此則思過半矣論目疾分三因陳無擇云病者喜怒不節憂思兼並致臟氣不平鬱而生涎隨氣上厥逢腦之虛侵淫眼系䕃注于目輕則昏澀重則障翳眵淚努肉白膜瞞睛皆內所因或數冒風寒不避暑濕邪中于項乘虛循系以入于腦故生外翳醫論中所謂青風緑風紫風黑風赤風白風白翳黃翳等隨八風所中變生諸症皆外所因或嗜欲不節飲食無時生食五辛熱啖炙煿馳騁田獵冒涉煙塵勞動外情喪眀之夲皆不內外因治之按論中所言致證之因至為詳悉惜乎其方多夲于風熱及水臟陽虛處治而未備學者當自為通變矣論偷針眼巢氏曰凡眼內眥頭忽結成皰三五日間便生膿汁世呼為偷針此由熱氣客在眥間熱摶于津液所成但其勢輕者小小結聚汁潰熱歇乃瘥謹按世傳眼眥初生小皰視其背上即有細紅㸃如瘡以針刺破眼時即瘥故名偷針實解太陽經結熱也人每試之有驗然巢氏但具所因而不更分經絡其諸名實所過者多矣先哲治驗東垣云戊申六月徐總管患眼疾上眼皮下出黑白翳二㸃癮澀難開兩目緊縮而不痛兩寸脉細緊按之洪大而無力乃足太陽膀胱為命門相火煎熬逆行作寒水翳及寒膜遮睛呵缺善悲健忘喋噴眵淚時淚下面赤而白能食大便難小便數而缺氣上而喘以撥雲湯治之論瞳子散大并方戊戌冬初李叔和至西京朋友待之以猪肉煎餅同蒜醋食之後復飲酒大醉卧于暖亢翌日病眼兩瞳子散大于黃睛視物無的以小為大以短為長卒然見非常之處行步踏空多求醫療而莫之愈至己亥春求治于先師曰內經有云五臟六腑之精氣皆注于目而為之精精之窠為眼骨之精為瞳子又云筋骨氣血之精而為脉并為系上屬于腦又瞳子黑眼法于隂今瞳子散大者由食辛熱之物過多故也所謂辛主散熱則助火上乘于腦中其精故散精散則視物亦散大也夫精眀者所以視萬物者也今視物不真則精衰矣蓋火之與氣勢不兩立故經云壯火食氣壯火散氣手少隂足厥隂所主風熱連目系邪之中人各從其類故循此道而來攻頭目腫悶而瞳子散大皆血虛隂弱故也當除風熱凉血益血以收耗散之氣則愈矣滋隂地黃丸方見前內經云熱淫所勝平以鹹寒佐以苦甘酸收之以黃連黃芩大苦寒除邪氣之盛為君當歸身辛溫生熟地黃苦甘寒養血凉血為臣五味子酸寒體輕浮上收瞳子之散大人參甘草地骨皮天門冬枳殼苦甘寒㵼熱補氣為佐柴胡引用為使也忌食辛辣物而助火邪及食寒凉物損胃氣藥不能上行也丹溪一壯年人早起忽視物不見就睡片時略見而不眀食減倦甚脉緩大重則散而無力意其受濕所致詢之果卧濕地半月遂以白术為君黃茋茯苓陳皮為臣附子為使十餘貼而愈丹溪一老人忽盲他無所苦豫以大虛治之急煎人參膏二斤服二日一醫與磁石藥豫曰今夜死矣果然丹溪一人形實好飲熱酒忽目盲脉澀此熱酒所傷胃氣汚濁之血死其內而然以蘇木作湯調人參末服二日鼻及兩掌皆紫黑豫曰滯血行矣以四物加蘇木桃仁紅花陳皮煎調人參末服數日而愈已上治驗三條見丹溪纂要謙甫云郎中張子敬年六十七嵗病眼目昏暗微黑色皮膚不澤六脉弦細而無力一日出視治眼二方問豫曰可服否豫曰此二方以黃連大苦之藥為君諸風藥為使且人年五十膽汁減而目不眀內經云土位之主其㵼以苦諸風藥亦能㵼土人年七十脾胃虛而皮肉枯重㵼其土使脾胃虛而不能營運榮衛之氣滋養元氣胃氣不能上行隔氣吐食諸病生矣又况年髙衰弱此藥不服可也只宜慎言語節飲食懲忿窒欲此不治之治也子敬以為眀年春除關西路按察使三年致仕回還精神清勝脉遂平和此不可妄服寒涼之劑也內經云征伐無過是謂大惑解之可也海藏妻姪女形肥笄年時得目疾每月或二月一發發則紅腫難開如此者三年服除風散熱等劑左目反有頑翳從鋭眥遮瞳人右目亦有翳從下而上經云從內走外者少陽病從下上者陽眀病豫謂此少陽陽明二經有積滯也脉短滑而實鼓晨則似短澀潔古有云短為有積滯遏抑臟腑宜下之遂用溫白丸減川芎附子下之二多加龍膽草黃連如東垣五積法從二丸加起每日加一丸如至大利然後減丸又從二丸加起忽一日于利中下墨血塊若干如黑豆大而硬堅從此漸痊而翳盡去見醫學綱目樓全善先生曰夏枯草治目珠疼至夜則疼甚者神效或用苦寒藥㸃之反疼者亦神效蓋目珠者連目夲又各系屬厥隂之經也夜甚及用苦寒藥㸃之反甚者夜與寒亦隂故也丹溪云夏枯草有補養厥隂血脉之功其草三四月開花遇夏至隂生則枯蓋禀純陽之氣也至哉斯言故治厥隂目疼如神者以陽治隂也豫男至夜目珠及連眉稜骨作疼頭半邉腫痛用黃連膏㸃之反大痛百藥不效灸厥隂少陽疼隨止半日又作又灸又止月餘遂以夏枯草二兩香附末二兩甘草四錢同為細末每服一錢半用清茶調服下咽則疼減大半至四五日良愈一男子六十餘嵗所患與前證皆同但黑睛有白翳二㸃諸藥不效亦以此藥與東垣選竒湯加四物湯及黃連煎間服并灸厥隂少陽而安附方治風之劑局方蜜䝉花散治風氣攻注兩眼昏暗眵淚羞眀并暴赤腫羌活白蒺藜炒木賊蜜䝉花石决眀各一兩菊花二兩右為末每服二錢茶清食後調下三因羌活散治風毒上攻眼目昏澀翳膜生瘡及偏正頭疼目小黑花纍纍者羌活川芎天麻旋覆花青皮南星炮藁夲各一兩右為末每服二錢水煎入薑三片薄荷七葉按已上並足太陽厥隂藥也東垣眀目細辛湯治兩目發赤微痛羞眀畏日怯風寒怕火眼睫成紐眵糊多癮澀而難開眉攢腫悶鼻塞涕唾􅀈粘大便祕澀麻黃羌活各三錢防風二錢藁夲一錢白茯苓一錢當歸尾一錢川芎五分細辛五分蔓荆子五分荆芥穗錢半生地黃一錢酒製椒八箇桃仁二十箇紅花少許右㕮咀分作四服每服水煎食後熱服按此足太陽厥隂手少隂藥也機要四物龍膽湯治目赤暴發雲翳疼痛不可忍四物湯半兩羌活防風各三錢龍膽草酒拌炒焦防已各二錢右㕮咀作數服水煎按此足厥隂太隂太陽藥也防風飲子治拳毛倒睫黃茋甘草人參各一錢葛根五分細辛葉蔓荆子防風各五分當歸七分半右㕮咀作一服水煎食後服按此足太陽陽眀手足太隂藥也治熱之劑局方洗心散治風壅壯熱頭目昏痛熱氣上衝口苦唇焦咽喉腫痛心神煩燥多渴五心煩熱小便赤澀大便祕滯大黃煨甘草當歸芍藥麻黃荆芥穗各六錢白术半兩右為末每服二三錢生薑薄荷湯煎服按此足太陽陽眀厥隂手足太隂經藥也今人多用之故收入然以白术合大黃入心故名洗心而從以麻黃荆芥亦是表裏藥濟生羊肝丸治肝經有熱目赤睛疼視物昏澀羊肝一具生用局方用白羊肝黃連去鬚為末右先將羊肝去筋膜于沙盆內搗爛入黃連末杵和丸如梧子大每五十丸用熟水送下按此手少隂足太隂厥隂藥也東垣㵼熱黃連湯治眼暴發赤腫疼痛黃芩酒製炒黃連同上製龍膽草生地黃各一兩升麻半兩柴胡一兩右㕮咀每服四錢水煎去查于日午前飯後熱服按此手少隂太隂足陽眀少陽少隂藥也治風熱之劑局方眀目流氣飲治風熱上攻眼目視物不眀常見黑花當風多淚癮澀難開大黃煨牛蒡子炒川芎菊花白蒺藜炒細辛防風𤣥參山梔黃芩甘草炙蔓荆子荆芥木賊各一兩草决眀兩半蒼术泔汁炒二兩右為末每二錢臨卧用溫酒調下按此手足三隂足陽眀太隂藥也洗肝散治風毒上攻暴作赤目腫痛難開癮澀眵淚薄荷葉當歸羌活防風山梔仁甘草大黃川芎各二兩右為末每二錢食後煎水調下按此足太陽厥隂手足太隂藥也錢氏㵼青丸治目暴發赤腫疼痛當歸川芎山梔龍膽草酒拌炒焦大黃羌活防風右為末蜜丸雞頭子大每一二丸按此足太陽少陽太隂厥隂藥也東垣連翹飲子治目中溜火惡日與火癮澀小角緊久視昏花迎風有淚蔓荆子生甘草連翹各三分柴胡二分黃芩酒製五分生地黃當歸人參各三分紅葵花三分黃茋防風羌活各五分升麻一錢右㕮咀作一服水煎食後熱服按此足三陽少隂厥隂藥也神芎丸治濕熱內甚目赤腫或白睛黃色大黃黃芩各二兩牽牛滑石各四兩黃連薄荷川芎各半兩右為末水丸如小豆大溫水下十丸至十五二十丸按此足陽眀厥隂藥也東垣龍膽飲子治肝眼流膿生疳翳濕熱為病麻黃一錢半黃芩炒青蛤粉羌活龍膽草酒拌炒焦各三錢蛇退皮穀精草川鬱金炙甘草各五分升麻二錢右為細末每二錢食後茶調服按此足太陽陽眀手足太隂藥也已上六方宜隨表裏而輕重之亦不可例用理血之劑局方眀目地黃丸治男女肝腎俱虛風邪所乘熱氣上攻目翳遮睛目澀多淚牛膝酒浸三兩石斛枳殼炒杏仁去皮炒防風各四兩生熟地黃各一斤右為末煉蜜丸如梧子大每服三十丸白水下按此出太陽例又氣藥也簡易加減駐景丸治肝腎氣虛兩目昏暗視物不眀熟地黃當歸各五兩楮實子川椒炒各一兩五味子二兩枸杞子二兩兔絲子酒製半斤車前子炒二兩右為末蜜糊丸如梧子大每三十丸食前溫酒下謹按肝為相火有㵼無補况隂水虛而陽火實病目者多故此二方蓋補肝之隂虛也頗有理故收入地芝丸治目不能逺視能近視或亦妨近視生地黃焙乾天門冬去心各四兩枳殼二兩炒甘菊花二兩右為細末煉蜜為丸如桐子大茶清送下百丸食後理氣之劑局方定志丸治眼不能近視反能逺視者白茯苓人參各三兩逺志去心菖蒲各二兩右為細末煉蜜為丸如梧子大以硃砂為衣每服七丸至二三十丸溫米飲下食後日三服按已上二方手太隂少隂藥也濟生桑白皮散治肺氣壅塞毒氣上攻眼目白睛腫脹日夜疼痛𤣥參桑白皮枳殼炒升麻杏仁炒旋覆花防風赤芍黃芩甘菊花甘草炙甜葶藶炒各一兩右為末每服三錢食前滚白水調下按此又治風熱之劑也出太陽例養陽之劑東垣神效黃茋湯治渾身麻木不仁或頭面或手或腿腳麻木不仁兩目緊急縮小及羞眀畏日或視物無力黃茋二兩人參八錢炙甘草一兩蔓荆子三錢白芍一兩陳皮半兩右㕮咀每五錢水煎臨卧熱服益氣聰眀湯治飲食不節勞役形體脾胃不足得內障耳鳴或多年目昏暗視物不能此藥能令人目廣大久服無內外障耳鳴耳聾之患黃茋甘草人參各半兩升麻葛根各三錢蔓荆子錢半芍藥黃柏酒炒各一錢右㕮咀每服三錢水煎臨睡熱服近五更再服之得腫更妙如煩悶或有熱漸加黃柏春夏加之盛暑夏月倍之若此一味多則不效人參補胃湯治勞役所傷飲食不節內障昏暗前黃茋湯減陳皮茋再減半加黃柏一兩酒拌透右㕮咀每服三四錢水煎食逺稍熱服後兩目廣大視物如童時覺兩腳踏地不知髙低蓋冬天多服升陽藥故也病減住服按已上手足太隂少隂藥也滋隂之劑東垣連柏益隂丸羌活獨活甘草當歸尾製防風半兩五味子半兩草决眀一兩石决眀燒三錢細黃芩黃柏知母黃連酒拌炒各一兩右件為細末煉蜜為丸如菉豆大每服五十丸漸加至百丸食逺茶清送下常多服補陽湯少服此丸滋隂腎氣丸此壯水之主以鎮陽光熟地黃三兩牡丹皮半兩生地黃四兩澤㵼二兩半茯苓二兩半當歸尾山茱萸柴胡五味子乾山藥各半兩右件于石臼中杵為細末煉蜜為丸如桐子大每服五七十丸鹽湯空心服按已上並少隂藥也養陽滋隂之劑局方菊睛丸治肝腎不足眼目昏暗常見黑花多淚枸杞子三兩蓯蓉酒浸炒巴㦸去心各一兩甘菊花四兩右為末煉蜜為丸如梧子大每五十丸溫湯鹽湯食逺任下東垣滋隂地黃丸治眼目瞳子散大于黃睛視物無的或卒然見非常之處熟地黃一兩生地黃兩半柴胡八錢天門冬炙甘草枳殼各三錢人參二錢地骨皮二錢黃連三錢五味子三錢黃芩半兩歸身半兩酒拌焙右件為細末煉蜜為丸如菉豆大每百丸溫茶清送下日進三次忌辛辣生冷之物按此二方足少隂之劑也前方主右腎此主左腎之藥故亦異爾補陽湯治陽不勝其隂乃隂盛陽虛則九竅不通今青白翳見于大眥及足太陽少隂經中鬱遏足厥隂肝經氣不得上通于目故青白翳內阻也當于太陽少隂經中九原之下以益肝中陽氣衝天上行此乃先補其陽後于足太陽太隂標中標者頭也㵼足厥隂肝經火下伏于陽中乃次治也內經云隂盛陽虛則當先補其陽後補其隂此治法是也每日侵晨以腹中無宿食服補陽湯臨卧服益隂丸若天色變大寒大風并勞役預日飲食不調精神不足或氣弱俱不得服候時氣和平天氣如常服之乃先補其陽使陽氣上升通于肝經之末利空竅于目矣羌活獨活甘草人參熟地黃黃茋白术各一兩澤㵼研為末陳皮各半兩生地黃炒白茯苓去皮知母炒各三錢柴胡去苗三兩防風白芍藥半兩肉桂去皮一錢當歸身去蘆酒製三錢右同為粗末每服半兩水三盞煎至一盞去滓空心宿食消盡服之冲和養胃湯治內障眼得之脾胃元氣衰弱心火與三焦俱盛飲食失節形體勞役心不得休息故上為此疾服之神效柴胡七錢防風半兩羌活炙甘草黃茋各一兩半當歸製白术升麻人參葛根各一兩白芍六錢白茯苓三錢乾薑一錢五味子二錢黃芩黃連各七錢右㕮咀每五六錢水煎食逺稍熱服按已上足三陽手足太隂藥也治障翳諸方龍木論還睛丸治眼內赤澀有花或黑或白或紅皆因肝臟積熱肺受風邪初患之時宜令針治諸穴內服此人參桔梗黃芩熟地黃防風茺蔚子車前子知母各二兩𤣥參半兩細辛五味子各二兩半右為末煉蜜為丸如梧子大空心茶下十丸按夲論治內障諸方與此相類者數多姑存此法局方蟬花無比散治大人小兒風毒傷肝或為氣攻一切眼目昏暗漸生翳膜或久患頭風牽搐兩眼漸漸細小連眶赤爛茯苓甘草炙防風各四兩川芎石决眀鹽水煮研如粉羌活當歸各三兩赤芍十兩炒蒺藜炒半斤蟬退一兩蒼术十二兩蛇退一兩右為末每三錢食後米泔調服茶清亦得按此足三陽太隂厥隂藥也蟬花散治肝經藴熱毒氣上攻眼目赤腫多淚羞眀一切風熱昏翳穀精草菊花蟬退羌活甘草炙白蒺藜炒草决眀防風山梔川芎蜜蒙花木賊荆芥穗黃芩蔓荆子右為末每二錢食後茶清調下按此足太陽少隂厥隂手太隂藥也夲事方羊肝丸兔絲子車前子麥門冬决眀子茯苓五味枸杞子茺蔚子苦葶藶㽔仁地膚子澤㵼防風黃芩杏仁炒細辛桂心各一兩青箱子一兩熟地黃一兩半白羯羊肝只用子肝一片薄切新瓦上炒乾右為細末煉蜜為丸如梧子大每服三四十丸溫水下日闕按此足太陽少隂手太隂少隂藥也祕方撥雲退翳丸皇統年間醫官劉昌祖傳于世瓜蔞根枳實甘草炙蔓荆子焙薄荷各半兩川芎木賊浸一宿焙蜜䝉花荆芥穗地骨皮羌活白蒺藜各一兩甘菊花一兩蛇退黃連各三錢川椒七錢半炒去目當歸一兩半酒浸焙乾蟬退三錢右為細末煉蜜為丸每兩作十丸每服一丸食後臨卧日進三服翳者米泔水下睛暗當歸湯下內障木香湯下按此足太陽厥隂手少隂藥也然翳膜之疾有氣血虛實或夾痰熱七情六淫或隂火動濕熱致者種種不同皆宜求責但已上法不能以盡病情之變學者宜擴充焉㸃洗諸方局方湯泡散治肝經風熱上壅眼目赤澀睛疼多淚赤芍當歸黃連各等分右為末每二錢湯頓調熱洗日三五次御藥院方加荆芥三因立勝散治風熱攻眼隱澀羞眀腫痛黃連秦皮防風黃芩等分右㕮咀水煎熱用新羊毫筆蘸刷洗眼金露膏除昏退翳截赤定疼㽔仁槌碎黃丹各一兩黃連半兩蜜六兩右先將黃丹炒令紫色入蜜攪勻下長流水四升以嫩柳枝五七莖一把定攪之次下㽔仁候滚十數沸又下黃連用柳枝不住手攪熬至升七八合罩籬內傾藥在紙上慢慢滴之勿令塵汚如有瘀肉加碙砂末一錢上火上慢開入前膏子內用龍木論云患傷寒熱病後切不可㸃恐損眼也斯言可以為藥禁云寶鑑春雪膏治風熱上攻眼目昏暗癢痛癮澀難開多眵淚羞眀疼痛或生翳膜黃連四兩銼用童便二升浸一宿去連用淬甘石好黃丹六兩水飛碙砂一錢細研水調在盞內頓乾為度白丁香五分乳香當歸各三錢麝香輕粉各少許烏魚骨燒存性三錢南蘆甘石十二兩淬便汁浸右各研另貯先用好蜜一斤四兩煉去蠟却下甘石末不住手攪次下丹次下諸藥末不住手攪至紫金色不粘手為度掐作錠子每用一粒新水磨化時時㸃之忌酒濕麵蕎麥拔萃方㗜藥治偏頭疼眼疾蒼耳頭薄荷葉盆硝石膏各一錢亂文者乳香華細辛貫芎各五分右為極細末早午夕三時㗜鼻寶鑑方無蒼耳乳香細辛有荆芥桔梗蟾光膏治逺年病目不通道路退去雲膜須用十二月開成日合白砂蜜四兩用隔年葱根去須皮切短與蜜一同熬去白膜候葱熟為度以綿濾淨紙取蠟面黃丹蜜陀僧各水飛三錢生用蘆甘石火煆五錢水飛已上三味研極細傾入前蜜中桃柳無節者各一枝攪勻川芎半兩當歸赤芍黃連去蘆淨二兩杏仁湯泡去皮尖各半兩秦皮訶子皮防風石膏𤣥精石井泉石無名異𤣥參代赭石石决眀已上十味各三錢㕮咀用雪水或長流水五升于銀器內熬至二升濾去滓淨再熬至一升傾入前藥蜜內銀器內慢火熬紫金色時再下後藥勿令過火乳香沒藥琥珀硃砂㽔仁各三錢已上五味先乾研極細入㽔仁研細水飛澄清極細方傾入前藥一同復熬以筯㸃藥于水中不散為度勿令過與不及取下于土中埋七日取出置于銀器或磁器中如法收貯便再添入後細藥以桃柳枝攪勻南鵬砂珍珠龍腦珊瑚枝各一錢麝香五分右五味研極細入藥中封定如有取不盡藥用淨水斟酌洗渲熬過另于洗眼或膏子稠了傾些小調解灸雀目疳眼法寶鑑云小兒雀目夜不見物灸手大指甲後一寸內膁橫文頭白肉際灸一炷如小麥大小兒疳眼灸合谷二穴各一壯炷如小麥大在手大指次指兩骨間陷者中按灸法詳見資生等經兹不備録附東垣諸先生治法撥雲湯治法見前東垣先生治徐總管條黃茋一分細辛葉五分柴胡七分生薑五分荆芥穗一錢羌活防風各一錢半藁夲生甘草升麻各一錢葛根川芎各五分知母歸身各一錢黃蘖一錢半作一服水煎稍熱服食後助陽活血湯治眼發之後猶有上熱白睛紅上壅無疼痛癮澀難開多眵淚防風黃茋各五分炙甘草五分蔓荆子二分歸身酒製五分白芷三分升麻七分柴胡五分作一服水煎臨卧稍熱服神效眀目湯治眼稜緊急致倒睫拳毛損目及上下瞼赤爛睛赤疼痛昏暗冷淚常流夜則眼澀難開眵淚皆滿眼葛根一錢半甘草炙二錢防風一錢蔓荆子五分細辛二分一法加黃茋一錢作二服水煎臨卧稍熱服廣大重眀湯治兩目臉皆焮熱赤腫作痛楞生瘡多眵淚癮澀不能開視及眼臉癢搔之至破者並皆治之草龍膽酒炒防風生甘草細辛各一錢各杵如麻豆大內甘草不銼只作一定先以水一碗半煎草龍膽一味至一半再入餘三味煎至少半碗濾去滓用清帶熱洗以重湯坐令熱日用五七次每洗畢合目須臾如努肉泛長及癢亦驗五秀重眀丸治翳膜遮睛癮澀昏花常服清利頭目乾菊開頭五百朵荆芥穗五百穗楮實子五百粒木賊去節五百莖川椒五百粒炒去口為末煉蜜為丸彈子大每服一丸細嚼徐徐咽下升陽柴胡湯羌活獨活甘草根歸身各一兩熟地黃一兩人參黃茋白术各半兩澤㵼三錢白芍藥一兩陳皮白茯苓防風各三錢肉桂五分柴胡一錢半生地黃酒炒半兩楮實子酒拌半兩知母酒製三錢夏月加至五錢每服五錢水煎稍熱服食後另合一料煉蜜為丸如桐子大食逺茶清送下五十丸每日與前藥各一服如天氣熱甚加五味子三錢或五錢天門冬五錢更加芍藥楮實子各五錢芎辛湯治兩目晝夜癮澀難開羞眀畏日目赤視物昏暗神效芎藭五分蔓荆子五分細辛二分防風一錢半甘草白芷各一錢作一服水煎臨卧稍熱服羌活退翳丸治內障右眼小眥青白翳大眥微顯白翳腦痛瞳子散大上熱惡熱大便時難小便如常遇天熱暖處頭痛睛脹能食日沒後天隂則昏暗此證亦可服滋隂地黃丸熟地黃八錢生地黃酒製歸身酒製焙黃蘖製各半兩川芎三錢芍藥一兩二錢防己二錢酒製知母三錢酒製茺蔚子半兩牡丹皮三錢丹參半兩寒水石一身生用柴胡半兩羌活三錢黑附子一錢炮為細末煉蜜為丸如小豆大每服五七十丸白湯送下隨以食壓之忌言語已上俱見東垣試效方保命當歸湯治風熱上攻瞳子散大當歸身二錢黃芩二錢黃連一錢柴胡一錢熟地黃三錢芍藥二錢甘草炙三錢分三服水煎臨卧溫服瑞竹四神丸治腎經虛損眼目昏花補虛益損及雲翳遮睛甘州枸杞子一斤㨂色赤滋潤者作四分用酒一杯潤之一分川椒一兩同炒一分小茴香一兩同炒一分用芝麻一合同炒一分獨炒用炒過將川椒等篩去不用再加熟地黃白术白茯苓各一兩共為細末煉蜜為丸如梧桐子大每服五七十丸空心溫酒送下或加甘菊花一兩見醫學綱目新增補肝散治肝風內障不痛不癢眼見花發黃白黑赤或一物二形難辨羚羊角防風各二兩羌活人參車前子茯苓細辛𤣥參黃芩各一兩為末食後米飲調服一錢簡要補肝散治肝虛目睛疼淚出不止筋脉痛及羞眀怕日夏枯草四兩香附子一兩為細末每服一錢茶清調下羚角飲子治緑翳內障頭旋額痛眼內痛澀者羚羊角防風知母人參茯苓𤣥參桔梗各二兩細辛三兩黃芩車前子各一兩為末每服三二錢水煎食後溫服腎臟風眼四生散治腎風上攻眼目作癢或作昏花白附子黃茋獨活蒺藜各等分為末每服二錢用猪腰子一枚批開入藥濕紙包裹煨熟細嚼鹽湯下風癬酒下小兒五臟目疾天麻丸治小兒肝疳風疳眼疳青黛黃連天麻五靈脂去石夜眀砂炒川芎蘆薈各一錢龍膽草酒拌炒焦防風蟬蛻各錢半全蝎麝香少許乾蟾頭二錢炙焦為末猪膽汁浸糕丸如麻子大每服十丸薄荷湯下生犀散治小兒心經虛熱目內淡紅犀角鎊末二錢地骨皮赤芍藥柴胡乾葛各一兩甘草半兩為末每服二三錢水煎熟入犀角食後服㵼黃散治小兒胃熱眼目作痛藿香七錢山梔一兩石膏半兩甘草七錢五分防風四兩用蜜酒拌微炒為末每服二三錢水煎服生熟地黃丸治小兒疳蝕眼患閉合不開羞眀畏日或生內障生地黃一兩熟地黃一兩當歸二錢半麥門冬去心半兩枳殼米泔洗炒防風杏仁去皮失炒甘草赤芍藥各二錢半為末每服三二錢黑豆七粒煎豆熟去查服三味蘆薈丸治黑水凝翳內障不痛不癢微有頭旋脹澀者蘆薈甘草各一錢羚羊角蜜炙二兩為細末煉蜜為丸如梧桐子大空心茶清下十丸九味蘆薈丸治三焦及肝膽經風熱目生雲翳或瘰癧耳內生瘡寒熱作痛或肝火肌體消瘦發熱作渴飲食少思肚腹不調或肝疳口內生瘡牙齦潰爛或牙齒蝕落頰腮腐爛發熱口渴飲食少用下部生瘡等症蘆薈半兩胡黃連當歸龍膽草酒浸炒芍藥川芎蕪荑各一兩木香甘草炙各三錢右為末茯神糊丸麻子大每服五七十丸滚湯下地黃丸治小兒肝腎虛熱眼目生翳或赤爛等症如變疳症當兼服蘆薈肥兒二丸詳見家居醫録卷六熟地黃搯碎稱八兩酒拌杵膏山藥四兩山茱萸肉四兩白茯苓澤㵼牡丹皮各三兩右各另為末入地黃膏和勻加煉蜜少許丸如梧桐子大量兒大小空心服肥兒丸治食積發熱眼目生翳等症黃連炒蕪荑炒神曲炒麥芽炒右各另為末等分水和丸量兒大小空心服通頂散治小兒腦熱腦枕骨疼閉目不開或頭風痛攢眉啼哭并赤目川芎薄荷各半兩茵陳甘草各四錢朴硝三錢甜硝亦可為末用少許吹鼻中即效如要嚏噴加躑躅花一錢只用朴硝吹鼻亦止一方用好壞胭脂子水調塗眼眶决眀散治痘疹入眼决明子錢半赤芍藥錢半甘草一錢為末每服一錢蜜水調服已上方見小兒䄂珍方蜜䝉散治小兒痘疹及諸毒入眼蜜䝉花錢半青箱子一錢决眀子車前子各五分為末羊肝一片破開摻藥在內仍合之濕紙數重包裹灰中煨熟空心食之通聖散治小兒瘡痘入眼及生翳障白菊花一兩緑豆皮一兩穀精草去根一兩為末三嵗一錢乾柿一枚生粟米泔一盞同煎候泔盡將柿去蒂核不時食之日用二三枚近者五七日逺者半月全效蛤粉散治小兒瘡痘入目榖精草蛤粉各等分為末三嵗一錢猪肝二兩批開摻藥在內以竹葉包裹以線束定水一碗煮熟入磁瓶內薰眼至溫取食之蛇皮散治小兒瘡痘入目成翳括蔞根蛇皮炙黃等分為末三嵗一錢羊子肝一片批開入藥末在內以線束定米泔水煮熟食之蟬蛻散治小兒癍瘡入眼半年以裏者一月取效猪懸蹄甲二兩罐子內鹽泥固濟燒存性蟬殼一兩羚羊角一分為末三嵗一錢猪肝湯調下食後服日三服一年之外難治二粉散治小兒斑瘡入眼輕粉五分粉霜一錢右研勻用綿裹如人患左眼塞入左耳內患右眼塞入右耳內所患眼便開得其瘡自愈已上方見全嬰集海藏云東垣先生嘗治癍後風熱毒翳膜氣障遮睛以㵼青丸治之大效初覺易治保命集云非癍後翳膜亦能治之㵼青丸減大黃一半用之已上方見醫學綱目羌菊散治小兒肝臟壅熱眼生浮翳羌活防風山梔各一分甘草菊花白蒺藜炒去尖各半兩為末三嵗五分食後蜜湯調下日三服二草散治小兒疳眼睛疼并赤眼腫痛甘草龍膽草酒炒當歸細辛各一錢為末三嵗一錢水半盞砂糖少許煎三分食後服三黃丸亦治疳赤眼若因㵼痢後疳眼昏澀大便不實者用六神丸六甲丸并暖疳藥雞肝散治小兒疳眼不赤不腫不疼但開畏眀光此藥治之川烏大者去皮一枚生好壞子一字為末五嵗一錢雄雞肝一具淨洗去筋膜竹刀薄切開摻藥在內箬葉包裹麻皮扎定用米泔水半盞磁器中煮熟切作片空心臨冷食之將煮肝湯送下又有腦熱閉目鼻內乾燥用通頂散治之方見前小兒雀盲眼還眀飲治小兒每至夜不見物名曰雀目夜眀沙井泉沙穀精草蛤粉各等分為末煎黃蠟丸雞豆肉大三嵗一丸猪肝一片切開置藥于內麻皮扎定沙瓶內煮熟先薰眼後食之合眀散治小兒雀目至夜不見物楮實子覆盆子酒浸車前子酒蒸石斛各兩沉香别研半兩青鹽别研半兩為末煉蜜為丸如桐子大每服七十丸空心鹽湯下小兒肝脾等眼疾養肝丸治小兒肝血不足眼目昏花或生眵淚當歸酒浸車前子酒蒸焙防風去蘆白芍藥熟地黃酒蒸杵膏𬎼仁别研川芎楮實子各等分為末煉蜜為丸如桐子大每服七十丸滚湯下不拘時服車前子散治小兒肝經積熱上攻眼目額逆生翳血灌瞳子羞明多眵蜜䝉花羌活菊花粉草白蒺藜草決明車前子炒黃芩龍膽草洗淨各等分炒為末每服二錢食後飯湯調服已上四方見袖珍方草龍膽散治小兒暴赤火眼晝夜澀痛作腫淚多草龍膽木賊荆芥菊花防風草決明半生半炒甘草各等分每服二錢水煎溫服痛甚加羌活乳香明目飲治小兒脾藴熱肝受風邪致兩目羞明經久不愈山梔仁香附子淨各一兩夏枯草半兩每服二錢入蜜一匙水煎服已上方見治幼心新書飛絲塵垢入目治飛絲入目用頭垢㸃入目中即出神效飛絲入眼用柘樹漿㸃了用綿裹筯頭蘸水于眼上繳拭涎毒又方飛絲入目以火麻子一合杵碎井花水一碗浸攪却將浸水中涎抹自出神效一方茄子葉杵碎加麻子法尤妙丹溪飛絲落入眼紅腫如眯痛澀不開鼻流清涕用京墨濃磨以新筆塗入目中閉目少時以手張開其絲自成一塊看在眼白上却用綿輕輕拭出則愈如未盡再治眯目鹽與䜴置水中浸之視水其查立出孫真人方千金活稻麥芒入眼以新布覆眼上將蠐螬從布上摩之其芒自著布上山居物落眼中用新筆蘸水繳之又方濃研好墨㸃立出薛氏醫案卷九
