口舌生瘡咽乾作渴等症藿香葉七錢山梔一兩石膏五錢防風四兩甘草三兩右為末每服一錢白湯調㵼白散治肺經有熱咳嗽痰壅等症甘草五錢桑白皮地骨皮各一兩右為末每服一錢白湯調益黃散治脾土虛寒飲食少思或嘔吐作㵼腹痛腸鳴或寒水反來侮土以致前症陳皮一兩青皮訶子肉甘草炙丁香各二錢右為末每服二錢水煎陳氏異功散治元氣虛寒痘瘡色白寒戰咬牙泄㵼喘嗽等症木香當歸各三錢半官桂茯苓白术各二錢人參肉豆蔲陳皮厚朴薑製丁香各二錢半半夏附子炮各一錢半右為末每服二三錢薑棗水煎百祥丸治痘疹黑陷耳冷鼻􅍠咬牙吐㵼飲食不進等症紅牙大㦸一兩青州棗三十個右水煎乾去大㦸將棗焙乾為丸白湯下升麻葛根湯治痘瘡初見發熱頭痛等症升麻葛根芍藥甘草右水煎服清凉飲治痘後餘毒頭面患瘡目赤咽痛發熱飲冷大便不通等症赤芍藥當歸甘草大黃各等分右水煎服柴术參苓散治肝火風熱抽搐不寧肢體搔癢等症柴胡山梔炒川芎芍藥炒各五分熟地黃當歸各八分茯苓甘草炒各五分右水煎服參苓白术散治脾胃虛弱飲食少思或嘔吐泄㵼等症病後元氣未復亦宜用此藥調理人參茯苓白术炒蓮肉去皮心砂仁炒薏苡仁炒桔梗炒山藥甘草炙白扁豆去皮姜汁拌炒右為末每服二錢白湯煎服人參安胃散治因服峻厲脾胃虧損或成慢驚泄㵼嘔吐或腸胃有熱以致前症人參一錢黃茋二錢生甘草炙甘草各五分白芍藥七分白茯苓四分黃連二分右為末每服二錢水煎溫脾散治脾胃虧損腹脅虛脹乳食不進困倦無力等症訶子肉人參各七錢半白术木香桔梗茯苓藿香陳皮黃茋各五錢甘草二錢半右每服二錢薑棗水煎溫膽湯治膽氣怯弱驚悸少寐發熱嘔痰飲食少思等症半夏枳實各一兩橘紅一兩五錢茯苓七錢半甘草炙四錢右每服一二錢薑棗水煎肥兒丸治小兒食積五疳或白秃體瘦肚大筋青髮稀成穗或遍身瘡疥等症蕪荑炒神麯炒麥蘖炒黃連各一錢右為末猪膽汁丸黍米大每服一二十丸木通煎湯下九味蘆薈丸治小兒疳脾疳積體瘦熱渴大便不調或瘰􅊓結核耳內生瘡等症胡黃連黃連蘆薈木香蕪荑炒青皮白雷丸鶴膝草各一兩麝香三錢右為末蒸餅糊丸麻子大每服一錢空心白湯下大蕪荑湯一名梔子茯苓湯治小兒脾疳少食發熱作渴大便不調髮黃脫落面黑便清鼻下生瘡能乳食吐等症山梔三分黃柏甘草炙各二分蕪荑五分黃連防風各二分麻黃羌活柴胡各三分白术五分茯苓當歸各四分右每服二錢水煎桔梗湯治咳嗽吐膿痰中有血已成肺癰症桔梗炒貝母當歸酒浸瓜蔞仁枳殼麩炒薏苡仁桑白皮炒百合蒸各一錢五味子炒甜葶藶炒地骨皮知母炒甘草節防己黃茋杏仁各五分右水煎服地黃清肺飲治肺疳咳嗽痰喘稠粘等症馬兜鈴甘草各五分糯米炒十粒明阿膠一錢麵炒鼠粘子三分炒杏仁七枚去皮尖右每服一錢水煎清中解鬱湯治小兒脾氣虛弱飲食停滯鬱熱生痰或身發赤暈等症白术茯苓陳皮山梔炒山查神麯炒麥芽炒川芎桔梗甘草炒各五分右每服二錢水煎九味解毒湯治一切熱毒腫痛或風熱搔癢脾胃無傷者黃連三分金銀花連翹漏蘆各五分山梔四分白芷六分當歸八分防風三分甘草二分右每服二錢水煎大連翹飲治風熱熱毒表裏受患脾胃無傷發熱作渴大便祕結者連翹瞿麥荆芥木通赤芍藥蟬蛻甘草防風柴胡滑石山梔炒黃芩炒當歸各等分右每服一錢水煎犀角消毒丸治瘡瘍初起焮腫作痛熱悶已成欲作膿或膿成已潰者皆不宜用犀角薄荷連翹𤣥參各一錢牛蒡子一錢甘草三分金銀花右為末丸桐子大每服一二十丸白湯下硃砂安神丸治心神煩亂發熱怔忡少寐或寐中驚悸等症黃連一錢半生地黃當歸甘草炙各五分硃砂一錢另研右為末蒸餅丸黍米大每服十丸津咽下柴胡清肝散治肝膽三焦風熱瘡瘍或怒火增寒發熱或瘡毒結於兩耳前後或身外側至足或胸乳小腹下及兩股內側至足等症柴胡黃芩炒人參各三分山梔炒川芎各五分連翹桔梗各四分甘草三分右水煎服活血散治痘疹已出未盡煩躁不寧肚腹作疼等症白芍藥一兩酒炒紫草茸一錢半右為末每服一匙糯米湯調下神功散治一切瘡瘍腫焮作痛未成者敷之即散已潰者敷之腫痛即消黃柏炒草烏炒血竭右為末津調敷患處惺惺散治變蒸傷寒頭疼壯熱目眵多睡咳嗽喘急或痘疹已出未出疑似之間人參白术茯苓芍藥細辛桔梗甘草天花粉各等分右水薑煎服人參羌活散治傷寒時氣頭疼或痘疹兼於發表人參羌活獨活柴胡前胡桔梗茯苓枳殼川芎天麻甘草地骨皮各三分右入薄荷五葉薑水煎服參蘇飲治感冒風寒發熱咳嗽或痘瘡初起未出咳嗽等症人參紫蘇陳皮半夏茯苓枳殼麩炒桔梗炒前胡乾葛甘草各五分木香右薑水煎服升均湯治痘瘡已出不勻或吐㵼發熱作渴升麻乾葛芍藥炒人參白术炒茯苓甘草紫草如無紅花代之右每服三五錢薑水煎參茋四聖散治痘瘡已出至六七日不起發不生膿不作癢人參黃茋炒白术炒茯苓當歸芍藥炒川芎各五分紫草木通防風各三分糯米四十粒右水煎服人參透肌飲治痘瘡雖出不齊隱於肌膚間者人參紫草白术茯苓當歸芍藥木通蟬蛻甘草糯米各等分右每服三錢水煎參茋內托散治痘瘡裡虛發癢或不潰膿或為倒靨等症人參黃茋炒當歸川芎厚朴薑製防風桔梗炒白芷官桂紫草木香甘草炒右入糯米一撮水煎服仍量兒加減加味參茋术附湯治痘瘡表裏俱虛吐㵼作渴手足厥冷非犯裏虛寒戰咬牙吐㵼頭溫足冷者不可服人參三錢黃茋二錢五分白术二錢附子木香各五分當歸一錢五分川芎陳皮炒甘草炙各一錢豆蔲煨一箇茯苓乾葛各一錢半訶子二箇芍藥一錢五分糯米三十粒右每服二錢薑水煎紫草快斑湯治痘疹血氣不足不能發出色不紅活等症紫草人參白术茯苓當歸川芎芍藥木通甘草糯米右每服二錢水煎人參胃愛散治痘瘡已發未發吐㵼不止不思飲食等症人參藿香紫蘇木瓜丁香茯苓甘草糯米右每服三錢薑棗水煎紫草木香湯治痘瘡裏虛癢塌黑陷悶亂紫草木香茯苓白术人參甘草炒糯米右每服三錢水煎人參門冬飲治痘瘡發熱煩渴等症麥門冬一兩人參陳皮白术厚朴甘草各五錢右每服二三錢水煎前胡枳殼湯治痘瘡八九日間腹脹大小便不通等症前胡枳殼麩炒茯苓大黃炒甘草各等分右每服二錢水煎服如身溫脉微及㵼者不可用射干鼠粘子湯治痘瘡收斂後餘毒不盡發熱不止或咽喉腫痛或患熱毒等症升麻射干甘草各一兩右每服三錢水煎三豆飲治天行痘瘡始覺即服之多者必少少者不出等症赤小豆黑豆菉豆各一升甘草節五錢右水煮熟任兒食之七日自不發敗草散治痘瘡撾搔成瘡膿血淋漓謂之斑爛用屋爛草或蓋墻爛草多年者佳取為末搽之須多摻席上任兒坐卧紫草木通湯治痘疹出不快紫草人參木通茯苓糯米各等分甘草減半右每服二錢水煎消毒散治痘疹初起煩熱或痘後餘毒瘡腫牛蒡子炒荆芥穗甘草各五分右水煎服甘桔防風湯治痘後餘熱咽膈不利或咽舌生瘡等症桔梗炒甘草防風各一錢右水煎服甘露飲子治積熱痘後咽喉腫痛及口舌生瘡等症生地黃炒熟地黃天門冬去心麥門冬去心焙黃芩炒石斛枳殼麩炒枇杷葉茵陳甘草炙各等分右每服二錢水煎榖精草散治痘疹已靨翳膜遮障瞳子等症榖精草一兩蛤粉二兩黑豆二兩右為末用雄猪肝一葉竹刀批開摻藥在內以麻線縳定砂罐內水煮熟令兒食之化毒丹治胎毒及痘後頭面生瘡眼目腫痛或口舌生瘡口乾作渴大便堅實等症生地黃杵膏熟地黃製膏天門冬麥門冬𤣥參各三兩甘草甜硝各二兩青黛一兩五錢右為末煉蜜丸芡實大每服一丸白湯化下大如聖飲子治瘡疹癍痘毒攻咽嗌腫痛熱渴或成腫毒不消等症麥門冬五錢桔梗甘草鼠粘子炒各一兩右每服二錢水煎宣風散治驚風檳榔二箇陳皮甘草各等分牽牛四兩生半炒半右為末每服五分蜜湯調下木香散治小兒腹脹瀉渴等症木香大腹皮人參桂心赤茯苓青皮前胡訶梨勒半夏姜製丁香甘草炙各等分右每服二錢薑水煎雄黃解毒散治痘瘡後牙疳口臭或走馬疳齦頰蝕爛或肢體成痘疳凹陷不愈雄黃一兩銅碌二錢五分右為末用米泔水洗淨乾滲患處口內不可用絲瓜湯治痘瘡毒絲瓜升麻芍藥酒浸甘草黑豆赤小豆犀角鎊右水煎服四聖散治痘疹出不快及倒靨紫草茸木通甘草炙枳殼麩炒黃茋各等分右每服二錢水煎獨聖散治痘瘡倒靨陷伏用穿山甲取前足嘴上者燒存性為末以木香湯入少酒服之快透散治痘瘡出不快等症紫草蟬蛻人參木通芍藥甘草炙各等分右每服二錢水煎鼠粘子湯治癍疹稠密身熱等症鼠粘子炒當歸甘草炙各一錢柴胡連翹黃芩黃茋各一錢半地骨皮二錢右每服二錢水煎紫草散治痘疹黑陷氣血虛弱瘡疹不起紫草甘草黃茋炙糯米各一錢半右水煎服益元散治痘疹初起煩躁作渴等症滑石六兩甘草一兩右各另為末每服五六分白湯調下粉紅丸治心虛困卧驚動痰涎不利或發熱痰嗽等症天南星硃砂一錢五分天竺黃五錢龍腦一錢胭脂一錢右用牛膽汁和丸芡實大每服一丸砂糖湯下製附子法附子重一兩三四錢有蓮花瓣頭圓底平者先備童便五六碗將附子先放在竈上煙匱中間良久乘熱投入童便浸五七日候潤透揭皮切四塊仍浸二三日用粗紙數層包之浸濕埋灰火半日取出切片檢視有白星者乃用瓦上炙熟至無白星為度如急用即切大片用童便煮二三沸熱瓦熟用之薛氏醫案卷二十五
