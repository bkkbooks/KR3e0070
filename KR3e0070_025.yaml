body:
  text: 薛氏醫案卷二十五明薛已訂明醫雜著附方補中益氣湯治中氣不足或誤服尅伐四肢倦怠口乾發熱飲食無味或飲食失節勞倦身熱脉洪大而無力或頭痛惡寒自汗或氣髙而喘身熱而煩脉微細軟弱自汗體倦少食或中氣虛弱而不能攝血或飲食勞倦而患瘧痢或瘧痢等病因脾胃虛而不能愈者或元氣虛弱感冐風寒不勝發表宜用此代之或入房而後勞役感冐或勞役感冐而後入房者急加附子愚謂人之一身以脾胃為主脾胃氣實則肺得其所養肺氣既盛水自生焉水升則火降水火既濟而成天地交泰之令矣脾胃一虛四臟俱無生氣故東垣先生著脾胃内外傷等論諄諄然皆以固脾胃為本所製補中益氣湯又冠諸方之首觀其立方本㫖可知矣故曰補腎不若補脾正此謂也前所言治症槩舉其畧餘當倣此而類推之是矣附方之首并註以表明之人參黄茋炒白术炒甘草炙各一錢五分當歸一錢陳皮五分柴胡升麻各三分右薑棗水煎空心午前服八珍湯治肝脾傷損血氣虛弱惡寒發熱或煩躁作渴或寒熱昏憒或胸膈不利大便不實或飲食少思小腹脹痛等症甘草炙五分人參白术白茯苓當歸川芎白芍藥熟地黄各一錢右薑棗水煎服十全大補湯治氣血俱虛發熱惡寒自汗盗汗肢體倦怠或頭痛眩暈口乾作渴又治乆病虛損口乾食少咳而下利驚悸發熱或寒熱往來盗汗自汗晡熱内熱遺精白濁或二便見血小腹作痛小便短少大便乾濇或大便滑泄肛門下墜小便頻數隂莖痒痛等症即八珎湯加黄茋肉桂各一錢四物湯治血虛發熱或寒熱往來或日晡發熱頭目不清或煩躁不寐胸膈作脹或脇作痛尤當服之芍藥二錢川芎一錢五分當歸熟地黄各三錢右水煎服加味四物湯即前方加山梔柴胡牡丹皮四君子湯治脾胃虛弱飲食少思或大便不實體痩面黄或胸膈虛痞痰𠻳吞酸或脾胃虛弱善患瘧痢等症人參白术茯苓各二錢甘草炙一錢右薑棗水煎服六君子湯治脾胃虛弱飲食少思或乆患瘧痢若覺内熱或飲食難化作酸屬虛火須加炮薑其功甚速即前方加半夏陳皮香砂六君子湯即六君加香附子藿香砂仁歸脾湯治思慮傷脾不能攝血致血妄行或健忘怔忡驚悸盗汗或心脾作痛嗜卧少食或大便不調或肢體腫痛或思慮傷脾而患瘧疾大凡懐抱鬰結而患諸症或因用藥失宜尅伐傷胃變諸别症者最宜用之逺志一錢酸棗仁二錢木香五分甘草炙五分當歸人參白术白茯苓黄耆龍眼肉各二錢右薑棗水煎服加味歸脾湯即前方加牡丹皮山梔各一錢治脾經血虛發熱等症加味逍遙散治脾肝血虛發熱或耳内及胸乳腹脹小便不利當歸白术茯神芍藥甘草柴胡各一錢牡丹皮山梔各七分右薑水煎服逍遙散即前方去山梔牡丹皮六味丸一名地黄丸一名腎氣丸治腎虛作渴小便淋秘氣壅痰涎頭目眩暈眼花耳聾咽燥舌痛齒痛腰腿痿軟等症及腎虛發熱自汗盗汗便血諸血失音水泛為痰之聖藥血虛發熱之神劑又治腎隂虛弱津液不降敗濁為痰或致欬逆又治小便不禁収精氣之虛脱為養氣滋腎制火導水使機闗利而脾土健實牡丹皮白茯苓澤㵼各三兩熟地黄八兩杵膏山茱茰肉乾山藥各四兩右各另為末和地黄加煉蜜丸桐子大毎服七八十丸空心食前滚湯下八味丸治命門火衰不能生土以致脾胃虛寒飲食少思大便不實或下元冷憊臍腹疼痛夜多漩溺即前方加肉桂附子各一兩經云益火之源以消隂翳即此藥也加減八味丸治腎水不足虛火上炎發熱作渴口舌生瘡或牙齦潰蝕咽喉作痛或形體憔悴寢汗發熱五臟齊損即六味丸加肉桂一兩五味子四兩加減金匱腎氣丸治脾腎虛腰重脚腫小便不利或肚腹腫脹四肢浮腫或喘急痰盛已成蠱症其效如神此症多因脾胃虛弱治失其宜元氣復傷而變症者非此藥不能救白茯苓三兩附子五錢川牛膝桂澤㵼車前子山茱茰山藥牡丹皮各一兩熟地黄四兩搯碎酒拌杵膏右為末和地黄加煉蜜丸桐子大毎服七八十丸空心米飲下還少丹治脾腎虛寒飲食少思發熱盗汗遺精白濁又治眞氣虧損肌體痩弱等症肉蓯蓉逺志茴香巴㦸乾山藥枸杞子熟地黄石菖蒲山茱茰牛膝杜仲薑製楮實子五味子白茯苓各二兩右各另為末用棗肉百枚并煉蜜丸桐子大毎服五七十丸空心温酒或鹽湯下日三服十補丸治腎臟虛冷面黒足寒耳聾膝軟小便不利等症附子炮五味各二兩山茱茰山藥牡丹皮鹿茸製桂心茯苓澤㵼各一兩右為末煉蜜丸桐子大毎服六七十丸鹽湯下當歸補血湯治血氣損傷或妄服峻劑致氣血益虛肌熱大渴引飲目赤面紅脉洪大而虛重按全無此病多得於飢飽勞役者黄耆炙一兩當歸三錢酒製右水煎服人參養榮湯治脾肺俱虛發熱惡寒肢體痩倦食少作㵼等症又治乆病虛損口乾食少欬而下痢心驚悸熱而自汗等症人參陳皮黄茋蜜炙桂心當歸白术甘草炙各一錢白芍藥一錢五分熟地黄五味子炒茯苓各七分半逺志五分右薑棗水煎服參术膏治中氣虛弱諸藥不應或因用藥失宜耗傷元氣虛症蜂起但用此藥補其中氣諸症自愈人參白术各等分右水煎稠湯化服之濟隂地黄丸治足三隂虧損虛火上炎致目睛散大視物不的或昏花澁緊作痛畏明或卒見非常之處等症其功效與六味還少丹相似五味子麥門冬當歸熟地黄肉蓯蓉山茱茰乾山藥枸杞子甘菊花巴㦸肉各等分右為末煉蜜丸桐子大毎服七八十丸空心白湯下滋隂補腎丸治肝腎陽虛隂弱虛火上炎目視昏花或至夜昏暗𦂳澁仍治六味丸所主之症熟地黄三兩牡丹皮五錢生地黄四兩澤㵼茯苓各二兩半當歸尾山茱茰柴胡五味子乾山藥各五錢右為末煉蜜丸桐子大毎服五七十丸鹽湯下益氣聰明湯治飲食不節勞役形體脾胃不足内障耳鳴或多年目昏暗視物不能此藥能令人目光大乆服無内障耳鳴耳聾之患又令精神過倍元氣自益身輕體健耳目聰明黄茋甘草人參各五錢蔓荆子一錢五分升麻葛根各三錢芍藥黄栢酒炒各一錢右毎服三錢水煎服神效黄茋湯治渾身麻木不仁或左右身麻木或頭面手臂腿脚麻木不仁者並皆服之如耳目𦂳急縮小及羞明畏日或癮濇難開或視物無力睛痛手不得近或目中如火等症蔓荆子一錢橘紅五分人參八錢黄耆二兩甘草炙白芍藥各一兩右毎服五錢水煎臨卧服助陽活血湯治眼發之後猶有上熱白睛赤色癮澁難開而多眵淚等症蔓荆子二分香白芷三分柴胡黄茋甘草炙當歸酒洗防風各五分升麻七分右水煎服芍藥清肝散治眵多眊燥𦂳澁羞明赤脉貫睛臟腑秘結者白术甘草川芎防風荆芥桔梗羌活各三分芍藥柴胡前胡薄荷黄芩各二分半山梔知母滑石石膏各二分大黄四分芒硝二分半右水煎服黄連天花粉丸治症同上黄連菊花川芎薄荷各一兩天花粉連翹黄芩梔子各四兩黄栢二兩右為末丸桐子大毎服五十丸加至百丸茶湯下連翹飲子治目赤隐澁𦂳小乆視昏花迎風有淚等症蔓荆子生甘草連翹各三分柴胡二分黄芩五分生地黄當歸紅葵花人參各三分黄茋防風羌活各五分升麻一錢右水煎服若中氣不足而致前症用神效黄茋湯或補中益氣湯地芝丸治目不能逺視能近視或妨近視乃隂氣不足陽氣有餘也宜用此方生地焙乾四兩天門冬枳殻麩炒甘菊花各二兩右為末煉蜜丸桐子大毎服百丸茶清或温酒下定志丸治目不能近視反能逺視乃陽氣不足而隂血有餘也宜此主之白茯苓人參各二兩逺志菖蒲各一兩右為末煉蜜丸桐子大以硃砂為衣毎服十丸至三十丸米飲下决明夜光散治目夜昏雖有燈月亦不能視猪肝一兩生用石决明夜明砂各二錢右為末以竹刀切肝二片鋪藥於内合之用麻皮縳定米泔水一碗砂罐煑至半碗臨臥連肝藥汁服柴胡清肝散治肝膽二經風熱怒火頸項腫痛結核不消或寒熱往來嘔吐痰水又治婦人暴怒肝火内動經水妄行胎氣不安等症柴胡黄芩炒各一錢黄連炒山梔炒各七分當歸一錢川芎六分生地黄牡丹皮各一錢升麻八分甘草三分右水煎服若脾胃弱去芩連加苓左金丸治肝火脇肋刺痛或發寒熱或頭目作痛泄㵼淋秘一切肝火之症並皆治之黄連六兩呉茱茰一兩湯煑片時用右為末粥丸白术陳皮湯下小柴胡湯治肝膽經風熱或寒熱往來或晡熱潮熱或怒火口苦耳聾咳𠻳㵼利脇腹作痛諸症柴胡二錢黄芩一錢五分人參半夏各七分甘草炙五分右水煎服加味小柴胡湯即前方加山梔牡丹皮犀角升麻湯治風熱頭面腫痛或咽喉不利時毒等症犀角鎊七錢升麻五錢防風羌活各五錢半甘草一錢五分白芷黄芩白附子各二錢半右每服七錢水煎越鞠丸治六鬰飲食少思或胸滿吐酸齒痛瘡疥等症蒼术炒神麯炒香附子山查山梔炒撫芎麥芽炒各等分右為末水調神麯糊丸桐子大每服五七十丸白滚湯下平胃散治胃氣壅滯胸膈不利或飲食停滯吞酸噯腐或嘔吐不食等症蒼术厚朴製陳皮各一錢甘草四分右水煎服異功散治脾胃虛弱飲食少思或乆患咳𠻳面浮氣逆腹滿等症人參白术炒甘草炒茯苓陳皮各一錢右薑棗水煎服二陳湯治脾胃虛弱中腕停痰或嘔吐惡心或頭目不清飲食少思等症陳皮半夏茯苓各一錢甘草炙右薑水煎服小半夏湯治嘔吐風痰水飲半夏姜製五錢茯苓三錢右入薑汁水煎服丁香茱茰湯治胃氣虛寒致嘔吐噦咽膈不通等症丁香橘皮柴胡甘草炙各五錢呉茱茰蒼术人參各一錢升麻七分黄栢三分草蔲仁黄茋各二錢當歸一錢五分右毎服五錢水煎理中化痰丸治脾胃虛寒痰涎内停嘔吐少食或大便不實飲食難化咳唾痰涎此屬中氣虛弱不能統涎歸源也人參白术炒乾薑甘草炙茯苓半夏薑製右為末丸桐子大毎服四五十丸白滚湯下牛黄抱龍丸治風痰壅盛或咳𠻳發熱或發抽搐等症牛黄雄黄辰砂天竺黄各四錢麝香一錢牛膽南星右為末甘草湯糊丸龍眼核大毎服一丸薑湯下柴芍參苓散治脾胃不和飲食少進嘔吐泄㵼凡病後宜服調理柴胡芍藥人參白术茯苓陳皮當歸各五分甘草牡丹皮山梔炒各三分右為末毎服一錢白湯下或作丸服五味子湯治咳𠻳皮膚乾燥唾中有血胸膈疼痛五味子炒桔梗炒紫苑甘草炒續斷各五分竹茹一錢赤小豆一撮生地黄二錢桑白皮炒二錢右水煎服人參平脉散治心火尅肺咳𠻳喘嘔痰涎壅盛胸膈痞滿人參橘紅甘草炙地骨皮各五分茯苓知母炒各七分五味子炒青皮天門冬各四分桑白皮炒一錢右水煎服麥門冬湯治火熱乘肺咳𠻳有血胸膈脹滿五心煩熱等症麻黄七分麥門冬桑白皮炒生地黄各一錢半夏紫苑桔梗淡竹葉各七分五味子甘草各五分右薑水煎服金沸草散治肺經受風頭目昏疼咳𠻳聲重涕唾稠粘等症荆芥穗一錢前胡麻黄旋覆花各七分甘草赤芍藥半夏各五分右薑棗水煎服柴胡桂枝湯治傷風發熱自汗或痰氣上攻等症桂枝二錢黄芩炒人參白芍藥炒各錢半甘草炙半夏薑製生薑各一錢柴胡四錢大棗二枚右作二劑水煎服竹葉歸茋湯治胃氣虛熱口乾作渴惡冷飲食者竹葉一錢五分當歸一錢黄茋二錢白术人參各一錢麥門冬七分甘草炒五分右水煎服竹葉石膏湯治胃火作渴石膏人參甘草各一錢半夏一錢五分竹葉麥門冬各五分右薑水煎服七味白术散一名白术散治中氣虧損津液不足舌乾口燥不喜飲冷或吐㵼後作渴最宜服之人參白术木香白茯苓甘草藿香各五分乾葛一錢右水煎服凉膈散治上焦積熱煩渴面赤頭昏咽燥齒痛口瘡便溺赤濇並宜服之大黄朴硝甘草各一兩連翹四兩山