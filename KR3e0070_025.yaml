body:
  text: 薛氏醫案卷二十五明薛已訂明醫雜著附方補中益氣湯治中氣不足或誤服尅伐四肢倦怠口乾發熱飲食無味或飲食失節勞倦身熱脉洪大而無力或頭痛惡寒自汗或氣髙而喘身熱而煩脉微細軟弱自汗體倦少食或中氣虛弱而不能攝血或飲食勞倦而患瘧痢或瘧痢等病因脾胃虛而不能愈者或元氣虛弱感冒風寒不勝發表宜用此代之或入房而後勞役感冒或勞役感冒而後入房者急加附子愚謂人之一身以脾胃為主脾胃氣實則肺得其所養肺氣既盛水自生焉水升則火降水火既濟而成天地交泰之令矣脾胃一虛四臟俱無生氣故東垣先生著脾胃內外傷等論諄諄然皆以固脾胃為本所製補中益氣湯又冠諸方之首觀其立方本㫖可知矣故曰補腎不若補脾正此謂也前所言治症槩舉其略餘當倣此而類推之是矣附方之首并注以表明之人參黃茋炒白术炒甘草炙各一錢五分當歸一錢陳皮五分柴胡升麻各三分右薑棗水煎空心午前服八珍湯治肝脾傷損血氣虛弱惡寒發熱或煩躁作渴或寒熱昏憒或胸膈不利大便不實或飲食少思小腹脹痛等症甘草炙五分人參白术白茯苓當歸川芎白芍藥熟地黃各一錢右薑棗水煎服十全大補湯治氣血俱虛發熱惡寒自汗盜汗肢體倦怠或頭痛眩暈口乾作渴又治久病虛損口乾食少咳而下利驚悸發熱或寒熱往來盜汗自汗晡熱內熱遺精白濁或二便見血小腹作痛小便短少大便乾澀或大便滑泄肛門下墜小便頻數隂莖癢痛等症即八珍湯加黃茋肉桂各一錢四物湯治血虛發熱或寒熱往來或日晡發熱頭目不清或煩躁不寐胸膈作脹或脅作痛尤當服之芍藥二錢川芎一錢五分當歸熟地黃各三錢右水煎服加味四物湯即前方加山梔柴胡牡丹皮四君子湯治脾胃虛弱飲食少思或大便不實體瘦面黃或胸膈虛痞痰嗽吞酸或脾胃虛弱善患瘧痢等症人參白术茯苓各二錢甘草炙一錢右薑棗水煎服六君子湯治脾胃虛弱飲食少思或久患瘧痢若覺內熱或飲食難化作酸屬虛火須加炮薑其功甚速即前方加半夏陳皮香砂六君子湯即六君加香附子藿香砂仁歸脾湯治思慮傷脾不能攝血致血妄行或健忘怔忡驚悸盜汗或心脾作痛嗜卧少食或大便不調或肢體腫痛或思慮傷脾而患瘧疾大凡懷抱鬱結而患諸症或因用藥失宜尅伐傷胃變諸别症者最宜用之逺志一錢酸棗仁二錢木香五分甘草炙五分當歸人參白术白茯苓黃耆龍眼肉各二錢右薑棗水煎服加味歸脾湯即前方加牡丹皮山梔各一錢治脾經血虛發熱等症加味逍遙散治脾肝血虛發熱或耳內及胸乳腹脹小便不利當歸白术茯神芍藥甘草柴胡各一錢牡丹皮山梔各七分右薑水煎服逍遙散即前方去山梔牡丹皮六味丸一名地黃丸一名腎氣丸治腎虛作渴小便淋祕氣壅痰涎頭目眩暈眼花耳聾咽燥舌痛齒痛腰腿痿軟等症及腎虛發熱自汗盜汗便血諸血失音水泛為痰之聖藥血虛發熱之神劑又治腎隂虛弱津液不降敗濁為痰或致咳逆又治小便不禁收精氣之虛脫為養氣滋腎制火導水使機關利而脾土健實牡丹皮白茯苓澤㵼各三兩熟地黃八兩杵膏山茱茰肉乾山藥各四兩右各另為末和地黃加煉蜜丸桐子大每服七八十丸空心食前滚湯下八味丸治命門火衰不能生土以致脾胃虛寒飲食少思大便不實或下元冷憊臍腹疼痛夜多漩溺即前方加肉桂附子各一兩經云益火之源以消隂翳即此藥也加減八味丸治腎水不足虛火上炎發熱作渴口舌生瘡或牙齦潰蝕咽喉作痛或形體憔悴寢汗發熱五臟齊損即六味丸加肉桂一兩五味子四兩加減金匱腎氣丸治脾腎虛腰重腳腫小便不利或肚腹腫脹四肢浮腫或喘急痰盛已成蠱症其效如神此症多因脾胃虛弱治失其宜元氣復傷而變症者非此藥不能救白茯苓三兩附子五錢川牛膝桂澤㵼車前子山茱茰山藥牡丹皮各一兩熟地黃四兩搯碎酒拌杵膏右為末和地黃加煉蜜丸桐子大每服七八十丸空心米飲下還少丹治脾腎虛寒飲食少思發熱盜汗遺精白濁又治真氣虧損肌體瘦弱等症肉蓯蓉逺志茴香巴㦸乾山藥枸杞子熟地黃石菖蒲山茱茰牛膝杜仲薑製楮實子五味子白茯苓各二兩右各另為末用棗肉百枚并煉蜜丸桐子大每服五七十丸空心溫酒或鹽湯下日三服十補丸治腎臟虛冷面黑足寒耳聾膝軟小便不利等症附子炮五味各二兩山茱茰山藥牡丹皮鹿茸製桂心茯苓澤㵼各一兩右為末煉蜜丸桐子大每服六七十丸鹽湯下當歸補血湯治血氣損傷或妄服峻劑致氣血益虛肌熱大渴引飲目赤面紅脉洪大而虛重按全無此病多得於飢飽勞役者黃耆炙一兩當歸三錢酒製右水煎服人參養榮湯治脾肺俱虛發熱惡寒肢體瘦倦食少作㵼等症又治久病虛損口乾食少咳而下痢心驚悸熱而自汗等症人參陳皮黃茋蜜炙桂心當歸白术甘草炙各一錢白芍藥一錢五分熟地黃五味子炒茯苓各七分半逺志五分右薑棗水煎服參术膏治中氣虛弱諸藥不應或因用藥失宜耗傷元氣虛症蜂起但用此藥補其中氣諸症自愈人參白术各等分右水煎稠湯化服之濟隂地黃丸治足三隂虧損虛火上炎致目睛散大視物不的或昏花澀緊作痛畏明或卒見非常之處等症其功效與六味還少丹相似五味子麥門冬當歸熟地黃肉蓯蓉山茱茰乾山藥枸杞子甘菊花巴㦸肉各等分右為末煉蜜丸桐子大每服七八十丸空心白湯下滋隂補腎丸治肝腎陽虛隂弱虛火上炎目視昏花或至夜昏暗緊澀仍治六味丸所主之症熟地黃三兩牡丹皮五錢生地黃四兩澤㵼茯苓各二兩半當歸尾山茱茰柴胡五味子乾山藥各五錢右為末煉蜜丸桐子大每服五七十丸鹽湯下益氣聰明湯治飲食不節勞役形體脾胃不足內障耳鳴或多年目昏暗視物不能此藥能令人目光大久服無內障耳鳴耳聾之患又令精神過倍元氣自益身輕體健耳目聰明黃茋甘草人參各五錢蔓荆子一錢五分升麻葛根各三錢芍藥黃柏酒炒各一錢右每服三錢水煎服神效黃茋湯治渾身麻木不仁或左右身麻木或頭面手臂腿腳麻木不仁者並皆服之如耳目緊急縮小及羞明畏日或癮澀難開或視物無力睛痛手不得近或目中如火等症蔓荆子一錢橘紅五分人參八錢黃耆二兩甘草炙白芍藥各一兩右每服五錢水煎臨卧服助陽活血湯治眼發之後猶有上熱白睛赤色癮澀難開而多眵淚等症蔓荆子二分香白芷三分柴胡黃茋甘草炙當歸酒洗防風各五分升麻七分右水煎服芍藥清肝散治眵多眊燥緊澀羞明赤脉貫睛臟腑祕結者白术甘草川芎防風荆芥桔梗羌活各三分芍藥柴胡前胡薄荷黃芩各二分半山梔知母滑石石膏各二分大黃四分芒硝二分半右水煎服黃連天花粉丸治症同上黃連菊花川芎薄荷各一兩天花粉連翹黃芩梔子各四兩黃柏二兩右為末丸桐子大每服五十丸加至百丸茶湯下連翹飲子治目赤隱澀緊小久視昏花迎風有淚等症蔓荆子生甘草連翹各三分柴胡二分黃芩五分生地黃當歸紅葵花人參各三分黃茋防風羌活各五分升麻一錢右水煎服若中氣不足而致前症用神效黃茋湯或補中益氣湯地芝丸治目不能逺視能近視或妨近視乃隂氣不足陽氣有餘也宜用此方生地焙乾四兩天門冬枳殼麩炒甘菊花各二兩右為末煉蜜丸桐子大每服百丸茶清或溫酒下定志丸治目不能近視反能逺視乃陽氣不足而隂血有餘也宜此主之白茯苓人參各二兩逺志菖蒲各一兩右為末煉蜜丸桐子大以硃砂為衣每服十丸至三十丸米飲下决明夜光散治目夜昏雖有燈月亦不能視猪肝一兩生用石决明夜明砂各二錢右為末以竹刀切肝二片鋪藥於內合之用麻皮縳定米泔水一碗砂罐煮至半碗臨臥連肝藥汁服柴胡清肝散治肝膽二經風熱怒火頸項腫痛結核不消或寒熱往來嘔吐痰水又治婦人暴怒肝火內動經水妄行胎氣不安等症柴胡黃芩炒各一錢黃連炒山梔炒各七分當歸一錢川芎六分生地黃牡丹皮各一錢升麻八分甘草三分右水煎服若脾胃弱去芩連加苓左金丸治肝火脅肋刺痛或發寒熱或頭目作痛泄㵼淋祕一切肝火之症並皆治之黃連六兩吳茱茰一兩湯煮片時用右為末粥丸白术陳皮湯下小柴胡湯治肝膽經風熱或寒熱往來或晡熱潮熱或怒火口苦耳聾咳嗽㵼利脅腹作痛諸症柴胡二錢黃芩一錢五分人參半夏各七分甘草炙五分右水煎服加味小柴胡湯即前方加山梔牡丹皮犀角升麻湯治風熱頭面腫痛或咽喉不利時毒等症犀角鎊七錢升麻五錢防風羌活各五錢半甘草一錢五分白芷黃芩白附子各二錢半右每服七錢水煎越鞠丸治六鬱飲食少思或胸滿吐酸齒痛瘡疥等症蒼术炒神麯炒香附子山查山梔炒撫芎麥芽炒各等分右為末水調神麯糊丸桐子大每服五七十丸白滚湯下平胃散治胃氣壅滯胸膈不利或飲食停滯吞酸噯腐或嘔吐不食等症蒼术厚朴製陳皮各一錢甘草四分右水煎服異功散治脾胃虛弱飲食少思或久患咳嗽面浮氣逆腹滿等症人參白术炒甘草炒茯苓陳皮各一錢右薑棗水煎服二陳湯治脾胃虛弱中腕停痰或嘔吐惡心或頭目不清飲食少思等症陳皮半夏茯苓各一錢甘草炙右薑水煎服小半夏湯治嘔吐風痰水飲半夏姜製五錢茯苓三錢右入薑汁水煎服丁香茱茰湯治胃氣虛寒致嘔吐噦咽膈不通等症丁香橘皮柴胡甘草炙各五錢吳茱茰蒼术人參各一錢升麻七分黃柏三分草蔲仁黃茋各二錢當歸一錢五分右每服五錢水煎理中化痰丸治脾胃虛寒痰涎內停嘔吐少食或大便不實飲食難化咳唾痰涎此屬中氣虛弱不能統涎歸源也人參白术炒乾薑甘草炙茯苓半夏薑製右為末丸桐子大每服四五十丸白滚湯下牛黃抱龍丸治風痰壅盛或咳嗽發熱或發抽搐等症牛黃雄黃辰砂天竺黃各四錢麝香一錢牛膽南星右為末甘草湯糊丸龍眼核大每服一丸薑湯下柴芍參苓散治脾胃不和飲食少進嘔吐泄㵼凡病後宜服調理柴胡芍藥人參白术茯苓陳皮當歸各五分甘草牡丹皮山梔炒各三分右為末每服一錢白湯下或作丸服五味子湯治咳嗽皮膚乾燥唾中有血胸膈疼痛五味子炒桔梗炒紫苑甘草炒續斷各五分竹茹一錢赤小豆一撮生地黃二錢桑白皮炒二錢右水煎服人參平脉散治心火尅肺咳嗽喘嘔痰涎壅盛胸膈痞滿人參橘紅甘草炙地骨皮各五分茯苓知母炒各七分五味子炒青皮天門冬各四分桑白皮炒一錢右水煎服麥門冬湯治火熱乘肺咳嗽有血胸膈脹滿五心煩熱等症麻黃七分麥門冬桑白皮炒生地黃各一錢半夏紫苑桔梗淡竹葉各七分五味子甘草各五分右薑水煎服金沸草散治肺經受風頭目昏疼咳嗽聲重涕唾稠粘等症荆芥穗一錢前胡麻黃旋覆花各七分甘草赤芍藥半夏各五分右薑棗水煎服柴胡桂枝湯治傷風發熱自汗或痰氣上攻等症桂枝二錢黃芩炒人參白芍藥炒各錢半甘草炙半夏薑製生薑各一錢柴胡四錢大棗二枚右作二劑水煎服竹葉歸茋湯治胃氣虛熱口乾作渴惡冷飲食者竹葉一錢五分當歸一錢黃茋二錢白术人參各一錢麥門冬七分甘草炒五分右水煎服竹葉石膏湯治胃火作渴石膏人參甘草各一錢半夏一錢五分竹葉麥門冬各五分右薑水煎服七味白术散一名白术散治中氣虧損津液不足舌乾口燥不喜飲冷或吐㵼後作渴最宜服之人參白术木香白茯苓甘草藿香各五分乾葛一錢右水煎服凉膈散治上焦積熱煩渴面赤頭昏咽燥齒痛口瘡便溺赤澀並宜服之大黃朴硝甘草各一兩連翹四兩山