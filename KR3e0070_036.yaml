body:
  text: 薛氏醫案卷三十六明薛己訂婦人良方姙娠疾病門胎後已明須知姙娠疾病故以次之姙娠諸病忌毒藥餘當對症依法治之姙娠隨月服藥將息法第一千金云姙娠一月名始胚飲食精熟酸美受御宜食大麥毋食腥辛是謂讒正是月足厥隂脈養不可針灸其經此經内屬于肝肝主筋血一月之内血行否澀不為力事寢必安静毋令恐畏况一月隂陽新合為胎寒多為痛熱多卒驚舉重腰痛腹滿胞急卒有所下當預安之宜服烏雄雞湯烏雄雞湯方烏雄雞一隻治如食法吳茱茰一兩茯苓阿膠各二兩炒生薑甘草各一兩人參芍藥白术各三兩麥門冬五合去心右以水一斗二升煮雞取汁六升下藥煮取三升内酒三升并膠等取汁三升分三服補胎湯若曾傷一月胎者當預服此藥細辛一兩防風二兩烏梅升吳茱茰生地黄白术各一兩大夾夕五合生薑四兩右以水七升煮取汁二升半分三服寒多倍細辛茱茰熱多去細辛茱茰加括蔞根二兩有所思去大麥加栢子仁三合一方有人參一兩忌生菜蕪荑桃李雀肉等物姙娠二月足少陽脈養不可針灸其經此經内屬于膽膽主精是時兒精成于胞裡當謹䕶勿驚動况二月始隂陽踞經有寒不成有熱即萎卒中風寒有所動揺心滿臍下懸急腰背强痛卒有所下乍寒乍熱艾葉湯主之艾葉湯方丹參三兩當歸人參麻黄去節艾葉阿膠炙各二兩甘草一兩炙大棗十二枚擘生薑六兩右以酒三升水一㪷内藥煮減半去滓内膠煎取三升分三服忌海藻菘菜黄連湯若曾傷二月胎者當預服此藥黄連人參各一兩吳茱茰五合生地黄五兩生薑三兩右以醋漿七升煮取三升分四服日三夜一每十日作一劑若覺不安加烏梅一升加烏梅者不用漿直用水忌猪肉冷水蕪荑一方加當歸半兩姙娠三月名始胎當此之時未有定儀見物而化欲生男者操弓矢欲生女者弄珠璣欲子美數視璧玉欲子賢良端正清虚是謂外象而内感者也是月手心主脈養不可鍼灸其經此經内屬于心毋悲哀思慮驚動盖三月為定形有寒則大便清有熱則小便難不赤即黄卒驚恐憂愁瞋恚喜頓仆動于經脈腹滿繞臍苦痛腰背痛卒有所下宜服雄雞湯雄雞湯方雄雞一隻治如食法甘草炙茯苓人參阿膠各二兩炒黄芩白术各一兩芍藥四兩大棗十二枚擘生薑一兩切麥門冬去心五合右以水一斗五升煮雞減半内藥煮取一半入清酒三升并膠再煎取三升分三服日飲盡忌海藻菘菜酢物桃李雀肉等一方有當歸川芎二兩無黄芩生薑茯神湯若曾傷三月胎者當預服此藥茯神丹參龍骨各一兩阿膠炒當歸甘草炙人參各二兩赤小豆大棗十二枚擘右酢漿一斗煑取三升分四服七日後服一劑腰痛加桑寄生二兩深師方有薤白二兩麻子一升忌同前姙娠四月以受水精始成血脈其食稻粳其羮魚鴈是謂成血氣以通耳目而行經絡是月手少陽脈養不可針灸其經此經内輸三焦其時兒六腑順成當静形體和心志節飲食蓋四月為離經有寒心下溫溫欲嘔胸滿不食小便如淋臍下苦急卒中風寒頸項强痛寒熱或驚動身軀腰背腹痛或時胎上胸煩不安卒有所下宜服菊花湯主之菊花湯方菊花如雞子大一枚麥門冬去心一升麻黄去節阿膠炙各三兩生薑五兩甘草炙當歸半夏洗各二兩人參一兩五錢大棗十二枚擘右以水八升煮減一半内清酒三升并阿膠煎取三升分三服温卧當汗以粉撲之䕶風寒四五日忌食如前調中湯芍藥四兩甘草炙芎藭續斷各一兩柴胡白术各三兩烏梅一升李根白皮三兩當歸一兩五錢生薑四兩厚朴炙枳實炙各二兩右以水一斗煑取三升分四服日三夜一八日再服一劑一方有半夏二兩忌海藻菘菜桃李雀肉姙娠五月始受人精以成其氣晏起沐浴浣衣居處必厚其衣裳朝吸天光以避寒殃其食稻麥其羮牛羊和茱茰調以五味是謂養氣以定五臓是月足太隂脈養不可鍼灸其經此經内輸于脾其時兒四肢成無大饑無甚飽無食乾燥無自炙熱無大勞倦蓋五月毛髮初生有熱苦頭眩心亂嘔吐有寒則腹滿痛小便數卒有恐怖四肢疼痛寒熱胎動無常處腹痛頓欲仆卒有所下宜服阿膠湯又名旋覆花湯主之阿膠湯方阿膠四兩炙人參一兩生薑六兩麥門冬去心一升吴茱茰七合旋覆花當歸芍藥甘草炙黄芩各二兩右以水九升煮取一半内清酒三升并阿膠微火煎取三升半分四服日三夜一先食後服便愈不差更服忌海藻菘菜安中湯若曾傷五月胎者當預服此方甘草炙芍藥各三兩當歸人參生地黄芎藭各二兩五味子五合生薑六兩麥門冬去心一升大麻仁五合大棗三十五枚擘黄芩一兩右以水七升清酒五升煑取三升半分四服日三夜一七日再服一劑忌如前安胎當歸湯若姙娠五月舉動愕胎不安小腹痛引腰絡小便下血當歸阿膠炒芎藭人參各一兩大棗十二枚艾一把右以酒水各三升煑至三升去滓内膠令烊分三服一方有甘草無參棗姙娠六月始受金精以成筋身欲微勞無得静處出遊于野數視走犬走馬食忌鷙鳥猛獸之肉是謂變腠理紉筋以養其力以堅背膂是月足陽明脈養不可針灸其經此經内屬于胃主其口目蓋六月之時兒口目皆成調五味食甘美毋大飽六月卒有所不安寒熱往来腹内脹滿體腫驚怖忽有所下腹痛如欲産手足煩疼宜服麥門冬湯麥門冬湯方甘草炙人參各一兩生地黄三兩麥門冬去心一升黄芩二兩阿膠炒四兩生薑六兩大棗十五枚擘右以水七升煮減半内清酒二升并膠煎取三升分三服如人行三四里進糜粥忌海藻菘菜蕪荑柴胡湯若曾傷六月胎者當預服之柴胡四兩芍藥一方作紫蔵白术甘草炙各二兩麥門冬三兩去心蓯蓉一兩芎藭二兩生地黄五兩生薑六兩大棗三十枚擘右以水一斗煮取三升分四服日三夜一仍進糜粥七日更服一劑忌海藻菘菜蕪荑桃李雀肉等一方有黄芩二兩旋覆花湯亦名阻病集驗療姙娠六七月胎不安常處旋覆花一兩厚朴製白术枳殻黄芩炒茯苓各三兩半夏炒一方無芍藥生薑各二兩右以水一斗煮取二升半先食分五服日三夜二忌羊肉餳醋桃李雀肉等千金同姙娠七月始受木精以成骨勞身摇肢無使定止動作屈伸以運血氣自此後居處必節飲食避寒暑食粳稻以密腠理是謂養骨而堅齒是月手太隂脈養不可鍼灸其經此經内屬于肺主皮毛是時兒皮毛已成無大言無號哭無薄衣無洗浴無寒飲若忽驚恐揺動腹痛卒有所下手足厥隂脈若傷寒煩熱腹滿短氣常苦頸項腰背强宜服葱白湯葱白湯方葱白十五枚半夏細切炒麥門冬去心一升人參一兩五錢生薑八兩甘草炙當歸黄芪炒各三兩阿膠炒四兩黄芩一兩旋覆花一把右以水八升煑減半内清酒三升并膠煎取四升温服一升日三夜一温卧當汗出無汗加麻黄二兩秋後勿强汗忌羊肉餳海藻菘菜等杏仁湯若曾傷七月胎者當預服杏仁去雙仁皮尖碎甘草炙鐘乳研麥門冬去心吴茱茰各一升五味子粳米各五合紫苑一兩右以水八升煮取三升半分四服日三夜一七日服一劑忌海藻菘菜姙娠八月始受土精以成膚革和心静息無使氣極是謂周密腠理光澤顔色是月手陽明脈養不可針灸其經此經内屬于大腸大腸主九竅是時兒九竅皆成無食燥物無輒失食無忍大氣若中風寒有所犯觸身體盡痛乍寒乍熱胎動不安苦頭眩痛繞臍下寒時時小便白如米汁或青或黄或寒慄腰背苦冷痛而目視茫茫宜服芍藥湯芍藥湯方芍藥四錢人參當歸甘草炙各二兩白术一兩厚朴二兩製薤白切一升生薑切四兩右以水五升酒四升煮取三升分四服日三夜一忌海藻菘菜桃李雀肉等類葵子湯若曾傷八月胎者當預服甘草炙柴胡白术各二兩厚朴薑製炒芍藥葵子二升生薑六兩大棗二十枚擘右以水九升煮取三升分四服日三夜一日服一劑忌猪肉冷水蕪荑桃李雀肉酢物等類姙娠九月始受石精以成皮毛六腑百節莫不具備飲醴食甘緩帶自持而待之是謂養毛髮多才力是月足少隂脈所養不可針灸其經此經内屬于腎腎主續縷皆成無處温冷無著炙衣若卒下痢腹滿懸急上衝腰背痛不可轉側短氣宜服半夏湯半夏湯方半夏泡炒五合麥門冬去心五合乾薑炮一兩當歸吴茱茰阿膠炙各三兩大棗十二枚擘右以水九升煮取三升去渣内白蜜八合微火温分四服痢即止忌生血物餳猪腎湯若曾傷九月胎者當預服猪腎一具茯苓桑寄生乾薑炮生地黄芎藭各三兩白术四兩麥門冬一升去心附子大者一枚炮右以水一斗煮猪腎熟去之内諸藥煎三升半分四服日三夜一十日更一劑忌猪肉蕪荑桃李雀肉酢物姙娠十月五臓俱備六腑通納天地氣于丹田故使關節人事皆備但俟時而生愚按姙娠所禁之法皆傳自上古當永為遵守其方藥用須斟酌芎藭補中湯治懐孕血氣不能榮養以致半産予嘗治一姙娠不足月而損墜服此藥遂安乾薑煨阿膠炒芎藭五味子各五分黄耆炒當歸白术炒杜仲炒白芍藥各一錢木香人參甘草炙各五分右水煎服姙娠惡阻方論第二姙娠惡阻病産寶謂之子病巢氏病源謂之惡阻由胃氣怯弱中脘停痰脈息和順但肢體沈重頭眩擇食惟嗜酸醎甚者寒熱嘔吐胸膈煩滿半夏茯苓丸主之愚按前症若中脘停痰用二陳湯加枳殻若飲食停滯用六君子加枳殻若脾胃虚弱用異功散若胃氣不足用人參橘皮湯兼氣惱加枳殻胸脇痞悶再加蘇梗脇痛再加柴胡若飲食少思用六君子加紫蘇枳殻頭暈體倦用六君子湯若脾胃虚弱嘔吐不食用半夏茯苓湯蓋半夏乃健脾氣化痰滯之主藥也脾胃虚弱而嘔吐或痰涎壅滯飲食少思胎不安必用茯苓半夏湯倍加白术然半夏白术茯苓陳皮砂仁善能安胎氣健脾胃予常用驗矣附治驗一姙婦嘔吐惡食體倦嗜卧此胃氣虚而惡阻也用人參橘皮湯二劑漸愈又用六君子加紫蘇二劑而安一姙婦吞酸惡心時欲作嘔此因脾胃虚而飲食停滯用六君子加枳殻香附治之而愈一姙婦停食腹滿嘔吐吞酸作瀉不食余以為飲食停滯兼肝木傷脾土用六君子湯以健脾胃加蒼术厚朴以消飲食吴茱茰所製黄連以清肝火諸症悉愈又以六君子加砂仁調理而脾土乃安白术湯治胃虚惡阻吐水甚至十餘日粥漿不入白术炒一錢人參五分丁香甘草炒各二分右薑水煎服人參橘皮湯治阻病嘔吐痰水飲食少思肢體倦怠人參橘紅白术炒麥門冬去心白茯苓各一錢厚朴製甘草炙五分右加竹薑水煎服保生湯治姙娠惡阻少食嘔吐或兼吐㵼作渇人參一錢甘草炒白术香附烏梅橘紅各五分右薑水煎服安胎飲治體倦惡食㦯胎動腹痛或下血發熱甘草炒茯苓當歸熟地黄自製川芎白术炒黄耆炒白芍藥炒半夏湯泡阿膠切炒地榆各五分右薑水煎服又方縮砂仁為末毎服二錢薑湯或米飲調下附方二陳湯方見二十四卷第五論六君子湯方見二十四卷第六論異功散方見二十二卷第三論半夏茯苓湯方見後姙娠痰逆不食方論第三姙娠嘔逆者乃水飲停積為痰輕者妨食嘔逆甚者腹痛傷胎皆由胃氣不健或風冷外乘所致也愚按前症因食停滯用半夏茯苓湯加枳殻兼氣惱更加柴胡因痰壅滯用半夏茯苓湯加白术因風寒外傷用參蘇飲飲食腹脹用香砂六君子湯寒熱嘔吐人參養胃湯附治驗一姙婦嘔吐脇脹或寒熱往来面色青黄此木旺而尅脾土用六君子加柴胡桔梗枳殻而安一姙婦嘔吐酸水胸滿不食此脾土虚而肝木所侮用六君子加芍藥而愈又用四君子加枳殻桔梗而安一姙婦胸腹膨脹吐痰不食此脾胃虚而飲食為痰用半夏茯苓湯漸愈又用六君子加枳殻蘇梗桔梗而飲食如常後因恚怒脇脹不食吐痰惡心用半夏茯苓湯加柴胡山梔而愈半夏茯苓湯治姙娠脾胃虚弱飲食不化嘔吐不止半夏泡炒黄陳皮各一錢白茯苓二錢砂仁炒一錢甘草炒五分右用薑棗烏梅水煎服一二劑後用茯苓丸茯苓丸治姙娠煩悶頭暈聞食吐逆或胸腹痞悶赤茯苓人參桂心乾薑炮半夏泡洗炒黄橘紅各一兩白术炒葛根甘草炒枳殻麩炒各二兩右為末蜜丸桐子大毎服五十丸米飲下日三服四七湯方見十一卷第七論附方參蘇飲方見六卷第十三論六君子湯四君子湯香砂六君子湯三方見二十四卷第六論人參養胃湯方見八卷第十八論胎動不安方論第四姙娠胎動或飲食起居或衝任風寒或跌仆擊觸或怒傷肝火或脾氣虚弱當各推其因而治之若因母病而胎動但治其母若因胎動而母病唯當安其胎輕者轉動不安重者必致傷墜若面赤舌青是兒死也面青舌赤吐沫是母死唇口色青兩邊沫出是母子俱死也察而治之愚按前症胎氣鬱滯者用紫蘇飲脾氣虚弱者六君子湯加蘇殻鬱結傷脾者歸脾湯加柴梔鬱怒傷肝脾者四七湯加芎歸怒動肝火者加味小柴胡湯若胎已死急用平胃散加朴硝腐化之附治驗一姙婦内熱脯熱或兼寒熱飲食少思其胎或下墜或上攻此肝經血虚而火動耳先用加味逍遥散數劑次用六君子加柴胡枳殻各數劑而愈一姙婦因怒寒熱胸脇脹痛嘔吐不食狀如傷寒此怒動肝火脾氣受傷也用六君子加柴胡山梔枳殻牡丹皮而愈但内熱口乾用四君子加芎歸升麻柴胡而安釣藤湯治姙娠胎動腹痛面青冷汗氣欲絶者釣藤鈎當歸茯神去木人參各一錢苦梗一錢五分桑寄生一錢右水煎服煩熱加石膏黄耆湯治氣虚胎動腹痛下水糯米一合黄耆炒川芎各一兩右水煎分三服順氣飲子産前服之安胎紫蘇葉木香炮人參草豆䓻茯苓各一兩甘草炒五錢大腹子一兩氣弱不用右每服三錢苧根三寸糯米少許水煎服安胎寄生湯治姙娠下血或胎不安或腰腹作痛桑寄生白术各五分茯苓四分甘草一錢右水煎服又方好銀煑取水入葱白作羮食之又方川芎二兩葱白五兩水三碗煑二碗半分三服四物湯加熟艾阿膠茯苓或芎藭補中湯杜仲丸皆妙方並見前附方紫蘇飲方見十二卷第八論六君子湯四君子湯二方見二十四卷第六論加味小柴胡湯方見二十四卷第二論平胃散方見七卷第十八論加味逍遥散歸脾湯二方見二十四卷第四論姙娠漏胎下血方論第五姙娠經水時下此由衝任氣虚不能約制蓋心小腸二經相為表裏上為乳汁下為月水故姙娠經水壅之以養胎蓄之以為乳若經水時下名曰胞漏血盡則斃矣愚按前症若因風熱用防風黄芩丸若因血熱用加味逍遥散若因血虚用二黄散若因血去太多用八珍湯未應補中益氣湯若因肝火用柴胡山梔散若因脾火用加味歸脾湯若因事下血作痛用八珍湯加阿膠熟艾若因脾胃虚弱用補中益氣湯加五味子若因脾胃虚陷用前湯倍用升麻柴胡若脯熱内熱宜用逍遥散附治驗方藥一姙婦下血服凉血之藥下血益甚食少體倦此脾氣虚而不能攝血余用補中益氣湯而愈後因怒而寒熱其血仍下此肝火旺而血沸騰用加味逍遥散血止用補中益氣湯而安一姙婦下血發熱作渇食少體倦屬脾氣虚而肝火所侮用四君子加柴胡山梔血止因怒復作用六君子加柴胡山梔升麻而安二黄散治胎漏下血或内熱晡熱或頭痛頭暈或煩躁作渇或脇肋脹痛等症生地黄熟地黄自製右為末毎服三錢煎白术枳殻湯調下二黄須杵膏為丸庶藥不枯槁而有力也防風黄芩丸方見後加味歸脾湯加味逍遥散八珍湯三方見二十四卷第四論四君子湯補中益氣湯六君子湯三方見二十四卷第六論柴胡山梔散方見二十四卷第三論姙娠卒然下血方論第六姙娠下血因冷熱不調七情失宜氣血不和所致若傷于胎則痛而下血甚則胎墮矣愚按前症若因氣怒用小柴胡湯若因風熱用一味防風丸若因血熱用一味子芩丸若因脾氣虚弱用六君子湯若因中氣下䧟用補中益氣湯若氣血盛而下血者乃因兒小飲少也不必服藥附治驗一姙婦六月毎怒下血甚至寒熱頭痛脇脹腹疼作嘔少食余謂寒熱頭痛乃肝火上衝脇脹腹痛乃肝氣不行作嘔少食乃肝侮脾胃小便下血乃肝火血熱用小柴胡加芍藥炒黒山梔茯苓白术而愈一姙婦六月體倦食少勞役下血用六君子加當歸熟地升麻柴胡而愈安胎散治卒然腰痛下血熟地黄自製艾葉白芍藥炒川芎黄耆炒阿膠炒當歸甘草炒地榆各五分右薑棗水煎服附方子芩丸治肝經有熱妄行用細條黄芩炒為末毎服一錢以秤錘燒赤焠酒熱調服若脾胃虚不宜用防風丸治肝經有風以致血得風而流散不歸經用防風為末每服一錢白湯調服防風黄芩丸治肝經有風熱致血崩便血尿血用條芩炒焦防風等分為末酒糊丸桐子大每服三五十丸食逺或食前米飲或温酒送下小柴胡湯方見二十四卷第二論六君子湯補中益氣湯二方見二十四卷第六論姙娠驚胎及僵仆方論第七姙娠驚胎者乃懐姙將滿胎神已具墜仆傷胎甚至下血不醒若欲驗其子母安否當參第四論治之愚按前症或因怒跌仆或手足抽搐用釣藤湯若因氣滯用紫蘇飲若因脾胃氣虚用六君子加蘇梗若鬱結傷脾用歸脾湯若鬱怒傷肝脾用四七湯加芎歸若去血過多用佛手散如不應膠艾湯氣血虚八珍加膠艾神妙佛手散治胎痛服之即安胎損服之立下即芎歸湯當歸川芎各五錢右水酒煎血崩昏暈用水煎服治姙娠從髙墜下腹痛下血生地黄二錢益母草二錢當歸黄耆炒各一錢右薑水煎服膠艾湯治姙娠頓仆胎動不安腰腹疼痛或胎上搶或去血腹痛阿膠一兩炙熟艾葉數莖右以水三碗煮取二碗分三服又方川芎末二錢酒下二三服胎生即安胎死即下又方失所胎動或子煩飲竹瀝一升立愈又方縮砂和皮炒為末每服二錢米飲下腹熱即安秦芁湯方見前安胎散治頓仆胎動腰腹痛方見前附方四七湯治七情鬱結成痰或如梅核鯁于喉間或中脘停痰氣痞或痰壅氣喘或痰飲中脘嘔逆惡心紫蘇葉厚朴薑製茯苓各一錢半夏薑製一錢五分右加薑棗水煎白濁送青州白丸子極妙加味四物湯治症同前又方治寒邪所犯心腹作痛桂枝芍藥炒半夏各一錢茯苓厚朴薑製枳殻麩炒甘草炒各五分人參紫蘇各一錢右薑棗水煎服釣藤湯方見前紫蘇飲方見後六君子湯方見二十四卷第六論歸脾湯八珍湯二方見二十四卷第四論姙娠胎上逼方論第八姙娠將養如法則血氣調和胎得其所而産亦易否則胎動氣逆臨産亦難甚至危矣愚按前症若氣逆胎上用紫蘇飲飲食不甘兼以四君子若内熱晡熱兼以逍遥散若胃火所致用四君子黄芩枳殻柴梔若脾鬱所致用歸脾湯加柴梔枳殻附治驗一姙婦毎因恚怒其胎上逼左關脈弦洪乃肝火内動用小柴胡加茯苓枳殻山栀而愈但體倦不食用六君子調養脾土加柴胡枳殻調和肝氣乃瘥一姙婦胎上逼胸滿噯氣飲食少思此脾氣鬱滯用紫蘇飲頓安又用四君子加枳殻柴胡山梔而瘥紫蘇飲治子懸腹痛或臨産驚恐氣結連日不下或大小便不利當歸甘草炒大腹皮黑豆浸水泡人參川芎橘皮白芍藥炒各五分紫蘇一錢右薑葱水煎一孕婦累日不産催藥不驗此坐草太早心懐畏懼氣結而血不行也用前飲一服便産一婦人孕七月止衝腹痛面不赤舌不青乃子懸也亦用前飲而胎母俱安當歸湯治胎動煩躁或生理不順唇口青黒手足厥冷當歸人參阿膠炒甘草炒各一錢連根葱白一握右水四碗煎四味至半去滓下葱煎至一碗分二服大聖散治姙娠忪悸夢驚心腹脹滿連臍急痛白茯苓川芎麥門冬去心黄耆炒當歸各一錢人參甘草炒木香各五分右薑水煎服又方治胎上逼熱痛下血或煩悶困篤用葱二十莖水濃煮飲胎未死即安胎已死即下未效再服若唇口青黒手足厥冷須佐以當歸湯白术湯治遍身痛或衝心痛欲死方見後附方四君子湯六君子湯二方見二十四卷第六論逍遥散歸脾湯二方見二十四卷第四論小柴胡湯方見二十四卷第二論姙娠下如豆汁胎動腹痛方第九愚按前症肝脾濕熱用升陽除濕湯肝脾風熱用加味逍遥散肝脾鬱怒用加味歸脾湯脾胃氣虚用錢氏白术散若脾氣下陷用補中益氣湯肝經風熱用防風黄芩丸風入腸胃用胃風湯附治驗一姙婦因怒胸膈不利飲食少思服消導順氣之劑脾胃愈弱飲食愈少大便不實且無度久而便黄水㦯帶白視其面色黄中隱白余曰黄色脾虚也白色肺虚也朝以補中益氣湯升補胃氣夕以六君子湯培補脾氣而愈治姙娠忽然下如豆汁等物或胎動腹痛糯米五升黄耆炒六兩右水煎分四服補遺用野苧根二兩好銀三五兩或金銀首飾水酒各半煎服附方胃風湯治風邪乗虚客于腸胃水穀不化泄㵼下注腹脇虚滿腸鳴作痛及腸胃虚熱下如豆汁或瘀血日夜無度方見第八卷第十論東垣升陽除濕湯治婦人女子漏下惡血月事不調或暴崩不止多下水漿之物皆由飲食失節或勞傷形體或素患心氣不足因飲食勞倦致令心火乘脾其脈緩而弦急按之洪大皆脾土受邪也柴胡羌活蒼术黄耆炒各一錢五分防風甘草炙升麻藁本各一錢蔓荆子七分獨活當歸各五分右水煎食前服加味逍遥散加味歸脾湯二方見二十四卷第四論防風黄芩丸方見前補中益氣湯六君子湯二方見二十四卷第六論錢氏白术散方見二十一卷第二論姙娠誤服毒藥胎動方第十愚按前症若因毒藥用甘草黒豆淡竹葉若因頓仆用阿膠散未應煎送知母丸若因頓仆下血腹痛用佛手散未應用八珍湯送知母丸血出過多用八珍湯斤許益母草四兩水煎徐徐與服若胎死以朴硝或平胃散下之奪命丹治小産或毒藥唇口爪青黒其胎已死牡丹皮白茯苓桂心赤芍藥各為末桃仁去皮尖研如泥右等分蜜丸彈子大毎服一丸醋湯速進兩丸立愈阿膠散治姙娠跌仆或毒藥致胎不安熟地黄二錢自製白芍藥艾葉當歸甘草炒阿膠炒黄耆炒各一錢右薑棗水煎服藥毒胎動甘草烏豆淡竹葉等分用水濃煎服附方知母丸又名一母丸方見十三卷第九論佛手散方見前八珍湯方見二十四卷第四論平胃散方見八卷第十八論姙娠心痛方論第十一姙娠心痛乃風邪痰飲交結若傷心正經為真心痛朝發夕死夕發旦死若傷心支絡則乍安乍作若傷于子臓則胎動而血下愚按前症若飲食所傷用平胃散加枳殻山查若因錯雜諸邪當審其因而治之附治驗一姙婦心痛煩熱作渇用白术散即愈後因停食其痛仍作胸腹膨滿按之則痛此因飲食停滯用人參養胃湯按之不痛乃脾胃受傷以六君子補之而愈一姙婦心腹作痛胸脇作脹吞酸不食此肝脾氣滯用二陳山查山栀青皮木香而愈又因怒仍痛胎動不食面色青黄肝脈弦𦂳脾脈弦長此肝乘其土用六君子湯加升麻柴胡木香而愈治姙婦卒心痛氣欲絶川芎當歸茯苓厚朴製各一錢右水煎服白术湯治姙娠内熱心痛白术四錢赤芍藥三錢黄芩二錢炒右水煎忌桃李雀肉雷公炮炙論云心痛欲死急覓延胡又方青竹茹一升酒二升煮二升分二服又方破雞子一枚調酒服之紫蘇飲方見前附方人參養胃湯平胃散二方見七卷第十八論二陳湯方見二十四卷第五論六君子湯方見二十四卷第六論姙娠心腹痛方論第十二姙娠心腹痛或宿有冷疾或新觸風寒或痰飲相搏若痛傷胞絡必致動胎甚則傷墮愚按前症若風寒痰飲用金沸草散胎氣鬱滯加香附川芎若飲食停滯用六君子加紫蘇枳殻若怒動肝火用前藥更加柴胡山栀若鬱結傷脾用歸脾湯加枳殻山栀附治驗一姙婦心腹作痛吐痰惡心胎氣上攻飲食少思此脾虚氣滯而為痰用六君子加柴胡枳殻諸症漸退飲食漸進又用四君子加枳殻山栀桔梗而安後因怒兩脇氣脹中脘作痛惡寒嘔吐用六君子加柴胡升麻木香一劑而愈當歸芍藥湯治姙娠心腹急痛或去血過多而眩暈白芍藥炒當歸茯苓白术炒澤㵼各一錢川芎二錢右水煎服阿膠散治胎動腹痛白茯苓白术炒川芎阿膠各一錢炒當歸陳皮各二錢甘草炒三分右水薑棗煎服治胎動腹痛欲落上等銀一斤茅根二斤去黒皮水五碗煮取三碗入清酒一碗并茅根煎數沸徐徐服立安金銀首飾亦可附方金沸草散方見六卷第十二論紫蘇飲方見前四君子湯六君子湯二方見二十四卷第六論歸脾湯方見二十四卷第六論姙娠中惡方論第十三姙娠若忽然心痛悶絶欲死者謂之中惡蓋因氣血不足精神衰弱故邪毒得以中之也愚按前症當調補正氣為善用金銀藤一味煎湯飲之又方治前症生地黄二錢枳殻一錢木香三分右酒煎服又方苦梗一兩薑半兩水煎服又方心腹痛或吐血衂血熟艾如拳大煮汁服又方用鹽一盞水調服以冷水噀之吐出即安又方竈心土為末每服二錢白湯調姙娠腰腹背痛方論第十四腎主腰足因勞役傷損其經以致風冷乘之腰腹相引而痛蓋婦人腎以繫胞姙娠痛甚則胎墮也愚按前症若外邪所傷用獨活寄生湯勞傷元氣用八珍杜仲砂仁膠艾脾腎不足以前藥加白术補骨胎氣血鬱滯用紫蘇飲加桔梗枳殻肝火所動用小柴胡湯加白术枳殻山梔肝脾鬱結用歸脾湯加柴胡枳殻附治驗一姙婦頸項强直腰背作痛此膀胱經風邪所致用拔萃羌活湯一劑而愈又用獨活寄生湯及八珍湯以袪邪固本而痊通氣散治腎虚腰痛神妙破故紙炒為末空心每服二錢嚼核桃肉半個以温酒下杜仲丸治姙娠腰背痛杜仲炒續斷酒浸等分為末煮棗肉丸桐子大毎服七十丸酒下米飲亦可膠艾湯治腰腹疼痛胎動欲落即前姙娠下血補遺内安胎散附方獨活寄生湯方見四卷第七論八珍湯歸脾湯二方見二十四卷第四論紫蘇飲方見前小柴胡湯方見二十四卷第二論羌活勝濕湯方見四卷第一論姙娠小腹痛方論第十五姙娠小腹痛由胞絡虚風寒相搏痛甚亦令胎動也愚按前症若風寒所搏用紫蘇飲加生薑氣血虚用八珍湯脾氣虚用六君子湯中氣虚用補中益氣湯若腹脹痛用安胎飲加升麻白术不應兼補中益氣湯附治驗方藥一姙婦小腹作痛其胎不安氣攻左右或時逆上小便不利用小柴胡湯加青皮山梔清肝火而愈後因怒小腹脹滿小便不利水道重墜胎仍不安此亦肝木熾盛所致用龍膽㵼肝湯一劑諸症頓愈乃以四君子加柴胡升麻以培脾土而安紫蘇飲方見前八珍湯方見二十四卷第四論四君子湯六君子湯補中益氣湯三方見二十四卷第六論安胎飲方見前小柴胡湯方見二十四卷第二論龍膽㵼肝湯方見二十四卷第八論姙娠心腹脹滿方論第十六夫姙娠心腹脹滿者由脾胃虚寒復因冷飲相搏所致也愚按前症若外感風寒内傷飲食用藿香正氣散若食傷脾胃用六君子湯若陽氣壅滯用紫蘇飲附治驗一姙婦飲食停滯心腹脹滿㦯用人參養胃湯加青皮山查枳殻其脹益甚其胎上攻惡心不食右關脈浮大按之則弦此脾土不足肝木所侮余用六君子加柴胡升麻而愈後小腹痞悶用補中益氣湯升舉脾氣乃瘥下氣湯治心腹兩脇脹悶飲食少思四肢無力羌活赤芍藥炒甘草炒檳榔青皮大腹皮桑白皮炒赤茯苓半夏薑製陳皮各五分桂心二分紫蘇莖一錢右水煎服局方枳殻散保風散紫蘇飲藿香正氣散皆良附方六君子湯補中益氣湯二方見二十四卷第六論人參養胃湯方見七卷第十八論薛氏醫案卷三十六
