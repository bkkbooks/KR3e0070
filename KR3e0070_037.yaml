body:
  text: 薛氏醫案卷三十七明薛已訂婦人良方姙娠數墮胎方論第一夫胎乃陽施隂化榮衛調和經養完全十月而産若血氣虚損不能養胎所以數墮也凡姙婦腰痛多墮胎愚按丹溪先生曰陽施隂化胎孕乃成血氣虚乏不能榮養其胎則墜譬如枝枯則果落藤痿則花墜嘗治賈氏婦每有孕至三月前後必墜診其脈左右大而無力重則濇知其血虚也補其中氣則血自榮時正初夏教以濃煎白术湯下黄芩末二錢與數十貼得保而生因而思之墮于内熱而虚者于理為多曰熱曰虚蓋孕至三月上屬相火所以易墮不然何以黄芩熟艾阿膠等為安胎之妙如此也大抵治法須審某月屬某經育養而藥之附治驗一姙婦五月服剪紅丸而胎墮及腹脹痛乃服破血之劑痛益甚手不敢近予曰此峻藥重傷脾胃也用八珍倍加參耆半夏乳香没藥二劑而痛止數劑而安吳江庠史萬湖仲子室年二十餘疫疾墮胎時咳服清肺解表之藥喘急不寐予以為脾土虚而不能生肺金藥復損而益甚也先與補中益氣加茯苓半夏五味炮薑四劑漸愈後往視之用八珍加五味及十全大補湯而愈一方鯉魚二觔者一尾粳米一升用鹽醬煮食甚善月食三次芎藭補中湯杜仲丸治氣虚而胎墜方見十二卷第一論附方十全大補湯八珍湯二方見二十四卷第四論補中益氣湯方見二十四卷第六論姙娠不長方論第二夫姙娠不長者因有宿疾或因失調以致臓腑衰損氣血虚弱而胎不長也當治其疾疚益其氣血則胎自長矣愚按前症更當察其經絡審其所因而治之附治驗一姙婦胎六月體倦懶食面黄晡熱而胎不長因勞欲墜此脾氣不足也用八珍湯倍加參术茯苓三十餘劑脾胃漸健胎安而長矣一姙婦因怒寒熱往来内熱晡熱脇痛嘔吐胎至八月而不長此因肝脾鬱怒所致用六君子加柴胡山梔枳殻紫蘇桔梗病愈而胎亦長矣黄耆湯治姙娠不長更安胎和氣黄耆炒白术炒陳皮麥門冬去心白茯苓前胡人參各五分川芎甘草炒三分右薑棗水煎服集驗用鯉魚長尺許如食法飲其汁其胎漸大而長矣附方六君子湯方見二十四卷第六論八珍湯方見二十四卷第四論姙娠胎動不安當下方論第三夫人以胃氣壯實衝任榮和則胎得所如魚處淵若氣血虚弱無以滋養其胎終不能成也宜下之以免其禍愚按前症宜用第十二卷十四方論主之其胎果不能安者方可議下慎之慎之附治驗鴻臚張淑人痢疾後胎動心神不安肢體殊倦用八珍散二十餘劑漸愈因勞加煩熱頭痛以大劑補中益氣湯加蔓荆子治之熱痛頓止仍用前散又五十餘劑而安其後生産甚易桂心散治姙娠因病胎不能安者可下之桂心𤓰蔞牛膝􅜰麥各五分當歸右水煎又方牛膝一兩酒一鍾煎七分作二服小品方用麥蘖一升擂碎水二升煮一升服之神效觀麥蘖能損氣破血如此脾胃虚弱飲食不化者不宜用明矣文仲取雞子一枚鹽三錢服之立下佛手散服之胎死者即下生者亦安方見十二卷第七論附方八珍湯方見二十四卷第四論補中益氣湯方見二十四卷第六論姙娠墮胎後血下方論第四墮胎後復損經脈而下血不止甚則煩悶至死皆以調補胃氣為主愚按前症若肝經血熱用四物參术山栀肝經風熱用防風黄芩丸肝經怒火用加味逍遥散脾經氣虚用四君子歸地脾經鬱滯用加味歸脾湯氣滯不和用紫蘇飲胃氣下陷用補中益氣湯附治驗一姙婦墮胎昏憒不時吐痰自用養血化痰之劑昏憒不省自汗發搐痰涎湧出彼以為中風欲用袪風化痰予曰此屬脾氣虚寒所致遂用十全大補湯加炮薑二十餘劑尋愈治姙娠損動下血腹痛阿膠一兩炒艾葉半兩右水一大盞煎因墮胎下血煩滿寒熱狂悶鎊鹿角炒為末每服三錢水調下日三服或家雞翎燒為末每服二錢温酒下良久再服以效為度附方四物湯補中益氣湯二方見二十四卷第六論紫蘇飲方見十二卷第八論防風黄芩丸方見十二卷第六論加味逍遥散加味歸脾湯十全大補湯三方見二十四卷第四論姙娠未足月欲産方論第五姙娠未足月而痛如欲産或應産而難或為子煩用知母一味蜜丸桐子大粥飲服之或槐子蒲黄等分為丸酒服或蒲黄水調錢許並效愚按小産重于大産蓋大産如𤓰熟自脫小産如生採斷其根蒂豈不重哉而人輕忽死于是者多矣大抵治法宜補形氣生新血去瘀血為主若未足月痛而欲産用芎歸補中湯倍加知母止之産而血不止人參黄耆湯補之産而心腹痛當歸川芎湯主之元氣弱而欲産八珍湯固之出血過多而發熱聖愈湯治之若汗不止或昏憒喘咳急用獨參湯若發熱煩躁或肉瞤筋惕用八珍湯大渇面赤脈洪而虚者用當歸補血湯身熱面赤脈沈而微者用四君子薑附以回其陽可也附治驗方藥一姙婦八月胎欲墜如産卧久少安日晡益甚此氣血虚弱朝用補中益氣湯加茯苓半夏隨愈更以八珍湯調理而安當歸川芎湯治小産後瘀血心腹疼痛或發熱惡寒當歸川芎熟地黄自製白芍藥炒元胡索炒紅花香附青皮澤蘭牡丹皮桃仁右水煎入童便酒各小半盞服若以手按腹愈痛此瘀血為患宜用此藥或失笑散消之若按之不痛此是血虚宜用四物參芩白术若痛而作嘔此是胃虚宜用六君子若痛而作㵼此是脾虚宜六君子送二神丸芎歸補中湯治氣血虚而欲産艾葉代薑阿膠炒川芎五味子杵炒黄耆炙當歸白术炒芍藥炒人參杜仲炒各一錢甘草炙五分右每服五錢水煎服若脾氣虚弱須用補中益氣湯若氣虚而有火宜用安胎飲人參黄耆湯治小産氣虚血下不止人參黄耆炒當歸白术炒白芍藥炒艾葉各一錢阿膠炒二錢右作一劑水煎服當歸散治産後氣血虚弱惡露内停増寒發熱宜服此藥當歸白芍藥炒川芎黄芩炒各一兩白术五錢右為細末温童便調下二錢聖愈湯方見二十四卷第九論獨參湯方見三卷第十三論當歸補血湯八珍湯二方見二十四卷第四論補中益氣湯方見二十四卷第六論斷産方論第六易曰天地之大德曰生然婦人有臨産艱難或生育不已而欲斷之故錄驗方以備所用若服水銀䖟蟲水蛭之類不惟孕不復懐且禍在反掌愚按前云用蠶故紙尺許燒灰為末産後酒服之血虚者終不復孕大抵斷産之劑多用峻厲往往有不起者是則産之害未若斷産之害也吾聞閣老張羅峯太常李恒齋俱因服斷産之劑自謂形體俱怯遇勞必病有由然矣千金斷産用油煎水銀一日方息空心服棗大一丸永斷其孕且不損人千金去胎大麯五升清酒一斗煮二沸去滓分五服隔宿勿食旦再服其胎如糜母無所苦千金不傳四物湯每服五錢加芸薹子二撮于經行後空心温服姙娠咳𠻳方論第七夫肺内主氣外司皮毛皮毛不密寒邪乘之則咳𠻳秋則肺受之冬則腎受之春則肝受之夏則心受之其𠻳不已則傳于腑姙娠病久不已則傷胎也愚按前症若秋間風邪傷肺用金沸草散夏間火邪尅金用人參平肺散冬間寒邪傷肺用人參敗毒散春間風邪傷肺用參蘇飲若脾肺氣虚用六君芎歸桔梗若血虚四物桑皮杏仁桔梗腎火上炎用六味丸加五味子煎服脾胃氣虚風寒所傷用補中益氣加桑皮杏仁桔梗蓋肺屬辛金生于已土𠻳久不愈者多因脾土虚而不能生肺氣而腠理不密以致外邪復感或因肺氣虚不能生水以致隂火上炎所致治法當壯土金生腎水為善諸臓腑𠻳見六卷第十一等論附治驗一姙婦氣喘痰甚諸藥不效素有帶下始于目下浮兩月餘其面亦然此氣虚而有痰飲也用六味丸料數劑而愈一姙婦𠻳則便自出此肺氣不足腎氣虧損不能司攝用補中益氣湯以培土金六味丸加五味以生腎氣而愈一姙婦咳𠻳其痰上湧日五六碗許諸藥不應予以為此水泛為痰用六味丸料及四君子湯各一劑稍愈數劑而安一姙婦因怒咳𠻳吐痰兩脇作痛此肝火傷肺金以小柴胡湯加山梔枳殻白术茯苓治之而愈但欲作嘔此肝侮脾也用六君子加柴胡升麻而痊桔梗散治風寒咳𠻳喘急不食天門冬去心赤茯苓各一錢桑白皮桔梗炒紫蘇各五分麻黄去節三分貝母人參甘草炒右薑水煎馬兠鈴散治咳𠻳氣喘馬兠鈴苦梗人參甘草貝母各五分陳皮去白大腹皮黒豆水浸洗紫蘇桑白皮各五錢五味子五分右薑水煎百合散治咳𠻳胷膈煩悶川百合紫苑麥門冬桑白皮苦梗各五分甘草三分竹茹二分右薑水煎治姙娠傷寒涎多咳𠻳知母杏仁天門冬桑白皮各五分右薑水煎服旋覆花湯治感冐喘𠻳胸滿痰盛方見二十二卷第四論華蓋散治症同上或項背拘急鼻塞頭眩時發寒熱方見六卷第十二論參蘇飲加杏仁五味子治症同上附方金沸草散方見六卷第十二論人參平肺散方見二十四卷第十二論人參敗毒散方見二十四卷第十論補中益氣湯四君子湯六君子湯三方見二十四卷第六論六味丸方見二十四卷第十二論小柴胡湯方見二十四卷第二論姙娠吐血衂血方論第八姙娠吐血由七情臓腑所傷氣逆于上致血上溢不止心悶甚者多死或墮胎也宜用局方必勝散愚按前症若肝經怒火先用小柴胡山栀生地次用前藥合四物後用加味逍遥散肝經風熱防風子芩丸心經有熱硃砂安神丸心氣不足補心湯思慮傷心妙香散胃經有火犀角地黄湯膏粱積熱加味清胃散鬱結傷脾加味歸脾湯肺經有火黄芩清肺飲因氣鬱滯紫蘇飲子氣不攝血用補中益氣湯腎經虚火加味六味丸仍以七卷第五論互用附治驗方藥一姙婦因怒吐血兩脇脹痛小便淋濇此怒而血蓄于上隨火出也用小柴胡合四物四劑血止用六君子安胎飲調理而安紫蘇飲治姙娠失調胎氣不安上攻作痛或氣逆失血方見十二卷第八論若肝脾氣血虚而有火不安宜兼逍遥散若脾氣虚弱而不安宜用四君芎歸小柴胡湯方見二十四卷第二論四物湯補中益氣湯六君子湯三方見二十四卷第六論加味逍遥散加味歸脾湯二方見二十四卷第四論防風子芩丸方見十二卷第六論硃砂安神丸方見三卷第十論養心湯方見三卷第十論妙香散方見三卷第十一論安胎飲方見十二卷第一論犀角地黄湯方見七卷第六論加味清胃散方見二十四卷第一論黄芩清肺飲方見八卷第一論加味六味丸方見二十四卷第十一論姙娠子煩方論第九論曰姙娠苦煩悶者以四月受少隂君火以養精六月受少陽相火以養氣若母心驚膽寒多有是症産寶云是心肺虚熱或痰積于胸若三月而煩者但熱而已若痰飲而煩者吐涎惡食大凡停痰積飲寒熱相搏吐甚則胎動不安愚按前症若因内熱用竹葉湯氣滯用紫蘇飲痰滯用二陳白术黄芩枳殻氣鬱用分氣飲加川芎脾胃虚弱用六君紫蘇山梔附治驗一姙婦煩熱吐痰惡食惡心頭暈此脾虚風痰為患用半夏白术天麻湯以補元氣袪風邪漸愈惟頭暈未痊乃用補中益氣湯加蔓荆子以升補陽氣而愈竹葉湯治子煩防風黄芩炒麥門冬各一錢白茯苓二錢右竹葉數片水煎服人參散治熱乘心脾煩熱乾渇人參麥門冬赤茯苓地骨皮乾葛黄芩炒犀角鎊各一錢甘草五分右水煎竹茹湯治姙娠煩躁或胎不安淡竹茹一兩水煎服益母丸知母炒為末棗肉丸彈子大每服一丸人參煎湯下附方分氣飲治脾胃虚弱氣血不和胷膈不利或痰氣喘𠻳飲食少思陳皮茯苓半夏炒桔梗炒大腹皮紫蘇梗枳殻麩炒白术炒山栀炒各一錢甘草炙五分右薑棗水煎紫蘇飲方見十二卷第八論二陳湯方見二十四卷第五論六君子湯補中益氣湯二方見二十四卷第六論姙娠煩躁口亁方論第十足太隂脾之經其氣通于口手少隂心之經其氣通于舌若臓腑不調氣血不和以致内熱乘于心脾津液消爍故心煩口乾也與子煩大同小異宜用益母丸愚按前症若胃經實火用竹葉石膏湯若胃經虚熱用人參黄耆散若胃經氣虚用補中益氣湯若肺經虚熱用紫蘇飲若肝經火動用加味逍遥散若脾氣鬱結用加味歸脾湯若腎經火動加味地黄丸附治驗一姙婦煩熱兼咽間作痛用知母散加山栀以清肺經而愈後内熱咳𠻳小便自遺用補中益氣加麥冬山栀以補肺氣滋腎水而痊知母散治煩躁悶亂口乾知母麥門冬黄耆炒子芩炒赤茯苓各一錢甘草五分右水煎入竹瀝一合更煎二沸而服人參黄耆散治身熱煩躁口乾人參黄耆炒葛根秦芁赤茯苓麥門冬各一錢知母甘草五分右薑三片竹葉二七片水煎補遺人參白术散黄耆六一湯皆良附方竹葉石膏湯石膏一錢半夏一錢五分甘草人參各一錢麥門冬竹葉各五分右薑水煎服補中益氣湯方見二十四卷第六論紫蘇飲方見十二卷第八論加味逍遥散加味歸脾湯二方見二十四卷第四論六味地黄丸方見二十四卷第十一論薛氏醫案卷三十七
