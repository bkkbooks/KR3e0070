body:
  text: 薛氏醫案卷二明薛巳撰內科摘要脾腎虧損頭眩痰氣等症閣老梁厚齊氣短有痰小便赤澀足跟作痛尺脉浮大按之則澀此腎虛而痰飲也用四物送六味丸不月而康仲景先生云氣虛有飲用腎氣丸補而逐之誠開後學之矇瞶濟無窮之夭枉腎氣丸即六味也都憲孟有涯氣短痰暈服辛香之劑痰盛遺尿兩尺浮大按之如無余以為腎家不能納氣歸源香燥致甚耳用八味丸料三劑而愈孫都憲形體豐厚勞神善怒面帶陽色口渴吐痰或頭目眩暈或熱從腹起左三脉洪而有力右三脉洪而無力余謂足三隂虧損用補中益氣加麥門五味及加減八味丸而愈若人少有老態不耐寒暑不勝勞役四時迭病皆因少時氣血方長而勞心虧損或精血未滿而御女過傷故其見症難以悉狀此精氣不足但滋化源其病自痊又若飲食勞役七情失宜以致諸症亦當治以前法設或六淫所侵而致諸症亦因真氣內虛而外邪乘襲尤當固胃氣為主蓋胃為五臟之根本故黃柏知母不宜輕用恐復傷胃氣也大凡雜症屬內因乃形氣病氣俱不足當補不當㵼傷寒雖屬外因亦宜分其表裡虛實治當審之昌平守王天成頭暈惡寒形體倦怠得食稍愈勞而益甚寸關脉浮大此脾肺虛弱用補中益氣加蔓荆子而愈後因勞役發熱惡寒譫言不寐得食稍安用補中益氣湯而痊大尹祝支山因怒頭暈拗內筋攣時或寒熱日晡熱甚此肝火筋攣氣虛頭暈用八珍加柴胡山梔牡丹皮二十餘劑而愈上舍顧桐石㑹飲於周上舍第問余曰向孟有涯陳東谷俱為無嗣納寵已而得疾皆頭暈吐痰並用蘇合香丸惟有涯得生何也余曰二症因腎虛不能納氣而為頭暈不能制水而為痰涎東谷專主攻痰行氣有涯專於益火補益故耳後余應杭人之請桐石房勞過度亦患前症或用清氣化痰愈甚顧曰我病是腎虛不能納氣歸源治者不悟而殁惜哉一男子素厚味胸滿痰盛余曰膏粱之人內多積熱與法製清氣化痰丸而愈彼為有驗修合餽送脾胃虛者無不受害先兄體貌豐偉唾痰甚多脉洪有力殊不耐勞遇風頭暈欲仆口舌破裂或至赤爛誤食薑蒜少許口瘡益甚服八味丸及補中益氣加附子錢許即愈停藥月餘諸症仍作此命門虛火不歸源也肝腎虧損血燥結核等症二儒者楊澤之性躁嗜色缺盆結一核此肝火血燥筋攣法當滋腎水生肝血不信乃內服降火化痰外敷南星商陸轉大如碗余用補中益氣及六味地黃間以蘆薈丸年餘元氣漸復而腫消一男子素善怒左項微腫漸大如升用清痰理氣而大熱作渴小便頻濁余謂腎水虧損用六味地黃補中益氣而愈亦有胸脅等處大如升斗或破而如菌如榴不問大小俱治以前法一男子頸間結核大潰年餘一男子眉間一核初如豆粒二年漸大如桃悉用清肝火養肝血益元氣而愈舉人江節夫頸臂脅肋各結一核恪服袪痰降火軟堅之劑益甚余曰此肝膽經血少而火燥也彼執前藥至明年六月各核皆潰脉浮大而澀余斷以秋金將旺肝木被尅必不起後果然脾腎虧損小便不利肚腹膨脹等症三大尹劉天錫內有濕熱大便滑利小便澀滯服淡滲之劑愈加滴瀝小腹腿膝皆腫兩眼脹痛此腎虛熱在下焦淡滲導損陽氣隂無以化遂用地黃滋腎二丸小便如故更以補中益氣加麥門五味兼服而愈州守王用之先因肚腹膨脹飲食少思服二陳枳實之類小便不利大便不實咳痰腹脹用淡滲破氣之劑手足俱冷此足三隂虛寒之症也用金匱腎氣丸不月而康州同劉禹功素不慎起居七情以致飲食不甘胸膈不利用消導順氣肚腹痞悶吐痰氣逆用化痰降火食少泄㵼小腹作脹用分利降火小便澀滯氣喘痰湧服清氣化痰丸小便愈滯大便愈㵼肚腹脹大肚臍突出不能寢卧六脉微細左寸虛甚右寸短促此命門火衰脾腎虛寒之危症也先用金匱加减腎氣丸料內桂附各一錢五分二劑下瘀穢甚多又以補中益氣送二神丸二劑諸症悉退五六又用前藥數劑并附子之類貼腰臍及湧泉穴寸脉漸復而安後因怒腹悶惑於人言服沉香化氣丸大便下血諸症悉至余曰此隂絡傷也辭不治果殁一富商飲食起居失宜大便乾結常服潤腸等丸後胸腹不利飲食不草口乾體倦發熱吐痰服二陳黃連之類前症益甚小便滴瀝大便泄㵼腹脹少食服五苓􅜰麥之類小便不通體腫喘嗽用金匱腎氣丸補中益氣湯而愈一儒者失於調養飲食難化胸膈不利或用行氣消導藥咳嗽喘促服行氣化痰藥肚腹漸脹服行氣分利藥睡卧不能兩足浮腫小便不利大便不實脉浮大按之微細兩寸皆短此脾腎虧損朝用補中益氣加薑附夕用金匱腎氣加骨脂肉果各數劑諸症漸愈再佐以八味丸兩月乃能步履却服補中八味半載而康一男子素不善調攝唾痰口乾飲食不美服化痰行氣之劑胸滿腹膨痰涎愈盛服導痰理脾之劑肚腹膨脹二便不利服分氣利水之劑腹大脅痛睡卧不得服破血消導之劑兩足皆腫脉浮大不及於寸口朝用金匱加减腎氣丸夕用補中益氣湯煎送前丸月餘諸症漸退飲食漸進再用八味丸補中湯月餘自能轉側又兩月而能步履郤服大補湯還少丹又半載而康後稍失調理其腹仍脹服前藥即愈一男子患前症余為壯火補土漸愈彼欲速服攻積之劑下血甚多余診之曰此隂絡傷故血內溢非所宜也後果殁一男子胸膈痞悶專服破氣之藥余曰此血虛病也血生於脾上若服前藥脾氣弱而血愈虛矣不信又用內傷之藥反吐血余曰此陽絡傷也後果然大方世家湖鄉離羣索居山妻趙氏忽嬰痰熱治者多以寒凉偶得小愈三四年餘屢進屢退于是元氣消爍庚子夏遍身浮腫手足麻冷日夜咳嗽煩躁引飲小水不利大肉盡去勢將危殆幸遇先生診之脉洪大而無倫按之如無此虛熱無火法當壯火之源以生脾土與金匱腎氣丸料服之頓覺小水潰决如泉俾日服前丸及大補之藥二十餘劑而愈三四年間平康無恙迄今甲辰仲春悲哀動中前症復作體如焚燎口肉盡腐胸腹腫滿食不下咽者四日夫婦相顧束手待斃而已又承先生視之投以八味丸二服神思清爽服金匱腎氣丸料加參茋歸术未竟夕而胸次漸舒陡然思食不三日而病去五六矣嗣後日用前二丸間服逾日而起至秋初復患痢又服金匱腎氣丸料加參茋歸术黃連吳茱木香痢遂止但覺後重又用補中益氣加木香黃連吳茱五味數劑而全愈大方自分寒素命亦蹇剝山妻抱病沉痼本難調攝苟非先生援救填壑未免今不肖奔走衣食於外而可無內顧之憂矣然則先生之仁庇固不肖全家之福亦不肖全家之感也斯言也當置之座右以為子孫世誦之不肖嘗侍先生之側檢閲醫案始知山妻奏效巔末遂秉書紀二丸藥之聖且彰先生用藥之神萬一云吳門晚學生沈大方履文再拜頓首謹書脾胃虧損暑濕所傷等症四附食生冷入房大司徒李蒲汀南吏部少宰時患黃疸當用淡滲之劑公尚無嗣猶豫不决余曰有是病而用是藥以茵陳五苓散加芩連山梔二劑而愈至辛卯得子公執余手而笑曰醫方猶公案先設君避毁譽殘喘安得享餘年而遂付託之望哉由是禮遇益厚應天王治中遍身發黃妄言如狂苦于胸痛手不可近此中焦畜血為患用桃仁承氣湯一劑下瘀血而愈太守朱陽山弟下部蓄血發狂用抵當湯而愈一儒者每春夏口乾發熱勞則頭痛服清凉化痰藥㵼喘煩躁用香茹飲神思昏憒脉大而虛此因閉藏之際不逺幃幕為患名曰注夏用補中益氣去柴胡升麻加五味麥門炮薑一劑脉益甚仍用前藥加肉桂五分服之即蘇更用六味丸而痊一儒者體肥善飲仲秋痰喘用二陳芩連益甚加桑皮杏仁盜汗氣促加貝母枳殼不時發熱余以為脾肺虛寒用八味丸以補土母補中益氣以接中氣而愈一男子夏月入房食氷果腹痛余用附子理中湯而愈有同患此者不信别用二陳芩連之類而死一男子盛暑發熱胸背作痛飲湯自汗用發表之藥昏憒譫語大便不實吐痰甚多用十全大補一劑頓退又用補中益氣加炮薑二劑全愈肝脾腎虧損頭目耳鼻等症五給事張禹功目赤不明服袪風散熱藥反畏明重聽脉大而虛此因勞心過度飲食失節以補中益氣加茯神棗仁山藥山茱五味頓愈又勞役復甚用十全大補兼以前藥漸愈却用補中益氣加前藥而痊東垣云諸經脉絡皆走於面而行空竅其清氣散於目而為精走於耳而為聽若心煩事冗飲食失節脾胃虧損心火太甚百脉沸騰邪害孔竅而失明矣况脾為諸隂之首目為血脉之宗脾虛則五臟之精氣皆為失所若不理脾胃不養神血乃治標而不治本也少宰李蒲汀耳如蟬鳴服四物湯耳鳴益甚此元氣虧損之症五更服六味地黃丸食前服補中益氣湯頓愈此症若血虛而有火用八珍加山梔柴胡氣虛而有火四君加山梔柴胡若因怒就聾或鳴實用小柴胡加芎歸山梔虛用補中益氣加山梔午前甚用四物加白术茯苓久須用補中益氣午後甚用地黃丸少司馬黎仰之南銀臺時因怒耳鳴吐痰作嘔不食寒熱脅痛用小柴胡合四物加山梔陳皮而瘥尚寶劉毅齊怒則太陽作痛用小柴胡加茯苓山梔以清肝火更用六味丸以生腎水後不再發一儒者日晡兩目緊澀不能瞻視此元氣下陷用補中益氣倍加參茋數劑全愈一男子亦患前症服黃柏知母之類更加便血此脾虛不能統血肝虛不能藏血也用補中益氣六味地黃而愈一儒者兩目作痛服降火袪風之藥兩目如緋熱倦殊甚余用十全大補湯數劑諸症悉退服補中益氣兼六味丸而愈復因勞役午後目澀體倦服十全大補而痊一男子房勞兼怒風府脹悶兩脅脹痛余作色欲損腎怒氣傷肝用六味地黃丸料加白术當歸一劑而安一儒者酒色過度頭腦兩脅作痛余以為腎虛而肝病亦用前藥頓安一男子面白鼻流清涕不聞馨穢三年矣用補中益氣加麥門山梔而愈一男子年二十素嗜酒色兩目赤痛或作或止兩尺洪大按之微弱余謂少年得此目當失明翌早索途而行不辨天日衆皆驚異余與六味地黃丸料加麥門五味一劑頓明婦人症見女科撮要脾肺腎虧損小便自遺淋澀等症六大司徒許函谷在南銀臺時因勞發熱小便自遺或時不利余作肝火隂挺不能約制午前用補中益氣加山藥黃柏知母午後服地黃丸月餘諸症悉退此症若服燥劑而頻數或不利用四物麥門五味甘草若數而黃用四物加山茱黃柏知母五味麥門若肺虛而短少用補中益氣加山藥麥門若隂挺痿痺而頻數用地黃丸若熱結膀胱而不利用五淋散若脾肺燥不能化生用黃芩清肺飲若膀胱隂虛陽無以生而淋瀝用滋腎丸若膀胱陽虛隂無以化而淋澀用六味丸若轉筋小便不通或喘急欲死不問男女孕婦急用八味丸緩則不救若老人隂痿思色精不出而內敗小便道澀痛如淋用加减八味丸料加車前牛膝若老人精已竭而復耗之大小便道牽痛愈痛愈欲便愈便則愈痛亦治以前藥不應急加附子若喘嗽吐痰腿足冷腫腰骨大痛而目浮腫太陽作痛亦治以前藥若痛愈而小便仍澀宜用加减八味丸以緩治之詳見褚氏遺書精血篇但無冶法耳司徒邊華泉小便頻數澀滯短赤口乾唾痰此腎經陽虛熱燥隂無以化用六味滋腎二丸而愈司馬李悟山莖中作痛小便如淋口乾唾痰此思色精降而內敗用補中益氣六味地黃而愈考功楊村庵口舌乾燥小便頻數此膀胱陽燥隂虛先用滋腎丸以補隂而小便愈再用補中益氣六味地黃以補肺腎而安若汗多而小便短少或體不禁寒乃脾肺氣虛也司空何燕泉小便赤短體倦食少缺盆作痛此脾肺虛弱不能生腎水當滋化源用補中益氣六味丸加五味而安商主客素膏粱小便赤數口乾作渴吐痰稠粘右寸關數而有力此脾肺積熱遺於膀胱用黃芩清肺飲調理脾肺用滋腎六味二丸滋補腎水而愈一儒者發熱無時飲水不絶每登厮小便澀痛大便牽痛此精竭復耗所致用六味丸加五味子及補中益氣喜其謹守得愈若肢體畏寒喜熱飲食用八味丸儒者楊文魁痢後兩足浮腫胸腹脹滿小便短少用分利之劑遍身腫兼氣喘余曰兩足浮腫脾氣下陷也胸腹脹滿脾虛作痞也小便短少肺不能生腎也身腫氣喘脾不能生肺也用補中益氣湯加附子而愈半載後因飲食勞倦兩目浮腫小便短少仍服前藥頓愈甲戌年七月余奉侍武廟湯藥勞役過甚飲食失節復兼怒氣次年春莖中作癢時出白津時或痛甚急以手緊捻才止此肝脾之氣虛也服地黃丸及補中益氣加黃柏柴胡山梔茯苓木通而愈至丁酉九月又因勞役小便淋瀝莖癢竅痛仍服前湯加木通茯苓膽草澤㵼及地黃丸而愈大尹顧榮甫尾閭作癢小便赤澀左尺脉洪數屬腎經虛熱法當滋補彼不信乃服黃柏知母等藥年許髙骨腫痛小便淋瀝肺腎二脉洪數無倫余曰子母俱敗無能為矣後果殁余甲辰仲夏在橫金陳白野第㑹其外舅顧同崖求余診脉左尺澀結右寸洪數余曰此肺金不能生腎水誠可慮果至季冬莖道澀痛如淋愈痛則愈欲便愈便則愈痛而殁脾肺腎虧損虛勞怯弱等症七庶吉士黃伯鄰發熱吐痰口乾體倦自用補中益氣湯不應余謂此金水俱虛之症兼服地黃丸而愈後背患一癤煩痛寒熱彼因前月嘗偕往視郭主政背疽郭不經意余决其殞於金旺之日果符余言已而郭氏妻孥感其毒皆患惡瘡伯鄰所患與郭患同心甚恐余曰此小瘡也憎寒等症皆隂虛舊症果是瘡毒亦當補氣血余在第就以地黃丸料煎與服之即睡良久各症頓退自後常有頭面耳目口舌作痛或吐痰眩暈之類服前藥即愈後任都憲督鹽法道出於蘇必垂顧焉少司空何瀟川足熱口乾吐痰頭暈服四物黃連黃柏飲食即减痰熱益甚用十全大補加麥門五味山藥山茱而愈一儒者或兩足發熱或腳跟作痛用六味丸及四物加麥門五味𤣥參治之而愈後因勞役發熱惡寒作渴煩躁用當歸補血湯而安儒者劉允功形體魁偉冬日飲水自喜壯實余曰此隂虛也不信一日口舌生瘡或用寒凉之劑肢體倦怠發熱惡寒余用六味地黃補中益氣而愈一男子腿內作痛用滲濕化痰藥痛連臀肉面赤吐痰腳跟發熱余曰乃腎虛隂火上炎當滋化源不信服黃柏知母之類而殁余甥居宏年十四而娶至二十形體豐厚發熱作渴面赤作脹或外為砭血內用降火肢體倦怠痰涎愈多脉洪數鼓指用六味丸及大補湯加麥門五味而痊余甥凌雲漢年十六庚子夏作渴發熱吐痰唇燥遍身生疥兩腿尤多色黯作癢日晡愈熾仲冬腿患瘡尺脉洪數余曰疥腎疳也瘡骨疽也皆腎經虛症針之膿出其氣氤氲余謂火旺之際必患瘵症遂用六味地黃十全大補不二旬諸症愈而瘵症具仍用前藥而愈抵冬娶妻至春其症復作父母憂之俾其外寢雖其年少謹疾亦服地黃丸數斤煎藥三百餘劑而愈其弟雲霄年十五壬寅夏見其面赤唇燥形體消瘦余曰子病將進矣癸卯冬復見之曰子病愈深矣至甲辰夏胃經部分有青色此木乘土也始求治先以六君加柴胡芍藥山梔蕪荑炒黑黃連數劑及四味肥兒六味地黃二丸及參苓白术歸芍山梔麥門五味炙草三十餘劑肝火漸退更加膽草柴胡三十餘劑乃去芍加肉桂三十餘劑及加减八味丸元氣漸復而愈脾肺腎虧損遺精吐血便血等症八少宰汪涵齊頭暈白濁余用補中益氣加茯苓半夏愈而復患腰痛用山茱山藥五味萆薢逺志頓愈又因勞心盜汗白濁以歸脾湯加五味而愈後不時昡暈用八味丸全愈南銀臺許函谷因勞發熱作渴小便自遺或時閉澀余作肝火血虛隂挺不能約制午前用補中益氣加山藥山茱午後服地黃丸月餘諸症悉退司㕔陳石鏡久患白濁發熱體倦用補中益氣加炮薑四劑白濁稍止再用六味地黃兼服諸症悉愈光祿柴黼庵因勞患赤白濁用濟生歸脾十全大補二湯間服而愈司㕔張檢齊隂囊腫痛時發寒熱若小腹作痛則莖出白津用小柴胡加山梔膽草茱茰芎歸而愈朱工部勞則遺精齒牙即痛用補中益氣加半夏茯苓芍藥并六味地黃丸漸愈更以十全大補加麥門五味而痊一男子白濁夢遺口乾作渴大便閉澀午後熱甚用補中益氣加芍藥𤣥參并加减八味丸而愈一男子莖中痛出白津小便祕時作癢用小柴胡加山梔澤㵼炒連木通膽草茯苓二劑頓愈又兼六味地黃丸而痊一男子發熱便血精滑一男子尿血發熱一男子發熱遺精或小便不禁俱屬腎經虧損用地黃丸益氣湯以滋化源並皆得愈一男子鰥居數年素勤苦勞則吐血發熱煩躁服犀角地黃湯氣髙而喘前病益盛更遺精白濁形體倦怠飲食少思脉洪大舉按有力服十全大補加麥門五味山茱山藥而愈儒者楊啓元素勤苦吐血發痙不知人事余以為脾胃虛損用十全大補湯及加减八味丸而痙愈再用歸脾湯而血止一儒者因飲食勞役及惱怒眉髮脫落余以為勞傷精血隂火上炎所致用補中益氣加麥門五味及六味地黃丸加五味眉髮頓生如故一男子年二十巔毛脫盡用六味地黃丸不數日髮生寸許兩月復舊吳江史萬湖云有男女偶合眉髮脫落無藥調治至數月後復生一童子年十四發熱吐血余謂宜補中益氣以滋化源不信用寒凉降火愈甚始謂余曰童子未室何腎虛之有參茋補氣奚為用之余述丹溪先生云腎主閉藏肝主疏泄二臟俱有相火而其系上屬於心心為君火為物所感則易於動心動則相火翕然而隨雖不交㑹其精亦暗耗矣又精血篇云男子精未滿而御女以通其精則五臟有不滿之處異日有難狀之疾遂用補中益氣及地黃丸而瘥一男子咳嗽吐血熱渴痰盛盜汗遺精用地黃丸料加麥門五味治之而愈後因勞怒忽吐紫血塊先用花蕊石散又用獨參湯漸愈後勞則咳嗽吐血一二口脾肺腎三脉皆洪數用補中益氣六味地黃而全愈辛丑夏余在嘉興屠內翰第遇星士張東谷談命時出中庭吐血一二口云久有此症遇勞即作余意此勞傷肺氣其血必散視之果然與補中益氣加麥門五味山藥熟地茯神遠志服之而愈翌早請見云每服四物黃連山梔之類血益多而倦益甚余得公一七吐血頓止神思如故何也余曰脾統血肺主氣此勞傷脾肺致血妄行故用前藥健脾肺之氣而噓血歸源耳後率其子以師余余曰管見已行於世矣子宜覽之肝脾腎虧損下部瘡腫等症九通府黃廷用飲食起居失宜兩足發熱口乾吐痰自用二陳四物益甚兩尺數而無力余曰此腎虛之症也不信仍服前藥足跟熱癢以為瘡毒又服導濕之劑赤腫大熱外用敷藥破而出水久而不愈及用追毒丹瘡突如桃始信余言滋其化源半載得瘥儒者章立之左股作痛用清熱滲濕之藥色赤腫脹痛連腰脅腿足無力余以為足三隂虛用補中益氣六味地黃兩月餘元氣漸復諸症漸退喜其慎疾年許而痊府庠鍾之英兩腿生瘡色黯如錢似癬者三四癢痛相循膿水淋漓晡熱內熱口乾面黧此腎虛之症用加味六味丸數日而愈此等症候用袪風敗毒之劑以致誤人多矣一男子素遺精腳跟作痛口乾作渴大便乾燥午後熱甚用補中益氣加芍藥𤣥參及六味丸而愈餘症見外科樞要脾肺腎虧損大便祕結等症十一儒者大便素結服搜風順氣丸後胸膈不利飲食善消面帶陽色左關尺脉洪而虛余曰此足三隂虛也彼恃知醫不信乃服潤腸丸大便不實肢體倦怠余與補中益氣六味地黃月餘而驗年許而安若脾肺氣虛者用補中益氣湯若脾經鬱結者用加味歸脾湯若氣血虛者用八珍湯加肉蓯蓉若脾經津液涸者用六味丸若發熱作渴飲冷者用竹葉黃茋湯若燥在直腸用猪膽汁導之若肝膽邪侮脾者用小柴胡加山梔郁李枳殼若膏粱厚味積熱者用加味清胃散亦有熱燥風燥陽結隂結者當審其因而治之若復傷胃氣多成敗症一老儒素有風熱飲食如常大便十七日不通肚腹不脹兩尺脉洪大而虛此隂火內爍津液用六味丸二十餘劑至三十二日始欲去用猪膽潤而通利如常一婦人年七十有三痰喘內熱大便不通兩月不寐脉洪大重按微細此屬肝肺腎虧損朝用六味丸夕用逍遙散各三十餘劑計所進飲食百餘碗腹始痞悶乃以猪膽汁導而通之用十全大補調理而安若間前藥飲食不進諸症復作一男子年五十餘因怒少食大便不利服潤腸丸大便祕結胸脅作痛欲兼服脾約丸肝脾腎脉浮而澀余曰此足三隂精血虧損之症也東垣先生云若人胃强脾弱約束津液不得四布但輸膀胱小便數而大便難者用脾約丸若人隂血枯槁內火燔灼肺金受邪土受木傷脾肺失傳大便祕而小便數者用潤腸丸令滋其化源則大便自調矣如法果驗一儒者懷抱鬱結復因場屋不遂發熱作渴胸膈不利飲食少思服清熱化痰行氣等劑前症益甚肢體倦怠心脾二脉澀滯此鬱結傷脾之變症也遂用加味歸脾湯治之飲食漸進諸症漸退但大便尚澀兩顴赤色此肝腎虛火內傷隂血用八珍湯加蓯蓉麥門五味至三十餘劑大便自潤一男子所患同前不信余言服大黃等藥泄㵼便血遍身黑黯復求治余視之曰此隂陽二絡俱傷也經曰陽絡傷則血外溢隂絡傷則血內溢辭不治後果然職方陳莪齊年踰六旬先因大便不通服內疏等劑後飲食少思胸腹作脹兩脅作痛形體倦怠兩尺浮大左關短澀右關弦澀時五月請治余意乃命門火衰不能生脾土而肺金又尅肝木憂其金旺之際不起後果然各症方藥十二小柴胡湯治肝膽症寒熱往來或日晡發熱或濕熱身熱默默不欲食或怒火口苦耳聾咳嗽發熱脅下作痛甚者轉側不便兩袪痞滿或泄㵼咳嗽或吐酸食苦水或因怒而患瘧痢等症柴胡二錢黃芩一錢五分人參半夏各七分甘草炙五分右薑水煎服加味小柴胡湯治血虛大勞大怒火動熱入血室或婦女經行感冒發熱寒熱如瘧夜間熱甚或譫語即前方加生地黃一錢黃芩半夏生薑湯治膽腑發咳嘔苦水如膽汁黃芩炒生薑各三錢甘草炙半夏各二錢右薑水煎服桔梗湯治心臟發咳咳而喉中如梗狀甚則咽腫喉痺苦梗三錢甘草六錢右水煎服芍藥甘草湯治小腸腑發咳咳而失氣芍藥甘草炙各四錢右水煎服升麻湯治脾臟發咳咳而右脅下痛痛引肩背甚則不可以動升麻白芍藥甘草各二錢葛根三錢右水煎服烏梅丸治胃腑發咳咳而嘔嘔甚則長蟲出烏梅三十箇細辛附子桂枝人參黃柏各六錢乾薑一兩黃連一兩五錢當歸蜀椒各四兩右為末用酒浸烏梅一宿去核蒸之與米飯搗如泥丸桐子大每服三十丸白湯下麻黃湯治肺臟發咳咳而喘急有聲甚則唾血麻黃三錢桂枝二錢甘草一錢杏仁二十箇右水煎服赤石脂禹餘糧湯治大腸腑發咳咳而遺屎赤石脂禹餘糧各二兩並打碎右水煎服麻黃附子細辛湯治腎臟發咳咳則腰背相引而痛甚則咳涎又治寒邪犯齒致腦齒痛宜急用之緩則不救麻黃細辛各二錢附子一錢右水煎服茯苓甘草湯治膀胱腑發咳咳而遺溺茯苓二錢桂枝二錢五分生薑五大片甘草炙一錢右水煎服異功散治久咳不已或腹痛少食面腫氣逆又治脾胃虛弱飲食少思等症人參茯苓白术甘草陳皮各等分右每服三五錢薑棗水煎法製清氣化痰丸順氣快脾化痰消食半夏南星去皮尖白礬皂角切乾薑各四兩右先將白礬等三味用水五碗煎取水三碗却入半夏二味浸二日再煮至半夏南星無白㸃為度晒乾陳皮青皮去欀紫蘇子炒蘿葡子炒另研葛根神麯炒麥蘖炒杏仁去皮尖炒研山查子香附子各二兩右為末蒸餅丸桐子大每服五七十丸臨卧食後茶湯下升陽益胃湯治脾胃虛弱肢體怠惰或體重節痛口舌乾渴飲食無味大便不調小便頻數飲食不消兼見肺病灑淅惡寒悽慘不樂乃陽不和也羌活獨活防風各五錢柴胡白术茯苓渴者不用澤㵼各三錢人參半夏甘草炙各一兩黃茋二兩芍藥黃連陳皮各四錢右每服三五錢薑棗水煎早溫服如小便愈而病益加是不宜利小便也當少减茯苓澤㵼生脉散治熱傷元氣肢體倦怠氣短懶言口乾作渴汗出不止或濕熱大行金為火制絶寒水生化之源致肢體痿軟腳欹眼黑最宜服之人參五錢五味子麥門冬各三錢右水煎服清燥湯治元氣虛濕熱乘之遍身痠軟或肺金受邪絶寒水生化之源腎無所養小便赤少大便不調腿腰痿軟或口乾作渴體重麻木頭目眩暈飲食少思或自汗盜汗肢體倦怠胸滿氣促黃茋一錢五分黃連神麯炒五味子九粒杵炒猪苓柴胡甘草炙各二分蒼术白术麥門冬陳皮生地黃澤㵼各五分白茯苓人參當歸升麻各三分黃柏酒拌一分右水煎服清暑益氣湯治元氣弱暑熱乘之精神困倦胸滿氣促肢節疼痛或小便黃數大便溏頻又暑熱㵼痢瘧疾之良劑升麻黃茋炒去汗各一錢蒼术一錢五分人參白术陳皮神麯炒各五分甘草炙乾葛各三分五味子九粒杵炒右水煎服香茹飲加黃連名黃連香茹飲治一切暑毒腹痛霍亂吐㵼或頭痛昏憒香薷茯苓白扁豆厚朴甘草各一錢右水煎服麥門冬湯治火熱乘肺咳唾有血麥門冬去心防風各二錢白茯苓二錢人參一錢右水煎服二神丸治脾腎虛弱侵晨五更作㵼或全不思食或食而不化大便不實神效破故紙四兩炒肉豆䓻二兩生用右為末用大紅棗四十九枚生薑四兩切碎用水煮熟去薑取棗肉和藥丸桐子大每服五十丸空心鹽湯下五味子散治腎泄在侵晨五更作㵼飲食不進或大便不實不時去後為丸尤效五味子炒二兩吳茱茰炒五錢右為末每服二錢白湯調四神丸治脾腎虛弱大便不實飲食不思肉豆䓻補骨脂五味子吳茱茰各為末生薑四兩紅棗五十枚右用水一碗煮薑棗去薑水乾取棗肉丸桐子大每服五七十丸空心日前服保和丸治飲食停滯胸膈痞滿或吞酸腹脹神麯炒半夏茯苓各一兩山查取肉二兩蒸蘿蔔子炒陳皮連翹各五錢右為末粥丸加白术二兩名大安丸越鞠丸治六鬱胸膈痞滿或吞酸嘔吐飲食不化蒼术神麯撫弓麥芽炒香附山查山梔各等分右為末水調神麯麥芽末糊丸桐子大每服六七十丸滚湯下茵陳五苓散治酒積分利其濕茵陳白术猪苓各一錢桂三分澤㵼一錢五分右水煎服葛花解酲湯治酒積上下分消白豆䓻砂仁葛花各半兩木香五分青皮三錢陳皮白茯苓猪苓人參各一錢半白术神麯炒澤㵼乾薑各二錢右為末每服五錢白湯調得微汗酒病去矣益黃散治脾土虛寒寒水反來侮土而嘔吐不食或肚腹作痛或大便不實手足逆冷等症陳皮一兩青皮阿子肉甘草炙丁香各二錢右每服四錢水煎服人參安胃散治脾胃虛熱嘔吐或泄㵼不食人參一錢黃茋二錢生草草炙甘草各五分白芍藥七分白茯苓四分陳皮三分黃連二分右水煎服人參養胃湯治外感風寒內傷飲食寒熱頭疼或作瘧疾半夏厚朴薑製橘紅各八分藿香葉草果茯苓人參各五分甘草炙三分蒼术一錢右薑七片烏梅一箇水煎服藿香正氣散治外感風寒內停飲食頭疼寒熱或霍亂泄㵼或作瘧疾桔梗大腹皮紫蘇茯苓厚朴製各一錢井草炙五分藿香一錢五分右薑棗水煎熱服白虎湯治胃熱作渴暑熱尤效知母石膏各二錢粳米半合右水煎服竹葉黃茋湯治胃虛火盛而作渴淡竹葉二錢黃茋生地黃麥門冬當歸川芎甘草黃芩炒芍藥人參石膏煅各一錢右水煎服竹葉石膏湯治胃火盛而作渴淡竹葉石膏煅桔梗木通薄荷葉甘草各一錢右水煎服四七湯治七情鬱結心腹絞痛或為膨脹人參官桂半夏洗七次各一錢甘草炙五分右薑水煎服青州白丸子治風痰咳嗽或牙關緊急或痰喘體麻南星三而半夏七兩白附子一兩川烏半兩各生用右為末絹袋盛井水擺浸仍換水浸三五日晒乾糯米粉丸如急用以薑汁糊丸亦可左金丸一名四金丸治肝火脅刺痛或發寒熱或頭目作痛或大便不實或小便淋祕或小腹疼痛一切肝火之症黃連六兩吳茱茰一兩湯煮片時用右為末粥丸白术陳皮湯下當歸龍薈丸治肝經實火大便祕結小便澀滯或胸膈作痛隂囊腫脹凡屬肝經實火皆宜用之當歸龍膽草梔子仁黃連黃芩各一兩大黃蘆薈青黛各五錢木香二錢五分麝香另研五分右為末炒神麯糊丸每服二十丸薑湯下神效黃茋湯治渾身或頭面手足麻木不仁目緊縮小及羞明畏日或視物不明黃茋二兩人參八錢甘草炙白芍藥各一兩蔓荆子一兩陳皮五錢右每服五錢水煎臨卧熱服如麻木不仁雖有熱症不用黃柏加黃茋益氣聰明湯治久病或因尅伐脾胃傷損眼目昏暗或飲食失節勞役形體脾胃不足得內瘴耳鳴之患或多年眼目昏暗視物不明此藥能令廣大聰明久服無內瘴外瘴耳鳴耳聾等症黃茋甘草炙人參各五錢蔓荆子一錢五分升麻葛根各三錢芍藥黃柏酒炒各一錢右每服五錢水煎臨卧并五更服芍藥清肝散治眵多眊燥緊澀羞明赤脉貫睛臟腑祕結白术甘草川芎防風荆芥桔梗羌活各三分芍藥柴胡前胡薄荷黃芩各二分半山梔知母滑石石膏各二分大黃四分芒硝二分半右水煎食後熱服黃連天花粉丸治症同上黃連菊花川芎薄荷各一兩天花粉連翹黃芩梔子各四兩黃柏六兩右為末滴水丸桐子大每服五十丸加至百丸食後臨卧茶湯下㗜鼻通氣散治眼腫脹赤昏暗羞明癮澀疼痛或風癢鼻塞頭痛腦酸外翳攀睛眵淚稠粘鵝不食草二錢青黛川芎各一錢右為末含水滿口每用如米許㗜鼻內淚出為度選竒湯治風熱上壅眉稜骨痛或頭目眩暈羌活防風各三錢甘草二錢夏生冬炒黃芩酒製冬去之熱甚用右每服三錢水煎時時服助陽活血湯治眼睫無力常欲垂閉餘治同上黃茋甘草炙防風當歸各五分白芷四分蔓荆子四分升麻七分右水煎食後熱服益隂腎氣丸治症同上熟地黃三兩當歸酒洗柴胡五味子乾山藥山茱茰去核各半兩茯苓澤㵼各二錢半生地黃酒炒四兩右為末煉密丸桐子大每服百丸茶湯下日二三服連翹飲治目中溜火惡日與火癮澀小角緊久視昏花迎風有淚蔓荆子生甘草連翹各三錢柴胡五錢黃芩酒製五分生地黃當歸紅葵花人參各三分黃茋五分升麻一錢防風羌活各二分右水煎服地芝丸治目不能逺視能近視或妨近視生地黃焙乾四兩天門冬去心枳殼麩炒真甘菊花各二兩右為末煉蜜丸桐子大每服百丸茶清或溫酒下定志丸治目不能近視反能逺視白茯苓人參各二兩逺志去心菖蒲各一兩右為末煉蜜丸桐子大以硃砂為衣每十丸至三十丸米飲食後下日三服大蘆薈丸一名九味蘆薈治大人小人下疳潰爛或作痛又治肝疳食積口鼻生瘡牙齦蝕爛胡黃連黃連蘆薈木香白蕪荑炒青皮白雷丸鶴虱草各一兩麝香三錢右為末蒸餅糊丸如麻子大每服一錢空心米飲下四味肥兒丸一名小肥兒丸治諸疳發熱目生雲翳口舌生瘡或牙齦腐爛肌肉消瘦遍身生瘡等症與地黃丸兼服黃連炒蕪荑炒神麯炒麥芽炒各等分右各為末水糊丸桐子大每服二三十丸空心白湯下阿魏膏治一切痞塊更服胡連丸羌活獨活𤣥參官桂赤芍藥川山甲生地黃兩頭尖大黃白芷天麻各五錢槐柳桃枝各三錢紅花四錢木鱉子二十枚去殼亂髮如雞子大一塊右用香油二斤四兩煎黑去查入髮煎髮化仍去柤徐下黃丹煎軟硬得中入朴硝阿魏蘇合油乳香沒藥各五錢麝香五錢調勻即成膏矣攤貼患處內服丸藥黃丹須用真正者效凡貼膏藥先用朴硝隨患處鋪半指厚以紙蓋用熱尉斗尉良久如硝耗再加尉之二時許方貼膏藥若是肝積加蘆薈末同尉桃仁承氣湯治血結胸中手不可近或中焦蓄血寒熱胸滿漱水不欲咽善忘昏迷其人如狂桃仁半兩大黃一兩甘草二錢桂三錢芒硝三錢右每服一兩薑水煎抵當湯治下部蓄血腹內作痛手不可近或發狂少腹滿硬小便自利大便反黑如狂者在中發狂者在下也大黃水蛭炒各半兩虻蟲去翅足桃仁各三錢右每服五錢水煎服如作丸煉蜜和之花蕊石散硫黃上色明淨者四兩花蕊石一兩右各為末拌勻先用紙筋和鹽泥固濟瓦罐一箇泥乾入藥仍用泥封口候乾用炭周疊煅赤罐冷取出為細末每服一錢童便酒下搜風順氣丸治痔漏風熱閉結車前子兩半大麻子微炒大黃五錢半生半熟牛膝酒浸郁李仁兔絲子酒浸枳殼山藥各二錢右為末煉蜜丸桐子大每服三十丸白湯下五淋散治膀胱有熱水道不通淋澀不出或尿如豆汁或成沙或如膏汁或熱怫便血赤茯苓一錢五分赤芍藥山梔各一錢當歸甘草各一錢五分右入燈心水煎服加味逍遙散治肝脾血虛發熱或潮熱晡熱或自汗盜汗或頭痛目澀或怔忡不寧或頰赤口乾或月經不調肚腹作痛或小腹重墜水道澀痛或腫痛出膿內熱作渴等症當歸芍藥茯苓白术炒柴胡各錢牡丹皮山梔炒甘草炙各五分右水煎服逍遙散即前方去山梔牡丹皮還少丹治脾腎虛寒飲食少思發熱盜汗遺精白濁又治真氣虧損肌體瘦弱等症肉蓯蓉遠志去心􅚬香巴㦸乾山藥枸杞子熟地黃石菖蒲山茱茰去核牛膝杜仲去皮薑製楮實子五味子白茯苓各一兩右各另為末和勻用棗肉百枚并煉蜜丸桐子大每服五七十丸空心溫酒或鹽湯下日三服交加散治食瘧神效肉豆䓻二箇一生一煨草豆䓻二箇一生一煨甘草二錢半炙半生甪厚朴二錢半製用半生用生薑一兩煨五錢生五錢右薑水煎發日五更服仲景白虎加桂枝湯治溫瘧知母六錢甘草炙二錢石膏五錢桂枝一錢粳米一合右水煎服此太陽陽明經藥也柴胡桂薑湯治寒多微有熱或但寒不熱名曰牝瘧桂枝黃芩牡蠣甘草炙乾薑各一錢栝蔞根柴胡各二錢右水煎服汗出即愈此少陽經藥也桂枝羌活湯治瘧處暑以前發頭項痛脉浮惡風有汗桂枝羌活防風甘草各一錢五分右水煎發而服如吐加半夏麯麻黃羌活湯治症如前但惡風而無汗麻黃去節羌活防風井草各半兩右如前服加法同上二方太陽經藥也白芷湯治瘧病身熱目痛熱多寒少脉長先以大柴胡下之餘熱不盡當服此湯白芷一兩知母一兩七錢石膏四兩右依前服此陽明經藥也桂枝芍藥湯治瘧寒熱大作不論先後此太陽陽明合病寒熱作則必戰栗經曰熱勝而動也發熱汗出不愈內熱也此湯主之桂枝五分黃茋知母石膏芍藥各二錢右水煎此太陽陽明經藥也桂枝黃芩湯如服前藥轉劇三陽合病也宜此和之柴胡一錢五分黃芩人參甘草各八分半夏石膏知母各五分桂枝二分右依前服如外邪已解而內邪未已從卯至午發者宜大柴胡下之從午至酉發者邪氣在內也宜大承氣下之從酉至子發者或至寅發者邪氣在血也桂枝石膏湯治瘧隔日發先寒後熱寒少熱多桂枝五錢黃芩一兩石膏知母各一兩五錢右水煎分三服此太陽陽明經藥也麻黃黃芩湯治瘧發如前而夜發者麻黃一兩去節甘草炙三錢桂二錢黃芩五錢桃仁三十箇去皮尖右依前服桃仁味苦甘辛肝者血之海血驟則肝氣燥經所謂肝苦急急食甘以緩之故桃仁散血緩肝謂邪氣深遠而入血故夜發此湯發散血中風寒乃三隂經藥也香連丸治痢疾并水㵼暑㵼甚效黃連净二十兩吳茱茰去枝梗十兩右先將二味用熱水拌和入磁器內置熱湯頓一日同炒至黃連紫黃色去茱用連為末每末四兩入木香末一兩淡醋米飲為丸桐子大每服二三十丸滚湯下久痢中氣下陷者用補中益氣下中氣虛者用四君子下中氣虛寒者加薑桂三黃丸治熱痢腹痛或口舌咽喉齒痛及一切實火症黃芩黃連黃柏各等分右各另為末水丸桐子大每服七八十丸白湯下芍藥湯治便血後重經曰溲而便膿血知氣行而血止也行血則便自愈調氣則後重自除芍藥一兩當歸黃連各半兩檳榔木香甘草炙各二錢桂二錢五分黃芩五錢右每服半兩水煎如痢不减加大黃加减濟生腎氣丸治脾腎虛腰重腳腫小便不利或肚腹腫脹四肢浮腫或喘急痰盛已成蠱症其效如神白茯苓三兩附子半兩川牛膝肉桂去皮澤㵼車前子山茱茰山藥各一兩牡丹皮一兩熟地黃四兩酒抹搯辟杵膏右為末加煉蜜丸桐子大每服七八十丸空心白湯下三因當歸散治脾土不能制水水氣盈溢滲透經絡發為水腫木香赤茯苓當歸桂木通赤芍藥牡丹皮檳榔陳皮白术各等分右每服五錢水煎服不換金正氣散治脾氣虛弱寒邪相搏痰停胸膈致發寒熱或作瘧疾厚朴去皮姜製藿香半夏薑製蒼术米泔浸陳皮各一錢甘草炙五分右薑棗水煎服七味白术散治中氣虧損津液短少口舌乾渴或口舌生瘡不喜飲冷或吐㵼後口乾最宜服人參白术木香白茯苓甘草藿香各五分乾葛一錢右水煎服參苓白术散治脾胃不和飲食少進或嘔吐泄㵼凡病後宜此調理人參茯苓白扁豆去皮薑汁半炒白术炒蓮肉去心皮砂仁炒薏苡仁炒桔梗炒山藥甘草炙各二兩右為末每服二三錢用石菖蒲湯下或作丸半夏湯治膽腑實熱精神恍惚寒熱泄㵼或寢寒增風善太息半夏一錢五分黃芩一錢遠志一錢生地黃二錢秫米一合宿薑一錢五分酸棗仁三錢炒右長流水煎服犀角地黃湯治血虛火盛血妄行吐䘐便下若因忿怒而致加山梔柴胡犀角鎊末生地黃白芍藥牡丹皮各一錢半右水煎傾出入犀末服之人參平肺散治心火刑肺金患肺痿咳嗽喘嘔痰涎壅盛胸膈痞滿咽喉不益人參四分青皮四分茯苓七分天門冬四分陳皮五分地骨皮五分甘草炙五分知母七分桑皮一錢五味子一十粒杵碎右薑水煎服清凉飲治實熱便祕或喉中腫痛當歸赤芍藥甘草炙大黃蒸各等分右每服五錢水煎服清胃散治醇酒厚味唇齒作痛或齒齦潰爛或連頭面頸項作痛黃連炒一錢半當歸生地黃牡丹皮各一錢升麻二錢右水煎服犀翹清胃散前方加犀角連翹甘草凉膈散治實熱喉舌腫痛便溺祕結大黃朴硝甘草梔子仁黃芩薄荷葉各一兩連翹四兩右為末每服四五錢竹葉蜜少許煎服仍量加减潤腸丸治伏火風熱大腸乾燥若因失血或因腎不足當滋腎最忌此丸麻子仁桃仁去皮尖另研各一兩羌活當歸尾大黃煨皂角仁秦芃各五錢右另研為末煉蜜丸猪膽汁丸尤妙每服三十丸食前滚湯下若燥在直腸用猪膽汁導之亦忌前藥滋腎丸治熱在血分不渴而小便不利或腎虛尺熱腿膝無力不能履地知母黃柏各酒炒二兩肉桂二錢右各另為末水丸桐子大每服二百丸空心百滚湯下黃芩清肺飲治肺熱小便不利宜用此藥清之黃芩一錢山梔二錢右水煎服不利加鹽䜴二十粒清心蓮子飲治熱在氣分口乾作渴小便白濁夜安晝熱或治口舌生瘡咽乾煩躁作渴小便赤淋黃芩炒麥門冬地骨皮車前子炒甘草各一錢半石蓮肉茯苓黃茋柴胡人參各一錢右每服五錢水煎服調中益氣湯治濕熱所傷體重煩悶口失滋味二便清數或痰嗽稠粘熱壅頭目體倦少食等症黃茋一錢人參去蘆甘草蒼术各五分柴胡橘皮升麻木香各二分右水煎空心服三生飲治卒中昏不知人口眼喎斜半身不遂并痰厥氣厥南星一兩生用川烏去皮生用附子去皮生用各半兩木香二錢右每服五錢薑水煎秦芁升麻湯治風寒客手足陽明經口眼喎斜惡見風寒四肢拘急脉浮緊升麻乾葛井草芍藥人參秦芁白芷防風桂枝各三錢右每服一兩葱白二根水煎愈風丹治諸風肢體麻木手足不隨等症天麻牛膝同酒浸焙乾􅒝薢另研細𤣥參各六兩杜仲七兩羌活十四兩當歸熟地黃自製生地黃各一斤獨活五兩肉桂三兩右為末煉蜜丸桐子大常服五七十丸病大至百丸空心食前溫酒或白湯下地黃飲子治腎氣虛弱舌瘖不能言足廢不能行熟地黃巴㦸去心山茱茰去核肉蓯蓉酒浸焙石斛附子炮五味子白茯苓石菖蒲遠志去心麥門冬去心官桂各等分右每服三錢入薄荷少許薑棗水煎服餘方見上卷薛氏醫案卷二
