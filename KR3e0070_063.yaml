body:
  text: 薛氏醫案卷六十三眀薛已訂保嬰撮要十自汗自汗者汗無時而自出也經曰飲食飽甚汗出於胃驚而奪精汗出於心持重逺行汗出於腎疾走恐懼汗出於肝搖體勞苦汗出於脾又曰隂虗而陽必輳則發熱而自汗陽虗而隂必乘則發厥而自汗東垣云表虗自汗秋冬用桂春夏用黃茋丹溪云汗者心之液也自汗之症未有不由心腎俱虗而得之者巢氏云虗勞病若陽氣偏虗則津液發泄而為汗夫自心為主陽之藏火也陽主氣人身津液隨其陽氣所在之處而生亦隨其火所擾之處而泄則為自汗矣治法當用參茋甘溫益氣之藥使陽氣外固而津液內藏則汗止矣若元氣虗者夏月用六君子湯加山藥山茱茰冬月用加减八味丸十全大補湯血虗者四物加參茋有熱者當歸六黃湯氣血俱虗者十全大補湯心腎虗熱者六味丸虗寒者八味丸心經血虗者團參湯胃經氣虗者六君子湯飲食勞倦者補中益氣湯嗜卧倦怠者升陽益胃湯熱傷元氣者清燥湯著干心胞絡者清暑益氣湯外傷風邪者惺惺散虗勞羸瘦者人參飬榮湯思慮傷脾者歸脾湯怒動肝火者小柴胡湯肝經虗熱者加味逍遙散肝經濕熱者龍膽㵼肝湯泄㵼脉微者人參理中湯手足汗者補中益氣湯胸腹汗者四君子湯當心一片有汗者茯苓補心湯黃汗者茵陳五苓散血汗者血餘散敷之此皆去汗之大法也仍推五臟相勝主之若汗出如油喘而不休此為命絶柔汗發黃此為脾絶汗出不流如貫珠者為絶汗數者並不治若六陽虗則汗出上至頭下至項亦難治治驗一小兒四嵗因驚自汗左關無脉以此為憂余曰肝主驚此禀肝氣不足因驚則氣散脉必在臂腕於尺部盡處候之果得用補中益氣湯六味地黃丸半載脉復本位其脉在合谷之間者皆自幼被驚而然也一小兒五嵗因驚自汗發熱虗症悉具右寸脉短此胃氣復傷也用獨參湯月餘又用補中益氣湯仍佐以六君子及加味地黃湯半載而愈一小兒自汗目直項強頓悶余謂肝經實熱先用柴胡梔子散隨用六味地黃丸而愈後因驚自汗咬牙呵缺屬肝經虗熱生風用六味地黃丸補中益氣湯而痊後又驚自汗怔悸面赤發熱悉屬肝經虗熱用六味丸而愈一小兒自汗面青善怒小便頻數睡間驚悸或發搐目直此肝火血燥生風也先用加味四物湯加味逍遙散各四劑與間服諸症漸愈又用四君山梔而愈一小兒自汗盜汗頸間結核兩目連劄此兼肝脾疳症也用四味肥兒丸及大蕪荑湯而痊後每傷食發熱便血自汗用五味異功散加升麻柴胡漸愈又用六味地黃丸而痊一女子十四嵗自汗寒熱月經先期余謂肝火血熱用加味逍遙散地黃丸而痊後因怒經行不止自汗盜汗先用加味小柴胡湯次用加味逍遙散而愈一小兒自汗呌哭發熱作渴飲水抽搐仰睡乃心經實熱也用導赤散治之而愈後又自汗發熱飲湯抽搐無力驚竄咬牙覆睡面赤心經虗熱也用茯苓補心湯而愈一小兒自汗惡風用補中益氣湯加炒浮麥而止因飲食停滯患吐㵼用六子湯而愈又用四君當歸浮麥而汗止出痘時自汗盜汗用十全大補湯而痘愈後因傷風咳嗽自汗腹脹余謂脾肺俱虗宜用六君桔梗因惑於人言先服發表之劑更加氣喘盜汗余用四君五味子炮薑四劑不應每劑又加人參五錢炮薑一錢稍止又三劑而痊十全大補湯治諸虗不足自汗不食時發潮熱等症白茯苓人參當歸白术白芍藥炒黃茋炒川芎肉桂􅍄地黃甘草炒各等分右三五錢薑棗水煎服八珍湯前方去肉桂黃茋治驗見各門人參飬榮湯治病後時自汗或發潮熱口乾食少心虗驚悸咳而下利前方去川芎加陳皮五味子逺志百解散治感冒風邪發熱自汗者荆芥白芷麻黃去節陳皮蒼术甘草炒各三分右薑三片葱白三根水煎服清暑益氣湯治暑邪干衛身熱自汗黃茋一錢蒼术泔浸去皮一錢升麻七分人參白术陳皮炒神麯炒澤瀉各五分甘草炙黃蘖酒浸炒當歸身麥門冬去心青皮炒葛根各三分五味子九粒杵右水煎服茵陳五芩散治伏暑發黃煩渴小便不利赤茯苓猪苓澤㵼白术茵陳各三分右水煎服血餘散治汗不止用男子亂髮一握煆存性為細末以絹袋盛置乾撲之清燥湯治小兒自汗或因熱傷元氣大小便祕澀黃茋炒蒼术各五分白术三分陳皮三分白茯苓三分澤㵼三分人參三分麥門冬三分生地黃三分升麻三分當歸身三分神麯炒三分猪苓三分黃柏酒炒三分黃連炒甘草炙各二分五味子五粒杵右薑一片水一鍾煎服升陽益胃湯方見諸痢六君子湯加味歸脾湯四君子湯加味逍遙散五味異功散五方見內釣柴胡梔子散方見發熱小柴胡湯方見肝臟補中益氣湯方見虗羸龍膽㵼肝湯人參理中湯茯苓補心湯三方見瘖團參湯當歸六黃湯二方見盜汗惺惺散四物湯二方見急驚六味丸加味八味丸即六味丸加肉桂五味子方見腎臟四味肥兒丸方見寒吐大蕪荑湯方見疳症導赤散方見心臟盜汗盜汗者睡則汗出寤則汗收也自汗屬陽虗盜汗屬隂虗蓋陽為衛氣隂為榮血血之所主心也所藏肝也熱摶於心故液不能內斂而外泄於皮膚人卧則靜而為隂覺則動而為陽故曰自汗屬陽盜汗屬隂也多因心腎不交水火不能既濟腎虗則閉藏之令失守故有是症宜用六味丸十全大補湯血虗內熱者當歸六黃湯心經有熱者導赤肝經虗熱者六味地黃丸血脫盜汗者當歸補血湯肝膽風熱者柴胡清肝散食積內熱者二陳枳實山梔胃氣虗熱者六君子湯及浮麥散血氣俱虗者人參飬榮湯餘症見自汗當參覽之治驗一小兒十一嵗靣色青白或惡寒發熱鼻間黃白盜汗自汗胸膈不利飲食少思常懷畏懼用二陳黃連酸棗茯神之類不應余以為脾肺俱虗不信自用朱砂安神丸更寒熱往來泄㵼不食余用六君當歸黃茋而愈一小兒五嵗腹中作痛大便不實患盜汗鼻間左腮皆白此脾肺氣虗而食積所致也用六君山查神麯四劑腹痛頓止去查麯又四劑大便調和乃用四君歸茋而汗止一小兒十二嵗患盜汗形氣瘦弱靣色或赤或白右腮白兩頰赤鼻間微青此禀足三隂經虗也朝用補中益氣湯夕用六味地黃丸而愈一小兒久患盜汗夜熱晝凉飲食少思大便酸臭此食積內作也先用三􅏢散消𨗳積滯又用五味異功散補脾進食而瘥一女子十四嵗自汗寒熱肝脉弦洪此肝火所致用加味逍遙散而愈後飲食停滯吐痰眩運頭面不時汗出兩寸脉不及本位用補中益氣湯加半夏蔓荆子而痊一小兒三嵗盜汗不食聞藥即嘔此胃氣傷也用浮麥炒為末以乳調服錢許旬餘嘔止食進佐以六君子湯而愈一小兒發熱呵缺頓悶咬牙至夜盜汗屬肝膽火症用小柴胡湯加山梔二劑又用地黃丸料煎服而愈一小兒盜汗甚多久不愈寸口脉沉伏飲食少思稍多食則腹痛汗不止余謂脾虗食積用六君升麻柴胡月餘脾氣漸健飲食漸加汗亦少止乃佐以異功散而痊一小兒苦盜汗肢體消瘦因功課勞役更加自汗余用補中益氣十全大補二湯而愈次年因勞心前症復作更加夢遺仍用前二湯各五十餘劑而愈畢姻後前症俱作手足並冷前藥又各加薑桂一錢數劑少應至六十餘劑而愈因大勞盜汗如雨手足如氷再以前二藥加桂附各一錢數劑方愈當歸六黃湯治血虗盜汗內熱晡熱者當歸熟地黃各五分黃連炒黑三分生地黃炒一錢黃柏炒黑黃芩炒黑各三分黃茋炒五分右水煎服團參湯治虗汗盜汗新羅人參三兩當歸三錢右為末用雄猪心一個切三片每服以猪心一片煎湯調服二錢白术散治自汗盜汗白术三兩小麥一合炒右用水一鍾半煮乾去麥為末以炒黃茋煎湯量兒大小調服忌蘿蔔辛辣炙煿之類乳母尤忌六味地黃丸方見腎臟人參飬榮湯十全大補湯二方見自汗導赤散方見心臟柴胡清肝散當歸補血湯二方見發熱二陳湯方見寒吐六君子湯四君子湯五味異功散加味逍遙散四方見內釣小柴胡湯方見肝症三稜散方見白濁補中益氣湯方見虗羸噫氣經曰脾病則靣黃善噫噫者寒氣客於胃厥逆從下上散復出於胃而為噫又善思善味其症當臍有動氣按之牢若痛其病腹脹滿食不消體重節痛怠惰嗜卧四肢不收經曰脾主四肢有是者脾也又曰二陽一隂發病主驚駭背痛善噫何謂也竊謂上焦受氣於中焦中焦氣未和不能消榖故為噫耳中焦亦脾胃之分也脾土虗寒由命門火衰不能溫蒸水榖古人有服兔絲子旬日間飲食如湯沃雪亦此義也補脾宜人參理中湯補右腎宜用八味丸胃氣虗不能運化水榖者六君子加木香鬱結傷脾者加味歸脾湯木尅土者四君柴胡升麻兼嘈雜者加吳茱茰半夏治者審之治驗仍參虗羸症一小兒禀賦虗羸時常作痢年十三嵗泄㵼不食手足並冷諸藥不應余謂命門火衰六君子湯八味丸治之尋愈畢姻後勞心過甚飲食頓少發熱下氣先用參术各五錢薑棗煎服諸症稍愈又用六君子湯加炮薑肉桂參术各一兩一劑諸症頓愈又因勞心發熱煩渴用補中益氣湯加附子一錢渴止用參茋各一兩歸术各五錢附子一錢三劑全瘥一小兒十五嵗喜噫靣黃腹脹飲食難化用六君益智木香漸愈後因怒兼脅痛少食下氣噫氣用補中益氣湯加附子益智漸愈後飲食過多腹脹吞酸服保和丸熱渴痰甚用二陳黃連石膏之劑大便不止吃逆不食手足並冷余用六君附子四劑稍愈又以補中益氣湯加附子及八味丸而遂安一女子十九嵗患前症用六君子湯送四味茱茰丸而愈但怒即發服此藥亦即愈後因怒氣勞役前症復作血崩不止先用柴胡梔子散一劑隨用補中益氣湯加山梔而痊仍參虗羸治驗本事枳殼散治心下痞悶或作痛多噫枳殼白术各半兩檳榔三錢香附子炒一兩右為末每服一錢空心米飲調下四味茱連丸治腹脹噫氣吞酸食不能化吳茱茰炒黃連炒神麯荷葉各等分右為末水煮神麯糊丸桐子大每服二十丸白湯下黃連當量病微甚或炒黑炒黃用之八味丸即六味丸加五味子肉桂方見腎臟四君子湯六君子湯加味歸脾湯三方見內釣補中益氣湯方見虗羸下氣劉河間云腸胃鬱結榖氣內發而不能宣通於腸胃之外故喜噫下氣也若癲癎勞瘵氣下泄而不止者必死乃真氣竭絶腠理閉塞榖氣不能宣通於腸胃之外故從腸胃中泄出婁全善云下氣屬心虗經云夏脉者心也心脉不及下氣為泄者是也經又云飲食入胃遊溢精氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱水精四布五經並行此平人也若七情內傷六淫外侵飲食不節房勞過度致脾土之隂受傷轉運之宫失職不能輸化故下氣也又曰隂精所奉其人夀陽精所降其人夭隂精者乃五榖之精上榮心肺以降腎肝故曰其人夀陽精者乃胃中之清氣陷入腎肝不能升浮上輸心肺故曰其人夭若飲食過多腸胃鬱結用平胃散癲癎勞瘵者用補心丸及人參理中湯若下泄不已者不治治驗一小兒飲食素所不節又食蔽氣之物腸胃祕結小便不利而患此以平胃散後用理中湯而愈一小兒年十五嵗勞心太過飲食頓减發熱下氣先用參术各五錢薑棗煎服諸症稍愈一女子素禀虗弱後又勞心女工發熱煩渴下氣余用補中益氣湯加附子又用參茋各一兩歸术各五錢附子一錢三劑全瘥一小兒十四嵗因怒脅痛少食患此用補中益氣湯加附子一錢益志一錢而漸愈後因飲食過多腹脹吞酸噫氣以保和丸服之熱渴痰甚又以二陳湯加黃連石膏之劑大便不止嘔逆不食手足並冷余用六君子湯加附子一錢四劑稍愈又以補中益氣湯加附子一錢兼服八味丸而遂安一女子患前症余用六君子湯送四味茱茰丸而愈但因怒氣相觸前症即發即服前二湯丸其病尋愈後因甚怒兼勞役太過前症復作更又血崩不止余先用柴胡梔子散一劑隨用補中益氣湯加山梔而痊一小兒脾土虗寒患此余以人參理中湯加兔絲子一錢以補脾氣四劑又以六君湯而安後因勞心功課發熱煩渴前症益甚又用柴胡梔子散兼以補中益氣湯而愈一女子年十六患此先用參术之藥不應用六君子湯送四味茱連丸而愈後又因怒氣勞役前症益甚更兼發熱用柴胡梔子散二劑隨以補中益氣湯而痊平胃散方見虗寒補心湯方見瘖補心丸即茯神散為丸方見驚悸補中益氣湯方見虗羸人參理中湯方見驚㵼越鞠丸六君子湯加味歸脾湯加味逍遙散四方見內釣本事枳殼散方見前症柴胡梔子散方見發熱四味茱連丸方見噫氣八味地黃丸方見腎臟六味丸加肉桂附子不寐經曰陽眀胃脉也胃者六腑之海其氣亦下行陽眀逆不得從其道故不得卧也又曰胃不和則卧不安夫人身之衛氣晝則行於陽夜則行於隂陽主動隂主靜寤則魂魄志意散於府藏發於耳目動於肢體而為人身指使之用寐則神氣各歸五宫而為默運之妙矣若脾胃氣盛則腑臟調和水榖之精各各融化以為平和之氣若胃氣一逆則氣血不得其宜腑臟不得其所不寐之症由此生焉當用四君逺志酸棗仁肝腎虗熱者六味丸心血不足者真珠母丸思慮過度者歸脾湯精神短乏者人參飬榮湯病後餘熱者酸棗仁湯膽虗不得眠者人參竹葉湯肝火不寧者加味小柴胡湯振悸不得眠者四君生薑酸棗仁夜啼驚哭不寐各詳别症當恭求之治驗一小兒患瘡潰後飲食少思倦怠不寐先用四君茯神當歸陳皮飲食頓加乃佐以八珍散為末時服錢許漸得寐又因驚汗出發熱不寐用異功散加柴胡山梔汗熱頓止仍服四君八珍之藥得寐又飲食停滯腹痛吐痰不寐汗出用六君柴胡升麻山杳而安一小兒十四嵗勤於功課徹夜不寐飲食無味早間用補中益氣湯午後用異功散飲食漸有味夜稍得寐仍用補中益氣湯八珍湯而愈畢姻後不寐兼遺精盜汗用補中益氣湯六味地黃丸而愈一小兒痢後不食少寐或兼盜汗先用異功散加升麻當歸飲食漸進佐以補中益氣湯稍得寐四年後因用心記誦自汗不寐飲食甚少用補中益氣湯加味異功散而愈一女子十七嵗喪母過哀不寐發熱或寒熱此脾血虗而火動也用加味逍遙散加味歸脾湯治之尋愈後因飲食怒氣不寐腹痛先用六君柴胡升麻而痛止仍用前二藥而得寐仲景酸棗湯治虗勞虗煩不得眠甘草五分知母炒五分白茯苓五分芎藭五分生薑五分酸棗仁炒一錢右水煎服本事鱉甲丸治膽虗不得眠四肢無力鱉甲酸棗仁炒羌活黃茋炒牛膝酒炒人參各一兩五味子右水煎服祕㫖安神丸治心虗而不寐或睡中驚悸或受驚嚇而作人參半夏湯泡酸棗仁炒茯神各一錢當歸酒洗橘紅赤芍藥炒各七分甘草炙三分五味子杵五粒右為末薑汁糊丸芡實大每服一丸生薑湯下人參飬榮湯治脾肺俱虗發熱惡寒肢體瘦倦食少口乾咳而㵼痢驚悸自汗不寐等症人參陳皮黃茋密炙桂心當歸白术甘草炙各一錢白芍藥錢半􅍄地黃七分五味子杵炒七分逺志五分右每服二三錢薑棗水煎四君子湯六味丸二方見腎臟歸脾湯方見內釣人參竹葉湯加味小柴胡湯二方見肝症八珍散異功散六君子湯補中益氣湯四方見虗羸加味逍遙散加味異功散八珍湯三方見內釣驚悸驚悸者心神恐懼邪氣乘心也目睛不轉口不能言診其脉動而弱者動則為驚弱則為悸哭而不啼多淚是也宜急調治否則他症隨之用四物安神之類丹溪謂亦有屬痰者宜用溫膽湯加辰砂逺志之類若思慮便動虗也用飬心湯時作時止痰也用茯苓丸觸事易驚心膽虗怯也用溫膽湯卧驚多魘血不歸源也用真珠母丸夢寐不寧肝魂失守也用定志丸恐畏不能獨處膽氣虗冷也用茯神湯睡卧煩躁膽氣實熱也用酸棗仁丸眩運驚悸風痰內作也用本事辰砂逺志丸思慮鬱結脾虗氣滯用歸脾湯前症雖曰屬心與肝而血之所統實主於脾脾之志曰思思慮多則血耗損而不能滋飬於肝心者脾使之也思慮內動未嘗有不役其心者夫心為君火之藏十二官之主也夫君之德不怒而威無為而治故宜鎮之以靜謐戒之以妄動動則相火翕合煽爍隂精精血既虧則火空獨發是以驚悸怔忡之所由生五志之火所不能制者矣故治脾者不可不知飬心飬心者不可不知鎮靜而寡欲然人孰無思也思之正則無妄動之欲矣朱子曰必使道心常為一身之主而人心每聼命焉此善於飬心者也治驗一女子素血虗驚悸出嫁後更怔忡晡熱月經過期用八珍湯加逺志山藥酸棗仁三十餘劑漸愈佐以歸脾湯全愈後因勞怒適經行不止前症復作先用加味逍遙散熱退經止又用飬心湯而痊一小兒十五嵗徹夜用功記誦去後少寐仍不戒勞患怔忡發熱不止用歸脾為主佐以八珍湯諸症漸愈後復作服歸脾定志二藥即愈一小兒十五嵗因用心太過少寐驚悸怔忡惡寒先用補中益氣湯茯苓酸棗仁逺志惡寒漸止又用加味歸脾湯驚悸稍安又用飬心湯而痊一小兒驚悸睡卧不安發熱飲冷用治要茯苓散而愈又因勞役恚怒發熱吐痰自汗用溫膽湯二劑而安又用歸脾湯寧志丸而愈一小兒十三嵗善思多憂體倦發熱心懷畏懼必多人相伴乃止用茯神湯佐以歸脾湯兩月餘漸愈畢姻後前症復作加寒熱頭運先用前二湯而驚悸愈後用十全大補湯補中益氣湯諸症漸愈後因科舉入場勞役朝寒暮熱自服前二湯各三十餘劑不應時仲秋脉虗大按之微細靣白腹痛亦用前方倍加肉桂乾薑四劑亦不應遂以八味丸料煎服四劑稍緩又四劑漸愈乃八味丸十全大補湯而安一女子十五嵗性沉靜被盜所恐遂驚悸腹脅脹痛寒熱往來不食無寐善思恐懼用酸棗仁丸歸脾湯加味逍遙散而尋愈出嫁後喪子兼大勞驚悸無寐吐痰發熱飲食少思胸腹膨脹服化痰藥日吐痰四五碗時考績至京請治余謂脾肺虗寒不能攝涎化食而為痰也用六君乾薑六劑其痰益甚手足並冷用前藥每加附子一錢仍不應乃用人參一兩附子二錢四劑始稍緩又二劑仍用六君加薑附各五分數劑後易桂治之而愈溫膽湯治心膽虗怯觸事易驚或夢寐不祥遂致心驚膽攝氣鬱生涎涎與氣摶變生諸症或短氣悸乏或復自汗膽虗不能制脾則脾之水飲作矣白茯苓一兩五錢半夏湯洗二兩甘草炙一兩枳實麩炒二兩竹茹二兩橘皮去白二兩右每服四錢水一盞半薑五片棗一枚煎七分食前服寧志丸治心虛多驚若有痰宜吐之人參白茯苓茯神柏子仁琥珀當歸酸棗仁溫酒浸半日去殼逺志炒各半兩乳香朱砂石菖蒲各三錢右為末蜜丸桐子大每服三十丸食後棗湯下茯神散治五臟氣血虛弱驚悸怔忡宜用此安神定志茯神去木人參龍齒另研逺志去心桂心防風獨活酸棗仁細辛白术炒各三錢乾薑炮三兩右為末每服四五錢水煎服蜜丸亦可治要茯苓補心湯治心氣不足喜悲愁怒衄血面黃五心煩熱或咽喉間作痛舌本作强方見瘖茯神湯治膽氣虛冷頭痛目眩心神恐畏不能獨處胸中煩悶茯神去木酸棗仁炒黃茋炒梔子仁炒白芍藥炒五味子杵炒桂心熟地自製人參各一兩甘草五錢炒右每服五錢薑水煎酸棗仁丸治膽氣實熱不得睡卧神志不安驚悸怔忡茯神去木酸棗仁炒逺志去心柏子仁炒防風各一兩枳殼􅔇炒五錢青竹茹錢半生地黃杵膏五錢右為末蜜丸梧子大每服七八十丸滚湯下定志丸治心神虛怯所患同前或語言鬼怪喜笑驚悸人參茯苓各一兩半菖蒲逺志去心各一兩右為末蜜丸如前服治要茯苓散治心經實熱口乾煩渴眠卧不得心神恍惚茯神兩麥門冬兩半通草升麻各一兩二錢半紫苑七錢五分桂心七錢五分知母一兩大棗十二枚淡竹茹五錢赤石脂一兩七錢五分右每服一兩水煎朱雀丸治心病怔忡不止白茯苓二兩沉香半兩右為末蜜丸小豆大每服三十丸人參煎湯下世傳蜜陀僧散治驚氣入心絡不能語者昔有人為狼及犬蛇所驚皆以此而安蜜陀僧研極細末如粉右茶清調一錢七分丹溪硃砂丸治勞役心跳硃砂當歸身白芍藥側柏葉各二錢川芎陳皮甘草黃連炒各一錢五分右用猪心血為丸粟米大每服百丸龍眼湯下本事辰砂逺志丸消風化痰鎮心安神人參石菖蒲去毛逺志去心茯神各一兩川芎山藥白附子麥門冬細辛鐵粉辰砂各五錢右為末用生薑汁入水糊丸菉豆大以朱砂為衣每服一二十丸臨睡生薑湯下歸脾湯六君子湯加味逍遙散三方見內釣補中益氣湯方見虗羸真珠母丸方見不寐十全大補湯八珍湯二方見自汗飬心湯方見驚癎吞酸吞酸之症有二熱與寒也經曰諸嘔吐酸皆屬於熱東垣曰病機作熱攻之誤矣濁氣不降寒藥豈能治之二說似乎矛盾而實一也素問言熱者所以指其末也東垣言寒者所以指其本也丹溪用吳茱茰之法亦嘗謂之寒矣然亦當分其虗實而治之若煩熱作渴好食啖物飲食易化是為實火內熾而胃經熱也宜用清凉飲之類若不渴喜食熱物飲食難化是為虗火所致而胃經寒也宜用香砂六君子湯之類故東垣云邪熱不殺榖苟誤認為實熱槩用寒凉之劑而變為中滿嘔吐反胃之症者皆末傳寒中之敗症也可不慎歟治驗一小兒吞酸用六君子湯而愈後傷食復作兼㵼先用五味異功散加升麻乾薑㵼頓止又以六君子煎送四味茱茰丸而愈一小兒吞酸噯腐發熱口渴先用保和丸二服以消宿滯又用六君木香乾薑以溫飬中氣而愈後傷冷粉腹脹痛余用異功散加乾薑諸症漸愈用補中益氣湯加木香將愈又傷食吞酸腹痛用六君木香二劑痛止又四劑而愈一小兒吞酸喘嗽腹脹靣白兼青余謂脾肺之氣虗先用補中益氣湯加茯苓半夏二劑喘脹悉愈又用六君子湯及五味異功散而愈一小兒十三嵗吞酸每食碗許稍多則㵼或腹脹靣色黃或青白此乃肺虗肝木所勝用六君乾薑柴胡升麻間佐以補中益氣湯而痊畢姻後兼勤於功課仍吞酸唾痰服清熱藥大便不實嗜卧少食而似肉痿用前藥各百餘劑而痊一女子吞酸唾痰恪用清氣化痰之藥余謂屬中氣虛不信後覺肚腹脹腫大小便淋􅅹而殁六君子湯加木香砂仁名香砂六君子湯異功散二方見內釣補中益氣湯保和丸二方見虗羸四味茱連丸方見噫氣脾弱多困丹溪云脾具坤靜之德而有乾健之運夫胃陽也主氣脾隂也主血胃司納受脾司運化一納一運化生精氣清氣上升糟粕下降納五榖化津液其清者為榮濁者為衛隂陽得此謂之槖籥故東垣以脾胃為五臟之根本也脾氣既弱則健運之令不行化生之功已失職而嗜卧多困所由生焉法當溫補其脾脾氣既旺則臟腑清陽之氣升舉易於運行又何困倦之有海藏用四君子加木香半夏白术倍之薑棗煎服誠良法也若脾虗好睡多驚則是心血虗而火動之宜安神飬血若因心脾氣虗有痰者宜用人參五味子茯苓以補心氣當歸芍藥酸棗仁以飬心血橘紅半夏以開痰若因脾肺氣虗胸膈有痰用補中益氣湯以健脾胃膽星天竺丸以化痰涎若飲食停滯而作用四君子湯以益脾土山查神麯以消飲食若因脾虗而好睡用五味異功散以補脾氣當歸芍藥以生脾血芍藥須用酒拌炒黃不則酸寒傷脾此假熱以對假寒也若乳母飲酒致兒昏醉好睡者以乾薑陳皮煎湯解之不應用異功散加乾葛即愈矣治驗楊永興子年七嵗嗜卧兼驚久不愈余曰好睡是脾氣虗困也善驚是心血虗怯也此心火不能生脾土子母俱病用補中益氣湯及六味地黃丸加鹿茸而愈一小兒因母醉後飲乳困睡不醒遍身如丹瘤先君謂酒毒為患用葛花解醒湯令子母俱服之而愈一小兒病後嗜卧飲食少思靣色痿黃中隱青色用五味異功散加柴胡升麻為末每服錢許日二三次月餘稍愈又飲食過多更患嘔吐手足並冷飲食頓减先用六君子湯加升麻柴胡木香乾薑二劑諸症漸愈又用補中益氣湯為末日服二三次月餘而安一小兒九嵗患痢後嗜卧唾痰服化痰藥生痰益甚而卧床三年矣靣色痿黃兼白或時青赤右關脉微細左關脉弦數余謂肝火乘脾用六君升麻柴胡三十餘劑而稍健乃以補中益氣湯間服又各三十餘劑而少坐又五十餘劑而痊一女子十一嵗患痢後嗜卧唾痰飲食難化胸腹膨脹服化痰利氣之劑益甚余謂悉屬脾胃氣虗而飲食化痰也朝用補中益氣湯夕用五味異功散兩月而愈又傷食吐㵼用六君子湯月餘不應乃以人參五錢乾薑五分薑棗煎服百餘劑始應仍用補中益氣湯異功散而痊膽星天竺丸治小兒痰涎上壅喘嗽不休牛膽南星一兩半夏湯泡去皮臍薑汁製白附子湯泡去皮臍各五錢天竺黃三錢天麻防風辰砂一錢叧研水飛右為末甘草湯為丸芡實大每服一丸空心薄荷淡薑湯化下五味異功散六君子湯四君子湯三方見內釣補中益氣湯方見虗羸六味地黃丸方見腎臟葛花解醒湯方見熱吐尋衣撮空尋衣撮空許叔微謂之肝熱夫肝主筋筋脉血枯而風引之故手指為之撮斂也宜確服六味地黃丸間有回生之功錢仲陽用㵼青丸此治肝經實熱蓋尋衣撮空皆病後之敗症耳求其實熱則百無一二矣治者審之王海藏治血脫尋衣撮空摸床手揚搖頭錯語失神脉弦浮而虗血脫內躁熱之極也氣粗鼻乾此為難治用生地黃連湯主之治驗王少參孫女年十二嵗脾胃素弱後成疳症發熱小腹膨脹堅直大便溏㵼氣喘咳嗽徹夜煩躁不睡鼻塞眼暗譫語其脉大而無根用人參一兩附子三分腹脹漸减脉漸斂然猶尋衣撮空鼻孔出血用六味地黃丸料二服如脫乃晝服獨參薑附湯及服地黃丸料脉漸有根諸症漸愈又用六君子補中益氣湯而痊詳見發熱一小兒停食夜驚腹痛服消食丸㵼數次尋衣撮空靣青黃或色白此脾土受傷肺金休囚肝火旺而然耳先用異功散加升麻以補脾土用六味地黃丸料以滋肝血稍定各二劑漸愈却用補中益氣湯六味地黃丸間以異功散而痊一小兒受驚駭恪服鎮驚化痰等藥忽患前症眼上靣痿黃或兼青赤此肝經隂血虗陽氣旺而生風耳當滋肝腎益脾肺遂用異功散而痊一小兒靣痿黃患瘰􅐇忽發靣色青赤此脾氣虗木火相摶而為患也用補中益氣湯佐以柴胡山梔散二服加味逍遙散三服諸症漸退又以地黃丸而遂痊一小兒流注出膿甚多患前症此元氣虗弱內熱而變耳用八珍湯異功散各數劑方稍緩又數劑而安又補中益氣湯而愈一小兒膝癰誤觸其膝出血甚多患前症惡寒靣白此陽隨隂散而虗寒用十全大補湯加附子三分四劑未應用人參一兩附子五分薑棗煎服稍退又二劑頓退乃朝用異功散夕用八珍湯而安一小兒傷風表汗後患前症惡風靣白手足冷用補中益氣湯五味子汗頓止而諸症漸退又用四劑而安乃十全大補湯而愈生地黃連湯治血脫尋衣撮空搖頭妄語赤芍藥梔子黃芩黃連各三錢生地黃川芎當歸各七錢防風一錢五分右每服三錢水煎服加味逍遙散異功散六君子湯三方見內釣地黃丸方見腎臟補中益氣湯方見虗羸柴胡梔子散方見發熱㵼青丸方見肝臟八珍湯四物四君二湯合用十全大補湯方見自汗喜笑不休經曰心藏神有餘則笑不休又曰在臟為心在聲為笑在志為喜又火大過曰赫曦赫曦之紀其病笑謔狂妄又云少隂所至為喜笑又云精氣并於心則喜此數者皆言屬心火也若笑不休呻而為腹痛此水乘於火隂擊於陽陽伏熱生狂妄譫語不可聞心之損矣扁鵲云其人唇口赤色者可治青黑者死若腎水虧涸不勝心火而喜笑不休者用六味地黃丸肝火熾盛能生心火而喜笑不休者用柴胡清肝散餘兼别症各從其症而恭治之治驗一小兒喜笑常作不安靣赤飲冷手足並熱先用黃連㵼心湯未二服稍定又用六味地黃丸料煎服頓愈常服此丸則安月許不服仍前復作又服愈矣一小兒患前症靣青赤此肝心二經風熱所致也用柴胡梔子散六味地黃丸漸愈又因乳母大怒發熱先用加味柴胡湯又用加味逍遙散母子服之並愈一小兒患前症因乳母大怒患血崩寒熱先用加味逍遙散一劑用當歸補血湯三劑如此治之各數劑母子並愈一小兒年十四嵗用心過度飲食失節患喜笑不休脉洪大而虗靣色赤而或白余用補中益氣湯而愈次秋科舉飲食勞倦前症復作或兼譫語洪大按之微細如無用人參一兩薑棗煎服稍定又三劑而愈又勞役用心自汗作渴煩躁似癎症先用當歸補血湯二劑頓安又十全大補湯而尋愈一女子十六嵗靣色痿黃素沉靜喜笑不休月經先期用柴胡梔子散加味逍遙散而愈次年出嫁不時復作但作時靣赤勇力發後靣黃體倦朝用補中益氣湯夕用加味逍遙散而愈後每發悉用前藥即愈當歸補血湯柴胡梔子散柴胡清肝散二方見發熱黃連㵼心湯方見煩躁地黃丸方見腎臟薛氏醫案卷六十三
