body:
  text: 薛氏醫案卷七十七明薛已訂小兒痘疹方論嘗謂小兒病證雖多而瘡疹最為重病何則瘡疹之病葢初起疑似難辨投以他藥不惟無益抑又害之况不言受病之狀孰知畏惡之由父母愛子急於救療醫者失察用藥差舛鮮有不致夭横者文中每思及此惻然於心因取家藏已驗之方集為一卷名之曰小兒痘疹方論刻梓流布以廣古人活幼之意顧不韙歟和安郎判太醫局兼翰林良醫陳文中謹書論痘疹受病之由夫小兒在胎之時乃母五臟之液所養成形也其母不知禁戒縱情厚味好啖辛酸或食毒物其氣傳於胞胎之中此毒發為瘡疹名曰三穢液毒一五臟六腑穢液之毒發為水泡瘡二皮膜筋肉穢液之毒發為膿水泡瘡三氣血骨髓穢液之毒發為膿血水泡瘡三毒既出發為疹痘瘡也子母俱忌食葱韮薤蒜醋酒鹽醤獐兎鷄犬魚腥等物世俗未曉將為發舉往往不顧其後誤傷者多矣論痘疹治法凡小兒瘡疹未出已出之間有類傷寒之狀憎寒壯熱身體疼痛大便黄稠此正病也若無他疾不必服藥愚按痘疹若小兒首尾平和自有勿藥之喜葢其腸胃軟弱易為虚實故必不得已折其太過益其不足可也凡療瘡疹先分表裏虚實如表裏俱實者其瘡易出易靨表裡俱虚者反是表實裡虚者其瘡易出難靨表虚裡實者亦反是若始出一日至十日渾身壯熱大便黄稠乃表裡俱實其瘡必光澤起發滿肥且易靨也愚按治痘疹之法與癰疽無異若邪氣在裡而實熱者用前胡枳殻散元氣怯而虚熱者用參茋四聖散虚弱者用紫草木香湯虚寒者用參茋内托散虚寒内脱者用木香散若邪氣在表而實熱者用麻黄甘葛湯此要法也餘見各症凡瘡疹已出未出之間或瀉渇或腹脹或氣促謂之裡虚急用十一味木香散治之愚按經云眞氣奪則虚邪氣勝則實實謂邪氣實而眞氣虚也然倒靨瀉渴等症若喜熱飲食手足並冷或不食嘔吐者是為陽氣虚寒也用辛熱之劑補之喜冷飲食手足不冷或唇舌黑裂者陽氣實熱也用苦寒之劑瀉之凡瘡疹已出未愈之間不光澤不起發不紅活謂之表虚急用十二味異功散治之愚按張翼之云吐瀉少食為裡虚陷伏倒靨灰白為表虚二者俱見為表裡俱虚用異功散救之甚至薑附靈砂亦可用若止裡虚減官桂止表虚減肉荳蔲若能食便閉而陷伏倒靨者為裡實輕用射干䑕粘子湯重用前胡枳殻散下利吐瀉能食為裡實若用實裡則結癰毒紅活定凸為表實若用補表則潰爛不結痂凡痘一見斑㸃便忌葛根湯恐發得表裡也凡痘瘡已出未愈之間不光澤不起發不紅活或腹脹或瀉渴或氣促謂之表裡俱虚急用十二味異功散送七味肉荳蔲丸治之愚按前症審係表裡虚寒急用前法緩則不救一小兒出痘不起發紅活腹脹瀉渴皆以為不治施院使為表裡虚寒用十二味異功散一劑即起發紅活諸症頓退又用參茋内托散貫膿而靨儒者薛戒甫子五歲出痘三四日下紫血十數滴至八日不止而瘡不起御醫錢春林謂脾氣虚寒用木香散二劑用丁香十一粒人參五錢一日服之次日痘皆起而有膿由是血漸止二十餘日而愈一小兒起發紅活但不時作痒口乾作渴便血面赤發熱先君謂腸胃有熱先用濟生犀角地黄湯加柴胡一劑諸症漸退形體倦怠此邪氣去而形氣虚弱耳用四君子湯加當歸黄茋紅花二劑而安一小兒痘瘡赤痛煩熱作渴或便血或䘐血先君用犀角地黄湯而血愈又用紫草快㿀湯加黄茋芍藥而愈後瘡痕色白用四君歸茋治之而痊一小兒出痘吐血其痘赤痛如錐或瘡出血余謂肝火熾盛用小柴胡湯加生地一劑隨用濟生犀角地黄湯一劑頓愈又用芹菜汁而痊一小兒痘瘡下血而不起發先君謂氣血不足用紫草快㿀湯加參茋歸术治之血止瘡起但貫膿遲緩用八珍湯倍加參茋數劑瘡靨而根白痒此氣血虚而熱也用八珍湯二十餘劑而愈一小兒痘疹大便下血小便甚赤瘡顆色赤發熱飲冷先君謂熱毒鬰滯先用八正散一劑後用解毒防風湯一劑頓愈又飲芹菜汁而全痊一小兒痘正發而便血倦怠少食作渴飲湯余謂倦怠便血此脾虚而不能攝血也少食作渴此脾虚而津液短少也用五味異功散加升麻紫草治之而愈一小兒便血腹脹困倦發熱口乾飲湯四肢逆冷先君以為脾氣虚寒不能攝血用五味異功散加丁香十粒炮薑五分二劑血止痘貫而靨一小兒七歲患痘瘡腹脹八九日矣先君云當急補脾主不信仍服消毒之藥忽大便下血甚多而歿一小兒作渴泄瀉發熱飲冷唇舌皺裂瀉糞穢臭先君以為内熱所作用前胡枳殻散稍愈又用清涼飲加漏蘆乳母服之兒頓安凡小兒斑駁疹毒之病俗言疹子是肺胃蘊熱因時氣薰發於外狀如蚊蚤所咬赤則十生一死黒則十死一生大抵遇春而生發至夏而長成乃陽氣薰蒸故得生成者也臟腑調和血氣充實則易出易靨葢因内無冷氣外常和暖也凡痘疹熱渴切不可與𤓰柿蜜水等冷物及清涼飲消毒散等藥恐損脾胃則腹脹喘悶寒戰咬牙而難治葢咬牙者齒稿也乃血氣不榮不可妄作熱治愚按前症若兼吐瀉手足指冷者属内虚寒而外假熱也急用木香散如不應用異功散若大便不通渇欲飲冷者則前所禁蜜水之類又當用矣但宜審其熱之虚實若属虚熱者雖欲水拒之而不飲當用人參白术散熱渇自止属實熱者自甚索水且喜而飲之當以犀角磨水服諸症即解其後亦無餘毒之患矣北方出痘不拘冬夏若喜冷者再不用藥但與水飲無有不愈葢北方地燥而又睡熱炕故也一婦人患時疫將愈更出痘瘡大起發體倦痛甚則昏憒煩渴飲湯不思食用十全大補湯及朱砂末其痛頓止食進體徤仍用前湯倍加參茋十餘劑而貫膿又數劑而愈一姙婦發熱作渴遍身骨節作痛用仙方活命飲二劑諸症稍愈至十一日出痘百餘顆形氣甚倦用紫草木香散又出少許但口乾作渴用人參白木散而渴止用八珍湯加丹皮柴胡而貫膿後去丹皮柴胡倍加參茋數劑而痘靨一男子年將三十出痘根窠赤痛發熱作渴服紫草飲之類前症益甚痘裂出血余用小柴胡加生地犀角二劑諸症頓減又用聖濟犀角地黄湯而貫膿再用八珍湯而結痂一小兒煩躁飲冷不止先君用濟生犀角地黄湯頓愈後渴而喜熱又用當歸補血湯而痊惟倦怠少食用七味白术散而瘥一小兒患此飲冷不止或痘脹痛先君用濟生犀角地黄湯并芹菜汁而頓愈凡痘瘡出不快多属於虚若誤謂熱毒壅盛妄用宣利之濟致臟腑受冷榮衛濇滯不能運達肌膚則瘡不能起發充滿後不結實成痂痒塌煩躁喘渴而死愚按前症亦有各經熱盛壅遏而出不快者亦有毒甚痘疔而不能起發者亦有餘毒而潰痒者當細審其因而藥之一小兒九歲出痘六日痒塌寒戰院使錢宻庵用十一味木香散二劑貫膿用參茋托裡散而靨後痕白作痒用十全大補湯而愈一小兒痘瘡膿未滿面赤作痒余謂氣血虚而有熱欲用溫補之劑不信乃服清熱之藥至十三日瘡痕色赤虚煩作渴腹痛不食手足逆冷而殁一小兒未過歲瘡痘焮痛出血哭不能已診其母有肝火先用小柴胡加山梔生地與母服子飲數滴頓愈又用加味逍遥散而痊一小兒出痘内有痘疔數枚雖挑破出黑血熱毒不解餘痘不發皆以為不治先君以仙方活命飲徐灌一劑痘疔解而諸痘亦愈一小兒痘疔患在臀間色黑大痛挑出黑血仍復堅痛皆以為不治先君用隔蒜灸數壯痛止色淡而軟挑出黑血甚多灌以活命飲患處及諸痘貫膿而愈凡小兒纔覺傷風身熱是否瘡疹便服四味升麻葛根湯愚按痘疹未明而元氣實者最宜前湯若元氣虚者又當詳治恐發得表虚而痘難出也一儒者年三十餘因勞役倦怠發熱服補中益氣湯數劑發赤㸃以為㿀另服升麻葛根湯一劑更加惡寒仍服益氣湯四劑至九日出痘甚多余用八珍湯加黄茋白芷紫草四劑至二十日膿始貫用十全大補湯月餘而靨凡痘疹始出一日至五七日之間雖身熱或腹脹足稍冷或身熱瀉渴或身熱驚悸腹脹或身熱出汗者服十一味木香散愚按前症属脾氣虚寒假熱非此藥不救如未應佐以六君子專補脾氣更不應加木香補骨脂肉荳蔲兼補腎氣一小兒第五日不紅活至九日貫膿不滿余謂氣血虚弱用十全大補湯治之庻無後患不信至脱痂痕作痒色白至十四日而殁一小兒第七日膿清不滿形氣倦怠飲食少思大便不實用托裡散二劑手足指冷咬牙作渴用木香散倍用參茋一劑諸症頓退又用參茋四聖散四劑而愈凡瀉水榖或白色或淡黄煎十一味木香散送七味肉荳蔲丸治之瀉止者住服不止者多服愚按前症若察其外症若唇青指冷睡而露睛口鼻氣寒瀉色青白脾腎虚寒也用前藥六君子湯加補骨脂肉荳蔲若頰赤體熱睡不露睛口鼻氣熱瀉色黄赤脾土實熱也用瀉黄散一小兒腹脹渴瀉氣促體倦先君以為表裡俱虚用六君子湯加歸茋送四神丸一服諸症頓退瘡勢頓正但膿遲而渴仍用前湯加歸茋二劑瘡色紅活形體頗安任其貫膿而痊凡瀉頻津液内耗血氣不榮瘡雖起發亦不能靨也如身溫腹脹咬牙喘渴者難治緣榖食去多津液枯竭飲水蕩散眞氣故多死矣速與十一味木香散救之如不應急用十二味異功散愚按前症兼手足指冷面色青白等症者属陽氣虚寒急用木香散陽氣脱陷用異功散脾氣虚弱用六君子湯血氣虚弱用八珍湯不應用十全大補湯一小兒第九日不紅活不貫膿云殁於十三日陳院長謂属虚寒用十一味木香散二劑漸紅活貫膿又用紫草木香湯及人參白术散而愈族姪孫衍慶六歲出痘稀少瘡痂悉落至十三日身煩熱而畏寒手足逆冷厚衣圍火不能溫皆謂不治余思大熱而不熱者是無火也急用人參理中湯煎服一杯肢體頓溫更用人參白术散調理而痊一男子年二十餘發熱煩躁痘黯出血足熱腰痛用聖濟犀角地黄湯二劑而貫膿用地黄丸料數劑而瘡靨一男子年將三十出痘色紫作渴飲水腰痛足熱耳聾余謂腎虚之症用加減八味丸料煎與恣飲熱渴頓止佐以補中益氣湯加五味麥門而愈一小兒十二歲出痘色黯兩足及腰熱痛便秘咽舌乾渴引飲不絶衆謂腎虚不治先君用加減八味丸料作大劑煎與恣飲至二觔諸症悉退又佐以補中益氣及八珍湯各十餘劑而痊凡四五日不大便用嫰猪脂一塊以白水煑熟切豆大與食之令臟腑滋潤使瘡痂易落切不可妄投宣瀉之藥元氣内虚則瘡毒入裡多傷兒也愚按前症若因熱内蘊宜用射干䑕粘子湯解之或發熱作渴或口舌生瘡或咽喉作痛並宜用之凡瘡疹初出兩三日至十三日當忌外人及卒暴風寒穢惡之氣輕者三次出大小不一頭面稀少眼中無根窠紅肥滿光澤也重者一齊出如蠶種灰白色稠宻瀉渴身溫腹脹頭溫足冷也輕變重者犯房室不忌口先曾瀉飲冷水餌涼藥也重變輕者避風寒常和暖大便稠也愚按丹溪先生云痘疹宻則毒甚用人參敗毒散犀角地黄湯或以涼藥解之雖數貼亦不妨一小兒痘疹宻甚至九日貫膿不滿色不紅活或云當殁於十二日余以為氣血虚弱用八珍湯内加糯米百粒數劑至十五日膿完色正結痂而愈一小兒五歲出痘宻而色白属虚弱也始末悉用補托之藥而安旬餘飲食過多忽作嘔吐面白兼青目唇牽動先君以為慢脾風症用五味異功散加升麻柴胡不信翌日手足時㗜服前藥而不應急加木香乾薑二劑而愈一小兒第五日矣稠宻色黑煩躁喜冷先君以為火極似水令恣飲冷芹汁煩熱頓止乃以地黄丸料服之至二十餘日而愈凡身熱發煩渴者宜用六味人參麥門冬散治之如不應用七味人參白术散愚按前症若渴而飲冷者脾胃實熱宜用麥門冬散若渴而飲湯者氣虚熱渴宜用白术散若大渴引飲面赤血虚發躁也用當歸補血湯凡痘瘡欲靨已靨之間而忽不能靨兼腹脹煩渴者急用十一味木香散愚按前症若兼惡寒或四肢冷瘡毒去而脾胃虚寒也宜用前藥若十指逆冷咬牙等症陽氣脱陷也用十二味異功散脾氣虚陥用六君加川芎當歸黄茋主之一小兒九嵗出痘第七日發熱煩躁不貫膿色灰白寒戰咬牙瀉渴腹脹手足冷時仲夏飲沸湯而不熱腹中隂冷先用木香散二劑益甚用異功散一劑頓安又用六君子加附子三分二劑後用調補之劑至十四日而愈凡痘瘡欲靨已靨之間忽頭面溫足指冷或腹脹瀉渴氣促者急服十二味異功散若十一二日當靨不靨身不壯熱悶亂不寧卧則哽氣煩渴嚙牙者急用十二味異功散加歸术以救隂陽表裡凡痘瘡已靨煩渴不止或頭溫足冷或腹脹或瀉或咬牙多致難愈急用十一味木香散以救之以上之症若誤與蜜水生冷之物則轉加熱渴而死愚按前症属脾胃虧損内眞寒而外假熱耳非温補不救如前藥未應用十全大補湯加附子以純補之一小兒頭生一癤出膿將愈忽癤間腫脹發痘二十餘顆遍身赤㸃用快斑湯而漸出用紫草散倍加參茋而出完用托裡消毒散而膿貫用托裡散而瘡靨一小兒痘已靨其痕色赤而錯縱日食粥七八碗作渴面赤先用白术散二劑渇減五六粥減大半又用四君加蕪荑黄連二劑痕平色退乃用八珍湯加蕪荑山梔而痊一小兒痘瘡愈後泄瀉飲食不化此脾腎氣虚用六君加補骨脂肉荳蔲治之而愈一小兒痘瘡將愈患泄瀉侵晨為甚飲食不化属脾腎虚也朝用補中益氣湯夕用二神丸而愈凡身壯熱經日不除如無他症用六味柴胡麥門冬散治之熱退即止如不愈服七味人參白术散愚按前症若肝膽熱毒用柴胡麥門冬散若肝經血虚用四物湯加黄茋柴胡若中氣虚熱用人參白术散一男子患痘瘡作痛發熱不止其勢可畏皆以為不起施銀臺用消毒救苦湯治之諸症頓退予先用仙方活命飲痛全止又用八珍湯加紫草三錢四劑貫膿而靨一小兒患痘稠宻大痛發熱勢甚危急先君用消毒救苦湯一劑安卧良久遍身出小痘頓消再劑俱實膿而靨凡身壯熱大便堅實或口舌生瘡咽喉腫痛皆瘡毒未盡用四味射干䑕粘子湯如不應用七味人參白术散愚按前症若壯熱飲冷属熱毒在表宜用前湯若兼大便不通属熱毒在内少用四順清涼飲若熱毒既去胃氣虚而發熱用七味人參白术散若因隂血虧損而發熱用四物湯一小兒六歲患痘第七日根顆赤痛大便秘結小便赤濇煩躁飲冷或用清涼解毒之劑未應錢宻庵以為熱毒内藴用四順清涼飲一劑并猪膽汁導下結糞而安又用犀角地黄湯其痘自靨一小兒痘瘡發熱作渴焮赤脹痛大便秘結先用四順清涼飲一劑諸症頓退又用四味䑕粘子湯一劑諸症全退再用紫草湯而貫膿用消毒飲而痘靨一小兒痘愈而聲瘖面赤足心發熱小便赤少先君以為腎經虚熱用六味地黄丸補中益氣湯而愈其時患是症用清熱解毒者俱不起一小兒十一歲患痘第四日根盤紅活起發因痛甚不止至七日形氣甚倦痘色淡而欲陷此因痛盛而傷元氣也先用仙方活命飲一劑而痛止再用八珍湯而貫靨凡風熱咳嗽咽膈不利用三味桔梗甘草防風湯治之如不應用七味人參白术散主之愚按前症如痘熱内作宜用桔梗甘草防風湯如兼痰熱咳嗽佐以抱龍丸若氣虚痰涎壅上宜用人參白术散以補脾肺一小兒痘瘡十二日患咳嗽十餘日不愈所服皆發表化痰余曰此脾肺氣虚復傷眞氣而變肺癰也不信仍服前藥果吐膿血用桔梗湯而愈一小兒痘將愈咳嗽面色黄白嗽甚則赤用五味異功散調補而愈凡涕唾稠粘身熱鼻乾大便如常小便黄赤用十六味人參清膈散如不應用七味人參白术散愚按前症属脾肺蘊熱痘邪為患用清膈散解散邪氣若脾肺虚熱不能司攝用人參白术散調補中氣一小兒痘赤壯熱咳嗽痰甚煩熱作渴用人參清膈散一劑諸症頓退日用芹菜汁旬餘而靨一小兒痘瘡狂喘躁熱作渴飲冷痰涎不利先君用十六味清膈散犀角地黄湯各一劑頓愈又用當歸補血湯而愈一小兒痘赤狂喘大便不利先君治以犀角地黄湯芹菜汁而痊一小兒痘愈後涕唾口乾飲湯鼻塞或腹作脹先用白术散二劑後用六君子湯而愈凡痰實壯熱胸中煩悶大便堅實卧則喘急速用五味前胡枳殻湯治之愚按前症若因脾胃藴熱宜急用前湯緩則熱毒延内多致有悞一小兒患痘赤痛痰喘作渴大便不利錢宻庵用前胡枳殻散一劑諸症頓退又用濟生犀角地黄湯二劑月餘而愈一小兒第八日根窠赤腫脹痛作渴大便下黑血煩渴痰喘飲冷呻吟求治施銀臺以為血熱毒蓄於内用聖濟犀角地黄湯一劑諸症悉退又用消毒丸及化斑湯而愈一小兒痘根色赤作痛發熱口渴喜冷大便堅實用清涼飲一劑痛熱少減再劑便利渴止却用聖濟犀角地黄湯而安用芹菜汁而靨一小兒痘根色赤作痛熱渴喜飲冷水大便不利先用五味前胡枳殻散大便利而熱渴減又用聖濟犀角地黄湯而安用芹菜汁而靨一小兒大便不利小便赤澁作渴飲冷先君用涼膈散一劑漸愈又用濟生犀角地黄湯及芹菜汁而痊若乳母有肝火兒患此症必用加味逍遥加黄芩犀角兼治其母一小兒痘已愈而痕赤作痛内熱作渴二便不利先君用濟生犀角地黄湯及芹菜汁而痊後用四物黄茋而安一小兒痘痕白或時痒作渴飲湯大便稀溏先君用五味異功散加當歸黄茋而瘥一小兒痘痕白時或痒先君以為氣血俱虚用八珍湯補之不信自用解毒之劑後卒變慢脾風而殁惜哉凡飲氷雪不知寒者陽盛隂虚也飲沸湯不知熱者隂盛陽虚也陽盛則補隂木香散加丁香官桂隂盛則補陽異功散加木香當歸每一兩藥共加二錢愚按陽盛者當用清涼飲以補隂隂盛者當用異功散以補陽須審的實而用若或少差死在反掌前云乃傳寫之誤凡痘瘡首尾若誤飲冷水瘡靨之後其痂遲落或生廱腫或成疳蝕葢脾胃属土而主肌肉水濕所傷則津液衰少榮衞澁滯不能周流故瘡痂遲落而生廱腫愚按痘廱之類属血熱未解而内作外邪搏於肌膚之間或餘毒蘊結經絡輕則肌表津淫瘙痒重則肢節壅腫作痛若餘毒熾盛先用仙方活命飲以解其毒却用托裡消毒散毒氣將盡用四君歸茋以補托元氣大凡痘瘡始末皆係脾胃之氣所主若飲食藥餌失宜多致變症故凡飲食少思内熱晡熱者属脾胃氣虚血弱佐以四君芎歸黄茋升麻若飲食如常發熱作痛者属氣血虚弱餘毒為患佐以射干䑕粘子湯若飲食如常發熱作痛大便秘結者属熱毒内蘊用大連翹飲如不應仙方活命飲若根赤而作痒血虚也四物加牡丹皮色白而作痒血虚也四君加當歸芍藥色赤而作痛血熱也四物加連翹金銀花腫而不潰血氣虚也用托裡消毒散潰而不愈脾氣虚也用六君子湯一小兒痘毒蝕陥敷以雄黄散及服加味解毒散而愈一小兒痘毒遍身腐潰膿水淋漓以經霜茅草研末鋪於寢席更服九味解毒散頓愈用神效當歸膏敷之而痊一小兒痘毒後腿膝腫痛此脾腎虛而毒流注先用活命飲四劑腫痛頓減再用補中益氣湯及六味地黄丸而痊一小兒腿膝腫潰而膿水不止内熱晡熱體倦肌痩先君以為元氣復傷用補隂八珍湯六味丸三月餘而愈一小兒痘已愈兩目昏閉先君用䑕粘子湯加山梔龍膽草犀角目開而有赤白翳佐以蛇蛻散外用二粉散尋愈凡瘡疹已靨未愈之間五臟未實肌肉尚虚血氣未復被風邪相搏則津液澁滯遂成疳蝕宜用雄黄散綿繭㪚等藥治之乆而不愈則潰多致不起愚按前症属足陽明胃經其方解毒殺蟲之劑若毒發於外元氣未傷者用之多效若胃氣傷損邪火上炎者用蕪荑湯六味丸若赤痛者用小柴胡湯加生地黄肝脾疳症必用四味肥兒丸及人參白术散更佐以九味蘆薈丸一女子痘痂將脫因其穢氣以湯浴已而身熱如炙四肢強直如發痙然此腠理開泄熱毒乘虛而入用十全大補湯一劑頓安一小兒痘出甚宻先四肢患毒膿潰而愈後口患疳涎蝕牙齦先用大蕪荑湯活命飲一劑各又用清胃散加犀角及蟬蜍丸而愈後發熱作渇口中作痛服蟾蜍丸搽人中黄而安類集疹痘已效名方葛根麥門冬散治小兒熱毒斑疹頭痛壯熱心神煩悶葛根三錢人參二錢石膏半兩麥門冬去心四錢川升麻甘草茯苓各二錢赤芍藥一錢右為麄散每服三錢水一大盞煎至六分去滓徐徐溫服不拘時量大小增減愚按前方足陽明胃經之藥也外除表邪内清胃火兼補元氣若非發熱作渇表裏有熱者不可用若表裏俱虚而發熱作渇者宜用人參麥門冬散生地黄散治小兒癍疹身熱口乾咳嗽心煩者生地黄半兩杏仁欵冬花陳皮各三錢甘草二錢半炙麥門冬去心七錢右為麄散每服三錢水一大盞煎至六分去滓徐徐溫服不拘時量大小加減愚按前方若肺經有熱者宜用此方若痰氣上壅佐以抱龍丸惺惺散七味治小兒風熱瘡疹時氣頭痛壯熱目澁多睡咳嗽喘促桔梗炒眞細辛人參甘草白茯苓眞川芎白术各一兩右為麄散毎服三錢水一大盞薄荷五葉生薑三片同煎至六分去滓徐徐溫服不拘時候量大小加減愚按前症方若表虚風熱所乘而致諸症者宜用此藥若表實内熱相搏而致諸症者宜用升麻葛根湯若兼作渇飲冷者須用葛根麥門冬散大凡瘡疹已出未出之間多増寒壯熱身體疼痛大便黄稠此正病也若無他疾不必服藥四味升麻葛根湯治初發熱痘疹未明宜用此湯以散之白芍藥炒川升麻一兩甘草葛根一兩半右為麄散每服三錢水一大盞煎至六分去滓不拘時徐徐溫服愚按前方胃經發表之劑表實而熱毒壅滯於肌肉者須用此藥以疏泄之恐虚其表而痘毒不能托出也十一味異功散木香大腹皮人參桂心赤茯苓青皮前胡訶棃勒去核半夏薑製丁香甘草炙各三錢右為麄散毎服三錢水一大盞生薑三片同煎至六分去滓空心溫服量大小以意加減愚按前方治痘瘡已出未愈之間其瘡不光澤不起發不紅活或已出一日至五七日間或泄瀉作渇或肚腹作脹氣促作喘或身雖熱而腹脹足指冷或身熱而作渇或身熱而驚悸腹脹或身熱汗出不止或氣急寒戰咬牙或渇而飲水愈渇或瘡欲靨而不靨或瘡痂欲落而不落而反腹脹渇瀉足指寒冷或驚悸寒戰咬牙此脾胃終變虚寒津液衰少此發内經微㫖隂陽藴奥非神於術者豈能言哉前症乃陽氣内虚寒而外假熱如癰疽脾胃虧損諸臟虚寒之敗症急用前散以救胃氣亦有可生者十二味異功散木香三錢半當歸三錢半人參二錢半官桂二錢去粗皮陳皮丁香肉豆蔲厚朴姜製各二錢半白术二錢半夏姜製一錢茯苓二錢附子炮去皮一錢半右為麄散每服三錢水一大盞半生薑五片肥棗三枚煎至六分去滓空心温服三歲兒作三服五歲兒作兩服一週兩歲兒作三五服病有大小以意加減此藥家傳五世累經效驗愚按前方治痘瘡已出未出不起發不光澤不紅活謂之表虚宜用此藥治之若已出未愈瘡不光澤或不起發不紅活或腹脹作渇泄瀉氣促謂之表裏虚寒急用此藥送豆蔲丸或十一日間不靨壯熱悶亂不寧卧則煩渇咬牙手足指冷數飲沸湯而不熱圍火重衾而仍寒悉属表裏虚寒也王太僕云大寒而盛熱之不熱是無火也當益其心火急用前藥以囘其陽亦有生者肉豆蔲丸七味治瀉水穀或白或淡黄不能止者木香縮砂仁三錢白龍骨半兩赤石脂七錢半呵子肉半兩肉豆蔲半兩枯白礬七錢半右為細末稠麵糊為丸如黍米大一周歲兒毎服三五十丸三歲兒服百丸温米飲下瀉甚者煎木香散或異功散送下瀉止住服不住多服愚按前方治陽氣虛寒腸滑瀉泄之澁劑葢腎主大便若因腎氣不固而致前症者宜用木香散送四神丸如不應急煎六君子湯送四神丸補之葢豆蔲丸澁滯之功多補益之功少也人參麥門冬散治痘瘡微渇一名麥門冬散麥門冬一兩人參甘草炙陳皮白术半兩厚朴姜製各半兩右為麄散毎服三錢水一大盞煎至六分去滓徐徐溫服不拘時量大小加減愚按前方若痘瘡熱毒氣虚作渇宜用之若因氣虚弱作渇用人參白术散消毒散治痘瘡六七日間身壯熱不大便其脉𦂳盛者用此藥以微利之一名消毒飲牛蒡子四兩炒杵荆芥穗甘草炙各一兩右為麄散每服三錢水一大盞煎至八分去滓不拘時徐徐溫服愚按前方若毒在肌肉尚未能盡發而致斯症脉浮而𦂳者最宜此藥疏解其毒若痘頓輕脉沉而𦂳者毒在臟腑宜用前胡枳殻木通以絶其源其痘尤輕柴胡麥門冬散治痘瘡壯熱經日不止更無他症此藥治之即六味柴胡麥門冬散柴胡二錢半麥門冬三錢甘草炙人參黑參各一錢半龍膽草炒一錢右為麄散毎服三錢水一大盞煎至六分去滓不拘時徐徐溫服量大小加減愚按前方若痘瘡表熱根盤色赤焮痛作渇飲冷或兩目作痛或素有肝火而患痘瘡者尤宜用之射干䑕粘子湯治痘瘡壯熱大便堅實或口舌生瘡咽喉腫痛皆餘毒所致甘草炙升麻射干各一兩䑕粘子四兩炒杵右為麄散每服三錢水一大盞煎至六分去滓徐徐溫服愚按前方若痘瘡初出發熱焮痛根盤赤盛或咽喉口舌疼痛作渇飲引者宜用若因胃氣虚弱發熱而致前症者宜用人參麥門冬散桔梗甘草防風湯治風熱咽喉不利桔梗炒甘草炙防風各等分右為麄末毎服三錢水一大盞煎至六分去滓徐徐溫服不拘時量大小加減愚按前方若上焦風熱或痰涎上攻咽喉不利或口舌生瘡作渇引飲者須用此藥發散解毒痘雖出亦在輕淺人參清膈散治涕唾稠粘身熱鼻乾大便如常小便黄赤宜用此方治之人參柴胡當歸芍藥炒知母炒桑白皮炒白术炒黄茋炒紫苑地骨皮茯苓甘草桔梗炒各一兩黄芩半兩石膏滑石各一兩半右為麄末每服三錢水一大盞生薑三片同煎至六分去滓不拘時徐徐溫服量大小加減愚按前症即癰疽因熱毒藴結於臟腑經絡之間者當用此藥以踈導托理調和榮衞使邪氣退則元氣不傷而痘瘡易愈也前胡枳殻散治痰實壯熱胸中煩悶大便堅實卧則喘急前胡一兩枳殻赤茯苓大黄甘草炙各半兩右為麄散每服三錢水一大盞煎至六分去滓不拘時量大小加減如身温脉微并瀉者不可服愚按前症若属肺胃實熱氣鬰痰滯大便秘結小便赤澁煩渴飲冷身熱脉數者宜用之以表散外邪疏通内臟使邪氣不壅滯且痘瘡輕而易愈也人參白术散治痘瘡已靨身熱不退此藥清神生津除煩止渴人參白术藿香葉木香甘草白茯苓六味各一兩乾葛二兩右為麄散毎服三錢水一大盞煎至六分去滓不拘時徐徐服愚按前症若痘瘡已靨身熱或津液少而口乾引飲者胃氣虚弱也宜用人參白术散若腹脹泄瀉口乾足指寒冷者脾氣虚弱也宜用十一味木香散若形寒惡寒嘔吐不食腹脹瀉渴等症乃脾氣虚寒下陥也用六君子加胡麻薑桂如不應急加丁香若發熱渴躁身熱惡衣属血脱發躁用當歸補血湯大凡痘瘡若脾氣虚弱出不快者誤以為熱毒壅盛用涼藥宣利解散致脾胃受傷元氣愈虚使瘡不起發不充滿不結靨不成痂而痒塌煩躁喘渴者死多矣凡痘瘡首尾不宜與水則瘡靨之後其痂落遲或生壅腫治失其法必成疳蝕瘡血水不絶甚則面黄唇白多致難愈葢脾胃属土而主肌肉故也韶粉散治小兒痘瘡纔愈而毒氣尚未全散瘡痂雖落其瘢猶黯或凹凸肉起當用此藥塗之韶粉一兩輕粉一錢右研和入煉猪脂油拌匀如膏薄塗瘡瘢上如痘痂欲落不落當用此方羊􅀈骨髓一兩右煉入輕粉一錢研成白膏甆合盛之塗瘡上如痘瘡痒悞搔成瘡及瘡痂欲落不落用上等白蜜塗之其痂自落小無紫黑瘢痕神妙愚按前症若痘瘡痕赤而作痒属血虚而有熱也佐以四物牡丹皮若痕白而作痒氣虚而有熱也佐以四君芎歸瘡痂欲落不落者脾經血氣虚八珍湯若發熱而大便秘結者腸胃内熱也犀角消毒丸發熱而大便調和者肺胃熱也麥門冬散膿水淋漓者肌表熱也用敗草散敷之雄黄散治小兒因痘瘡牙齦生疳蝕瘡雄黄一錢銅緑二錢右二味同研極細量瘡大小乾糝綿繭散治小兒因痘瘡餘毒肢體節􅀈上有疳蝕瘡膿水不絶出蛾綿繭不拘多少右用生白礬搥碎實繭内以炭火燒礬汁乾取出為末乾貼疳瘡口内如腫臖作痛更服活命飲愚按雄黄散清肝殺蟲解毒外治之方也其症所感之經與所致之因各有不同若因手足陽明經藴熱所致者用犀角消毒散若因脾經疳熱者用大蕪荑湯若因腎經虚熱者用地黄丸若因肝經疳熱者用蕪荑湯送大蘆薈丸其綿繭散總治瘡毒膿水淋漓收斂之外劑若果係内無餘毒而未痊者宜用斂之若因氣血虚而不歛宜用托裡散若發熱腫痛大便不結用仙方活命飲更以隔蒜炙法若腫痛作渴大便秘結用四順清涼飲若大便已通腫痛未退仍用活命飲若發熱倦怠大便調和用八珍湯加犀角如疳蝕未應急用隔蒜炙若發熱口乾肢體倦怠用八珍湯加黄茋若飲食少思肢體倦怠用五味異功散加當歸若膿水不絶而發熱用四物參茋丹皮若膿水不絶而惡寒用四君歸茋惡寒發熱者用八珍黄茋若乳母肝經血虚發熱用加味逍遥散若肝經因怒發熱用加味小柴胡湯若肝經因欎發熱用加味歸脾湯仍叅前痘瘡首尾誤飲水證榖精草散治小兒痘瘡已靨眼目翳膜遮障瞳人癮澁涙出久而不退或十二三日瘡痂已落其瘡瘢猶黯或凹或凸此肌肉尚嫰不可澡浴及食炙煿辛辣有毒之物恐熱毒薰於肝膈目生翳障若不能守禁而致患者須用此治之榖精草一兩生蛤粉二兩右為細末以獖猪肝一葉用竹刀批片糝藥在内用草繩縳定入甆噐内量用水慢火煑熟令兒食之愚按前症若痘瘡愈後餘毒入於肺經而作痛者宜用此方羊肝散亦效若肝經熱毒眼睛作痛佐以小柴胡湯加生地黄或犀角地黄湯解毒湯治一切熱毒腫痛或風熱搔痒脾胃黄連三分金銀花連翹各五分右水煎服愚按前症當審其臟腑部分及各隨所因而治之若在乳下必當兼治其母參湯散治水痘麻黄一分去節人參一分滑石半分地骨皮半分炒知母羌活各一分甘草炙半分大黄一分濕紙煨熱甜葶藶一分用濕紙炒右為末每服五分水一小盞入小麥七粒同煎至十數沸毎服三五匙不可多服愚按前方發表散邪疏通内熱之峻劑若遍身作痛壯熱煩躁作渴飲冷大便秘結小便澁滯喘嗽等症宜用此方或前胡枳殻散然水痘多属表邪但若發熱飲引小便赤色者當用升麻葛根湯如無他症不必用藥也右小兒瘡疹無正方論雖有王譚錢氏之書止見其方未見其源療之者往往以藥宣利解散因耗傷眞氣遂至不救者多矣深可痛憫文中今將祖父秘傳方論集為一卷葢守此方三十餘年全活者甚衆百不失一今合廣其傳使患者無枉夭之禍醫者有活人之功此僕之夙心也附方三豆飲治天行痘瘡始覺即服之多者必少少者不出等症小赤豆黑豆菉豆甘草節半兩右水煑熟任兒食之七日自不發紫草木通湯治痘疹出不快紫草人參木通茯苓糯米各等分甘草减半右毎二錢水煎服升均湯治痘瘡已出不匀或吐㵼發熱作渇升麻乾葛芍藥炒人參白术茯苓甘草紫草如無紅花代之右每服三五錢水煎參茋内托散治痘瘡裡虛發痒或不潰膿或為倒靨等症人參黄茋炒當歸川芎厚朴姜製防風桔梗炒白芷官桂紫草木香甘草右入糯米一撮水煎服仍量兒加減紫草快斑湯治痘疹血氣不足不能發出色不紅活等症即紫草湯紫草人參白术茯苓當歸川芎芍藥木通甘草糯米右毎服二錢水煎人參胃愛散治痘瘡已發未發吐瀉不止不思飲食等症人參藿香紫蘇木𤓰丁香茯苓甘草糯米右毎服三錢薑棗水煎紫草木香湯治痘瘡裏虚痒塌黑陷悶亂紫草木香茯苓白术人參甘草糯米右毎服三錢水煎大如聖飲子治瘡疹癍痘毒攻咽嗌腫痛熱渴或成腫毒不消等症麥門冬半兩桔梗甘草鼠粘子炒各一兩右毎服二錢水煎四聖散治痘疹出不快及倒靨紫草茸木通甘草炙枳殻麩炒黄茋各等分右毎服二錢水煎獨聖散治痘瘡倒靨䧟伏用穿山甲取前足嘴上者燒存性為末以木香湯入少酒服之快透散治痘瘡出不快等症紫草蟬蛻木通芍藥甘草炙各等分右毎服二錢水煎愚按海藏先生云身後出不快足太陽經也用荆芥甘草防風湯身前出不快手陽明經也用升麻葛根湯四肢出不快足陽明經也用防風芍藥甘草湯此皆解毒升發之劑也不可不知鼠粘子湯治癍疹稠宻身熱等症鼠粘子炒當歸甘草炙各一錢柴胡連翹黄芩黄茋各一錢半地骨皮二錢右毎服二錢水煎紫草散治痘疹黒陷氣血虛弱瘡疹不起紫草甘草黄茋炙糯米各一錢半右水煎服益元散治痘疹初煩躁作渴等症滑石六兩甘草一兩右各另為末每服五六分白湯調下活血散治痘疹血虛熱已出未盡煩躁不寧壯腹疼白芍藥一兩酒炒右為末毎服一匙糯米湯調下荔枝湯亦可對四君子湯加歸茋名參歸活血散參茋四聖散治痘瘡有熱出至六七日不能長不生膿或作痒人參黄茋炒白术炒茯苓當歸芍藥炒川芎各五分紫草如無紅花代之木通防風各三分糯米二百粒右水一盞煎半盞徐徐服人參透肌飲治痘瘡虛而有熱雖能出快長不齊整隱於肌膚間者人參白术茯苓紫草如無紅花代之當歸芍藥木通蟬退甘草糯米各等分右毎服三錢水一盞煎半徐徐服大連翹飲治積熱大小便不利及痘後餘毒不解肢體患瘡或丹瘤遊走不止連翹瞿麥荆芥木通赤芍藥當歸防風柴胡滑石蟬退甘草各一錢山梔炒黄芩炒各五分右毎服三錢水煎一歲毎服一二匙三五嵗者毎服數匙愚按前方苦寒辛散發散肌表疏通内臟之劑若表裏實熱煩躁飲冷大便不通小便秘結者最宜用之愼不可過劑恐復傷胃氣而變他症也若妄發之則成斑爛妄下之則成虚脫胡荽酒治穢氣使痘疹出快右用胡荽一把以好酒一盞煎一兩沸令乳母毎含一兩口噴兒遍身匀噴頭面房中湏燒胡荽香能辟除穢氣使痘疹出快煎過胡荽懸掛房門上最妙愚按前方最宜用之若痘疹已出而飲食少思宜用棗炙之兒聞棗香尤能開胃氣進飲食解毒氣若因飲食停滯未及消導遂用此法恐反助其邪以生濕熱則成痘毒也甘露飲子治積熱及痘後咽喉腫痛口舌生瘡齒齗宣腫生地黄炒熟地黄天門冬去心麥門冬去心焙黄芩炒石斛枳殻麩炒枇杷葉去毛茵陳甘草炙各等分右毎三錢水煎毎服三五匙不可多服愚按前方涼血解毒除濕清熱寒中之劑治者審之托裡散治痘毒元氣虚弱或行尅伐不能潰散用之未成自消已成自潰人參黄茋炒各二錢當歸酒洗白术陳皮熟地黄茯苓芍藥炒各一錢五分甘草炙五分右三五錢水煎服托裡消毒散治痘毒氣血虚弱不能起發腐潰收斂或發寒熱肌肉不生人參黄茋炒當歸酒洗川芎芍藥炒白术炒陳皮茯苓各一錢金銀花連翹白芷各七分甘草五分右毎三五錢水煎服八正散治下焦積熱大小便不通或小便淋瀝脉症俱實者大黄酒炒車前子炒瞿麥萹蓄山梔炒木通各一錢滑石煅二錢甘草一錢右毎二錢水煎服涼膈散治上焦實熱煩渇面目赤熱頭昏咽燥咽痛口瘡便溺赤濇狂言譫妄睡卧不安大黄朴硝甘草各二兩連翹梔子仁薄荷葉各三錢右為末毎服一錢竹葉蜜些少煎服解毒防風湯治痘瘡毒氣熾盛防風地骨皮黄茋白芍藥炒荆芥牛蒡子右毎服四錢水煎服或為末白湯調下人參理中湯治中氣虛熱人參白术炒甘草炙各等分右毎服一錢薑棗水煎服為末薑汁糊丸菉豆大毎服二三十丸白湯下亦可六君子湯治脾胃虚弱不思乳食或嘔吐泄㵼飲食不化或時患飲食停滯人參白术茯苓各二錢陳皮半夏甘草炙各一錢右毎服二三錢薑棗水煎補中益氣湯治中氣不足困睡發熱或元氣虚弱感冐風寒諸症黄茋炙人參白术炒甘草炙當歸陳皮各五分升麻柴胡各二分右薑棗水煎瀉黄散治脾胃實熱藿香葉甘草各七錢半山梔仁一兩石膏半兩防風二兩右用蜜酒微炒為末每服一二錢水煎五味異功散治脾胃虚弱吐瀉不食人參茯苓白术甘草炒陳皮各等分右為末每服三錢薑棗水煎四君子湯治脾虚飲食不化或泄瀉嘔吐人參白茯苓白术甘草炙各五分右水煎服四物湯治肝脾血虚發熱日晡益甚或煩躁不寧當歸二錢熟地黄二錢川芎五分白芍藥炒一錢右作二劑水煎服桔梗湯治咳嗽吐膿痰中有血已成肺癰桔梗炒貝母當歸酒浸𤓰蔞仁枳殻麩炒薏苡仁桑白皮炒百合蒸各一錢五分五味子炒甜葶藶炒地骨皮知母炒甘草節防已黄茋杏仁炒各五分右毎服一二錢水煎四順清涼飲治積熱頰赤作渴四肢驚製大便秘濇芍藥當歸甘草大黄各等分右毎服一錢水煎蟾蜍丸治無辜疳症一服虚熱退二服煩渴止三服瀉痢愈蟾蜍一枚夏月溝渠中取腹大不跳不鳴身多㿔者右取糞蛆一杓置桶中以尿浸之却將蟾蜍跌死投與蛆食一晝夜用布袋盛蛆置急流中一宿取出瓦上焙乾為末入麝香一字粳米飯丸麻子大毎服二三十丸米飲下甚效人參敗毒散治傷風時氣寒熱咳𠻳人參茯苓甘草炒前胡川芎羌活獨活桔梗柴胡枳殻各等分右為末每服一二錢生薑薄荷水煎仙方活命飲治一切瘡毒未成内消已成即潰此消毒排膿止痛之聖藥也若膿出而腫痛不止元氣虚也當用托裡散之類穿山甲白芷防風没藥甘草赤芍藥當歸尾乳香天花粉貝母各一錢金銀花陳皮各三錢皁角刺二錢右每服二三錢酒水各半煎神效隔蒜灸法治痘疔毒氣熾盛使諸痘不能起發已起發者不能貫膿已貫膿者不能收靨或大痛或麻木痛者灸至不痛不痛者灸至痛其毒隨火而散京師嘗見治此者即以線針挑破出毒血諸毒隨時貫膿若挑破不痛不出血者難治若用此法灸之即知痛更用針挑破紫血隨出諸痘隨貫亦有生者其法用大蒜頭切三分厚安痘疔上用小艾炷於蒜上灸之毎五壯易蒜再灸若紫血出後腫痛不止尤宜當灸治者審之神效當歸膏治痘毒津淫或湯火等瘡不問已潰未潰麻油六兩當歸黄蠟生地黄各一兩右先將當歸地黄入油煎黑去查入蠟熔化候冷攪匀即成膏矣蛇蛻散治痘毒目翳蛇蛻二錢為末𤓰蔞仁半兩研爛右用羊肝一片批開入藥末二錢線扎緊用米泔煑熟頻與兒食或乳母食荆芥甘草防風湯解痘毒荆芥甘草防風各等分右每服一錢水煎防風芍藥甘草湯解痘毒防風芍藥甘草各等分右毎服一錢水煎麻黄甘草湯治表實痘毒熾盛麻黄五分生甘草三分右水煎服輕粉散治出痘眼内生翳眞輕粉黄丹各等分右研左眼有翳吹入右耳右眼有翳吹入左耳更以菉豆皮穀精草白菊花各一兩為末毎服三錢乾柿一枚米泔一盞煎乾將柿去核食之不拘時候日三枚成都方士禹太和云治痘瘡黑陷垂死者用壁間喜蛛如黄豆者一枚擂爛若一歳兒用雄黄一厘二歳者用二厘十歳者一錢再同蜘蛛研匀用好燒酒一杯調和徐徐服之余意此方即同前十二味與十一味異功散之相類也若因陽氣虚寒不能營運周身以致四肢逆冷腹脹唇青其色黑陷者宜用燒酒若因元氣虚乏或色淡白隱隱見於肌膚而不能起發者宜用陳酒亦可不可拘滯於燒酒也若小兒未週歳者宜酌量與飲之亦不可拘於杯許也又有一等氣血俱虚者或色淡紅而不光澤又不起發或驚悸咬牙用紫草與紅花以陳煑酒濃煎與兒服之亦可以保其全生也用者宜審諸抱龍丸治痰熱喘嗽發熱驚悸不安亦能發痘瘡膽星四兩天竺黄一兩雄黄硃砂各半兩射香少許右為細末用甘草一觔煑汁為丸每一兩作二十丸用薄苛或燈心草湯化下造膽星法南星不拘多少腊月臘水浸洗切塊晒乾為末用黄牛膽汁拌匀仍用牛膽殻裝入填滿以線扎口懸掛當風處隂乾隔年方可用愚按前方清熱豁痰利氣之藥過劑則脾肺復傷而反不愈或更加胸腹作脹飲食作嘔者宜用人參白术散培補中氣五福化毒丹治胎毒及痘後頭面生瘡眼目腫痛生地黄熟地黄天門冬去心麥門冬去心𤣥參各二兩甘草甜硝各三兩青黛一兩五錢右為末煉蜜丸芡實大每服一丸白湯化下愚按前方生血凉血解毒寒中之劑用之得宜殊有良驗不過一二丸犀角消毒丸治諸積熱及痘疹後餘毒生瘡生地黄防風當歸犀角屑鎊荆芥各一兩牛蒡子杵炒赤芍藥連翹桔梗各七錢薄荷黄芩炒甘草各半兩右為末煉蜜丸芡實大毎服一丸薄苛湯下愚按前方清熱解表涼血破血消毒損胃之劑多不過一二服大凡痘毒當叅前痘瘡悞飲冷水韶粉散治法用之餘倣此敗草散治痘瘡撾搔成瘡膿水淋漓謂之斑爛用屋爛草或盖墻爛草多年者佳如無曠野生者尤佳為末搽之愚按前症亦有氣血虚熱而不愈者如遍身患者須多摻鋪席上令兒坐卧其瘡即愈羊肝散治痘毒入眼或無辜疳氣入眼蜜蒙花青箱子决明子車前子炒右為末用蜜䝉花末三錢餘藥各一錢拌匀用羊肝一大葉竹批摻上濕紙裹煨熟空心早食之愚按前症若因肝經風熱傷血宜用本方若因肝經血虚風燥宜用四物湯加山梔釣藤鈎牡丹皮若因肝經血虚生風或腎水不能生肝木宜用六味丸若成肝疳者用六味地黄丸以滋肝腎用四味肥兒丸加人參白术以補肝脾一小兒痘瘡目生昏翳或作或徹服退翳之藥不愈診之脉弦細而數此乃肝腎有疳症余用九味蘆薈丸及六味地黄丸又與輕粉黄丹散尋愈一小兒患兩目赤腫痛不可當此肝火為患用四物合小柴胡加山梔牛蒡子生甘草倍用穀精草數劑而愈一小兒痘愈後眼痛不開用犀角地黄湯加柴胡湯一劑而開又生赤翳迷滿仍用前藥加穀精草治之而愈蟬菊散治癍瘡入眼或病後生翳障蟬蛻洗浄去土白菊花各等分右每服二錢水一盞入蜜少許煎乳食後量兒大小與之羌菊散治痘毒上攻生翳并暴赤羞明羌活蟬蛻防風蛇蛻菊花穀精草木賊甘草山梔子白蒺藜大黄黄連沙苑蒺藜各等分右為末毎服一錢清米泔温煖調下丹粉散治痘毒膿水淋漓輕粉黄丹各五分黄連末二錢右研勻搽患處羚羊角散治小兒癍疹後餘毒不解上攻眼目生翳羞明眵淚俱多紅赤腫閉羚羊角鎊黄芩黄茋草决明車前子升麻防風大黄芒硝各等分右以水一􅊦煎半􅊦去滓稍熱服消毒化癍湯治小兒癍疹未滿二十一日而目疾作者餘症上同即消毒救苦湯羌活五分藳本二分細辛一分黄連三分黄芩一分酒芩二分酒栢三分生地黄三分麻黄五分升麻五分白术一分蒼术二分生甘草一分呉茱萸半分陳皮一分紅花半分蘇木一分當歸二分連翹三分防風五分川芎五分葛根一分柴胡二分右作一服水二􅊦煎至一􅊦去滓稍熱服榖精草散治痘疹已靨翳膜遮障瞳子等症榖精草一兩蛤粉黑豆各二兩右為末用雄猪肝一葉竹刀批開摻藥在内以麻線縳定砂罐内水煑熟令兒食之當歸補血湯治血氣損傷或妄服峻劑致氣血益虚肌熱大渴引飲目赤面紅脉洪大而虚重按全無此病多得於飢飽勞役者黄茋炙一兩當歸三錢酒製右水煎乳母同服濟生犀角地黄湯治鬰熱不解經絡隨氣湧泄為䘐血或清道閉塞流入胃脘吐血或餘血停滯面色痿黄大便色黑者犀角生地黄白芍藥牡丹皮各一錢右水煎服乳母同服四神丸治脾胃虚弱大便不實飲食不思或泄利腹痛等症肉豆䓻二兩補骨脂四兩五味子二兩呉茱萸浸炒一兩右為末生薑八兩紅棗一百枚煑熟取棗肉和末丸桐子大每服五七十丸空心或食前白湯服去五味子吳茱萸名二神丸四味肥兒丸治小兒食積五疳或白秃體痩肚大筋青髪稀成穗或遍身瘡疥等症蕪荑炒神麯炒麥蘖炒黄連各等分右為末猪膽汁丸黍米大每服一二十丸木通煎湯下九味蘆薈丸治小兒肝脾疳積體痩熱渴大便不調或瘰癧結核耳内生瘡等症胡黄連黄連蘆薈木香蕪荑炒青皮白雷丸鶴膝草各一兩麝香三錢右為末蒸餅糊丸麻子大毎服一錢空心白湯下大蕪荑湯一名梔子茯苓湯治小兒脾疳少食發熱作渴大便不調髪黄脫落面黑便清鼻下生瘡能乳食土等症山梔三分黄栢甘草炙各二分蕪荑五分黄連防風各二分麻黄羌活柴胡各三分白术茯苓當歸各四分右每服二三錢水煎濟生歸脾湯治脾血虧損徤㤀驚悸等症人參黄茋茯神各一錢甘草炙五分木香五分白术炒一錢遠志酸棗仁炒龍眼肉當歸各一錢右水煎服愚按前方若乳母憂思傷脾血虚發熱食少體倦或脾不能攝血以致妄行吐下或徤㤀怔忡驚悸少寐或心脾作痛自汗盗汗或肢體腫痛大便不調或經候不准晡熱内熱或唇瘡流注等症致為患者用之令子母俱服八味地黄丸即錢氏地黄丸加肉桂附子各一兩愚按前方治禀賦命門火衰不能生土以致脾土虚寒或飲食少思或食而不化臍腹疼痛夜多漩溺等若病久元氣耗損所致尤宜用之或乳母命門火衰兒飲其乳以致前症者母宜服之加減八味丸即六味地黄丸加肉桂一兩五味子四兩治禀父腎隂不足眩吐瀉久病津液虧損口乾作渴或口舌生瘡兩足發熱或痰氣上湧或手足厥冷等症八珍湯即前四君子四物二湯相合愚按前方治氣血俱虚或因尅伐之劑脾胃虧損肌肉消瘦發熱寒熱飲食少思等症十全大補湯即八珍湯加黄茋肉桂愚按前方氣血虚弱或禀賦不足寒熱自汗食少體痩發熱作渴頭痛眩暈逍遙散加牡丹山梔名加味逍遙散當歸甘草炙芍藥酒炒茯苓白术柴胡各一錢牡丹皮山梔炒各七分右水煎服愚按前方若乳母肝脾血虚内熱或遍身搔痒寒熱或肢體作痛頭目昏重或怔忡頰赤口燥咽乾或發熱盜汗食少不寐或口舌生瘡耳内作痛或胸乳腹脹小便不利致兒為患者尤宜用之九味龍膽瀉肝腸治肝經濕熱或囊癰下疳便毒小便濇滯或隂囊作痛小便短少愚製木通車前子炒當歸尾澤瀉各五分甘草黄芩生地黄山梔各三分龍膽草酒炒五分右水煎母子同服抑肝散治肝經虚熱發搐或發熱咬牙或驚悸寒熱或木乘上而嘔吐痰涎腹膨少食睡卧不安愚製軟柴胡甘草各五分川芎八分當歸白术炒茯苓釣藤鈎各一錢右水煎子母同服梔子清肝散一名柴胡梔子散治三焦及足少陽經風熱耳内作痒生瘡或水出疼痛或胸乳間作痛或寒熱往來柴胡一錢梔子炒一錢牡丹皮一錢茯苓川芎芍藥當歸牛蒡子炒各七分甘草右水煎子母服若太陽頭痛加羌活柴胡清肝散治鬢疽及肝胆三焦風熱怒火之症或項胸作痛瘡毒發熱愚製柴胡一錢半黄芩炒人參川芎各一錢山梔炒一錢連翹甘草五分桔梗八分右水煎子母同服小柴胡湯加山梔牡丹皮名加味小柴胡治傷寒温熱身熱惡風頭痛項強四肢煩疼往來寒熱嘔噦痰實中暑瘧疾並服之閻註柴胡二錢黄芩炒一錢半人參半夏各七分甘草炙五分右薑水煎子母同服愚按前方若肝膽經風熱肝火瘰癧寒熱往來日晡發熱潮熱身熱不欲飲食或怒火口苦耳聾咳嗽或脇痛胸滿小便不利或泄瀉吐酸苦水或肢體搐動唇目抽劄並宜用之砭法治丹毒疔瘡紅絲走散或時毒瘀血壅盛或色赤走徹用細磁器擊碎取有鋒芒者以筯劈開頭夾之麻線纒定兩指輕撮筯稍令磁芒正對患處懸寸許再用筯頻擊神功散治痘毒腫焮作痛未成者敷之即散已潰者敷之腫痛即消黄栢炒草烏炒血竭加右為末等分津調敷患處製附子法附子重一兩三四錢有蓮花瓣頭圓底平者先備童便五六碗將附子先放在竈上煙櫃中間良久乘熱投入童便浸五七日候潤透揭皮切四塊仍浸二三日用粗紙數層包之浸濕埋灰火半日取出切片檢視有白星者乃用瓦上炙熱至無白星為度如急用即切大片用童便煑二三沸熱瓦熟用之丹溪先生解瘡毒藥絲𤓰升麻芍藥酒炒生甘草山查黑豆赤小豆犀角鎊各等分右為麄散毎服三錢水一大盞煎至六分去滓不拘時徐徐溫服量大小加減稀痘方用老鼠去皮取肉水煑熟量兒大小與食數次出痘甚稀未食葷時與食尤效屢試屢驗薛氏醫案卷七十七
