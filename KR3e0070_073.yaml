body:
  text: 薛氏醫案卷七十三明薛已訂保嬰撮要十八小便不利痘疹方云痘疹未出之先熱盛恐欲起驚小便不利導赤散㣲解之熱入膀胱如有血淋犀角湯初出不快小便赤色生聖散已出未愈之間白术散或五苓散加木通收靨之後小便不利煩熱而渴猪苓湯竊謂前症當分所因若小腸熱結用導赤散肝經熱用柴胡麥門冬湯脾經熱用犀角湯肺經熱用生地黄湯腎經熱地黄丸靨後氣血虚弱用八珎湯中氣虚弱用五味異功散一小兒小便不利口舌生瘡乾渴用導赤散加味四物湯而膿貫又用白术散去木香治之而愈一小兒小便不通口舌如靡作渴面赤左尺脉數此膀胱熱結先用五淋散而小便利又用地黄清肺飲參茋四聖散而愈一小兒小便數而欠利面赤口渴両足發熱此禀隂虚也地黄滋腎二丸煎服用四劑而愈又用地黄丸料加黄茋當歸而痊愈一小兒痘將愈小便不利服五苓散之類小便愈少喘咳唾痰此脾肺復傷也先用補中益氣湯三劑送滋腎丸却用補中異功二藥而痊八正散治下焦積熱大小便不通或小便淋澁脉症俱實者大黄酒炒車前子炒瞿麥萹蓄山梔炒木通各一錢滑石煅二錢甘草一錢右每服二錢水煎滋腎丸為末水糊黄栢炒黑知母炒黒各二兩肉桂二錢益元散治痘疹初起煩躁作渴小便不通滑石六錢甘草一錢每服五六分白湯調下導赤散治小腸實熱生瘡作渴發熱小便秘赤或小便不利者方見作痒搔破柴苓湯治疹瀉小便不利方見癍症五苓散茯苓猪苓白术澤瀉各等分肉桂减半右為末每服四分白湯下黄芩清肺飲黄芩炒山梔炒等分右每服二錢水煎生地黄湯生地黄五錢麥門冬七錢杏仁去皮尖二錢欵冬花陳皮各三錢甘草二錢五分右每服二三錢水煎紫草木通湯治痘疹出不快小便不利紫草人參木通茯苓糯米各等分甘草减半柴胡麥門冬散方見作痒抓破犀角湯方見頂陷心灰仙聖散方見痘瘡出遲加味四物湯方見痘入口白术散即七味白术散六味地黄丸二方見發熱屬隂陽痘便血或黒屎聞人氏云痘瘡大便下血或黒糞若睡而不醒是為惡候乃内熱盛也用犀角地黄湯抱龍丸小柴胡湯加生地黄主之竊謂前症若寒熱作渴小柴胡加生地黄發熱體倦用五味異功散加當歸口乾作渴用人參白术散大凡作渴引飲發熱者屬實熱作渴飲湯手足不熱者屬虚熱手足逆冷者屬虚寒治者審之一小兒出痘便血痘赤痛如錐或瘡内出血余謂肝火熾盛用小柴胡湯加生地黄一劑随用犀角地黄湯一劑而痊一小兒痘瘡下血且不起發先君謂氣血不足用紫草快癍湯加參茋歸术血頓止瘡頓起用八珍湯而愈一小兒痘瘡下血小便赤色瘡色如赭發熱飲冷二便不利先君謂心小腸實熱用八正散後用解毒防風湯及飲芹菜汁而痊一小兒痘疹便血倦怠作渴飲湯余謂倦怠便血脾虚下䧟也少食作渴津液枯涸也用五味異功散加紫草而愈一小兒便血腹脹困倦身熱口乾飲渴四肢逆冷先君謂脾氣虚寒不能攝血用五味異功散加丁香炮薑二劑血止痘貫而靨一小兒痘將愈而便血面白惡寒大便欲去而不去余謂此元氣虚而下陷也用益氣湯不信服凉血之劑致吐瀉腹痛而殁一小兒痘將愈患便血面白惡寒手足並冷脉沉細如無余謂陽氣虚寒欲用人參薑桂不從翌日而死手足青黒惜哉解毒防風湯治痘瘡毒氣熾盛便血防風地骨皮黄茋白芍藥炒荆芥牛蒡子各等分右每服四錢水煎或為末白湯調下紫草快癍湯治痘疹下血不能起發出不快色不紅活等症即紫草湯方見頂陷心煩聖濟犀角地黄湯治熱毒内藴煩躁作渴面色赤大便黒屎或神昏便血方見痘作渇小柴胡湯治肝經有熱不能藏血而便血方見痘身痛五味異功散治脾胃氣虚不能統血而大便下血方見寒戰咬牙八珍湯治氣血不能攝血而便血方見頂陷灰白八正散治心小腸有熱小便赤澁大便下血方見痘小便不利七味白术散即人参白术散方見痘發熱痘瘡焮裂出血聞人氏云痘瘡大便不通小便如血或結癰毒身痘破裂乃内火熾盛失於解利急用犀角地黄湯小柴胡湯加生地黄四順飲之類治之竊謂前症若心脾熱盛用犀角地黄湯心肝熱盛用小柴胡湯加生地黄若大便不通先用四順飲次用犀角湯若色赤焮痛二便不通急用活命飲加硝黄若色赤焮痛惡寒發熱用活命飲加麻黄若因乳母怒火用加味逍遥散加味歸脾湯一小兒痘根赤色寒熱作痛此肝經有熱也先用加味小柴胡湯二劑諸症漸退又用加味逍遥散一劑而貫膿末用八珍湯而靨一男子痘根赤痛發熱作渴服紫草飲痘裂出血余謂心肝二經風火相摶先用小柴胡湯加生地黄犀角二劑用聖濟犀角地黄湯而愈一小兒患前症大便不利小便赤澁作渴飲冷先君謂脾胃實熱先用凉膈散一劑漸愈又用犀角地黄湯芹菜汁而痊一小兒患此診乳母有欝火用加味逍遥散加味歸脾湯而痊同時患是症而用雜藥者俱致不救凉膈散治上焦實熱煩渴面赤咽燥喉痛便溺赤濇狂言譫語睡臥不安大黄朴硝甘草連翹山梔黄芩薄荷葉各等分右為細末每服少許煎竹葉密湯調乳母同服加味清胃散方見痘癰加味逍遥散方見痘潮熱犀角地黄湯方見頂陷心灰加味小柴胡湯即小柴胡湯加山梔生地黄方見痘身疼八珎湯方見頂陷灰白聖濟歸脾湯方見痘癰痘䘐血吐血痘疹方云若痘發之際正宜㣲見與發汗同體然血與汗雖殊其源則一盖痘疹乃穢血所發邪結肺胃毒氣自然上越也若見此症不可妄投以藥恐治失其宜瘀蓄者不出而已出者復傷反生變症也若作渴飲冷手足並熱此毒氣熾盛而血上溢也宜用聖濟犀角地黄湯若肺經熱毒而鼻䘐用地黄清肺飲胃經熱毒而吐血亦用聖濟犀角地黄湯若腸胃熱毒而便血亦用之作渴飲湯手足不熱者脾肺氣虚不能攝血而妄行也宜用五味異功散若出血作渴煩躁面赤色者血脱也宜用當歸補血湯一小兒出痘三四日大便下血日有數滴至八日不能止瘡不能起御醫錢春林謂其脾氣虚寒用木香散二劑加丁香十一粒人參五錢次日痘起有膿由是血止二十餘日而愈一小兒痘瘡紅活但不時作痒口渴便血面赤先君謂腸胃有熱用聖濟犀角地黄湯加柴胡一劑諸症漸退用四君加當歸紅花而愈一小兒痘瘡赤痛煩熱作渴或便血䘐血先君用犀角地黄湯而血止又用紫草快癍湯而痛愈後瘡㾗色白用四君黄茋當歸而痊一小兒䘐血右寸脉數此肺金有火也用瀉白散而血止但四肢倦怠用益氣湯而愈一小兒痘痛赤色吐血發熱此胃經熱毒也先用聖濟犀角地黄湯諸症漸愈又用五味異功散而痊一小兒痘後䘐吐面色黄白因脾肺氣虚弱用麥門冬散而愈後因勞䘐血發熱痘㾗赤色用四君歸茋而䘐血止用五味異功散而熱退一小兒痘後䘐血發熱則㾗赤熱止則㾗白此脾胃氣虚也朝用補中益氣湯加乾薑夕用五味異功散加當歸而愈一小兒痘後䘐血頭運唇白惡心此中氣虛而清陽不能上升也用補中益氣湯加蔓荆子稍愈去蔓荆子又數劑而痊一小兒痘後非䘐血即便血痘㾗赤白靡定手指冷熱無常余謂此元氣虚而無根之火倐往倐来也朝用補中益氣湯夕用五味異功散各二十餘劑而愈後因勞心復發仍用前二藥為主佐以十全大補湯而愈瀉白散桑白皮炒甘草地骨皮右每服二三錢水煎人參竹葉湯治虚煩不得寐或兼自汗人參竹葉甘草各二錢半夏二錢五分小麥麥門冬各一錢半右每服二三錢薑二片粳米一撮水煎服八珍湯十一味木香散二方見頂陷灰白五味異功散當歸補血湯二方見寒戰咬牙紫草快癍湯方見便血屎黑四君子湯即六君子湯去陳皮半夏方見不靨悶亂十全大補湯方見腹脹氣促痘煩躁東垣云火入於心則煩入於腎則躁皆心火為之盖火旺則金爍水虧故心腎合而為躁也宜用梔子豆䜴湯凡痘瘡盛作之時必令心火有所導引苟或毒氣出而未盡遂生煩躁以生黒豆煎湯或生犀磨汁飲之亦可若津液不足虚煩不得臥者活人酸棗仁湯此症多因脾胃氣虚或服剋伐之劑所致但當調補中氣為善一小兒患此飲冷不止或作脹痛余謂胃火所致用犀角地黄湯芹菜汁而頓愈一小兒煩躁作渴飲冷不止先君謂脾胃熱毒用犀角地黄湯而愈後復作喜飲熱湯面目赤色用當歸補血湯而痊惟倦怠少食用白术散而愈一小兒貫膿之際煩躁不寕肝脾脉數用聖濟犀角地黄湯一劑稍止用八珎湯加牡丹皮而止又一劑漿漸貫却用内托散倍用參茋歸术而靨一小兒痘將貫膿煩躁面赤脉數大而虚此氣血虚也先用參茋四聖散又用當歸補血湯而愈一小兒出痘煩躁作渴面赤口乾脉洪而大按之無力兩尺為甚此禀腎不足隂虚而火動也用大劑地黄丸料加五味子煎與恣飲諸症頓减乃佐以補中益氣湯二劑痘齊乃用參茋四聖散而靨一小兒出痘煩躁作渴飲湯面目赤色脉數無力兩尺為甚此禀足三隂虚也用益氣湯及地黄丸料加五味子大劑始末服而靨一男子出痘煩躁作渴虛症不能悉舉先君用益氣湯地黄丸料加五味子各三十餘劑更用人參五觔煎湯代茶飲兩月餘而靨又用歸茋參术各數斤半載始能歩履得元氣充實且慎調攝而痊一小兒十五嵗痘將愈而煩躁脉數而無力勞則益甚且無寐或驚悸余用歸脾補中二湯漸愈後因勞仍作或用四物化痰之劑前症益甚更發熱惡寒頭運而殁一小兒痘愈後煩躁面赤脉洪大按之如無余謂血虚朝用補中湯夕用歸脾湯將愈因飲食過多功課勞心吐瀉腹痛頭運惡寒反服藿香正氣散發熱如炙汗出如雨手足並冷而殁活人酸棗仁湯治痘疹虚煩驚悸不得眠酸棗仁炒甘草炙知母炒白茯苓麥門冬去心川芎乾薑炒各三分右水煎服兒大倍之梔子豆豉湯山梔四箇豆䜴半兩右水二盞先煑梔子一盞内豆䜴煎至七分去滓温服得快吐即止後服當歸六黄湯治血氣不足虛火内動或煩躁盗汗不止當歸熟地黄黄茋炒黄栢已下俱炒黒黄芩黄連生地黄右每服三五錢水煎八珍湯治氣血俱虚或用剋伐之劑脾胃虚損肌肉消痩發熱惡寒飲食少思等症方見頂陷灰白補中益氣湯當歸補血湯二方見寒戰咬牙六味地黄湯方見痘發熱屬隂陽聖濟犀角地黄湯方見頂陷心煩内托散即托裏散方見痘癰七味白术散方見痘發熱屬隂陽痘腹痛婁全善先生云痘腹痛多是熱毒為患當臨症消息之又云痘出腹痛或身痛脉洪數者用解毒凉藥加芍藥甘草竊謂前症若痘未出而發熱煩躁或作渴飲冷大便堅實此熱毒壅滯也用疏利之藥若痘已出而不熱躁不飲冷大便不實此元氣虚弱也用白术散之類補之若噯腐吞酸大便穢臭乳食停滯也用保和丸消之凡腹痛作渴飲冷手足並熱者屬實熱作渴飲湯手足並冷者屬虚寒虚寒者當温補脾胃虚弱者當調補脾胃一小兒善食作渴腹痛便秘痘㾗赤色先用加味四物湯而愈後仍痛惡食此脾胃受傷用白术散而痊一小兒痘將靨腹脹發熱面赤午後益甚按其腹不痛余謂脾虚用五味異功散而痊一小兒出痘腹痛大便似利寒熱往来余以為脾氣虚用白术散而痊一小兒出痘腹痛作渴飲食如常光澤紅活此胃經實熱先用瀉黄散一劑頓安又用白术散而痊一小兒痘後腹痛作渴飲冷便秘用清凉飲末五分頓安後腹痛吐瀉發搐用白术散加釣藤鈎而愈一小兒出痘腹痛噯腐呑酸此飲食停滯先用保和丸二服續用五味異功散而痛止又用托裏散而靨人參理中湯治脾胃虚寒胸膈痞滿或心腹疼痛痰逆嘔吐少氣或霍亂吐利手足厥冷不喜飲水加附子理中湯名附子理中湯人參白术乾薑炮各等分甘草炒减半右每服三錢水煎或研末白湯調下五味異功散治小兒諸般釣症角弓反張胸膈臍凸以透明沒藥為末薑湯調下桔梗枳殻湯治氣壅痞結腹脇疼痛桔梗枳殻炒各一両甘草炙右每服二三錢薑水煎七味白术散治肚腹作痛和胃氣生津液若脾胃氣虚作渴飲湯或因吐瀉津液虧損煩渴引飲或脾胃氣虚腹脹瀉渴弄舌流涎手足指冷並宜服之以温補脾氣化生津液方見發熱屬隂陽保和丸治飲食停滯腹痛或惡寒發熱不可多服神麯炒山查半夏茯苓陳皮各一両連翹蘿蔔子各五錢右為末粥飯丸小豆大毎服二三十丸白湯送下化服亦可加白术名大安丸六君子湯治脾胃氣虚肚腹作痛或吐瀉不食或肺虚痰喘氣促惡寒或肝虚驚搐眩暈自汗諸症並宜服即四君子湯加陳皮半夏方見不靨悶亂瀉黄散方見痘㵼渇五味異功散方見寒戰咬牙聖濟犀角地黄湯方見頂陷心煩托裏散方見痘廱四物湯方見痘瘡出遲清凉飲方見痘瘡大便不通痘腰痛經曰腰者腎之腑若痘瘡而見前症者皆因腎經虚怯相火内燥真隂不能勝邪故腰作痛也急服地黄丸以防變黒歸腎乃克有濟大抵此痘因禀賦腎家精氣不足故目睛多白俗謂之拆腰痘是也若平素面白眼白睛多行遲語遲者出痘必歸腎經預為調補腎氣庶免此患一小兒十三嵗眼睛多白或時面赤常患頸痛尺脉洪數先君謂禀腎氣虚用地黄丸料煎服而愈至十五嵗出痘先君云須多服前藥仍用地黄丸益氣湯更作倦怠乃以地黄丸大劑煎與恣飲又用大劑八珎湯痘漸出如式恪服前藥至朞嵗二藥計十七斤餘而愈先君每見嬰兒白睛多面色白或色赤令其預補脾腎以防出痘但信者少耳一小兒出痘腰痛足熱發渴此禀腎虚火動也先君用大劑加减八味丸料煎與恣飲諸症漸退佐以大劑八珎加紫草糯米數劑膿漸貫仍用前藥而結痂用八珎湯而靨一小兒出痘將愈因停食泄瀉作渴腰痛此脾腎虚弱也先君用加減八味丸料及五味異功散渴瀉頓止又與六味丸料及八珎湯而靨一小兒出痘愈後腰足作痛此禀足三隂虚也用六味丸料煎服及補中益氣湯而愈後又傷食作瀉腰痛用四神丸六味而愈一小兒面色常白目睛多白時常腰痛兩足時熱冬不衣綿年九嵗先君謂禀腎虚令每日服地黄丸至十嵗出痘腰痛發渴面赤飲冷用地黄丸每劑加肉桂半錢煎與恣飲數劑之後熱渴頓止腰痛頓愈却去肉桂仍與服之至五十餘劑而靨一小兒痘愈後腰痛口渴兩足生瘡飲水不絶此禀足三隂虚先君用地黄丸益氣湯至畢姻後不慎起居復患瘰􅐇以致不起一小兒面素白發熱作渴或面生瘡先君謂腎虚用加味地黄丸補中益氣湯而愈後出痘腰痛仍用前藥而痊次年畢姻患腎痿而卒加味地黄丸熟地黄酒浸蒸丸晒乾八両酒拌杵膏山茱茰肉亁山藥五味子炒各四両澤瀉白茯苓牡丹皮鹿茸炙各三両肉桂厚者去皮取肉一両發熱者以此加之引虚火歸腎經而熱自止也右各另為末入地黄和匀量入米糊丸服煎服更好六味地黄丸方見發熱屬隂陽五味異功散補中益氣湯二方見寒戰咬牙八珎湯方見頂陷灰白八味丸即六味丸加附子肉桂各一兩方見痘作渇二神丸四神丸二方見痘作㵼痘面青聞人氏云痘疹屬火症其面色赤者為順甚者為熱若肝木尅制脾土致面色青者是為逆也急用四君升麻柴胡調補脾胃色正纔治竊謂前症若傷食而嘔吐搐搦脾氣受傷而瀉利搐搦或厥逆皆慢脾風之漸也用人參理中湯加柴胡釣藤鈎治之或有少誤多致不起若有痘毒内外欝蒸發出遇風寒相摶凝滯於肌肉遍身皮膚青色者用透肌散胃傷則生風嘔吐脾傷則生風厥逆用五味異功散加天麻若瘡密熱盛便秘飲冷面赤者用犀角解毒散貫漿之後發熱煩躁作渴面赤者用當歸補血湯足熱腰痛目睛赤者地黄丸皆要法也一小兒痘瘡紅活起發因飲食過多吐瀉腰痛唇面青色手足並冷此脾胃虚寒而受尅也先君用六君薑桂一劑前病不退痘色欠赤再劑加附子二分諸症頓退翌日用參茋四聖散二劑將愈更用八珍湯内參茋各五錢四劑而靨一小兒出痘飲冷過多腹痛面青手足並冷此寒邪傷脾而虚寒也用附子理中湯一劑而痛止用人參一兩薑一錢二劑而膿貫又用人參煎湯代茶與飲月餘而靨一小兒出痘面青腹痛手足並冷此脾氣虚寒也先用五味異功散加木香肉桂又用内托散參茋四聖散貫膿痂靨一小兒出痘面青腹痛手足並冷此脾土虚寒也先服益黄散末三錢再以六君木香而安又傷食作瀉面青用五味異功散而痊一小兒出痘面色青手足冷此寒水侮土非十二味異功散不能救不信乃服疏通之藥殁而遍身皆青悔無及矣六君子湯四君子湯二方見不靨悶亂人參理中湯加附子名附子理中湯方見痘腹痛五味異功散當歸補血湯二方見寒戰咬牙内托散即托裏散方見痘癰十二味異功散方見頂陷灰白參茋四聖散方見腹脹氣促六味地黄丸方見發熱屬隂陽犀角地黄湯方見頂陷心煩痘㾗赤白痘㾗赤白各有所因治法亦異凢㾗赤而作痒血虚而有熱也用四味牡丹皮赤而作痛餘熱也用四君連翹金銀花若發熱而大便調和者脾胃虚熱也用五味異功散若發熱而大便秘結者腸胃内熱也用聖濟犀角地黄湯若母有肝火用加味逍遥散若母有鬰怒用加味歸脾湯佐以加味逍遥散治之㾗白者多屬氣虚而血衰也宜固元氣為本痒而作渴者氣血俱虚也十全大補湯之類乳食减少四肢倦怠者中氣虚也五味異功散之類氣虚發熱者補中益氣湯之類血虚發熱者當歸補血湯之類須叅兼變之証治之此症若服藥而漸紅活者可治色不轉者不治雖經年後多患瀉痢而死若妄投攻伐禍在反掌一小兒痘瘡如期而愈㾗赤如赭余謂此乳母有熱也診之果有肝脾鬱火先用加味逍遥散四劑與母服之子各飲少許而並愈一小兒痘㾗色赤作痛熱渴喜冷大便不利先用前胡枳殻散便利渴止再用聖濟犀角地黄湯而安又用芹菜汁而靨一小兒痘㾗色赤大便不利小便赤澁作渴飲冷此上焦實熱也先君用瀉黄散一劑頓愈又用濟生犀角地黄湯及芹菜汁而痊一小兒痘愈而㾗赤作痛内熱作渴二便不利先君謂胃經熱毒用濟生犀角地黄湯及芹菜汁而痊一小兒痘㾗色白時痛時痒作渴飲湯大便稀溏此脾胃虚熱也用五味異功散加當歸黄茋而瘥一小兒十六嵗痘㾗白用獨參湯數斤色漸如舊又用地黄丸大補湯而安一小兒痘後因母怒㾗赤時或作痛先用加味小柴胡湯加味逍遥散治其母而愈一小兒因乳母食膏粱之味痘㾗色赤用清胃散治其母而兒自愈一小兒痘㾗色白作痒發熱大便不實諸藥不應余用五味異功散每劑用人參一兩四劑之後其熱稍退仍用前藥兼服四神丸而愈一小兒痘㾗白色時或作痒先君謂氣血俱虚不信反服解毒之藥後變慢脾風而殁一男子患此色白作痒搔破膿水淋漓惡寒體倦余謂脾肺氣虚不信反袪風敗毒果發搐而死一小兒患此惡寒發熱或痒或痛或白或赤余謂氣血俱虚不悟反降火袪風發痙而死一小兒痘㾗色白服尅伐之劑致瀉不止余謂此脾氣下陷也不信果殁遍身如白傅粉信氣虚矣葛花解醒湯治乳母酒醉後乳兒遺熱為患白豆䓻砂仁葛花各五錢亁生薑白术炒神麯炒黄澤瀉各二分白茯苓陳皮人參猪苓木香各五分青皮三分右為末每二錢白湯調服四順清凉飲治血脉壅實臓腑蓄熱頰赤作渴五心煩熱睡臥不安四肢驚掣或頭面生瘡目赤咽痛痘疹餘毒方見大便不通四君子湯方見不靨悶亂加味逍遥散方見痘潮熱獨參湯十全大補湯二方見腹脹氣促四物湯方見痘出遲犀角地黄湯即聖濟犀角地黄湯方見頂陷心煩前胡枳殻湯方見痘涕唾瀉黄湯方見痘㵼渇六味地黄丸方見發熱屬隂陽五味異功散方見寒戰咬牙聖濟歸脾湯清胃散二方見痘癰痘瘖王海藏先生云痘疹初出後聲音洪亮形病而氣不病也痘疹未發聲音不出形不病而氣病也瘡疹既發聲音不出形氣俱病也宜用八風湯或凉膈散去硝黄主之竊謂前症若心火上炎刑爍肺金者宜用人參平肺散若津液不足虚火薫蒸者宜用六味地黄丸凡小兒面素白善哭足熱腰痛或解顱面白黒睛淡者出腎虚痘面青善怒或兩頥赤者出肝脾虚也盖邪之所湊其氣必虚當預為調補若在乳下尤當補其母及慎飲食起居為善此余之親騐者也一小兒仲冬出痘呻吟煩躁焮痛作渴音啞便實先君謂心肺實熱之症令急與水飲之遂恣啜始定大便稍和更食梨子數枚得生夫梨者利也能令人作瀉今食之而安乃内有實熱而應用也一小兒痘愈而聲瘖面赤足心發熱小便赤少先君謂腎經虚熱用地黄丸益氣湯而愈其時患是症者用清熱解毒之藥俱致不起一小兒痘愈而聲瘖面白兩睛多白兩足發熱作渴飲湯脉浮數左尺更數而無力余謂禀腎經隂虚朝用益氣湯夕用地黄丸加五味子兩月餘聲漸出又服兩月餘而愈一小兒出痘聲瘖脉息如前余用前藥治之聲漸復清又飲食過多泄瀉復瘖朝用益氣湯夕用異功散地黄丸聲始如舊一小兒痘後聲瘖半載以為廢人余詢之但云頭運其聲即瘖脉浮而緩按之不及兩寸此中氣虚不能上接清陽之氣耳用補中益氣湯地黄丸俱加五味子不半載聲音漸復一男子痘後患瘖惡寒體倦勞則頭運余謂元氣虚而不能上升不信乃服清痰降火之藥而殁一小兒十四嵗痘後勞而喉瘖頭運脉洪數而無力惡寒發熱大便欲去而不去余謂元氣下陷也宜用益氣湯不悟乃雜用疏導之藥泄瀉不止而殁八風散即八風湯藿香半兩去土白芷一兩前胡去蘆一兩黄茋二兩甘草炙二兩人參二兩羗活三兩防風三兩右為末每服入薄荷少許煎湯調服凉膈散方見痘瘡焮裂人參平肺散治心火尅肺金而聲瘖方見頂陷心煩六味地黄丸治腎虚聲瘖方見發熱屬隂陽補中益氣湯治中氣不足不能上接清陽之氣而瘖五味異功散二方見寒戰咬牙痘瘡痛王海藏先生云痘瘡出而煩痛用木香五物主之更用芒硝為末以猪膽汁調敷之若身後痛屬膀胱經也用羌活荆芥甘草湯身前痛屬肺經也用升麻葛根紫草湯身側痛屬膽經也用連翹防風湯四肢痛屬胃經也用防風芍藥甘草湯以急止之盖恐呌號傷氣忍痛傷血而變症也若熱毒盛者用東垣消毒散或仙方活命飲食鷄魚蒲萄酒物者用東垣清胃散生犀汁若發熱飲冷大便調和用四物連翹牡丹皮若發熱飲冷大便秘結脾胃實熱也用清凉飲若發熱作渴飲湯者脾胃虚熱也用七味白术散大凢痘切不可食毒物恐作痛致傷元氣輕者反重重者難治大人亦然一小兒痘瘡作痛色赤飲冷此熱毒熾盛也用活命飲末二服痛止用東垣消毒散一服諸症悉退而瘥若非此藥必作疔毒之類一小兒痘焮痛出血診其母有肝火用小柴胡湯加山梔生地母子服之頓愈又用加味逍遥散而痊一小兒痘痛不止色淡欲陷此痛傷元氣也先用仙方活命飲一劑而痛止用八珍湯而靨一婦人時疫將愈出痘發熱體倦痛甚昏憒飲湯脉洪數按之如絲用十全大補湯調硃砂末一錢二劑其痛頓止食進體徤仍用前湯十餘劑而愈一男子痘瘡痛甚先用仙方活命飲一劑其痛頓止又用東垣消毒散一劑精神如常而靨一小兒痘瘡痛甚脉有力此邪氣實也用活命飲末二錢痛止起發又用東垣消毒散而靨一小兒痘赤痛用活命飲末二錢痛止用當歸黄茋金銀花將愈用四君當歸芍藥而靨一小兒痘赤痛發熱飲冷大便不通脉洪數而有力用活命飲加大黄一服痛赤頓减更用東垣消毒散一服如期而愈一小兒痘瘡紅活焮痛作渴飲冷手足並熱余謂此痘屬形病俱實非清熱解毒不能殺其勢當用活命飲化癍湯不信另服鼠粘子湯痘焮脹大其色如赭先用前藥二劑腫痛悉止乃用鼠粘子湯而愈一小兒痘瘡焮痛服鼠粘子湯之類患痘疔三枚甚苦用隔蒜炙服活命飲痛止貫膿又用東垣消毒散而靨一小兒遍身發熱兩足尤甚作渴飲湯脉洪數而無力此禀腎經虚熱也用地黄丸料加當歸黄茋大劑煎與恣飲三日服數劑熱渴全止又數劑而愈一小兒痘瘡熱痛服敗毒藥四肢患痘癰寒熱發渴余謂當補元氣不信果殁木香五物湯治出痘煩痛青木香四兩丁香一兩薫陸香白礬各一兩麝香一錢右每服五錢水煎熱盛加犀角一兩施銀䑓常用此方其效如神䑕粘子湯治痘瘡欲出未透皮膚發熱眼赤心煩咽痛不利等症减地骨防風名消毒散鼠粘子四錢炒杵荆芥二錢甘草防風五分地骨皮一錢右為末每服一二錢白湯調下仙方活命飲治痘瘡焮痛熱盛者服之頓衰勢弱者服之頓愈真聖藥也東垣清胃散托裏消毒散二方見痘癰東垣消毒散方見炙疹痘一名救苦湯射干鼠粘子湯方見痘咽痛羌活荆芥甘草湯即此三味等分柴胡山梔連翹防風湯即此四味等分連翹防風湯方見痘疔防風芍藥甘草湯即此三味等分化癍湯方見水痘麻痘清凉飲消毒散二方見大便不通四聖散方見痘出不快犀角消毒散隔蒜灸法二方見痘疔痘身疼經云痒則為虚痛則為實内快外痛為外實内虚外快内痛為内實外虚今痘瘡身痛者是膚厚理密或外寒相摶或熱毒内作或血虚不能榮養若熱毒而血瘀者先用活命飲次用東垣消毒散血虚而瘀者用四物湯之類遍身囓而色黒者毒氣壅滯而血凝也乃是危症若二便秘結喘急煩躁用梔子仁湯或猪尾膏血調片腦治之自利不食者不治一小兒痘未發遍身作痛余謂熱毒勢盛先用仙方活命飲一劑痛緩痘出用東垣消毒散一劑末用四聖散而靨一小兒痘未出透遍身作痛此熱毒鬰滯而未盡發於外也先用活命飲一劑而痛愈用參茋四聖散而結靨一小兒痘瘡遍身作痛用東垣消毒散而痛愈用紫草快癍湯而膿貫用托裏散而愈一小兒痘癰肢體作痛發熱惡寒此氣虚而寒邪客于表也用人參羌活散而表解用參茋四聖散而起發用參茋内托散而膿潰一姙婦發熱作渴遍身疼痛用活命飲二劑諸症稍愈形氣甚倦用紫草木香散痘出少許用白术散貫膿而愈一男子出痘根窠赤痛發熱作渴痘裂出血肝火熾也用小柴胡湯加生地犀角諸症頓减又用聖濟犀角地黄湯而結痂黄茋六一湯治痘瘡氣虚作渴愈後作渴尤宜服之黄茋炙六錢甘草炙一錢右水煎服參茋四聖散參茋内托散治痘瘡疼痛或裏虚發痒或不潰膿或為倒靨等症二方見寒戰咬牙小柴胡湯加牡丹皮生地黄即加味小柴胡湯治發熱惡風身痛或四肢勁强寒熱往来方見癍症紫草快癍湯方見便出血或黒屎七味白术散方見發熱屬隂陽四物湯方見痘出遲八珎湯聖濟犀角地黄湯二方見頂陷心煩仙方活命飲托裏散東垣消毒散三方見夹疹痘五苓散方見小便不利製附子法將附子重一兩三四錢有蓮花瓣頭圓底平者先備童便五六碗將附子放在竈上熱處或炭火烘炙乗熱投童便中浸五七日候潤透揭去皮切四塊用粗紙濕裹數層埋灰火中煨候熟取出切片如有白星瓦上炙至無星為度如急用切大片用熱瓦炙熱亦可薛氏醫案卷七十三
