body:
  text: 薛氏醫案卷五十五明薛已訂保嬰撮要面上症錢仲陽云左腮為肝右腮為肺額為心鼻為脾頦為腎色青主驚積不散欲發風候紅主痰積驚悸黃者食積癥傷欲作疳癖白主泄瀉水穀更欲作吐黑主臟腑欲絶印堂青主初患驚瀉紅主大驚夜啼黑主客忤山根青主二次驚瀉後發躁黑黃甚者死年壽平陷主夭青主發熱生驚黑主利死紅主躁死微黃曰平黃甚曰霍亂承漿青主食時被驚黃主吐逆亦主血利黑主驚風白眼黑睛黃主有熱白睛黃主食積疳蛔白睛青主驚風黑睛青主傷寒眉上青吉忽紅主煩躁夜啼黃主霍亂久病紅者死風氣二池青主風候紫主吐逆或發熱黃主吐逆赤主煩躁夜啼兩顴赤主肺有客熱兩太陽青主二次受驚青自太陽入耳者死紅主血淋兩臉青主客忤黃主痰溢赤主風熱兩頰赤主傷寒兩頥青主吐蟲兩金匱青主第三次驚風黑繞口二日死青連目入耳七日死兩風門紅主風熱黑主疝青主水驚黑從眉入耳即日死唇黑不食者死面青眼青肝病面赤心病面白肺病面黃脾病面黑腎病額間赤色主心經有熱煩躁驚悸若飲水或呌哭屬本經實熱用瀉心散以清心火微赤困卧驚悸熱渴飲湯屬虛熱用祕旨安神丸以生心血青黑主驚風腹痛或瘈瘲啼呌用五味異功散加木香柴胡鈎藤鈎補脾肝青黑主心腹作痛此寒水乘心用益黃散微黃主驚疳用安神丸左臉青或兼赤主肝經風熱項強頓悶目劄瘈瘲用柴胡清肝散色微赤倐熱咬牙屬虛熱用地黃丸青黑主肝剋脾而驚搐腹痛用六君子加薑桂微赤主潮熱血虛心躁先用祕旨安神丸次用地黃丸右臉赤主風邪氣粗咳嗽發熱飲水為實熱用瀉白散若哽氣出氣唇白氣短屬虛熱用五味異功散若脾熱所傳用清胃散心火所刑用人參平肺散淡赤主潮熱心躁或大便堅祕用宣明柴胡飲子以疏𨗳如潮熱未止更用鈎藤飲以清肝色青白主咳嗽惡心先用惺惺散解表邪健脾土更以六君子湯調補中氣色青黑主驚風腹痛盤腸內釣用六君鈎藤鈎平肝補脾鼻微黃為平赤主脾胃實熱身熱飲水乳食如常用瀉黃散清熱理脾微赤主脾經虛熱身涼飲湯乳食少思用五味異功散補中健脾色深黃主小便不通鼻中乾燥氣粗衄血乃脾熱傳於肺腎先用濟生犀角地黃湯後用地黃丸色淡白乃脾虛泄瀉乳食不化用六君子湯調補中氣青色主脾土虛寒肝木所勝用五味異功散加木香炮薑溫中平肝黑為死候頦間色赤主腎與膀胱氣滯熱結而小便不通用五苓散以分利鼻凖微黃兼右腮微赤乃脾肺燥熱不能化生腎水用黃芩清肺飲膀胱隂虛陽無所主用滋腎丸若頦間微赤乃膀胱陽虛隂無所化用六味地黃丸若小腹脹滿或隂囊腫脹屬隂虛濕熱壅滯用六味丸加車前牛膝脾肺氣虛不能通調水道者亦用前藥其小便赤色久而尿血亦屬肝腎氣虛有熱用六黃地黃九如不應則用補中益氣湯益脾肺生肝腎若小便後出白津或莖中作痛屬肝經濕熱先用龍膽瀉肝湯後用六味地黃丸印堂青黑主腹痛夜啼此脾氣虛寒也脾為至隂故夜間腹痛而啼用鈎藤飲色淡白主泄瀉乳食不化屬脾氣虛弱用五味異功散加木香人中黃主傷乳胃逆青主下痢乳食不化噯氣酸腐此脾虛停滯先用大安丸消食後用異功散健脾黑主蛔蟲咬痛唇色白主吐涎嘔逆或吐血便血乃脾氣虛弱不能攝涎統血歸源急用六君子湯色赤乾燥而皺者主脾經熱渴大便不通煩熱不寐先以清胃散治其熱次以四君黃連山梔調其脾黃主食積泄瀉乳食不化以六君子湯健脾赤色兼白主衄血乃脾肺虛熱不能攝血歸源用聖濟犀角地黃湯清熱補血用四君子湯以補脾氣如久不應用麥門冬散或人參安胃散口畔色黃主脾經積熱用清胃散久病用四味肥兒丸以治疳熱唇口抽動主驚熱不安用異功散加山梔鈎藤鈎補脾平肝若口流涎唇色紫乃脾氣虛寒用異功散加炮薑木香若腹中痛口吐涎乃蟲作痛先用蕪荑散後用調中丸不吐涎是積痛也用異功散手足厥冷用理中湯加烏梅溫補中氣而痛自止或吐後或大便去後而痛止者先用下積丸後用異功散白主失血死青主驚風死黑色繞口者不治耳微微赤此少陽經風熱用柴胡飲子清肝生血微黃主睡中驚悸咬牙用四君子加芎歸升麻以調理脾氣耳乾燥主骨疳蒸熱作渴盜汗用地黃丸若小便後出白津或玉莖癢痛屬肝經濕熱先用龍膽瀉肝湯後用地黃丸若稟賦腎氣不足或早近女色致小便泄滯或作痛如淋者急用地黃丸補中益氣湯滋其化源或大小便去後榖道牽痛者其虛尤甚用前丸加牛膝車前肉桂如手足逆冷或畏寒少食陽氣虛寒也急加附子多可得生大抵多因稟賦臟氣不平或乳食寒暑失節或妊娠乳母飲食起居六淫七情所致若初病元氣無虧乳母如常發熱壯熱二便祕結作渴飲水睡不露睛者悉屬形病俱實當治邪氣若病久元氣已虧食少發熱口乾飲湯嘔吐泄瀉肢體畏寒而露睛者悉屬形病俱虛當補正氣更宜審胎氣之虛實臟腑之相勝而治之庶無誤矣瀉心散方見心臟祕旨安神丸方見心臟五味異功散方見內釣朱砂安神丸方見發搐柴胡清肝散方見諸熱地黃丸方見腎臟症六君子湯方見內釣瀉白散方見肺臟清胃散方見內釣補中益氣湯方見虛羸人參安胃散方見脾臟宣明柴胡飲子方見發熱鈎藤飲方見慢驚惺惺散方見咳嗽瀉黃散方見脾臟濟生犀角地黃湯方見便血五苓散方見五淋發搐錢仲陽云驚癎發搐男左視無聲右視有聲女右視無聲左視有聲此相勝也蓋左為肝部右為肺部金木相勝故耳若寅邜辰時身熱目上視手足動口流涎項強急此肝旺也己午未時身熱發搐心神驚悸目上視牙緊流涎手足搐動此心旺也申酉戌時身熱微搐而喘目微斜睡露睛手足冷大便淡黃水此肺旺也亥子丑時微搐卧而不安身微熱目緊斜喉中有痰大便色白困睡流涎此腎虛也若握拳拇指在內女為順拇指在外男為順順則易治逆則難愈若涎入心肝則不能言用涼心鎮驚下痰逆搐者不治吐瀉後變症者亦不治如手足冷汗搐眉搐肚日夜不止名真搐當用人參湯川烏全蝎等藥平其胃氣傷風發搐口中氣熱呵欠手足動者名假搐用大青膏發散風邪傷食後發搐身熱困睡嘔吐不思乳食者當先定搐後用白丸子下之百日內發搐真者內生風二三次必死假者外生風雖頻發不死外傷風者用大青膏塗囟門及浴體法寅邜辰時搐而發熱作渴飲冷便結屬肝膽經虛熱用柴芍參苓散作渴引飲自汗盜汗屬肝膽經血虛用地黃丸口吻流涎屬肝木剋脾土用六君子湯己午未時發搐若兼作渴飲水屬風火相搏以地黃丸補肝𨗳赤散涼驚丸治心若作渴飲湯體倦不乳土虛而木旺也用地黃丸以補腎六君子湯以補脾申酉戌時微搐留喘目微斜身似熱睡而露睛大便淡黃屬脾肺虛熱用異功散手足逆冷或喘瀉不食屬脾肺虛寒用六君炮薑木香久病而元氣虛者用六君子六味丸二藥主之亥子丑時微搐身熱目睛緊斜吐瀉不乳厥冷多睡屬寒水侮土用益黃散未應用六君薑桂傷風發搐口氣不熱肢體倦怠用異功散補脾土鈎藤飲清肝木若因風邪內鬱發熱而變諸症者當理肺金清風邪若外邪既解而內症未除當理肺補脾若肺經虧損而致驚搐等症者當補脾肺以平肝心則驚搐自止矣若停食發搐嘔吐乳食者宜用消食丸若食既消而前症仍作或變他症者脾土傷而肝木乘之也用六君子加鈎藤鈎以健脾平肝若百日內搐者因胎氣所稟亦有乳母七情厚味所致者當兼治其母而以固胃為先不可徑治其兒也治驗一小兒寅卯時發熱痰搐服抱龍丸而愈後復患因自用前藥更加咳嗽氣喘不時發搐面赤或青黃或浮腫或流涎余謂咳嗽氣喘乃脾肺氣虛不時發搐乃木乘土位面青而黃赤乃肝助心脾浮腫流涎乃脾氣虛弱用益智丸以補心神補中益氣湯以養脾肺頓愈少參王陽湖孫跌傷股骨正體科已續余視其面色青黃口角微動此肝木侮脾之症且氣血筋骨皆資脾土以生但壯脾氣則所傷自愈遂用六君鈎藤當歸三十餘劑諸症悉痊一小兒兩目連劄手足發搐服天麻防風丸之類每發飢時益甚得飲食稍定此肝木制脾土也用六君升麻柴胡鈎藤鈎二劑而病痊又用補中益氣湯而全效一小兒己午時搐熱驚悸發時形氣倦怠而黃懶食流涎飲湯此心火虛而不能生脾土也不信自服涼心之藥更加吐瀉睡而露睛幾成慢脾風用六君薑桂佐以地黃丸而愈一小兒七嵗驚搐發熱不已己午未時益甚形氣殊倦熱定飲湯此心脾氣虛朝用補中益氣湯加益智仁夕用六君當歸鈎藤鈎尋愈後飲食過多復作吐瀉或治以保和丸反加寒熱發搐此脾土復傷而肝木所侮也用六君柴胡寒熱止而飲食進但午未時仍瀉用補中益氣湯加茯苓半夏鈎藤鈎而愈一小兒百日內患搐痰涎自流用驚風藥益甚視其面色黃中隱白乃脾虛不能攝涎也用六君子補中益氣二湯而愈後復患兼氣喘自欲表散行痰余謂此肺虛不能納氣歸源耳用五味異功散加鈎藤鈎柴胡調補脾肺清理肝火而安一小兒患前症面青黑或痿黃審其母素有鬱怒用加味逍遙散加味歸脾湯治其母而子亦愈一小兒月內發搐鼻塞乃風邪所傷以六君子湯加桔梗細辛子母俱服更以蔥頭七莖生薑一片細擂攤紙上合置掌中令熱急貼囟門少頃鼻利搐止一小兒未滿月發搐嘔乳腹脹作瀉此乳傷脾胃用五味異功散加漏蘆令母服之子亦服匙許遂愈一小兒驚悸痰盛瀉乳不消此感風邪夾驚肝侮脾而氣虛先以天麻防風丸袪風定驚後用五味異功散壯脾止搐而愈一小兒發熱拘急四肢瘈瘲左腮赤此心肝二經風熱先用柴胡清肝散次用六味地黃丸而愈一小兒發搐啼呌手足指冷左腮青黑此脾土虛弱腎水反所侮也用六君薑桂一劑頓安又以四君芎歸及補肝散而愈一小兒發熱作渴用瀉黃散大便重墜口角流涎仍欲瀉火余曰鼻凖青白多而黃色少屬脾胃虛寒肝木所侮蓋口角流涎脾氣虛而不能攝也大便重墜脾氣陷而不能升也不信另用涼驚之劑果眉唇微動四肢微搐余曰此虛極而變慢風矣始用六君當歸木香炮薑鈎藤鈎二劑未效意欲更藥余曰此藥力未至也仍加附子一片服之即安後去附子又二劑而愈一小兒目內青色發搐目直上視呌哭不已或用牛黃清心丸更加咬牙頓悶小便自遺余謂此肝脾虛甚用補中益氣湯六味地黃丸而愈一小兒發搐目劄屬肝膽經風熱先用柴胡清肝散以清肝後用六味地黃丸以補腎而愈涼驚丸治驚疳熱搐心神驚悸白睛赤色牙關緊急潮熱流涎手足動搐黃連五錢龍腦一錢研防風龍膽草酒拌炒黑青黛研三錢牛黃麝香各一字鈎藤鈎子二錢右各另為末麵糊丸粟米大每服三五丸至一二十丸煎金銀湯下愚按前方治心肝二經風熱若心肝虛而見驚搐潮熱用祕旨安神丸肝木乘脾者用異功散加柴胡鈎藤鈎心脾虛弱而潮熱流涎者用異功散若虛寒更加木香不應更加炮薑詳見滯頥擦牙通關散治風搐搦關竅不通痰塞中脘留滯百節南星二錢麝香一字牙皂二錢燒存性赤腳蜈蚣一條殭蠶各二錢右為末薑汁蘸藥少許擦牙或調服二三點涎自出至聖保命丹治胎驚內釣腹肚緊硬啼呌不安及急慢驚風眼目上視手足抽掣不省人事全蝎十四箇去毒防風二錢白附子炮南星蟬殼天麻殭蠶去絲嘴炒朱砂各一錢麝香五分金箔右為末米糊和每兩作四十丸每服一丸白湯化下有熱者以膽星易炮星白餅子治傷食嘔吐肚疼噯氣先用此藥一服推下食積却用惺惺散加減參蘇飲不可服冷藥滑石半夏膽南星各一錢輕粉巴豆二十四粒去皮膜用水一升煮乾研爛右以三味為末入巴豆輕粉研勻飯丸菉豆大每服三五丸紫蘇湯下忌熱物量兒加減十味安神丸治驚人參茯苓麥門冬山藥各二錢片腦二分朱砂甘草寒水石各五分龍齒一錢金箔二片右為末蜜丸雞豆大燈心湯調下一方有馬牙硝浴體法天麻二錢蝎尾去毒朱砂各五分烏蛇肉酒浸焙白礬各二錢麝香一字青黛二錢右為末每用三錢水三碗桃枝一握煎至數沸溫浴之勿浴背塗囟法治發搐麝香一字蝎尾去毒薄荷葉三分蜈蚣牛黃青黛末各一字右同研用熟棗肉劑為膏新綿上塗勻貼𩕄上四方可出一指許火上炙手頻尉百日裏外小兒可用此瀉青丸方見肝臟𨗳赤散方見心臟地黃丸方見腎臟益黃散方見脾臟蘇青膏方見慢驚大青膏方見肝臟目睛瞤動目者肝之竅也肝膽屬風木二經兼為相火肝藏血血不足則風火內生故目睛為之瞤動經曰曲直動搖風之象也宜用四物益其血柴胡山梔清其肝隂血內榮則虛風自息矣若因肝經血燥而自病者用六味丸以滋其源因肺金剋肝木者用瀉白散以平金邪若眼眶瞤動者肝木乘脾土也用抱龍丸若愈後驚悸不寐或寐中發搐咬牙目睛瞤動者血虛不能榮筋脈也用補中益氣湯或歸脾湯加茯苓五味蓋有餘者邪氣實也不足者真氣虛也凡病氣有餘當認為不足况此症兼屬肝脾多為漫驚之漸尤當審之治驗一小兒三嵗因驚抽搐發熱久服抱龍丸等藥面色或赤或青余曰始因肝有實邪故宜用前藥今面色青赤乃肝經虛熱傳心矣遂用六味丸以養肝腎佐以六君升麻柴胡以補脾胃諸症頓痊大尹周應昌子患瘰癧恪服化痰之劑虛宜用六君子湯加小柴胡湯若四肢微搐或潮熱往來或泄瀉嘔吐面色痿黃皆脾胃有傷也宜用白术黃茋川芎當歸人參陳皮肉豆蔲神麯乾葛白芍藥黃連炙甘草白茯苓以補胃氣若脾胃虛弱者用六味異功散虛寒加木香炮薑若脾氣下陷者用補中益氣湯以升其陽作渴者用七味白术散以生津液若肝木侮脾者用補中益氣湯加茯苓半夏芍藥以制肝補脾治驗一小兒傷食發熱唇動或用養胃湯枳實黃連山查之類更加腹脹午後發熱按其腹不痛余以為服前藥飲食雖化而脾胃復傷也用六君子湯數劑而痊一小兒傷食發熱嘔吐唇口服消𨗳清熱之劑飲食已消熱赤如故余曰此胃經虛而安瀉青丸方見肝臟六味丸方見腎臟四君子湯方見天釣瀉白散方見肺臟唇口蠕動唇為脾之華口乃脾之竅又陽明之脈環唇口而交人中陽明胃也是以脾胃虛者多有此症不獨病後而已夫脾主涎脾虛則不能收攝多兼流涎或誤認為痰而用祛逐之藥則精液益枯不能滋養筋脈遂致四肢抽搐病勢愈甚原其治法與慢脾風相同當用大補脾胃之藥加升麻柴胡切勿用青皮龍膽草之類兼察其色黃者脾弱也青者肝勝也青黃不澤木來剋土也青赤相兼木火風熱也黑為寒水反來侮土白為氣虛亡陽凡此宜用六君子湯加小柴胡湯若四肢微搐或潮熱往來或泄瀉嘔吐面色痿黃皆脾胃有傷也宜用白术黃茋川芎當歸人參陳皮肉豆蔲神麯乾葛白芍藥黃連炙甘草白茯苓以補胃氣若脾胃虛弱者用五味異功散虛寒加木香炮薑若脾氣下陷者用補中益氣湯以升其陽作渴者用七味白术散以生津液若肝木侮脾者用補中益氣湯加茯苓半夏芍藥以制肝補脾治驗一小兒傷食發熱唇動或用養胃湯枳實黃連山查之類更加腹脹午後發熱按其腹不痛余以為服前藥飲食雖化而脾胃復傷也用六君子湯數劑而痊一小兒傷食發熱嘔吐唇動服消𨗳清熱之劑飲食已消熱赤如故余曰此胃經虛熱耳用四君升麻柴胡四劑而愈一小兒素面白忽然目唇微動時面色青黃良久其唇口手足亦微動此脾虛而肝侮之也用五味異功散加鈎藤鈎白附子一劑而面青少退再二劑唇口動亦止又用異功散加升麻柴胡四劑而痊一小兒暑月吐瀉目唇微動面色青白手足並冷仍用玉露散余謂已變慢脾風也當溫補脾胃不信後果殁五味異功散方見天釣內釣補中益氣湯方見虛羸七味白术散方見積痛六君子湯方見天釣小柴胡湯方見痓症四君子湯方見天釣驚搐目直小兒忽然驚搐目直者皆肝之風熱也若肝虛生風則目連劄而不搐及多欠咬牙若肝經風實則目直大呌呵欠項急頓悶若肝經有熱則目直視不搐得心熱則搐氣熱則外生氣溫則內生其症手尋衣領及亂捻物宜用瀉青丸壯熱飲水喘悶宜用瀉白散凡病之新久皆能引肝風風內動則上入於目故目為之連劄若熱入於目牽其筋脈兩眥俱緊不能轉視故目直也亦有飲食停滯中焦致清陽不升濁隂不降肝木生發之氣不得升致生虛風者須詳審之若胸滿腹痛嘔吐惡食輕則消𨗳化痰重則探吐滯積更須審其所傷寒物熱物亦有因感冒吐瀉致使土敗木侮而生虛風者不可遽服驚藥宜用六君子加芍藥木香柴胡制肝補脾若因脾土虛而自病者用五味異功散凡飲食停滯痰涎壅滿而見驚症者實因脾土虛弱不能生金金虛不能平木故木邪妄動也宜健脾消食其症自愈若輒用驚風之藥反成其風而益其病也况臟腑脆嫩不可投以峻厲之劑治者愼之治驗姚儀部子每停食則身發赤暈此飲食內停不消鬱熱發外用清中解鬱湯而愈後患搖頭咬牙痰盛發搐吐出酸味伺其吐盡翌日少以七味白术散調理脾胃遂不復患一小兒停食服通利之劑作嘔腹脹此脾胃復傷也用補中益氣湯而愈一小兒兩目動劄手足發搐數服天麻防風丸之類前症不愈其痰益甚得飲食稍愈視其凖頭及左頰色青黃余曰脾主涎此肝木剋脾土不能統攝其涎非痰盛也遂用六君升麻柴胡鈎藤二劑飲食漸進諸症漸愈又用補中益氣湯而安九味養脾湯治小兒大病後面黃肌瘦目動咬牙髮少未能強步因誤服解表瀉利傷剋諸藥而致者宜長緩調理全復胃氣白术一錢二分白芍藥酒炒白茯苓各八分人參陳皮川芎各六分甘草炙黃茋蜜炙當歸酒洗各四分半夏山查麥門冬各六分右用薑棗水煎服六君子湯方見天釣五味異功散方見天釣清中解鬱湯方見丹毒七味白术散方見積痛參苓白术散方見虛羸補中益氣湯方見虛羸天麻防風丸方見傷風咳嗽睡中驚動小兒睡中驚動由心腎不足所致蓋心主血與神肝藏血與魂肺主氣與魄腎主精與恐小兒臟腑脆弱易為驚恐恐則氣下驚則心無所依神無所歸且夫人之神氣寤則行於目寐則棲於腎今心腎既虛則不能寧攝精神故睡中驚動也治宜清心安神用茯苓補心湯加酸棗仁茯神五味亦有驚嚇而作者因擊動其肝故魂不安也治宜鎮驚定魂用安神鎮驚丸若飲食間因驚而停滯者用六君子加神麯厚朴食既消而驚未定用茯苓補心湯若木火太過而心神不寧者用𨗳赤散風熱相搏者用柴胡梔子散食鬱生痰驚動不安者用四君以健脾神麯半夏以化痰山梔芍藥以清熱治驗一小兒夜睡忽然驚動如搐大便酸臭而色青此飲食傷脾而肝旺也先用異功散加柴胡升麻山梔又用四味肥兒丸而愈一小兒不時睡中驚動發搐作渴飲冷左腮青額間赤先用柴胡清肝散加鈎藤鈎四劑以治肝火後用五味異功散以健脾又用地黃丸補腎肝而安𨗳赤散方見心臟柴胡梔子散方見諸熱症即梔子清肝散六味丸方見腎臟四君子湯方見天釣六君子湯方見天釣五味異功散方見天釣茯苓補心湯方見瘖安神鎮驚丸方見急驚目動咬牙小兒驚後目微動咬牙者皆病後亡津液不能榮其筋脈也亦有肝經虛熱而生風者當審其氣血有餘不足而治之其日中發熱飲冷而動者氣有餘也用瀉青丸夜間盜汗及睡不寧而動者血不足也用地黃丸或因肝經風邪傳於脾腎者亦令咬牙先用柴胡清肝散次用五味異功散六味地黃丸若因脾胃虛熱用補中益氣湯加芍藥山梔實熱用瀉黃散蓋牙牀屬手足陽明故也若肝腎熱用六味地黃丸治驗奚氏女六嵗忽然發驚目動咬牙或睡中驚搐痰涎壅盛或用化痰袪風等藥益甚余曰面青而見前症乃屬肝木尅脾土不能攝涎而上湧也當滋腎水生肝血則風自息而痰自消矣遂用六味丸而愈一小兒患前症痰涎自流用驚風之藥其症益甚脾胃益虛視其面色痿黃口中吐痰用六君子補中益氣湯而愈𨗳赤散方見心臟地黃丸方見腎臟瀉青丸方見肝臟補中益氣湯方見虛羸六味地黃丸方見腎臟六君子湯方見天釣搖頭便血經曰諸風掉眩皆屬肝木木得風則搖動乃肝經火盛而生虛風也湯氏治鄭都承子搖頭便血七年用祛風藥止血藥百試無效此肝經風熱所乘土受木剋不能攝血而潰入大腸故便血不止遂製清肝益胃湯以平肝益脾祛風熱兼服胃風湯旬餘諸症悉愈便血者風木搖動則土受凌虐而不能統血也或食酸味過多以益其肝致令隂結經曰結隂者便血一升再結二升三結三升又邪在五臟則隂脈不和隂脈不和則血留之結隂之病隂氣內結不得外行滲入腸間故便血也間亦有乳母恚怒風熱熾盛或肝木傷脾使清氣不升或風邪侵入大腸者治法若因風熱用柴胡清肝散若因怒火用加味小柴胡湯若清氣不升脾氣下陷者用補中益氣湯若風邪侵於大腸者用清肝益胃丸肝經血熱妄行者用六味地黃丸脾土不能培肝木者用六君柴胡鈎藤鈎肝木勝脾土者用四君芍藥鈎藤鈎結隂者用平胃地榆湯治驗一小兒傷風咳嗽痰湧余謂脾虛肺弱腠理不密風邪外乘用六君子湯加桔梗桑皮杏仁而愈後飲食停滯作瀉腹脹仍用六君子加山查厚朴而安又停食作瀉服消𨗳之藥更加咳嗽余謂當調補脾土不信自用發表剋滯前症益甚更加搖頭余以天麻散倍加鈎藤鈎及異功散而愈一小兒項間結核面色痿黃肌體消瘦咬牙抽搐頭搖目劄此肝木尅脾土也用六君子湯及九味蘆薈丸頓愈一小兒病後遇驚即痰甚咬牙抽搐搖頭作瀉略服腦麝朱砂等藥以致慢驚而卒清肝益胃丸犀角屑甘草全蛇蛻炙黃鈎藤鈎子麻黃去節一錢黃芪蜜炙羌活防風白芍藥天花粉各半兩右為末棗肉杵丸桐子大每服五十丸食後薄荷湯下海藏食療云蛇蛻主去風邪明目治小兒一百二十種驚癎寒熱等症蠱毒安胎炒用又治風癎弄舌搖頭故前方用之平胃地榆湯治結隂便血白术陳皮茯苓厚朴葛根各五分地榆七分乾薑五分炙甘草當歸炒神麯白芍藥人參益智各三分升麻附子炮各一錢右每服一錢水煎服胃風湯方見偏風口噤柴胡清肝散方見諸熱症加味小柴胡湯方見肝臟補中益氣湯方見虛羸六味地黃丸方見腎臟瀉白散方見肺臟六君子湯方見天釣四君子湯方見天釣天麻散方見內嗽異功散方見天釣九味蘆薈丸方見疳症偏風口噤小兒偏風者屬少陽厥隂肝膽二經證也噤者筋急由風火太甚而乘於脾以勝水濕則筋太燥然燥金主於收斂徑切故也又曰風之為病善行而數變或左或右其因一也治須審而藥之若足陽明胃經氣虛風邪所乘其筋脈偏急者屬外因若足厥隂肝經風熱乘脾筋脈偏急者屬內因若脾肺虛弱腠理不密外邪所乘或服金石之劑耗損肝血或吐瀉後內亡津液不能養肝致口眼歪斜或半身不遂諸症皆屬肝血不足肝火生風宜滋腎水養肝血壯脾土治法脾胃虛而動風者異功散加柴胡鈎藤鈎脾肺虛而外邪所乘者用鈎藤飲肝火血燥者用六味地黃丸津液不足者用白术散若兼目緊上視寒熱往來小便淋瀝面色青潔兩脅脹痛之類皆肝經之本病也或唇口歪斜腹脹少食目泡浮腫面色青黃肢體倦怠之類皆肝木乘脾之症也當審五臟相勝而主之説執其見症槩投風藥反成壞症者有矣治驗一小兒口眼喎邪面色或青或赤此肝心風火乘脾也朝用柴胡清肝散夕用異功散加鈎藤鈎而愈其時有患前症服祛風𨗳痰之藥者皆不能起一小兒痢後患前症發搐面色痿黃肢體倦怠此元氣虛剋伐多矣余用補中益氣湯加鈎藤鈎子服而漸愈後因乳母七情飲食失宜或兒乳食過多前症仍作服補中益氣湯五味異功散而應錢氏全蝎散治驚風口眼喎邪言語不正手足偏廢不舉全蝎去毒炒殭蠶真者炒川芎黃芩甘草桂枝麻黃去節赤芍藥各二錢天麻六錢天南星去臍二錢右為末每服二三錢薑五片水煎服胃風湯治風冷乘虛入客腸胃水穀不化泄瀉注下及腸胃濕毒下如豆汁或瘀血日夜無度人參白茯苓芎藭桂當歸白芍藥白术各等分右散每服二錢入粟米數粒同煎食前服異功散方見天釣六味丸方見腎臟白术散方見積痛柴胡清肝散方見諸熱補中益氣湯方見虛羸角弓反張錢仲陽曰角弓反張者由風邪客於太陽經也經曰風從上受足太陽主周身之氣其脈起於目內眥而行於背肝屬木主風所以風邪易侵也夫小兒肌膚未密外邪易傷肝為相火其怒易發若身反張強直發熱不搐者風傷太陽也宜用人參羌活散小續命湯若因暴怒而擊動其肝火者宜用瀉青丸若飲前劑其症益甚者此邪氣已去而脾氣虧也宜用異功散加芎歸補之若因肝經虛熱或因剋伐真氣虛熱生風者宜用異功散地黃丸補之若因下而脾氣困憊腹肚膨脹者此中氣損也宜用白术散補之若氣血素弱或服攻伐之劑而手尋衣領咬牙呵欠者肝經虛甚也急用地黃丸以補之仍與肝臟參覽治驗一小兒忽腰背反張目上視面青赤曰青屬肝主風赤屬心主火此風火相摶用柴胡梔子散倍加鈎藤鈎頓安而痰如舊又用抱龍九而愈一小兒忽腰背反張服治驚之藥後不時舉發面色黃白肢體甚倦余用五味異功散十餘劑而愈後因驚兼飲食不節不時舉發隨用前藥即愈遂日以參木末每服五七分炮薑大棗煎湯調下服至三兩而不發已上二症元氣虛而病氣實也若用攻邪之藥皆誤矣一小兒素患前症痰盛面色素白而兼青余謂肺氣不能平肝肝氣乘脾脾氣虛而生痰耳先用抱龍丸二服以平肝隨用六君子湯以補脾肺月餘而痊半年之後復發謂非逐痰不能全愈遂用下劑痰涎甚多而咽喉如鋸聲余曰乃脾不能攝涎也咽間嗚乃肺氣虛甚也遂用人參五錢炮薑三分水煎服而醒至第四劑後加棗二枚人參服數兩而愈後每發非獨參湯不應若執常方鮮不有誤者人參羌活散方見驚風小續命湯方見五硬瀉青丸方見肝臟異功散方見肺臟地黃丸方見腎臟柴胡梔子散方見諸熱即梔子清肝散抱龍丸方見傷寒夾驚六君子湯方見天釣薛氏醫案卷五十五
