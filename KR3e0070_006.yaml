body:
  text: 薛氏醫案卷六眀薛巳撰保嬰金鏡録全幼心鑑云小兒半嵗之間有病當於額前眉端髮際之間以名中食三指橫按之兒頭在左舉右手在右舉左手食指為上中指為中名指為下若三指俱熱主感受風邪鼻塞氣粗發熱咳嗽若三指俱冷主外感內傷發熱吐㵼若食中指熱主上熱下冷名中指熱主夾驚食指熱主胸膈氣滿乳食不消竊謂額間赤色主心經風熱煩躁驚悸若發熱作渴飲水或發呌哭屬本經實熱用㵼心湯以清心火微赤則困卧而悸發熱作渴飲湯屬虛熱用祕旨安神丸以生心血青黑主驚風腹痛或瘈瘲啼呌青黑甚主心腹疼此寒水勝心火為賊邪用益黃散以補脾胃微黃皮燥主驚疳此心經疳症用祕旨安神丸以養心血骨蒸作渴盜汗頭髮乾黃此為腎疳用地黃丸以滋補肝腎左臉青或兼赤乃肝經風熱項強頓悶發搐目劄瘈瘲用柴胡清肝散主之虛熱用地黃丸補之青黑主肝尅脾虛寒驚搐腹痛用六君薑桂溫之微赤主潮熱血虛心躁用祕旨安神丸佐以地黃丸右臉赤主大腸實熱氣粗咳嗽發熱飲水用㵼白散若哽氣出氣唇白氣短屬虛熱用五味異功散脾熱所傳用清胃散心火所刑用人參平肺散淡赤主潮熱心躁或大便堅祕用宣眀柴胡飲子以疏導其熱如潮熱未止更用鈎藤飲以清肝補脾色青白主咳嗽惡心先用惺惺散解其表邪健其脾土繼以六君子湯調補中氣色青黑主驚風腹痛盤腸內弔此肝木侮脾土用六君子湯加鈎藤鈎以調補元氣不宜治肝鼻色赤主脾胃實熱身熱飲水飲食如常用㵼黃散清熱理脾微赤主脾經虛熱飲食難化而不思食用五味異功散以補中健脾色深黃主小便不通鼻中乾燥氣粗衄血乃脾熱傳于肺腎先用濟生犀角地黃湯清熱養血後用地黃丸以滋益腎水色淡白乃脾氣虛弱主泄㵼飲食不化用六君子以調補中氣青色主脾土虛寒肝木所勝用五味異功散加木香炮薑溫中平肝頦間色赤主腎與膀胱隂虛有熱而小便不通用四物湯加山梔以養血清熱赤甚主膀胱氣滯而熱結用五淋散以分利其邪若鼻凖微黃兼右腮微赤乃脾肺燥熱不能化生腎水用黃芩清肺飲膀胱隂虛陽無所生用滋腎丸若頦間微赤乃膀胱陽虛隂無所化用六味地黃丸若兼小腹脹滿或隂囊腫脹屬隂虛濕熱壅滯用六味丸加車前子牛膝兼脾肺氣虛不能通調水道者亦用前藥其小便赤色久而尿血亦屬肝腎氣虛有熱用六味地黃丸主之不應則用補中益氣湯益脾肺生腎肝若小便後出白津或莖作痛者屬肝經濕熱先用龍膽㵼肝湯後用六味地黃丸印堂色青黑主腹痛夜啼此脾經虛寒脾屬至隂故夜間腹痛而啼用鈎藤飲色淡白主泄㵼飲食不化屬脾氣虛弱用五味異功散加木香主之目內色青主肝經風熱發驚若直視呌哭屬肝經實熱用抑肝散兼咬牙頓悶屬虛熱用六味地黃丸色赤主心肝二經發熱抽搐煩躁若小便赤屬小腸實熱用導赤散若驚悸倦怠屬肝經血虛用六味地黃丸色黃主脾積少食夜間發熱用四味肥兒丸飲食停滯吐㵼並作用胃苓散去桂加茵蔯山梔自解發搐眼眨屬風熱相摶先用柴胡梔子散後用六味地黃丸眼胞微腫主久咳惡心或脾疳食積用五味異功散補脾肺兼肥兒丸以消積滯或目視不眀或雀目揩拭眉眼此欲生風也急用抑肝散以解之睛尾紅絲乃肝木勝脾土先用四君子加柴胡山梔後用地黃丸人中色黃主傷食青主乳食不化噯噫酸腐此脾虛停滯用平胃散以消積和中色青赤主驚肝氣傷脾用五味異功散加柴胡以平肝補中唇色白主吐涎嘔逆或吐血便血乃脾氣虛弱不能攝涎統血歸源急用六君子湯調補中氣則諸病自愈切忌涼藥若色赤乾燥而皺者主脾經有熱發熱作渴口中氣臭大便不通燥煩不寐先以清胃散治其熱更以六君子湯加黃連山梔兼補其脾色黃主脾經食積泄㵼飲食不化以六君子湯溫補中氣色赤兼白主衄血乃脾肺虛熱不能攝血用聖濟犀角地黃湯以清熱補血兼用六君子以補脾氣久不愈用麥門冬散或人參補肺湯口畔色黃主脾經積熱用清胃散以理脾清熱若唇口搐動主驚熱不安用五味異功散加山梔鈎滕鈎以補脾平肝若口流涎唇色紫乃胃氣虛寒也用益黃散若腹中痛口吐涎水者乃蟲痛也先用蕪荑散後用調中丸不吐涎者乃積痛也但用五味異功散調補胃氣手足並冷用理中湯加烏梅溫補中氣則蟲不動而痛自止矣亦有積痛者或吐后痛止或去後痛止者宜用消積丸消導積滯佐以異功散調補胃氣耳前微赤此少陽經風熱也用柴胡梔子散生肝血清肝火微黃主睡中驚悸咬牙因肝脾虛熱宜用四君子加芎歸以安神耳輪乾燥主骨疳蒸熱為腎經虛熱也用六味地黃丸補之若小便後出白津或隂莖癢痛者屬肝經濕熱也先用龍膽㵼肝湯後用六味地黃丸若稟父不足或早近女色致小便澀滯或作痛如淋者急用六味地黃丸補中益氣湯滋其化源或大小便道牽痛者尤為虛也亦用前藥加牛膝車前子肉桂救之如手足逆冷或畏寒飲食陽氣虛寒也急加附子多有生者大抵小兒之症多因稟賦臟氣不平或乳食寒暑失宜或妊娠飲食起居六淫七情所致若初病元氣無虧乳食如常發熱壯熱二便祕結作渴飲水卧不露睛者悉屬形病俱實當治邪氣若病久元氣已虧食少發熱口乾飲湯嘔吐泄㵼肢體畏寒卧而露睛者悉屬形病俱虛當補正氣况今之小兒元氣與昔不同用藥失宜脾胃先傷豈可泥古方而施治哉余故考諸名家宗諸東垣于凡諸症各補以方藥治者能即色以驗其病察病以固其本斯無失矣是以古之治病望色為先也且驚則氣散脈亂不可専診故必兼察色心鑑云若面色未盡當參之以指脈指脈未盡當參之以面色色脈兼盡無餘藴矣治驗一小兒瘈瘲啼呌額間青黑此驚風肝木乘脾腹中作痛也先用六君子湯加木香柴胡鈎藤鈎啼呌漸緩更加當歸又二劑而安一小兒嘔吐不食手足搐搦痰涎上湧手足指冷額黑唇青此腎水勝心火也用五味異功散加木香炮薑頓安乃去炮薑再劑而愈一小兒煩躁驚悸熱渴飲冷額間色赤此心經實熱所致先用㵼心湯一服稍緩又用柴胡梔子散而瘥一小兒四肢消瘦肚腹漸大寒熱嗜卧作渴引飲余曰症屬肝脾名為丁奚哺露也以白术散為佐佐以徐氏十全丹月餘諸症漸愈乃以異功散加當歸及六味丸又月餘尋愈一小兒患前症諸疳悉具熱如火炙病狀不能盡述朝用異功散夕用四味肥兒丸月餘諸症稍愈佐以地黃丸自能行立遂朝以地黃丸夕以異功散及蝦蟆丸數服而全愈一小兒四肢消瘦肚腹脹大行步不能狀如蜘蛛頗能飲食作渴發熱去後臭穢此脾藏傷也以十全丹數服諸症漸愈又用異功散肥兒丸調理肢體如常一小兒發熱拘急或四肢瘈瘲左腮色赤此心肝二經風熱相摶先用柴胡清肝散以清心肝之熱次用六味地黃丸以生肝腎之血頓安一小兒發搐啼呌手足指冷左腮青黑此肝脾虛弱腎水反侮脾土用六君子湯加薑桂一劑頓安又以四君子加芎歸及補肝𣪚而愈一小兒潮熱煩躁左腮青赤此心肝血虛用祕旨安神丸及四物湯加防風酸棗仁治之尋愈又用六味地黃丸調補肝腎而痊一小兒潮熱發搐痰涎上湧手足指冷左腮至申酉時青中隱白手足時搐此肝經虛弱肺金所勝而潮搐脾土虛弱而手足冷也用補中益氣湯以調補脾肺用六味地黃丸以滋補肝腎而愈蓋病氣有餘當認為元氣不足若用㵼金伐肝清熱化痰則誤矣一小兒發熱咳嗽右腮色赤此肺金有熱用㵼白散而愈復感冒風邪前症更作又加聲重流涕用參蘇飲加杏仁桑皮而愈但右腮仍赤兼額微赤此兼心火乘肺金也用人參平肺散一劑遂痊一小兒五嵗作渴右腮鼻凖微赤或飲冷水或服涼藥即時嘔吐余曰右腮微赤肺經虛熱也鼻凖微赤胃經虛熱也此胃虛不能生肺耳先用四君子加升麻一劑服之而不吐又用白术散二劑而不渴再用四君子四劑而安一小兒潮熱煩渴大便乾實氣促咳嗽右腮色赤此肺與大腸有熱用柴胡飲子一服諸症頓退後因微驚又發搐咬牙頓悶此肝脾氣血虛也用四君子加芎歸鈎藤鈎而愈一小兒咳嗽惡心鼻塞流涕右腮色青白此脾肺氣虛而外邪所乘先用惺惺散咳嗽頓安但飲食不思手足指冷此外症雖去而元氣尚虛也用六君子少加升麻一劑而痊一小兒腰曲啼呌右腮色青黑此臍腹內痛即盤腸內弔也因脾土虛寒肝木來乘故耳用六君子加木香鈎藤鈎頓痊一小兒發熱飲食少思大便不實常服蘆薈等丸視其鼻赤此寒涼之劑復傷脾土而虛熱也用五味異功散數劑而元氣復一小兒小便不利鼻乾衄血鼻間色赤屬脾肺有熱用濟生犀角地黃湯前症已愈後頦間常赤作渴有痰此稟賦腎氣不足用地黃丸而諸症皆瘥一小兒發熱作渴用㵼黃散大便重墜口角流涎仍欲㵼火余曰鼻凖青白多而黃色少屬脾胃虛寒肝木所侮蓋口角流涎胃氣不能統攝也大便重墜脾氣不能上升也不信另用涼劑果有眉唇微動四肢微搐余曰此虛極而變慢脾風也用六君子加當歸木香炮薑鈎藤鈎二劑益甚意欲更劑余曰此藥力未及也設前藥不對其症禍在反掌矣仍以前藥加炮附子一片服之即安乃去附子又二劑調理而愈一小兒小便不利服五苓散之類不應頦間及左腮色赤乃肝腎虛熱用四物湯加山梔而愈後因感冒誤用發汗小便仍前不利余用補中益氣湯加麥門五味調補脾肺而愈一小兒小便不利及莖中澀痛或尿血石此稟父腎熱為患先用五淋散以疏導又用滋腎丸地黃丸補其肝腎漸愈出痘後小便短赤頦間石腮或赤或白屬肺腎氣虛而熱也用補中益氣湯六味地黃丸而痊一小兒印堂青黑至夜啼搐余謂脾土虛寒用鈎藤飲而安後因驚發搐夜啼用鈎藤飲前症頓止又用異功散而愈一小兒八嵗腹腫脹臍凸出大便下血糞亦似痢小水短少面目皆黃兩腮兼赤此食積傷脾又兼肝木所侮脾土蓋脾病則肺氣虛而不能生腎水矣故有是症當先消導其積滯遂用越鞠丸末加三稜蓬术三錢以淡薑湯調和入酒二匙服之腹中鳴動二便頓利再服二錢腹臍頓消却用大安丸末二錢腹臍全消便血亦止自進薄粥杯許腹中頓痞惡心吐痰不出此脾虛不能腐化而成痰滯也用六君子末二錢以薑湯和服調補胃氣飲食漸進但日晡熱倦腹中覺脹此脾虛故隂分而作用補中益氣湯而痊後復傷食發熱腹脹小便下血服保和丸四服而愈一小兒目內色青發搐目直上視呌哭不已或用牛黃清心丸不愈反咬牙頓悶小便遺泄此肝經血氣虛甚故耳余用補中益氣湯及六味地黃丸而痊一小兒發搐目劄屬肝膽經風熱先用柴胡清肝散以清其肝後用六味地黃丸以補其腎而痊一小兒眼胞微腫咳嗽惡心小便泔白余謂脾疳食積脾氣虛甚也以五味異功散為主佐以四味肥兒丸而愈後不禁飲食視物不眀余曰此脾胃復傷須補養為主不信乃服峻厲之劑後變風症竟為不起一小兒唇中青黃噯腐酸氣用平胃散一服宿滯頓化余云不必多藥但節其飲食自愈不信復傷食而噯腐另用尅滯之藥更加吐㵼以致不救惜夫一小兒傷食嘔吐服尅伐之藥嘔中見血用清熱涼血之藥又大便下血唇色白而或青問其故于余余曰此脾土虧損肝木所乘而然也令空心用補中益氣湯食逺用異功𣪚以調補中氣使涎血各歸其源而愈一小兒五嵗食粽後咬牙欲吐頃間腹脹昏憒鼻青黃赤此脾土傷而心肝所動食積發厥也先令雞翎探吐出酸物頓醒節其飲食勿藥而愈一小兒生旬日面目青黃此胎黃症妊娠胃熱也用㵼黃散乳調少許即愈後復身黃吐舌仍用前散而安一小兒四嵗發熱飲冷口內生瘡額鼻黃赤吐舌流涎余謂心脾有熱用導赤㵼黃二散而愈後復作余因他往用清熱化痰等藥前症益甚更㺯舌余用異功散加鈎藤鈎而安又用六君子湯而愈蓋吐舌者為脾經實熱而舌長出也㺯舌者乃脾臟虛熱也令舌時舒而即收也治者審之一小兒三嵗言步未能牙髮猶少體瘦骨立面赤作渴服肥兒丸不應余謂此腎虛疳症乃稟父精氣不足故也蓋肥兒丸脾胃經之藥也久服則腎益虛而疳益甚不信果牙髮漸落余用六味地黃丸加鹿茸五味子半載元氣健而諸症愈水鏡決云隂陽運合男女成形以分九竅四肢乃生五臟六腑部位各分逆順難眀若憑寸口之浮沉必乃橫亡于孩子須用虎口辨别三關消詳用藥必無差誤未至三嵗看虎口及三關若脈見風關初病則易治交氣關則難治交命關則病深死症又當辨其色如獸驚三關必青水驚三關必赤人驚三關必黑若紫色主㵼痢黃色是雷驚三關脈通度是極驚之症必死或青或紅有紋如線直者是母食傷脾左右一樣者是驚與積齊發紋有三條是肺生風痰或作齁䶎聲色青是傷寒主痰嗽色紅主㵼有黑相兼主下痢紅多者赤痢黑多者白痢有紫相兼虎口脈亂乃脾胃不和蓋脈紋見有五色由其病甚紋色更變至于純黑者不可得而治矣又當參辨脈形主之十三指形主症愚謂古人云小兒為芽兒如草之芽如水之漚然也蓋因臟腑脆嫩口不能言最難投劑是以首察面色而知其所屬次驗虎口以辨其所因矣然猶未足以盡病之證故余復注十三指形實為治法之簡便爾若流珠形者主飲食所傷內熱欲吐或腸鳴自痢煩躁啼哭用胃苓膏消飲食分隂陽若食既消而仍吐㵼腸鳴用香砂助胃膏溫補脾胃環珠形主脾虛停食胸膈脹滿煩渴發熱用五味異功散加山查枳實健脾消食後用六君子湯調養中氣長珠形主脾傷積滯肚腹作痛寒熱不食先用大安丸消其積滯次以五味異功散健其脾氣來蛇形主脾胃濕熱中脘不利乾嘔不食此疳邪內作用四味肥兒丸治疳用四君子補脾去蛇形主脾虛食積吐㵼煩渴氣短喘急不食困睡先用六君子湯加山查枳實健脾消積次以七味白术散調補胃氣弓反裏形主感冒寒邪哽氣出氣驚悸倦怠四肢稍冷小便赤色咳嗽吐涎先用惺惺散助胃氣祛外邪後以五味異功散加茯神當歸養心血助脾氣若外邪既解而驚悸肢冷乃脾氣尚虛宜七味白术散補之若悶亂氣粗喘促哽氣者難治肺虛甚也弓反外形主痰熱心神恍惚夾驚夾食或食癎風癎脾肺氣虛而風熱痰盛也先以天麻防風丸祛外邪又用五味異功散調中氣鎗形主風熱生痰發搐驚風先用抱龍丸如未應用牛黃清心丸若傳于脾肺或過用風痰之藥而見一切諸症者専調補脾胃其病自愈魚骨形主驚痰發熱先用抱龍丸如未應屬肝火實熱少用抑青丸隨用六味地黃丸或發熱少食或痰盛發搐乃木尅脾土也用六君子加柴胡調補脾土而制肝木水字形主驚風食積胸膈煩躁頓悶少食或夜啼痰盛口噤搐搦此脾胃虛弱飲食積滯肝木尅脾土也初患用大安丸消導飲食次以六君子湯加鈎藤鈎補中清肝若已服消食化痰等劑反傷元氣者用四君子加升麻柴胡鈎藤鈎以升補脾胃平制肝木針形主心肝熱極生風驚悸頓悶困倦不食痰盛搐搦先用抱龍丸祛風化痰次用六君子湯加鈎藤鈎平肝實脾透關射指主驚風痰熱聚於胸膈乃脾肺虧損痰邪乘聚先用牛黃清心丸清脾肺化痰涎次用六君子湯加桔梗山藥補脾土益肺金透關射甲主驚風脾土虧損肝木剋制之敗症急用六君子湯加木香鈎藤鈎官桂以溫脾土未應即加附子以回陽氣多得生者流珠只一點紅色環珠差大長珠圓長已上非謂圈子總皆紅脈貫氣之如此來蛇即是長珠散一頭大一頭尖去蛇亦如此分上下朝故曰來去角弓反張向裏為順向外為逆鎗形直上魚骨分開水字即三脈並行針形即過關一二粒米許射甲命脈向外透指命脈曲裏雖然余常治之亦有不専執其形脈而投劑者蓋但有是症即服是藥而已流珠形症一小兒發熱吐㵼腹脹不乳其紋如流珠此脾胃氣傷先用香砂助胃膏後用六君子湯全愈長珠形症一小兒寒熱作嘔飲食不入按其腹乃哭脈紋如長珠此飲食停滯也先用大安丸吐㵼宿滯遂安但唇目搐動大便稀黃此肝邪去而虛熱所迫也用六君子湯加鈎藤鈎而愈環珠形症一小兒胸腹膨脹發熱頓悶脈紋如環珠以手按腹即哭此屬脾胃虛而飲食停滯也先用保和丸一服前症如失更加煩渴按其腹不哭矣此宿食去而脾胃復傷也用五味異功散加柴胡治之頓瘳來蛇形症一小兒不時乾嘔乳食不進肚腹膨脹其形如來蛇此脾胃虛而成疳也用四味肥兒丸治疳佐以四君加蕪荑健中而痊後傷飲食吐㵼完榖形氣甚困四肢微搐視其紋如去蛇余曰且不用藥次日吐止但搐而㵼青黃此脾土虛而肝木勝用六君子加鈎藤鈎而瘥去蛇形症一小兒未及周嵗氣短喘急乳食少進時或吐乳視其形如去蛇乃脾傷而食積先用六君子加山查枳實漸愈後乳食復傷吐㵼作渴候二日不止與胃苓膏以治吐㵼七味白术散生胃氣而愈弓反外形症一小兒睡卧驚悸發熱痰盛脈形如弓之向外此因驚木旺傷脾而食不消也先以天麻防風丸祛風定驚後用五味異功散壯脾止搐而瘥弓反裏形症一小兒沉默昏倦肢冷驚悸其紋如弓之向裏此脾肺氣虛而外感寒邪也先用惺惺散以解外邪調胃氣諸症頓愈但手足逆冷又用六君子湯調補元氣而安鎗形症一小兒患咳嗽服牛黃清心丸加喘促腹脹余視其右臉赤脈紋形如鎗屬脾氣復傷用六君子湯頓安魚骨形症一小兒沉困發熱驚搐不乳視其脈紋如亂魚骨此風熱急驚之症也先用抱龍少許祛風化痰後用六君子湯加柴胡壯脾平肝而愈針形症一小兒咳嗽發熱右臉赤色作渴煩悶倦怠少食肚腹作脹脈紋如針此風邪傷肺而飲食傷脾也先用六君子湯加桔梗杏仁柴胡一劑諸症少愈後去杏仁柴胡再劑而安水字形症一小兒發熱夜啼乳食不進昏迷抽搐痰盛口禁脈紋如水字此脾肺氣虛風木所乘痰食積于胸腹也先用大安丸後用六君子加鈎藤鈎而痊透關射指形症一小兒發熱右臉赤咳嗽痰盛其脈紋透關射指余以為風邪藴結于肺而痰作用二陳湯加桑皮杏仁桔梗治之自用發散降火之劑風痰不退發勢益甚余曰此脾肺俱虛治失其宜遂用五味異功散加桔梗四劑漸愈又用六君子湯而痊透關射甲形症一小兒停食發熱服苓連三稜厚朴等劑飲食日少胸腹膨脹其紋透至指甲用補中益氣湯加木香鈎藤鈎溫補脾氣制肝木數劑漸效又用六君子湯加炮薑治之而安其泛用金石腦麝祛逐之劑變驚而歿者不能枚舉惜哉愚謂凡小兒在月內外者調補之藥每服亦不過二三匙若表散攻代之劑則每服只可匙許而已過多則反傷元氣餘當量大小虛實加減若乳母之疾致兒為患當治母為主子少服之後倣此錢氏㵼青丸治肝經實熱急驚抽搐羌活大黃煨川芎山梔仁炒龍膽草酒炒當歸防風各等分右為末煉蜜丸芡實大每服半丸煎竹葉湯入砂糖化下愚按前方足厥隂經解散肌邪疏通內熱之火也若大便祕結煩渴飲冷飲食如常者屬形病俱實宜用此以㵼之若大便調和煩渴飲冷屬病氣實而形氣虛宜用抑肝散平之若大便不實作渴飲湯飲食少思肢體倦怠者屬形病俱虛宜用地黃丸補之大抵前症若肝經血虛風熱先用四物湯加鈎藤鈎以生肝血繼用四君子湯以補脾土若因肝經血燥痰盛用地黃丸滋腎水生肝木四君子加芍藥實脾土生肺金若因肺金剋肝木用六君子湯加芍藥實脾土以平肺金若屢行攻伐而脾土虛寒者急服六君子湯加丁香補脾胃以培陽氣若因乳母恚怒肝火致兒為患者母服加味逍遙散子亦吮數滴錢氏地黃丸治肝疳白膜遮睛㵼血失音身瘦瘡疥又治腎怯不言解顱行遲等症一名六味地黃丸熟地八錢酒洗山茱茰肉乾山藥各四錢澤㵼牡丹皮白茯苓各三錢右為末用地黃膏量加米糊丸桐子大每服二三十丸空心白湯化下其地黃用生者自製杵膏愚按前丸治肝經血虛燥熱或腎經虛熱作渴小便淋祕痰氣上壅或風客淫氣患瘰癧結核或四肢發搐眼目瞤動或咳嗽吐血頭目眩暈或咽喉燥痛口舌瘡裂或自汗盜汗便血諸血或稟腎不足肢體瘦弱解顱失音或畏眀下竄五遲五軟腎疳肝疳或早近女色精血虧耗五臟齊損凡屬腎肝俱虗不足之症皆宜用此以滋化源其功不能盡述㵼白散治咳嗽痰喘面腫身熱甘草炒五錢地骨皮一兩桑根白皮炒黃一兩右為末每服一二錢入粳米百粒水煎愚按活人方云喘者肺氣盛而有餘然氣盛當認作氣衰有餘當認作不足蓋肺氣盛者肺中之火盛也有餘者肺中之邪有餘也其脈右寸必浮而有力右頰色赤前藥所以㵼之世之多不用人參蓋泥于肺熱還傷肺之説以致誤人多矣前症若乳母感冒風寒肺經藴熱致兒為患用十味參蘇飲若乳母膏梁醇酒積熱致兒為患用加味清胃散錢氏㵼黃散一名㵼脾散治脾熱吐舌藿香七錢石膏甘草炒各五錢防風二兩山梔仁炒一兩右蜜酒微炒為末每服一二錢水煎愚按前方治脾胃實熱之法也若作渴飲水肢體壯熱元氣無虧者宜用之若作渴飲熱㺯舌體溫元氣虛弱者宜五味異功散錢氏瀉心湯治心經實熱黃連右為末每服一錢臨卧溫湯調下愚按前症若仰面而卧呌哭發熱飲水或發抽搐屬心經實熱宜用前方若合面而睡驚悸上竄咬牙屬心經虛熱宜用導赤散若因乳母膏粱醇酒致兒發熱者用加味清胃散令母服子亦飲數滴錢氏益黃散一名補脾散治脾胃虛冷吐㵼陳皮一兩青皮五分訶子肉五分甘草炙五分丁香右為末每服二錢水煎愚按前症若脾土虛寒或寒水侮土而嘔吐泄㵼手足並冷或痰涎上湧睡而露睛不思乳食宜用此方若因脾土虛弱吐㵼者用六君湯加柴胡如不應或手足俱冷屬虛寒也更加木香炮薑若因乳母脾虛肝侮亦治以前藥若乳母鬱怒致兒患前症母服加味歸脾湯東垣人參安胃散治脾虛傷熱乳食嘔吐㵼痢人參一錢黃芪二錢生甘草炙甘草各五錢白芍藥七分白茯苓四分陳皮三分黃連炒二分右為末每服二錢水煎愚按東垣先生云益黃散內有丁香青皮辛熱蓋為寒水侮土而設也若因熱藥巴豆之類損其脾胃或因暑熱傷乳食而成吐㵼口鼻氣熱而致慢驚者宜服前方錢氏異功散治吐㵼不食凡虛冷症先與數服以正胃氣人參茯苓白术甘草炒陳皮各等分右為末每服二三錢薑棗水煎愚按前方治脾胃虛弱吐㵼不食或驚搐痰盛或睡而露睛手足指冷或脾肺虛弱咳嗽吐痰或虛熱上攻口舌生瘡㺯舌流涎若母有症致兒患此者母亦當服之十全丹治丁奚哺露青皮陳皮莪术煨川芎五靈脂白豆蔲檳榔蘆薈各五錢木香史君子蝦蟆炙各一錢右為末豬膽汁浸糕糊丸麻子大每服二十丸米飲下愚按湯氏云前症因乳哺不調傷損脾胃不思飲食氣血日損四肢日瘦肚腹漸大是名丁奚呼吸少氣汲汲苦熱謂之哺露屬形病俱虛治以前藥宜佐以異功散壯脾胃以行藥勢庶可得效也平胃散治乳食過傷腹鳴嘔吐或米榖不化厚朴薑汁製陳皮各三兩甘草炙二兩蒼术米泔浸五兩右為末每服二錢薑湯調愚按前方若乳食停滯噯腐吞酸嘔噦惡心者宜服是方若飲食既消脾胃虛弱嘔吐惡心者宜用四君子湯四君子湯治脾氣虗損吐㵼少食人參白术茯苓甘草各等分右每服二錢薑棗水煎愚按前方若脾胃虛弱或因尅伐之劑致飲食少思或食而難化或欲作嘔或大便不實者尤宜用之若兼痰嗽氣逆肢體倦怠面目浮腫宜六君子湯六君子湯即四君子加陳皮半夏治脾胃氣虛吐㵼不食肌肉消瘦或肺虛痰嗽喘促惡寒或肝虛驚搐眩暈自汗諸症並宜服此以滋化源二陳湯治脾虛中脘停痰嘔吐惡心半夏炮陳皮各五錢茯苓二錢甘草炙一錢右每服二錢薑水煎愚按前方若脾虛痰飲嘔吐惡心用之良驗若因飲食傷胃所致宜用六君子湯調補中氣胃苓湯為末蜜丸名胃苓膏治腸胃受濕嘔吐泄㵼白术茯苓澤㵼厚朴豬苓陳皮甘草各等分桂少許右為末每服二錢薑水燈心陳皮煎湯調愚按前方若停食吐㵼小便短少腹脹作痛宜用此以分利之更用六君子湯以調補脾胃釣藤飲子治一切驚風潮搐目視昏迷獨活防風天竺黃羌活川芎各三錢升麻麻黃草龍膽甘草炙各二錢釣藤鈎三錢蟬殼五個去翅足右為末每服二錢水煎愚按前方若外感風邪形病俱實者宜用之若形氣虗而病氣實者宜用惺惺散加釣藤麻黃若外邪既去而形病俱虗者宜用異功散肥兒丸治肝疳食積肢體消瘦二便不調檳榔二十個黃連神麯木香各一兩五錢麥芽炒四兩史君子酒浸去皮四兩肉豆蔲二兩煨右為末神麯糊丸麻子大每服二三十丸米飲下愚按前方若食積五疳發熱口渴大便不調小便不清或頸項結核髮稀成穗寒熱作渴宜用之若脾胃稍虛者用五味異功散兼服虗甚者異功散為主佐以前藥濟生犀角地黃湯治肺胃鬱熱衄血吐血生地黃五分犀角鎊赤芍藥牡丹皮各一錢右水煎服如無犀角暫以升麻代之愚按前方若肝脾虛熱吐血衄血便血或發熱作渴大便祕小便赤宜用之若熱既退而渴血未止或日晡益甚者隂血虗也四物湯加參术主之若熱既退而飲食少思肢體倦怠者胃氣虛也四君子加當歸主之徐氏惺惺散治外感風寒鼻塞痰嗽身體發熱桔梗細辛人參白术甘草炙瓜蔞根白茯苓各等分右為末每服二錢入薄荷五葉水煎愚按前方若感寒邪時氣風熱痰壅咳嗽或抽搐瘈瘲痰氣喘促用之若外邪解而病益甚或更兼他症但調補元氣徐氏加減抱龍丸治風痰咳嗽去天麻即錢氏抱龍丸雄黃辰砂各二錢天竺黃四錢麝香五分天麻六錢牛膽南星八錢右為末煮甘草糊丸皂角子大三嵗一丸薄荷湯下愚按前方若風熱痰嗽或急驚發搐昏睡咬牙形病俱實宜用此方若初冒風寒咳嗽痰盛氣喘者屬客邪內作也先用十味參蘇飲若邪既解而腹脹吐㵼或發搐咬牙睡而露睛屬脾肺氣虗也用五味異功散切忌祛痰表散若過服而致前症者尤宜溫補脾肺十味參蘇飲治感冒發熱頭疼傷風咳嗽傷寒痰飲凝滯人參紫蘇各八分茯苓陳皮半夏前胡枳殼麩炒葛根桔梗炒各六分木香五分甘草炒五分右每服二三錢薑水煎愚按前方雖有參苓補氣而表散之味或多若病久元氣虗弱者以六君子加桔梗乾葛補而散若因感外邪而喘嗽腹脹或飲食少思大便不實者此脾肺之氣虗也必用六君子之類庶無誤矣祕旨安神丸治發熱驚啼頰赤壯熱牙硝白茯苓乾山藥麥門冬去心焙寒水石煆甘草各五錢硃砂一兩龍腦二分半右為末煉蜜丸芡實大每服半丸滚湯化下愚按前方若口舌生瘡吐舌飲水發熱驚搐啼哭煩噪面赤屬心經實熱宜用此㵼之若目劄搐搦面青寒熱屬肝經風熱用六味地黃丸若惡寒飲湯屬脾氣虗弱用異功散若前症益甚兼手足並冷睡而露睛屬脾胃虛寒用六君子加木香炮薑補之四物湯治肝脾血虛發熱驚搐瘰癧丹毒當歸川芎各一錢芍藥熟地黃各七分右水煎服愚按前方若血虗發熱或因尅伐或因久病致晡熱內熱或煩躁不安皆宜服之經又云血生于脾若脾虛不能生血者宜用四君子加當歸酒炒白芍以補脾白术散治積痛和胃氣生津液人參白术藿香葉木香甘草白茯苓各一兩乾葛二兩右每服二錢水煎愚按前方若脾胃氣虗作渴飲湯或因吐㵼津液虧損煩渴引飲或脾胃虛弱腹脹㵼渴㺯舌流涎手足指冷宜服之以溫補脾氣化生津液人參平肺散治心火刑尅肺金咳嗽發熱口渴痰盛入參陳皮地骨皮茯苓甘草各一錢五味杵炒四分知母炒七分桑白皮炒一錢青皮天門冬去心各四分右水煎服愚按前方若心火尅肺傳為肺痿咳嗽喘嘔痰涎壅盛胸膈痞滿咽嗌不利宜用之若因肝木太過而致當補肺金若因腎水不足當補脾肺若因心火旺而自病當利小便黃芩清肺飲治肺火燥熱口渴便祕黃芩炒二錢梔子三個杵碎炒右水煎服愚按前方治肺經隂虛火燥而小便不通若因脾經有熱當清其脾若因心火尅肺當制其心滋腎丸治稟父腎虛火燥小便祕赤黃柏酒炒知母酒炒各一兩肉桂二錢右為末丸桐子大每服百丸空心白滚湯下愚按前方若稟父腎虛發熱便赤或足熱腿軟熱在下焦血分最宜此藥如不應或脾肺燥熱所致並宜六味丸以滋其化源清胃散治胃火牙痛或連頭面升麻五分生地黃牡丹皮黃連炒當歸各三分右水煎服愚按前方治脾胃實火作渴口舌生瘡或唇口腫痛齒齦潰爛焮連頭面或惡寒發熱或重舌馬牙吐舌流涎之類子母並宜服若因胃氣虛弱或因寒涼尅伐胃氣虛熱而口舌生瘡或㺯舌發熱飲食少思或嘔吐困睡大便不實流涎齦爛者用五味異功散補中益氣湯治中氣虛弱體疲食少或發熱煩渴等症人參黃芪各八分白术炙甘草陳皮各五分升麻柴胡各二分當歸一錢右薑棗水煎空心午前服愚按前方若因藥尅伐元氣虗損惡寒發熱肢體倦怠飲食少思或兼飲食勞倦頭痛身熱煩躁作渴脈洪大弦虛或微細軟弱右關寸獨甚亦宜用之大凡久病或過服尅伐之劑虧損元氣而諸症悉具者最宜前湯調補若母有前症致兒為患者尤宜用之天麻防風丸治驚風身熱喘粗多睡驚悸手足搐掣天麻防風人參各三兩蝎尾去毒半兩甘草硃砂雄黃各一錢半牛黃一錢麝香五分殭蠶炒一錢半右為末煉蜜丸櫻桃大朱砂為衣每一丸薄荷湯下愚按前方若因外邪所感風痰壅盛而患急驚者宜用此藥驅散之若因肝脾氣虛風痰壅盛而患似前症用異功散調補之若因脾氣虛肝木所乘而患慢驚者宜用異功散加薑桂溫補之不應急加附子五淋散治膀胱有熱水道不通或小腹腫脹者赤茯苓赤芍各五分山梔炒當歸各三分甘草二分右用燈心十莖水煎服愚按前方果因積熱壅滯而小便不通者宜用是藥治之若過用寒涼損其陽氣而不能化生者用四君子以滋脾肺若稟賦足三隂虛損而患前症者宜用六味地黃丸加車前子補而通之未應更加牛膝最忌踈導消積丸治食積面黃大便酸臭砂仁十二箇丁香九箇烏梅三個巴豆二粒去油取霜右為末糊丸黍米大每服二三丸溫水下愚按前方溫胃消導之若食積既去重劑而脾氣虧損發熱作渴肢體倦怠飲食少思者當參前五味異功七味白术二方按法主治溫脾散治脾氣虛寒口角流涎半夏麯丁香木香各一兩乾薑炮白术陳皮各半兩右為末每服二錢米湯調愚按前方溫補脾胃之良劑若口渴飲熱肢體倦怠而流涎者宜用異功散加炮薑若肢體發熱作渴飲水而流涎者宜用㵼黃散保和丸治飲食停滯胸膈痞滿噯氣吞酸或吐㵼腹痛加白术即大安丸神麯炒山查半夏茯苓各一兩陳皮連翹蘿蔔子炒各五錢右為末粥丸桐子大每服二三十丸白湯送下愚按前方行氣尅滯之劑若元氣未虧暴停乳食而致斯症者宜用此消導之若元氣虗弱而乳食所傷者必調補胃氣為主而佐以消導若乳食已消而作嘔者乃胃氣被傷當用異功散補之不宜仍用前藥重損胃氣治者審之助胃膏治脾胃虗寒吐㵼等症人參白术炒白茯苓甘草炙丁香各五錢砂仁四十箇木香三錢白豆蔲十四箇乾山藥一兩肉豆蔲四箇煨右為末蜜丸芡實大每服十丸米飲化下愚按前症若吐㵼酸穢是乳食內停也宜用保和丸以消導之若吐㵼乳食難化是脾胃虗弱也用異功散以調補之若吐㵼少食腹痛惡心脾胃俱虗也用六君子加木香以培補若睡而露睛手足並冷或寒戰咬牙脾胃虛寒也用六君子加木香炮薑以溫補如不應宜急加附子以回陽牛黃丸治風癎昏悶抽搐潮熱牛黃膽製全蝎蟬蛻各二錢半防風白附子天麻殭蠶炒各錢半麝香少許右為末煮棗肉杵丸菉豆大煎荆芥生薑湯下愚按前方兼治風痰咳嗽喘促發熱驚悸不寧實祛風化痰散氣之藥審有是症而用之其功效如形響也若脾肺氣虛而痰涎壅盛肝脾血虗而驚癎抽搐必當以固本為主不可泛用恐虗其虛而益其患也治者慎之柴胡飲子治一切肌熱積熱或汗後餘熱即宣眀柴胡飲子黃芩炒甘草大黃炒芍藥炒柴胡人參當歸各等分右薑水煎服愚按前方若腸胃壅滯大便祕結作渴飲水表裏實熱者用之若汗後發熱屬血虛氣無所附而浮于外切不可用治者審焉歸脾湯治脾血虧損健忘驚悸等症人參黃茋茯神去木各一錢甘草炒五分白术炒一錢木香五分逺志去心酸棗仁炒龍眼肉當歸各一錢右水煎服愚按前方若乳母憂思傷脾血虛發熱食少體倦或脾不能攝血以致妄行吐下或健忘怔忡驚悸少寐或心脾作痛自汗盜汗或肢體腫痛大便不調或經候不凖晡熱內熱或繭唇流注等症致兒為患者用之令子母俱服八味地黃丸即六味地黃丸加肉桂附子各一兩愚按前方治稟賦命門火衰不能生土以致脾土虛寒或飲食少思或食而不化臍腹疼痛夜多漩溺等症經云益火之源以消隂翳此之謂也或乳母命門火衰兒飲其乳致前症者子母並宜服之加減八味丸即六味地黃丸加肉桂一兩五味子四兩愚按前方治稟父腎隂不足或吐㵼久病津液虧損口乾作渴或口舌生瘡兩足發熱或痰氣上湧或手足厥冷等症八珍湯即前四君四物二湯合方也愚按前方治氣血俱虛隂火內熱或因尅伐之劑脾胃虧損肌肉消瘦等症十全大補湯即八珍湯加黃茋肉桂愚按前方治氣血虛弱或稟賦不足寒熱自汗食減體瘦發熱作渴頭痛眩暈最宜用之加味逍遙散去牡丹皮山梔名逍遙散治肝脾血虛等症當歸甘草炙芍藥酒炒茯苓白术炒柴胡各一錢牡丹皮山梔炒各七分右水煎服愚按前方若乳母肝脾血虗內熱或遍身搔癢寒熱或肢體作痛頭目昏重或怔忡頰赤口燥咽乾或發熱盜汗食少不寐或口舌生瘡耳內作痛或胸乳腹脹小便不利致兒為患尤宜用之九味龍膽㵼肝湯治肝經濕熱或囊癰下疳便毒小便澀滯或隂囊作痛小便短少愚製車前子炒木通當歸尾澤㵼各五分甘草黃芩炒生地黃山梔各三分龍膽草酒炒五分右水煎服即龍膽㵼肝湯抑肝散治肝經虛熱發搐或發熱咬牙或驚悸寒熱或木乘土而嘔吐痰涎腹脹少食睡卧不安愚製軟柴胡甘草各五分川芎八分當歸白术炒茯苓鈎藤鈎各一錢右水煎子母同服梔子清肝散一名柴胡梔子散治三焦及足少陽經風熱耳內作癢生瘡或出水疼痛或胸乳間作痛寒熱往來愚製柴胡梔子炒丹皮各一錢茯苓川芎芍藥當歸牛蒡子炒各七分甘草三分右水煎服若太陽頭痛加羌活柴胡清肝散治鬢疽及肝膽三焦風熱怒火之症或項胸作痛瘡毒發熱愚製柴胡一錢半黃芩炒人參川芎各一錢山梔炒一錢半連翹甘草各五分桔梗八分右水煎服小柴胡湯加山梔牡丹皮名加味小柴胡治傷寒溫熱身熱惡風頭疼項強四肢煩疼往來寒熱嘔噦痰實中暑瘧疾並服之閻注柴胡二錢黃芩炒一錢半人參半夏各七分甘草炙五分右薑水煎服愚按前方若肝膽經風熱肝火瘰癧寒熱往來日晡發熱潮熱身熱不欲飲食或怒火口苦耳聾咳嗽或脅痛胠滿小便不利或㵼泄吐酸苦水或肢體搐動唇目抽劄並宜用之砭法治丹毒疔瘡紅絲走散或時毒瘀血壅盛或色赤走散用細磁器擊碎取有鋒芒者以筯劈開頭夾之麻線纒定兩指輕撮筋稍令磁芒正對患處懸寸許再用筯頻擊之令毒血遇刺即出凡毒血凝滯于外真氣不能勝散者急用此法以去之否則為害甚矣蕪荑散治蟲動腹痛白蕪荑炒乾漆炒煙盡各等分右為未每服三五分發時米飲調下愚按前症乃臟腑虗弱或胃冷胃熱而動往來攻心作痛呌哭仰身揮手心神悶亂吐涎沫或清水肌瘦沉默皆其症也保生方云蛔蟲乃九蟲之一人腹中皆有之其外症腹上青筋惡心吐水面無正色唇緩而白目無睛光若蟲食上部則上唇內有白點蟲食下部則下唇內有白點腹中諸蟲朔日後其頭向上望日後其頭向下如急于用藥先以肉物近兒烹炙使聞香味蟲頭亦向上則藥易效調中丸治泄㵼青白腹痛腸鳴嘔吐酸水不思乳食人參甘草炒白术炒各五錢乾薑四錢炒右為末薑汁麵糊丸菉豆大每服二三十丸米飲下愚按前方一名溫中丸即人參理中丸也若腎水侮土而虛寒者加半夏茯苓陳皮或嘔吐更加藿香泄㵼加木香香連丸治諸痢并水㵼黃連二十兩淨吳茱茰十兩淨木香右將前二味用熱水拌和入磁器內置熱湯中同炒黃連至紫色去茱茰用黃連為末每末四兩入木香末一兩和勻淡醋糊丸黍米大每服二十丸白湯下朱砂安神丸治心疳及怔忡心下煩躁朱砂四錢黃連五錢生地五錢杵膏生甘草二錢五分右為末用米糊丸黍米大每服十丸白湯下人參補肺湯治肺症因腎水不足虛火上炎咳吐膿血發熱作渴小便不利人參黃茋白术茯苓陳皮當歸山茱茰肉山藥五味子杵炒麥門冬甘草炒各五分熟地黃牡丹皮一錢右作二三服水煎補肝散治肝經氣虗吐血矢血或兩脅脹滿筋急面青小腹脹痛或兩目不眀不時呌噉山茱茰肉當歸五味子杵炒山藥黃茋炒川芎木瓜各五錢熟地黃白术各二錢獨活酸棗仁炒各一錢右為末每服一錢水煎越鞠丸治乳母六鬱傳兒為患或胸滿吐酸齒痛瘡疥等症蒼术神麯炒香附子山查山梔炒撫芎麥芽炒各等分右為末水調神麯糊丸桐子大每服二三十丸白滚湯下子母並服麥門冬散治脾肺氣虛有熱吐血衄血久不愈者麥門冬黃茋炒一兩當歸人參生地黃各五錢五味子杵炒十粒右分五服水煎楊氏十全丹治丁奚哺露説見前十全丹下檳榔枳殼麩炒青皮陳皮三稜煨蓬术砂仁各一兩半丁香二錢半木香二錢香附一兩右為末神麯糊丸黍米大每服二十丸米飲下四味肥兒丸一名小肥兒丸治食積脾疳目生雲翳或兩耳出膿或口舌生瘡牙根腐爛身瘦生瘡或小便澄白腹大筋青一切疳症黃連炒蕪荑炒神麯麥牙炒各等分右為末水糊丸桐子大每服一二十丸空心白滚湯下蟾蜍丸治無辜疳症一服虛熱退二服煩渴止三服㵼痢愈蟾蜍一枚夏月溝渠中取腹大不跳不鳴身多㿔者右取糞蛆一杓置桶中以尿浸之却將蟾蜍跌死投與蛆食一晝夜用布袋盛蛆置急流中一宿取出瓦上焙乾為末入麝香少許粳米飯丸麻子大每服二三十丸米飲下其效如神栁華散治熱毒口瘡黃柏炒蒲黃青黛真正者人中白煆各等分右為末敷之抱龍丸治傷風溫疫身熱昏睡風熱痰實壅嗽又治驚風潮抽及蠱毒中暑雄黃二錢五分辰砂另研五錢天竺黃一兩牛膽南星四兩麝香五分另研右為末煎甘草膏丸芡實大每服一丸白湯化下愚按前方化痰祛邪清熱之功居多屬肝心實熱而致者用之殊效若脾肺虛熱而見昏睡痰嗽當用寶鑑天麻散調補元氣製附子法附子重一兩三四錢有蓮花瓣頭圓底平者先備童便五六碗將附子放在竈上炙良久乘熱投童便中浸五七日候潤透揭去皮切四塊仍浸二三日用粗紙數層包之浸濕埋灰火半日取出切片檢有白星者瓦上炙至無白星為度如急用即切大片用童便煮二三沸熱瓦熟用之薛氏醫案卷六
