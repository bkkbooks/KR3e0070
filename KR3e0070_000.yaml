body:
  text: 薛氏醫案醫家類提要臣等謹案薛氏醫案七十七卷明薛巳撰己字立齋吳縣人是書凡十六種己所自著者為內科摘要二卷女科撮要二卷保嬰粹要一卷保嬰金鏡録一卷原機啓微三卷口齒類要一卷正體類要二卷外科樞要四卷癘瘍機要三卷其訂定舊本附以己説者為王履明醫雜著六卷陳自明婦人良方二十三卷敖氏傷寒金鏡録一卷錢氏小兒直訣四卷其父鎧保嬰撮要二十卷又陳自明外科精要三卷陳文仲小兒痘疹方論一卷初刻於秀水沈氏板已殘缺天啓丁卯朱明為重刻之舊有明紀事一篇載明病困時夢已教以方藥服之得愈又夢已求刻此書其事甚怪然精神所注魂魄是憑固亦理之所有不妨存其説也己本瘍醫後乃以內科得名其老也竟以瘍卒詬之者以為溫補之弊終於自戕然已治病務求本原用八味丸六味丸直補真陽真隂以滋化源實自己發之其治病多用古方而出入加減具有至理多在一味間見神明變化之妙厥後趙獻可作醫貫執其成法遂以八味丸六味丸通治各病甚至以六味丸治傷寒之渴膠柱鼓瑟流弊遂多徐大椿作醫貫砭因併集矢於薛氏其實非己本旨不得以李斯之故歸罪荀卿也世所行者别有一本益以十四經發揮諸書實非己所著亦非己所校蓋坊賈務新耳目濫為增入猶之東垣十書河間六書泛收他家所作以足卷帙固不及此本所載皆已原書矣乾隆四十四年三月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:1600500aa0e58bfcde4cbbdd84bc7a01de02e6837e49f6ccd1b1b7c1c11645cd
