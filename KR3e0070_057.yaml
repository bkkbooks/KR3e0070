body:
  text: 薛氏醫案卷五十七明薛已訂保嬰撮要四風熱風症中風之症西北方有之東南氣温腠理疏泄人患之者皆類中風也况小兒元氣未充皮毛不固易虗易實外邪乗之則壯熱抽掣氣粗涎涌甚至昏憒口噤即似中風悞以續命等湯投之多至不救大人且無真中况小兒乎凡有前症當辨其因若陽明經氣虗風邪所乗筋脉拘急者為外因足厥隂肝火熾盛筋脉偏急者為内因脾肺虚弱腠理不宻外邪乗入或驚風過服金石之劑耗損肝血或吐瀉後内亾津液不能養肝致口眼喎斜者皆肝血不足肝火生風之類中風之類症也治騐方藥散見各症痙症發痙之症因傷風汗出悞發汗或濕症汗多所致若項背強直腰背反張揺頭掣瘲噤口不語發熱腹痛病在足太陽也若靣目赤色無汗惡寒牙闗𦂳急肢體反張痰涎壅盛昏憒煩渴小便赤澁先譫語而發者名剛痙當發汗若大便滑泄不語不渇有汗而不惡寒先手足厥冷而發者名柔痙並以小續命湯加减主之剛痙去附子用麻黄柔痙用附子去麻黄若壯熱譫語口乾手足微寒大便滑泄此兼剛柔無汗用葛根湯有汗用桂枝加葛根湯若痰塞氣盛用南星半夏茯苓以消痰枳實陳皮紫蘇以順氣更審其熱輕者用敗毒散熱盛者用小柴胡湯壯熱有汗胸滿口噤咬牙便閉為内熱以大承氣湯下之後用大柴胡湯解之過三日則難治此皆治六淫外傷元氣形病俱實之法也若小兒多因驚駭停食或乳母六淫七情飲食起居失宜所致更當審之兼治其母大要因驚目直呵欠項強頓悶属肝經實熱用抑肝散咬牙呵欠手尋衣領属肝經虚熱用地黄丸若肺金不能平木用異攻散脾不能養肝用六君子湯水不能生木用地黄丸治驗一小兒感冐發熱咳嗽咬牙余以為脾肺氣虚不信乃用解散之藥果項強口噤汗出不止手足並冷遂用五味異攻散加柴胡木香治之漸愈但日晡㣲熱睡而露睛用補中益氣湯而痊一小兒因驚發熱誤行表散出汗靣白日晡發痙先兄謂脾肺氣虚而肝膽邪盛以六君子加柴胡升麻治之乃發於寅卯時此肝邪自旺也用加味逍遥散一劑其熱頓退又用補中益氣湯六味地黄丸而愈一小兒患瘰􅐇潰而發痙頓悶咬牙寒熱此屬肝經風熱先用柴胡梔子散一劑寒熱頓止次用四物參茋白术柴胡漸止又用補中益氣湯加芍藥茯苓而痊一小兒頭患瘡潰而發痙或寒熱作渇或手足厥冷其脉洪大浮緩按之皆微細此元氣虚而邪氣實也用十全大補湯加柴胡山梔數劑諸症漸退而胍漸歛又十餘劑而愈一小兒驚風服抱龍丸保生錠吐涎甚多又汗出發痙仍欲袪痰余曰此肝脾血虗而内生風耳吐痰不止脾肺氣虚不能攝涎也汗出發痙脾肺氣虚而亾陽也用六君子湯加炮薑木香頓愈又用四君子加歸茋而安一小兒傷風發熱服解散之藥汗出不止痓症悉具其脉洪大鼓指按之微細此汗多亾陽脾肺氣虚之症也用異功散加芎歸黄茋其汗頓止又用補中益氣湯而痊一小兒停食腹痛發熱嘔吐服峻厲之劑更吐瀉汗多手足並冷發痙不止其脈浮洪按之如絲用六君子湯加升麻炮薑痙痓頓已惟寒熱徃来又用四君升麻柴胡而愈少叅王陽湖孫女年八嵗發痙服降火消導之劑其脉浮洪寒熱如瘧余用四君子加升麻柴胡炮薑鈎藤鈎及補中益氣湯間服漸愈但脇下作痛去炮薑加木香肉桂而痊一小兒因乳母大怒發熱脇痛亦患前症兼汗出作嘔先用小柴胡湯一劑子母俱服頓愈但日晡潮熱以異功散加升麻柴胡治之並愈一小兒因乳母發熱吐瀉一小兒因乳母食厥昏憒同患前症各治其母而子悉愈桂枝加乾葛湯治頭疼項背強几几汗出惡風者桂枝芍藥甘草葛根四錢右每服二錢薑棗水煎小柴胡湯治身熱惡寒風痙項強直急胸脇滿痛嘔噦煩渇寒熱徃來或身靣皆黄小便不利大便秘澁或驚過不解潮熱不除及差後勞復發熱疼痛如瘧發作有時方見肝臟加味小柴胡湯即小柴胡加山梔牡丹皮保生錠子治慢驚尚有陽症全蝎白附子炮殭蠶牛膽南星蟬蛻琥珀辰砂各一錢麝香五分防風一錢右為末糊搜和揑成錠子金銀箔為衣用薄荷湯磨服大柴胡湯治表裏熱大便秘澁胸滿脇痛柴胡枳實各二兩二錢半夏一兩五錢赤芍藥一兩八錢黄芩二兩大黄三兩七錢五分右生薑紅棗煎不拘時服小續命湯方見五硬抑肝散方見肝臟地黄丸方見腎臟敗毒散方見發熱六君子湯五味異功散二方見内釣補中益氣湯方見虚羸加味逍遥散方見内釣柴胡梔子散方見發熱四物湯方見急驚十全大補湯八珍湯加黄茋肉桂即四君四物二湯合用抱龍丸方見傷寒四君子湯方見内釣大承氣湯治剛痙胸滿内實口噤咬牙大熱發渇大便秘澁大黄芒硝各五錢厚朴一兩枳實葛根湯治太陽病項強几几惡風無汗及惡寒剛痙葛根四兩麻黄三錢桂枝一兩右每服二錢水煎夜啼夜啼有二曰脾寒曰心熱也夜屬隂隂勝則脾臟之寒愈盛脾為至隂喜温而惡寒寒則腹中作痛故曲腰而啼其候靣青白手腹俱冷不思乳食是也亦曰胎寒用鈎藤散若見燈愈啼者心熱也心屬火見燈則煩熱内生兩陽相摶故仰身而啼其候靣赤手腹俱緩口中氣熱是也用導赤散若靣色白黑睛少屬腎氣不足至夜隂虚而啼也宜用六味丸若兼泄瀉不乳脾腎虚弱也用六神散若兼吐瀉少食脾胃虚寒也用六君炮木香大便不化食少腹脹脾氣虚弱也用異功散心血不足者秘㫖安神丸木火相摶者柴胡梔子散肝血不足者地黄丸大抵此症或因吐瀉内亾津液或禀父腎隂不足不能滋養肝木或乳母恚怒肝火侮金當用六君子湯補脾土以生肺金地黄丸壯腎水以滋肝木若乳母鬰悶而致者用加味歸脾湯乳母暴怒者加味小柴胡湯乳母心肝熱摶柴胡梔子散仍宜叅客忤驚啼覽之治驗一小兒發熱夜啼乳食不進昏迷抽搐痰盛口噤此脾肺氣虚風木所乗痰食積於胸腹也先用大安丸後用六君釣藤鈎而痊一小兒三嵗靣白夜啼小便青而數此肺腎虚弱朝用補中益氣湯加肉桂一分夕用地黄丸而愈大凡小兒靣色青黑睛少或解顱足熱者出痘多在腎經預用地黄丸補腎氣多得無恙者一小兒二嵗夜啼面色赤黑睛色淡小便頻赤朝用補中益氣湯加山藥五味夕用地黄丸而愈龍齒散治抅哭肚疼驚熱龍齒蟬脫釣藤鈎羌活茯苓各等分右為末每服一錢水煎服碧雲散治渾身壯熱夜啼栢葉二分南星殭蠶全蝎鬰金雄黄各一錢右為末每服一字用薄荷湯入蜜調服六神散治腹痛靣色青口中氣冷及四肢俱冷曲腰而啼或泄瀉不乳人參山藥白术各五錢甘草炒二錢茯苓扁豆炒各一兩右為末每服二錢薑二片棗水煎一方有芍藥當歸人參各二錢五分甘草桔梗陳皮桂各一錢愚按前症悉屬脾土虚寒元氣下陷本方更加柴胡升麻升提元氣而補脾土為善神緑散全蝎去足翅不拘多少青薄荷焙乾右為末每服五分薄荷湯調下無擇燈花散治心燥夜啼燈花三二顆右研細用燈草煎湯調塗口中乳汁送下日三服一法用燈花塗乳上令兒吮之無燈花用燈草燒灰辰砂少許亦妙或用燈花七枚鵬砂一字辰砂少許蜜調塗唇上立安安神散治夜啼蟬蛻四十九枚只用後半叚截去前半叚并去足翅右為末分四服用釣藤鈎湯調下人參黄連散治心經藴熱夜啼人參二錢半黄連一錢半炒炙甘草五分竹葉二十片右薑水煎服太乙丹治睡驚夜啼青糞桔梗一兩五錢藿香葉五錢川芎二錢五分白芷二錢白扁豆五錢炒右為末煉蜜丸櫻桃大辰砂麝香為衣每服半丸薄荷湯磨下糞色青棗湯下夜啼燈心釣藤湯下加白术茯苓白芍藥尤妙地黄散治身熱口乾咳𠻳心煩生地黄半兩麥門冬去心七錢杏仁炮去皮尖欵冬花陳皮各三錢甘草炙二錢半右為末每服二三錢水煎温服釣藤散方見慢驚導赤散方見心臟地黄丸方見腎臟六君子湯五味異功散二方見内釣秘㫖安神丸方見發搐即十味安神丸柴胡梔子散方見諸熱症即柴胡清肝散加味歸脾湯方見内釣小柴胡湯方見痙症大安丸即保和丸加白术方見内釣補中益氣湯方見虚羸悲哭悲哭者肺之聲淚者肝之液也若六脉弦𦂳者先以温湯漬其身取汗次以凉隔散之類清其内熱此張子和治法如此若因乳母怒火遺熱於肝肝火炎熾反侮肺金金木相擊故悲哭有聲者宜用六君柴胡山梔以補脾清肝用六味丸以壯水生木有因驚風過服袪風燥血之藥而致者有因吐瀉内亾津液而致者及禀父腎隂不足不能生肝者治各審之若小兒忽然大呌作聲者不治此禀腎隂不足虚火炎上故也用六味丸多有生者仍叅覽夜啼客忤驚啼重舌口瘡天釣内釣等症治騐一小兒每忽哭白睛多每悲靣色赤余謂禀賦腎虚火妄動而然也用地黄丸半載後雖哭而靣色不赤諸症皆愈一週嵗兒痰嗽哭不已用抱龍丸少止良乆亦然余視其右顋潔白左顋青赤此肺肝二經相擊而作先用瀉白散袪肺邪次用柴胡梔子散平肝木後用地黄丸滋腎水而痊一小兒瘈瘲啼呌額間青黑此驚風肝木乗脾腹中作痛也先用六君子湯加木香柴胡釣藤鈎啼呌漸緩更加當歸又二劑而安一小兒發熱夜啼乳食不進昏迷抽搐痰盛口噤脉紋如水字此脾肺氣虚風木所乗痰食積於胸腹也先用大安丸後用六君子加釣藤鈎而痊凉膈散方見瘡瘍防風通聖散方見風症六君子湯方見内釣六味地黄丸方見腎臟抱龍丸方見傷寒瀉白散方見肺臟柴胡梔子散方見發熱大安丸即保和丸加白术方見内釣胎症小兒胎症謂胎熱胎寒胎黄胎肥胎弱是也胎熱者初生旬日之間目閉色赤眼胞腫啼呌驚煩壯熱溺黄此在胎中受熱及膏粱内藴宜用清胃散之類胎寒者初生百日内或手足攣屈或口噤不開此在胎母過食生冷或感寒氣宜用五味異功散之類胎黄者體目俱黄小便秘澁不乳啼呌或腹膨泄瀉此在胎母過食炙煿辛辣致生濕熱宜用生地黄湯之類熱盛者瀉黄散之類胎肥者肌肉禀厚遍身血色彌月後漸瘦五心煩熱大便不利口吻流涎此受母胃熱所致也乳母服大連翹飲兒用浴體法以疏通其腠理胎弱者靣無精光肌體瘦薄身無血色大便白水時時哽氣目無精神亦宜用浴體法消風散治諸風上攻頭目昏眩項背拘急肢體煩疼肌肉顫動耳若蟬鳴鼻塞多嚏皮膚頑麻瘙痒癮疹目澁昏困白茯苓芎藭羌活荆芥穂防風藿香葉蟬蛻微炒白殭蠶炒去絲嘴甘草陳皮炒厚朴去皮薑汁製右為末每服五分茶清或薄荷湯調下荆芥湯亦可生地黄湯治姙娠食酒麵五辛積熱小兒生下遍體靣目皆黄也乳母仍忌酒麵五辛等物生地黄芍藥川芎當歸各等分右每服五錢水煎産婦服仍滴兒口數滴大連翹飲方見噤風撮口瀉黄散方見脾臟清胃散異功散二方見内釣浴體法方見發搐解顱𩕄塡𩕄陷錢仲陽云小兒解顱或久不合者因腎氣有虧腦髓不足故兒多愁少喜目睛多白而身瘦盖人乏腦髓如木無根有數嵗而成廢人者服錢氏地黄丸更用南星微炮為末米醋調傳緋帛烘熱貼之其栢子仁散三辛散封𩕄散俱效夫腎主骨腎氣實則腦髓充而𩕄早合骨脉盛而齒早生腎氣怯則腦髓虚而𩕄不合此由父母精血不足宜用地黄丸補之若在乳下當兼補其母更以軟帛𦂳束其首使其易合皆虚火上衝當調補脾腎為善𩕄塡𩕄陷亦因所禀腎氣不足及乳哺失宜脾胃虧損所致夫脾主肌肉氣逆上衝而為塡脹元氣下陷而為𩕄陷也並用補中益氣湯地黄丸及用狗頭骨炙黄為末以鷄子清調敷𩕄門亦有瀉痢氣血虚脾胃不能上充者亦用前法若手足並冷前湯加薑桂未應虚寒甚也急加附子緩則多致不救治驗一小兒顱解足軟兩膝漸大不能行履用六味地黄丸加鹿茸治之三月而起一小兒十四嵗解顱自覺頭大視物昏大畏日羞明此禀賦腎氣怯弱用六味丸加鹿茸及補中益氣湯加山藥山茱萸半載愈二載而𩕄合既婚之後仍覺𩕄門開解足心如炙喜其斷色慾薄滋味日服前藥二劑三載而愈後入房兩腿痿軟又教以服前丸守前戒而愈一小兒年十四嵗而近女色發熱吐痰至有室兩目羞明頭覺脹大仍不斷慾其頭漸大𩕄門忽開用地黄丸益氣湯之類斷色慾年餘而愈一小兒年十三嵗患前症内熱晡熱形體倦怠食少作渇用六味丸加鹿茸補之不越月而痊一小兒吐瀉發熱𩕄陷作渇用七味白术散母子並服而愈一小兒久病發熱其𩕄或陷或塡手足或温或冷余用補中益氣湯加蔓荆子炮薑治之而安一小兒𩕄陷吐瀉手足並冷用白术散加木香炮薑治之而愈後傷食腹痛手足復冷用六君炮薑治之更加昏憒口角流涎此脾胃虛寒之甚也急加附子遂愈一小兒病後其𩕄或陷或塡此脾胃虚熱也朝用補中益氣湯加蔓荆子炮薑木香治之而𩕄平但作瀉口乾用白术散以生胃氣而愈栢子仁散治𩕄門不合防風一兩五錢栢子仁一兩右為末乳汁調塗𩕄門十日自合三辛散治腦角骨大𩕄門不合細辛桂心各半兩乾薑一錢右為末乳汁調塗𩕄上乾時再塗玉乳丹治解顱鍾乳粉如法製熟地黄自法製各半兩杵膏栢子仁研膏當歸各半兩防風補骨脂各一錢右各另為末入二膏加煉蜜丸黍米大每服一二十丸煎茴香湯送下加黄茋茯苓亦可封𩕄散方見發搐地黄丸方見腎臟濟生當歸散方見黄疸目内症經曰目者五臟六腑之精榮衛魂魄之所常營也神氣之所常主也又曰諸脉者皆屬於目目得血而能視五臟六腑精氣皆上注於目而為之精故白睛属肺黑睛属肝瞳人属腎上下胞属脾兩眥属心而内眥又属膀胱五臟五色各有所司心主赤赤甚心實熱也用導赤散赤微者心虗熱也用生犀散肝主青青甚者肝熱也用瀉青丸淡青者肝虚也用地黄丸脾主黄黄甚者脾熱也用瀉黄散淡黄者脾虚也用異功散目無睛光及白睛多黑睛少者肝腎俱不足也用地黄丸加鹿茸晝視通明夜視㒺見者因禀陽氣衰弱遇夜隂盛則陽愈衰故不能視也用冲和養胃湯凡赤脉翳物從上而下者属足太陽經用東垣選奇湯從下而上者属足陽明經用局方流氣飲蓋翳膜者風熱内藴也邪氣未定謂之熱翳而浮於外邪氣已定謂之氷翳而沈於内邪氣旣深謂之陷翳宜升發之退翳之藥佐之若上眼皮下出黑白翳者属太陽寒水從外至内者属少陽風熱從下至上綠色者属足陽明及肺腎合病也疳眼者因肝火濕熱上衝脾氣有虧不能上升清氣故生白翳睫閉不開眵淚如糊乆而膿流遂至損目用益氣聡明湯茯苓瀉濕湯及四味肥兒丸目閉不開者因乳食失節或過服寒凉之藥使陽氣下陷不能升舉故目不開用柴胡復生湯若胃氣虧損眼睫無力而不能開者用補中益氣湯暴赤腫痛者肝火熾盛也用龍膽瀉肝湯多淚羞明者肝心積熱也用生犀散亦有肝腎虚熱者用地黄丸風沿爛眼者膈有積熱也用清胃散時時作痒者膿潰生蟲也用㸃藥紫蘇膏眼睫連劄者肝經風熱也用柴胡清肝散若生下目黄壯熱大小便秘結乳食不思靣赤眼閉者皆由在胎時感母熱毒所致兒服瀉黄散母服地黄丸若乳母膏粱積熱致兒目黄者令母服清胃散若肢體靣目爪甲皆黄小便如屋塵色者難治又有痘疹後餘毒未盡上侵於目者属腎肝虚也用滋隂腎氣丸前症多宜審治其母兼調其兒厥有未盡悉詳原機啟微集中宜叅考之治驗一女子年十四因恚怒先月經不行寒熱脇痛後兩目生翳青緑色從外至内余謂寒熱脇痛足厥隂之症也翳從外眥起足少陽之症也左闗脉弦數按之而濇肝經風熱兼血滯也遂以加味逍遥散加防風龍膽草四服而寒熱脇痛頓減用六味丸月餘而翳消一小兒十五嵗兩目白翳腹膈遍身似疥非疥晡熱口乾形體骨立此肝疳之症也用六味肥兒丸而痊後隂莖作痒小便澄白瘡疥益焮狀如大風用大蘆薈四味肥兒丸諸症漸愈又用大蕪荑湯而痊一小兒白睛多吐痰發搐先用抑青丸四服而痰搐止後用地黄丸年許而黒睛多一小兒白睛多三嵗不能行語聲不暢兩足非熱則冷大便不實朝用補中益氣湯加五味子乾山藥以補脾肺夕用地黄丸加五味子牛膝鹿茸補肝腎不三月而瘥一小兒眼白腿軟兩足熱靣似愁容服地黄丸兩月餘漸健服年餘白睛漸黑出痘無恙一小兒雀盲眼劄服煮肝丸而目明服四味肥兒丸而目不劄一小兒目無光芒視物不了了飲食少思大便不調服大蕪荑湯九味蘆薈丸而愈後飲食停滯妄用消導尅伐之劑目症仍作至晩尤甚用人參補胃湯漸愈又用五味異功散四味肥兒丸而痊一小兒九嵗素有肝火兩目生翳服蘆薈肥兒等丸隨愈至十四嵗後遇用心過度飲食不節即夜視不明用補中益氣湯人參補胃湯四味肥兒丸而愈一小兒眼胞㣲腫咳嗽惡心小便泔白余謂脾疳食積以五味異功散為主佐以四味肥兒丸而愈後不節飲食夜視不明余曰此脾胃復傷須補養為主不信乃服峻厲之劑後變風症竟不起一小兒因發熱表散出汗眼赤發搐審其母素有肝火發熱以異功散加柴胡升麻子母並服稍愈又用加味逍遥散其熱頓退繼用補中益氣湯六味地黄丸母子尋瘥一小兒目赤作痛咬牙寒熱余謂肝經風熱用柴胡飲子一劑而赤痛止又用四物參茋白术柴胡而寒熱退又用補中益氣湯而飲食加一小兒眼素白或青患眼赤作痛服降火之劑眼如血貫脉洪大或浮緩按之皆微細用十全大補湯加柴胡山梔數劑外症漸退而脉漸斂又數劑而愈一小兒停食腹痛服巴豆之藥更加目赤作痛寒熱徃來飲食少思手足並冷余用六君升麻炮薑諸症頓愈惟寒熱未已用四君升麻柴胡而安一小兒眼赤痛服大黄之藥更加寒熱如瘧余謂脾胃復傷用四君升麻柴胡炮薑釣藤鈎而寒熱愈又用補中益氣湯間服而目疾痊一小兒因乳母恚怒患發熱等症兒患目痛兼作嘔吐先用小柴胡湯子母俱服頓安但兒晡熱仍嘔以異功散加升麻柴胡治之瘥一小兒生下目黄三日靣赤黄一小兒旬日内目黄而漸至遍身此二者胎禀胃熱各用瀉黄散一服皆愈一小兒旬日靣目青黄此胃熱胎黄也用瀉黄散以乳調服少許即愈後復身黄吐舌仍用前散而安一小兒患目黄知其乳母食鬰身黄所致以越鞠丸治母瀉黄散治子並愈一小兒靣青寒熱形氣瘦弱眼目生翳用九味蘆薈丸五味異功散目翳漸退乃以四味肥兒丸五味異功散而肌肉生一小兒眼每生翳皆因乳母恚怒而作用九味蘆薈丸柴胡梔子散母子服之並愈一小兒乳哺失節服藥過劑腹脹少食大便不調兩眼生花服治眼之藥漸生浮翳余用異功散加當歸柴胡飲食漸進便利漸調少佐以九味蘆薈丸其眼漸明乃用人參補胃湯肥兒丸而痊一小兒未週嵗目内有翳余謂此禀母肝火所致詢其母果素多恚怒見患瘰􅕅目疾自乳其子余用地黄丸治之其母稍愈後彼無此藥其子遂瞽一小兒十二嵗傷寒咳嗽發熱服發散之藥目漸不明服降火等藥飲食日少目漸生翳余謂中氣虚用人參補胃湯飲食漸進又用千金補肝丸及薰眼之法而痊一女子十二嵗目生白翳靣黄浮腫口乾便泄用四味肥兒丸而痊一小兒目羞明癮澁兩足發熱大便不實食少時咳仍欲治肝袪風余曰兩足發熱小便不調腎肝虚也大便不實食少時咳脾肺虚也朝用補中益氣湯夕用六味地黄丸元氣漸復乃佐以四味肥兒丸又月餘而瘥一小兒目痛恪服瀉火治肝之藥反加羞明癮澁睡中驚悸悲啼此肝經血虚火動傷肺也用五味異功散加山梔補脾肺清肺金用地黄丸滋腎水生肝血而安乃兼服四味肥兒丸而瘥一小兒目青發搐直視呌哭或用牛黄清心丸加咬牙頓悶小便自遺余謂肝經血氣虚甚也用補中益氣湯及六味地黄丸而痊一小兒發搐目劄属肝膽經風熱先用柴胡清肝散治其肝後用地黄丸補其腎而愈一小兒目痛兼痒因膏粱積熱仍口渇飲冷便秘先用瀉青丸疏導肝火更用清胃散煎熟磨生犀角服之以解食毒又用四味肥兒丸以治肝症而瘥一小兒目疾久不愈用大蕪荑湯五劑蟾蜍丸數服又用四味肥兒丸而愈一小兒十四嵗用功勞苦半載後自汗盗汗形體殊倦朝用補中益氣湯加五味子蔓荆子夕用十全大補湯尋愈􅺊姻後因唾痰頭運恪服清痰理氣之藥忽目不能開余用地黄丸十全大補湯三月餘而痊呉江史萬湖之孫自乳兒時患目疾年二十目劄頭揺用金匱腎氣丸愈而復作兩目生翳用聡明益氣湯并前丸既愈而復發形體消瘦脉數洪大用補中益氣湯及前丸而瘥一小兒因驚眼劄或搐先用加味小柴胡湯加蕪荑黄連以清肝熱又用地黄丸以滋腎生肝而痊一小兒兩目連劄或色赤或時拭眉此肝經風熱欲作肝疳也用四味肥兒丸加龍膽草而瘥一小兒白睛多吐痰發搐用地黄丸為主佐以抑青丸而搐止後用世傳方地黄丸而黑睛多一女子十四嵗兩目作痛或發痒或頭運或頭痛或兩脇作痛或寒熱内熱口渇少食經候不調此肝脾二經氣血虚而有熱也用補中益氣湯柴胡清肝散而愈後左􅤫上結一核如荳許漸大如栗腐而作痛此肝經火燥而血病也用加味逍遥月餘腐肉自脫乃用八珍湯及前藥而愈一小兒十三嵗目久痛漸生青綠翳後赤爛左闗脉弦數用九味蘆薈丸加味逍遥散而愈畢姻後復發用滋隂腎氣丸為主佐以加味逍遥散而痊一小兒十五嵗因大勞目赤作痛發熱作渴脉洪大而虚用八珍湯加炒黑山梔一劑諸症頓退又用補中益氣湯而痊後因夢遺目仍赤痛用六味地黄丸料加五味子二劑而痛止又三十餘劑而復明生犀散治心經虛熱生犀取末二錢地骨皮赤芍藥柴胡乾葛各一兩甘草半兩右每服二錢水煎生熟地黄散治眼初患之時因悞築到蹙肝受驚風致目腫赤痛痒生地黄洗熟地黄各一兩麥門冬半兩當歸甘草炙防風枳殻米泔浸麪炒赤芍藥杏仁湯泡去皮尖用麪炒赤色各二錢五分右每服一錢黑豆七粒水煎犀角飲治脾火眼疼犀角一兩射干草龍膽炒黄芩炒各半兩人參二兩茯苓二錢五分甘草三錢釣藤鈎七錢半右每服一錢水煎牛黄丸治肝受驚遂致患目牛黄白附子肉桂全蝎芎藭石膏各二錢半白芷藿香各半兩辰砂麝香各少許右各另為末煉蜜丸桐子大每服三丸臨卧薄荷湯化下乳母亦忌熱物之類世傳方地黄丸治腎虚目睛多白鹿茸半兩澤瀉茯苓山茱萸熟地黄牡丹皮牛膝各一兩右為末蜜丸桐子大每服二十丸鹽湯下羅氏煑肝丸治疳眼翳瘼羞明大人雀目甚效夜明砂青蛤粉榖精草各一兩右為末每服二錢以猪肝批開攤藥在内麻纒定米泔水半碗煑肝熟取出湯傾椀内薰眼候湯温分肝三服嚼喫就用肝湯下一日二服龍膽飲子治疳眼流膿生翳此濕熱為病青蛤粉半兩炒黄芩二錢羌活草龍膽各二錢蛇蛻五分麻黄二錢五分榖精草五分右為末每服二錢茶清調下東垣人參補胃湯治勞役飲食不節内障眼痛神效黄茋根人參各一兩炙甘草八錢蔓荆子一錢白芍藥炒黄栢各三錢酒拌炒四次右每服二三錢水煎稍熱服臨卧三五服千金治雀盲地膚子五兩决明子一升右為末以米飲和丸每服二三十丸世傳治雀目蒼术四兩米泔浸切片四兩焙右為末猪肝二兩批開摻藥在内用麻擊定粟米一合水一碗砂鍋内煑熟薰眼候温臨卧每服三錢大效聖闕治雀目不計時月用蒼术一兩為末每服一錢本事治小兒赤熱腫眼大黄白礬各等分右為末冷水調作餅子貼眼立效東垣廣大重明湯治兩臉或兩眥赤爛熱腫痛疼及眼胞痒極㧓之至破爛赤腫眼楞生瘡痂目多眵淚隠澁難開草龍膽防風生甘草根細辛苗葉各一錢右水一碗半煎龍膽至七分入餘藥再煎至半碗熱洗日五七次洗畢合眼湏臾瘥東垣助陽和血補氣湯治發後熱壅白睛紅多眵淚隠澁此過服凉藥而真氣不能通九竅也防風七分黄茋一錢蔓荆子二分白芷二分升麻七分甘草炙當歸身酒洗柴胡各五分潔古治眼赤暴發腫防風羌活黄芩炒黄連炒各等分右每服一錢水煎服如大便秘加大黄二分痛甚加川歸地黄各二分煩躁不得卧加梔子仁三分保命㸃眼藥除昏退翳截赤定痛當歸黄連各二錢防風一錢五分細辛五分甘草一錢右水一大碗文武火熬滴水中不散為度入熟蜜少許㸃用千金補肝散治目失明青羊肝一具去膜薄切以新瓦炙乾决明子蓼香合熬令香右為末每服方寸匕日二服久而有驗本事治太陽寒水陷翳膜遮睛白蒺蔾防風各一兩羌活一兩半甘菊三兩右為末每服二錢入鹽少許百沸湯㸃服保命羚羊角散治氷翳久不去羚羊角升麻細辛各等分甘草減半右為末一半蜜丸桐子大每服五七十丸一半泔水煎吞送丸子焮發陷翳亦羚羊角散之類用之在人消息若隂虚有熱者兼服神仙退雲丸東垣補陽湯治陽不勝其隂乃隂盛陽虛則九竅不通今青白翳見於大眥乃足太陽少隂經中鬰遏厥隂肝經之陽氣不得上通於目故青翳内阻也當於太陽少隂經中是九泉之下以益肝中陽氣衝天上行此乃先補其陽後於足太隂標中瀉足厥隂之火下伏於陽中内經曰隂盛陽虛則當先補其陽後瀉其隂每日空心服升陽湯臨卧服瀉隂丸須預期調養體氣和平天氣晴明服之補其陽使上升通於肝經之末利空竅於目矣羌活獨活甘草稍當歸身酒洗焙乾熟地黄人參黄茋白术各一兩澤瀉橘紅各半兩生地黄炒白茯苓知母炒黄色各三錢柴胡二兩肉桂一錢防風白芍藥各半兩右每服半兩水煎空心服候藥力行盡方可飲食東垣羌活退翳湯柴胡甘草黄茋各三錢羌活黄連五味子升麻當歸各二錢防風一錢五分黄芩黄栢酒浸芍藥草龍膽酒洗各五錢石膏二錢五分右分二服水煎入酒少許臨卧熱服忌言語謙甫五秀重明丸治眼翳膜遮睛隠澁昏花常服清利頭目甘菊花五百箇木賊去節五百根荆芥五百穂楮實五百根右為末蜜丸桐子大每服五十丸白湯化下冲和養胃湯治内障初起視覺微昏空中有黑花神水變淡綠色次則視岐覩則成二神水變淡白色久則不覩神水變純白柴胡七錢人參當歸炙草乾生薑升麻葛根白术羌活各一兩防風五錢黄耆一兩半白茯苓三錢白芍藥六錢五味子二錢右每服二錢水煎滋隂腎氣丸治神水寛大漸散昏如霧露中行漸覩空中有黑花視物二體久則光不收及内障神水澹白色者熟地黄三兩歸尾牡丹皮五味子乾山藥柴胡各五錢茯苓澤瀉各二錢半生地酒炒四兩右為末蜜丸桐子大辰砂為衣每服十丸空心滚湯化下瀉熱黄連湯治内障有眵淚眊矂黄芩生地黄黄連並酒洗柴胡各一兩升麻五錢龍膽草三錢右每服一錢水煎午後服柴胡復生湯治紅赤羞明淚多眵少腦嵿沉重睛珠痛應太陽眼睫無力常欲垂閉久視則酸疼翳陷下者藁本蔓荆子川芎羌活獨活白芷各二分半白芍藥炒炙草薄荷桔梗各四分蒼术茯苓黄芩各五分炒柴胡六分五味子十二粒杵右每服二錢水煎食後服黄連羊肝丸治目中赤脉洪甚眵黄連為末白羯羊肝一具先以羊肝竹刀刮下如糊除去筋膜再擂細入黄連丸桐子大每服十丸茶清化下茯苓燥濕湯治小兒易饑而渴腹脹生瘡目痛生翳不開眵淚如膿俗謂疳毒眼白术人參甘草炒枳殻麩炒茯苓蔓荆子薄荷各二分蒼术前胡獨活各三分川芎羌活各三分半柴胡四分澤瀉一分半右每服二錢水煎局方菊睛丸治脾腎不足眼花昏暗甘菊花四兩枸杞子蓯蓉酒浸炒巴㦸去心各一兩右為末蜜丸梧子大每服十丸空心白湯化下抑青丸方見驚啼加味逍遥散方見内釣大蕪荑方見疳症九味蘆薈丸方見諸症異功散方見内釣小柴胡湯方見痙症柴胡梔子散方見發熱蟾蜍丸方見諸疳耳症耳者心腎之竅肝膽之經也心腎主内症精血不足肝膽主外症風熱有餘或聾瞶或虛鳴者禀賦虛也或脹痛或膿痒者邪氣客也禀賦不足宜用六味地黄丸肝經風熱宜用柴胡清肝散若因血燥用梔子清肝散未應佐以六味丸間服九味蘆薈丸若因腎肝疳熱朝用六味丸夕用蘆薈丸若因食積内熱用四味肥兒丸若因乳母膏粱積熱而致者宜加味清胃散脾經鬰結而致者加味歸脾湯肝經怒火而致者加味逍遥散皆令乳母服之兼與其兒少許不可専於治外不惟閉塞耳竅抑亦變生他症延留日久遂成終身之聵矣慎之治驗一小兒耳内出膿穢不可近連年不愈口渇足熱或靣色微黑余謂腎疳症也用六味地黄丸令母服加味逍遥散而愈後因别服伐肝之藥耳症復作寒熱靣青小便頻數此肝火血燥也用柴胡梔子散以清肝六味地黄以滋腎遂痊一小兒耳内出膿久不愈視其母兩臉青黄属乳母鬰怒致之也遂朝用加味歸脾湯夕用加味逍遥散母子皆愈一小兒十二嵗素虚羸耳出膿水或痒或痛至十四稍加用心即發熱倦怠兩腿乏力八年矣用補中益氣湯及六味地黄丸稍愈畢姻後朝寒暮熱形氣倦怠兩足心熱氣喘唾痰仍用前二藥佐以六君子湯而愈因後不守禁忌惡寒發熱頭運唾痰余謂腎虛不能攝水而似痰清氣不能上升而頭運陽氣不能䕶守肌膚而寒熱遂用補中益氣湯加蔓荆附子一錢四劑不應遂用人參一兩附子一錢二劑而應乃用十全大補湯百餘劑而痊又因大勞入房喉瘖痰湧兩腿不遂用地黄飲子頓愈仍用十全大補湯而安後又起居失宜朝寒暮熱四肢逆冷氣短痰盛兩寸脉短用十全大補湯加附子一錢數劑而愈乃去附子用人參三錢常服始安一小兒耳中流膿項中結核眼目或劄或赤痛小便或痒或赤澀皆肝膽經風熱之症也用四味肥兒丸悉愈一小兒因乳母恚怒兼經行之後多食炙煿兒遂耳内作痛出膿余先用加味小柴胡湯次用加味逍遥散令其母服之子母並愈一小兒耳出穢水属肝腎不足先用九味蘆薈丸而痊畢姻後靣黄發熱多病又用黄栢知母等藥更胸膈痞滿飲食少思痰涎上壅又利氣化痰加噫氣下氣余用六君子補中益氣二湯乾薑木香等味治之尋愈田氏紅玉散治小兒聤耳枯礬麝香乾胭脂各等分右為末研匀先以綿杖子撚膿浄摻入少許湯氏龍黄散治如前枯礬龍骨黄丹各半兩麝香一錢右製法同前愚按前二方可以治腑症之輕者若係肝經風熱血燥等症必依前方論内服合宜之藥外用此以收膿濕亦無不可若専泥外攻而失内治謬矣六味地黄丸方見腎臟柴胡清肝散梔子清肝散方見熱症九味蘆薈丸四味肥兒丸方見嘔吐加味清胃散方見内釣加味歸脾湯方見内釣加味逍遥湯方見内釣柴胡梔子散加味小柴胡湯六君子湯方見内釣四君子湯方見内釣地黄丸方見腎臟七味白术散方見積滯補中益氣湯方見虚羸二陳湯方見寒吐鼻塞鼻䘐巢氏云鼻乃肺之竅皮毛腠理乃肺之主此因風邪客於肺而鼻塞不利者宜用消風散或用葱白七莖入油膩粉少許擂攤絹帛上掌中䕶温貼𩕄門因驚仆氣散血無所覊而鼻衂者用異功散加柴胡山梔左臉青而兼赤者先用柴胡清肝散後用地黄丸右臉赤乃肺大腸實熱也用瀉白散鼻色赤乃脾胃實熱也用瀉黄散㣲赤乃脾經虚熱也用異功散加升麻柴胡色深黄用濟生犀角地黄湯後用楊氏地黄丸淡白色用六君子湯頦間色赤用四物湯加山梔赤甚用五淋散小便赤色用六味丸補中益氣湯唇色白用六君子湯久不愈用麥門冬飲子若初病元氣未虧乳食如常發熱壯熱二便秘結作渇飲水卧不露睛者悉属形病俱實當治邪氣若病久元氣已虧食少發熱口乾飲湯嘔吐泄瀉肢體畏寒卧而露睛者悉属形病俱虚當補正氣為要治驗一小兒咳嗽惡心鼻塞流涕右腮青白此乃脾肺氣虛而外邪所乗也先用惺惺散咳嗽頓愈但飲食不思手足指冷用六君子少加升麻一劑而痊一小兒潮熱鼻衂煩渇便秘氣促咳嗽右腮色赤此肺與大腸有熱也用柴胡飲子一服諸症頓退後因驚復作㣲搐頓悶此肝脾氣血虛也用四君子加芎歸釣藤鈎而愈一小兒遍身生疥穵鼻出血因肝脾有熱用四味肥兒丸而愈後食炙􅏼鼻血復出瘡疥復發先用清胃散二劑又用四味肥兒丸月餘而瘥一小兒鼻衂滯頥作渇時汗乃胃經實熱也先用瀉黄散二服而滯頥止又用四味肥兒丸數服而鼻血愈後鼻不時作痒發渇便血用聖濟犀角地黄湯四劑母子並服别令兒更服四味肥兒丸月餘而愈一小兒鼻衂發熱作渇右腮色青余謂肝火乗脾先用加味逍遥散母子並服熱渇漸止另用五味異功散少加柴胡升麻與子服之而愈一小兒鼻衂服止血之劑反見便血右腮色黄或赤此脾氣虛熱不能統血也用補中益氣湯又用五味異功散加柴胡升麻而愈一小兒鼻衂久不愈四肢倦怠飲食少思惡風寒此脾肺虛也先用五味異功散而鼻血止又用補中益氣湯而不畏風寒繼用四君少加柴胡升麻而全愈一小兒鼻衂兩頦赤余謂禀賦腎氣不足虛火上炎也不信别服清熱凉血之藥病益甚余用地黄丸果效畢姻後虚症悉至用八珍湯地黄丸料尋愈一小兒鼻衂作渇喘嗽靣赤此心火刑肺金也用人參平肺散及地黄丸料加五味子麥門冬煎服而痊楊氏地黄散治勞中有熱肺壅鼻衂生地黄赤芍藥當歸身川芎各等分右每服二三錢水煎熟入蒲黄少許春夏衂入地黄汁蒲黄各少許秋冬䘐用車前草汁少許麥門冬飲子治吐血久不愈者五味子十粒麥門冬去心黄茋各一錢當歸身人參生地黄各五分右水煎服補中益氣湯方見虚羸清胃散方見内釣異功散二方見内釣即五味異功散人參平肺散方見咳嗽柴胡清肝散方見熱症瀉白散方見肺臟瀉黄散方見脾臟犀角地黄湯即聖濟犀角地黄湯方見便血臟血五淋散方見五淋四君子湯方見内鈎八珍湯即四君四物二湯合服也四君見天鈎四物見急驚四物湯方見急驚惺惺散柴胡飲子二方見熱症四味肥兒丸方見嘔吐加味逍遥散方見内鈎六味地黄丸方見腎臟龜胸龜背仲陽曰龜胸者肺熱脹滿攻於胸膈或乳母多食酸辛及兒食宿乳而成當用龜胸丸或松蕋丹百合丹之類治之龜背者令兒早坐因客風吹脊入於骨髓所致以龜尿㸃背間骨節取龜尿之法當置龜於荷葉上候龜眼四顧急用鏡照之其尿自出又法當灸肺俞穴在第三椎骨下兩傍各開一寸五分心俞穴在第五椎骨下兩傍各開一寸五分膈俞穴在第七椎骨下兩傍各開一寸五分用艾如小荳大灸三五壯此多因小兒元氣未充腠理不宻風邪所乘或痰飲藴結風熱交攻而致法當調補脾肺為主而以清熱消痰佐之若因乳母膏粱厚味者當以清胃散治其母子亦服少許龜胸丸大黄一錢煨天門冬去心焙百合杏仁麩炒木通枳殻麩炒桑白皮蜜炙甜葶藶炒朴硝各半兩右為末煉蜜丸芡實大每服一丸温水食後化下枳殻防風丸枳殻麩炒防風獨活大黄煨前胡當歸酒洗麻黄去節各一錢右為末麪糊丸黍米大每服十丸食後米湯下松蕋丹治龜背花松枳殻防風獨活各一兩麻黄大黄前胡桂心各半兩右為末蜜丸黍米大每服數丸粥飲下量兒加減新増百合丹治龜胸背百合一兩木通朴硝桑白皮蜜炙杏仁去皮尖炒雙仁不用大黄煨天門冬各半兩右為末煉蜜丸菉荳大每服十丸食前温酒化服薛氏醫案卷五十七
