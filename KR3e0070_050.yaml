body:
  text: 薛氏醫案卷五十明薛已訂錢氏小兒直訣一脈法脈弦急氣不和脈沉緩傷食脈促結虛驚脈浮為風脈沉細為寒脈亂不治薛按脈者人身之造化病機之先見用藥之凖繩不可不先明諸心者也全幼心鑑云小兒一嵗以前看虎口食指寅卯辰三關以驗其病脈紋從寅關起不至卯關者易治若連卯關者難治若寅侵卯卯侵過辰者十不救一其脈紋見有五色如因驚必青瀉痢色紫當以類而推之一嵗後則可用一指轉側辨其三部脈弦急浮沉四五嵗後脈七八至而細數者為平九至者傷十至者困六至五至者為虛為寒弦緊者為風癎弦急為客忤其變蒸者脈必散亂骨間有熱脈則沉數若浮而不調為鬼祟浮大而數為風熱伏結為物聚微細為疳積為腹痛浮而洪為有蟲浮而遲為胃寒此論脈之大要耳然小兒血氣未實驚則氣散氣散則脈亂矣又當參以三部五脈三部者乃看面上氣色虎口脈紋寸口一指脈五脈者上按額前下診太衝并前三部謂之五脈也治法雖分虛實然實者病氣實而形氣虛也虛者形氣病氣俱虛也經云真氣奪則虛邪氣勝則實又云虛則補其母實則瀉其子東垣先生云形病俱實當瀉之形病俱虛當補之詳見後圖下面部症左腮為肝右腮為肺額上為心鼻為脾頦為腎若色赤者熱也宜隨症治之薛按左腮屬肝其色青者為順白者為逆若色赤主肝經風熱發熱拘急青黑主驚風腹痛痰赤主潮熱痰嗽右腮屬肺其色白者為順赤者為逆若赤色甚者主咳嗽喘急悶亂飲水傳於腎則小便赤澀或淋閉不通額上屬心其色赤者為順黑者為逆若青黑主驚風腹痛瘈瘲啼哭微黃主盜汗頭髮乾燥驚疳骨熱鼻屬脾其色黃者為順青者為逆若色赤主脾經虛熱飲食少思深黃主小便祕而鼻燥衄血頦屬腎其色黑者為順黃者為逆若色赤主腎與膀胱有熱而小便不通目部症目內色赤者心實熱導赤散淡紅者心虛熱生犀散青者肝實熱瀉青丸淡青者肝虛熱地黃丸黃者脾實熱瀉黃散微黃者脾虛熱益黃散白而混者肺實熱瀉白散目無晴光者腎虛也地黃丸主之薛按目者五臟之精華各有所主白睛屬肺黑睛屬肝上下眼胞屬脾紅脈屬心瞳人屬腎此五臟之正色也然白晴本屬肺而見紅色此心尅肺之賊邪也見青色此肝乘侮之微邪也見黑色此腎乘肺之實邪也見黃色此脾乘肺之虛邪也餘倣此五臟虛實寒熱心主驚實則呌哭發熱飲水而搐虛則困卧而悸心熱則合面睡或上竄咬牙者導赤散主之心氣實而喜仰卧者瀉心湯主之薛按前症若心小腸實熱宜治以前藥若心肝血虛用五味異功散加當歸若因心血不足用祕旨安神丸若肝心血燥用柴胡梔子散若因肝心血虛用六味地黃丸若因脾虛食鬱生痰而驚悸不安者宜用四君子以健脾神麯麥芽以消導山梔柴胡以清熱如用前方病氣雖去前症仍作急調補元氣或反甚急溫補元氣凡此多因妊娠厚味七情或小兒乳哺失宜或乳母飲食鬱怒所致病氣既見形氣已虛必當推其所因而以助胃壯氣為主佐以治病之劑為善餘倣此肝主風實則面青目直呌哭壯熱項急頓悶虛則咬牙呵欠肝熱則手尋衣領及亂捻物瀉青丸主之壯熱飲水喘悶瀉白散主之薛按前症若肝木實熱生風而自病肺金實熱而尅木者宜用前二藥以瀉其邪氣之實若肝經風熱而目直等症者用柴胡梔子散以清肝火加味四物湯以養肝血若腎虛而咬牙諸症者用六君子湯以健脾土六味地黃丸以滋腎水苟不審其症之虛實而妄用前藥則虛虛之禍不能免矣肝有風則目連劄得心熱則發搐或筋脈牽繫而直視用瀉青丸以治肝導赤散以清心肝熱則目赤或兼青發搐者亦用前二藥風甚則身反張強直用地黃丸以補腎瀉青丸以治肝薛按前症若肝經實熱而自病宜用瀉青丸若肝經血燥而自病用抑肝散腎水虛不能生肝者宜用地黃丸若脾土虛不能培木者宜用六君子湯凡肝經既病風火相搏則肝臟虧損若不固根本必變他症百出也脾主困實則身熱引飲用瀉黃散虛則吐瀉生風用異功散面白腹痛口中氣冷不思飲食或吐清水以益黃散溫補脾虛下利用調水丸呵欠多睡者脾氣虛而欲發驚也薛按前症若發熱作渴喜冷飲食或泄瀉色黃睡不露睛屬形病俱實宜用瀉黃散疏導之若發熱口乾惡冷飲食或泄瀉色白睡而露睛屬形病俱虛宜用異功散調補之若脾氣下陷者補中益氣湯升補之寒水侮土者益黃散溫補之肝木尅土者六君柴胡平補之若目睛微動潮熱抽搐吐瀉不食宜用祕旨保脾湯凡小兒諸病先當調補脾胃使根本堅固則諸病自退愚治沈氏子吐瀉腹痛手足並冷余謂此脾土虛弱寒水所侮先用益黃散一劑諸症頓愈手足稍冷此寒水退而脾土虛弱也用異功散少加木香一劑却去木香再劑而痊一小兒傷食發熱吐瀉腹痛欲服益黃散余曰內有丁香良薑非其所宜前症乃脾胃受傷而無寒症不信仍服前藥其痛益甚二便不通口舌糜爛而歿肺主喘實則悶亂氣急喘促飲水虛則哽氣出氣肺熱則手搯眉目鼻面用甘桔湯主之肺盛復感風寒則胸滿氣急喘嗽上氣先用瀉白散以清肺氣後用大青膏以散風寒肺臟怯則唇白用阿膠散補之悶亂氣粗喘促哽氣者難治肺虛甚也薛按前症若腠理不密外邪所感而肺病者用清肺丸若脾胃氣虛不能相生而肺病者用六君子湯若脾胃氣實大腸不利而肺病者用瀉黃散若心火炎爍肺金而肺病者用地黃丸腎主虛若胎虛怯神氣不足目無睛光面白顱解此皆難育雖育不壽或更加色欲變症百出愈難救療或目畏明下竄者蓋骨重而身縮也咬牙者腎水虛而不能制心火也皆用地黃丸薛按潔古先生云下竄者腎氣不足兩足發熱故不喜衣覆也蓋臍以下皆腎之所主緣心氣下行於腎部也所以宜用地黃丸壯水制火而補腎故凡此必待精血完固而後嫁娶庶可以免前患精血篇云男子精未滿而御女以通其精則五體有不滿之處異日有難狀之疾今小兒稟賦不足豈有不本於此哉詳見精血篇變蒸小兒在母腹中乃生骨氣五臟六腑成而未全自生之後即長骨脈五臟六腑之神智也變生易也自內而長自下而上又身熱故以生之日後三十二日一變蒸即智意有異於前何也長生臟腑智意故也何謂三十二日長骨添精神人有三百六十五骨除手足中四十五碎骨外有三百二十數自生下骨一日十假而上之十日百假而三十二日計三百二十段為一遍亦曰一蒸骨之餘氣一自腦分入齦中作三十二齒而齒牙不及三十二數者由變不足其常也或二十八日即長二十八齒已下倣此但不過三十二之數也凡一周遍乃生身熱諸病如是十周則小蒸畢也計三百二十日生骨氣乃全而未壯也故初三十二日一變生腎生志六十四日再變生膀胱其發耳與骫冷腎與膀胱俱主於水水數一故先變生之九十六日三變生心喜一百二十八日四變生小腸其發汗出而微驚心為火火數二一百六十日五變生肝哭一百九十二日六變生膽其發目閉而赤肝主木木數三二百二十四日七變生肺聲二百五十六日八變生大腸其發膚熱而汗或不汗肺者金數四二百八十八日九變生脾智三百二十日十變生胃其發不食腹痛而吐乳此後乃齒生能言知喜怒故云始全也太倉云氣入四肢長碎骨於十變後六十四日長其經脈手受血故能持物足受血故能行立也經云變且蒸謂蒸畢而足一嵗之日也師曰不汗而熱者發其汗大吐者微止不可餘治是以小兒須變蒸蛻齒者如花之易苗所謂不及三十二齒者由變之不及齒當與變日相合也年壯而視齒方明薛按小兒變者變其情態蒸者蒸其血脈故三十二日一變每變畢則情態異常全嬰方論云變蒸者以長氣血也變者上氣蒸者發熱也輕則體熱虛驚耳冷微汗唇生白泡三日可愈重者寒熱脈亂腹疼啼呌不能乳食食即吐哯五日方愈古方以黑散子紫丸子主之竊謂此症小兒所不免者雖勿藥可也况前藥乃屬峻厲非惟臟腑不能勝抑且反傷氣血慎之慎之余嘗見一小兒至二變發熱有痰投以抱龍丸一粒卒至不救觀此可驗矣若不熱不驚略無症候而暗變者蓋受胎氣壯實故也五臟相勝症治肝臟病秋見肝強勝肺而肺怯也宜阿膠散以補肺益黃散以補脾瀉青丸以治肝薛按潔古張先生云肝勝肺則身熱發搐喘促氣短病見於申酉戌時此受所制而不能勝謂之真強若心乘肝為實邪壯熱而搐有力利驚涼驚二丸主之肺乘肝為賊邪呵欠而搐無力以地黃丸補肝以瀉白散治肺肝乘脾為賊邪多睡體重發抽瀉青丸主之腎乘肝為虛邪憎寒呵欠而搐羌活膏主之大凡肝之得病必先察其肺腎然腎者肝之母金者木之賊非腎水不能相生必肺金鬼邪來尅故其源在肺先治其肺攻其鬼也其源在腎先補其腎滋其本也然後察其本臟之虛實而寒溫之徐用誠滑伯仁先生亦云然心臟病冬見心強勝腎甚則下竄不語當以地黃丸補腎以導赤散治心薛按潔古云若喘而壯熱此肺乘心也為微邪用瀉白散若風熱相搏此肝乘心也為虛邪用大羌活湯下大青丸吐瀉身熱此脾乘心也為實邪用瀉黃散若恐怖畏寒腎乘心也為賊邪用安神丸大凡心臟得病必先調其肝腎腎為心之鬼也肝氣通則心氣和肝氣衰則心氣之此心病先求其肝清其源也五臟既病必傳其所勝則腎之受邪必傳於心故先治其腎逐其邪也若肝腎平和而心自病然後察其虛實而治之肺病春見肺勝肝也以瀉白散治肺若目淡青或目赤者當發搐為肝怯也以地黃丸補肝薛按潔古云肺病喘嗽氣盛見於寅卯辰時當補肝瀉肺若肺病久嗽宜補脾清心若心乘肺為賊邪熱而喘嗽用地黃丸導赤散阿膠散若肝乘肺為微邪惡風眩冒昏憒用羌活散若腎乘肺為實邪憎寒咳嗽清利用百部丸若脾乘肺為虛邪體重吐痰泄瀉咳嗽用人參白术散大凡肺之得病必先察心脾二臟治之若心火亢盛上炎爍肺而肺為病宜先抑心氣若肺氣不足腠理不密風邪所感宜先補脾氣若中焦痞實大腸壅滯熱氣上蒸宜先理脾氣若心脾平和則治其本經腎病夏見水勝火腎乘心也甚則悸動發搐宣風散主之薛按潔古云心乘腎者為微邪發熱不惡風寒用桂枝丸肺乘腎者為虛邪喘嗽皮膚寒澀用百部丸肝乘腎者為實邪拘急發搐身寒用理中丸脾乘腎者為賊邪體重泄瀉惡寒用理中丸大抵五行之間惟腎一臟母盛而子反受邪然物之性有不可以一槩論者肺腎是也何則肺主氣肺有熱則熱得氣而上蒸不能下生於腎而腎受邪矣此腎之病源於肺也又有脾經之濕相刑於腎者法當解肺熱去脾濕若本經自病者宜滋補之脾病見四傍皆倣此治之順者易治逆者難治脾怯當面目黃五臟相乘隨症治薛按潔古云凡脾之得疾必先察其肝心二臟之虛實而治之蓋肝者脾之賊心者脾之母也肝氣盛則賊邪勝心氣虧則脾氣虛故肝乘脾則風瀉而嘔茯苓半夏湯主之若心氣實而壯熱體重泄瀉羌活黃芩蒼术甘草湯主之若肺乘脾而咳嗽便祕飲食如常者煎檳榔大黃湯下葶􅐗丸若腎乘脾而惡寒泄瀉理中丸之類主之竊謂五臟之症相乘伏匿隱顯莫測然病機不離五行生尅制化之理况小兒未有七情多因形體怯弱血氣未全故有五臟勝乘之病更當調治其母若專治其子多致誤矣急驚風症治小兒急驚因聞大聲或驚而發搐搐止如故此熱生於心身熱面赤引飮口中氣熱二便黃赤甚則發搐蓋熱盛生風陽盛而隂虛也宜以利驚丸除其痰熱不可用巴豆之藥薛按祕臟保嬰集云急驚之候牙關緊急壯熱涎湧竄視反張搐搦顫動口中氣熱頰赤唇紅脈浮洪數者此肝經血虛火動生風蓋風生則隂血愈散隂火愈熾火動則肺金愈虧肝木愈盛宜滋肝血養脾氣若屢服祛風化痰瀉火辛散之劑便宜認作脾虛血損急補脾土若風火相搏發熱抽搐目瞤筯攣痰盛者用四物鈎藤鈎以生肝血清肝火用四君子加當歸以補脾土生肺金若肝經血燥發熱驚搐目瞤筋攣痰盛者用六味丸以滋腎水四君子以補脾上若肺金尅肝木用六君子湯以實脾土加芍藥木香以平肺金若屢服驚藥而脾胃虛寒者須用六君子湯以補脾胃丁香木香以培陽氣否則必變慢驚愚治一小兒因驚發熱抽搐頓悶咬牙作渴飲冷大便祕結面色青赤然印堂左腮赤甚此心肝二經風熱相摶乃形病俱實之症先用瀉青丸料加炒黃連煎服一劑大便隨利熱搐頓減用抑青丸一服諸症悉退但面色痿黃形氣倦怠飲食少思此病氣去而形氣虛也用補中益氣湯及地黃丸而安一小兒發熱抽搐口噤痰湧此急驚風也先用瀉青丸一服六味丸二服諸症頓退又用小柴胡湯加芎歸山梔鈎藤鈎而安繼以補中益氣湯而愈一小兒六嵗忽然發搐目動咬牙或睡中驚搐痰涎湧盛或用化痰祛風面色青黃此肝木尅制脾土不能攝涎而上湧也當滋腎水生肝血則風自息而痰自消用六味丸而愈一女子十二嵗善怒睡中驚搐遍身作癢飲食少思此肝火風熱脾土受侮用參术柴苓湯以清肝火涼肝血健脾胃而愈一小兒三嵗患急驚面赤發熱作渴飲冷先君已用瀉青丸一服𫝑去大半翌早又自用前丸一服即吐瀉發搐面色青白手足指冷余以為脾胃受傷用六君子湯加薑桂升麻柴胡一劑頓安前哲謂小兒易為虛實攻伐之藥中病即止不可過劑我先君蓋守此法一小兒三嵗因驚抽搐發熱痰盛久用抱龍丸等藥面色或赤或青此肝心二經血虛風熱用六味丸滋養肝腎佐以六君加柴胡升麻調補脾胃而愈嘉興王舉人女七嵗因跌傷腿膝兩膁腫潰左腮色青左關脈無余意驚則氣散而風熱鬱滯先用四君子加升麻柴胡鈎藤鈎一劑其脈即見再用四物加柴胡防風鈎藤生血補肝而愈慢驚風症治小兒慢驚因病後或吐瀉或藥餌傷損脾胃而肢體逆冷口鼻氣微手足瘈瘲昏睡露睛此脾虛生風無陽之症也溫白丸主之薛按保嬰集云急驚屢發屢用直瀉則脾損隂消而變為慢驚者當補脾養血佐以安心清肺制木之藥最為切當切謂前症多因脾胃虧損肝木所勝但用五味異功散加當歸佐以鈎藤飲子以補脾土平肝木亦多得效如不應用六君加炮薑木香溫補脾土更不應急加附豫以回陽若用逐風驅痰之藥反促其危也每見小兒脾胃弱者一病即成慢驚不可泥為久病誤藥而後成也內經云為慢脾風言脾虛受病也其意可見矣王氏子患吐瀉或用藥下之睡而露睛瘈瘲身冷此慢驚也即用括蔞湯治之而目開身溫但二便不利或用八正散身復冷不食即用益黃散史君子丸溫補脾胃諸症悉愈後又不語用地黃丸以補腎半月而愈愚治一小兒停食吐瀉先用尅滯之劑更加咬牙發搐面色青白手足指冷眉唇抽動余以為脾胃虛弱因藥復傷肝木所乘而成慢驚矣遂用六君子加木香柴胡升麻二劑頓安大凡傷食停滯雖見發搐等症且勿用藥待宿食化盡胃氣漸健而自愈設若強與飲食或誤用藥餌不惟甚其所有而且生其所無矣舉人余時正子傷食發丹服發表之劑手足抽搐服抱龍丸目瞤痰盛余謂脾胃虧損而變慢驚矣用六君加附子一劑而安再劑而愈一小兒患抽搐痰涎自流或用驚風之藥益甚視其面色黃白余用六君子補中益氣二湯而愈小兒初生壯熱吐哯身體強直手足抽掣目反直視是胎驚風症也薛按前症多因娠婦忿怒驚恐調攝乖常或挾外邪內傷於胎蓋母有所觸胎必感之當用豬乳膏拭兒口中或用惺惺散加漏蘆令母煎服使藥通乳中兒病自愈矣發搐症治驚癎發搐男則目左視無聲右視有聲女則右視無聲左視有聲相勝故也故有發時之症薛按前症多因胎中受患或乳母鬱怒傳兒或小兒乳傷自病其症吐乳面青若痰實壅積則壯熱面紅當兼調治其母切不可損其元氣若欲驗逆順男則握拳拇指義入食指中為順於外為逆女則義入食指為逆於外為順仍參吮乳不能類以治其母後倣此王駙馬子五嵗目直視而不欲食或以為鬼祟用符水噴之反加發搐此肝經實火之症也用瀉青丸而愈愚治少參王陽湖孫跌傷股骨正體科接之余視其面青而兼黃口角微掣動此肝木侮脾症也且氣血筋骨皆資脾土而生但壯脾氣則所傷自愈遂用六君子加鈎藤鈎當歸三十餘劑諸症悉愈李寺丞子三嵗病搐發而目右視大呌哭師曰逆也凡男目右視有聲金木相戰故也當瀉其強而補其弱遂用瀉肺湯肺病退又用地黃丸補腎用涼驚丸瀉青丸瀉心肝而愈此症男反女故男易治於女也假令女發搐目左視肺之勝肝又病在秋即肺旺肝不能任故哭呌當大瀉其肺然後治心續肝所以言男目右視者木反侮金肝旺勝肺當瀉其肝若更病在春夏金氣極盛又當補其肺慎勿瀉也愚治一小兒兩目連劄手足發搐頻服天麻防風丸之類益甚得飲食則稍愈視其鼻凖及左頰色青黃此肝木制脾土用六君子加升麻柴胡鈎藤鈎二劑而愈又用補中益氣湯而安若寅卯辰時身體壯熱目上視手足動搖口出熱涎頸項徑強此肝旺也當補腎治肝用地黃丸瀉青丸主之薛按前症若煩熱作渴飲冷便結者宜用瀉青丸若發熱飲溫大便不結者宜用柴芍參苓散若自汗盜汗腎虛液不歸源也用地黃丸若服峻劑或久病流涎脾虛涎不歸源也用六君子湯所云肝旺者乃肝虛而邪氣旺也故先補其母後瀉其子一小兒寅卯時發熱或兼搐有痰服抱龍瀉青二丸而愈後復患仍用前藥以致咳嗽氣喘不時發搐面兼赤色或青黃或浮腫或流涎余謂咳嗽氣喘脾肺氣虛也不時發搐木乘土也面青赤黃肝入心脾也浮腫流涎脾氣虛也用益智丸以補心氣補中益氣湯以養脾肺而愈若己午未時發搐心神驚悸竄視睛赤牙關緊急口中流涎手足動搖此心旺也以地黃丸補肝導赤散涼驚丸治心薛按前症屬邪氣實而真氣虛故用地黃丸其流涎不止為心火虛而脾土弱也佐以六君子湯廣親七太尉病潮熱師曰七使將安八使預防明午驚搐既而果然遂用藥瀉心肝補腎水而愈蓋見其坐石杌目直視而腮赤乃心肝俱熱午時者心肝用事也愚治一小兒己午時發熱驚悸等症發時形氣倦怠面黃懶食流涎飲湯余以為心氣不足所致不信反服涼心藥更加吐瀉睡而露睛幾至慢脾風先用六君子加薑桂佐以地黃丸而愈一小兒七嵗因驚久患搐熱後己午未時益甚形氣倦怠熱定飲湯余謂心脾氣虛朝用補中益氣湯加益智仁夕用六君子加當歸釣藤鈎而尋愈後因飲食過多吐瀉或用保和丸治之加寒熱發搐此脾土復傷而肝木所侮余用六君子柴胡治之寒熱止而飲食進但己午未時去後用補中益氣湯加茯苓半夏釣藤鈎而愈若申酉戌時微搐而喘目微斜身似熱睡而露睛手足逆冷大便淡黃肺旺也當用益黃散以補脾導赤散以治心瀉青丸以治肝薛按前症屬脾土真寒不能生肺氣而假熱故宜益黃散以補肺金之母如用六君炮薑尤效若手足不冷屬虛弱用五味異功散木香其導赤散瀉青丸初病元氣未虛者酌量用之若久病元氣已虛者必用六君子湯祕旨安神六味地黃二丸主之徐氏子三嵗日晡發搐身微熱目微斜露睛作喘四肢逆冷大便微黃師曰此肝實發搐也晡熱肺用事也身溫肺虛也目斜露睛肝肺相勝也四肢逆冷脾氣虛寒也若脾肺虛而木乘土之症當先用益黃散阿膠散以補脾肺後用瀉青丸導赤散涼驚丸以治心肝如法而愈一小兒潮熱自申酉時熱至子丑時方止遍身似疥大便祕結小便赤澀熱渴飲冷此脾胃實熱而傳肺大腸也先用清涼飲四劑結熱始退又用四物加柴胡黃連數劑其瘡漸愈彼欲速效另用槐角丸之類諸症益甚遂請施院長治之亦同余藥惟加桃仁赤芍二味至百劑乃愈一小兒先停滯飲食服尅伐之藥致面色痿黃體倦少食申酉時潮熱余欲用調補之藥不信更用清熱消導益加泄瀉余用六君子數劑又用補中益氣湯而愈一小兒酉戍時熱面赤腹中作痛按之益甚服峻厲之劑下五七次發搐吐痰作渴腹痛按之却不痛此脾胃復傷而變症也用七味白术散補中益氣湯頓安一小兒飲食停滯服消導之藥余曰此因脾胃虛而食停滯也當補脾為善已而申酉戍時潮熱食少作渴大便不實用四君子湯而飲食進又用補中益氣湯而諸症愈若亥子丑時微搐身體發熱目睛緊斜喉中有痰大便白色多睡不省當用益黃散以補脾導赤散涼驚丸以治心薛按前症屬形病虛寒宜用六君子加炮薑溫補脾土用清心安神丸六味丸調補心血潔古張先生云此症皆因大病後脾胃虧損所致其旨明矣若非六君子湯以固本必變慢脾風也朱監簿子五嵗夜半發熱曉則如故用涼藥解之反多涎喜睡大便青白作渴引飲師曰此當健脾胃則諸症退遂用白术散一兩水煎恣飲二劑稍愈三劑渴止涎消又投阿膠散二服而安愚治一小兒亥子丑時發熱泄瀉用益黃散而愈後復發服前藥嗜卧露睛作渴少食太便頻黃余謂肝勝脾虛元氣下陷用補中益氣湯佐以地黃丸而尋愈若傷風發搐口中氣熱呵欠頓悶手足動搖當以大青膏發之薛按潔古先生云傷風發搐當辨有汗無汗用大青膏小續命湯竊謂前症若口中氣熱搐而有力屬形病俱實宜用大青膏以散風邪若口氣不熱搐而無力屬形病俱虛宜用異功散以補脾土六味丸以滋肝木釣藤飲以清肝火若因風邪鬱熱而變見諸症當理肺經清風邪若外邪既解而諸症不愈當實脾土補肺金若徑治其肺恐脾氣復傷諸症蜂起矣一小兒傷風鼻塞流涕服藥過重發搐呵欠頓悶汗出氣喘久不愈其母因勞役發熱余用補中益氣湯時以五七滴與兒飲之母子並愈一小兒傷風發搐痰盛喘急余謂此脾肺氣虛腠理不密而外邪所乘用六君加柴胡升麻桑皮杏仁一劑痰喘悉退又一劑去桑杏加釣藤鈎而安乃用異攻散數劑後不復發此症若不補脾胃腠理專治痰邪鮮有不誤若傷食後發搐身溫多睡或吐不思食者宜先定搐搐止用白餅子下之後用安神丸主之薛按前症若飲食停滯嘔吐不食腹脹便祕者屬實熱宜用白餅子下之若下後搐熱益甚嘔吐不食者屬虛熱用異功散補之若脾胃既傷肝木所勝用六君加釣藤鈎以健脾氣平肝木大凡飲食既消而不愈者但調補脾胃則諸邪自退矣一小兒七嵗發熱驚悸服袪風化痰藥更惡寒吐痰喘嗽腹痛少食又服抱龍丸大便似痢寒熱往來殊類風症先兄以為脾氣本傷藥復損之諸經無所資養而然也用四君子湯少用升麻柴胡以升補陽氣而愈一小兒傷食發熱抽搐嘔吐氣喘痰嗽屬脾肺氣虛以六君子加炒黑黃連山梔各二分一劑而頓安一小兒三嵗停食吐瀉或用尅滯之劑更咬牙發搐面色青白鼻準青而兼黑手足指冷眉唇搐動此脾胃虛弱而肝木乘之用六君子加木香柴胡升麻二劑頓安百日內發搐真者不過兩三次必死假者頻發不死真者內生驚癎假者外傷風冷血氣未實不能勝任故發搐口中氣熱用大青膏塗𩕄浴體二法薛按前症多因胎中受患或乳母鬱怒傳兒或兒脾傷自病當固元氣為主而兼調治其母仍參吮乳不能類治之後倣此李司户孫百日發搐日三五次或作胎驚治之不應即用大青膏豆許并塗𩕄浴體二法三日而愈蓋嬰兒血氣未實不能勝外邪而發搐故用浴體法凡搐頻者風在表易治宜發散搐稀者風在臟難治宜補脾愚治一小兒百日內患抽搐痰涎自流用驚風藥益甚視其面色黃白仍用六君子補中益氣二湯而愈一小兒面青黑或痿黃審其母素有鬱怒所致用加味逍遙散加味歸脾湯治其母其子亦愈一小兒月內發搐鼻塞余以為風邪所傷以六君子加桔梗細辛子母俱服更以蔥頭七莖生薑一片細擂攤帛上兩掌護溫貼子𩕄間半晌鼻利搐止一小兒未兩月發搐嘔乳腹膨作瀉余以為乳多傷脾胃用五味異功散加漏蘆母服之子服數滴而尋愈癲癎症治凡治五癎皆隨臟治之每臟各有一獸之形並用五色丸治小病也發而重者死病甚者亦死若反折上竄其聲如犬症屬肝也若目瞪吐舌其聲如羊症屬心也若目直腹痛其聲如牛症屬脾也若驚跳反折手縱其聲如雞症屬肝也若肢體如尸口吐涎沫其聲如豬症屬腎也薛按妊娠若遇驚恐則必內應於胎故一月足厥隂脈養驚則肝受病二月足少隂脈養驚則膽受病三月手少隂脈養驚則心受病四月名為離經五月足太隂脈養驚則脾受病六月足陽明脈養驚則胃受病七月手太隂脈養驚則脈受病八月手陽明脈養驚則大腸受病九月足少隂脈養驚則腎受病是臟腑納氣於丹田自肝至腎十經滋養而生此則胎中所致也若既生之後或驚怪所觸或乳哺失節或乳母飲食起居六淫七情臟氣不平亦致是症須察見症屬於何經更别隂陽虛實以調補脾胃為主否則不時舉發甚至不救愚治一老生子周嵗秋初暴冷勿發搐似癎搐過則氣息淹淹此元氣虛弱所致用補中益氣湯而安一小兒十嵗一小兒七嵗各有癎症嵗發二次後因出痘及飲食停滯舉發頻數並用六君子補中益氣二湯頓安一小兒六嵗忽然發癎目動咬牙或睡中驚搐口流涎沫服化痰祛風之藥益甚而面色兼青乃屬肝木尅制脾土而不能攝涎故上湧也當滋腎水生肝血則風自息痰自消矣用六味丸而愈一小兒十三嵗因驚患癎服硃砂丸之類而愈後每發輒服前丸不應或謂風涎內積服藥下之發作日頻略服鎮驚等劑益甚余以為心脾二經氣血虧損而痰涎留滯朝用補中益氣湯夕用斷癎丹漸愈出痘瘡後其癎復作仍用補中益氣湯為主佐以八珍湯及蟬蛻釣藤飲而愈附面部三指診候圖小兒半嵗之間有病以名中食三指曲按額前眉上髮際之下若三指俱熱感受風邪鼻塞氣粗三指俱冷感受風寒臟冷吐瀉若食中二指熱上熱下冷名中二指熱夾驚之候食指熱胸膈氣滿乳食不消附附虎口三關脈症圖水鏡訣云隂陽運合男女成形已分九竅四肢乃生五臟六腑部位各分逆順難明若憑寸口之浮沉必乃橫亡於孩子須明虎口辨别三關消詳用藥必無差誤未至三嵗看虎口三關若脈見風關尚易治交氣關則難治交命關為死症又當辨其色如獸驚三關必青水驚三關必赤人驚三關必黑若紫色必瀉痢黃色是雷驚三關脈通度乃極驚之症必先有紋或青或紅如線直者是母食傷脾左右一樣者是驚積齊發紋有三條主肺傷風痰或齁䶎聲青主傷寒及嗽紅主瀉泄有黑相兼主下痢紅多白痢黑多赤痢有紫相兼虎口脈亂乃氣不和也蓋脈紋見有五色由其病甚色能加變至於純黑者不可得而治矣附五臟瘡疹證治小兒在胎食五臟血穢伏於命門若遇天行時熱或乳食所傷或驚恐所觸則其毒當出初起之候面燥腮赤目胞亦赤呵欠頓悶乍涼乍熱咳嗽嚏噴手足稍冷驚悸多睡宜究其何臟所發察其何因所起令乳母亦須節飲食慎風寒五臟各有一症肝臟水泡色青而小肺臟膿疱色白而大心臟斑色赤而小脾臟疹小次㿀故色赤黃淺也先發膿疱後發疹子者順先疹子後㿀子者順反此為逆惟腎無候但見骫冷耳冷是也若寒水來侮故黑陷而耳骫反熱為逆也急用百祥丸牛李膏各三服不愈者死如發潮熱三日以上出不甚多而熱不止者未盡也潮熱隨出如早食潮熱不已為水疱之類也一發便出盡者重瘡夾疹者半輕半重也出稀者輕裏外微紅者輕外赤裡黑者微重外白裡黑者大重也瘡端裡黑點如針孔者𫝑最劇也青乾紫陷昏睡汗出煩躁熱渴腹脹啼喘二便不通者困也有大熱利小便解熱毒若紫黑乾陷或寒戰咬牙或身黃腫紫者急以百祥丸下之復惡寒不已身冷出汗耳骫反熱者死症也此腎氣大旺脾虛不能制故耳下後身熱氣溫飲水者可治以脾土勝腎寒去而溫熱也不黑者不可下下則內虛歸腎大抵瘡疹屬陽在春夏為順秋冬為逆冬月腎旺盛寒病多歸腎變黑又當辨春膿疱夏黑陷秋㿀子冬疹子者十活四五黑者十難救一身熱煩渴腹滿而喘便澀面赤悶亂大吐此當利小便不瘥者宣風散下之若能食而痂頭焦起或未焦而喘實亦可下之若五七日痂不焦是內熱也宣風散導之生犀汁解之㿀疹作搐為脾虛而肝所乘心火妄動風熱相摶也當用括蔞湯瀉心肝補脾土瘡黑而便忽膿血并痂皮者乃脾氣實腎邪退而病安也及瀉而乳食不化者脾虛不能制腎故難治薛按痘疹大要與癰疽治法無異宜辨表裏虛實寒熱蓋表虛而用發表之劑輕則斑爛重則不能起發而死裡實而用托裡之劑輕則患痘毒重則喘急腹脹而死裡虛而用疏導之劑輕則難以貫膿結痂重則不能結靨落靨則死治者可不慎哉若臖赤發熱疼痛而作渴飲冷便祕此形氣病氣俱實也雖在嚴冬必用四順清涼飲以救其隂若黑陷不食嘔吐泄瀉寒戰咬牙手足逆冷此脾土虛敗寒水所侮也雖在盛暑必用六君薑附或十二味異功散以回其陽此內經捨時從症之法也若起發遲不紅活不作膿不結痂或發熱作渴飲食少思此脾胃虛弱也用參茋四聖散以補之若雖起而色白雖貫膿而不滿雖結痂而不落或癢塌作渴飲湯腹痛不食嘔吐泄瀉此脾胃虛寒也用十一味木香散以溫之其在四五日之間死者毒氣盛真氣虛而不能起發也六七日之間死者元氣虛而不能貫膿也旬日之外死者邪氣去脾胃敗而元氣內脫也治者但能決其死而不知其死必本於血氣虧損茍能逆推其因而豫為調補豈斷無生理哉蓋起發貫膿結痂三者皆由脾胃榮養不可妄投尅伐之劑以致其夭枉也至於大人患此治法逈異昔丹溪嘗治一老人初患痘昏憒不知極用大補四十餘劑遂出痘而愈觀此可見陸親一大王病瘡疹先用抱龍丸解之彼另用藥下之其疹稠密余曰瘡疹始出未有他症但用平和之藥解之如三日不出或出而不快宜微發之更不出當再發之出而不多脈平和無他症者瘡本稀少不可更發若瘡起發能食者大黃丸下一二行若初起就用下劑則裏虛瘡不能盡出而稠密難治至三日其瘡黑陷喜不寒戰遂用百祥丸牛李膏各一服瘡復紅活而愈蓋黑者歸腎也腎旺勝脾故脾虛寒戰則難治所用百祥丸瀉膀胱之邪自不盛也五大尉因墜鞦韆患急驚發搐或用表散之藥不愈此急驚當先退其熱以大黃丸玉露散惺惺丸加牛黃丸麝解之至三日肌膚尚熱余曰再二日不愈必發㿀瘡已而果然用必勝散七日而愈此乃初因誤發其表內熱不止而㿀自生也十太尉瘡疹未出呵欠頓悶驚悸乍涼乍熱手足冷面腮赤咳嗽時嚏此五臟症具也以其别無他候故未發出若已出則歸一臟也用抱龍丸數服瘡疹出而諸症愈治見校注痘疹方丹瘤丹瘤之症因熱毒客於腠理搏於氣血發於皮膚當以白玉散塗之薛按前症或命門所稟或風熱相摶或頻浴熱湯或頻著烘衣或傷食發熱或乳母膏粱厚味七情鬱火皆能致者其赤暈遊走者乃血隨風熱者若稟胎毒用化毒丹風熱者敗毒散頻浴烘衣者四物連翹山梔飲食發熱者四君柴胡神麯母食厚味者加味清胃散母有鬱火者加味逍遙散俱加漏蘆母子俱服白玉散其性太寒能解熱毒若毒發於四肢而輕淺者宜用若延及胸背脅腹者為重須用活命飲令人用力於各患處遍吮毒血各聚於一處急砭出之若肚腹膨脹二便不通毒入內也用大連翹飲亦有生者愚治史少參孫丙申正月隂囊赤腫余作胎毒治之而瘥後患發熱痰熱等症診其母有鬱火血熱用解鬱涼血之藥子母俱服而愈至六月初患吐瀉小便赤澀兩眼瞤動投參术之類不應或以為慢驚余視其寅卯關脈赤當屬風熱用柴胡清肝散加鈎藤鈎木賊草一劑即愈至丁酉正月頸患熱毒潰而膿出感風發熱翌日頭面黯腫如斗急砭出黑血二盞許隨用清熱化毒湯腫退七八翌日又砭各處血不甚黑仍用前藥去牛蒡子加熟地黃而愈此症若砭緩則血凝滯或為破傷風而死一小兒患之外勢雖輕內苦便閉此患在臟也服大連翹飲敷神功散而瘥一小兒臀患之赤暈走遍令人頻吮使其毒各聚一處乃砭出黑血塗以加味神功散時以金銀花甘草節為末人乳汁調服而愈月餘後兩足赤腫仍治以前法而痊數日後兩足復赤或用犀角解毒之類乳食不進肚腹膨脹此復傷脾胃也乃敷前藥服補中益氣湯加茯苓而瘥神功散甚效但砭處微痛用太乙丹亦效一小兒腿患之神思如故乳食如常此毒發於肌表余謂宜砭泄其毒不必服藥不信外敷寒涼內服峻厲致腹膨脹乳食不進而歿夫寒涼外傷脾氣峻劑內傷生氣不死何俟一小兒兩足常患腫似丹毒而不臖發飲水痰盛兩頦赤色先兄以為稟腎經虛火用地黃丸料母子俱服而愈一小兒兩足生瘡疥赤暈如丹久而不愈亦用地黃丸而痊一小兒腿如霞遊走不定先以麻油塗患處砭出惡血其毒即散更用九味解毒散一劑而安一小兒因母酒後飲其乳因睡不醒遍身如丹瘤狀余以為酒毒傳兒為患令母子俱服葛根解酲湯而愈一女子赤暈如霞作癢發熱此肝經血熱用小柴胡加生地連翹丹皮而愈凡女子天癸將至婦人月經不調被驚著惱多有此症亦治以前藥傷風兼變症治二傷風貪睡口中氣熱呵欠頓悶用大青膏發散之若飲冷不止而善食者用大黃丸微下之餘不可下也傷風手足冷者脾臟怯也當以益黃散溫脾胃以大青膏散風邪傷風自利脾臟虛怯也亦用益黃散大青膏未瘥用調中丸有下症用大黃丸後服溫驚丸傷風腹脹或作喘脾臟虛也當先發散仍補脾傷風兼肝則發搐頓悶兼心則驚不安兼肺則喘嗽哽氣兼脾則困睡兼腎則目畏明各隨補其母傷風多睡能食引飲吐瀉大便色黃此胃虛熱也當先用白术散以生津後用大青膏以發散傷風吐沫瀉色青白悶亂不渴哽氣出氣睡而露睛先用益黃散後用大青膏傷風或涼或熱多睡氣粗大便黃白嘔乳不消不時咳嗽先用大青膏後服益黃散慎不可下傷風誤用下藥而作渴飲水者此胃無津液而虛熱也多用白术散熱渴自止薛按大青膏乃表散之劑必外邪藴結於肺而肺氣未虧損者方可用之大黃丸乃疏利之劑其食痰積滯於胃而胃氣尚充實者乃可施之况前症屬脾肺氣虛腠理不密外邪所乘又當臨症制宜必以固脾胃為主若兼肢冷自利腹脹喘嗽者脾肺虛寒也六君子加木香升麻桔梗若兼驚悸痰甚飲食少思屬心脾臟虛也四君加芎歸酸棗仁若兼肢體倦怠喘嗽哽氣脾肺氣虛也六君當歸桔梗若兼目畏明白睛多腎氣虛也六味丸加五味鹿茸如未應更用補中益氣湯加五味子乾山藥以補腎母若多睡能乳飲水吐瀉大便色黃脾氣虛而下陷也補中益氣湯升補元氣若吐沫瀉青睡而露睛脾虛木所乘也六君子加升麻柴胡調補脾氣若乍涼乍熱喘嗽氣粗大便黃白嘔乳不消脾肺氣虛而有邪也先用惺惺散後用四君子湯若誤用下藥而作渴者脾胃之氣傷也用白术散或六君子補中益氣二湯補之大凡前症若病邪急而元氣無虧者先用原方或用輕清表散之劑若元氣不足者當如前法固其元氣則外邪自退若因病久或因服尅伐之藥而未愈或更加變症者但調補脾胃諸症自愈其小兒傷風發熱鼻塞或痰壅發搐多因乳母鼻吹𩕄門但服惺惺膏或用蔥頭三五莖細切擂爛以紙寸餘攤蔥在上兩掌合蔥待溫貼於𩕄門其邪即解乃去其蔥却用絹段寸餘塗以麵糊仍貼𩕄門永無傷風之患吳江史安卿子傷風用表散化痰之藥反痰盛咳嗽肚腹膨脹面色㿠白此脾肺俱虛用六君子加桔梗一劑頓愈至三日前症又作鼻流清涕此復傷風寒也仍用前藥加桑皮杏仁而愈史玄年子喘嗽胸腹膨脹泄瀉不食此飲食傷脾土而不能生肺金也用六君子湯一劑諸症頓愈史孔修子六嵗感冒咳嗽發散過度喘促不食痰中有血余曰此成肺癰也次日吐痰而兼膿用桔梗湯而愈後元氣未復大便似痢或以為痢用五苓黃連枳實之類痰喘目劄四肢抽搐此脾敗而變慢脾風也果歿諸經發熱症治三潮熱者時間發熱過時即退來日依時而發此欲發驚也壯熱者常熱不已甚則發驚癎也風熱者身熱而口中氣熱乃風邪外感也溫壯者肢體微熱也發熱而不欲飲水者胃氣虛熱也用白术散發熱而飲水作渴喜冷飲食者胃氣實熱也用瀉黃散薛按祕藏保嬰集云小兒潮熱或壯熱不退多是變蒸及五臟相勝不必用藥又多食積鬱熱由中發外見於肌表只理其中清陽明之熱而表熱自除不可認作外感用小柴胡輕利等藥重傷其內又潮熱不退恐是出痘亦當審察勿便用藥竊謂發熱飲水者熱在內不飲水者熱在外也又當以此辨之其諸熱症説見各類朱監簿子五嵗忽發熱腮唇色赤煩躁飲熱或用牛黃丸及一物瀉心湯加倦怠不食便利黃水師謂心經虛熱而誤下之也先用白术散以生胃中津液後用生犀散以治心經虛熱再與胡黃連丸而愈鄭人齊姓者子忽臟熱症自用青金膏三服連瀉五行加困睡發驚再一服又瀉二行益加口乾身熱虛羸師先煎白术散與時時服之後用香瓜丸而愈曹宣德子三嵗面黃時發寒熱不食飲水或用牛黃麝香二丸不愈用止渴乾葛散反吐師謂食伏於胃脘先以白餅子下之又以消積丸磨之而愈愚治一小兒先壯熱便祕服清涼飲之類愈而復作服地骨皮散而潮熱不已服四物芩連之類不時而熱甚余曰不時而熱或晝見夜伏晝伏夜見是虛火也當滋化源不信仍服寒涼愈甚余夕用六味丸加五味子朝用補中益氣加山藥山茱萸而瘥一小兒五嵗發熱作渴右腮鼻凖微赤或與冷冰涼藥即時嘔吐余曰右腮微赤肺經虛熱也鼻凖微赤胃經虛熱也此胃虛不能生肺耳先用四君子加升麻三分一劑而不吐又用白术散二劑而不渴再用四君子四劑而頓安一小兒發熱作渴用瀉黃散大便重墜口角流涎仍欲瀉火余曰鼻凖青白脾虛肝木所侮也口角流涎胃氣不能攝涎也大便重墜脾氣不能升也不信另服涼劑果眉唇微動四肢微抽余曰此元氣虛極而變慢脾風也用六君子加炮薑當歸木香鈎藤鈎二劑益甚彼欲更劑余曰此藥力不及也設藥不對其症禍在反掌仍以前藥加炮附子一片服之即安乃去附子又二劑而愈薛氏醫案卷五十
