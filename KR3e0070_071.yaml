body:
  text: 薛氏醫案卷七十一明薛已訂保嬰撮要十六不靨悶亂哽氣腹脹之症陳文宿先生云痘瘡十一日至十二日當靨不靨身熱悶亂不寧卧則硬氣腹脹泄瀉寒戰咬牙急用異功散加木香當歸以救隂陽表裏助其収靨竊謂前症若手足並冷屬脾胃虚寒宜用十二味異功散手足㣲冷屬脾胃虚弱宜用五味異功散加木香若手足熱大便秘屬脾胃實熱宜用清涼飲救其隂以抑其陽一小兒痘寒戰咬牙瀉渇腹脹手足冷時仲夏飲沸湯口不知熱先君謂脾氣虚寒用十二味異功散一劑頓安又用五味異功散調補而愈再用參茋四聖散而愈一小兒痘不結痂發熱飲湯哽氣腹脹此脾氣虚弱用五味異功散參茋四聖散而愈後噫氣下氣欲服枳殻之類余謂噫氣屬心火虚下氣屬脾氣虚朝用六君子湯加薑桂夕用補中益氣湯而愈一小兒哽氣喘咳腹脹下氣手足不冷不熱此脾虚不能攝氣而腹脹下氣肺虚不能攝氣而哽氣喘咳用五味異功散加升麻而愈一小兒痘將愈足冷哽氣腹痛手冷至臂唇青面白屬脾胃虚寒也用五味異功散加附子二劑足稍温又用六君薑桂二劑諸症漸退乃去薑桂服之而痊一小兒痘不結痂作渇飲冷大便秘結此腸胃有熱也先用清涼飲末一錢大便和而頓靨又用人參麥門冬散八珍湯而痊一小兒痘不結痂用補中益氣湯地黄丸料煎服而愈次年畢姻後寒熱作渇頭運脉洪數按之㣲細此脾腎虚火上炎也以前藥各加肉桂五分引火歸經而愈一小兒痘不靨發熱因乳母有肝火用加味逍遥散人參白术散母子俱服而熱止又用柴胡麥門冬散而痊一小兒十五歲乆而結痂寒熱往來脉洪數按之無力用十全大補湯而痊後因勞寒熱復發用補中益氣湯而安六君子湯治脾氣虚弱或因尅伐之劑虧損中氣飲食少思或痘瘡不起發灌漿結痂人參白术炒茯苓陳皮炒半夏湯洗甘草炒各等分右三五錢薑棗水煎徐徐服四君子湯即六君子湯去陳皮半夏四順清涼飲王海藏先生云痘疹膿貫而不焦者由治失清涼之法内外熱毒無以收歛辟如五榖得陽氣而成熟得陰氣而成實用清涼飲子下之方見大便不通十二味異功散方見頂陷灰白人參麥門冬散方見發熱口渇柴胡麥門冬散方見作痒搔破加味逍遥散方見欲靨不靨補中益氣湯五味異功散二方見寒戰咬牙參茋四聖散十全大補湯二方見腹脹氣促人參白术散即七味白术散地黄丸二方見發熱屬隂陽兩目生翳痕黯凹凸之症陳文宿先生云痘瘡十二日至十三日瘡痂漸落其瘢猶黯或凹或凸肌肉尚嫩不可洗澡并忌五辛煎􅏼之物恐熱毒上薰肝膈眼生瘴翳或有是患用糓精草散治之竊謂前症目為肝之竅或肝經風熱或肝經血虚或肝經熱毒或肝經寒熱相摶或肝疳内熱或乳母肝經有熱或食膏粱厚味故多犯其目若失扵早治多成廢疾一小兒出痘兩眼不開先君謂肝經有熱用消毒化癍湯母子服之而愈一小兒兩目不開先君謂肝經熱毒先用柴胡麥門冬散又用四物湯加山梔而愈一小兒痘瘡目赤腫痛此肝火為患用柴胡麥門冬散榖精散而愈一小兒痘將靨目不開脉浮而無力右闗按之緩弱此脾氣虚耳用補中益氣湯加蔓荆子二劑去蔓荆子又數劑而愈後每勞役目中作脹不能開合朝用補中益氣湯夕用五味異功散而愈一小兒眼痛不開屬肝經風熱用柴胡麥門冬散犀角地黄湯加柴胡各一劑開而見赤翳迷漫仍用前藥加穀精草而愈一小兒出痘目閉二十餘日用清肝解熱之藥兩目雖開其睛已傷此失於早治也一小兒目中出痘作痛肝脉弦洪有力先用小柴胡加龍膽草生地黄一劑而痛稍止乃用四物柴胡山梔一劑痛全止再用加味逍遥散蟬菊散而愈一小兒目中出痘肝脉弦數此木火相摶用四物山梔牡丹皮柴胡二劑再用加味逍遥散二劑肝脉平和又用四物牡丹皮而靨但目有青翳用蛇蛻散三味精草散而痊一小兒素食膏粱目中出痘作痛口渇大便堅實左右關洪數有力弦長此形病脉俱實先用柴胡梔子散瀉黄散各一服又用柴胡梔子散柴胡麥門冬散而痊一痘兒眼不開肝脉數按之有力同柴胡梔子散子母服之眼漸開又因母勞怒仍閉用加味逍遥散而愈後復閉用柴胡麥門冬散而痊一小兒目中生翳診其肝腎疳症用九味蘆薈丸六味地黄丸及粉丹散翳漸退又用柴胡麥門冬散而痊羊肝散治痘毒入眼或無辜疳入目宻䝉花青箱子决明子車前子右為末用宻䝉花末三錢餘藥各一錢以羊肝一葉薄批摻上濕用紙裹煨熟空心食之蛇蛻散治痘毒目翳蛇蛻二錢為末𤓰蔞仁五錢研爛右為末用羊肝一片批開入末二錢用線紥𦂳米泔煑熟頻與兒食外用粉丹散三味穀精草散治痘疹翳膜遮睛瘴瞳子穀精草一兩蛤粉黑豆各二兩右為末用雄猪肝一葉竹刀批開摻藥在内以麻線縳定砂礶内水煑熟令兒食之蟬菊散治癍痘入眼或病後生翳障蟬蛻洗白菊花各等分右每服一錢水煎入蜜少許量兒服二味穀精草散治痘瘡已靨目翳膜障瞳神隠澁淚出乆而不退穀精草一兩生蛤粉二兩右為末用獖猪肝一葉竹刀批片子摻藥在内以綿扎入砂器内水煑令兒熟食之粉丹散即吹耳丹治眼生翳膜輕粉黄丹右為末竹筒吹耳内左眼有翳吹右耳右患吹左耳即退通神散治癍瘡入目内生翳障白菊花菉荳末生用穀精草各等分右為末每服一錢乾柿一箇米泔水一盞煑乾末不拘時但食柿餅五七次至七日可見效黄柏膏治痘瘡初出就塗面則痘瘡不生於面目用之若遲雖出亦稀黄栢一兩菉豆甘草各四兩生用右為細末清油調如膏従耳前眼唇面並塗之日三五度羊肝丸治痘瘡入目不能開羯羊肝一具生用黄連炒為末右先將羊肝去筋膜於石器内搗爛入黄連末丸如桐子大毎服二三十丸食後清茶送下蟬蛻散治癍疹入目半年已過者一月取效蟬蛻一兩猪懸蹄甲二兩瓦罐内用鹽泥封燒存性右二味為末入羚羊角末五錢每服五分白湯調下九味蘆薈丸治肝經積熱面目生翳耳中出水大便不調肢體消瘦等症方見疳蝕症小柴胡湯方見瘢症柴胡麥門冬散方見作痒搔破四物湯方見痘瘡出遲六味地黄丸方見痘瘡發熱屬隂屬陽瀉黄散方見靨後發熱咽痛消毒化癍湯即消毒救苦湯方見夾疹痘加味逍遥散方見欲靨不靨柴胡梔子散即柴胡清肝散方見作痒搔破補中益氣湯五味異功散二方見寒戰咬牙一名小異功散靨後發熱咽痛不利之症陳文宿先生云痘瘡收靨之後渾身壯熱經曰不除别無他症用柴胡麥門冬散如不退服人參白术散若風熱咳嗽咽喉不利用桔梗甘草防風湯竊謂前症有因熱毒未解者有因胃氣虚熱者有因胃氣實熱者其因不能枚舉當臨症制宜而藥之一小兒咽痛壯熱痘痕色赤手㣲熱此餘毒未解用柴胡麥門冬散而安七日之後復熱手指初揑似熱久揑則冷此脾氣虚也用五味異功散而痊一小兒痘咽痛大便不實口渇飲湯手足不熱此脾胃虚弱也用人參白术散而大便實但不時寒熱用加味逍遥散而愈一小兒痘咽痛發熱作渇面赤飲冷此胃經實熱也用射干鼠粘子湯而愈因食厚味復發手足並熱用㵼黄散一劑而痊一小兒痘咽痛發熱飲冷大便黄色手足指熱此脾胃實熱也用㵼黄清胃二散各一劑而愈後因乳母食厚味兒口角流涎不能吮乳仍用前藥治母而愈一小兒痘咽痛足熱余謂此禀足三陰虚而無根之火上炎也古人有云痘歸腎經必不可救當用壯水之劑亦有生者奈彼不悟翌日果腰痛咽啞始信余言乃用大劑地黄丸料加五味子并補中益氣湯而愈一男子出痘上體甚熱兩足俱冷喉痛作渇瘡亦不起發此禀腎經虚熱也以六味地黄丸料煎與恣飲漸愈又用八珍湯而痊一小兒面色素白出痘咽痛發熱面赤作渇飲湯手足指冷此禀足三陰虚也用大劑加減八味丸料煎與恣飲又以益氣湯助其脾肺以滋化源痛止熱退而愈射干鼠粘子湯治痘疹咽喉作痛及痘疹後癰疽瘡毒鼠粘子即牛蒡子甘草升麻射干各二錢右水煎量服之瀉黄散治脾胃實熱患瘡口渇飲冷藿香葉七葉石膏煅五錢甘草三錢防風山梔仁炒各一兩右為末每二錢水煎入蜜少許嬰兒乳母服之六味地黄丸方見痘瘡發熱屬隂屬陽清胃散方見痘不結痂八珍湯方見頂陷灰白人參白术散即七味白术散屬隂屬陽方見痘瘡發熱柴胡麥門冬散方見作痒􅎲破加減八味丸即六味丸加五味子肉桂加味逍遥散方見欲靨不靨五味異功散補中益氣湯二方見寒戰咬牙頂陷心煩狂躁氣喘之症陳文宿先生云痘紫色頂陷心煩狂躁氣喘妄語或如見鬼神内熱便秘者宜用龍腦膏子猪尾膏如無内熱大便不實不可輕服竊謂前症多因初起熱盛之時失於解利所致亦有因痘毒未盡有因胃經有熱有因肺胃有熱有因心脾有熱煩躁痘裂出血便血衂血屎黑痕赤詳見各症大凡作渇發熱手足指冷或大便秘結者内有熱也切不可禁其飲水觀張子和述水中兒事良可驗矣蓋熱極故得水而生也一小兒痘疹狂喘熱渇飲冷痰涎不利先君用十六味清膈飲犀角地黄湯而痊一小兒痘紫發熱小便不利手足發熱此肺經有熱用人參清肺飲小便隨利又用犀角地黄湯而靨一小兒痘紫作渇手足並熱余謂胃經有熱用竹葉石膏湯一劑諸症頓退而愈用人參白术散而痊一小兒痘紫作痛其頂欲陷發熱飲冷作渇痰喘小便秘結此肺胃有熱用十六味清膈散一劑諸症頓減又用葛根麥門冬散一劑而愈一小兒出痘發狂作渇飲冷此上焦熱熾也用黄連解毒湯芹菜汁而止又用紫草快癍湯將靨因間藥餌三日色黑倒靨用紫草散渇止又用人參白术散而痊一小兒出痘喘咳面赤其脉洪數右寸脉尤甚此心火尅肺金用人參平肺散以清心肺再用地黄丸以壯腎水喘嗽頓止一小兒痘將愈喘躁作渇面赤此禀足三隂虚也用地黄丸料數劑諸症稍可又佐以益氣湯諸症漸愈後因沐浴出汗仍喘咳煩躁面赤脉洪大按之如無此汗多亾陽也用當歸補血湯而愈畢姻後喘咳音啞用地黄丸益氣湯各百餘劑得逺幃幙而生一小兒痘愈後時發狂兼喘發過面色黄白手足並冷此脾胃虚弱也余用補中八珍二湯各三十餘劑或云當先降火邪而後補元氣乃服芩連朴硝之類汗吐不止而殁十六味清膈散治涕唾稠粘喘𠻳痰盛身熱鼻乾大便如常小便黄赤人參柴胡當歸芍藥知母桑白皮白术黄茋紫苑地骨皮茯苓甘草桔梗黄芩炒半兩石膏煅滑石右每服三錢薑水煎量服之葛根麥門冬湯治痘疹胃經熱甚頭疼悶煩或痘後餘毒麥門冬乾葛人參赤芍藥升麻茯苓各二分石膏末五分甘草二分右水煎服犀角地黄湯治鬱熱不解氣血湧為衂血或流入胃脘而吐血或餘血停滯面色痿黄大便色黑犀角生地黄白芍藥牡丹皮各一錢右水煎乳母同服人參平肺散治心火尅肺金傳為癰痿咳嗽喘嘔痰涎壅盛胸膈痞滿咽嗌不利人參陳皮甘草地骨皮茯苓各一錢知母青皮四分五味子炒一錢天門冬去心四分桑白皮右水煎徐徐服竹葉石膏湯治痘瘡胸中煩悶小便赤澁口乾作渇兼有赤癍又宜服犀角散方見泄瀉咬牙龍腦膏子治時氣踠痘瘡及赤疹子未透心煩狂躁氣喘妄語或見鬼神或已發而陷伏宜速治否則毒入臟必死生龍腦右研細滴雄猪心血丸菉豆大每服一丸心煩狂躁紫草湯下瘡陷伏温酒化下一方加辰砂五分尤妙服後少時心神清爽得睡瘡疹發透猪尾膏治痘瘡黑陷倒靨用小猪尾尖刺血兩三㸃入腦子少許辰砂末一錢同研膏以木香湯化下紫草快癍湯治痘疹下血不止不能發出血氣不足色不紅活等症即紫草湯紫草人參白术茯苓當歸川芎芍藥木通甘草糯米右每服二錢水煎人參清肺散方見痘喘八珍湯方見頂陷灰白瀉渇黄連解毒湯方見癍症地黄丸即六味地黄丸人參白术散即七味白术散隂陽二方見發熱屬補中益氣湯當歸補血湯二方見寒戰咬牙作痒抓破膿水淋漓之症陳文宿先生云痘瘡作痒抓破成瘡膿水淋漓者由血氣衰肌肉虚也宜用木香散加丁香肉桂及敗草散切忌用牛糞灰竊謂前症皆因氣血虚弱所致預為調䕶使氣血和平庻無此患又必察其外症色白者用四君之類色赤者用四物之類若因醎味宜用蟬蛻散之類一小兒口乾作渇脉浮而數此血氣虚而有熱也用參茋四聖散加蟬蛻而痒止用托裡散加蟬蛻而膿貫又用托裏散將靨忽發熱作渇而痒此血虚也用八珍湯當歸補血湯而愈一小兒痘赤作痒脉弦按之則數此乃肝火血燥生風先用柴胡麥門冬散加蟬蛻而痒止又用托裏散而痂脫後仍痒痕白用八珍湯倍加參茋而愈一小兒痘瘡作痒色赤心肝二脉數而弦此風熱相持而血熱也用四物黄連柴胡丹皮而痒止用八珍湯當歸補血湯而瘡愈一小兒痘後作痒夜甚不寐此脾經氣血俱虚用四君歸茋數劑而止後傷食作瀉復痒不寐仍用前藥及五味異功散而愈一小兒痘瘡愈後身痒膿水淋漓内熱口乾用四君歸茋及補中益氣湯并六味地黄丸而愈一小兒痘痕作痒服祛風藥遍身皆痒膿水淋漓口禁發搐面色皎白此氣血俱虚余用大補湯參芪四聖散而愈一小兒痘瘡已愈而犯色慾遍身作痒痘痕赤色氣息淹淹脉洪數無力左尺為甚先用大補湯内用人參五錢數劑形氣稍復佐以大劑加料八味丸料又五十餘劑而痊一小兒痘將靨身痒脉浮數按之無力此真氣不能榮於腠理用補中益氣湯漸愈因功課勞心自汗用六一湯而愈後煩躁面赤自汗如雨用當歸補血十全大補二湯而愈一小兒汗出如雨手足發熱作渇飲冷右闗洪數有力此胃經實熱也用清胃散一劑頓退因食膏粱復痒發熱飲冷用瀉黄散末一錢渇止又用白术散去木香而痊一女子靨後身痒脉浮大此脾肺氣虚也朝用補中益氣湯夕用黄茋六一湯而愈經行復痒發熱用加味逍遥八珍湯而痊一男子痘愈而入房身痒昏憒脉大而無倫次按之如無用獨參湯十五劑而甦又大補湯二十餘劑脉歛又二十餘劑脉㣲細而畏寒此火歸經又五十餘劑而痊一婦人痘方愈因勞發痒服消風散口噤流涎余謂曰此因元氣復傷不信仍服前藥更四肢發搐余用十全大補加味逍遥而愈一小兒痘愈後作痒服消風散四肢發搐口噤流涎余謂脾土虧損而肝木所尅果殁一小兒痘膿未滿面赤作痒余謂氣血虚而有熱欲行温補不信乃服清熱之藥而殁柴胡麥門冬散治肝膽經有熱靨後不解柴胡麥門冬各一錢人參𤣥參龍膽草各五分甘草炒右水煎量兒大小服參茋四聖散治痘瘡不能長滿生膿或色白作痒方見腹脹氣促五味異功散治禀賦元氣虚弱肌肉消薄榮衛短促而患瘡瘍不䏻消散或脾肺氣虚不能生肌収口大凡諸症因脾氣虚而不能愈者皆宜服之調補元氣則自愈矣方見寒戰咬牙黄茋六一湯治瘡瘍後氣虚作渇愈後復渇尤宜服之黄茋炙六錢甘草炙一錢右水煎服柴胡梔子散治肝膽經有熱瘡毒不愈或發熱不止柴胡牡丹皮山梔各一錢川芎芍藥茯苓各七分白术炒甘草各五分當歸牛蒡炒各七分右水煎母子同服十全大補湯獨參湯參茋四聖散治痘瘡不起不能長滿生膿或作痒三方見腹脹氣促補中益氣湯治痘瘡中氣虚弱或因尅伐以致身痒惡寒發熱煩渇體倦飲食少思或不能結痂作痒者當歸補血湯二方見寒戰咬牙加味逍遥散方見欲靨不靨四君子湯方見不靨悶亂六味地黄丸方見痘瘡發熱屬隂陽四物湯方見痘瘡出遲托裏散方見痘癰八珍湯即四君四物二方相合瀉黄散方見靨後發熱咽痛加減八味丸即六味加用五味子肉桂肉清胃散方見痘癰風邪摶於肌肉患疳蝕之症陳文宿先生云痘疹已靨未愈之間五臟未實肌肉尚虚血氣未定忽被風邪摶扵肌肉膚腠之間則津液澁滯故成疳蝕瘡也宜用雄黄散綿繭散治之久而不愈則潰蝕筋骨以致殺人竊謂雄黄散清肝殺䖝解毒綿繭散治膿水淋漓皆治外之良方内無餘毒者宜用此法若因肝脾疳火上炎或食甘肥而胃火内動或手足陽明經藴熱或腎經虚熱各有不同皆元氣不足病氣有餘乗虚而發也焮痛作腫用仙方活命飲大蕪荑湯疳熱為患用大蕪荑湯四味肥兒丸腎經虚熱用地黄丸當臨症制宜分五臟相勝審乳母之氣何如扶助胃氣為善一女子患疳症因浴熱湯發熱如炙體强如痓此腠理間泄邪熱乗虚而内作用十全大補湯一劑頓安同時亦有患此症不用補劑者甚至不救一小兒痘後遍身津淫作痒此兼因疳為患用大蕪荑湯及蟾蜍丸而愈後作渇口中作痛用蟾蜍丸人中白散而安一小兒痘後毒蝕腮余謂肝脾有熱助疳而患也用大蕪荑湯大蘆薈丸為主以五味異功散為佐月餘漸愈却以五味異功散佐以大蕪荑湯而痊一小兒臀間痘毒蝕爛略敷雄黄散益甚余謂兼肝脾疳也先用大蕪荑湯活命飲各二劑又用九味蘆薈丸為主以五味異功散為佐月餘諸症漸愈一小兒患前症發熱作渇兩足晡熱余謂禀腎經隂虚不信恪服清熱敗毒而殁一小兒痘出甚宻先四肢患毒膿潰而愈後口患疳涎蝕牙齦余先用大蕪荑湯活命飲各一劑又用蟾蜍丸人中白散而安一小兒痘毒蝕陷敷雄黄散服加味解毒散而愈一小兒臉患之作痛用仙方活命飲又敷雄黄散大蕪荑湯而愈韶粉散治痘瘡毒氣未散瘡痂雖落其瘢猶黯或凹或凸此藥塗之韶粉一兩輕粉一兩右煉猪脂油拌匀如膏塗之如痘痂欲落不落當用後方羊􅀈骨髓右入輕粉研成膏塗之如痘痒搔成瘡及瘡痂欲落不落用上等白蜜塗之其痂自落亦無瘢痕神效雄黄散治痘毒牙齦生疳蝕瘡雄黄一錢銅緑二錢右硏細量瘡大小乾摻綿繭散治痘毒蝕瘡膿水不絶出蛾綿繭不拘多少右用生礬末碎貫繭内以炭灰燒礬汁乾取出為末乾貼之九味蘆薈丸治痘毒成疳齒蝕爛齦或透頰顋或肝脾疳熱結核耳内生瘡兩目生翳耳中出水或小便出津抝中結核或大便不調肢體消瘦等症胡黄連宣黄連炒蘆薈木香白蕪荑炒青皮白雷丸鶴虱草各一兩麝香三錢右各另為末糊丸麻子大每服五分空心米湯下仍量兒用之大蕪荑湯一名梔子茯苓湯治痘毒上攻口齒成疳發熱作渇大便不調髪黄脫落面黑便清鼻下生瘡乳食嘔吐等症山梔仁三分黄栢甘草炙各二分大蕪荑五分黄連麻黄根一分羌活二分柴胡三分防風一分白术茯苓各五分當歸四分右水煎服導赤散生地黄木通甘草各等分右為末每服一錢淡竹葉水煎敗草散治痘瘡撾搔成瘡膿血淋漓用屋爛草或蓋牆爛茅年逺者佳如無曠野生者尤佳為末搽之如遍身患者須多摻鋪蓆上令兒坐卧其瘡即愈丹粉散治痘毒膿水淋漓輕粉黄丹各二錢黄連末三錢右研匀搽患處立效散治一切胎毒瘡疥及風疹痛大黄黄栢山梔寒水石煅各等分右為末用清油燭調搽若破而膿水淋漓用當歸膏大楓膏治一切瘡疥黄連大楓子肉研膏各二兩真輕粉枯礬蛇床子各一兩桕油六兩右各另為末入大楓膏和匀更入桕油杵百餘即成膏矣每用少許塗患處加味小柴胡湯方見癍疹加味逍遥散方見欲靨不靨人參平肺散犀角地黄湯二方見頂陷心煩柴胡梔子散方見作痒抓破三黄散方見癍爛八珍散方見頂陷灰白地黄丸方見發熱屬隂陽十全大補湯方見腹脹氣促補中益氣湯當歸補血湯五味異功散竹葉石膏湯四方見泄瀉咬牙四味肥兒丸加味解毒散人中白散東垣消毒救苦湯四方見夾疹痘蟾蜍丸清胃散仙方活命飲三方見痘癰癍症陳文宿先生云癍疹之症俗言疹子是肺胃有熱或時氣所作發於皮膚遍體狀如蚊蚤所咬凡色赤者十生一死色黑者十無一生錢氏云癍症初發類似傷寒發熱五六日或七八日而出或乍涼乍熱或咳嗽泄㵼不食面赤眼光如水生眵或噴嚏痰涎或熱渇乾嘔或大便急而小便澁余竊謂前症若身熱煩渇者用升麻湯自汗煩渇者化癍湯煩渇熱瀉白虎蒼术湯熱盛譫語導赤散咳𠻳不已生地黄散吐血衂血或大小便血犀角湯喉間作痛甘桔防風湯咽喉腫痛𤣥參升麻湯乍涼乍熱小柴胡湯喘嗽不已柴胡五味子湯小便不利柴芩湯熱盛乾嘔解毒湯停食嘔吐或腹脹作瀉平胃散大便不通加枳實飲食已消或仍作嘔四君子湯大便秘或喘滿者先用前胡枳殻湯下之乃用春澤湯瘥後熱毒不除葛根黄連湯餘毒成瘡射干鼠粘子湯消毒飲又有夾痘而出者其勢最速乃血乗其勢而為患也如大便哽用清涼飲少許下之癍退四君歸茋固其元氣肢體疼痛用活命飲一服殺其毒氣仍用托裏散治之一小兒七日不消頭痛發熱防其内陷此表邪未解用葛根麥門冬湯一劑頓解再劑而痊一小兒惡寒發熱頭痛拘急先用人參羌活散一劑外邪頓散又用五味異功散而安一小兒月餘不消增實壯熱頭痛拘急此表邪未解也用人參敗毒散一劑而表邪退再用惺惺散而痊一儒者年踰二旬患前症煩渇飲冷用竹葉石膏湯化癍湯各一劑熱渇頓愈用快癍湯痘瘡頓起用八珍湯而痊一産婦患此乃風熱所致用惺惺散而風熱散用六味活血湯而瘡起發用八珍湯而痊一小兒患此鼻塞聲重發熱身痒用人參消風散而表症愈後發熱搔破膿水淋漓脉浮大按之無力此脾胃氣虚不能榮扵腠理朝用補中益氣湯夕用黄茋六一湯而愈後因感冐服表散之劑煩躁發熱面目俱赤脉大而虚用當歸補血湯而痊一小兒發熱作渇二便秘澁用大連翹飲二便隨通但嘔吐痰涎腹痛不食此邪氣去而眞氣復傷也用五味異功散而痊惺惺散治風熱時氣瘡疹頭疼壯熱目澁多睡咳嗽喘麄桔梗眞細辛人參甘草白茯苓川芎白术各五分薄荷右水一盞薑三片煎服黄連解毒湯治疹毒吐血乾嘔黄連黄栢黄芩梔子各三錢右水煎量大小服柴胡五味子湯治癍疹喘𠻳即小柴胡湯内加五味子小柴胡湯治癍疹乍涼乍熱似瘧喘嗽柴胡三錢人參黄芩各二錢半夏一錢二分甘草一錢右生薑三片水一盞煎至六分温服柴苓湯治痘疹小便不利柴胡黄芩猪苓澤瀉茯苓白术各一錢五分右薑水煎量大小服人參消風散治癍疹等症人參三錢荆芥穂甘草炙陳皮各五錢白殭蠶茯苓防風芎藭藿香蟬蛻各三錢厚朴薑製三錢羌活二錢右每服一錢水煎服人參敗毒散治癍疹發熱惡寒咳嗽等症人參茯苓川芎羌活獨活前胡柴胡枳殻麩皮炒桔梗甘草炒各等分右每服二三錢水煎生地黄散治痘疹煩熱咳嗽杏仁陳皮各一錢生地黄麥門冬各一錢半甘草五分右水煎服忌酒醋鹽酸之物白虎蒼术散治痘疹癍症𤣥參升麻湯化癍湯三方見水痘麻痘升麻葛根湯方見後乾葛麥門冬湯犀角湯二方見頂陷心狂快癍湯方見頂陷心煩六味活血散活命飲二方見痘癰大連翹飲春澤湯人參羌活散葛根黄連湯四方見夾疹痘五味異功散當歸補血湯補中益氣湯三方見寒戰咬牙黄茋六一湯方見作痒抓破竹葉石膏湯方見泄瀉咬牙射干鼠粘子湯方見靨後發熱桔梗防風湯方見痘寒戰前胡枳殻湯方見痘涕唾稠粘四君子湯方見不靨悶亂四順清涼飲方見大便不通水痘麻痘陳文宿先生云水痘之症身熱二三日而止或咳嗽面赤眼光如水或噴嚏咳唾稠粘與痘不同易出易靨不能為害湯民望先生云麻痘乃天行時氣熱積扵胃胃主肌肉故發扵遍身狀如蚊子所嚙色赤者十生一死色黑者十死一生此症亦與癍症不同其癍症如錦紋而但空缺處如雲路之狀麻症乃遍身而無空處但以疎宻之不同耳麻痘漸出咳嗽煩悶嘔逆清水眼赤咽喉口舌痘瘡用黄連杏仁湯若催出而成斑爛如錦紋或膿水腥臭心胸咳悶嘔吐清水不時身熱用黄芩知母湯初起發熱疑似之間可用升麻湯然麻症始終宜用麻黄湯表之痘症表與下皆不可大抵發熱煩渇用升麻葛根湯發熱咳嗽人參麥門冬湯發熱煩躁小便不通大連翹飲冬寒腠理閉塞葛根橘皮湯一小兒患之發熱作渇遍身作痛大小便乾澁此熱毒鬱滯於内用葛根麥門冬湯一劑頓安又用解毒散而愈一小兒患此身痛發熱煩躁此風邪摶扵表也用𤣥參升麻湯諸症頓解但倦怠發搐此脾虚為肝所侮也用和肝補脾湯而安一小兒患此腹痛煩渇面赤咳嗽痰涎用升麻湯一劑遍身如錦用化癍湯一劑而安又用人參麥門冬散而愈一小兒痘隱於肉裡而不現煩渇躁熱衂血吐血或便血用解毒湯犀角湯各一劑而血止又用導赤散而愈一小兒患此寒熱乾嘔先用小柴胡湯加生地黄而寒熱止用解毒湯而發用生料四物湯而全愈一小兒患此五日不消發熱煩躁右闗脉洪數而有力此胃經實熱先用化癍湯一劑又用參滑散而愈三豆飲治天行痘瘡始覺即服之多者必少少者不出小赤豆黑豆菉豆各一百粒甘草節五錢右水煑熟任食之七日自不發參滑散治水痘地骨皮麻黄去節一分人參滑石大黄煨一分知母羌活甜葶藶炒一分甘草炙半分右為末每服五分水一小盞小麥七粒煎數沸每服三五匙不可多服按前方發表散邪疏通内熱之峻劑若遍身作痛壯熱煩躁作渇飲冷大便秘結小便澁滯喘嗽等症宜用此方然水痘多屬表邪或發熱引飲小便赤澁者當用升麻葛根湯如無他症不必用藥和肝補脾湯治風熱瘡疹脾土不及肝木太過人參陳皮川芎各五分白术茯苓芍藥各七分柴胡甘草炙各三分山梔炒四分右作二劑水煎服白虎蒼术湯石膏四錢蒼术一錢五分知母一錢甘草五分粳米一撮右水煎服黄連杏仁湯治麻痘漸出咳嗽煩悶嘔逆清水眼赤咽喉口舌生瘡作瀉黄連一兩陳皮杏仁去皮尖麩炒麻黄去莭枳殻炒葛根各五錢右每服二錢作瀉者加厚朴甘草黄芩知母湯治麻症癍爛隠疹如錦紋或膿腥臭心胸閉悶嘔吐清水温壯不時葛根知母洗黄芩麻黄去節陳皮杏仁去皮尖甘草各等分右每服二錢若不嘔逆去陳皮加芍藥如吐則用之升麻葛乾湯治瘡疹初起發熱咳嗽似傷寒未辨麻疹白芍藥川升麻甘草乾葛各等分右水煎每服三錢化癍湯治癍疹渇熱最良人參知母各一錢甘草五分石膏末四錢右加粳米一撮水煎量服之葛根橘皮湯治發癍煩悶嘔吐清汁兼治麻痘等症葛根陳皮杏仁去皮尖麻黄去節知母炒甘草黄芩各半兩右每服二三錢水煎𤣥參升麻湯治癍疹已發未發或身如錦紋甚則語言煩躁喉閉腫痛𤣥參升麻甘草炙各等分右每服二三錢水煎服烏梅丸烏梅三十箇酒浸肉研爛細辛附子炮乾薑各一兩黄連一兩當歸蜀椒各四兩右為末烏梅肉與米飯和丸桐子大每服數錢白湯下羌活散即人參敗毒散加天麻地骨皮葛根麥門冬湯方見頂陷心煩解毒散小柴胡湯二方見癍疹四物湯方見癍痘出遲犀角湯方見頂陷心狂升麻葛根湯方見痘寒戰人參麥門冬湯一名麥門冬散方見發熱口渇大連翹飲方見夾疹痘導赤散方見疳蝕之症痘瘡生癰毒治之症陳文宿先生云痘疹首尾不宜與水喫若悞與之瘡靨之後其痂遲落或生癰腫鍼之而成疳蝕以致難愈蓋脾胃外主肌肉飲水過多濕損脾胃摶扵肌膚則津液衰少氣血不能周流凝結不散故瘡痂遲落而身生癰腫也張潔古先生云癰腫發於身前手陽明經也發扵四肢足陽明經也丹溪先生云痘癰多是餘毒血熱所致當分上下用藥而以涼血為主大便燥實加大黄如不應當分經絡所屬血氣虚實其膿成否竊謂前症初起未成膿者用活命飲隔蒜灸治而消之欲成膿者用四君子湯加當歸黄茋以補托元氣大凡痘瘡始末皆係脾腎之氣所主若飲食藥餌一有失宜必致多變他症凡扵飲食少思内熱晡熱者皆屬脾腎氣虚血弱之故也宜佐以四君子加川芎當歸黄茋升麻或飲食如常有發熱作痛亦屬氣血虚弱餘毒為患亦宜佐以射干鼠粘子湯若飲食如常發熱作痛大便秘結者係屬熱毒内藴宜用大連翹飲如或不應仍用仙方活命飲若根赤而作痒者是血虚也宜用四物湯加以牡丹皮色白而作痒者亦血虚也宜以四君子加當歸芍藥若色赤而作痛者是血熱也宜以四物湯加連翹與金銀花若腫而不潰者乃氣血兩虚之故也須用托裡消毒散若潰而不愈者皆因脾氣虚弱也宜用六君子湯以滋補之一小兒痘毒蝕陷敷以雄黄散及服加味解毒散而愈一小兒痘毒遍身腐潰膿水淋漓以經霜茅草研細末鋪於寢席之上令小兒睡卧於上更服九味解毒散頓愈又用神效當歸膏敷之而痊一小兒痘毒之後更患腿膝腫痛極甚此乃脾腎虚而毒流注宜先用仙方活命飲服服過四劑其腫痛頓減大半再用補中益氣湯及六味丸而痊一小兒腿膝腫潰膿水不止内熱晡熱體倦肌瘦余以為元氣復傷用八珍湯兼六味丸服三月而愈一小兒痘瘡已愈兩目昏閉余用鼠粘湯加山梔龍膽犀角目開而有赤白翳佐以蛇蛻散外用二粉散而安一小兒痘毒潰而腫不消煩躁作渇小便如淋手數尋空此肝脾虚熱也用八珍湯加減八味丸料各二劑而安又用大補湯而愈一小兒痘毒腿膝腫此脾腎虚而毒流注也用如聖餅及活命飲四劑腫痛頓減再用益氣湯地黄丸而痊一小兒腿膝腫潰膿水不止晡熱體倦先君謂元氣復傷陰虚所致用補隂八珍湯地黄丸而愈一小兒痘毒敷寒涼藥内潰不愈清膿甚多此元氣虚也朝用益氣湯夕用八珍湯各五十餘劑佐以豆豉餅而愈一小兒腮患毒用活命飲腫痛已退肢體甚倦此邪氣去而元氣虚也用聖愈湯元氣少復用托裏散而痊一小兒左耳下連項赤腫作痛此少陽膽經火症用梔子清肝湯治其母用活命飲治其子而痊後復作誤服敗毒散潰而不歛瘡口色白余用托裏散而痊一小兒出痘七日寒熱作渇兩脇及臂外患痘疔此屬膽經也挑出黑血以小柴胡湯加生地黄一劑熱渇頓止又用活命飲而痊一小兒患此面腫肉色如故脉浮而大按之㣲細余謂此元氣虚而邪従之也當補元氣為善不信反服犀角丸化毒丸而殁神效隔蒜灸法治痘癰大痛或麻木痛者灸至不痛不痛者灸至痛其毒隨火散用大蒜頭切三分厚安上用小艾炷於蒜上灸之每五壯易蒜再灸痛不止尤宜多灸小兒須將蒜切片着肉一面畧剜小空灼艾燃蒜先置大人臂上試其冷熱得宜然後着瘡上又别灼如前法試之以待相易勿令歇仙方活命飲治痘疔痘毒及一切瘡毒未成即消已成即潰此消毒敗膿止痛之聖藥金銀花陳皮各三錢皂角刺炒穿山甲用蛤粉炒乳香没藥白芷防風當歸各一錢貝母天花粉甘草節各七分右每服五錢酒煎嬰兒母同服為末酒調服亦可若勢甚而邪在表者加麻黄散之而毒在内者加大黄下之當臨症制宜此解回生起死之劑但元氣脫者不治六味活血散治癰疽瘡痛初起紅腫不散當歸川芎赤芍藥生地黄紅花蘇木各等分右水煎量服之托裏散治痘毒元氣虚弱不能潰散未成用之自消已成用之自潰人參黄茋炒各二錢當歸酒洗白术陳皮熟地黄茯苓芍藥炒各一錢五分甘草炙五分右三五錢水煎服托裏消毒散治痘毒氣血虚弱不起發腐潰收斂或發寒熱肌肉不生人參黄茋當歸酒洗川芎芍藥炒白术陳皮茯苓各一錢金銀花連翹白芷各七分甘草五分右每服三五錢水煎東垣聖愈湯治膿潰心煩無寐體倦少食熟地黄自製者佳生地黄各二分川芎人參各三分當歸黄茋各五分右水煎服濟生歸脾湯治脾血虚損健忘驚悸或心氣虚不能攝血歸源以致妄行或吐血下血或因乳母心脾二經有熱瘡不結痂或瘡痕赤色加柴胡山梔即加味歸脾湯人參白术黄茋白茯苓龍眼肉當歸逺志酸棗仁炒各二錢木香一錢甘草五分當歸身一錢右薑棗水煎母子同服東垣清胃散治胃經有熱齒牙作痛或飲食作渇口舌生瘡或唇口腫痛焮連頭面或重舌馬牙吐舌流涎若因服尅伐之劑脾胃虚熱口舌生瘡或弄舌流涎或嘔吐困睡大便不實者用五味異功散升麻五分生地黄四分黄連牡丹皮各三分當歸稍四分右水煎服嬰兒母亦服替針丸治痘癰膿已成不潰陳壞米一錢碙砂五錢雄雀糞四十九粒真雄雀糞直者是也右為末米粥丸如麥粒大每用一粒粘瘡頭上以膏藥貼之半晌其膿自出若瘡頭透而膿不出或出而愈痛或發熱血氣虚也用托裏散或作嘔吐痰食少體倦脾氣虚也用六君子湯神效太乙膏治一切瘡疽潰爛𤣥參白芷當歸肉桂赤芍藥大黄生地黄各一兩右咬咀用麻油四十兩入銅鍋内煎至藥黑攄去查徐入淨黄丹一斤再煎滴水成珠捻軟硬得中即成膏矣神效當歸膏治痘毒津淫或湯火等症及瘡腐不能生肌收斂者當歸生地黄黄蠟各一兩麻油六兩先將當歸地黄入油煎去渣入蠟熔化候温攪勻即成膏矣豆豉餅治瘡瘍腫痛或硬而不潰及潰而不斂并一切頑瘡毒癤用江西豆豉為末唾津和成餅大如銅錢厚如三四錢置患處以艾鋪餅上灸之未成者即消已成者袪逐餘毒間有不效者乃氣血虚敗之症叅疔瘡論灸法用之神功散治瘡瘍初起腫痛者用之可消加血竭更效黄栢炒為末二錢草烏生為末二兩右用漱口水調敷常以漱水潤之飛龍奪命丹治痘疔痘毒痘癰或麻木嘔吐重者昏憒咬牙真蟾酥乾者酒化輕粉各一錢枯白礬寒水石銅碌乳香没藥麝香各二錢朱砂六錢蝸牛四十二箇另研如無亦可右各為末入蟾酥蝸牛或加酒少許糊丸菉豆大每服一丸温酒或葱湯送下重者外用隔蒜法灸甚者多灸或着肉灸五福化毒丹治痘毒實熱腫痛生地黄熟地黄天門冬去心麥門冬去心𤣥參各二兩甘草甜硝各三兩青黛一兩五錢右為末蜜丸芡實大每服一丸白湯化下犀角消毒丸治痘疹餘毒一切瘡毒生地黄荆芥當歸犀角屑防風牛蒡子杵炒赤芍藥連翹桔梗各七錢薄荷黄芩甘草右為末蜜丸芡實大每服一丸白湯化下按化毒丹降火涼血解毒寒中之劑消毒丸清熱解毒破血之劑盖小兒臟腑脆嫩元氣易傷况痘後氣血皆虚豈能勝當此劑若胃氣一傷則未成者不能消散已成者不能腐潰已潰者不能生肌殊不知痘瘡乃臟腑所發遍身之血皆化為膿况此方愈而患此乃脾胃虚怯肌肉消弱榮衛短濇所致治者審之蟾蜍丸蟾蜍一枚夏月溝渠中腹大不跳不鳴身多癩㿔者右取糞蛆一杓置桶中以尿浸之桶上要乾不令蟲走出却將蟾蜍撲死投蛆中食一晝夜以布袋盛置浸急流水中一宿取出瓦上焙為末入麝一字粳米飯丸麻子大每服二十丸米飲下八珍湯方見頂陷灰白小柴胡湯方見癍症加生地黄山梔即加味小柴胡湯梔子清肝散即柴胡梔子散方見作痒搔破十全大補湯方見腹脹氣喘當歸補血湯補中益氣湯二方見寒戰咬牙六味地黄丸加五味子肉桂名加減八味丸四君子湯方見痘不靨悶亂加味逍遥散方見欲靨不靨加味歸脾湯方見痘疳加味清胃飲方見痘不結痂大蘆薈丸方見風邪摶扵肌膚人中白散如聖餅補隂八珍湯三方見夾疹痘痘疔痘疔又謂之賊痘或三五枚或五七枚間雜扵諸痘之間其色紫黯作痛不寧以致諸症蜂起不能貫膿甚至不救乃熱毒勢甚併結也用仙方活命飲如二便秘澁量加大黄遍身拘急加麻黄外必用線針挑破出黑血或吮出毒血以泄其毒餘痘纔得貫膿否則其毒無從而解必致不起如未應急用隔蒜灸若毒氣盛者或不知痛者不用蒜隔就着肉灼艾灸之若灸後瘡頭紅腫發焮用針挑破出毒血灼艾尤好雖此法未出方書予屢用屢驗者世多用至寳丹之類亦不可恃一小兒有疔二枚諸痘焮赤作痒而不貫先君以針挑破隔蒜灸至五十餘炷而貫又十餘壯而痛止用活命飲末二錢熱酒調服出紫血又二服疔毒悉退痘漿悉貫更用犀角消毒散而愈一小兒患痘疔挑出毒血服活命飲而痘愈但疔處或痒或痛用活命飲隔蒜灸而愈用參茋四聖散而靨一小兒痘内有疔數枚雖挑出毒血餘毒不解先君用仙方活命飲一劑徐徐灌之毒解漿貫而愈一小兒患痘疔遍身焮如丹毒内紫色者三枚用活命飲隔蒜灸其勢漸退又用活命飲末二錢漿漸貫更用四聖散犀角消毒散而愈一小兒出痘第七日寒熱作渇兩脇及臂外側膽經各患痘疔先用針挑出黑血乃用小柴胡湯加生地黄一劑熱渇頓止又用活命飲一劑而痊一小兒出痘稠宻痛甚色赤翌日變黑索水飲之神思稍清先用活命飲末冷酒調服三錢痛雖稍緩其痘如指色赤腫高又用奪命丹一粒腫痛十減六七又用活命飲末一服温酒調又得減三四再服而漿貫却用四聖散而痊犀角消毒散治癍疹丹毒發熱痛痒及瘡疹等症牛蒡子甘草荆芥防風各五分犀角鎊二分金銀花三分右水煎熱入犀角傾出服仙方活命飲飛龍奪命丹隔蒜灸法三方見痘癰四聖散方見腹脹氣促小柴胡湯方見癍症夾疹痘夫疹乃風邪外患痘為胎毒内發二症並作臟腑俱病也二者相雜赤暈發焮痘瘡愈盛誤謂痘出太宻多不可救然此乃疹夾痘也當治以人參羌活散疹毒即解痘勢亦退其元氣虧損不能結痂當補解胃為急也人參羌活散治時氣痘疹兼於發表人參羌活獨活柴胡前胡桔梗茯苓枳殻川芎天麻甘草地骨皮各三分右入薄荷五葉薑水煎服東垣消毒救苦湯治癍疹悉自消化使令不出已出稀者再不生癍十一月立此方隨四時加減通造化明藥性者能之麻黄根羌活防風升麻各五分柴胡川芎藁本葛根各二分酒黄芩二分生地黄二分細辛生黄芩各一分黄連酒黄栢紅花少許蘇木當歸身吳茱茰五分白术蒼术二分生甘草一分橘皮連翹半分初出減出太盛者加之右每服五錢水煎熱服人中白散人中白煅一兩黄栢炒黒三錢右為末搽口内如聖餅治一切瘡瘍硬腫不能消散或毒不能解散乳香没藥木香血竭當歸等分麝香少許右各另為末酒糊和為餅炙熱頻熨患處惡瘡加蟾蜍等分四味肥兒丸一名小肥兒丸治食積脾疳目生雲翳口舌生瘡牙齦腐爛發熱瘦怯遍身生瘡等症或痘後患之黄連炒蕪荑炒神麯炒麥芽炒等分右為末水糊丸桐子大每服二三十丸空心白湯下加味解毒散治癍疹痒痛寒熱甚者煩躁譫語并痘毒發熱咽乾犀角鎊五錢連翹炒二錢牛蒡子炒三錢薄荷一錢甘草五分右為末每服一二錢滚湯調下補隂八珍湯即八珍湯加黄栢知母炒黒葛根黄連湯治疹後身熱不除葛根五錢黄連三錢黄芩二錢甘草一錢半右水煎服獨參湯人參一兩薑棗同煎春澤湯人參白术茯苓澤瀉猪苓右水煎服大連翹飲連翹黄芩瞿麥木通滑石柴胡防風荆芥赤芍藥甘草蟬蛻山梔右每服三四錢水煎服薛氏醫案巻七十一
