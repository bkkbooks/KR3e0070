body:
  text: 薛氏醫案卷七十四明薛已訂外科精要上療發背癰疽灸法用藥第一經云諸痛癢瘡瘍皆屬心火前輩又謂癰疽多生於丹石房勞之人凡人年四十已上患發背等瘡宜安心早治此症如虎入室禦而不善必至傷人宜先用內托散次用五香連翹湯更以騎竹馬法或隔蒜灸并明灸足三里以發泄其毒蓋邪之所湊其氣必虛留而不去其病乃實故癰疽未潰臟腑畜毒一毫熱藥斷不可用癰疽已潰臟腑既虧一毫冷藥亦不可用猶宜忌用敷貼之藥閉其毫孔若熱渴便祕脈沉實洪數宜用大黃等藥以泄其毒後國老膏萬金散黃礬丸逺志酒之類選而用之愚按前症若熱毒藴於內大便祕結元氣無虧者宜用大黃等藥泄其熱毒若隂虛陽湊精虛氣節脾胃虛弱者宜用甘溫之劑培其本源若瘡不焮腫不作膿者雖未潰仍須溫補若瘡已潰而腫不退痛不止者仍宜清涼之劑治之若病急而元氣實者先治其標病緩而元氣虛者先治其本或病急而元氣更虛者必先治本而兼以治標大抵腫高焮痛膿水稠粘者元氣未損也治之則易漫腫微痛膿水清稀者元氣虛弱也治之則難不腫不痛或漫腫腫黯不潰者發於隂也元氣虛甚理所不治若腫高焮痛者先用仙方活命飲後用托裏消毒散漫腫微痛者宜托裏散如不應加薑桂若膿出而反痛氣血虛也八珍散不作膿不腐潰陽氣虛也四君加歸茋肉桂不生肌不收斂脾氣虛也十全大補加薑桂晡熱內熱隂血虛也四物加參术欲嘔作嘔胃氣虛也六君加炮薑自汗盜汗五臟虛也六味丸加五味子食少體倦脾氣虛也補中益氣加茯苓半夏喘促咳嗽脾肺虛也前湯加麥門五味欲嘔少食脾胃虛也人參理中湯腹痛泄㵼脾胃虛寒也附子理中湯小腹痞足脛腫脾腎虛弱也十全大補加山茱山藥肉桂泄㵼足冷脾腎虛寒也前藥加桂附熱渴淋閉腎虛隂火也加減八味丸喘嗽淋閉肺腎虛火也補中益氣湯加減八味丸凡此變症皆因元氣虧損失於預補所致故丹溪先生云但見腫痛參之脈症虛弱便與滋補氣血無虧可保終吉旨哉斯言蓋古今虛實不同因時施治不無少異是集治論義悉類此附治驗上林陳靜􅉼面患疔脈洪數有力屬邪氣藴結余用清熱消毒散二劑未應或用黃蓍肉桂等藥二劑反益其勢致耳目唇口俱腫閉頭面如斗由邪氣外實也前脈按之無力由元氣內虛也連進托裏消毒之藥及數砭患處出黑血碗許已而膿與腐肉併潰而出復用托裏之藥瘡勢漸愈七日後復因調護失宜以致煩渴不食兩尺脈如絲欲絶急用八味丸料煎服其脈頓復手足自溫使非砭以泄其外托裡散以補其內八味丸以回其陽則治之失宜必致不救慎之慎之憲副陳魯山居官勤苦勞傷元氣背患疽漫腫中央色黯四畔微赤微痛脈浮大按之微細左寸短而右寸若無十餘日腫未全起此病氣元氣虛寒朝用參蓍薑桂歸术陳皮半夏炙草溫補其陽夕用加減八味丸滋其肝腎各四劑而腐潰但膿水清稀盜汗自汗內熱晡熱脈浮而數改用八珍湯復發熱而夜陽舉此腎虛而火動仍用加減八味丸料煎服而安又因怒動肝火瘡出鮮血二盞許左關弦數右關弦弱此肝木侮脾以致肝不能藏血脾不能統血用十全大補兼前藥各二劑而血止再用前藥調理而痊一武職患腦疽內潰熱渴頭面腫脹如斗胸背色焮如塗丹煩熱便祕此表裏俱實若非苦寒之劑內疏外泄不救遂針周項出膿及用清涼飲一劑內大黃用五錢再用消毒散而愈節推王器之背患疽瘡頭如黍焮痛背重脈沉而實此毒在內服黃連內疏湯二劑少退更與仙方活命飲而愈舉人劉華甫焮腫作痛脈浮而數此毒蓄於經絡用內托復煎散二劑而焮腫減用仙方活命飲四劑而腫痛止更用托裏藥而痊一儒者患背疽腫焮痛甚此熱毒藴結而熾盛用隔蒜灸而痛止服仙方活命飲而腫消更與托裏藥而潰愈一男子背患疽腐肉雖潰而新肉不生此毒氣解而脾胃之氣虛也用六君子加芎歸五味黃茋漸愈用十全大補湯全愈一男子背患疽肉腐膿清肌肉不生此邪去而氣血俱虛也用十全大補湯月餘而斂一男子背患疽腫痛赤暈尺餘背如負石其勢當峻攻其脈又不宜遂砭赤處出紫血碗許腫痛頓退更用神功散及仙方活命飲二劑瘡口及砭處出血水而消儒者周在魯懷抱久鬱背脊患疽肝脈弦洪脾脈浮大按之微細以補中益氣加桔梗貝母少用銀花白芷二劑肝脈頓退脾脈頓復乃以活命飲二劑膿潰腫消肝脈仍弦此毒雖去而胃氣復傷仍用前湯加半夏茯苓而愈用銀花白芷非為治瘡乃解患者之疑耳癰疽備論第二初虞世云凡癰疽始作須以大黃等藥亟轉利之勿以困苦為念若與其潰爛而死不若利之而死况有生道哉古人立法率用五香連翹漏蘆等藥貧乏者單煎大黃湯以利之至於膿潰乃服黃茋等藥以排膿千金外臺備矣世以瘡發於外不行轉利而死者多矣悲夫愚按前症若腫高焮痛臟腑閉結屬內外俱實當用前藥瀉之若漫腫微痛臟腑不實屬內外俱虛當用內托補之若患腫無頭肉色不變當助胃壯氣令其內消若疼痛不止焮腫不消當用人參黃茋散以托裡排膿若飲食少思肌肉不生當用參茋托裡散以補養脾胃丹溪云癰疽因積毒在臟腑當先助胃壯氣使根本堅固次以行經活血藥佐之參以經絡時令使毒氣外泄治之早者可以內消此內托之旨也又云腫瘍內外皆壅宜以托裡表散為主如用大黃寧無孟浪之非潰瘍內外皆虛宜以補接為主如用香散未免虛虛之失此蓋古今氣稟不同治宜審之癰疽灸法論第三陳無擇云癰則皮薄腫高疽則皮厚腫堅初發並宜灼艾惟癰膿成則宜針疽膿成則宜烙當審察其症疏利其毒補托其裡然癰疽冠於雜病之首治失次序多致枉天故集得效灸法以貽學者庶不致妄投也愚按前症若發熱煩渴大便祕結者由邪蓄於內宜黃連內疏湯以泄內毒若頭痛拘急發熱惡寒者由邪客於外宜人參敗毒散以散表邪若腫痛焮赤發熱作渴此毒氣凝於肉裏宜仙方活命飲解散其毒若食少體倦發熱惡寒此中氣虛弱宜六君子湯以補脾胃騎竹馬灸法第四治一切瘡瘍即用此法無有不愈其法令病人以肘憑凡竪臂腕要直用篾一條自臂腕中曲處橫紋男左女右貼肉量起有至中指尖盡處截斷為則不量指甲却用竹杠一條令病人脫衣正身騎定前後用兩人杠起令病人腳不著地又令二人扶之勿令傴僂却將前所量臂篾從竹杠坐處尾骶骨盡處直貼脊背量至篾盡處為則用墨筆點定此只是取中非灸穴也却用薄篾作則子量病人中指節相去兩橫紋為則男左女右截為一則就前所點記處兩邊各量一則盡處即是灸穴兩穴各灸五七壯疽發於左則灸右疽發於右則灸左甚則左右皆灸蓋此二穴心脈所過之處凡癰疽皆心火留滯之毒灸此則心火流通而毒散矣起死回生之功屢試屢驗愚按前症若毒既解而肌肉不生當求其屬而補之第三圖先令病人脫去衣服以大竹杠一條跨定令兩人徐徐扛起足要離地五寸許兩傍更以兩人扶定毋令搖動不穩却以第一圖則子貼定竹扛從尾閭起貼脊量至則子盡以墨點定記之非灸穴也此是取中穴止處却以第二圖取同身寸則取兩寸平摺自中穴量之以中分取兩傍各一寸方是灸穴也論隔蒜灸得效第五李氏云治疽之法灼艾之功勝於用藥蓋使毒氣外泄譬諸盜入人家當開户逐之不然則入室為害矣凡瘡初發一二日須用大顆獨蒜切片三分厚貼疽頂以艾隔蒜灸之每三壯易蒜痛者灸令不痛不痛者灸之令痛瘡潰則貼神異膏如此則瘡不開大肉不敗壞瘡口易斂一舉三得此法之妙人所罕知若頭項見疽則不可用此法五府極觀碑載愚謂瘡瘍之症有諸中必形諸外在外者引而拔之在內者疏而下之苟或毒氣鬱結瘀血凝滯輕者藥可解散重者藥無全功是以灼艾之功為大凡灸法未潰則拔引鬱毒已潰則補接陽氣每治四肢患瘡氣血無虧者祇以前法灸之皆愈若中氣虛弱不灸而服敗毒之藥復傷中氣未有不敗者也其頭項患者亦宜灸之但艾炷宜小而少其壯數為善背疽腫漫尋頭灸法第六李氏云凡患背疽漫腫無頭者用濕紙貼腫處但一點先乾處乃是瘡頭可用大蒜十顆淡鼓半合乳香錢許研爛置瘡上鋪艾灸之痛否皆以前法為度愚按前症或附骨疽及臀腿諸毒初起未明者尋頭用灸多自內消其毒熾盛更服活命飲其功尤捷若氣血虛弱必以補托為主若背疽大潰欲驗穿透內膜者不可用皂角取嚏法但以紙封患處令病者用意呼吸如紙不動者未穿透也倘用取嚏鼓動內膜反致穿透慎之慎之蒜餅施用分其輕重第七伍氏曰凡用蒜餅灸者蓋蒜味辛溫有毒主散癰疽假火勢以行藥力有只用艾炷灸者此可施於頑疽痼發之類凡赤腫紫黑毒甚者須以蒜艾同灸為妙愚按前法誠有回生之功若頑瘡痼疾脾胃虛弱營氣不能滋養患處以致寒邪內襲而不愈宜用小艾炷頻灸瘡口以祛寒邪補接營氣其內補之法説見首論及三十二論灸法要論第八伍氏方論曰夫癰疽發背皆有所因前篇言之詳矣凡初覺赤腫先從背脊骨第二陷中兩傍相去同身寸各一寸五分名熱腑穴二處各灸七壯此能疏泄諸陽熱氣永無癰疽之苦或隔蒜灸不論壯數則邪無所容而真氣不損但頭項見瘡宜用騎竹馬法及足三里灸之愚按前論誠為良䇿其調理之法當求首論中史氏引證甲戌年瘍醫常器之診太學史氐之母云內有蓄熱防其作疽至辛巳六月果背脾微癢瘡粒如黍灼艾即消隔宿復作用膏藥覆之暈開六寸許痛不可勝歸咎於艾適遇一僧自云病瘡甚危嘗灸八百餘壯方蘇遂用大艾壯如銀杏者灸瘡頭及四傍各數壯痛止至三十餘壯赤暈悉退又以艾作團如梅杏大者四十壯乃食粥安寢瘡突四寸小竅百許患肉俱壞而愈愚按灼艾之法必使痛者不痛不痛者痛則其毒隨火而散否則非徒無益而又害之附治驗秋官高竹真患背疽色黯堅硬重如負石神思昏憒可畏其親廷評鄭沙村請同往治鄭云竹真先任湖廣某縣時以某河涉險不便竹真為整治有功其民為立生祠凡渡河者無不禱祭竹真患此悉疑立祠致祟余曰不然病因元氣虛寒積毒熾盛所致遂以杵蒜攤患處用錢大艾炷灸二十餘壯尚不知乃攤蒜補艾灸亦不知乃著肉灸良久方知再灸方痛內服參附大補之劑而起癰疽灼艾痛癢論第九伍氏曰凡治癰疽發背疔瘡不痛者必灸使痛痛者必灸使不痛若初灸即痛者由毒氣輕淺灸而不痛者乃毒氣深重悉宜內服追毒排膿外傳消毒之藥大抵癰疽不可不痛又不可大痛悶亂不知痛者難治愚按前論惟疔瘡一症其狀不一其色不同或如小瘡或如水泡或作痛或麻木或有紅絲或寒熱頭疼或嘔吐惡心或肢體拘急其候多端非前灸法并解毒之劑卒難濟事若不省人事或牙關緊急者即以奪命丹為末灌之若生兩足多有紅絲至臍生于兩手多有紅絲至心生于唇面多有紅絲入喉俱難治若針其紅絲出血多有生者若患於肢末之處毒愈凝滯藥難導達艾灸之功為大如妄服疏利之劑耗損真氣不惟無以去毒而害反隨之矣附治驗操江都憲張恆山左足次指患之痛不可忍急隔蒜灸三十餘壯即能舉步彼欲速愈自敷涼藥遂致血凝肉死毒氣復熾再灸百壯服活命飲出紫血其毒方解腳底通潰腐筋爛肉甚多將愈豫因考績北上又誤用生肌藥反助其毒使元氣虧損瘡口難斂豫回用托裏藥補之喜其稟實且客處至三月餘方瘥表甥居富右手小指患之或用針出血敷以涼藥掌指腫三四倍六脈洪大此真氣奪則虛邪氣勝則實也先以奪命丹一服活命飲二劑勢稍緩余因他往或又遍刺出血腫延臂腕如大瓠手指腫大數倍不能消潰乃真氣愈虛邪氣愈盛余回用大劑參茋歸术之類及頻灸遍手腫勢漸消後大便不實時常泄氣此元氣下陷以補中益氣湯加補骨脂肉豆䓻吳茱茰五味子又以生脈散代茶飲大便漸實手背漸潰又用大補藥五十餘服漸愈一男子唇患之有紫脈自瘡延至口內余曰此脈過喉則難治矣須針紫脈并瘡頭出惡血以泄其毒則可不信乃别用解毒之劑頭面俱腫復請治脈洪數按之全無惡症悉具余曰無能為也彼求治甚篤時口內腫脹針不能入為砭腫處出血勢雖少退終至不起腦疽灸法第十李氏云腦疽及脛項有疽不可用隔蒜灸恐引毒上攻宜灸足三里穴五壯氣海穴三七壯仍服涼血化毒之藥或以騎竹馬穴法灸之凡頭項咽喉生疽古法皆為不治若用此法多有生者加五香連翹漏蘆等湯國老膏萬金散皆可選用愚按前症屬膀胱經或濕熱上壅或隂火上炎若因濕熱則病氣有餘元氣不足當用黃連消毒散以除濕毒用補中益氣湯以滋化源若因隂火則元氣病氣俱不足當用補中益氣湯及六味地黃丸以滋腎水若腎水乾涸中傳末症急用加減八味丸及補中益氣湯以固根本引火歸源若色黯不潰或潰而不斂名曰腦爍不治大凡腫焮痛甚宜活命飲隔蒜灸之解散瘀血拔引鬱毒但艾炷宜小而少若欲其成膿腐潰生肌收斂並用托裡為主附治驗一婦人患頭項俱腫痛不可當發熱作渴喜冷內服清熱外敷寒涼色黯不焮胸中氣噎此陽氣虛寒彼泥素有痰火不受溫補余用參茋各五錢薑桂各二錢一劑腫頓起而潰又用大補藥而愈凡瘡疽腫高痛甚煩渴飲冷此病氣元氣俱有餘宜用清熱消毒散仙方活命飲為主若腫高痛甚口乾飲熱此病氣有餘元氣不足宜用托裡消毒散參茋四補散為主若漫腫微痛食少體倦此病氣元氣俱不足宜用六君補中二湯壯其脾胃則未成者消已成者潰已潰者斂矣儒者胡本中之內冬患之腫痛熱渴脈洪數實用清熱消毒之藥潰膿而愈次年三月其舌腫大遍身患紫疔如葡萄不計其數手足尤多各刺出黑血此脾胃受毒先服奪命丹七粒出臭汗瘡熱益甚便祕二日與大黃芩連各三錢升麻白芷山梔薄荷連翹各二錢生甘草一錢水煎三五沸服之大小便出臭血甚多下體稍退乃磨入犀角汁再服舌本及齒縫出臭血諸毒頓消更用犀角地黃湯而愈癰疽既灸服藥護臟腑論第十一李氏云背疽之方雖多得效者殊少今擇用驗者録之庶不致誤人如護心散凡有疽疾早進數服使毒氣外出而無嘔吐之患否則咽喉口舌生瘡或黑爛如茵若瘡發四五日之後宜間用别藥治之愚按護心散乃解金石發疽之藥若發熱焮腫作渴飲冷而嘔者宜用若發熱焮腫作渴飲湯而嘔者不宜用若脾虛停痰或寒邪內侵或痛傷脾胃宜用六君子湯若喉舌生瘡或口乾作渴或小便頻數宜用六味丸大凡諸瘡作嘔若飲冷便祕是熱毒也黃連消毒散解之飲冷便和是胃火也竹葉石膏湯清之懶食飲湯是胃虛也補中益氣湯以補之大便不實喜飲熱湯是脾胃虛寒也六君加炮薑以溫之常見脾胃虛弱者用前散反心間隂冷無不致嘔其喉舌生瘡乃腎水枯涸虛火炎上其症甚惡急用加減八味丸亦有得生者附治驗通府張廷儀背患癰作嘔焮痛大便祕結口乾作渴此內藴熱毒用竹葉石膏湯二劑諸症頓退用托裡消毒散四畔腫消用仙方活命飲瘡亦尋愈上舍李通甫腿患瘡作痛少食作嘔惡寒余以為痛傷胃氣用六君子湯加當歸四劑疼痛少止飲食加進又以十宣散加白术茯苓陳皮數劑膿成針而出之又以前散去防風白芷數劑而痊舉人邊雲衢腋下患毒嘔逆不食腸鳴切痛四肢厥冷脈沉而細余謂中氣不足寒邪內淫用托裏溫中湯一劑頓愈更以香砂六君子治之彼謂腫瘍時嘔當作毒氣攻心治之潰瘍時嘔當作隂虛補之余曰此丹溪大槩之言也即諸痛癢瘡皆屬心火之意假如赤腫痛甚煩躁脈實而嘔為有餘法當下之腫硬不痛不潰脈弱而嘔為不足法當補之亦有痛傷胃氣或感寒邪穢氣而作嘔者雖腫瘍尤當助胃壯氣彼執不信用攻伐之藥病愈甚復請診其脈微細而發熱余謂熱而脈靜脫血脈實汗後脈躁者皆難治後果殁護心散菉豆末一兩明乳香細研半兩右煎生甘草湯調時時服之令藥常在膈間五香連翹湯乳香木香沉香丁香連翹射干升麻黃茋木通獨活桑寄生甘草各三分右水煎服愚按是方説見前論凡癰疽不可用生肌斂口之藥合用麥飯石膏瘡口自斂或因毒藥或為刀割重者兼服沉麝湯愚按前云凡瘡不可用收口藥者恐毒氣未盡反助其惡蓋肌肉脾之所主但托裡健脾則餘毒自解瘡口自合若毒發於外氣血無虧麥飯石膏亦可倚仗若元氣虧損必當補助其脾禁用刀針説見第四十三沉麝湯木香麝香沉香藿香乳香連翹各等分右每服二錢水煎五香去大黃加人參黃茋犀角湯木香沉香乳香丁香各五錢粉草人參各四錢黃茋一兩犀角末二錢麝香一錢右每服四錢水煎漏蘆湯黃茋甘草連翹沉香漏蘆各半兩大黃一兩微炒右每服二錢薑棗水煎愚按三方詳見首論其斂口之法附見第三十三柞木飲子治一切癰疽未成自消已成自潰甚效乾柞葉四兩萱草根荷葉蒂甘草節地榆各一兩右每服五錢水煎一碗作二劑早晚進愚按荷葉蒂去惡血萱草解毒柞葉善袪逐地榆甘草節清血消毒阿膠飲子治一切癰疽癤毒牛膠銼蛤粉炒如珠粉草各一兩橘紅半兩右作三劑水煎服牛膠飲截治癰疽毒不內攻不傳惡症有益無損牛皮膠用明者四兩右用酒一碗重湯煮化服加酒至醉不能飲加白湯愚按二飲消毒殊有良驗神仙黃礬丸服至一兩以上最止疼痛不動臟腑白礬一兩明亮者研黃蠟五錢黃色者熔開一方用七錢右丸桐子大每服十丸漸加至二十丸熟水或溫酒送下未破內消已破自合如服金石所致更用礬末一兩徐以溫酒送下有人遍身生瘡其狀如蛇頭服此即效但日服百粒方能禦毒不致內攻又治蛇咬熔礬熱滴傷處痛即止毒即出愚按前法果有良驗余常以白礬三錢為末糊丸以蔥湯連進二服其功尤速故名千金化毒湯本用礬末蔥湯調下因末難服故作為丸此藥解金石固臟腑有益無損用力少而成功多偏僻之處不可不知國老膏治一切癰疽預服消腫逐毒其功不能盡述粉草右以河水浸二宿揉取汁砂器煎膏服一二匙無灰酒或白湯下最解丹毒愚按前方誠為解毒之劑但元氣虛弱者當深戒之萬金散治一切癰疽已潰未潰者括蔞一箇杵細大甘草節二錢沒藥一錢研末右用酒二碗煎一碗去查入沒藥服愚按前散有消毒破血之功無腐潰生肌之力逺志酒治一切癰疽因憂怒氣滯所致逺志米泔浸洗去土去心右為末每服三錢酒一盞調和澄清飲之柤傅患處愚按逺志酒誠有解鬱消毒之功而無托裡補益之效忍冬酒治一切癰疽甚效仍以麥飯神異二膏傅貼忍冬藤生取五兩大甘草節一兩右用水二碗煎一碗入無灰好酒一碗再煎數沸去查分三服一晝夜用盡病重晝夜兩劑至大小便通利為度另用忍冬藤一把爛研入酒少許傅四圍又水蓮四十九片握去毛研細酒解溫服其功與忍冬草同又龍鱗薜荔一握細研以酒解汁溫服利惡物為妙紅內消用水砂器煎熟入酒與藥相半再煎數沸去查時時服之查焙為末酒糊丸桐子大每服三十丸空心溫酒下為常服之蓋力輕故也藥産建昌者良愚按前三藥因其簡易解毒而用之略無內托之功也若毒既去而真氣虛者必須補托以收全功馬益卿先生癰疽論第十二論曰夫人有四肢五臟一覺一寐呼吸吐納精氣往來流而為榮衛暢而為氣色發而為聲音陽用其形隂用其精此又常數之所同也至其失也蒸則生熱否則生寒結而為瘤贅陷而為癰疽凝而為瘡癬憤則結癭怒則結疽又五臟不和則九竅不通六氣不和則流結為癰皆經絡澀滯氣血不流暢風毒乘之而致然也愚按此論可謂善言人身之造化瘡瘍之情狀者矣治法當參詳前論癰疽敘論第十三論曰癰疽之症若七情虧損氣血經絡壅結而成者屬內因若六淫外侵氣血受傷寒化而為癰者屬外因若服丹石補藥膏粱酒麵房勞所致者屬內外因也又曰隂滯於陽則發癰陽滯於隂則發疽脈浮洪滑數為陽沉緩遲澀為隂隂則熱治陽則冷治初覺宜清熱拔毒已潰宜排膿止痛故用逺志大黃甘草此三因之法也治當寒者溫之熱者清之虛者補之實者㵼之導之以針石灼之以艾炷破毒潰堅各遵成法以平為期愚按前症脈沉實大便祕結者屬內因也宜疏利之脈浮大便調和者屬外因也宜托裡之脈不浮不沉者屬不內外因也宜調和榮衛此亦治三因法也若焮腫大痛煩熱飲冷大便祕結脈洪數實者為純陽宜苦寒之劑清熱拔毒若不腫不痛㵼利不食嘔吐足冷是為純隂宜辛熱之劑大補陽氣不拘嚴寒盛暑當捨時從症若微腫微痛似潰不潰時出清膿者為半隂半陽宜辛熱之劑溫補胃氣此亦治隂陽症法也治驗詳見首論素問良用要論第十四素問云陽氣湊襲寒化為熱熱甚則肉腐為膿凡發背多因服金石而發者有因上伐曾服而發者其候多發於脾起如粟或痛或癢多致不救外面如拳古人云外面如麻裡面如瓜有數十孔以手按之諸孔出膿尋時失瘖凡有此症可用淨土水調量大小作餅厚分許以艾炷灸之內服五香連翹湯及鐵漿醋調蚌殼灰塗之更以騎竹馬法灸之甚良愚按前症仍參首論主治恐其表裏熱毒之不同元氣虛實之不一也千金良用備要方論第十五千金云癰疽始作或大痛或小痛或發如米粒即便出膿宜急斷口味利去其毒用騎竹馬灸法或就患處灼艾重者四面中央總灸一二百壯更貼寒藥其效甚速愚按前症若因元氣虧損或因氣血相滯而患者更當調補其內别脈辨症論第十六伍氏云癰疽之疾有二十餘症熛發痼發石發岩發蜂窠發蓮子發椒眼發連珠發竟體發有腸癰內發腦背發眉發腮頷發肺癰瓜瓠發大率隨病淺深內外施治不可遲緩初發如傷寒脈浮而緊是其候也愚按前症其名雖殊處治之法詳具各論其肺癰胃脘癰别載外科樞要癰疽脈症第十七陳無擇云癰疽脈數身無熱反灑淅惡寒若有痛處乃發為癰以手掩上若熱者為有膿不熱者為無膿若脈不數不熱而疼者發於隂也尤為惡症凡熱甚脈數用漏蘆散并單煮大黃等湯不甚熱脈緩弱投五香連翹湯仍依四節八事次序三因以藥之無有不濟者也愚按前症灑淅惡寒有屬瘡之表邪者有屬脾肺之氣虛者若潰後焮腫作痛惡寒發熱煩渴脈數乃真氣虛而邪氣實也仍參詳首論主之治癰疽用藥大綱第十八李氏云余之所著方論靡不周備但欲使治者一玩味次第用之無有不效今略書用藥要領節次于後一初患癰疽便服內托散以免後來口舌生瘡仍用騎竹馬或隔灸一服五香連翹湯如大便疏快即止仍量人虛實一癰疽潰後宜服排膿內補散若嘔逆用木香湯下一癰疽初作便宜灼艾及麥飯石膏塗四圍中留口出毒如瘡小通傅之既潰用神異膏貼之一癰疽已潰日用豬蹄湯淋洗將愈之際三日一次一癰疽將斂宜用神異膏如毒未盡不可遽用生肌之劑一癰疽將安宜用加味十全湯補其氣血庶肌肉易生一背疽多先渴而後發或先疽而後渴不救多矣若服加減八味丸非特杜絶渴疾抑且大滋氣血生長肌肉愚按前症及諸治法各附四十七等論當審用之一癰疽嘔逆有二一因初發不服內托散伏熱在心一因脾氣不正若因伏熱在心者心煩身熱焮腫作痛宜用內托散三兩服若因脾氣不正者則不煩熱或聞穢氣作嘔宜用嘉禾散如有寒熱用不換金正氣散五更初兼服山藥丸以補腎愚按前症治法當與第十一論參看論癰疽嘔逆症第十九李氏云癰疽嘔逆是毒氣衝心非脾胃之冷當服內托散楊氏云鼻衄初愈不曾表汗毒在經絡則背發大疽自肩下連腰脅腫硬如石其色紫黑以涼藥投之終夜大嘔連進托裡散嘔止瘡潰赤水淋漓四十日而愈又有患􅐇者痛過徹嘔服此即止今有病疽不服此藥者故引楊氏之言以解世人之惑愚按用藥之法有是病必用是藥但今之脾胃虛寒氣逆痰滯而嘔吐者十居八九熱毒內攻而嘔吐者十才一二當參首論及第十一論主之論癰疽之源第二十夫癰疽之源因於氣或因於熱以僕之管見亦有因於膏粱房勞金石等藥故治法用菉豆犀角礬石國老膏追毒丸其屬毒明矣華陀中藏所言是毒服宣熱敗毒之藥不必疑矣愚按前症若因金石所致元氣充實者誠宜此法若膏粱積熱房勞過度脾腎虧損者當滋其化源不可拘執華陀論癰疽瘡腫第二十一夫癰疽瘡腫之作皆五臟六腑蓄毒不流非獨因榮衛壅塞而發也其行也有處其主也有歸假令發於喉舌者心之毒發於皮毛者肺之毒發於肌肉者脾之毒發於骨髓者腎之毒發於下者隂中之毒發於上者陽中之毒發於外者六腑之毒發於內者五臟之毒故內曰壞外曰潰上曰從下曰逆發於上者得之速發於下者得之緩感於六腑則易治感於五臟則難瘳又近骨者多冷近膚者多熱近骨者久不愈則化成血蟲近膚者久不愈則傳氣成漏成蟲則多癢少痛或先癢後痛成漏則多痛少癢或不疼不癢內虛外實者多痛少癢血不止則多死潰膿則多生或嘔逆無度飲食無時皆癰疽使然症候多端要當詳治愚按瘡瘍生蟲乃肝經風熱其成漏乃元氣虛弱其出血乃脾虛有火其潰膿乃元氣充實至於嘔逆等症屬脾胃虧損所致當調補元氣庶保無虞論背疽其源有五第二十二一天行二瘦弱氣滯三怒氣四腎氣虛五飲冷酒食炙􅏼服丹藥愚按前症所因雖殊其治法亦當别經絡隂陽虛實表裡腫潰以助胃壯氣為主使根本堅固庶保無虞追毒丸轉毒散單煮大黃湯神仙截法祕傳連翹湯千金漏蘆湯六味車螯散止痛靈寶散神效麻仁丸清心內固散清膻竹葉湯豬蹄湯神硝散聖效散神仙陷脈散右方見中卷麥飯石膏神異膏神驗血竭膏壓熱神白膏牡蠣地黃膏大川烏丸二烏丸蚣蝎散琥珀犀角膏犀角散內托黃茋丸不換金正氣散梔子黃芩湯加減八味丸忍冬丸黃茋六一湯桑枝湯五味子湯加味十全湯人參內補散神效托裡散內補十宣散人參順氣散茯苓開胃散陷脈散桂附丸神效瓜蔞散立效散獨聖散梅花散替針丸緑雲散宣毒散小五香湯塞裡散托裡散清涼膏碧油膏神效酒煎散蜞針法癰疽經驗方甲疽代指嵌甲方金瘡竹木湯火傷方右方見下卷薛氏醫案卷七十四
