body:
  text: 薛氏醫案卷四十三明薛己訂婦人良方産後乍見鬼神方論第一産後如見鬼神或言語譫妄皆由血氣虧損陰虛發熱或瘀血停滯以致心神煩躁而然也宜以調經散治之愚按前症若敗血停滯用調經散若血虛發熱用八珍加炮薑若心血虚損用柏子仁散大抵此証皆心脾血少所致但調補胃氣則痰清而神自安矣若果係鬼祟所附即灸鬼哭穴可愈其或不起者多因豁痰降火攻伐之過也仍叅第三卷産後譫語乍見鬼神方論附治驗一産婦患前症或用調經散愈而復作仍服前散益甚痰涎上湧朝寒暮熱余朝用八珍散夕用加味歸脾湯各五十餘劑而愈調經散治血虚經閉心神煩躁渾身疼痛或時見怪沒藥琥珀並細研桂心各一錢芍藥炒當歸各一錢細辛五分麝香少許右為末每服五分薑汁温酒各少許調服下即愈柏子仁散治産後元氣虚弱瘀血停滯狂言亂語柏子仁逺志人參桑寄生防風琥珀另研當歸炒生地黄焙甘草炒等分右用白羊心一箇水三盞煮清汁七分入藥五錢煎服附方八珍湯加味歸脾湯二方見二十四卷第四論鬼哭穴方見六卷第八論産後心神驚悸方論第二産後心神驚悸恐懼或目睛不轉口不能言乃心氣虛而六淫内侵診其脉動而弱者驚悸也動則為驚弱則為悸矣愚按人之所主者心心之所主者血心血一虛神氣不守此驚悸所由作也當補血氣為主仍叅三卷第十論附治驗一産婦患前症二度服琥珀地黄丸局方妙香散隨効再患服之其症益甚而脉浮大按之如無發熱惡寒此血氣俱虛余用十全大補加味歸脾二湯各百餘劑而愈後遇驚恐勞怒復作仍服前藥而安琥珀地黄丸治産後惡露未盡胸腹作痛或小便不利琥珀另研延胡索糯米同炒赤去米當歸各一兩蒲黄四兩炒香生地黄研取汁留滓生薑各二斤研取汁留滓生薑汁用銀石器内炒地黄滓以地黄汁炒生薑滓各乾為末右為末煉蜜丸如彈子大每服一丸當歸煎湯化下治血虛驚悸少寐及産後敗血停留少腹作痛等症辰砂另硏琥珀沒藥並研細當歸為末等分右為末每服二錢空心日午臨卧用白湯調下産後驚悸亂語精神不定用好硃砂為細末酒調服錢許附方局方妙香散方見三卷第十三論茯苓補心湯方見三卷第十論十全大補湯加味歸脾湯二方見二十四卷第四論産後中風心驚方論第三産後眼張口噤肢體強直腰背反偃言語錯亂如癎者此氣虛風邪所傷而成痙也愚按仲景先生云有汗為柔痙用桂枝湯無汗為剛痙用麻黄湯然産後得此血氣俱虚之敗症也不可與傷寒例看丹溪先生云産後當大補氣血為主可用十全大補湯以補元氣如不應急加附子更不應是藥力弗逮也仍用參附湯多服余常治大虛之症參茋數觔附子數枚方應附治驗一産婦患此不省人事言語妄甚惡風寒喜熱飲形氣倦怠脉虛浮無力余謂血氣虛寒用十全大補湯二十餘劑不應又二十餘劑稍緩乃漸加附子至一錢服數劑諸症减一二又二十餘劑十退三四乃去附子五分數劑諸症頓退而安後又發仍服前藥加附子三五分而愈茯苓散治産後心虛忪悸言語錯亂健忘少睡或自汗盜汗人參甘草炒芍藥炒黄當歸生薑各八分逺志去心茯苓各一錢桂心六分麥門冬去心五分大棗二枚右水煎服抱膽丸治産後遇驚發狂或遇經行發狂水銀二兩黑鉛一兩五錢硃砂一兩細研乳香一兩叧研右將黑鉛入銚内火鎔下水銀結成砂子下硃砂乳香末乘熱用栁木槌研匀丸雞頭子大每服一丸空心薄荷湯下得睡勿驚覺來即安妙香散亦善附方妙香散方見三卷第十三論十全大補湯方見二十四卷第四論參附湯方見後第六論産後中風恍惚方論第四産後恍惚因元氣俱虛心經血少或外邪所侵以致心神恍惚怔忡不寧愚按前症當大補血氣為主而佐以後方為善盖風乃虚極之假象也固其本源諸病自退若專治風則速其危矣附治驗一産婦患前症盜汗自汗發熱晡熱面色黄白四肢畏冷此氣血俱虚用八珍湯不應更用十全大補加味歸脾二湯始應後因勞怒發厥昏憒左目牽𦂳兩唇抽動小便自遺余謂肝火熾盛用十全大補加鈎藤山梔而安再用十全大補湯辰砂逺志丸而愈辰砂逺志丸治産後中風驚狂起卧不安或痰涎上湧石菖蒲逺志去骨蘆甘草煮人參茯神去木辰砂各三錢川芎山藥鐵粉麥門冬去心細辛半夏湯泡天麻南星白附子各一兩右為末薑汁糊丸菉豆大别以硃砂為衣每服三十丸臨卧薑湯下附方八珍湯十全大補湯加味歸脾湯三方見二十四卷第四論産後虛極生風方論第五産後生風因去血過多氣無所主以致唇青肉冷汗出目眩神昏急服濟危上丹若投以風藥則悞甚矣愚按前症若心脾血氣俱虚用十全大補湯如不應加附子釣藤鈎若肝經血虛用逍遥散加釣藤經云脾之榮在唇心之液為汗若心脾二臟虛極急用參附湯救之附治驗一婦人患前症或用諸補劑四肢逆冷自汗泄㵼腸鳴腹痛余以陽氣虛寒用六君子薑附各加至五錢不應以參附各一兩始應良久不服仍腸鳴腹痛後灸闗元穴百餘壯及服十全大補湯方效濟危上丹乳香研五靈脂硫黄𤣥精石同研極細阿膠卷柏桑寄生陳皮等分右將上四味入石器内微火炒再研入餘末用生地黄汁丸桐子大每服二十丸食前温酒或當歸酒下當歸建中湯治産後腹痛拘急痛連腰背自汗少食當歸桂心各三兩白芍藥六兩炒焦黄甘草炙二兩右每服五錢薑棗水煎入飴糖一匙服如未應加之附方參附湯方見本卷後十全大補湯逍遥散二方見二十四卷第四論六君子湯方見二十四卷第六論獨參湯治一切失血惡寒發熱作渴煩躁或口噤痰鳴自汗盜汗或氣虛脉脱手足逆冷盖血生於氣故血脱補氣陽生隂長之理也方見三卷第十三論産後虛汗不止方論第六産後汗不止者皆由陽氣頓虛腠理不宻而津液妄泄也若遇風則變痙縱虛乏短氣則身體消瘦唇口乾燥久則經水斷絶由津液竭故也愚按前症屬血氣俱虛急用十全大補湯如不應用參附茋附等湯若汗多亡陽發痙尤當用前藥王海藏先生云頭汗出至頸而還額上偏多盖額為六陽之所㑹也由虛熱薫蒸而出竊謂前症當以部仕分之額左屬肝額右屬肺鼻屬脾頥屬腎額屬心治者審之仍叅三卷第六論附治驗一産婦畧聞音響其汗如水而昏憒諸藥到口即嘔余以為脾氣虛敗用參附末為細丸時含三五粒隨液嚥下乃漸加之至錢許却服參附湯而痊一産婦盜汗不止遂至廢寐神思疲甚口乾引飲余謂血虚有熱用當歸補血湯以代茶又以當歸六黄湯内黄芩連柏炒黒倍加人參五味子二劑而愈麻黄根湯治産後虛汗不止身熱發渴驚悸不安當歸麻黄根牡礪煅為粉人參甘草炒等分右每服四錢水煎一方治産後自汗盜汗胃氣虚弱服别藥則嘔吐不能入當歸黄茋各一兩麻黄根二兩右每服三錢水煎治産後氣脱汗不止小便短少四肢難以屈伸甘草炙一兩附子炮五錢桂心芍藥炒各一兩半右每服三錢薑棗水煎服虛甚更加以效為度止汗散牡礪為末半兩小麥麩八兩炒黄為細末右每服三五錢用猪肉汁調人參湯治産後諸虛不足發熱盜汗内熱晡熱等症人參當歸等分右為末以猪腰子一枚切片水二鍾糯米半合葱白二根煮取汁八分入藥三錢煎服附方當歸六黄湯治氣血虚熱盜汗不止不應加人參白术心血不足加酸棗仁炒當歸熟地黄自製黄茋炒各二錢生地黄黄柏炒黒黄芩炒黒黄連炒黒各一錢右水煎服參附湯治陽氣虛寒自汗惡寒或手足逆冷大便自利或臍腹疼痛吃逆不食或汗多發痙等症人參一兩附子炮五錢右作一服薑棗水煎徐徐服去人參加黄茋名茋附湯當歸補血湯治肌熱躁熱目赤面紅煩渴引飲晝夜不息脉洪大而虚重按全無者當歸三錢黄茋炙一兩右水煎服十全大補湯方見二十四卷第六論茋附湯治陽氣虛脱惡寒自汗或口噤痰湧四肢逆冷或吐瀉腹痛飲食不入及一切虚寒等症黄茋一兩附子炮五錢右作一劑薑棗水煎服如不應倍加附子方得全濟産後冐悶汗出方論第七産後忽冐悶汗出者因陰血虧損陽氣鬱暴故也急吞鷄子三枚未醒飲童便或時復發宜服竹瀝五合愚按前症屬大虚宜固元氣為主其汗不止必變柔痙東垣先生云婦人分娩及半産漏下昬冐目瞑盖因血暴亡而火上熾但補其血則神自昌若常時血下當補而升舉其氣陽得血而神安則目明矣今立一方以補手足厥陰之血兼益陽氣名曰全生活血湯全生活血湯治發熱自汗盜汗目昏昏四肢無力口乾頭暈行步欹側柴胡當歸各二錢生地黄炒熟地黄各一錢川芎藁本各一錢半防風羌活獨活葛根甘草炒各二錢細辛五分蔓荆子五分升麻芍藥炒各三錢紅花三分右每服五錢水煎熱服産後汗多變痙方論第八産後汗多變痙因氣血虧損肉理不宻風邪所乗其形口噤背強如癎或揺頭馬嘶不時舉發氣息如絶宜速灌小續命湯若汗出兩手拭不及者不治愚按前症因去血過多元氣虧極或外邪相搏以致牙闗𦂳急四肢痙強或陰火内動或腰背反張肢體抽搐若有汗而不惡寒者曰柔痙若無汗而惡寒者曰剛痓血亡過多筋無所養故傷寒汗下過多潰瘍膿血大泄多患之乃敗症也急以十全大補湯治之如不應急加附子多有復甦者亦有六淫七情所致者治法見第三卷第三論附治驗一産婦牙闗𦂳急腰背反張四肢抽搐兩目連劄此去血過多元氣虧損隂火熾盛用十全大補加炮薑一劑而甦數劑而安余在吳江史萬湖第時將入更聞喧攘詢云家人婦産後出直厨忽仆而死余意其勞傷血氣而發痙也急用十全大補加附子煎滚令人正其面開其口灌之久不能下令側其面而出之換以熱藥如此五次方得下咽遂甦小續命湯治剛痙或脚氣痺弱不能轉舒行步欹側或口眼喎斜牙闗𦂳急角弓反張麻黄桂心甘草各半兩防風三兩芍藥炒白术炒人參川芎附子炮防已酒拌黄芩炒各等分右每服五錢水煎入薑汁少許温服若自汗為柔痙去麻黄有熱去附子减桂一半盛冬初春去黄芩十全大補湯方見二十四卷第四論産後口噤腰背反張方論第九産後口噤由血氣虚而風邪乗於手三陽經也盖手三陽之筋循結於頷得風冷則筋急故致口噤腰背攣急角弓反張者是風邪入於諸陽之經也愚按前症因氣血耗損腠理不宻汗出過多而患之者乃虛象也宜固氣血為主佐以本方丹溪云産後當大補氣血為先雖有他症以末治之如惡寒發熱等症乃氣血虛甚之極也宜大劑參茋歸术肉桂以培養之如不應急用炮附子再不應用人參一兩炮附子二三錢名參附湯借猶未應乃藥力未能及也宜多用之愈風散治前症用荆芥畧焙為末每服三錢豆淋酒下童便亦可其效如神牙𦂳灌口鼻清順散又名交解散方見第三卷第五論治婦人産後不省人事吐涎瘈瘲當歸荆芥穂等分右每服三錢水一盞酒少許煎灌下咽即甦愚按前症如有未應者急用大補氣血為主産後中風白蘚皮一兩或共獨活三兩酒水煎服張仲文用白术四兩以酒煎頓服小續命湯治産後口噤角弓反張見前産後中風方論第十産後中風或血氣未復風寒所感以致筋攣拘急口眼喎斜或肢體緩弱入臟則恍惚驚悸郭稽中云産後強力下床或誤入房或憂怒内傷臟腑陳無擇曰當以脉辨而治之若努力下床月内入房憂怒受傷非中風類乃蓐勞火邪之症也愚按前症果外邪所屬形氣不足病氣有餘當補元氣為主稍佐以治病之藥若強力下床月内入房屬形氣病氣俱不足當純補元氣多有復甦者若悞投風藥乃促其危也仍叅照第三卷諸論主之治産後身背拘急妄言發熱四肢拘攣不時驚悸川芎羌活羚羊角屑酸棗仁炒芍藥炒黄各四兩桑白皮六分防風五分右水煎分三服治産後中風唇青鼻黒用小續命湯連進三服即愈産後中風煩渴用紅花子五合炒研水煎徐呷之獨活寄生湯治前症亦良仍與第三卷中風類通看方見後産後四肢筋攣方論第十一産後中風筋脉攣急乃血氣俱虚或風邪客於皮膚則頑痺羸乏若入於筋脉則四肢攣急皆由大經空虚風寒乗虚而漸入也愚按肝屬木而主筋前症若肝經風熱血燥用加味逍遥散如不應當用六味地黄丸以補腎水經云風客淫氣精乃亡邪傷肝也仍叅第三卷諸論主之附治驗一産婦筋孿臂軟肌肉掣動此氣血俱虚而自熱也用十全大補湯而安一産婦手麻服愈風丹遍身皆麻神思倦怠余謂氣血虚弱用十全大補加炮薑數劑漸愈去薑又數劑及逍遥散而痊治産後氣血不足風邪所襲肢節攣痛背項強直防風一兩赤芍藥炒桂心各半兩羚羊角川芎羌活當歸酸棗仁炒牛旁子炒各三錢右每服四錢水酒煎愚按前方如未應當用八珍湯更不應用十全大補湯湯加味逍遥散十全大補湯二方見二十四卷第四論六味地黄丸方見二十四卷第十一論産後瘈瘲方論第十二新附竊謂瘈者筋脉拘急也瘲者筋脉張縱也經云肝主筋而藏血盖肝氣為陽為火肝血為隂為水前症因産後隂血去多陽火熾盛筋無所養而然耳故癰疽膿水過多金瘡出血過甚則陽隨隂散亦多致此治法當用八珍散加丹皮釣藤以生隂血則陽火自退諸症自愈如不應當用四君芎歸丹皮釣藤以補脾土盖血生於至隂至隂者脾土也故小兒吐瀉之後脾胃虧損亦多患之乃虛象也無風可逐無痰可消若屬陽氣脱陷者用補中益氣加薑桂陽氣虚敗者用十全大補加桂附亦有復生者此等症候若肢體惡寒脉微細者此為真狀若脉浮大發熱煩渴此為假象惟當固本為善若無力抽搐戴眼反折汗出如珠流者皆不治附治驗一産婦因勞兩臂不能屈服蘇合香丸肢體痿軟汗出如水余謂前藥辛香耗散真氣腠理虛而津液妄泄也先用十全大補湯加五味子補實腠理收斂真氣汗頓止又佐以四君子調補元氣漸愈用逍遥散大補湯調理而痊一産婦先胸脇乳内脹痛後因怒口噤吐痰臂不能伸小便自遺左三部脉弦余謂此肝經血虚而風火所致不能養筋先用加味逍遥散治之臂能屈伸又以補肝散六味丸諸症悉愈一婦人發瘈遺尿自汗面赤或時面青飲食如故肝脉弦𦂳余曰此肝經血燥風熱名瘈也肝主小便其色青入心則赤法當滋隂血清肝火遂用加味逍遥散不數劑諸症悉退而安附方海藏愈風湯一名舉卿古拜散治一切失血筋脉𦂳急産後與汗後搐搦荆芥為細末右先以炒大豆黄卷以酒沃之去黄卷取清汁調前末三五錢和滓飲之輕者一服重者二三服中病即止其效如神氣虚者忌服一方用童便調下本事方云此藥委有竒效神靈之功大抵産室無風為佳不可衣被帳褥太煖太煖即汗出汗出則腠理開易於中風便昏冐一婦人産後遮䕶太宻更生旺火睡久及醒則昏昏如醉不省人事用此藥佐以交加散服之即睡睡中必以左手搔頭覺必醒矣良久果驗交加散治瘈瘲或顫振或産後不省人事口吐痰涎當歸荆芥穂等分右為細末每服二錢水一盞酒少許煎至七分灌下神效増損柴胡湯治産後或經適斷致手足牽搐咬牙昏冐異症柴胡八錢黄芩炒四錢人參半夏各三錢石膏四錢知母二錢黄茋炒五錢甘草炙二錢右為粗末每服半兩薑五片棗四枚水煎温服四君子湯補中益氣湯二方見二十四卷第六論産後脚氣方論第十三論曰産後脚氣因元氣内虛六淫外侵所致其狀發熱瞀悶搐掣驚悸心煩嘔吐氣上用小續命湯治之若以為敗血攻之則誤矣愚按前症當補氣血為主佐以小續命湯寄生湯如不應用大防風湯仍叅第一卷九論主之已上十一症誠似小兒慢驚風無風可逐無痰可清但專補元氣庶保其生附治驗一産婦患前症或用獨活寄生湯而症後復作服之其汗如水更加口噤吐痰余用十全大補湯培養血氣漸愈後飲食日少肌體日瘦吐痰如湧此命門火衰脾土虚寒用八味丸及加味歸脾湯諸症漸退肌肉漸生獨活寄生湯治風邪内攻兩脛腫痛或緩縱攣痺等症方見四卷第七論小續命湯方見前大防風湯方見二十四卷第九論十全大補湯加味歸脾湯二方見二十四卷第四論八味丸方見十五卷第十一論薛氏醫案卷四十三
