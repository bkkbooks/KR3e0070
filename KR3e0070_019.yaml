body:
  text: 薛氏醫案卷十九明薛已訂癘瘍機要下各症方藥通天再造散治癘風惡疾鬱金五錢大黃煨皂角刺炒黑各一兩白牽牛六錢半生半炒右為末每服五錢日未出時面東以無灰酒調下寶鑑醉仙散治癘風胡麻子牛蒡子枸杞子蔓荆子各炒一兩白蒺莉瓜蔞根苦參防風各五錢右為末每一兩五錢入輕粉二錢拌勻每服一錢茶清調晨午各一服至五七日於牙縫中出臭涎令人如醉或下膿血病根乃去仍量人輕重虛實用病重者須先以再造散下之候元氣將復方用此藥忌一切炙􅘤厚味止可食淡粥時菜諸蛇以淡酒蒸熟食之可以助藥勢寶鑑換肌散治癘風久不愈或眉毛脫落鼻梁崩壞不月奏效如神地龍去土當歸細辛何首烏不犯鐡白芷天麻蔓荆子葳靈仙荆芥穗菊花苦參紫參沙參木賊草白蒺䔧草烏頭炮去皮臍不灰木甘草天門冬去心赤芍藥九節菖蒲定風草胡麻子炒川芎蒼术一兩木鱉子一兩白花蛇三兩黑花蛇三兩酒浸右各叧為末每服五錢溫酒調下日後酒多尤妙補氣瀉榮湯治癘風升麻連翹各六分蘇木當歸黃連黃茋全蝎地龍去土各五分生地黃荆芥各四分人參梧桐淚各一分桔梗麝香少許桃仁三箇白豆蔲蠓蟲去翅足炒三箇水蛭炒煙盡三箇右先將豆蔲麝香水蛭蠓蟲各叧為末和勻却將前藥用水二鍾煎至一鍾去柤入桐淚前末再煎至七分空心熱服海藏愈風丹治癩病手足麻木眉毛脫落遍身生瘡及癘風癮疹皮膚燥癢搔破成瘡並皆治之皂角乙斤銼寸許無灰酒浸一宿以水一碗挼成汁去柤以砂器中文武火熬土花蛇二條去腸陰乾酒浸取淨肉晒乾為末大風症治之苦參一斤取末四兩白花蛇烏稍蛇各一條依前酒浸取肉為末右為末入前二味為丸桐子大每服六七十丸空心通聖散送下乾物壓之日三服間日浴之汗出為度愚按前方果係癘風用之必效若肝經血熱脾經血虛腎經虛火脾肺氣虛遍身作癢搔破成瘡或內熱生風而􅤫鬢脫落或皮膚赤暈或搔起白屑而類癘風者服之反成癘風矣二聖散治癘瘡大黃五錢皂角刺三錢燒灰右為末每服二錢白湯調下早服樺皮散中服升麻湯下瀉青丸晚服二聖散皆為疏泄血中風熱也清胃散治熱毒在表以此發散之升麻白芷防風白芍藥乾葛甘草當歸川芎羌活麻黃紫浮萍木賊草各等分右每服五七錢水煎防風通聖散治風熱熾盛大便祕結發熱煩躁表裡俱實者防風當歸川芎芍藥大黃煨􅉭硝連翹薄荷麻黃桔梗石膏煨黃芩炒各一兩白术山梔荆芥各五錢五分甘草二兩滑石三兩白芷蒺䔧炒鼠粘子各五錢右為末每服三五錢白湯調下透經解攣湯治風熱筋攣骨痛荆芥紅花蘇木羌活當歸防風蟬殼去土天麻甘草各七分白芷一錢連翹川芎各五分穿山甲三錢炮右水酒各半煎服秦芁地黃湯治風熱血燥筋骨作痛秦芁生地黃當歸川芎羌活防風荆芥甘草白芷升麻白芍藥大力子蒸蔓荆子各一錢右水煎服羌活當歸散治風毒血熱頭面生瘡或赤腫或成塊或癮疹搔癢膿水淋漓羌活當歸川芎黃連酒浸炒鼠粘子蒸防風荆芥甘草黃芩酒浸炒連翹白芷升麻各一錢右酒拌晒乾水煎羌活白芷散治風熱血燥手掌皺裂或頭面生瘡或遍身腫塊或膿水淋漓羌活白芷軟柴胡荆芥蔓荆子防風甘草豬牙皂角黃芩黃連酒炒各一錢右水煎服四生散治腎臟風耳鳴目癢鼻赤齒浮或婦女血風瘡白附子獨活黃茋白蒺䔧各等分右為末每服二錢用豬腰子劈開入藥濕紙裹煨熟細嚼鹽湯下風癬酒下為丸亦可消風散治風熱癮疹癢痛或膿水淋漓或頭皮腫癢荆芥穗甘草炙各二錢陳皮五錢人參白殭蠶炒茯苓防風芎藭蟬殼去土羌活藿香各一兩厚朴薑製五錢右每服五七錢薑水煎九味羌活湯治一切外因瘡毒羌活防風蒼术各一錢五分川芎白芷生地黃黃芩甘草各一錢細辛五分右水煎服當歸飲治血熱癮疹癢痛或膿水淋漓發熱等症當歸白芍藥川芎生地黃防風白蒺䔧荆芥各一錢五分黃茋炒甘草何首烏各一錢右水煎服升麻湯治風熱身如蟲行或唇反縱裂升麻三分茯苓人參防風犀角鎊羌活官桂各二錢右每服四錢水煎下瀉青丸樺皮散治肺風瘡疥癮疹及風刺粉刺樺皮四兩炒灰荆芥穗二兩甘草炙五錢枳殼四兩去穰燒煆存性杏仁二兩去皮尖叧研右為末磁器貯之每服四五錢水煎胡麻散治風熱癮疹搔癢或兼赤暈寒熱形病俱實者胡麻一兩二錢苦參八錢荆芥穗八錢首烏不見鐡器八錢葳靈仙防風石菖蒲牛蒡子炒甘菊花蔓荆子甘草炒各六錢白蒺䔧炒去刺同右每服三錢酒調易老祛風丸治疥癩風瘡黃茋枳殼炒防風芍藥甘草地骨皮枸杞子熟地黃生地黃各酒拌杵膏右各叧為末入二黃膏加煉蜜丸桐子大每服七八十丸白湯下白丁香散治癘風眼中生胬肉白丁香貝母右為末人乳汁調點眼內子和生􅤫散治癘風􅤫毛脫落半夏羊糞各等分右為末薑汁調塗􅤫稜上如不應當參類症􅤫脫條治之泄洗癘瘡藥何首烏荆芥防風馬鞭草蔓荆子各等分右每用十兩水一斗煎數沸無風處洗出汗解毒散治風瘡解外毒巴豆肉皮硝各一兩黃蜂窠黑狗脊各七錢白芷雄黃牙皂角羊蹄根輕粉蟬殼去上枯礬寒水石各五錢右為末臘豬油調搽外毒既去却搽黃連散愚按洗藥雖能疏通腠理而損元氣解毒散雖能攻毒而傷良肉不宜多用黃連散治癘瘡清熱解毒黃連五兩五棓子一兩右為末唾津調塗之加味逍遙散治血虛有熱遍身搔癢心煩目昏怔忡頰赤口燥咽乾發熱盜汗食少嗜卧當歸炒芍藥酒炒茯苓白术炒各一錢柴胡五分牡丹皮甘草炙山梔炒各八分右水煎服當歸補血湯治肌熱惡寒面目赤色煩渴引飲脈洪大而虛重按似無此血虛也若誤服白虎湯必死黃茋炙一兩當歸酒製二錢右水煎服補中益氣湯治中氣不足或因尅伐四肢倦怠口乾發熱飲食無味或飲食勞倦頭痛煩躁惡寒自汗氣喘身熱等症人參當歸各一錢黃茋炒白术各一錢半甘草炙一錢半陳皮五分柴胡升麻各三分右薑棗水煎空心午前服四君子湯治脾胃虛弱飲食少思大便不實等症人參白术茯苓各二錢甘草炙一錢右薑棗水煎六君子湯治脾胃損傷飲食少思或大便不調面色痿黃等症即四君子加陳皮半夏七味白术散治中氣虛弱津液不足口乾作渴或口舌生瘡不喜飲冷吐瀉等症人參白术木香白茯苓甘草炙藿香各五分乾葛一錢右水煎服四物湯治血虛發熱煩躁或晡熱作渴頭目不清若因脾虛不能生血者用四君子湯當歸熟地各二錢芍藥炒川芎各一錢右水煎服歸脾湯治憂思傷脾內熱發熱或血妄行吐下或健忘驚悸少寐或婦女經候不準晡熱內熱或唇口遍身瘡疥等症白术黃茋炒當歸茯神人參龍眼肉逺志酸棗仁炒各一錢木香五分甘草炙三分右薑棗水煎八珍湯治氣血俱虛惡寒發熱或煩躁作渴等症即前四君四物二方相合十全大補湯治症同上或更兼自汗盜汗體倦食少等症即八珍湯加黃茋肉桂聖愈湯治一切失血或血虛煩渴躁熱卧睡不寧或瘡症膿水出多五心煩熱作渴等症熟地生者自製生地黃當歸酒拌各一錢人參黃茋炒川芎各二錢右水煎服芎歸湯治失血煩熱作渴或頭痛眩暈川芎三錢當歸酒拌五錢右水煎服竹葉黃茋湯治氣血虛胃火盛而作渴淡竹葉生地各二錢黃茋麥門冬當歸川芎黃芩炒甘草芍藥人參半夏石膏煆各一錢右水煎服竹葉石膏湯治胃火盛而作渴淡竹葉石膏煅桔梗木通薄荷甘草各一錢右薑水煎濟生犀角地黃湯治胃火盛血熱妄行或吐衄便血形氣虛病氣實者犀角鎊生地黃赤芍藥牡丹皮各一錢半右水煎傾出入犀末服若形氣病氣俱實再加黃芩黃連若因氣惱而致加山梔柴胡桃仁承氣湯治血結胸中手不可近或中焦畜血寒熱胸滿漱水不欲咽善忘昏迷其人如狂桃仁五分大黃一錢甘草三分肉桂五分右水煎服瀉青丸治肝經風熱頭目昏眩肌肉瞤動或牙關緊急痰涎壅盛或頸項脅肋小腹陰囊腿股作痛凡屬肝經有餘之症用之當歸川芎山梔龍膽草酒拌炒焦大黃炒羌活防風各等分右為末蜜丸桐子大每服二三十丸白湯下梔子清肝散治三焦肝膽經血虛風熱耳項胸乳等處癢痛或發熱寒熱晡熱自汗或目唇搐動柴胡梔子丹皮各一錢茯苓川芎芍藥當歸牛蒡子炒各七分甘草五分右水煎服柴胡清肝散治風熱怒火或寒熱嘔吐等症柴胡山梔炒各錢半黃芩炒人參川芎各一錢連翹桔梗各八分甘草五分右水煎服當歸川芎散治手足少陽經血虛風熱耳內癢痛或寒熱少食頭目不清日晡熱甚當歸川芎柴胡白术芍藥各一錢山梔炒錢二分牡丹皮茯苓各八分蔓荆子甘草各五分右水煎服小柴胡湯治肝膽經風熱或寒熱往來或晡熱潮熱默默不欲飲食或因怒火口苦耳聾脅痛等症柴胡二錢黃芩一錢半人參半夏各一錢甘草炙五分右薑棗水煎大蘆薈丸治疳火下疳或小兒疳膨食積口鼻生瘡或牙齦蝕爛或蟲蝕肛門癢痛胡黃連蘆薈黃連炒木香白蕪荑炒青皮白雷丸鶴虱草各一兩麝香一錢右為末蒸餅糊丸桐子大每服一錢空心米湯下加味地黃丸治腎經陰虛耳內癢痛或兩目昏花或吐痰氣喘作渴發熱小便赤澀等症乾山藥山茱茰牡丹皮澤瀉白茯苓熟地黃自製生地黃柴胡五味子各叧為末等分右二地黃搯碎酒拌濕杵膏入前末和勻煉蜜丸桐子大每服百丸空心白湯下二陳湯治中脘停痰嘔吐惡心或頭目不清飲食少思陳皮茯苓半夏甘草炙各一錢右薑棗水煎連翹飲子治目惡日光或癮澀昏花不能久視迎風有淚蔓荆子甘草連翹各三錢黃茋炒柴胡黃芩酒拌五分生地黃當歸紅葵花人參各三分升麻防風羌活各一錢右水煎服四物龍膽湯治肝經風熱眼暴赤痛或生雲翳當歸川芎芍藥生地黃羌活防風防己膽草酒拌炒焦右水煎服四物二連湯治血虛五心煩熱晝則明了夜則發熱當歸生地黃白芍炒各一分川芎七分黃連炒五分胡黃連三分右每服五錢水煎地芝丸治目能近視不能逺視此陽氣不足陰氣有餘生地焙乾四兩天門冬去心枳殼麩炒甘菊花各二兩右為末煉蜜丸桐子大每服百丸清茶下定志丸治目能逺視不能近視此陰氣不足陽氣有餘白茯苓人參各二兩逺志去心石菖蒲各一兩右為末煉蜜丸桐子大以硃砂為衣每服二三十丸溫酒下日三服神效黃茋湯治渾身或頭面手足麻木不仁兩目緊縮羞明畏日或視物不明黃茋二兩人參八錢甘草炙白芍藥蔓荆子各一兩陳皮五錢右每服五錢水煎臨卧熱服如麻木不止更加黃茋雖有熱症不用黃柏益氣聰明湯治脾胃傷損眼目昏暗或飲食勞役脾胃不足致內瘴耳鳴黃茋甘草炙人參各五錢升麻葛根黃柏炒各二錢芍藥一錢蔓荆子一錢七分右每服五錢水煎臨卧及五更服脾胃虛去黃柏清涼飲治實熱大便祕結或咽喉腫痛當歸赤芍藥甘草炒大黃蒸各等分右每服五錢水煎清胃散治脾胃濕唇齒作痛或齒齦潰爛或連頭面作痛或發熱惡寒或熱藥厚味所致生地黃酒拌當歸酒洗牡丹皮黃連各五分升麻一錢右水煎服如痛未止加石膏之類涼膈散治上焦實熱煩躁作渴或喉舌腫痛便溺祕赤大黃朴硝甘草梔子仁黃芩薄荷各一兩連翹四兩右每服三五錢水煎黃連解毒湯治瘡瘍焮痛煩躁飲冷脈洪數發狂言黃芩黃連黃柏山梔各炒錢半右水煎服瀉黃散治胃經實熱嘔吐或口舌生瘡石膏煆藿香各一錢山梔一錢五分甘草五分防風七分右水煎服潤腸丸治脾胃伏火傷血或失血大腸乾燥大便不通或風熱血結便祕食少羌活當歸尾麻子仁桃仁去皮尖叧研大黃煨皂角仁各一兩秦芁五錢右為末煉蜜或豬膽汁丸桐子大每服三五十丸食前滚湯下如燥糞在肛門之間用膽汁導之即通若因津液乾涸不通當補氣血滋腎丸治不渴而小便不利者乃膀胱經熱甚不能生水宜用此藥以滋化源肉桂三錢知母黃柏各酒炒黑二兩右為末水丸桐子大每服二百丸空心白滚湯下清肺飲治渴而小便不利乃肺經有熱絶寒水生化之源宜用此藥茯苓二錢豬苓二錢燈心一錢木通七分􅜰麥五分扁蓄三分右為末作二劑水煎黃芩清肺飲治肺燥而小便不利黃芩山梔各一錢右水煎服五淋散治膀胱有熱水道不通淋澀不出或尿如豆汁或成砂石或熱拂便血赤芍藥山梔各一錢當歸甘草各一錢二分赤茯苓一錢五分右用燈心二十莖水煎服清心蓮子飲治熱在血分口乾便濁夜則安靜晝則發熱或口舌咽乾或生瘡煩渴小便澀淋黃芩麥門冬地骨皮車前子炒甘草各一錢五分石蓮肉茯苓黃茋炒柴胡人參各一錢右水煎服升陽益胃湯治脾胃虛弱怠惰嗜卧或值秋令體重節痛大便不調小便頻數飲食不消灑淅惡寒悽慘不樂面色不和乃陽不升也羌活獨活防風各五錢柴胡白术茯苓渴者不用澤瀉各三錢人參黃茋各二兩半夏甘草炒各一兩芍藥黃連炒陳皮各三錢右每服三五錢薑棗水煎若服後小便愈數而病愈加不宜分利小便當減茯苓澤瀉生脈散治熱傷元氣肢體倦怠氣短懶言汗出不止口乾作渴等症人參五錢麥門冬二錢五味子一錢右水煎服如不應倍之清燥飲治氣血虛弱濕熱乘之遍身酸軟或濕熱行令肺金受邪腎無所養小便赤少大便不調或腰腿酸軟體重麻木或頭暈食少自汗口乾胸滿氣促懶於言語黃茋蒼术各一錢人參白术神麯炒陳皮各五分甘草炙黃柏炒麥門冬當歸各三分葛根澤瀉青皮各二分五味子九粒右水煎服二神丸治脾胃不足侵晨作㵼或不時去後飲食少思肌肉消瘦補骨脂四兩肉豆蔲二兩生薑四兩紅棗四十九枚右用水一盞煮薑棗至水乾取棗肉和藥末杵勻丸桐子大每服五七十丸淡鹽湯下六味丸一名地黃丸加肉桂五味名加減八味丸治腎虛發熱作渴痰咳頭暈喉燥唇裂腰腿酸軟或自汗盜汗便血諸血失音水泛為痰小便淋漓等症牡丹皮白茯苓澤瀉各三兩熟地自製八兩山茱茰去核乾山藥各四兩右為末地黃杵膏加煉蜜丸桐子大每服七八十丸空心食前滚湯下加減金匱腎氣丸治脾胃虛腰重腳腫小便不利或肚腹腫脹四肢浮腫或喘急痰盛已成蠱症其效如神白茯苓三兩附子五錢川牛膝肉桂車前子澤瀉山茱茰山藥牡丹皮各一兩熟地黃四兩酒拌杵膏右為末和地黃加煉蜜丸桐子大每服七八十丸空心米飲下五味異功散治脾胃虛弱飲食少思或食而難化大便不實等症人參白术炒茯苓各二錢甘草炙陳皮各一錢右水煎服四神丸治脾腎虛弱大便不實飲食少思等症肉豆蔲五味各二兩補骨脂四兩吳茱茰炒一兩右為末水二碗生薑八兩紅棗百枚煮熟取棗肉和末丸桐子大每服五七十丸空心食前白湯下愈風丹治諸風肢體麻木手足不隨等症天麻牛膝酒浸焙萆薢玄參各六兩杜仲七兩羌活十四兩當歸熟地黃自製生地黃各一斤獨活五兩肉桂三兩右為末煉蜜丸桐子大每服七十丸溫酒下瀉白散治肺經實熱咳嗽桑白皮地骨皮各一兩甘草五錢右為末每服三錢白湯調下半夏白术天麻湯治寒氣所鬱大便不利或嘔不食痰唾稠粘頭目眩運喘促氣短或頭痛身重四肢逆冷半夏天麻黃茋人參蒼术陳皮澤瀉茯苓各一錢五分白术神麯炒各一錢大麥芽乾薑炒黑各三分黃柏酒製二分右每服五錢水煎服牛黃清心丸治諸風手足不隨痰涎壅盛言語蹇澀心忡健忘或發顛狂防風白术白芍藥羚羊角鎊麝香叧研龍腦叧研麥門冬去心黃芩各一兩人參神麯炒蒲黃炒各二兩甘草五兩白茯苓芎藭杏仁去皮尖桔梗各一兩二錢半柴胡兩二錢半雄黃叧研二錢山藥七錢五分牛黃叧研一兩二錢白蘞乾薑各七錢五當歸酒浸兩半大豆黃卷阿膠肉桂各兩七錢犀角二兩大棗一百枚蒸熟杵金箔一千三百片內四百為衣右為末和勻同棗肉加煉蜜丸龍眼大以金箔為衣每服二丸白湯化下人參理中丸治脾胃虛寒嘔吐泄瀉飲食少思等症白术炒人參乾薑炮甘草炙各等分右為末丸桐子大每服六七十丸白湯下人參平肺散治心火尅肺傳為疳痿咳嗽喘嘔痰涎壅盛胸膈痞滿咽嗌不利人參陳皮甘草炙地骨皮茯苓各一錢知母炒七分五味杵炒四分青皮五分桑白皮炒一錢天門冬四分去心右水煎服決明夜靈散治目至夜則昏雖有燈月亦不能睹石決明夜明砂各叧研二錢豬肝一兩或羯羊肝亦可右以竹刀切肝作二片鋪藥於內用線縳定砂罐內米泔水煮至半碗臨睡連肝服之人參益氣湯治暑熱傷氣肢體困倦飲食少思或發熱作渴等症黃茋八錢人參甘草各五錢炙甘草升麻柴胡各二錢白芍藥三錢五味一百四十粒右作四劑水煎服四七湯治七情鬱結成痰或如梅核梗於喉間或中脘停痰惡心嘔逆紫蘇葉厚朴薑製茯苓各一錢半夏薑製一錢五分右薑棗水煎硫黃散治紫白癜風硫黃一兩用醋一碗煎乾再晒右為末以生薑蘸藥擦患處神效當歸膏治風瘡去腐肉生新肉其肉赤黯毒氣熾盛搽至淡赤或其毒已退收功甚速此膏生肌止痛補血續筋故與新肉相宜當歸黃蠟生地各一兩麻油六兩右先將地黃當歸入油煎黑去柤入蠟溶化候冷攪勻即成膏矣如用白蠟尤好砭法治風毒瘀血壅盛或色赤走徹用細磁器擊碎取有鋒甚者一塊以筯一根劈開頭夾之用線縳定兩指輕撮筯稍令磁芒正對患處懸一寸許再用筯一根頻擊筯頭令毒血遇刺皆出妙香散治心氣不足精神恍惚虛煩少睡盜汗等症甘草炒一錢人參桔梗各五錢逺志去心炒山藥薑汁茯神黃茋各一兩辰砂叧研三錢麝香二錢木香煨二錢五分右為末每服二錢溫酒調下四味肥兒丸治小兒食積五疳或白痿體瘦肚大青筋髮稀成穗或遍身瘡疥等症蕪荑炒神麯炒麥蘖炒黃連各等分右為末豬膽汁丸黍米大每服一二十丸木通煎湯下米糊丸亦可地黃清肺飲治肺肝咳嗽馬兜鈴甘草各五分粘米炒十粒鼠粘子三分炒明阿膠一錢麵炒杏口仁七枚去皮尖右水煎服量兒加減蟾蜍丸治無辜疳症一服虛熱退二服煩渴止三服瀉痢愈蟾蜍一枚夏月溝渠中取腹大不跳不鳴身多㿔者右取糞蛆一枚置桶中以尿浸之却將蟾蜍跌死投與蛆食一晝夜用布袋盛蛆置急水中一宿取出瓦上焙乾為末麝香一字和勻粳米飯丸麻子大每服二三十丸米飲下甚效小柴胡湯加山梔牡丹皮名加味小柴胡湯治傷寒溫熱身熱惡風頭痛項強四肢煩疼往來寒熱嘔噦痰實中暑瘧疾並服之方見前愚按前方若肝膽經風熱肝火瘰􅐇寒熱往來日晡發熱潮熱身熱不欲飲食或怒火口苦耳聾咳嗽或脅痛胸滿小便不利或泄瀉吐酸若水或肢體搐動唇目抽劄並宜用之神效太乙膏治癰疽瘡毒潰爛玄參白芷當歸肉桂赤芍藥大黃生地黃各一兩右用麻油二斤八兩銅鍋內煎至黑濾去徐入淨黃丹一斤再煎滴水中捻軟硬得中即成膏矣金華散治乾濕瘡癬黃丹一兩煅輕粉三錢黃柏黃連各一兩麝香一字叧研右為末洗淨摻之乾用豬脂和傅麻油亦可一方治惡癬以紫貝草根生白礬少許同擂塗患處又一方剪刀草黃連苦參各五錢真輕粉二錢右為末入麻油調敷大麻子膏治一切瘡疥膿窠等瘡大楓子肉白礬枯各二兩真輕粉一兩桕油六兩右為末將油溶化和勻用之加味逍遙散治肝脾血虛身發赤痕或發熱胸乳腹脹或搔癢盜汗心煩體痛或頭目昏重怔忪頰赤或口燥咽乾食少嗜卧或婦女月經不調惡寒發熱等症方見前歸脾湯治憂思傷脾身發赤痕或搔破成瘡健忘怔忡驚悸少寐或心脾作痛自汗盜汗咳吐痰血或肢體作痛大便不調或婦女經候不準晡熱內熱或唇口生瘡流注等症方見前白癜風方人參白术蒼术鹽炒防己酒拌黃柏酒炒川芎各一錢陳皮酒拌當歸茯苓木瓜柴胡稍甘草各五分右薑水煎服如三劑不退加桂少許或用湯煎小便澀倍用牛膝有熱加黃連身熱加羌活量兒大小用化𧈟丸治諸疳生蟲不時啼哭嘔吐清水肚腹脹痛唇口紫黑腸頭濕𧈟蕪荑青黛蘆薈蝦蟆燒灰川芎白芷胡黃連右各叧為末等分豬膽浸膽成糕丸如麻子大每服一二十丸食後并臨卧杏仁湯下大肥兒丸治脾疳飲食少思肌肉消瘦肚大頸細髮稀成穗項問結核發熱作渴精神倦怠便去酸臭愛食泥土或口鼻頭瘡或吐見素筋嚙齒下利便白五疳即肥兒丸加乾蟾一兩蕪荑五錢天麻丸治肝疳眼目生翳昏花濕爛等症青黛川黃連天麻五靈脂川芎夜明砂微炒蘆薈龍膽草防風蟬蛻去足各一錢全蝎二枚焙麝香少許右為末豬膽汁浸糕丸麻子大每服二三十丸白滚湯下阿魏膏治一切痞塊不拘年月逺近甚者口齒蝕傷更服蘆薈丸羌活獨活玄參官桂赤芍藥穿山甲生地黃兩頭尖大黃白芷天麻各五錢木鱉子二十枚去殼紅花四錢槐栁桃枝各三錢亂髮如雞子大一塊洗去膩右用香油二斤四兩煎至黑色去柤入髮再煎待髮化盡去柤徐下黃丹一斤煎至軟硬得中方入芒硝四錢阿魏三錢蘇合油麝香沒藥各五錢調勻即成膏矣攤貼患處內服消積丸藥黃丹須真正者效凡貼膏藥先用朴硝隨患處大小鋪之約半指厚以紙蓋之用尉斗尉良久如硝耗再加尉之尉二時許方貼膏藥若是肝積加蘆薈末同尉大防風湯治膝風腫痛不問已潰未潰附子炮去皮牛膝酒浸甘草炙各一錢人參杜仲薑製當歸浸酒羌活防風白芍藥炒黃茋各二錢川芎一錢五分熟地黃用生者酒拌蒸一日忌鐡器二錢右每服三五錢薑水煎空心服進三五劑更服六味地黃丸二三服獨活湯治鶴膝風不問腫潰疼痛及腰背四肢不仁獨活當歸白术黃茋炒薄桂牛膝各一錢甘草炙五分右薑蔥水煎服量兒加減清熱消毒散治癰疽陽症腫痛發熱作渴黃連山梔連翹當歸各五分川芎芍藥炒生地黃金銀花各一錢甘草五分右水煎服神功散治瘡毒未成者用之內消加乳沒尤妙黃柏炒草烏炒血竭等分右各叧為末和勻用潄口水調搽小兒丹瘤用之亦效已砭者用之作痛乳香定痛散治瘡瘍潰爛疼痛乳香沒藥各三錢滑石七錢寒水石一兩煅氷片二錢右為細末搽患處痛即止甚效加減抱龍丸治風痰壅盛驚搐昏睡等症雄黃辰砂各二錢天竺黃四錢麝香五分天麻六錢牛膽南星八錢右為末煎甘草膏丸皂角子大每一丸薄苛湯下解毒散治一切瘡毒風疹癢痛黃柏炒山梔等分右為末水調搽若破而膿水淋漓用當歸膏或燭油調搽黃金散治天疱瘡止痛消毒滑石甘草等分右為末挑破去水敷之清涼解毒散治症同前或作焮痛大黃黃柏山梔寒水石煅等分右各叧為末調搽當歸膏尤好製附子法附子重一兩三四錢有蓮花瓣頭底圓平者先備童便五六碗將附子先埋熱草灰中半日乘熱投童便浸五七日揭皮切四塊仍浸二三日用粗紙數重包之浸濕埋灰大半日取出切片檢視有白星者乃用瓦上炙熟至無白星為度如急用即切火上炙黃用之亦效大凡陽氣脫陷子時至午時惡寒未至亥發熱如用熟附子不應必用半生半熟更不應急生附一二劑然後量症治之薛氏醫案卷十九
