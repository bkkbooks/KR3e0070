body:
  text: 薛氏醫案卷五十三明薛已訂錢氏小兒直訣四瀉青丸治肝經實熱急驚搐搦羌活大黃川芎龍膽草炒山梔仁當歸防風各等分右為末煉蜜丸芡􅧙大每服半丸煎竹葉湯入砂糖化下薛按前方足厥隂肝經解散肌邪疏通內臟之苦寒藥也若大便祕結煩渴飲冷飲食如常屬形病俱實宜用此瀉之若大便調和煩渴飲冷屬病氣實而形氣虛宜用抑青丸平之若大便不實作渴飲湯飲食少思肢體倦怠屬形病俱虛宜用地黃丸補之若肝經血虛生風先用四物湯加鈎藤鈎以生肝血繼用四君子湯以補脾土若因肝經血燥生痰用地黃丸生腎水益肝血若土不能培木用四君子湯加當歸以補中用地黃丸以滋腎若因肺金尅肝木用六君子湯加芍藥木香實脾土以平肺金若因心虛奪母之氣或腎水虛不能生肝木者並用地黃丸主之若屢服峻劑而脾胃虛寒者必用六君子湯加丁香木香補脾胃以培陽氣若因乳母恚怒肝火妄動致兒為患者母服加味小柴胡湯若因乳母肝脾血虛發熱致兒為患者母服加味逍遙散子亦服數滴抑青丸即前方去山梔大黃抑肝散治肝經虛熱發搐或發熱咬牙或驚悸寒熱或木乘土而嘔吐痰涎腹膨少食睡卧不安者軟柴胡五分川芎八分當歸白术炒茯苓各一錢甘草五分鈎藤鈎一錢右水煎子母同服瀉心湯治心經實熱黃連右為末每服五分臨卧溫水化下薛按前症若呌哭發熱作渴飲水抽搐有力仰面而睡者屬心經實熱宜用瀉心湯或導赤散若發熱飲湯抽搐之力驚竄咬牙合面而睡者屬心經虛熱用補心散若喘嗽面赤壯熱飲水肺乘心也用瀉白散若頭搖目劄身熱抽搐肝乘心也用柴胡清肝散若合目昏睡泄瀉身熱脾乘心也用瀉黃散若竄視驚悸咬牙足熱腎乘心也用安神丸若因乳母致症亦用前藥以治其母導赤散治小腸實熱小便祕赤生地黃木通甘草炒各等分右為末每服一錢入淡竹葉水煎薛按瀉心湯導赤散瀉心小腸實火之劑蓋心為脾母脾為心子然心既病則脾土益虛矣用者審之生犀散治心經虛熱地骨皮赤芍藥柴胡乾葛各一兩甘草五分犀角二錢鎊右為末每服一二錢水煎薛按前方云治心經虛熱然其所用多屬㵼心瀉肝脾之劑蓋虛熱二字恐傳寫之誤假如心經自病而血虛熱者用祕旨安神丸脾虛奪心之氣而熱者用祕㫖補脾湯肝木不能生心火而虛熱者用地黃丸祕旨安神丸治心血虛而睡中驚悸或受驚嚇而作人參半夏湯泡酸棗仁炒茯神各一錢當歸酒洗橘紅赤芍炒各七分五味子五粒杵甘草炙三分右為末薑汁糊丸芡􅧙大每服一丸生姜湯下瀉黃散治脾胃實熱山梔仁一兩石膏五錢藿香葉甘草各七錢五分防風二兩右用蜜酒微炒為末每服一二錢水煎薛按前症若作渴飲冷卧不露睛手足熱甚或遍身發黃屬胃經實熱宜用瀉黃散若作渴飲湯卧而露睛手足並冷屬胃經虛熱宜用異功散若面青搐搦乳食少思肝乘脾也用祕旨補脾湯若面赤驚悸身熱昏睡心乘脾也用祕旨安神丸若面白喘嗽肢體倦怠肺乘脾也用補中益氣湯若唇黑泄瀉手足指冷腎乘脾也用益黃散病後津液不足口乾作渴宜用七味白术散若乳母膏粱厚味七情鬱火所致當審其因而治其母五味異功散治脾胃虛弱吐瀉不食人參茯苓白术甘草炒陳皮各等分右為末每服三錢薑棗水煎薛按前方補脾胃之聖藥也况人之一身以脾胃為主若小兒乳食失節寒凉失宜或乳母六淫七情失調兒飲其乳諸病頓起當専以此藥治之其應如響益黃散治脾土虛寒嘔吐泄瀉丁香二錢陳皮青皮訶子肉各五錢甘草炙三錢右為末每服一二錢水煎薛按前症若因脾土虛弱而吐瀉者用五味異功散若因肝木侮脾土而吐瀉者用六君子加柴胡如不應或手足指冷屬脾胃虛寒也更加木香炮薑若因乳母脾土虛而肝木侮亦治以前藥若乳母鬱怒致兒患前症母服加味歸脾湯人參安胃散治因服峻厲脾胃虧損或成慢驚泄瀉嘔吐或腸胃有熱以致前症人參一錢黃茋二錢生甘草炙甘草各五分白芍藥七分白茯苓四分黃連二分右為末每服二三錢水煎七味白术散治吐瀉或病後津液不足口乾作渴人參白术木香白茯苓甘草炙藿香葉各一錢乾葛二錢右為末每服二三錢水煎薛按胃傷則嘔脾傷則瀉故用前藥調補胃氣以化生津液如無他症只因胃氣虛而津液不足者用四君子湯尤效祕旨補脾湯治久病面黃肌瘦咬牙目劄頭髮稀少誤藥所致人參白术各一錢白芍藥酒炒白茯苓各八分陳皮川芎各六分甘草炙黃茋蜜炙當歸酒洗各四分右每服二三錢薑水煎瀉白散治肺經實熱咳嗽痰喘甘草炙五錢地骨皮一兩桑根白皮炒一兩右為末每服一二錢入粳米百粒水煎薛按活人方云喘者肺氣有餘也氣盛當認作氣衰有餘當認作不足肺氣盛者乃肺中之火盛也有餘者肺中之邪有餘也故用前藥以瀉之若土虛不能生肺用補中益氣湯火來剋金用人參平肺散腎水奪母之氣或隂火上炎用地黃丸若肺虛肝木乘侮先用阿膠散後用瀉青丸若因乳母肺經受症致兒為患母服前散若因乳母感冒風寒肺經鬱熱致兒為患用十味參蘇飲若因乳母膏粱醇酒積熱致兒為患用加味清胃散阿膠散治肺虛咳嗽口乾作渴馬兜鈴五錢甘草炙一錢糯米一兩杏仁七箇去皮尖明阿膠一兩麩炒鼠粘子二錢五分右為末每服二錢水煎薛按前症若因脾胃弱而肺氣虛者宜用補中益氣湯若肺金自虛者宜用四君子湯地黃丸治腎虛解顱或行遲語遲等症澤瀉三錢牡丹皮三錢白茯苓三錢熟地黃八錢酒洗山茱萸肉乾山藥各四錢右地黃杵膏餘為末加煉蜜丸桐子大每服二三十丸空心白湯下薛按前丸治腎經虛熱作渴小便淋祕痰氣上壅或肝經血虛燥熱風客淫氣而患瘰􅐇結核或四肢發搐眼目瞤動或肺經虛火咳嗽吐血頭目眩暈或咽喉燥痛口舌瘡裂或心經血虛有火自汗盜汗便血諸血或脾虛濕熱下刑於腎腰膝不利或疥癬瘡毒等症並用前藥為主而佐以各臟之藥大抵此藥為天一生水之劑若稟賦不足肢體瘦弱解顱失音或畏明下竄五遲五軟腎疳肝疳或早近女色精氣虧耗五臟齊損凡諸虛不足之症皆用此以滋化源其功不能盡述四君子湯治脾氣虛弱飲食不化腸鳴泄瀉或嘔穢吐逆人參白茯苓白术甘草炙各五分右水煎服四物湯治肝經血虛發熱日晡益甚或煩躁不寐白芍藥一錢川芎五分當歸熟地黃各二錢右作二劑水煎服八珍湯治氣血俱虛或因失血過多或因剋伐元氣以致內熱發熱肢體瘦瘁即四物四君子二湯合服十全大補湯治氣血虛熱或因病後惡寒發熱或自汗盜汗食少體倦或發熱作渴頭痛眩運等症即八珍湯加黃茋肉桂六君子湯治脾胃虛弱體瘦面黃或久患瘧痢不思乳食或嘔吐泄㵼飲食不化或時患飲食停滯或母有前症致兒為患人參白术茯苓各二錢陳皮半夏甘草炙各一錢右每服二三錢薑棗水煎補中益氣湯治中氣不足困睡發熱或元氣虛弱感冒風寒諸症或乳母勞役發熱致兒為患黃茋炙人參白术炒甘草炙當歸陳皮各五分升麻柴胡各二分右薑棗水煎香砂助胃膏治胃寒吐瀉乳食不化人參白术炒各五錢白茯苓五錢甘草炙丁香各一錢砂仁四十箇乾山藥一兩白豆蔲十四箇肉豆蔲四箇煨右為末煉蜜丸芡􅧙大每服二三丸米飲磨化人參養胃湯治外感風寒內傷生冷寒熱如瘧或嘔逆惡心人參厚朴薑製蒼术製半夏湯泡藿香草果仁茯苓各五錢甘草炙二錢橘紅二錢五分右每服二三錢薑三片烏梅一箇水煎大蕪荑湯治小兒脾疳少食發熱作渴大便不調髮黃脫落面黑便清鼻下生瘡能乳嗜土等症蕪荑山梔各五分黃柏甘草炙黃連防風各二分麻黃羌活柴胡各三分白术茯苓當歸各四分右作二劑水煎肥兒丸治食積五疳頸項結核髮稀成穗發熱作渴等症黃連炒神麯炒各一兩木香一兩五錢檳榔二十箇豆蔲二兩炮史君子酒浸麥芽炒各四兩右為末麵糊丸麻子大每服四五十丸米飲下良久用五味異功散一服以助胃氣九味蘆薈丸治小兒肝脾疳積體瘦熱渴大便不調或瘰癧結核耳內生瘡等症蘆薈胡黃連黃連木香蕪荑炒青皮白雷丸鶴虱草各一兩麝香三錢右為末蒸餅糊丸麻子大每服一二錢空心白湯下黃連丸治疳癆瓜蔞根烏梅肉杏仁浸去皮焙石蓮各二錢黃連五錢膽汁浸晒右為末牛膽汁浸糊丸麻子大每服一二十丸煎烏梅薑蜜湯下木香丸治冷疳木香青黛檳榔肉豆蔲麝香各錢五分續隨子一兩去油蝦蟆三箇燒存性右為末蜜丸菉豆大每服三五丸煎薄荷湯下愚按前方消疳清熱逐水破氣之劑然云冷疳者乃陽氣虛而脾胃冷也其檳榔續隨子恐導損真隂尅伐陽氣治當審之胡黃連丸治熱疳胡黃連黃連各五錢朱砂二錢另研右為末填入猪膽內以線扎懸掛銚中淡漿水煮數沸取出研入蘆薈麝香各二錢飯和丸麻子大每服一二十丸米飲下愚按前症當以本方為主佐以四君子加蕪荑脾胃虛甚者以四君子加蕪荑為主以前丸為佐如聖丸治冷熱疳瀉胡黃連川黃連白蕪荑炒各二兩五錢麝香五分另研乾蝦蟆五箇酒煮杵膏右為末以蝦蟆膏杵丸麻子大每服一二十丸煎人參湯下薛按疳之為患乃肝脾虛熱津液乾涸之症前方乃専於治疳清熱之劑若脾胃虛弱者當佐以六君子湯調補胃使邪氣退庶可收全功也蘭香散治鼻疳赤爛銅青輕粉各五分蘭香葉二錢燒灰右為末乾貼白粉散治諸疳瘡海螵蛸三分白芨二分輕粉一分右為末先用漿水洗拭乾貼薛按前二方治表之藥如未愈用四味肥兒丸以治其內四味肥兒丸治食積脾疳目生雲翳口舌生瘡牙根腐爛發熱瘦怯遍身生瘡又治小便澄白腹大青筋一切疳症黃連炒蕪荑炒神麯麥芽炒各等分右為末水糊丸桐子大每服一二十丸空心白滚湯下蟾蜍丸治無辜疳症一服虛熱退二服煩渴止三服瀉痢愈蟾蜍一枚夏月溝渠中取腹大不跳不鳴身多㿔者右取糞蛆一杓置桶中以尿浸之却將蟾蜍跌死投與蛆食一晝夜用布袋盛蛆置急流中一宿取出瓦上焙乾為末入麝香一字粳米飲丸麻子大每服二三十丸米飲下其效如神蕪荑散治蟲動口內流涎白蕪荑乾漆炒各等分右為末每服五六分米飲下安蟲散治蟲動心痛胡粉炒黃檳榔川練子鶴膝各三錢枯白礬二錢五分右為末每服五六分痛時米飲調下薛按蟲動之因多屬胃氣虛弱或聞飲食氣味而動前二方乃化蟲之劑若因脾胃虛弱者須當調補中氣史君子丸治臟腑虛滑及疳瘦下痢腹脅脹滿不思乳食史君子肉一兩麵煨甘草炙厚朴薑汁炙青黛五錢陳皮二錢五分訶子肉半生半煨右為末煉蜜丸芡􅧙大每服三五丸米飲化下白玉散治丹瘤白土二錢五分寒水石半兩右為末用米醋或新水調塗薛按前方性味寒凉六腑受患毒發於表二便調和乳食如常固為可用若胃氣虛弱者反凝滯瘀血益增其患重者須吮毒血各聚於一處砭出以泄之遍身者當隨其患處各吮聚砭之更服仙方活命飲大便不通者更加大黃如不應用大連翹飲治法雖多無如砭法為良百日內患者難治神功散治瘡瘍腫臖作痛未成者敷之即散已潰者敷之即愈丹瘤用之尤妙但砭縫作痛黃柏炒蒲黃青黛真正者人中白煅各等分右為末敷之仙方活命飲治一切瘡毒未成內消已成即潰能消毒排膿止痛之聖藥也若膿出而腫痛不止者元氣虛也當補之穿山甲白芷防風沒藥甘草赤芍藥當歸尾乳香天花粉貝母各錢金銀花陳皮各三錢皂角刺三錢右每服二三錢酒水各半煎塌氣丸治肚腹虛脹胡椒一兩蝎尾五錢去毒右為末麵糊丸粟米大每服一二十丸陳米飲下薛按前症屬脾肺虛水氣泛而喘急浮腫必兼溫補脾土以生肺金而氣自運行矣但前藥性屬辛熱雖能袪散寒邪而恐真氣反傷不可過劑消積丸治食積大便酸臭發熱丁香五箇縮砂十二箇烏梅肉三箇巴豆二粒去皮心膜右為末麵糊丸黍米大每服五七丸溫水下薛按前症若食積既去而熱不退或作嘔少食宜用五味異功散以補胃氣或用四君子加藿香半夏以安中氣若兼泄瀉用六君子湯如不應加升麻柴胡以升補脾氣若久瀉不已宜用補中益氣湯以升補陽氣若虛寒加炮薑木香如不應兼以安神丸以補脾腎若體瘦潮熱口渴大便不調宜用肥兒丸以消疳積保和丸治食積山查二兩神麵二兩半夏茯苓各一兩陳皮連翹蘿蔔子各五錢右為末粥糊丸桐子大每服一二十丸白湯下清中解鬱湯治脾氣虛弱飲食停滯鬱熱生痰或身發赤暈白术炒茯苓陳皮山梔炒山查神麯炒麥芽炒川芎桔梗甘草炒各五分右每服二三錢水煎四神丸治脾腎稟虛泄瀉不食或不時去後不實或乳母患此致兒為患肉豆蔲二兩補骨脂四兩五味子二兩吳茱萸一兩右為末用水二碗生薑八兩紅棗一百枚煮熟取棗肉和末丸麻子大每服二三十丸空心食前白湯下子母並服香連丸治赤白痢疾并水瀉暑瀉黃連淨二十兩吳茱萸去梗十兩右先將二味用熱水拌和入磁器內置熱湯中頓一日同炒至黃連紫黃色去茱用連為末每末四兩入木香末一兩淡醋米飲為丸如麻子大每服四五十丸白滚湯下五苓散治霍亂吐瀉躁渴飲水小便不利澤㵼五錢猪苓官桂赤茯苓白术各三錢右為末每服一二錢白湯調下薛按前症若津液偏滲於大腸大便瀉而小便少者宜用此藥分利若隂陽已分而小便短少者此脾肺氣虛而不能生水也宜用補中益氣湯加麥門五味虛火上炎而小便赤少者此肺氣受傷而不能生水也用地黃丸加麥門五味大黃丸治風熱便祕飲水川芎五錢甘草炙二錢五分大黃一錢酒洗蒸晒黑牽牛五錢半生半炒右為末糊丸麻子大每服數丸溫蜜水下薛按前方乃內疏之峻劑審其因果屬臟內實熱方可用白虎湯治傷暑煩躁身熱痰盛頭痛口燥大渴知母一兩五錢石膏四兩白粳米八錢甘草炙五錢右為末每服一二錢水煎羌活散治風邪所傷頭目昏眩痰涎壅滯肢節煩疼羌活前胡麻黃白茯苓川芎黃芩甘草炙蔓荆子枳殼麩炒細辛石膏另研菊花防風各一兩右為末每服一二錢水煎地骨皮散治壯熱作渴地骨皮茯苓甘草柴胡半夏人參知母各等分右為末每服一二錢水煎大羌活湯羌活獨活防已防風黃芩黃連蒼术白术甘草炙川芎細辛各二錢知母生地黃各一錢右為末每服一二錢水煎熱服人參羌活散治傷寒時氣頭疼發熱人參羌活獨活柴胡前胡桔梗茯苓枳殼麩炒川芎天麻各二分地骨皮二分甘草炒一分右入薄荷三葉水煎薛按前方乃解肌發表化痰利氣之劑然元氣虛者宜用清肺散祕旨清肺散治感冒發熱鼻流清涕或咳嗽吐痰輕者勿藥自愈重者用此輕和之劑橘紅半夏炮桔梗炒川芎各五分白茯苓七分甘草炙防風各四分薄荷白术一錢桑白皮蜜炙各七分枯黃芩炒各三分右每服二三錢薑水煎薛按前症若風邪退而痰熱不止但健中氣則痰自化而病自愈若専用化痰利氣則中氣愈虛痰熱愈甚矣敗毒散治傷風時氣寒熱咳嗽人參茯苓甘草炒前胡川芎羌活獨活桔梗柴胡枳殼麩炒各等分右為末每服一二錢生薑薄荷水煎薛按祕旨云小兒雖有感冒傷風鼻塞流涕發熱咳嗽以降痰為主略加微解凡散利敗毒非幼稚所宜或冒輕者不必用藥候一二日自愈竊謂前症若手足冷或腹脹脾虛也用六君子湯加柴胡升麻若腹脹或氣喘肺虛也用四君子湯加柴胡升麻蓋肺虛則凑理不密外邪易感發表之後其邪既去即補脾肺以實其表庶無變症矣百部丸治肺寒壅嗽微喘百部炒麻黃各三分杏仁四十箇微炒水煮右為末用蜜丸皂子大每服一二丸薑湯化下麻黃湯治傷風發熱無汗咳嗽喘急麻黃去節三錢水煮去沫漉出晒乾肉桂二錢甘草炙一錢杏仁七箇去皮尖麩炒黃研膏每服一錢水煎服以汗出為度自汗者不宜服薛按前方乃發表出汗之劑審其寒邪在表宜用若邪既去宜補脾肺以實其表庶風邪不能再入往往表散之後熱嗽不退復行發表多變壞症地黃清肺飲治肺疳咳嗽痰唾稠粘阿膠一錢麵炒馬兜鈴甘草炙各五分鼠粘子二分炒杏仁七枚去皮尖糯米十粒炒右每服一錢水煎葶藶丸治傷風咳嗽面赤身熱痰盛喘促黑牽牛炒杏仁炒黃研膏漢防已各一兩甜葶藶隔紙略炒右為末入杏膏蒸棗肉搗丸麻子大每服十丸薑湯下薛按前方行氣導濕之峻劑若脾肺虛熱而致諸症者當調補中氣為主若果係前症宜用惺惺散參蘇飲清肺丸茯苓半夏湯選用之惺惺散治傷寒時氣風熱痰壅咳嗽桔梗細辛人參甘草炙白茯苓白术炒瓜蔞根各等分右為末每服二錢入薄荷五葉水煎參蘇飲治感冒風寒或腹脹少食泄㵼嘔吐或手足並冷喘促痰涎人參紫蘇陳皮半夏茯苓枳殼麩炒桔梗炒前胡乾葛甘草炒各五分木香三分右為末每服一二錢水煎茯苓半夏湯治胃氣虛弱痰涎惡心或飲食不化嘔吐發搐或睡卧不寧口流痰涎或乳母脾胃虛弱飲食不節以致兒患前症亦宜用此藥主之白术炒茯苓半夏神麯炒各一錢大麥炒五錢陳皮天麻各三錢右每服一二錢水煎甘桔散治咳吐熱涎咽喉不利甘草炒二兩桔梗一兩米泔浸焙右為末每服二錢入炮阿膠半斤水煎服薛按前症若風熱藴於肺而咳膿血用桔梗湯若心火剋於肺而吐痰涎用人參平肺散桔梗湯治咳嗽吐膿痰中有血已成肺癰症桔梗炒貝母當歸酒浸瓜蔞仁枳殼麩炒薏苡仁桑白皮炒百合蒸各一錢五分五味子炒甜葶藶炒地骨皮知母炒甘草節防己黃茋炒杏仁各五分右每服一二錢水煎人參平肺散治心火尅肺咳嗽喘嘔痰涎壅盛胸膈痞滿人參橘紅甘草炙地骨皮各五分茯苓知母炒各七分五味子炒青皮天門冬各四分桑白皮炒一錢右每服一二錢水煎小柴胡湯治傷寒溫熱患身熱惡風頭痛項強四肢煩疼寒熱往來嘔噦痰實及治中暑病瘧柴胡八錢半夏湯炮黃芩人參各三錢甘草炙二錢右每服一二錢薑棗水煎加味小柴胡湯治乳母肝火發熱等症致兒為患即小柴胡加山梔牡丹皮水煎子母並服以下倣此加味逍遙散治乳母肝脾氣血虛弱發熱致兒為患當歸白术茯苓芍藥炒黃各一錢柴胡牡丹皮山梔炒甘草炒各五分右水煎服柴术參苓湯治肝火血熱遍身瘙癢或起赤暈或筋攣結核白术炒人參茯苓各一錢柴胡川芎山梔芍藥炒甘草炒五分熟地黃自製當歸各八分右水煎服芍藥參苓散治肝木剋脾土目劄面青食少體倦芍藥炒人參茯苓白术陳皮各七分柴胡山梔炒甘草炒各五分右薑水煎梔子清肝散治三焦或足少陽驚風熱耳內作癢生瘡或出水疼痛柴胡梔子炒丹皮各一錢茯苓川芎芍藥當歸牛蒡子炒各七分甘草右水煎服龍膽瀉肝湯治肝經濕熱或囊癰便毒小便澀滯車前子炒木通當歸尾澤瀉各三分甘草黃芩生地黃山梔龍膽草酒炒五分右水煎服茵陳湯治身熱鼻乾汗出二便赤澀濕熱發黃茵陳六錢梔子二箇大黃二錢右每服一錢水煎大連翹飲治積熱大小便不利或痘後餘毒肢體患瘡或丹瘤逰走不止連翹􅜰麥荆芥木通赤芍藥當歸防風柴胡滑石蟬退甘草各一錢山梔炒黃芩炒各五分右每服一二錢水煎清凉散治消中能食體瘦口乾自汗大便結燥小便頻數羌活柴胡炙甘草知母酒製黃茋黃芩酒製各一錢生甘草防己生地黃酒製防風各五分當歸六分紅花少許桃仁五箇杏仁升麻四分石膏黃柏龍膽草各一錢五分右每服一二錢水煎入酒少許服四順清凉飲治臟腑有熱頰赤作渴四肢驚掣大便祕澀或風熱結核頭面生瘡目赤咽痛一切有餘之症赤芍藥當歸甘草大黃各等分右每服一錢水煎黃連香薷飲香薷四兩厚朴二兩黃連一兩右每服一二錢將朴連同生薑炒令紫色入香薷水酒各一錢煎冷服金匱加減腎氣丸治脾腎虛腰重腳腫小便不利或肚腹腫脹四肢浮腫或喘急痰盛已成蠱者此症多因脾胃虛弱治失其宜元氣復傷而變者非此藥不救白茯苓三兩附子炮五錢川牛膝肉桂澤瀉車前子山茱萸山藥牡丹皮各一兩熟地黃四兩搯碎酒拌杵膏右為末和地黃膏加煉蜜杵丸桐子大每服一二十丸空心米湯下五色丸治五癎朱砂真珠各五錢水銀雄黃各一兩黑鉛三兩同水銀結成砂右為末煉蜜丸麻子大每服三四丸煎金銀薄荷湯下愚按前症有因驚因風因食之不同雖痰迷心竅然當補脾氣為主斷癎丹治癎差後變症不止黃茋蜜炙鈎藤鈎細辛甘草炙各五錢蛇退三寸酒炙蟬蛻去土四箇牛黃一字另研右為末煮棗肉為丸麻子大每服五七丸人參煎湯下宣風散治驚風檳榔二箇陳皮甘草各五錢牽牛四兩半生半炒右為末每服三五分蜜湯調下愚按肝氣為陽為火肝血為隂為水故肝氣熱則生風風熱搏則驚搐而肝血必損也然有餘當認為不足若屢服利驚宣風之劑未免虧損脾胃以成慢驚矣慎之褊銀丸治風涎膈熱及乳食不消腹脹喘促巴豆水銀各五錢麝香五分另研黑鉛二錢半水銀煎京墨八錢火燒醋淬研右為末陳米粥丸菉豆大每服二三丸煎薄荷湯下愚按前方治癲癎驚搐消積下痰之藥也其用牽牛巴豆等蓋以痰飲癖積結聚堅固非此不能除故潔古先生云為斬關奪旗之將形病俱實者用之誠有回生起死之功必須詳審不可輕率牛黃丸治驚熱消積疳雄黃研水飛牽牛各一錢天竺黃二錢右為末麵糊丸粟米大每服五七丸薄荷水下紫霜丸治驚積代赭石二錢水飛杏仁草一箇去皮尖巴豆二十一粒去皮心膜右為末飯丸粟米大每服五七丸煎皂角仁湯下利驚丸治急驚天竺黃二錢輕粉青黛各一錢黑牽牛炒五錢右為末煉蜜丸豌豆大每歲一丸薄荷水化下白餅子治腹中有癖但飲乳嗽而吐痰涎滑石輕粉半夏湯浸焙南星各一錢巴豆二十四粒去皮膜水煮另研右為末糯米飯丸菉豆大捻作餅每服二三餅煎䓤白湯下薛按前四方乃斬關奪門起死回生之重劑也必審形病俱實方可施之恐至失手命在反掌經云邪之所凑其氣必虛留而不去其病乃實實者病氣實而形氣則虛也東垣先生云形病俱實者當瀉不當補形病俱虛者當補不當瀉治者審焉凉驚丸治驚疳龍膽草炒焦防風青黛各三錢鈎藤鈎二錢黃連炒錢二分龍腦一錢牛黃麝香各二分右為末麵糊丸粟米大每服十丸煎金銀花湯下薛按前丸心肝二經清熱袪風化痰散氣之寒劑蓋疳者津液乾涸之症不宜多服恐傷胃氣無以滋腎水生肝血也羌活膏治脾虛肝熱熱盛生風或吐瀉或誤藥變為慢驚之症羌活川芎人參白附子炮各五錢赤茯苓五錢天麻一兩白殭蠶酒炒白花蛇酒浸焙乾乾蝎炒去毒雄黃辰砂另研各一分附子炮防風麻黃去節肉豆蔲雞舌香藿香葉沉香木香各二錢輕粉珍珠牛黃各錢五分龍腦二分麝香一錢各另研右為末煉蜜丸豆大每服一二丸薄荷湯化下薛按前方藥味雜亂果脾氣虛而成慢驚者當審用之恐發散真氣重損陰血故也抱龍丸治傷風溫疫身熱昏睡風熱痰實壅嗽又治驚風潮搐及蠱毒中暑雄黃二錢五分辰砂五錢另研天竺黃一兩牛膽南星四兩麝香五分另研右為末甘草湯丸皂子大每服一丸白湯化下薛按前丸化痰祛邪清熱之功居多屬肝心實熱而致者用之殊效若脾肺虛弱而見昏睡痰嗽當用實鑑天麻散以調補元氣小續命湯治中風不省人事涎鳴失音肢體反張或時厥冷麻黃去節人參黃芩川芎芍藥甘草炒杏仁去皮尖研漢防己官桂各五錢防風七錢五分附子炮去皮臍二錢右各另為末和勻每服一錢薑棗水煎有熱減桂附寶鑑天麻散治急驚脾胃虛弱或變慢驚者半夏七錢天麻二錢五分甘草炙白茯苓白术各二錢右入生薑三錢磁器內水煮候乾為末每服一錢五分薑棗湯調下釣藤鈎飲治吐利脾胃虧損虛風慢驚釣藤鈎三分蟬殼防風炒人參麻黃白殭蠶炒天麻蝎尾去毒炒各五錢甘草炙川芎各二錢五分麝香一錢另研右為末每服一二錢水煎薛按慢驚之症屬脾胃虧損所致前方乃辛溫散表之藥而無調補之功須審用之大青膏治傷風吐瀉身溫凉熱天麻青黛各一錢白附子乾蝎去毒朱砂五分天竺黃二錢麝香二分烏稍蛇肉酒浸焙右為末生蜜和膏每服一豆粒許月中兒用半粒薄荷湯化服愚按大青膏乃表散之劑也必外邪藴結於肺而肺氣之未損者乃可施之况前症屬脾肺氣虛而邪之所凑必以固脾胃為主否則虛虛之禍恐不能免矣溫白丸治瀉泄瘦弱冷疳洞利及久病而成慢驚天麻五錢白殭蠶炮白附子乾蝎去毒天南星湯炮焙各二錢五分右為末麵糊丸菉豆大每服十丸米飲下愚按前症屬脾氣虛寒無陽之症無風可散無痰可逐當兼用六君子湯十二味異功散木香散參茋四聖散治痘瘡已出至六七日不起發不成膿人參黃茋炒白术炒茯苓當歸芍藥炒川芎各五分紫草木通防風各三分糯米一百粒右作二劑水煎服陳氏木香散木香大腹皮人參桂心赤茯苓青皮前胡訶梨勒半夏薑製丁香甘草炙各等分右每服二三錢薑水煎薛按前方若豆瘡已出未愈之間其瘡不光澤不起發不紅活五七日內泄瀉作渴或肚腹作脹氣促作喘或身雖熱而腹脹足指冷或身熱作渴或驚悸腹脹或汗出不止或寒戰咬牙瘡不結痂此皆脾胃虛寒津液衰少急用此藥治之若誤認為實熱用寒凉之藥及飲蜜水生冷瓜果之類必不治十二味異功散木香二錢半官桂二錢當歸三錢半茯苓白术各二錢人參陳皮厚朴薑製半夏薑製丁香各二錢半肉豆蔲二錢半附子炮一錢半右每服二三錢薑棗水煎薛按前方若痘瘡不光澤不起發不紅活不結靨謂之表裏俱虛宜用此藥治之若悶亂煩渴吐瀉不食腹痛腹脹痰喘氣急謂之表裏虛寒急用此藥送豆蔲丸或十日至十一日當靨不靨煩渴咬牙手足並冷飲沸湯而不知熱此陽虛脫陷急用此湯救之亦有復生者百祥丸治痘瘡黑陷及嗽而吐青緑水紅芽大㦸隂乾漿水煮軟去骨復入元汁中煮右焙乾為末水丸粟米大每服十丸赤脂麻湯下薛按前方治痘瘡黑陷耳骨冷咬牙吐瀉者乃脾土虛敗寒水反侮歸腎之惡候也用百祥丸瀉之急以四君子加丁香陳皮木香厚朴炮薑以溫補脾土身熱飲水黑陷復起十救一二蓋此症因脾土虛敗寒水乘侮陳文秀先生云若治寒水於既侮之後何不保脾土於未敗之先此發前人之未發况前藥必藉脾胃之氣連及於腎而才瀉之吾恐胃氣先傷而莫能及然非錢公之眀見不敢投非古昔之元氣不敢用治者慎焉牛李膏治痘瘡黑陷牛李子右杵汁石器內熬膏每服皂子大煎杏膠湯化下雄黃散治痘後牙齦生疳蝕瘡雄黃一錢銅緑二錢右同研細量瘡大小乾糝其上化毒丹治胎毒及痘後頭面生瘡眼目腫痛生地黃熟地黃天門冬麥門冬𤣥參各三兩甘草甜硝各二兩青黛一兩五錢右為末煉蜜丸芡􅧙大每服一丸白湯化下薛按前方生血凉血解毒寒中之劑用之得宜殊有良驗括蔞湯治慢驚括蔞根二錢白甘遂一錢右慢火炒黃為末每服二三分煎薄荷麝香湯下薛按徐用誠云錢氏治慢驚用括蔞湯恐傳寫誤耳蓋驚主風木甲木屬陽病急易治乙木屬隂病緩難治况小兒五臟之氣未實神氣未完而自病慢驚之症非病後及吐瀉脾胃虛損而得者慎勿用此峻厲之劑溫驚丸治慢驚風症朱砂一錢五分天竺黃五錢龍腦一錢紫胭脂一錢牛膽南星四兩右各另為末用黃牛膽汁丸芡􅧙大每服半丸砂糖湯化下薛按慢驚屬脾胃無陽肝木所勝之寒症故用溫驚丸以溫之但所用之藥乃辛散陽氣袪逐痰涎治者審之人參理中丸治中氣虛熱人參白术炒甘草炙各等分右為末薑汁糊丸菉豆大每服二三十丸白湯下調中丸治脾胃虛寒白术人參甘草炒各五錢乾薑四錢炮右為末用蜜丸菉豆大每服二三十丸白湯下薛按前二方本經自病之藥即人參理中丸也若腎水侮土而虛寒者當加半夏茯苓陳皮或嘔吐更加藿香泄瀉加木香張氏溫脾散治脾胃虧損腹脅虛脹乳食不進困倦無力訶子肉人參各七錢白术木香桔梗茯苓藿香陳皮黃茋各五錢甘草炙二錢半右每服二三錢薑棗水煎薛按前方治脾肺虛弱之症若肺病已去前症未已但用六君子湯以調補脾胃歸脾湯治乳母脾經氣鬱致兒為患人參白术茯神黃茋龍眼肉各二錢逺志一錢酸棗仁木香甘草炙三分右薑棗水煎服加柴胡山梔名加味歸脾湯越鞠丸治乳母六鬱傳兒為患或胸滿吐酸齒痛瘡疥等症蒼术神麯炒香附子山查山梔炒撫芎麥芽炒各等分右為末水調神麯糊丸桐子大每服二三十丸白滚湯下子母並服清心丸治驚熱煩躁人參茯神防風朱砂柴胡各二錢金箔三十片右為末煉蜜丸桐子大每服一二丸竹瀝調下安神丸治邪熱驚啼心肝壯面黃頰赤牙硝白茯苓乾山藥麥門冬去心焙寒水石甘草各五錢朱砂一兩龍腦二分半右為末煉蜜丸芡􅧙大每服半丸砂糖水化下薛按前方降火化痰辛散寒凉之劑不宜過服恐反傷脾胃也若睡中驚悸不安宜用祕旨安神丸若因乳母脾氣鬱熱致兒為患者宜用加味逍遙散若因乳母怒氣肝經發熱致兒為患者宜用加味小柴胡湯若因乳母飲酒胃經發熱致兒為患者宜用葛花解酲湯右為末每服二錢薑棗水煎六神散治面青啼哭口出氣冷或泄㵼不乳人參山藥白术各五錢甘草二錢白茯苓扁豆各一兩炒右為末每服一錢薑棗水煎當歸散治夜啼不乳當歸白芍藥人參各二錢半甘草炙一錢二分桔梗陳皮各一錢右為末每服一二錢水煎灌之蟬蛻鈎藤散治肚疼驚啼鈎藤天麻茯苓川芎白芍各一錢右每服一錢燈心水煎羚羊角丸治行遲羚羊角鎊生地黃焙酸棗仁虎脛骨醋炙黃白茯苓各五錢肉桂防風當歸黃茋各錢右為末煉蜜成劑每服一皂子大白湯化下葛花解醒湯治乳母酒後乳兒遺熱為患白豆蔲砂仁葛花各五錢乾生薑白术澤瀉神麯炒各二錢白茯苓陳皮人參猪苓各一錢半木香五分青皮三錢右為末每服二錢白湯調服薛按前湯氣味辛散不得已而用之耳蓋酒病服之雖效頻服則隂損元氣折人長命可不慎哉花大膏治夜啼燈花一顆右塗乳上令兒吮之薛按前症有因停乳腹痛者有因隂盛發躁者有因寒盛腹痛者有因乳母鬱悶怒氣傳兒者有因乳母停滯傳兒者治法說見本論鈎藤飲治夜啼鈎藤鈎二半茯神茯苓川芎木香當歸各一錢甘草五分菖蒲丸治心氣不足不能言語人參五錢丹參二錢石菖蒲赤石脂各三錢天門冬麥門冬各去心一兩焙右為末蜜丸菉豆大每服十丸若病後腎虛不語宜服地黃丸止汗散治睡而自汗故蒲扇燒右為末每服三錢溫酒調下香瓜丸治遍身汗出胡黃連川大黃煨柴胡鱉甲醋炙黃黃柏黃連蘆薈青皮各三分右為末將黃瓜一箇去穰納藥煨熟杵和麵糊丸菉豆大每服三五丸新水下薛按自汗屬陽虛盜汗屬隂虛若心經血虛用團參湯腎經虛熱用地黃丸血氣虛用人參養榮湯之類胃氣虛用六君子湯或用一味白术炒為末以浮麥炒濃煎湯調服當歸六黃湯治血氣不足虛火內動盜汗不止當歸熟地黃黃茋炒黃柏已下俱炒黑黃芩黃連生地黃各等分右每服二錢水煎團參湯治心血虛熱自汗盜汗人參當歸各等分右用猪心一片每服三錢水煎服茋附湯治稟賦氣虛陽弱自汗不止肢體倦怠或大病後陽氣虧損並急服之多有生者黃茋蜜炙附子炮等分右每服一錢薑水煎參附湯治稟賦不足上氣喘急自汗盜汗或病久陽氣脫陷急宜服之人參一錢附子炮一兩右每服一錢薑水煎人參養榮湯治脾肺俱虛發熱惡寒肢體瘦倦食少作瀉或久病虛損口乾食少咳而下痢驚熱自汗白芍一錢五分人參陳皮黃茋蜜炙桂心當歸白术炒甘草炙各一錢熟地黃五味子杵炒各七分逺志五分右每服二三錢薑棗水煎玉露散治傷熱吐㵼黃色石膏煆寒水石各五錢甘草二錢五分右為末每服五分白湯調下薛按前症若飲食如常作渴飲冷屬胃經實熱宜用此藥若食少體倦或善噫㵼黃此脾虛色陷也宜用六君子加柴胡升麻若㵼而變青更兼腹脹或善怒此脾虛肝所乘也宜用前湯更加木香木瓜丸治生下吐木瓜麝香膩粉木香檳榔各等分右為末麵糊丸黍米大每服一二丸甘草湯化下薛按前症多因妊娠胃經有熱或鬱痰所致當審其母而兼治之塗腮法麝香牛黃青黛各二分半蝎尾去毒一分半薄荷二分右為末生棗肉杵膏塗帛上貼腮中以手烘熱頻尉之薛按前法辛凉發散開竅袪風之劑當審用之余每以葱頭三五莖細切擂爛攤紙上以兩掌護熱貼腮門良久其邪即解諸病自退乃去其葱却以段帛寸餘塗糊仍貼腮門護之春夏常用絹帛秋冬用紵絲以護貼之永無傷風之患亦因有母病致兒發搐者治驗見前浴體法治胎肥胎熱胎怯麝香二半分天麻二錢白􅈨烏蛇肉酒浸焙青黛各三錢蝎尾去毒朱砂各五分右為末桃枝一握水煎浴之勿浴背薛按前法乃開發腠理疏泄陽氣若小兒所稟虛怯或妊母所致各說見本論神效當歸膏治跌撲湯火等瘡不問已潰未潰當歸黃蠟生地各一兩麻油六兩右先將當歸地黃入油煎黑去查入蠟熔化候冷攪勻即成膏矣砭法治丹毒赤色逰走不定以口吮毒聚在一處用細磁器擊碎取有鋒芒者一塊以筯劈開頭尖夾之用線縛定兩指輕撮筋稍令磁􅉭正對聚處懸寸許再用筋一根頻擊筋頭令毒血遇刺皆出毒入腹者不救症輕者止用口吮出毒用藥敷之如患在頭額不用砭法止宜用卧針倒挑患處以出毒血其赤自退製附子法取附子重一兩三四錢有蓮花瓣頭圓底平者先備童便五六碗將附子放在竈上煙匱中良久乘熱投入童便浸五七日候潤透揭去皮切四塊仍浸二三日用粗紙數層包之浸濕埋灰火半日取出切片檢視有白星者仍用瓦上炙熟至無白星為度如急用切作大片用童便煮二三沸熱瓦焙熟即可用薛氏醫案卷五十三
