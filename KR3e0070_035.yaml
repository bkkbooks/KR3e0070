body:
  text: 薛氏醫案卷三十五明薛己訂婦人良方候胎門脈例第一王子亨云若姙娠其脈三部俱滑大而疾在左則男在右則女經云隂搏陽别謂之有子搏者近也隂脈逼近於下陽脈則出於上陽中見陽乃知陽施隂化法當有子又少隂脈動甚者姙子也手少隂屬心足少隂屬腎心主血腎主精精血交㑹投識於其間則有娠又三部脈浮沈正等無病者有姙也餘病如脈經說左手尺脈浮洪者為男胎也右手尺部浮洪者為女胎也兩手尺部俱洪者為兩男俱沈實者為兩女又云中指一跳一止者一月胎二跳二止者二月胎也診婦人有姙歌第二肝為血兮肺為氣血為榮兮氣為衛隂陽配偶不參差兩藏通和皆類例血衰氣旺定無姙血旺氣衰應有體肝藏血為榮屬隂肺主氣為衛屬陽隂陽配偶者是夫婦匹配偶合搆精乃有子也若血少氣盛則無姙孕若血盛氣少則有孕也寸微關滑尺帶數流利往来并雀啄小兒之脈已見形數月懐躭猶未覺寸脈微關脈滑尺脈帶數及流利雀啄皆是經脈閉塞不行成胎已上之脈皆是血多氣少之脈是懐小兒之脈已見形狀也左疾為男右為女流利相通速来去兩手關脈大相應己形亦在前通語左手脈疾為懐男右手脈疾為懐女及兩脈流行滑利相通疾速来去是或兩手關脈洪大相應是其胎已有形狀也左脈帶縱兩箇男縱者夫行乘妻水行乗火金行乘木即鬼賊脈也名也名曰縱見在左手則懐兩個男兒也右手帶横一雙女横者妻乘夫也是火行乘水木行乘金即所勝脈也名曰横見于右手則懐一雙女兒也左手脈逆生三男逆者子乘母也是水行乘金火行乘木即已生脈也名曰逆見于左手則懐三個男兒也右手脈順還三女順者母乘子也是金行乘水木行乘火即生已之脈也名曰順見于右手則懐三個女兒也寸關尺部皆相應一男一女分形證寸關尺部脈大小遲疾相應者是懐一男一女形證之脈也謂關前為陽關後為隂隂陽脈相應故懐一男一女也有時子死母身存或即母亡存子命此二句之文無辯子母存亾之法往来三部通流利滑數相參皆替替陽實隂虚脈得明遍滿胷堂皆逆氣若寸關尺三部通行流利皆替替有力而滑數皆是陽實隂虚之脈主姙婦逆氣遍滿胷堂而不順也左手太陽浮大男左手寸口為太陽其脈浮大則是懐男子右手太隂沈細女右手寸口為太隂其脈沈細是懐女脈也諸陽為男諸隂女指下分明長記取諸陽脈皆為男即為大疾數滑實之類也當懐男子諸隂脈三即沈細之類是也當懐女子三部沈正等無絶尺内不止真胎婦寸關尺三部脈沈浮正直齊等舉按無絶斷及尺内舉按不止住者真的懐胎婦也夫乘妻兮縱氣霧經云縱者夫乘妻也水行乘火金行乘木即鬼賊脈也縱氣霧霧者露也又上下也謂夫之陽氣乘妻之隂氣二氣上下相逐如霧潤結子也妻乘夫兮横氣助横者妻乗夫也見前註謂兩傍横氣相佐助也子乘母兮逆氣參逆者子乘母也謂子氣犯母氣相乘逆行之氣相參合也母乘子兮順氣䕶是母氣乘于子氣為順氣相䕶衛也凡胎聚縱横逆順四氣以榮養方以成形也小兒日足胎成聚身熱脈亂無所苦婦人懐小兒五個月是以數足胎成就而結聚也必母身體壯熱當見脈息燥亂非病苦之症謂五月胎已成受火精以成氣故身熱脈亂是無病也汗中不食吐逆時精神結備其中住謂姙胎受五行精氣以成形稟二經以榮其母懐姙至五月其胎雖成其氣未備故胎氣未安上衝心胷則汗出不食吐逆名曰惡阻俗呼選飯唯思酸辛之味以調胎氣也滑疾不散三月胎姙娠三月名始胎此是未有定儀心胞脈養之故脈見滑疾流利為少氣多血不散為血氣盛則始結為胎也但疾不散五月母其脈但疾數而不散者是五個月懐胎之母也弦𦂳牢强滑利安沈細而微歸泉路孕婦之脈宜弦𦂳勞强滑利為安吉之脈若沈細而微謂脈與形不相應故云死也前文雖云太隂沈細又云諸隂為女其說似有相違謂三部脈皆不沈細及微故不同也愚按前論與脈訣所云不同觀者當自推之驗胎法第三婦人經脈不行已經三月欲驗有胎川芎生為末空心濃煎艾湯調下二錢腹内微動則有胎也胎殺避忌産前將䕶法第四凡受孕之後切宜避忌胎殺所遊如經云刀犯者形必傷泥犯者竅必塞打擊者色青黯繋縛者相拘攣甚至母殞禍如反掌月遊胎殺立春在房床驚蟄在户單扇清明在門雙扇立夏在竈芒種在母身小暑在竈立秋在碓按京本云在正北方子云白露在厨前寒露在門立冬在户及厨大雪在爐及竈小寒在房母身十干日遊胎殺甲巳日占門乙庚日占碓磨丙辛日占井竈丁壬日占厨解戊癸日占米倉十二支日遊胎殺子丑日占中堂寅卯辰酉日占竈己午日占門未申日占籬下戍亥日占房六甲旬遊胎殺甲子旬遊牕碓甲戌旬遊正㕔甲申旬遊中庭甲午旬遊房内甲辰旬遊房中甲寅旬遊太史局日遊胎殺每遇癸巳甲午乙未丙申丁酉五日在房内北庚子辛丑壬寅三日在房内南癸卯一日在房内西甲辰乙巳丙午丁未四日在房内東六戊六己日在房内中餘日在外無占凡遊在房内不宜于方位上安床帳及掃舎皆凶又有小兒殺及本年三殺及産母身黄定命皆不可犯凡姙娠之後將此貼于房内常照見之切不可穿鑿修掘移釘繋籬壁重物展壓之類犯之重則胎死腹中母亦不利輕則子受其殃成人之後必定破形拳攣跛縮瘖瘂犯之極驗食忌論第五一受孕之後切宜忌不可食之物非惟有感動胎氣之戒然于物理亦有厭忌者設或不能戒忌非特延月難産亦能令兒破形母損可不戒哉食雞肉糯米合食令子生寸白蟲食羊肝令子生多厄食鯉魚鱠及雞子令兒成疳多瘡食犬肉令子無聲音食肉令子缺唇食鼈令子項短及損胎食鴨子共桑椹同食令子倒生心寒食螃蠏令子横生食雀肉合荳醬食之令子面生䵟黯黒子食荳醬合藿香食之墮胎食水漿絶産食雀肉令子不恥多淫食山羊肉令子多病食生薑令子多指生瘡食蝦蟇鱓魚令兒瘖瘂食驢騾馬肉延月難産如此之類無不驗者則知聖人胎教之法矣孕婦藥忌歌第六蚖􅀈水蛭地膽蟲烏頭附子配天雄躑躅野葛螻蛄類烏啄側子及䖟蟲牛黄水銀并巴豆大㦸蛇蛻及蜈蚣牛膝藜蘆及薏苡金石錫粉并雌雄牙硝芒硝牡丹桂蜥蜴飛生及䗪蟲代赭蚱蟬胡粉麝莞花薇蓹草三稜槐子牽牛并皁角桃仁蠐螬和茅根根􅀈砂與乾漆亭長波流菵草中瞿麥䕡茹蟹爪甲蝟皮赤箭赤頭紅馬刀石蠶衣魚等半夏南星通草同乾薑蒜雞及雞子驢肉肉不須供切須婦人産前忌此歌宜記在心胷薛氏醫案卷三十五
