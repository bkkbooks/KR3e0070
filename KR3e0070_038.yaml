body:
  text: 薛氏醫案卷三十八明薛己訂婦人良方妊娠中風方論第一論曰四時八方之氣為風也常以冬至之日候之若從其鄉來者長養萬物否則名為虛邪賊害萬物體虛中之客于皮膚則頑痺不仁入于筋脈則攣急喎僻若兼濕熱則弛縱痿軟若入臟腑氣隨所傷經絡而為諸病妊娠中之必須早治庶免墮胎之患愚按病機機要云風本為熱熱勝則風動宜以靜勝其燥是亦養血也治法須少汗亦宜少下多汗則虛其衛多下則損其榮雖有汗下之戒而有中臟中腑之分中腑者多著四肢之間則脈浮惡寒拘急不仁中臟者多著九竅之中則唇緩失瘖耳聾鼻塞目瞀便祕中腑者宜汗之中臟者宜下之表裡已和宜治在經當以大藥養之此中風之要法也妊婦患之亦當以此施治而佐以安胎之藥仍參三卷首論主治之為是防風散治妊娠中風卒倒口噤肢強或痰氣上升防風桑寄生葛根各五分家菊花細辛防已秦芁當歸桂心茯神甘草羚羊角鎊各三分右水煎入竹瀝半合服白术酒治妊娠中風口噤不語白术一兩半獨活一兩黑豆一合炒右酒煎分四服灌之得汗即愈補遺治妊娠中風排風湯續命湯參蘇湯加羌活引風湯皆可選用方見第三卷中風類妊娠風痙方論第二論曰妊娠體虛受風而傷足太陽經遇風寒相搏則口噤背強甚則腰反張名之曰痙須臾自醒良久復作又名子癎子冒當審察其因而治之愚按前症若心肝風熱用釣藤湯肝脾血虛加味逍遙散肝脾鬱怒加味歸脾湯氣逆痰滯紫蘇飲肝火風熱釣藤散脾鬱痰滯二陳薑汁竹瀝若兼症相雜當參照子煩門附治驗一妊婦出汗口噤腰背反張時作時止此怒動肝火也用加味逍遙散漸愈又用釣藤散而止更以四君加釣藤山梔柴胡而安一妊婦因怒忽仆地良久而蘇吐痰發搐口噤項強用羚羊角散漸愈用釣藤散始痊又用歸脾湯而安羚羊角散治妊娠冒悶角弓反張名曰子癎風痙羚羊角鎊獨活酸棗仁炒五加皮薏苡仁炒防風當歸酒浸川芎茯神去木杏仁去皮尖各五分木香甘草炙各二分右薑水煎附方釣藤湯方見十二卷第四論加味逍遙散加味歸脾湯二方見二十四卷第四論紫蘇湯方見十二卷第八論釣藤湯方見四卷第四論二陳湯方見二十四卷第五論四君子湯方見二十四卷第六論妊娠瘈瘲方論第三新附竊謂瘈者筋脈急而縮也瘲者筋脈緩而伸也一縮一伸手足相引搐搦不已大抵與嬰孩發搐相似謂之瘈瘲也此症多屬風蓋風主搖動駱龍吉云心主脈肝主筋心屬火肝屬木火主熱木主風風火相熾則為瘈瘲也治法若因風熱用釣藤湯加柴胡山梔黃芩白术以平肝木降心火養氣血若風痰上湧加竹瀝南星半夏若風邪急搐加全蠍殭蠶虧損氣血用八珍湯加釣藤山梔為主若無力抽搐戴眼反折汗出如珠者肝氣絶也皆不治附治驗方藥一妊婦四肢不能伸服袪風燥血之劑遺屎痰甚四肢抽搐余謂肝火血燥用八珍湯加炒黑黃芩為主佐以釣藤湯而安後因怒前症復作小便下血寒熱少寐飲食少思用釣藤散加山梔柴胡而血止用加味逍遙散寒熱退而得寐用六君子湯加芍藥釣藤飲食進而漸安八珍湯方見二十四卷第四論六君子湯方見二十四卷第六論妊鬼胎方論第四夫人臟腑調和則血氣充實精神健旺若榮衛虛損精神衰弱妖魅之類乘之亦如懷妊之狀故曰鬼胎也愚按前症因七情脾肺虧損氣血虛弱行失常道衝任乖違而致之者乃元氣不足病氣有餘也若見經候不調就行調補庶無是症治法以補元氣為主而佐以雄黃丸之類行散之若脾經鬱結氣逆者用加味歸脾湯調補之若脾虛血不足者用六君芎歸培養之肝火血耗者用加味逍遙散滋抑之肝脾鬱怒者用加味歸脾逍遙二藥兼服腎肝虛弱者用六味地黃丸附治驗一婦人經閉八月肚腹漸大面色或青或黃用胎症之藥不驗余診視之曰面青脈澀寒熱往來肝經血病也面黃腹大少食體倦脾經血病也此鬱怒傷脾肝之症非胎也不信仍用治胎散之類不驗余用加味逍遙歸脾二藥各二十餘劑諸症稍愈彼欲速效别服通經丸一服下血昏憒自汗惡寒手足俱冷嘔吐不食余用人參炮薑二劑漸愈又用十全大補湯五十餘劑而安雄黃丸治鬼胎瘀血腹痛雄黃鬼臼去毛獺肝炙黃丹砂細研巴豆去油皮莽草蜥蜴一枚炙黃蜈蚣一條炙黃右為末蜜丸桐子大每服二丸空心溫酒下日二服或下如蛇蟲之類其病乃除治鬼胎及血氣痛不可忍斑貓去頭翅足製延胡索炒各等分右為末以溫酒調下半錢以下穢物為度附方加味歸脾湯加味逍遙散十全大補湯三方見二十四卷第四論六君子湯方見二十四卷第六論六味丸方見二十四卷第十一論妊娠傷寒方論第五夫時令嚴寒體虛所傷即成傷寒輕者灑淅惡寒翕翕發熱微咳鼻塞數日而愈重者頭疼體痛寒熱交作久而不愈者多致傷胎也愚按前症為害匪輕當審其經絡表裡而治之不可輕忽加減四物湯治妊婦腹痛或月事不調胎氣不安産後血塊或亡血過多或惡露不下當歸川芎白芍藥炒熟地黃各一兩右每服四五錢水煎日二三服下血加艾葉阿膠虛熱口乾加括蔞根麥門冬惡血腹痛加當歸芍藥血崩血淋加熟地蒲黃因熱生風加川芎柴胡頭昏項強加柴胡黃芩大便祕結加大黃桃仁嘔吐惡心加白术人參虛煩不眠加竹葉人參煩躁大渴加知母石膏水停吐逆加豬苓茯苓虛煩傷寒加人參柴胡防風阿膠散治時氣先服此以安胎却以主藥間服阿膠炙白术炒桑寄生人參白茯苓右為末等分每服一錢用糯米飲調下日三服前胡湯治傷寒頭痛壯熱肢節煩疼石膏一錢前胡甜竹茹梔子炒黃芩炒大青知母各五分右用蔥白水煎服蘇木湯治傷寒時行灑淅寒振或兼噦者赤芍藥橘紅黃芩炒黃連甘草蘇木各五分右用水煎服汗出即瘥如胎不安兼服阿膠湯黃龍湯治妊婦寒熱頭疼默默不食脅痛嘔痰及産後傷風熱入胞宫寒熱如瘧或經水適來勞復熱不解散柴胡二錢黃芩炒人參甘草各一錢右用水煎服柴胡石膏湯治頭痛惡寒身熱拘急口乾柴胡二錢甘草一錢石膏三錢右用薑水煎服氣虛加人參枳實散治傷寒四日至五六日腹脹少食腹疼體重枳實炒三錢陳皮一錢麥門冬一錢五分右用生薑蔥白水煎服旋覆花湯治傷寒頭目旋疼壯熱心躁旋覆花赤芍藥甘草各五分前胡石膏各一錢白术人參麻黃去根節黃芩各三分右用薑水煎服麥門冬湯治傷寒壯熱嘔逆頭疼胎氣不安人參石膏各錢半前胡黃芩各五分葛根麥門冬一錢右薑棗竹茹一分用水煎服梔子大青湯治發斑變黑尿便血升麻梔子一錢大青杏仁黃芩各一錢右用蔥白三寸水煎服白术湯治傷寒煩熱頭痛胎動或時吐逆不食白术橘紅麥門冬人參前胡赤茯苓川芎甘草半夏各五分右用生薑竹茹一分水煎服良方白术散治傷寒白术黃芩炒各二錢右用薑棗水煎服若四肢厥逆隂症也不可用芎蘇散治外感風寒壯熱頭疼心胸煩悶紫蘇葉川芎白术白芍藥麥門冬去心陳皮乾葛各五分甘草炙三分右用生薑蔥白水煎參蘇飲去木香治證同前方見六卷第十二論妊娠時氣方論第六論曰四季之間非其時而有其氣謂春寒夏冷秋熱冬暖之不正也所感者不拘長少其症相類故云時氣妊娠患之重者多致傷胎愚按前症與前傷寒互相主治秦芁散治時氣五六日不得汗口乾飲水狂言嘔逆秦芁柴胡各五分石膏一錢犀角鎊赤茯苓前胡甘草葛根升麻黃芩各四分右用淡竹茹一分水煎服葛根飲子治時氣煩熱口乾頭痛乾葛麻黃去節根各半兩石膏一兩豉一合白米半合梔子二七粒蔥白二莖右用水煎分三服汗出為效消熱飲子治時氣六七日大小便不利芒硝一兩細研葵子二兩右如前煎服以利為效芒硝即朴硝人參敗毒散方見二十四卷第十論妊娠熱病方論第七冬時觸冒嚴寒即病為傷寒藏于肌骨夏至發為暑病即熱症也妊娠患之多致墮胎熱病與中暑相似但熱病者脈實中暑者脈虛治當審察不可槩施愚按此症與前後三症同治治妊娠熱病頭痛嘔吐煩悶人參一方無竹茹葛根各一兩知母三兩蘆根二兩麥門冬去心一兩半右每服四錢連根蔥白三寸水煎梔子仁飲治熱病發斑黑色小便如血氣喘急胎欲落梔子升麻石膏生地黃各二兩黃芩大青各一兩右每服半兩蔥白七寸豉四十九粒水煎大黃飲治熱病六七日大小便祕澀大黃微炒石膏各兩知母赤茯苓前胡各三分梔子甘草黃芩各半兩右每服五錢生地黃一分煎服又方伏龍肝細研每服一錢水調下外用水調塗臍下又方葛根煮汁時服一盞補遺蘆根湯治熱病頭疼心煩嘔吐知母四兩青竹茹三兩右每服五錢生蘆根一握糯米一撮水煎梔子五物湯治妊婦傷寒壯熱頭痛梔子前胡知母各二兩黃芩一兩石膏四兩右每服五錢用水煎服升麻六物湯治傷寒斑黑溺血升麻梔子各二兩大青杏仁黃芩右每服五錢蔥頭水煎妊娠傷寒熱病防損胎方論第八論曰非節之氣傷于妊娠熱毒侵損胞胎若不早治多致墮胎漏血則子母之命亦不能全矣愚按前症當分察六經為主而參于前後方論治妊娠傷寒身痛壯熱蔥白切一升前胡葛根石膏各十分青黛六分升麻八分梔子十二個右用水煎分三服治妊娠傷大小便祕結前胡十分大黃石膏各二十分梔子十枚知母黃芩茯苓生薑各八分右用水煎分三服治妊娠傷寒發斑忽黑小便如血胎欲落梔子升麻各四兩青黛二兩生地黃二十枚石膏八兩蔥白切片黃芩三兩右用水煎分三服忌熱物又用井中泥塗心下乾則易二方出本事再録有效補遺治妊娠熱病先以白术散安胎方見前妊娠熱病胎死腹中方論第九論曰熱病以致胎死不能出者但服黑神散胎自下矣愚按陳無擇先生曰前症當視産母若面赤舌青知其子死面青舌赤知母死子生唇青吐沫子母俱死若雙胎或一死一活用黑神散竊謂前症宜補助産母使其胎自下黑神散恐其太熱不宜輕用果一胎已死者用平胃散朴硝水銀下之最為穩當庶不併傷生者平胃散方見後黑神散又名烏金散靈苑方名肉桂散桂心當歸芍藥甘草炙乾薑炒生地黃各一兩黑豆炒去皮二兩附子泡去皮臍半兩右為末每服二錢空心用溫酒調下補遺胎死用紅花酒煮汁飲二三碗又方伏龍肝為末溫酒調下二錢白湯亦可又方朴硝末童子小便和熱酒調下三錢立出妊娠瘧疾方論第十論曰妊娠病瘧乃夏傷于暑客于皮膚至秋而發陽盛則熱隂盛則寒隂陽相離寒熱俱作其發晏者由風邪客于風府循膂而下衛氣至一日一夜常大會于風府故發日晏與早者衛氣之行風府日下一節二十一日下至尾骶二十二日入脊內上注于伏衛之脈其行九日出缺盆其氣既止故發更早其間日發者風邪內搏五臟橫連募原其道逺其氣深其行遲不能日作也妊娠而發多傷于胎愚按前症因脾胃虛弱飲食停滯或外邪所感或鬱怒傷脾或暑邪所伏審係飲食停滯用六君子加桔梗蒼术藿香外邪多而飲食少用藿香正氣散外邪少而飲食多用人參養胃湯勞傷元氣用補中益氣湯若鬱怒所傷用小柴胡兼歸脾湯若木侮土久而不愈用六君子為主佐以安胎藥乃參三隂三陽經而治之附治驗一婦人因怒患瘧舉發無期久而不已胸腹不利飲食少思吞酸吐痰用六君子加柴胡山梔二十餘劑尋愈但晡熱少食又用四君子加柴胡升麻為主佐以逍遙散而痊一婦人瘧久不已噯氣下氣胸腹膨脹食少欲嘔便血少寐此屬肝脾鬱怒用歸脾湯加柴胡山梔漸愈又用六君子湯加柴胡山梔升麻而愈一妊婦患瘧已愈但寒熱少食頭痛晡熱內熱此脾虛血弱也用補中益氣湯加蔓荆子頭痛頓止又用六君子湯加芎歸飲食頓進再用逍遙散加參术而寒熱愈七寶散治瘧疾一日一發或一日兩發或間一日發常山厚朴薑製青皮陳皮並去白甘草炒檳榔草果等分右每服半兩酒水各一碗煎至一盞去柤露一宿發時面東溫服良久再服一妊婦先寒後熱六脈浮緊用前散一劑而愈人參養胃湯治妊娠瘧疾寒多熱少或但寒不熱頭痛惡心身痛面色青白脈弦遲者又有驅邪散治證亦同方見七卷第十八論清脾湯治妊婦瘧疾寒少熱多或但熱不寒口苦舌乾大便祕澀不進飲食脈弦數者青皮厚朴薑製白术炒草果茯苓半夏炒黃芩柴胡甘草炙各五分右用薑水煎附方交加散治食瘧神效肉豆蔲二箇一生一煨草豆蔲二個一生一煨甘草二錢半炒半生厚朴二錢半炒半生生薑一兩半煨半生右用薑水煎發日五更服仲景白虎加桂枝湯治溫瘧知母六錢桂枝黃芩各一錢括蔞根二錢甘草炙牡蠣乾薑各一錢右用水煎服汗出即愈此少陽經藥也桂枝羌活湯治瘧處暑以前頭痛脈浮惡風有汗桂枝羌活防風甘草各一錢五分右水煎發服吐加半夏麯麻黃羌活湯治症如前但惡寒無汗麻黃去節羌活防風甘草各半兩右如前服加法同二方太陽經藥也白芷湯治瘧身熱目痛熱多寒少脈長先以大柴胡下之微利為度餘熱不盡當服此湯白芷一兩知母一兩七錢石膏四兩右粗末依前服陽明經藥也桂枝芍藥湯治瘧寒熱不論先後此太陽陽明合病寒熱作則必戰經曰熱勝而動也發熱則必汗泄經曰汗出不愈知內熱也乃隂盛陽虛之證此湯主之否則久而傳于隂經矣桂五分黃耆炒知母石膏芍藥各二錢右粗末水煎此太陽陽明經藥也桂枝黃芩湯如服前藥轉甚三陽合病也宜此和之柴胡一錢五分黃芩人參甘草各八分半夏石膏知母各五分右每粗末依前服如外邪已解而內未已再服下藥從卯至午發大柴胡下之從午至酉發邪氣在內也大承氣下之從酉至子發或至寅發邪氣在血也桃仁承氣湯下之微利後更以小柴胡湯徹其邪氣按此太陽陽明少陽經藥也以上諸方並係發風寒暑熱之氣自外而入中于三陽之經者也桂枝石膏湯治瘧疾隔日先寒後熱寒少熱多桂枝五錢石膏一兩五錢知母一兩五錢黃芩一兩右分三服水煎此太陽陽明經藥也隔日發者邪氣所舍深者也麻黃黃芩湯治瘧發如前症而夜發者麻黃一兩去節甘草炙三錢黃芩五錢桂二錢桃仁三十個去皮尖右依前服桃仁味苦甘辛肝者血之海血驟則肝氣燥經所謂肝苦急急食甘以緩之故桃仁散血緩肝謂邪氣深逺而入血故夜發乃隂經有邪此湯發散血中風寒治風暑深入隂分乃血受病邪氣所舍尤深者也麻黃桂枝桃仁等乃太陽經血藥非三隂經藥也附方四君子湯六君子湯補中益氣湯三方見二十四卷第六論藿香正氣散方見二十一卷第十論人參養胃湯方見七卷第十八論小柴胡湯方見二十四卷第二論逍遙散加味歸脾湯二方見二十四卷第四論妊娠霍亂方論第十一夫飲食過度觸冒風冷隂陽不和清濁相干謂之霍亂其間或先吐或腹痛吐利是因于熱也若頭痛體疼發熱是挾風邪也若風折皮膚則氣不宣通而風熱上衝為頭痛若風入腸胃則泄利嘔吐甚則手足逆冷此陽氣暴竭謂之四逆妊娠患之多致傷胎也愚按前症若因內傷飲食外感風寒用藿香正氣散若因飲食停滯用平胃散果脾胃頓傷陽氣虛寒手足逆冷者須用溫補之劑治當詳審毋使動胎也附治驗一妊婦霍亂已止但不進飲食口內味酸泛行消導寬中余曰此胃氣傷而虛熱也當用四君子湯彼不信乃服人參養胃湯嘔吐酸水其胎不安是藥復傷也仍與四君子湯俾煎熱令患者先嗅藥氣不作嘔則呷少許恐復嘔則胎為釣動也如是旬月而愈人參散治脾胃虛寒霍亂吐瀉心煩腹痛飲食不入人參厚朴薑製橘紅各一錢當歸乾薑炮甘草炙各五分右用棗水煎服人參白术散治脾胃虛弱吐瀉或吐瀉作渴不食白术茯苓人參甘草炒木香藿香各五分乾葛一錢右用水煎服吐甚加生薑汁頻飲之縮脾飲解伏熱除煩渴消暑毒止吐瀉宣沈冷頻服草果仁四兩烏梅肉三兩甘草炒二兩半右每服半兩用薑十片水煎木瓜煎治吐瀉轉筋悶絶吳茱茰湯泡七次生薑切各一分木瓜木刀切兩半右每服二三錢用水煎治霍亂其效神速一方有黃連無扁豆仍與第二論通用妊婦霍亂腹痛四肢冷逆汗脈細理中湯治之傷食加陳皮寒甚脈欲絶隂症悉具加炮附子方見二十卷竹茹湯治霍亂熱渴脈數見七卷嘔吐門附方藿香正氣散方見二十一卷第十論平胃散方見七卷第十八論四君子湯方見二十四卷第六論人參養胃湯方見七卷第十八論五苓散方見二十一卷第十論理中丸方見二十卷第八論香薷飲方見七卷第二論薛氏醫案卷三十八
