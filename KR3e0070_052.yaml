body:
  text: 薛氏醫案卷五十二明薛已訂錢氏小兒直訣三五臟內外疳症主治凡小兒疳在內目腫腹脹瀉痢青白體漸瘦弱疳在外鼻下赤爛頻揉鼻耳或肢體生瘡鼻瘡用蘭香散諸瘡用白粉散肝疳一名筋疳白膜遮晴或㵼血而瘦用地黃丸心疳面黃頰赤身體壯用安神丸脾疳一名肥疳體黃瘦削皮膚乾澀而有瘡疥腹大嗜土用益黃散腎疳一名骨疳肢體瘦削遍生瘡疥喜卧濕地用地黃丸肺疳一名氣疳喘嗽氣促口鼻生瘡用益黃散若患潮熱當先補肝後㵼心若妄以硝磺諸藥利之若患癖當消磨若誤以巴豆硼砂下之又傷寒誤下皆能成疳其初病者為熱疳用黃連丸久病者為冷疳用木香丸冷熱相兼者用如聖丸津液短少者用白术散凡此因大病脾胃虧損內亡津液所致當固脾胃為主而早為施治則不變敗症也薛按疳症或哺食早或嗜食甘肥或服峻厲之藥重亡津液虛火熾盛或因稟賦或乳母厚味七情致之當各調治其內若口舌蝕爛身體壯熱腮唇赤色或作腫痛腹膈煩悶或掌熱咽乾作渴飲水便赤盜汗嚙齒虛驚此心經內外疳也用安神丸之類主之若鼻外生瘡眼目赤爛肢體似癬兩耳前後項側缺盆兩腋結核或小腹內股玉莖隂囊睪丸腫潰小便不調或出白津或咬指甲搖頭側目白膜遮睛羞明畏日肚大青筋口乾下血此肝經內外疳也用地黃蘆薈二丸主之若頭不生髮或生瘡痂或髮成穗或人中口吻赤爛腹痛吐逆乳食不化口乾嗜土瀉下酸臭小便白濁或合目昏睡惡聞木音此脾經內外疳也用肥兒丸主之若鼻外生瘡咽喉不利頸腫齒痛咳嗽寒熱皮膚皺錯欠伸少氣鼻癢出涕衄血目黃小便頻數此肝經內外疳也用地黃清肺飲主之或內熱吐痰手足逆冷寒熱往來滑瀉肚痛口臭作渴齒齦潰爛爪黑面黧身耳生瘡或耳出水或食自髮此腎經內外疳也用地黃丸主之凡疳熱上攻或痘毒上升為患甚速名為走馬疳急敷雄黃散服蟾蜍丸輕則牙齦腐爛唇吻腫痛可治重則牙齦蝕落腮頰透爛不治世傳方有云有無辜等疳一十二症補注蟾蜍丸下愚治陳職方孫面頰患瘡將蝕兩目或用清熱之藥久而不愈余用大蕪荑湯二劑清其肝火而愈陳司廳子遍身生瘡面色痿黃腹脹內熱大便不調飲食少思倦怠口乾用大蘆薈丸治其肝脾不月而愈俞廷評子目劄面青食少體倦大便滑泄此木乘脾土用芍藥參苓飲而痊陳工部孫腹內一塊小便不調或以血痞久服行氣破血等藥發熱口乾體瘦懶食幾成瘵症余謂面黃兼青乃肝脾疳症用補中益氣湯煎送大蘆薈丸四服又用前湯加車前子煎送六味丸四服又用清肝生血之藥而愈一女子十二歲目生白翳面黃浮腫口乾便澀滯肝脾之症用四味肥兒丸而愈一小兒九歲目劄畏明年深不愈或以為實火服㵼青丸之類益甚求治於余仍欲㵼肝余謂肝經虛火用地黃丸補之而愈夫肝氣為陽為火肝血為隂為水肝經之症若非肝火血燥而生風必因肝血虛而火動其初患而病氣形氣俱實者宜少與瀉青丸瀉之其久患而病氣形氣俱虛者當與地黃丸補其腎肝蓋此症原因肝經血少而生風耳不可輒用瀉青峻劑經云凡病虛則補其母實則瀉其子前症果肝經實熱宜用柴胡黃連之類以治心火者審焉一小兒鼻外生瘡不時揉擦延及兩耳又一小兒視物不明鼻內或癢或生瘡用四味肥兒丸漸愈一小兒耳內出水耳外生瘡膿水淋漓經歲不愈余用九味蘆薈丸以治肝用地黃丸以生腎水乃瘥一小兒遍身如瘡或癢或痛肌體消瘦日夜發熱口乾作渴大便不調年餘不愈用蘆薈丸以治肝兼五味異功散以補脾而愈一小兒數歲腦後並結二核肉色如故而不臖腫正屬膀胱經觀其形狀審其糞色兼屬肝脾腎三經用九味蘆薈丸以清肝脾佐用地黃丸以補腎水形體漸健不兩月而消一小兒腹內結塊小便不調余以為肝經內疳症用蘆薈丸為主佐以龍膽瀉肝湯而消一小兒自脫胎即兩目赤腫或作癢或作翳此胎稟肝火耳用六味蘆薈二丸而愈一小兒患瘰􅐇小便頻數兩目連劄或作嘔少食泄瀉後重此肝經熱盛而脾土受邪也用補中益氣湯六味地黃丸而痊一小兒面色痿黃眼胞微腫作渴腹脹飲食少思腹中一塊或移動小便澄白大便不實此脾疳之患用四君子加山梔蕪荑兼四味肥兒丸而愈一小兒嗜食泥土困睡泄㵼遍身如疥此脾經內外疳也用六君子湯及四味肥兒丸而痊一小兒面黃頰赤發熱作渴睡中驚悸此心經內疳症用四君加炒黑黃連芎歸為主佐以祕旨安神丸而痊一小兒所患同前兼掌心發熱遍身如疥此心經內外疳症用肥兒丸為主佐以祕旨安神丸而愈一小兒咳嗽寒熱咽喉不利鼻上有瘡久不生痂此肺經疳症用地黃清肺飲四味肥兒丸而愈一小兒下疳潰爛爪黑面黧遍身生疥此腎經內外疳症用地黃丸為主佐以四味肥兒丸而瘥史少參幼子二歲項後結核不時仰首或以為熱瘡內潰用針決之服消毒之藥後曲腰啼哭余謂此無辜外弔症也曲腰而啼內弔症也果殁腹痛腫脹諸症小兒腹痛體瘦面色㿠白目無晴光口中氣冷不思飲食或嘔利撮口此脾土虛而寒水所侮也用益黃散調中丸主之若口中氣溫而色黃白目無睛光或多睡惡食或大便酸臭此積痛也用消積丸甚者白餅子下之後以白术散調補胃氣若腹脹而悶亂喘滿者實也用紫霜丸白餅子若不悶亂喘滿者脾虛也誤下之以致目胞腮面四肢浮腫肚腹愈脹以塌氣丸主之因下而喘脾氣益虛也脾虛不能勝腎水隨肺氣行於四肢如水狀若侵浮於肺即大喘也薛按腹痛不食口中氣冷下利撮口等症屬形病虛寒也用六君子加炮薑溫補之食積多睡口中氣溫惡食面黃白等症屬病氣實而元氣虛也用六君子加神麯山查消導之劑若腹脹喘滿脾肺虛而氣不歸源者用補中益氣湯若因下脾肺氣虛而面目四肢浮腫等症者用金匱加減腎氣丸况此症有因乳母脾胃宿積飲食傷脾所致其白餅子紫霜丸必形病俱實方可用也塌氣丸亦非調補之劑宜審用之愚治一小兒每停食腹痛發赤暈用清中解鬱湯而愈後患搖頭咬牙痰盛發搐吐酸腐待其吐盡翌日少以七味白术散次日又以參苓白术散調理脾胃遂不復患大抵吐後兒安不必更服他藥恐復傷元氣也一小兒傷食腹脹嘔吐發熱面赤服消導清熱之劑飲食已消熱赤未退用六君子加升麻柴胡各二分升補胃氣四劑而愈一小兒五歲停食腹痛發熱面赤或用養胃湯枳實黃連更加腹脹午後熱甚按其腹不痛余以為脾虛而藥傷用六君子湯數劑而痊一小兒數歲每停食輒服峻厲之藥後肚腹膨脹嘔吐泄瀉先用六君子湯諸症漸愈又用補中益氣湯而安一小兒肚腹脹飲食即瀉手足逆冷此脾氣虛寒也先用人參理中丸後用六君子湯而愈一小兒傷食腹脹胸滿有痰用異功散而痊後復傷食腹脹兼痛或用下劑痛雖止而脹益甚更加氣喘此脾益傷而肺益虛也用六君子湯加桔梗調補而愈一小兒腹脹惡食發熱惡心殊類外感余曰此飲食所傷脾肺虛熱也用保和丸一服諸症頓退但腹仍脹用異功散而痊一小兒傷食腹脹服剋伐之劑小便澀滯又服五苓散之類飲食漸減小便不通四肢頓腫余朝用加減腎氣丸夕用異功散而愈若腎熱傳於膀胱熱甚逆於脾肺脾胃虛而不能制腎水流走四肢而身面皆腫若上勝則刑於肺故令喘也薛按肺主氣腎主水前症因稟賦不足或因大病後或誤行汗下致脾虛不能制水而溢皮膚肺虛不能攝氣而氣上逆宜用六味丸補中益氣湯治之如小便不利用金匱加減腎氣丸腎經虛火上炎肺熱作喘者用六味地黃丸心火熾盛肺熱作喘者用人參平肺散凡此皆屬腎經隂虛熱症用六味丸壯水為主若用清熱分利之藥則誤矣一小兒稟父腎熱小便赤澀服五苓散之類後患停食服剋伐之藥四肢面目浮腫小便不利漸至氣喘此誤行滲利脾肺氣虛不能攝水而患腫脾腎虛寒不能制水而氣喘用六味丸加牛膝車前及補中益氣湯而愈若口吐痰沫或吐清水面㿠白心腹痛而有時者蟲痛也與癎相似但目不斜手不搐也用安蟲散主之薛按蟲乃濕熱所生或木氣而化有因臟腑虛弱有因胃冷胃熱為人身之固有者其為患往來攻痛或吐涎水肌體消瘦而無正色但當調補脾胃為主若蟲食上部則上唇有白點蟲食下部則下唇有白點腹中之蟲朔日之後其頭向上望日之後其頭向下如或用藥先以肉物近兒烹炙使聞香味蟲頭皆向上則藥易於奏效丹溪先生云冬月吐蟲多是胃氣虛寒用錢氏白术散加丁香二粒補之可見小兒之蟲皆飲食傷脾所致患瘡疥內生蟲虱者皆肝木所主也辛氏子五歲病蟲痛或用巴豆硼砂之類哭而俯仰按腹大呌面青黃而時白目仍青師曰此病大困更加㵼則不救次夜大㵼并下前藥師曰今面青作瀉此肝木乘脾形病相反當五日篤七日死已而果然愚治一小兒蟲動心腹痛先服蕪荑散下之更加作嘔食少口渴飲湯右腮鼻凖白中兼黃此脾肺氣虛也余用異功散二服少愈仍加炮薑一服而安一女子年十三歲面色青黃頭左生癤頸項結核寒熱往來大便不利余謂此肝木侮脾元氣虧損所致寒熱非客邪便祕非內實不信仍服雜藥後作泄㵼癤內出虱余用六君子加升麻柴胡蕪荑為主佐以九味蘆薈丸諸症悉退頸核頓消一小兒面色青黃心腹作痛時欲嘔吐或小便淋漓或隂莖濕癢余以為肝經風熱侮脾不信後遍身生疥出蟲虱余用四味肥兒丸六君子湯之類尋愈若腹中有癖不食但飲乳是也當漸用白餅子下之蓋小兒病此良由乳食不消伏於腹中乍冷乍熱飲水過多即蕩滌腸胃亡失津液脾胃虛弱不能傳化水穀以致四肢羸瘦肚腹漸大而成疳矣愚按此症或因小兒乳食過多致傷脾胃或乳食起居七情六淫失宜所致必先調補元氣為主佐以消散之劑若除之不以漸則必有顛覆之患常治食積既去而熱不退或作嘔吐少食用五味異功散脅脹少食善怒㵼青用六君子湯加升麻柴胡少食體倦瀉黃用補中益氣湯手足冷加炮薑木香如不應佐用四神丸體瘦潮熱口乾大便不調用肥兒丸兼頸項結核口齒腐爛當參前疳條主之愚治一小兒腹中痞塞略服二陳枳實黃連其痞益甚余謂屬脾經血虛用六君子加當歸數劑胃氣漸復乃朝用異功散加升麻夕用異功散加當歸而愈一小兒素嗜肉食腹中作痛大便不調半載之後肚腹膨脹右脅內結一塊不時轉移又三月左脅內亦結一塊胸腹亦脹齦潰作渴小便赤澀或澄白大便色穢不一又半載頷下結核三五枚服消塊行滯等藥元氣益虛其塊益甚余用四味肥兒丸五味異功散之類隨症進退治之熱渴漸止又月餘腹脹漸消更佐以九味蘆薈丸齒齦漸愈乃用四君子為主佐以蕪荑丸之類而痊一小兒飲食不節或作瀉或腹痛或腹脹腹中一塊大便不調作渴發熱齦爛口臭専服消導尅滯前症益甚形體益瘦余曰面色黃中隱青脾土虧損而肝木所侮也法當調補中氣平肝木則脾氣自旺虛火自退諸症自愈遂用沖和湯及大蕪荑之類果愈一小兒患痞服剋滯之藥余謂形氣有餘病氣有餘者當瀉不當補形氣不足病氣不足當補不當瀉前症屬形病俱虛非調補中氣不愈不信仍行剋伐元氣虧損虛火上炎齒齦蝕爛頷下結核余用大蕪荑湯及異功散之類尋愈五臟雜症主治自汗者厚衣卧而額汗出也盜汗者肌肉虛而睡中汗出也用止汗散遍身汗用香瓜丸胃虛汗者上至項下至臍也用益黃散六陽虛汗者上至頭下至項難治薛按前症因小兒元氣未充腠理不密或因飲食停滯鬱熱或厚衣溫暖臟腑生熱而津液妄泄也其自汗屬心經血熱用導赤散血虛用圑參湯其盜汗屬腎經虛熱用五味異功散氣血虛弱用人參養榮湯若寒水侮土用益黃散設泛行施治誤損脾胃多成疳瘵其六陽虛汗乃稟賦不足若用參附茋附二湯亦有生者大凡汗多亡陽必至角弓反張頸項徑強若用十全大補之劑多有生者張氏三子大者汗出遍身與香瓜丸次者上至項下至胸與益脾散小者但額有汗與石膏湯各五日而愈若概用麥煎散治之誤矣愚治一小兒其面色或白或青或惡寒或發熱鼻間微黃兼白盜汗自汗胸膈不利飲食少思常懷畏懼余以為脾肺氣虛不信又用硃砂安神之類前症益甚更往來寒熱泄瀉不食余用六君子湯加黃茋當歸為主佐以八珍湯之類而痊一小兒五歲腹痛泄㵼盜汗鼻間左腮皆白此屬脾肺氣虛而食積所致用六君子加山查神麯四劑腹痛頓止去二味又四劑而大便調用四君歸茋二劑而盜汗止一小兒十二歲形氣瘦弱右腮白兩頦赤鼻間隱青盜汗久不愈此稟足三隂虛而然也朝用補中益氣湯夕用六味丸而愈一小兒三歲盜汗少食聞藥即嘔此胃傷也用浮麥炒為末每服少許以乳調服旬餘嘔止乳進佐以六君子湯而愈一小兒停食腹痛夜間盜汗此脾虛食積所致用六君子湯數劑腹痛漸愈盜汗亦止後復停食服消積丸作瀉不止自汗盜汗飲食甚少睡而露睛四肢發搐此脾土虛而肝木所勝用六君子少加柴胡治之飲食漸進諸症漸愈但盜汗不止屬腎虛也佐以地黃丸愈一小兒發熱呵欠頓悶咬牙盜汗屬肝膽火症用小柴胡湯加山梔二劑又前用地黃丸料煎服而愈夜啼者小兒筋骨血脈未成而多哭脾臟冷而痛也當與溫中藥或花火膏主之若虛怯為冷所乘則唇青薛按前症多因小兒稟賦不足或乳母飲食七情虧損所致若面色白白睛多者屬腎氣不足至夜則隂盛而腹痛也用六味丸若臉青唇白或小便黃短屬脾氣不足至夜則隂盛而腹痛也用釣藤鈎散若臉紅舌白或小便赤澀小腸熱也用導赤散加辰砂如不應屬腎火用地黃丸唇色青白口中氣冷或肢體冷或泄㵼曲腰或泄㵼不乳此脾腎虛弱用六神散兼嘔吐用六君子湯大便不化乳少腹脹用五味異功散加漏蘆令母服之兒病自愈兒亦服四五滴尤妙兒大數滴愚治一小兒停食腹痛夜啼用大安丸而愈後乳食雖入其腹仍痛用六君子加山查神麯痛少止乃去二味又四劑痛全止一周歲兒痰嗽啼哭或用抱龍丸未止余視其右腮白左腮青此肺肝二經相勝先用㵼白散以祛肺邪次用柴胡梔子散以平肝火又用地黃丸以滋腎水而痊一小兒三歲夜啼面色白黑睛少小便清此腎脾氣虛朝用補中益氣湯加山藥五味子夕用地黃丸頓愈驚啼者邪氣乘心也當以安神主之愚按哭而不啼多泪是驚悸也啼而無泪是痛也若因心血不足用祕旨安神丸心火熾盛用導赤散水火相搏用柴胡梔子散肝血不足用六味丸所云十啼者蓋亦大同小異耳愚治一小兒白睛多面色赤時作啼此稟腎不足用地黃丸半載後忤其意雖哭面色不赤丹溪先生云小兒忽大呌必死即此義也若浴後拭臍不乾風入作瘡令兒撮口甚者是脾虛也若頻撮口是氣不和也益黃散主之愚按前症果因浴後拭挹不乾用枯礬為末搽之即愈若兼乳母肝脾有熱助兒為患當用加味逍遙散以治其母若風入作瘡邪傳於脾撮口者其害匪輕七日內患者其厄尤速弄熱舌者脾臟微熱令舌絡牽緊時時舒熱當少用瀉黃散或飲水者脾胃虛而津液少也兼面黃肌瘦五心煩熱者疳瘦也用胡黃連丸大病未巳而弄舌者凶愚按小兒舌微露而即收名弄舌屬心脾虧損用溫脾散補之舌舒長而收緩名吐舌乃心脾積熱少用瀉黃散主之兼口舌生瘡作渴飲冷屬胃經實熱用瀉黃散作渴畏冷屬胃經虛熱用四君子湯食少作渴或大便不實脾胃虛弱也用七味白术散口角流涎或腮頰患腫胃虛風熱也先用人參安胃散後用七味白术散若午後甚者脾血虛也四物湯多加參术茯苓未應用補中益氣湯及審相勝其疳瘦症當參諸疳門七味白术散即人參白术散解顱者生下腮門不合也長必多愁少笑目白睛多面色㿠白肢體消瘦皆腎虛也愚按腎主髓腦為髓之海前症因父母精血不足不能榮養宜用地黃丸補之有至七八歲或十四五歲氣血既盛而自合若縱恣食色欲戕賊真隂亦不能盡其夀矣此症若在乳下當兼補其母更以軟帛緊束兒首使其易合亦有腮陷腮填俱屬稟不足或五疳久病元氣虧損者仍參後小便不通類主之愚治一小兒顱解足軟膝大不能行履用六味丸加鹿茸治之三月而能步履一小兒年十四歲而近女色發熱吐痰至有室兩目羞明頭覺脹大仍不斷欲頭漸大腮門忽開用地黃丸益氣湯之類斷色欲年餘而愈一小兒十三歲患前症內熱晡熱形體倦怠食少作渴余以為所稟怯弱用六味丸加鹿茸補之不越月而痊一小兒十四歲解顱自覺頭大視物皆大畏日羞明先兄以為腎稟怯弱用六味丸加五味鹿茸及補中益氣加山藥山茱萸半載漸愈二載而腮合後畢姻覺腮門開解足心如炙喜其斷色欲戒厚味日服前藥二劑三載而愈胎肥者生下豐厚白睛粉紅大便乾難時出涎水胎熱者生下有血色時呌哭身熱淡黃目睛多赤大便色黃急欲食乳並用浴體法主之胎怯者生下面白肌肉瘦弱大便白水身無血色哽氣多噦亦用浴體法薛按浴體之法乃開發腠理疏泄陽氣者也其胎氣果熱在暑月庶幾可用其或胎怯而用前法恐復傷真氣也然此症屬有餘者胎肥胎熱也因母食膏粱厚味或怒火鬱熱胎怯弱者因父精不足或母氣虛弱用八珍湯父精不足用地黃丸俱加漏蘆令母服之子亦服之急欲乳不能食者此風邪由臍而藴熱心脾致舌厚唇燥不能吮乳也薛按前症果因外邪而唇口撮緊者名為臍風多不能救若心脾有熱舌尖痛不能吮乳舌本痛不能送乳者以栁華散敷之若舌下腫如小舌者或舌絡牽痛或齒齦患白星俱用線針刺出毒血亦敷前散若唇腫痛或裂紋作痛以當歸膏調前散敷之若暴病發熱作渴飲冷大便祕結用瀉黃散疏導其熱若病後發熱口渴飲湯大便不實用異功散調補胃氣若服攻伐之劑兼嘔吐或腹痛脾胃復傷也用四君子湯或口角流涎或痰氣壅盛脾不能攝也用六君子湯若兒自食甘肥或母食酒麵致兒口舌生瘡用清胃散以清熱若作嘔少食泄瀉用白术散以補脾若手足並冷或腹痛惡寒用六君炮薑以溫中若因乳母飲食勞役失宜發熱致兒用補中益氣湯因乳母肝脾二經血虛內熱傳兒用加味逍遙散八珍湯因乳母肝脾鬱怒血傷內熱致兒為患用加味逍遙散加味歸脾湯俱加漏蘆子亦服數滴仍參前弄舌類凡針重舌以針直刺不可橫桃恐傷舌絡則言語不清龜胸龜背者由兒生下風客於臍入於骨髓致成龜背若肺熱脹滿攻於胸膈即成龜胸並用龜尿點其骨節自愈取尿法用青蓮葉安龜在上用鏡照之其尿自出薛按小兒元氣未充腠理不密風邪乘之或痰飲藴熱於肺風熱交攻而致或坐早風入骨髓治當調補脾肺為主若因乳母厚味辛辣而致者當兼治其母若因稟父肝腎虛熱者用六味地黃丸若稟腎氣不足者用八味地黃丸若患吐瀉或大便後雖有聲而不能言又能咽物者非失音此腎怯不能上接於陽也當以地黃丸主之凡口噤不止則失音語遲薛按前症多因稟腎不足蓋腎脈繫於舌本非地黃丸不能治故患此症者若仰首呵欠則嗽如未應須兼以補中益氣湯滋其化源若隂火上炎肺金受傷而失音者亦治以前法保嬰集云小兒五六歲腎氣不足而不能言者用菖蒲丸口噤不能言者用地黃丸愚治一小兒言遲患泄瀉聲音不亮雜用清熱等劑聲音如啞飲食少思去後多在侵晨朝用地黃丸加五味子夕用補中益氣湯其泄頓止却専服前丸不兩月其言漸亮而愈一小兒白睛多而黑睛少吐㵼後喉瘖口渴大便不實朝夕悉服地黃丸而痊後患瀉其喉復瘖仍服前丸遂愈若大病後身目皆黃者黃病也身痛背強大小便澀一身盡黃小便黃赤此黃疸也瀉者難治若百日或半年不因病而身黃者胃熱胎疸也若淡黃兼白者胃怯也薛按大病後身目皆黃或肢體黃胖者脾氣虧損而真臟為病宜用六君子湯參苓白术散調補元氣病後發渴者脾氣虛而津液少也用七味白术散若脾經濕熱壅滯二便祕腠理不得疏泄而為患者名為黃疸用茵陳湯初生身黃壯熱不乳便祕此為胎熱用地黃湯若二便赤澀腹脹面赤飲水用茵陳湯調五苓散若清便自調四肢並冷用益黃散淡黃白用調中丸愚治一小兒旬日內先兩目發黃漸及遍身用瀉黃散服之瘥一小兒因母食鬱飽脹咽酸而患遍身皆黃余以越鞠丸治其母以泄黃散治其子並愈長大不行行則腳軟齒久不生生則不固髮久不生生則不黑皆胎弱也愚按前症即五遲之症也蓋腎主骨齒者骨之餘髮者腎之榮也良由父母精血不足腎氣虛弱不能榮養而然耳有肝腎虛長而不能行者有肝氣虛而手足拳攣者有肝腎虛而腳不能館展者並用地黃丸滋補之有心氣虛而不能言語用團參湯補中益氣湯培養之若久病或五疳所致者但調補脾胃為主全嬰方云頭項手足身軟謂之五軟症皆稟腎氣怯弱也愚治一小兒體瘦腿細不能行步齒不堅固髮稀短少屬足三隂虛用六味地黃丸補中益氣年餘諸症悉愈形體充實一小兒三歲言步未能牙髮稀少體瘦骨立發熱作渴目黑睛少服肥兒丸不應此腎虛疳症也前丸乃脾胃經之藥久服則腎益虛而疳益甚不信果牙髮漸落用六味丸加鹿茸五味子半載而愈一小兒七歲左腿細短寸許不良於行目睛白多或出盜汗髮黃成穗用地黃丸加鹿茸五味子為主佐以補中益氣湯半載行履如故一小兒脫肛半載恪服升補元氣之藥而愈薛氏醫案卷五十二
