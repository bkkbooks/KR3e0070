body:
  text: 薛氏醫案卷四十一明薛已訂婦人良方産難門坐月既明須知産難故以次之産難論第一婦人以血為主惟氣順則血和胎安則産順今富貴之家過於安逸以致氣滯而胎不轉動或為交合使精血聚於胞中皆致産難若腹或痛或止名曰弄胎穩婆不悟入手試水致胞破漿乾兒難轉身亦難生矣凡産直候痛極兒逼産門方可坐草時當盛暑倘或血運血溢當飲清水解之冬末春初産室用火和暖下部衣服尤當溫厚方免胎寒血結若臨月洗頭濯足亦致産難愚按丹溪先生曰余族妹苦於産難遇胎則驅之豫甚憫焉蓋其形肥而勤女工形肥則氣虛久坐則氣不運而兒在胞胎因亦不能自運耳當補其母之氣則兒健易産故後有孕至五六月遂以紫蘇飲加補氣藥與之數十貼而産甚快大要在隨母之禀性若胎胞破早血水先乾或難産勞傷氣血者煎八珍湯或十全大補湯加益母草不時與服以協濟之或以黃茋數斤芎歸四五斤許大釡水煎藥氣氤氲滿室使産婦口鼻俱受其氣臍帶以油紙撚燒斷補接其陽氣穩婆須擇老練者當先施惠預說與知倘有生息不順只說是未産或是雙胎只說胎衣未下恐驚則氣散愈難生息附治驗方藥荆婦孟冬分娩艱難傷勞元氣産子已死用油紙撚燒斷臍帶藉其氣以暖之俄頃忽作聲此兒後無傷食作瀉之症可見前法之功不誣世用刀器斷臍帶子母致危者竟不知其由矣且穩婆又喜平日常施小惠得其用心兼以安慰母懷故無虞耳一穩婆云我止有一女正分娩時適當巡街侍御行牌取我視其室分娩女用驚赫未産而死後見侍御更以威顔分付逮視産母胎順而頭偏在一邊以致難産因畏其威不敢施手由是其母子俱不能救紫蘇飲方見十二卷第八論十全大補湯八珍湯二方見二十四卷第四論楊子建十産論第二凡生産先知此十證庶免子母之命折於無辜也世之收生者少有精良妙手多致傾命豫因傷痛而備言之一曰正産正産者言懷胎十月隂陽氣足忽然作陳疼痛胎至谷道漿破血下兒即正産二曰傷産傷産者言懷胎未足月有所傷動以致忽然臍腹疼痛或服催藥過早或産母努力太早逼兒錯路不能正生凡分娩須待兒身轉順頭對産門努力一送兒即正生三曰催生催生者言欲産時兒頭至産門方服藥催之或經日久産母困倦難生宜服藥以助其血氣令兒速生四曰凍産凍産者言天氣寒冷産母血氣遲滯兒不能速生故衣裳宜厚産室宜暖背心亦宜溫和庶兒易生五曰熱産熱産者言盛暑之月産婦當溫凉得宜熱甚産母則頭疼面赤昏暈若産室人衆熱氣蒸逼亦致前患名曰血暈若夏月風凉隂雨亦當謹避六曰橫産橫産者言兒方轉身産母用力逼之故也凡産母當令安然仰卧穩婆先推兒身順直頭對産門以中指探其肩不令臍帶羈扳方用藥催之繼以産母努力兒即生七曰倒産倒産者言兒未能轉身産母努力故也當令産母仰卧穩婆推入候兒自順若良久不生令穩婆手入産户一邊撥兒轉順近産門却服催藥并努力即下八曰偏産偏産者言兒回身未順生路産母努力逼兒頭偏一邊産雖露頂非也乃額角耳當令産母仰卧穩婆輕手正其頭向産門却令産母努力子即下若兒頂後骨偏拄穀道露額令穩婆以綿衣灸暖裹手於穀道外傍輕手推正令産母努力兒即生九曰礙産礙産者言兒身已順門路已正兒頭已露因兒轉身臍帶絆其肩以致不能生令産母仰卧穩婆輕推兒向上以中指按兒肩脫臍帶仍令兒身正順産母努力兒即生十曰坐産坐産者言兒之欲生當從高處牢繫手巾一條令産母以手攀之輕輕屈坐令兒生下不可坐抵兒生路十一曰盤腸産趙都運恭人每臨産則子腸先出然後産子其腸不收名曰盤腸穩婆以醋水各半盞默然噀産婦面背才收不可不知愚按前症古方以萆麻子仁四十九粒研塗産母頭頂腸收上急洗去其腸若乾以磨刀水少許溫潤之再用磁石煎湯服之即收上磁石須隂陽家用有驗者若以水噀母面背恐驚則氣散治盤腸産以半夏為末搐鼻中腸自上又方大紙撚以麻油潤燈吹滅以煙薰産婦鼻中腸即上又方腸出盛以潔淨漆器濃煎黃茋湯浸之腸即上催生方論第三五行論命以年月日時支干五行相生相值以推其貴賤其間最切要者時也得其時則終身富貴失其時則一世貧賤然則命禀於有生之初豈可催乎世之催生之說蓋為産難而設也今開厯驗數方于後催生柞木飲子治産難或胎爛腹中腹悶其效如神生柞木一尺銼井草大者五寸銼五假右用水三鍾紙封罐口煎一鍾半候胎順産門徐徐溫服即時分娩更無諸苦切不可早於坐草及穩婆下手催逼催生如神散治逆産橫生其功甚大百草霜白芷不見火各為末等分右每服三錢至胎順産門以童便米醋和如膏加沸湯調下或童便酒煎進二服然血得黑則止此藥大能固血又免血乾甚妙如聖散用黃蜀葵花焙為末熱湯調下二錢若漏血胎胞乾澀難産併進三服即産如無花用葵子末半合調溫酒服尤妙若打撲胎死紅花酒調下順生丹治症同上兔腦髓去皮膜研如膏明乳香一兩細研母丁香末二兩麝香一錢研細右以兔腦髓丸雞頭大隂乾每服一丸溫水下男左女右手握出兔腦臘月者尤佳又方通明乳香一塊如皂子大為末腰痛時用冷水醋少許調服扶立令兩手拿石燕二箇念醫靈藥聖三遍行數步坐草便生更無痛楚神效愚按前法觀之似迂其用者云甚驗治産不順蛇蛻一條全者蠶蛻紙一張無則一方右入新瓦瓶內鹽泥固濟存性為末煎榆白皮湯下一錢三服覺痛便生又方用伏龍肝研末每服一錢酒調下兒頭戴土而下又方吞槐子十四粒即下又方當歸為末酒調一錢服良久再服一方用魚膠一尺許新瓦上煅灰陳醋調服立下又方大朱砂於端午日晒起以百日為度研為細末用臘月兔腦髓丸緑豆大欲産時粥飲下一丸良久便生其藥男左女右手中握出晒硃砂不得著雨又方臘月兔頭煅為末葱白煎湯調二錢立生或臘月兔血紙袋盛掛當風處隂乾為末煎乳香湯調下二錢或兔皮和毛燒為末酒調服二錢即産如胎衣未下再服神妙乳砂丹用明乳香為末臘月兔血丸桐子大硃砂為衣隂乾每服二丸嚼碎冷酒下良久未生再服難産以蓮葉蒂七箇水煎化服二丸良久未生再服胞漿先乾胎不得下急服大料四物湯滋其血氣並濃煎葱湯薰洗産户更用油燭塗産户內却服前藥胎死不出用朴硝五錢滚湯調下或平胃散一服胞衣未下酒水服一丸橫逆不順先用如神散方見前産門不開用加味芎歸湯仍服二丸須月初上辰日修合鹽塗兒足底急搔摩之即産應急方好墨新汲水濃磨服之墨水裹兒出又方清油同蜜等分入滚湯少許調服或油煎一盞服之或路傍破草鞋一隻取鼻絡小繩燒灰酒調服交骨不開産門不閉方論第四新附竊謂交骨不開産門不閉皆由元氣素弱胎前失於調攝以致血氣不能運達而然也交骨不開隂氣虛也用加味芎歸湯補中益氣湯産門不閉氣血虛也用十全大補湯附治驗地官李孟卿娶三十五嵗女為繼室妊娠慮其難産索加味芎歸湯四劑備用果産門不開止服一劑頓然分娩上舍懷德之室産門不開兩日未生服前藥一劑即時而産懷德傳服此方用者無有不驗一婦人分娩最易至四十妊娠下血甚多産門不開與前湯一劑又以無憂散斤許煎熱時時飲之以助其血而産一産婦隂門不閉發熱惡寒用十全大補加五味子數劑而寒熱退又用補中益氣加五味子數劑而隂户斂若初産腫脹或焮痛而不閉者用加味逍遙散若腫既消而不閉者用補中益氣湯切忌寒凉之劑一婦人脾胃素弱兼有肝火産後隂門腫痛寒熱作渴嘔吐不食敷大黃等藥服驅利之劑腫及於臀虛症蜂起此真氣虛也先用六君子以固脾胃乃以補中益氣湯升舉而消一産婦失治腫潰不已形體消瘦飲食少思朝寒暮熱自汗盜汗半年矣余用補中益氣加茯苓半夏以健脾胃膿水漸少飲食漸進用歸脾湯以解脾鬱共五十餘劑元氣復而瘡亦愈矣一産婦隂門不閉小便淋瀝腹內一物攻動脅下或脹或痛用加味逍遙散加車前子而愈一婦人子宫腫大二日方入損落一片殊類猪肝面黃體倦飲食無味內熱晡熱自汗盜汗用十全大補湯二十餘劑諸症悉愈仍復生育加味芎歸湯治交骨不開不能生産川芎當歸各一兩自死龜板一箇酥炙婦人頭髮一握燒存性右為散每服五錢水煎服約人行五里即生如胎死亦下灼過龜板亦可十全大補湯方見二十四卷第四論補中益氣湯方見二十四卷第六論郭稽中産難方論第五論曰産難者因兒轉身將兒枕血塊破碎與胞中敗血壅滯兒身不能便利是以難産急服勝金散消散其血使兒自易生陳無擇云多因兒未轉順坐草太早或努力太過以致胞衣破而血水乾産路澀而兒難下宜先服催生如神散以固其血設或逆生橫産當用前法針刺之勝金散麝香末一錢豆䜴一兩右每服一錢用稱錘燒赤淬酒下催生如神散亦可用産難子死腹中方論第六産難子死腹中多因驚動太早或觸犯禁忌其血先下胎乾涸而然也須驗産母舌若青黑其胎死矣當下之故産室坐卧須順四時方向并遵五行避忌則吉附治驗一穩婆之女勤苦負重妊娠腹中陰冷重墜口中甚穢余意其胎已死令視其舌青黑與朴硝半兩許服之化下穢水而安一婦人胎死服朴硝下穢水肢體倦怠氣息奄奄用四君子為主佐以四物薑桂調補而愈一方水銀半兩桂末一錢作一服溫酒調下粥飲亦可又方以利斧煅赤置酒中待溫飲之其子便下又方以錫粉水銀各一錢棗肉丸大豆許水吞下立出又方朴硝三錢溫童便調下猫犬牛畜用之皆驗又方平胃散五錢酒水各一盞煎至一盞投朴硝五錢再煎三五沸溫服其胎即化水而出寶慶方云凡欲斷臍帶先以繫物墜下後可斷之否則胞衣上即冲心而死附方四君子湯四物湯二方見二十四卷第六論産難生死訣第七欲産之婦脉離經難經云一呼三至曰離經此是陽加於隂一倍也一呼一至亦曰離經此是隂加於陽四倍也注云經者常也胃脉離常絡之處周即言之一呼脉再至一吸脉再至曰脾和之脉故一呼脉行三寸一吸脉行三寸呼吸定息脉行六寸一日一夜一萬三千五百息脉行八百一十丈乃于一周復從始之經再行今一呼脉三至一吸脉三至呼吸定息脉行九寸一日一夜脉行通計一千二百一十五丈過於平脉之數不在所起之經再起故曰離經若一呼一至脉行寸半一吸一至脉行寸半呼吸定息脉行三寸一日一夜通計脉行得四百單五丈乃謂一周是不及平脉之數周而復始亦不在所起之經再起亦曰離經也沉細而滑也同名臨産之婦脉見沉細而滑者乃腎臟本脉之形然腎繫胞胎見此脉者亦與離經之脉同名也夜半覺痛應分誕來日日午定知生若妊婦夜半時覺腹痛定知來日午時當分娩也聖惠方云夜半子時覺腹痛來日午時必定生産謂子午相半正半日觀數也身重體熱寒又頻舌下之脉黑復青反舌上冷子常死腹中須遣子歸冥凡妊婦身有沉重者胃氣絶也又體熱寒膘頭併者王氣衰隂氣盛也若舌捲下脉青黑色也及舌反捲上水冷不溫者子母俱死之候面赤舌青細尋看母活子死定應難凡妊婦面色赤是榮氣流通母活之候舌上青色是妊脉絡絶胎死之候唇口俱青沫又出子母俱死總高判若妊婦唇口俱青色者榮衛氣絶也又口中吐出痰沫者是脾胃之氣俱絶此是子母俱死之候也面青舌青沫出頻母死子活是知真不信若能看應驗尋之賢哲不虛陳凡妊婦面與舌皆青色又吐痰沫者是産婦榮衛俱絶胎氣衝上之候此是子活母死之候産下子母必死也此古賢哲應驗之文不虛妄陳其說也新産之脉緩滑吉實大弦急死來侵凡婦人新産之後其脉來緩滑者為氣血通利調和是生活安吉之兆也若見牢大弦急之脉則凶必死之脉也若得沉重小者吉忽若堅牢命不停若産婦診得沉重微小者此是形虛相應故云吉兆之脉忽然診得堅硬牢實之脉是脉盛形衰相反性命不可停留必死也寸口澀疾不調死若産後寸口脉澀疾大小不調勻者此是血氣衰絶之脉故云死也沉細附骨不絶生若重手按之乃得其脉沉細附著於骨不斷絶有力者此生活之兆也審看此候分明記長須念此向心經凡為醫者宜詳審脉證分明記於心􅎍也愚按前論與脉訣刋誤所云不同觀者審之薛氏醫案卷四十一
