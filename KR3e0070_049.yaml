body:
  text: 薛氏醫案卷四十九眀薛已撰敖氏傷寒金鏡録凡傷寒熱病傳經之邪比雜病不同必辨其脈􅂒舌表裏汗下之庶有不誤况脈者血之府屬隂當其得病之初正氣相搏若真氣未衰脈必滑數而有力病久熱甚氣衰脈必微細而無力方數甚也但可養隂退陽此識脈之要也或初病即惡寒發熱後必有渴水燥熱之證或逆厥而利此熱􅂒傳經之邪也若始終皆熱􅂒惟熱而不惡寒故傷寒為病初則頭痛必無發熱惡寒渴水之症一病便有逆厥泄利或但惡寒而無發熱此寒􅂒也此識􅂒之妙也如舌本者乃心之竅於舌心屬火主熱象離眀人得病初在表則舌自紅而無白胎等色表邪入于半表半裏之間其舌色變為白胎而滑見矣切不可不眀表􅂒故邪傳于裏未罷則舌必見黃胎乃邪已入于胃急宜下之胎黃自去而疾安矣至此醫之不依次悮用湯久失于遲下其胎必黑變􅂒蚌起此為難治若見舌胎如漆黑之光者十無一生此心火自炎與邪熱二火相乘熱極則有兼化水象故色從黑而應水化也若乃臟腑皆受邪毒日深為􅂒必作熱症雖宜下之乃去胃中之熱否則其熱散入絡臟之中鮮有不死者譬如火之自炎初則紅過則薪為黑色炭矣此亢則害承乃制今以前十二舌眀著猶恐未盡諸􅂒復作二十四圖并方治列于左則區區推源尋流實可決生死之妙也清碧學士杜先生著傷寒用藥説夫醫者何猶防之將也凡視人疾在究其淺深之異而療之且疾之襲人若寇之侵境方其至也必瞰其勢之強弱先以安撫次以講和戒嚴守禦以防其返也如堅然不退至再至三恣強肆侮意謀土地當此之際奈何必選將練兵剋期至戰寇滅乃已若倉皇無措則土地陷矣豈非將者不識韜略不知合變以致誤也可勝嘆哉夫今之醫不閲方書不察脈理臨􅂒茫然當解而不解當吐下而不吐下畏首畏尾顛倒錯亂助病日深殊不知醫乃司命其可輕忽如此大抵病之輕淺者即為和解深重者使便攻擊故曰用藥之時膽欲大而心欲小毋使君臣失職佐使不當反嫁疾焉苟能如將之用兵進退合宜操存有法何疾之不愈也余每察脈用藥覺有疑滯幸承先師之誨故始撮其要領以告後人云至正改元一陽吉日永和三仙至人蕭璜鳴書驗證舌法夫人之受病傷寒為甚傷寒之治仲景為詳人皆知之而未必能行之者豈非以其法浩繁有難卒貫者乎舊有敖氏金鏡録一篇専以舌色視病既圖其狀復著其情而後别其方藥開卷昭然一覽具在雖不期乎仲景之書而自悉合乎仲景之道可謂深而通約而要者矣豫昔承乏在留都嘗刻之太醫官舍本皆繪以五采恐其久而色渝因致謬誤乃分注其色于上使人得以意會焉舌舌見白胎滑者邪初入裏也丹田有熱胸中有寒乃少陽半表半裏之證也宜用小柴胡湯梔子豉湯治之小柴胡湯方見後梔子豉湯方見後舌見紅色熱蓄于內也不問何經宜用透頂清神散治之透頂清神散豬牙皂角細辛白芷當歸右為末等分和勻令病人先噙水一口以藥少許吹鼻內吐去水取嚏為度未嚏仍用藥吹入凡瘟疫之家不拘己未患者皆宜用之舌見純紅內有黑形如小舌者乃邪熱結于裏也君火熾盛反兼水化宜涼膈散大柴胡湯下之涼膈散方見後大柴胡湯方見後舌見紅色而有小黑色者熱毒乘虛入胃蓄熱則發癍矣宜用玄參升麻葛根湯化斑湯解之玄參升麻葛根湯即玄參升麻湯加葛根方見後化斑湯即白虎湯加人參方見後舌見淡紅中有大紅星者乃少隂君火熱之盛也所不勝者假火𫝑以侮脾土將欲發黃之候也宜用茵陳五苓散治之茵陳五苓散方見後舌見紅色尖見青黑者水虛火實腎熱所致宜用竹葉石膏湯治之方見後舌見淡紅色而中有一紅暈沿皆純黑乃餘毒遺于心胞絡之間與邪火鬱結二火亢極故有是證也以承氣湯下之方見後舌見紅色更有裂紋如人字形者乃君火燔灼熱毒炎上故發裂也宜用涼膈散涼膈散方見後舌見紅色更有紅點如蟲蝕之狀者乃熱毒熾盛火在上水在下不能相濟故也宜用小承氣湯下之小承氣湯方見後舌見紅色內有乾硬黑色形如小長舌有刺者此熱毒熾甚堅結大腸金受火制不能平木故也急用調胃承氣湯下之調胃承氣湯方見後舌見紅色內有黑紋者乃隂毒厥干肝經肝主筋故舌見如絲形也用理中合四逆湯溫之四逆湯乾薑半兩炮附子一枚去皮生作八片甘草六錢二字半右每服五錢水一鍾煎六分不拘時溫服理中湯服法如前人參甘草炙乾薑炮白术炒舌見黑色水尅火眀矣患此者百無一生治者審之余在留都時地官主事鄭汝東妹壻患傷寒得此舌院內醫士曽禧謂當用附子理中湯人咸驚駭遂止亦莫能療困甚治棺曽與之鄰往視之謂用前藥猶有生理其家既待以死􅍆從之數劑而愈大抵舌黑之症有火極似水者即杜學士所謂薪為黑炭之意也宜涼膈散之類以㵼其陽有水來尅火者即曽醫士所療之人是也宜理中湯以消隂翳又須以老生薑切平擦其舌色稍退者可治堅不退者不可治𢎞治辛酉金臺薑夢輝患傷寒亦得此舌手足厥冷吃逆不止衆醫猶作火治幾致危殆判院吳仁齋用附子理中湯而愈夫醫之為道有是病必有是藥附子療寒其效可數奈何世皆以為必不可用之藥寧視人之死而不救不亦哀哉至于火極似水之症用藥得宜效應不異不可便謂為百無一治而棄之也敖氏傷寒金鏡録圖方舌見尖白根黃其表證末罷也須宜解表然後方可攻之如大便祕者用涼膈散加硝黃泡服小便澀者用五苓散加木通合益元散加薑汁少許以白滚湯調服涼膈散生甘草二兩連翹四兩山梔一兩大黃二兩黃芩薄苛葉朴硝各一兩右每服一兩水二盞淡竹葉二十餘片煎至一盞去柤入生蜜少許熱服以利為度五苓散加茵蔯即茵蔯五苓散澤㵼二錢五分茯苓豬苓白术各一兩五錢桂五錢木通滑石甘草炙各一兩右為末每服五錢入薑汁并蜜各少許白滚湯調下舌見弦白心黑而脈沉微者難治脈浮滑者可汗沉實者可下始病即發此色乃危殆之甚也速進調胃承氣湯下之調胃承氣湯甘草三錢大黃六錢硝二錢右用水一鍾半先煎甘草大黃將熟去柤下􅉭硝再煎三五沸頓熱服舌尖白胎二分根黑一分必有身痛惡寒如飲水不至甚者五苓散自汗渴者白虎湯下利者解毒湯此亦危證也五苓散方見後白虎湯知母一錢五分甘草炙一錢石膏四錢粳米一撮右每服一兩用水一鍾半入糯米先煎下諸味再煎去柤服之加人參亦可解毒湯黃連一兩黃柏五錢黃芩五錢山梔子二十箇右每服五錢水一鍾半煎至一鍾去柤頓熱服舌見白胎中有黑小點亂生者尚有表證其病來之雖惡宜涼膈散微表之表退即當下之下用調胃承氣湯涼膈散方見前調胃承氣湯方見前舌見如灰色中間更有黑暈兩條此熱乘腎與命門也宜急下之服解毒湯下三五次遲則難治如初服量加大黃酒浸泡解毒湯方見後舌見微黃色者初病即得之發讝語者由失汗表邪入裏也必用汗下兼行以雙解散加解毒湯兩停主之雙解散加解毒湯防風川芎當歸芍藥大黃麻黃連翹􅉭硝各半兩石膏黃芩桔梗各一兩滑石三兩甘草二兩荆芥半兩白术山梔各半兩右每服一兩水一鍾半薑三片煎八分服不拘時一云有桂枝二兩舌中見白胎外則微黃者必作泄宜服解毒湯惡寒者五苓散五苓散方見前解毒散方見前舌見微黃色者表證未罷宜用小柴胡湯合天水散主之可下者大柴胡湯下之表裡雙除臨證審用之小柴胡湯柴胡四錢黃芩甘草人參半夏泡各二錢右每服一兩水一鍾半薑三片棗一枚煎一鍾溫服天水散甘草炙一兩桂府滑石六兩右各另為末每服五錢入生薑汁并蜜各少許用白滚湯任意調服如發表用豆䜴蔥頭煎湯調服大柴胡湯柴胡四錢黃芩芍藥各一錢五分半夏大黃二錢五分枳實麩炒二錢右㕮咀每服八錢水一鍾半薑三片棗一枚煎一鍾溫服舌見黃色者必初白胎而變黃色也皆表而傳裏熱已入胃宜急下之若下遲必變黑色為惡證為亢害鬼賊邪氣深也不治宜用調胃承氣湯下之調胃承氣湯方見前舌左白胎而自汗者不可下宜白虎湯加人參三錢服之舌右白胎滑者病在肌肉為邪在半表半裏必往來寒熱宜小柴胡湯和解之小柴胡湯方見前舌左見白胎滑此臟結之證邪併入臟難治舌見四圍白而中黃者必作煩渴嘔吐之證兼有表者五苓散益元散兼服須待黃盡方可下也益元散方見前五苓散方見前舌見黃而有小黑點者邪遍六腑將入五臟也急服調胃承氣湯下之次進和解散十救四五也調胃承氣湯方見前和解散藁本桔梗甘草炙各五錢蒼术三錢陳皮厚朴薑製各一錢右水一鍾半薑三片棗二枚煎七分去查不拘時服舌見黃而尖白者表少裏多宜天水散一服涼膈散二服合進之脈弦者宜防風通聖散天水散方見前涼膈散方見前防風通聖散方見前舌見黃而色有膈瓣者熱已入胃邪毒深矣心火煩渴急宜大承氣湯下之若身發黃者用茵蔯湯下血用抵當湯水在脅內十棗湯結胸甚者大陷胸湯痞用大黃㵼心湯大承氣湯厚朴薑製三錢枳實麩炒二錢大黃三錢芒硝二錢右每服一兩水一鍾半先煎枳實候熟入大黃再煎數沸入芒硝煎三五沸去柤熱服茵蔯湯茵蔯五錢大黃三錢山梔子七枚右每服一兩水一盞半先煎茵蔯半熟次入二味再煎去柤通口熱服抵當湯大黃三錢水蛭糯米炒七個虻蟲炒去羽足七箇右作一服水一盞半煎一鍾去柤通口服十棗湯芫花醋浸炒大戟甘遂煨各等分右每服二錢弱人減半以水一鍾半大棗十枚劈碎煎取八分去柤通口服大陷胸湯大黃七錢芒硝三錢甘遂四分右用水二鍾先煎大黃至一鍾去柤下芒硝煎三五沸再下甘遂沫溫服取利大黃㵼心湯大黃五錢黃連黃芩各三錢五分右作一服水二鍾煎一鍾去柤通口溫服若有宿食痰飲者加半夏麯二錢舌見四邊微紅中央灰黑色者此由失下而致用大承氣湯下之熱退可愈必三四下方退五次下之而不退者不治大承氣湯方見前舌見黃而黑點亂生者其證必渴讝語脈實者生脈澀者死循衣摸床者不治若下之見黑糞亦不治下宜大承氣湯大承氣湯方見前舌見黃中黑至尖者熱氣已深兩感見之十當九死惡寒甚者亦死不惡寒而下利者可治宜用調胃承氣湯主之調胃承氣湯方見前舌見外淡紅心淡黑者如惡風表未罷用雙解加解毒湯相半微汗之汗罷急下之如結胸煩躁目直視者不治非結胸者可治雙解散方見前解毒散方見前舌見灰色尖黃不惡風寒脈浮者可下之若惡風惡寒者用雙解散加解毒湯主之三四下之見糞黑不治雙解散方見前解毒湯方見前舌見灰黑色而有黑紋者脈實急用大承氣湯下之脈浮渴飲水者用涼膈散解之十可救其二三舌根微黑尖黃脈滑者可下之脈浮者當養隂退陽若惡風寒者微汗之用雙解散若下利用解毒湯十生七八也雙解散方見前解毒湯方見前舌根微黑尖黃隱見或有一紋者脈實急用大承氣湯下之脈浮渴飲水者用涼膈散解之十可救其二三已上三十六舌乃傷寒驗證之捷臨證用心處之百無一失薛氏醫案卷四十九
