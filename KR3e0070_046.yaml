body:
  text: 薛氏醫案卷四十六明薛已訂婦人良方産後寒熱方論第一産後發熱頭痛身疼雖如傷寒時氣雖當用麻黄亦不可輕易如早起勞動為寒所傷則淅淅惡寒翕翕發熱頭項肩背骨節皆痛至七八日乃差若大便堅作嘔不能食用小柴胡湯加生薑地黄主之愚按病機要云治胎産之病從厥隂經論之無犯胃氣及上中二焦為之三禁不可汗不可下不可利小便發汗者同傷寒下之早證利大便則脈數而已動於脾利小便則内亡津液胃中枯燥製藥之法能不犯三禁則榮衛自和而寒熱止矣附方人參當歸散治去血過多内熱短氣頭痛悶亂骨節作痛或虚煩咽燥人參當歸生地黄桂心麥門冬去心各一兩白芍藥右粳米一合竹葉十片水二鍾煎一鍾去之入藥五錢棗二枚煎服虚甚用熟地黄小柴胡湯治傷風四肢煩熱頭疼若頭不疼而作煩二物黄芩湯方見二十四卷第二論二物黄芩湯黄芩半兩苦參一兩生地黄二兩右每服四錢水煎增損柴胡湯治虚弱寒熱少食腹脹等症方見勞蓐竹葉防風湯治産後傷風發熱面赤氣喘頭痛淡竹葉半把防風人參桂枝苦梗甘草各半兩葛根一兩五錢右每服五錢薑棗水煎汗出項强加附子嘔加半夏治惡露不盡晝則明了暮則譫語寒熱如見鬼此熱入血室用柴胡地黄湯或四物加柴胡方見六卷十五論産後頭痛方論第二夫頭者諸陽之㑹也産後胃氣虚弱飲食少思陽氣㣲弱不能上升故頭痛若因敗血黒龍丹言之甚詳愚按前症若中氣虚用補中益氣湯加蔓荆子若血虚用四物加參术血氣俱虚用八珍湯若因風寒所傷用補中益氣湯加川芎附治驗一産婦患頭痛日用補中益氣湯不缺已三年矣稍勞則惡寒内熱為陽氣虚以前湯加附子一錢數劑不發一婦人産後頭痛面青二年矣日服四物等藥余謂腎水不能生肝木而血虚用六味丸加五味子兩月而痊芎附散治氣虚頭痛用大附子一枚去皮臍切四片拌釅醋一碗炙附蘸盡同川芎一兩為末毎服二錢清茶調服治血虚頭疼當歸川芎毎服五錢水煎産後頭痛都梁丸亦可治方見四卷第六論附方補中益氣湯四物湯二方見二十四卷第六論八珍湯方見二十四卷第四論六味丸方見二十四卷第十一論産後咳嗽方論第三夫肺主於氣産後肺氣虚故外邪感而咳嗽所由作也若食鹽醯之類而致者難治若因麵積滯而致者服黒神散五積散可愈愚按前症若隂血虚四物湯加參术陳皮桔梗肺氣虚四君加芎歸桔梗隂火上炎六味地黄丸加參术風寒所感補中益氣湯加桔梗紫蘇若瘀血入肺發喘兼口鼻起黒或鼻出血急用二味參蘇飲亦有得生者然而所患悉因胃氣不足葢胃為五臓之根本胃氣一虚五臓失所百病生焉經云肺屬辛金生於已土脾土既虚不能生金則腠理不密外邪易感矣治當壯土金生腎水以制火為善附治驗一産婦朝吐痰夜發熱無寐泥用清痰降火之藥肌體日瘦飲食日少余曰朝間吐痰脾氣虚也夜間發熱肝血虚也晝夜無寐脾血耗也遂用六君子湯加味逍遥散加味歸脾湯以次調補不月而痊一産婦咳嗽見風則喘急惡寒頭痛自汗口禁痰盛余謂脾肺氣虚腠理不密用補中益氣加肉桂數劑而安一産婦咳嗽聲重鼻塞流涕此風寒所感余用參蘇飲一鍾頓愈與補中益氣加桔梗茯苓半夏一劑將痊又與六君黄茋以實腠理全愈一産婦咳嗽痰盛面赤口乾内熱晡熱徹作無時此隂火上炎余用補中益氣湯六味地黄丸而愈一産婦咳而腹滿不食涕唾面腫氣逆此病在胃而關於肺用異功散而愈知母散治惡露上攻咳嗽不已知母貝母白茯苓人參各五錢桃仁杏仁並生去皮尖各一兩右每服五錢水煎治風寒咳嗽甘草桔梗各六分欵冬花四分麥門冬生地黄各一錢二分葱白一握右水煎服旋覆花湯治咳嗽最良方見下有汗者去麻黄附方異功散治脾胃虚弱飲食少思或久患咳嗽或腹滿不食面浮氣逆等症人參白术炒甘草炒茯苓陳皮各一錢右薑棗水煎服六君子湯四物湯四君子湯補中益氣湯四方見二十四卷第六論六味丸方見二十四卷第十一論二味參蘇飲方見後參蘇飲方見六卷第十一論産後喉中氣急喘促方論第四産後喉中氣急喘促因榮血暴竭衛氣無主獨聚于肺名曰孤陽最為難治若因敗血停凝服奪命丹若因榮血暴絶服芎藭湯若因風寒所傷服旋覆花湯若因氣鬱結服小調經散若因傷飲食服見現丸愚按前症若脾肺氣虚弱用六君桔梗若兼外邪更加紫蘇若中氣虚寒用補中益氣加炮薑肉桂若陽氣虚脱更加附子若瘀血入肺急用二味參蘇飲附治驗一産婦喘促自汗手足俱冷常以手䕶臍腹此陽氣虚脫用參附湯四劑而愈二味參蘇飲治産後血入於肺面黑發喘欲死者人參一兩蘇木二兩右水煎頓服旋覆花湯治傷風寒暑濕喘嗽太盛坐卧不寜旋覆花赤芍藥前胡半夏麯荆芥穗甘草茯苓五味子杏仁麻黄各等分右每服四錢薑棗水煎有汗者莫服五味子湯治産後喘促脈伏而厥五味子杵炒人參杏仁各二錢麥門冬去心陳皮各一錢右薑三片棗二枚水煎服芎藭湯方見後附方六君子湯補中益氣湯二方見二十四卷第六論參附湯方見十八卷第六論産後口鼻黑鼻衂方論第五産後口鼻起黑氣及鼻衂者葢陽明經脈之海起於鼻交額中還出頬口交人中左之右右之左此産後氣虚榮血散亂胃絶肺敗之症也急取緋線一條并産婦頂心髪兩條緊繫中指節更無藥可療愚按胃脈侠口繞承漿葢鼻凖屬脾土鼻孔屬肺金誠胃虚肺損氣脱血死之症急用二味參蘇飲加附子五錢亦有得生者方見前産後咳噫方論第六夫肺主於氣而稟於胃葢産後脾胃傷損風冷所搏故咳噫也急灸期門三壯必愈此穴乃胃之大絡穴見六卷第十五論愚按前症屬胃氣虚寒之惡候如用後方未應急投參附湯亦有復生者方見十八卷第六論丁香散治心煩咳噫丁香白荳蔲各五錢伏龍肝一兩右為末煎桃仁吴茱茰湯毎服一錢調下羌活散治咳逆羌活附子炮茴香炒各半兩木香白薑炮各一錢右為末每服二錢水一盞鹽一捻煎服一方用桂心五錢薑汁三合水煎服産後血崩方論第七産後血崩因經脈未復而勞傷或食酸鹹之味若小腹滿痛肝經已傷最為難治急服固經丸主之愚按前症若血滯小腹脹滿用失笑散血少小腹虚痞芎藭湯肝火血妄行加味逍遥散脾鬱不統血加味歸脾湯脾氣虚不攝血補中益氣湯厚味積熱傷血清胃㪚加槐花風熱相搏傷血四君子防風枳殻附治驗一産婦血崩小腹脹痛用破氣行血之劑其崩如湧四肢不收惡寒嘔吐大便頻㵼余用人參炮黑薑四劑稍愈又十全大補三十餘劑而痊一産婦血崩因怒其血如湧仆地口禁目斜手足抽搐此肝經血耗生風余用六味丸料一劑諸症悉退但食少晡熱佐以四君柴胡牡丹皮而愈固經丸艾葉赤石脂煅補骨脂炒木賊各半兩附子一箇炮右為末飯丸桐子大每服二十丸温酒或米飲下芎藭湯芎藭當歸芍藥各等分右每服五錢氷煎附方失笑散方見二十卷第五論十全大補湯加味逍遥散加味歸脾湯三方見二十四卷第四論補中益氣湯六君子湯四君子湯三方見二十四卷第六論清胃散方見二十四卷首論六味丸方見二十四卷第十二論産後月水不調方論第八産後月水不調由血氣虚損風邪所客邪正相搏以致經候失期或多或少而不得其平也愚按前症若過期而作痛者氣血俱虚也八珍加柴胡丹皮不及期而来血熱也四物山梔柴胡將来而作痛血實也四物加桃仁紅花過期而来者血虚也四物加參术紫黑成塊者血熱也四物加炒梔炒連丹皮作痛而色淡者痰多也四物合二陳治當臨症制宜附治驗一産婦月經不調内熱燥渇服寒凉之劑其血如崩腹脹寒熱作嘔少食用六君子二十餘劑諸病悉愈以加味逍遥散調理而安琥珀散治經脈不調飲食少思日漸消瘦琥珀牛膝生地黄當歸各一兩桃仁赤芍藥各半兩右每服五錢水薑煎附方八珍湯加味逍遥散二方見二十四卷第四論四物湯六君子湯二方見二十四卷第六論二陳湯方見二十四卷第五論産後月水不通方論第九産後乳子周嵗而經不行是其常也若半歲而經行此血有餘也若一二歲不行而無疾不必服藥若肢體倦怠食少内熱是血少也宜健脾胃以藥通之則誤矣愚按前症脾胃虚弱用六君子湯若兼鬱火傷脾用歸脾湯加牡丹皮山梔若怒火傷血宜用四物合小柴胡氣血俱虚用八珍牡丹皮仍㕘前論主之附治驗方藥一産婦月經年餘不通内熱晡熱服分氣丸經行不止惡寒作渇食少倦怠胷滿氣壅朝用加味逍遥散夕用四君子湯月許諸症稍愈佐以八珍湯兼服兩月而愈六君子湯四物湯四君子湯三方見二十四卷第六論歸脾湯加味逍遥散八珍湯三方見二十四卷第四論小柴胡湯方見二十四卷第二論産後四肢浮腫方論第十産後四肢浮腫者乃敗血乗虚流注宜用小調經散陳無擇云若風邪所乗於氣分皮膚腫而浮虚乃氣也若皮膚腫如熟李乃水也葢氣腫者宜發汗水腫者宜利小便愚按前症若寒水侮土宜養脾肺若氣虚浮腫宜益脾胃若水氣浮腫宜補中氣當㕘第一卷水分血分主治附治驗一産婦飲食少思服消導之劑四肢浮腫余謂中氣不足朝用補中益氣湯夕用六君子湯而愈後因怒腹脹誤服沈香化氣丸吐㵼不止飲食不進小便不利肚腹四肢浮腫用金匱加减腎氣丸而愈一産婦泄㵼四肢面目浮腫喘促惡寒余謂脾肺虚寒用六君加薑桂而泄㵼愈又補中益氣而脾胃徤小調經散没藥琥珀桂心芍藥當歸各一錢右為末每服五分薑汁温酒調大調經散最治腫滿喘急煩渇小便不利方見二十一卷第三論漢防已散治水腫漢防已猪苓枳殻麩炒桑白皮各一兩商陸甘草各三錢右毎服四錢水煎治血虚氣腫水腫澤蘭葉防已等分右為末每服二錢温酒調下醋湯亦可金匱加减腎氣丸治脾腎虚寒腰重脚腫濕飲留積小便不利或肚腹腫脹四肢浮腫氣喘痰甚或已成水症其效如神白茯苓二兩附子半兩川牛膝肉桂澤㵼車前子山茱茰山藥牡丹皮各一兩熟地黄四兩搯碎酒拌杵膏右為末和地黄膏煉蜜丸桐子大毎服七八十丸空心米飲下附方補中益氣湯六君子湯二方見二十四卷第六論産後腹痛㵼利方論第十一産後腹痛㵼利因膓胃虚怯寒邪乗襲或水榖不化洞泄腸鳴或手足逆冷用調中湯治之陳無擇云若六淫七情而致者當隨所感而治之愚按前症若胸膈飽脹或惡食吞酸此飲食停滯用六君枳實山查以消導若食既消而仍痛更或頭痛熱渇惡寒欲嘔此中氣被傷用補中益氣半夏茯苓以健脾胃附治驗一産婦腹痛發熱惡食余以為飲食傷脾彼反服破血之劑加寒熱頭痛嘔吐涎沫用化痰理氣四肢逆冷泄㵼下墜余用六君加炮薑肉桂木香再用補中益氣湯而愈一産婦腹痛後重去痢無度形體倦怠飲食不甘唇腫盗汗竟夜不寐此脾經虚熱之症用當歸六黄湯内黄芩連栢炒黑一劑汗止乃用歸脾八珍兼服而愈調中湯良薑當歸桂心芍藥附子炒川芎各一兩甘草炒五錢右每服三錢水煎服附方六君子湯補中益氣湯二方見二十四卷第六論當歸六黄湯方見十九卷第六論歸脾湯八珍湯二方見二十四卷第四論産後赤白痢方論第十二産後痢疾因飲食六淫七情傷於脾胃或血滲大腸皆為難治若飲食不進謂之虚痢氣宇不順謂之氣痢治法熱則凉之冷則温之冷熱相摶則温凉調之滑者澁之虚者補之水榖不分者分利之性情執滯者和順之未有不安者也愚按前症白屬氣分而赤屬血分也若米食所傷用六君加榖蘖若麫食所傷用六君加麥蘖若肉食所傷用六君加山查神麯凡兼嘔吐俱加藿香若兼嚥酸或嘔吐用前藥送越鞠丸若肝木尅脾土用六君加柴胡炮薑若寒水反来侮土用錢氏益黄散若久㵼或元氣下陷兼補中益氣湯以升發陽氣若㵼痢色黄乃脾土真氣宜加木香肉豆蔲若屬脾土虚寒用六君加木香薑桂若脾腎虚寒用補中益氣及四神丸若屬命門火衰而脾土虚寒用八味丸以補圡母若小便濇滯肢體漸腫或兼喘咳用金匱腎氣丸以補脾腎利水道若胃氣虚弱而四肢浮腫須補胃為主若久而不愈是腎氣虧損也必用四神六味八味三藥以補足三隂若用分利導水之劑是虚其虚也一産婦泄痢腹痛年餘形體骨立内熱晡熱自汗盗汗口舌糜爛日吐痰三碗許脈洪大重按全無此命門火衰脾土虚寒而不能攝痰歸源用八味丸補火以生土用補中益氣湯兼補肺金而痊一産婦食雞子腹中作痛面色青黄服平胃二陳更下痢腹脹用流氣飲子又小腹一塊不時上攻飲食愈少此脾胃虚寒肝木尅侮所致用補中益氣加木香吴茱漸愈又用八珍大補兼服調理尋愈五味子散治産後泄㵼或腎泄在侵晨五更作㵼飲食不進或大便不實不時去後為丸尤效五味子炒三兩吴茱茰炒五錢右為末毎服二錢白湯調四神丸治脾胃虚弱大便不實飲食不思二神丸二方見八卷第八論六君子湯補中益氣湯二方見二十四卷第八論香連丸方見八卷第八論八味丸六味丸二方見二十四卷第十一論金匱腎氣丸方見前八珍湯方見二十四卷第四論薛氏醫案卷四十六
